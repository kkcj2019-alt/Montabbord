<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Espace employé — Montabbord</title>
<style>
  :root{--blue:#c2410c;--red:#d71920;--gold:#ffe0c7;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(1100px 600px at 8% 8%, #ffd9b8 0%, transparent 55%),radial-gradient(900px 520px at 92% 92%, #c2410c 0%, transparent 55%),#9a3412;font-family:Arial,Helvetica,sans-serif;color:var(--ink);font-size:14px;position:relative;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:42px 42px;pointer-events:none;z-index:0}
  body::after{content:'';position:fixed;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,26,.20),transparent 65%);top:-120px;right:-100px;filter:blur(18px);pointer-events:none;z-index:0;animation:mdbFloat 12s ease-in-out infinite}
  @keyframes mdbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(26px)}}
  /* Logo entreprise en filigrane : respiration, balayage de lumière et éclats. */
  #empBgLogo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
  #empBgLogo>img{width:min(74vmin,560px);height:min(74vmin,560px);object-fit:contain;opacity:.08;filter:brightness(1.7) saturate(.9);animation:empBgLogoBreath 7s ease-in-out infinite;transform-origin:center;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 36%,transparent 70%);mask-image:radial-gradient(circle at 50% 50%,#000 36%,transparent 70%)}
  @keyframes empBgLogoBreath{0%,100%{opacity:.05;transform:scale(.97);filter:brightness(1.35) saturate(.8)}50%{opacity:.17;transform:scale(1.04);filter:brightness(2.2) saturate(1.1)}}
  #empBgLogo .empBgSweep{position:absolute;inset:-25%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.09) 50%,rgba(255,122,26,.10) 54%,transparent 62%);transform:translateX(-70%);animation:empBgSweep 7.5s ease-in-out infinite}
  @keyframes empBgSweep{0%{transform:translateX(-75%)}55%,100%{transform:translateX(75%)}}
  #empBgLogo .empSpark{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffcfa8;box-shadow:0 0 10px 3px rgba(255,122,26,.55);opacity:0;animation:empSpark 4s ease-in-out infinite}
  #empBgLogo .s1{left:27%;top:26%;animation-delay:0s}
  #empBgLogo .s2{left:68%;top:20%;animation-delay:.9s}
  #empBgLogo .s3{left:32%;top:64%;animation-delay:1.8s}
  #empBgLogo .s4{left:72%;top:69%;animation-delay:2.7s}
  #empBgLogo .s5{left:52%;top:14%;animation-delay:3.3s}
  @keyframes empSpark{0%,100%{opacity:0;transform:scale(.4)}45%{opacity:.95;transform:scale(1.35)}70%{opacity:0;transform:scale(.7)}}
  @keyframes mdbFadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
  @keyframes mdbBrandShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  button{font-family:inherit}
  .top{background:linear-gradient(120deg,#c2410c,#f2620a 55%,#e85d00);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 6px 22px rgba(120,53,15,.35);position:relative;z-index:3}
  .top img{max-height:42px;max-width:150px;object-fit:contain;background:#fff;border-radius:6px;padding:3px}
  .top .brand{font-size:16px;font-weight:900;letter-spacing:.02em}
  .top .sub{font-size:11px;color:#cbd5e1}
  .top .who{margin-left:auto;text-align:right;font-size:12px;line-height:1.4}
  .top .who b{display:block;color:var(--gold)}
  .top .topLogo{cursor:pointer}
  .top .topAvatar{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.65);padding:0;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.16);color:#fff;font-weight:900;font-size:13px;cursor:pointer;flex:0 0 auto}
  .top .topAvatar img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center;animation:empAvatarBreath 3.4s ease-in-out infinite}
  @keyframes empAvatarBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
  @keyframes empAvatarGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,122,26,0)}50%{box-shadow:0 0 0 5px rgba(255,122,26,.24)}}
  .top .topAvatar{animation:empAvatarGlow 3.4s ease-in-out infinite}
  @media(prefers-reduced-motion:reduce){.top .topAvatar,.top .topAvatar img{animation:none!important}}
  .top .topAvatar:active{transform:scale(.95)}
  .top .topMain{width:38px;height:38px;border-radius:11px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;transition:background .18s ease,transform .18s ease}
  .top .topMain:hover{background:rgba(255,255,255,.28);transform:translateY(-1px)}
  .top .topMain:active{transform:scale(.94)}
  @media(max-width:640px){.top .topMain{width:34px;height:34px;border-radius:10px}}
    .top .topTools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
  .top .topTools .topMois{margin-left:0}
  @media(max-width:640px){
    .top .topTools{width:100%;margin-left:0;margin-top:2px;justify-content:space-between;gap:8px}
    .top .topTools .topMois{flex:1 1 auto;min-width:0;margin:0;justify-content:flex-start}
    .top .topTools .topMain{order:2}
    .top .topTools .topAvatar{order:3}
  }
.topMois{display:inline-flex;align-items:center;gap:6px;margin-left:auto;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:4px 9px;font-size:12px;font-weight:800;color:#fff;max-width:100%}
  .topMois span{font-size:13px;line-height:1}
  .topMois select{background:transparent;border:none;outline:none;color:#fff;font-weight:800;font-size:12px;font-family:inherit;max-width:160px;cursor:pointer}
  .topMois select option{color:#0f172a;background:#fff}
  @media(max-width:640px){
    .top{padding:10px 12px;gap:8px;align-items:center}
    .top img{max-height:38px;max-width:104px}
    .top .brand{font-size:14px}
    .top .sub{font-size:10px}
    .top .topBrand{min-width:0;flex:1}
    .top .topAvatar{width:34px;height:34px;order:2}
    .top .topRefresh{order:3;margin-left:0}
    .topMois{order:4;flex:0 0 auto;margin-left:0;margin-top:2px;padding:4px 9px;background:rgba(255,255,255,.1)}
    .topMois select{width:auto;max-width:132px;font-size:13px;text-align:left}
    .topMois select option{font-size:13px}
  }
  .top button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:7px 11px;font-weight:700;cursor:pointer}
  .wrap{max-width:1240px;margin:0 auto;padding:18px;position:relative;z-index:1}
  /* Mode connexion : logo + texte en haut, carte de connexion centrée */
  body.login-mode{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:26px 18px;overflow-y:auto}
  body.login-mode #app{width:100%;max-width:1180px;padding:0;margin:0;display:flex;flex-direction:column;align-items:center}
  .loginHero{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:760px;margin:0 0 20px;position:relative;z-index:1;animation:mdbFadeUp .5s ease both}
  .loginHeroLogo{max-width:200px;max-height:88px;object-fit:contain;background:#fff;border-radius:14px;padding:9px 16px;box-shadow:0 16px 40px rgba(0,0,0,.42);margin-bottom:14px}
  .loginHeroSlogan{font-size:22px;line-height:1.35;color:#ffe0c7;font-weight:900;letter-spacing:.01em}
  .loginHeroText{font-size:12.5px;color:#cbd5e1;line-height:1.65;margin-top:10px;max-width:640px}
  .loginCard{width:100%;max-width:560px;background:#fff;border-radius:20px;padding:26px 34px;box-shadow:0 30px 80px rgba(0,0,0,.45),0 2px 0 rgba(255,255,255,.06) inset;border:1px solid rgba(255,255,255,.16);position:relative;z-index:1;animation:mdbFadeUp .6s ease both}
  .loginCard .loginForm{padding:0}
  .loginCard h2{text-align:left}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(15,23,42,.05);animation:mdbFadeUp .45s ease both}
  /* Bandeau d'accueil de l'espace employé */
  .empHero{position:relative;overflow:hidden;border-radius:18px;padding:22px 26px;margin-bottom:16px;background:linear-gradient(120deg,#c2410c,#ff8a33 55%,#ff7a1a);color:#fff;box-shadow:0 18px 44px rgba(120,53,15,.45);animation:mdbFadeUp .5s ease both}
  .empHero:before{content:'';position:absolute;inset:0;background:radial-gradient(420px 220px at 88% 15%,rgba(255,122,26,.22),transparent 65%);pointer-events:none}
  .empHero:after{content:'';position:absolute;top:-60%;left:-40%;width:45%;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);transform:rotate(14deg);animation:mdbShine 7s linear infinite;pointer-events:none}
  @keyframes mdbShine{0%{left:-60%}100%{left:140%}}
  .empHero .row1{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;position:relative;z-index:1}
  .empHero .hello{font-size:22px;font-weight:900;letter-spacing:.01em}
  .empHero .role{font-size:12px;color:#cbd5e1;margin-top:4px}
  .empHero .date{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:800;color:#fff;white-space:nowrap}
  .empHero .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1}
  .empHero .chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px 12px;font-size:11.5px;color:#e2e8f0;line-height:1.35}
  .empHero .chip b{display:block;color:#ffe0c7;font-size:14px;margin-top:2px}
  .empHero .whoRow{display:flex;align-items:center;gap:14px}
  .heroAvatar{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.55);background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.28);flex-shrink:0}
  .heroAvatar.ini{display:flex;align-items:center;justify-content:center;font-weight:900;color:#c2410c;font-size:20px;background:#e2e8f0}
  .moisBar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 12px;margin-bottom:12px;color:#e2e8f0;font-size:12px;font-weight:700}
  .moisBar .lab{font-weight:800;color:#fff}
  .moisBar select{width:auto;min-width:170px;padding:7px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.35);background:#fff;color:#c2410c;font-weight:800;font-size:12px}
  .moisBar .note{font-size:10.5px;color:#cbd5e1;font-weight:600}
  .profGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .profGrid .it{background:#f8fafc;border:1px solid #eef2f7;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;color:#0f172a}
  .profGrid .it b{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;font-weight:900;margin-bottom:3px}
  .ficheOk{background:#f0fdf4;border:1px solid #bbf7d0;border-left:4px solid #16a34a;border-radius:9px;padding:9px 11px;margin:6px 0 2px;font-size:11.5px;line-height:1.5}
  .ficheOk .t{font-weight:900;color:#166534}
  .ficheOk .m{color:#334155;margin-top:2px}
  .topAvatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.45);background:#fff;flex-shrink:0}
  .topAvatar.ini{display:flex;align-items:center;justify-content:center;font-weight:900;color:#c2410c;font-size:13px;background:#e2e8f0}
  .topUser{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  .topUser .who{margin-left:0;min-width:0}
  .topUser .btnLogout{flex-shrink:0;width:34px;height:34px;padding:0!important;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.14)!important;border:1px solid rgba(255,255,255,.42)!important;color:#fff!important}
  .topUser .btnLogout:hover{background:rgba(220,38,38,.9)!important;border-color:#dc2626!important}
  .topRefresh{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.42);color:#fff;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .topRefresh:hover{background:rgba(255,255,255,.26)}
  .topRefresh.spin{animation:mdbSpin .7s linear infinite}
  @keyframes mdbSpin{to{transform:rotate(360deg)}}
  .topBack{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.42);color:#fff;text-decoration:none;border-radius:999px;padding:7px 12px;font-size:11.5px;font-weight:800;flex-shrink:0}
  .topBack:hover{background:rgba(255,255,255,.26)}
  @media(max-width:560px){.topBack span{display:none}.topBack{padding:7px 10px}}
  h2{margin:0 0 4px;font-size:19px}
  h3{margin:0 0 10px;font-size:15px;color:var(--blue)}
  .muted{color:var(--muted)}
  .small{font-size:11.5px}
  .loginWrap{max-width:1180px;min-height:520px;margin:0 auto;display:grid;grid-template-columns:0.9fr 1.1fr;border-radius:22px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.45),0 2px 0 rgba(255,255,255,.06) inset;background:#fff;border:1px solid rgba(255,255,255,.16);animation:mdbFadeUp .55s ease both;position:relative;z-index:1}
  .loginBrand{background:linear-gradient(135deg,#c2410c,#ff8a33 50%,#c94f00);background-size:200% 200%;animation:mdbBrandShift 14s ease infinite;color:#fff;padding:34px 36px 28px;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;position:relative;overflow:hidden}
  .loginBrand:before{content:'';position:absolute;inset:0;background:radial-gradient(360px 260px at 80% 15%,rgba(255,122,26,.16),transparent 65%);pointer-events:none}
  .loginBrand:after{content:'';position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,122,26,.10);right:-80px;bottom:-80px;pointer-events:none}
  .loginBrand img{max-width:190px;max-height:88px;object-fit:contain;background:#fff;border-radius:10px;padding:6px;margin:0 0 22px;position:relative;z-index:1}
  .loginBrand .fullname{font-size:11px;color:#cbd5e1;margin-top:auto;padding-top:16px;position:relative;z-index:1}
  .loginBrand .slogan{font-size:19px;line-height:1.45;color:#ffe0c7;font-weight:800;margin:0;position:relative;z-index:1}
  .loginBrand .sub{font-size:11.5px;color:#cbd5e1;margin-top:14px;line-height:1.6;position:relative;z-index:1}
  .loginForm{padding:40px 48px;display:flex;flex-direction:column;justify-content:center}
  .loginForm h2{margin:0 0 2px;font-size:21px;color:#c2410c}
  .loginForm .intro{color:#64748b;font-size:12px;margin-bottom:14px;line-height:1.5}
  .loginForm .foot{margin-top:14px;text-align:center;font-size:10.5px;color:#94a3b8}
  @media(max-width:900px){.loginForm{padding:26px}.loginCard{padding:22px 18px}body.login-mode{padding:14px}.loginHero{margin-bottom:14px}.loginHeroLogo{max-width:160px;max-height:70px}.loginHeroSlogan{font-size:18px}.loginHeroText{font-size:12px}}
  .login{max-width:430px;margin:26px auto 0}
  .login h2{text-align:center}
  .login .intro{text-align:center;color:var(--muted);font-size:12px;margin-bottom:16px}
  label{display:block;font-size:11.5px;font-weight:800;color:#334155;margin:10px 0 4px}
  input,select,textarea{width:100%;padding:10px 11px;border:1.5px solid #cbd5e1;border-radius:9px;font-size:14px;background:#fff;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(232,93,0,.12)}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:9px;padding:11px 16px;font-weight:800;font-size:14px;cursor:pointer;transition:transform .12s,background .15s,box-shadow .15s}
  .btn:hover{background:#c94f00;transform:translateY(-1px);box-shadow:0 6px 16px rgba(232,93,0,.22)}
  .btn.green{background:#15803d}.btn.green:hover{background:#166534}
  .btn.red{background:#b91c1c}.btn.red:hover{background:#991b1b}
  .btn.gray{background:#475569}.btn.gray:hover{background:#334155}
  .btn.out{background:#fff;color:#334155;border:1.5px solid #cbd5e1}
  .btn.out:hover{background:#f8fafc}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.sm{padding:6px 10px;font-size:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1;min-width:150px}
  .full{width:100%}
  .err{color:#b91c1c;font-size:12.5px;font-weight:700;min-height:18px;margin-top:8px}
  .ok{color:#15803d;font-size:12.5px;font-weight:700;min-height:18px;margin-top:8px}
  .bulletin{background:#f8fafc;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:9px;padding:10px 12px;font-size:12px;margin-bottom:12px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);padding:6px;border-radius:14px;backdrop-filter:blur(6px)}
  .tabs button{background:transparent;border:none;border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:800;color:#cbd5e1;cursor:pointer;transition:background .18s,color .18s,transform .18s,box-shadow .18s}
  .tabs button:hover{background:rgba(255,255,255,.12);color:#fff}
  .tabs button.on{background:linear-gradient(135deg,#ffe0c7,#ffcfa8);color:#c2410c;box-shadow:0 6px 16px rgba(255,122,26,.35);transform:translateY(-1px)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .kpi{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px 13px 18px;overflow:hidden;transition:transform .18s,box-shadow .18s;animation:mdbFadeUp .5s ease both}
  .kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k,#c2410c)}
  .kpi:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(15,23,42,.16)}
  .kpi .ic{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--kb,#fff4ec)}
  .kpi .v{font-size:20px;font-weight:900;color:var(--k,#c2410c);margin-top:3px;padding-right:34px}
  .kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.05em;padding-right:34px}
  .kpi .s{font-size:11px;color:var(--muted);margin-top:4px}
  table{width:100%;border-collapse:collapse}
  body.mdb-silent *{animation:none!important;transition:none!important}
  /* ===== Barre latérale espace employé ===== */
  .empLayout{display:grid;grid-template-columns:222px minmax(0,1fr);gap:16px;align-items:start}
  .empMain{min-width:0}
  .empSide{position:sticky;top:12px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:12px;box-shadow:0 10px 30px rgba(120,53,15,.18)}
  .empSide .sideCard{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 4px 12px;border-bottom:1px solid #eef2f7;margin-bottom:8px}
  .empSide .sideCard img,.empSide .sideCard .ini{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #e2e8f0;background:#fff4ec;color:#c2410c;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;overflow:hidden;margin-bottom:6px}
  .empSide .sideCard img{transform-origin:center;animation:empSideBreath 4s ease-in-out infinite}
  @keyframes empSideBreath{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,122,26,0)}50%{transform:scale(1.06);box-shadow:0 0 0 5px rgba(255,122,26,.13)}}
  @media(prefers-reduced-motion:reduce){.empSide .sideCard img{animation:none!important}}
  .empSide .sideName{font-weight:900;font-size:13px;color:#0f172a;line-height:1.2}
  .empSide .sideRole{font-size:11px;color:#64748b;margin-top:2px}
  .empSide .sidePhoto{width:100%;border:1px solid #cbd5e1;background:#f8fafc;border-radius:9px;padding:7px;font-size:11.5px;font-weight:800;color:#334155;cursor:pointer;margin-bottom:8px}

<script>
(function () {
  /* Même serveur que la page (montabbord.pages.dev) : c'est lui qui est mis à jour
     automatiquement. Le serveur « workers.dev » n'est pas republié à chaque changement,
     il gardait l'ancienne version du pointage QR. */
  var API = (/\.pages\.dev$/i.test(location.hostname) || location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? location.origin + "/api/portail" : "https://montabbord-api.kkcj2019.workers.dev/api/portail";
  var SYNC = "https://montabbord-api.kkcj2019.workers.dev/api/sync";
  var uid = "";
  try { uid = new URLSearchParams(location.search).get("uid") || ""; } catch (e) {}
  var qtoken = "";
  try { qtoken = new URLSearchParams(location.search).get("token") || ""; } catch (e) {}
  var state = { token: "", emp: null, data: null, tab: "accueil", choices: [], bulletin: null, openReq: null, unread: 0, mois: "", photo: "", fiche: null };

  function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function money(n) { n = parseFloat(n) || 0; try { return n.toLocaleString("fr-FR") + " F"; } catch (e) { return n + " F"; } }
  function fmtDate(d) { if (!d) return "-"; try { return new Date(String(d).slice(0,10) + "T00:00:00").toLocaleDateString("fr-FR"); } catch (e) { return d; } }
  function fmtDateTime(d) { if (!d) return "-"; try { return new Date(d).toLocaleString("fr-FR"); } catch (e) { return d; } }
  function moisCourt(m) {
    try {
      var d = new Date(String(m) + "-01T00:00:00");
      return d.toLocaleDateString("fr-FR", { month: "short", year: "numeric" });
    } catch (e) { return m; }
  }
  function moisLbl(m) { try { var d = new Date(String(m) + "-01T00:00:00"); return d.toLocaleDateString("fr-FR", { month: "long", year: "numeric" }); } catch (e) { return m; } }
  function post(action, payload) {
    return fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ uid: uid, action: action, token: state.token }, payload || {})) })
      .then(function (r) { return r.json().catch(function () { return { ok: false, code: "http" }; }); });
  }
  function getKey(cle) {
    return fetch(SYNC + "?uid=" + encodeURIComponent(uid) + "&cle=" + encodeURIComponent(cle) + "&t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { var v = j && j.data && j.data[cle]; if (typeof v === "string") { try { v = JSON.parse(v); } catch (e) { v = null; } } return v; })
      .catch(function () { return null; });
  }
  function el(id) { return document.getElementById(id); }
  function logoSrc(ent) { return ent && ent.logo ? ent.logo : "logo-512.png?v=21"; }

  /* ---------------- En-tête ---------------- */
  function showEmpWelcome() {
    try {
      var e = state.emp || {};
      var nom = ((e.nom || '') + ' ' + (e.prenoms || '')).trim();
      var photo = state.photo || e.photo || '';
      var ent = state.ent || {};
      var ov = document.createElement('div');
      ov.id = 'empWelcome';
      ov.style.cssText = 'position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 520px at 15% 10%,rgba(255,122,26,.35),transparent 60%),linear-gradient(150deg,#9a3412,#c2410c 55%,#ff7a1a);color:#fff;animation:mdbFadeUp .4s ease both';
      ov.innerHTML = '<div class="empWCard">'
        + '<div class="empWPhotoWrap">'
        +   '<span class="empWWave"></span><span class="empWWave w2"></span><span class="empWWave w3"></span>'
        +   (photo
              ? '<div class="empWPhoto"><img src="' + esc(photo) + '" alt=""></div>'
              : '<div class="empWPhoto empWIni">' + esc(initiales(e)) + '</div>')
        +   '<div class="empWLogo"><img src="' + esc(logoSrc(ent)) + '" alt=""><span class="empWShine"></span></div>'
        + '</div>'
        + '<div class="empWHello">Bienvenue</div>'
        + '<div class="empWName">' + esc(nom || '') + '</div>'
        + '<div class="empWLine"></div>'
        + '<div class="empWSub">Votre espace est pr\u00eat</div>'
        + '</div>';
      document.body.appendChild(ov);
      setTimeout(function () {
        try { ov.style.transition = 'opacity .6s'; ov.style.opacity = '0'; } catch (eO) {}
        setTimeout(function () { try { ov.remove(); } catch (eR) {} }, 650);
      }, 5200);
    } catch (e) {}
  }
  function _empBgLogo() {
    var src = logoSrc(state.ent || {});
    var bg = document.getElementById('empBgLogo');
    if (!bg) {
      bg = document.createElement('div');
      bg.id = 'empBgLogo';
      document.body.insertBefore(bg, document.body.firstChild);
    }
    bg.innerHTML = '<img src="' + esc(src) + '" alt="">'
      + '<span class="empBgSweep"></span>'
      + '<span class="empSpark s1"></span><span class="empSpark s2"></span><span class="empSpark s3"></span><span class="empSpark s4"></span><span class="empSpark s5"></span>';
  }
  function renderTop() {
    var ent = state.ent || {};
    var t = el("top");
    document.body.classList.remove("login-mode");
    var e = state.emp;
    t.classList.remove("hidden");
    try { _empBgLogo(); } catch (eBg) {}
    var aut = (state.data && state.data.moiAutorises) || [];

      var opts = aut.map(function (m) {
        return '<option value="' + esc(m) + '"' + (state.mois === m ? ' selected' : '') + '>' + esc(moisCourt(m)) + '</option>';

    }

    var maPhoto = state.photo || monProfil.photo || '';
    var avatarTop = '<button class="topAvatar" onclick="window.__toggleEmpSide()" title="Ouvrir le menu" aria-label="Ouvrir le menu">'
      + (maPhoto ? '<img src="' + esc(maPhoto) + '" alt="">' : '<span>' + esc(initiales(monProfil)) + '</span>')
      + '</button>';
    var _appPrincipale = false;
    try { _appPrincipale = !!(localStorage.getItem('mdb_currentUser') && (window.opener || (window.parent && window.parent !== window) || /[?&]admin=/.test(location.search))); } catch (eAp) {}
    t.innerHTML = '<img class="topLogo" src="' + esc(logoSrc(ent)) + '" alt="logo" role="button" title="Accueil" style="cursor:pointer" onclick="window.__tab(\'accueil\')">'
      + '<div class="topBrand"><div class="brand">' + esc(ent.nom || "Montabbord") + '</div><div class="sub">Espace employ\u00e9</div></div>'
      + '<div class="topTools">'
      + moisHtml

      + avatarTop
      + '</div>';
  }
  function loginHero() {
    var ent = state.ent || {};
    var sigle = ent.sigle || 'ACSER';
    var logo = ent.logo || 'logo-512.png?v=21';
    return '<div class="loginHero">'
      + '<img class="loginHeroLogo" src="' + esc(logo) + '" alt="logo ' + esc(sigle) + '">'
      + '<div class="loginHeroSlogan">Votre travail fait la différence.<br>Ensemble, construisons l’avenir.</div>'
      + '<div class="loginHeroText">Votre espace personnel sécurisé pour consulter votre pointage, vos bulletins de paie et vos acomptes, et suivre l’avancement de vos demandes. Vos informations restent strictement confidentielles.</div>'
      + '<ul class="loginFeats">'
      + '<li><span>🕒</span><div><b>Mon pointage</b><small>Heures et présences du mois</small></div></li>'
      + '<li><span>📄</span><div><b>Mes bulletins</b><small>Consulter et valider la réception</small></div></li>'
      + '<li><span>💬</span><div><b>Mes demandes</b><small>Congé, permission, acompte, prêt</small></div></li>'
      + '</ul>'
      + '</div>';
  }
  function renderLogin() {
    el("top").classList.add("hidden");
    document.body.classList.add("login-mode");
    var b = state.bulletin;
    var h = loginHero() + '<div class="loginCard"><div class="loginForm">';
    h += '<h2>Bienvenue 👋</h2><div class="intro">Connectez-vous à votre espace employé.</div>';
        if (b) {
      h += '<div class="bulletin" id="bulValid">'
        + '<b>Bulletin ' + esc(moisLbl(b.mois)) + '</b> — Net à payer' + (b.netAvantSolde != null ? ' (avant solde)' : '') + ' <b>' + money(b.netAvantSolde != null ? b.netAvantSolde : b.net) + '</b><br>'
        + '<span class="muted">Employé : ' + esc(b.nom || "") + ' · Matricule ' + esc(b.matricule || "") + '</span>'
        + '<div id="bl-valid" style="display:none">'
        + '<div id="bl-valid-title" style="margin-top:10px;font-size:12px;font-weight:800;color:#c2410c">Valider la réception avec votre code PIN</div>'
        + '<div class="row" style="margin-top:6px;align-items:flex-end"><div><label>Code PIN</label><input id="bl-pin" type="password" inputmode="numeric" maxlength="8" placeholder="Votre code PIN"></div>'
        + '<div style="flex:0 0 auto"><button class="btn" onclick="window.__validerBulletin()">Valider la réception</button></div></div>'
        + '<div class="err" id="bl-err"></div></div>'

        + '<div class="small muted">Par défaut : le mois en cours. L’administration confirmera la caisse ou la banque de paiement.</div>';
    } else if (t === "pointage") {
      x.innerHTML = '<div class="row"><div><label>Date concernée</label><input type="date" id="rq-date-pointage"></div>'
        + '<div><label>Correction demandée</label><select id="rq-correction"><option value="present">Me marquer présent</option><option value="heures">Corriger les heures</option><option value="autre">Autre correction</option></select></div></div>'
        + '<div class="row"><div><label>Heures jour (si correction)</label><input type="number" min="0" step="0.5" id="rq-hj"></div><div><label>Heures nuit</label><input type="number" min="0" step="0.5" id="rq-hn"></div></div>'
        + '<div class="small muted">Le service paie vérifiera et corrigera le pointage après validation.</div>';
    } else x.innerHTML = '';
  };
  window.__closePop = function () { el("pop").classList.add("hidden"); el("pop").innerHTML = ""; };
  window.__sendReq = function () {
    var g = function (id) { return (el(id) || {}).value || ""; };
    var t = g("rq-type");
    var msg = g("rq-message").trim();
    if (!msg) { el("rq-err").textContent = "Écrivez un message."; return; }
    var payload = { type: t, sujet: g("rq-sujet"), message: msg, dateDebut: g("rq-debut"), dateFin: g("rq-fin"), dureeJours: parseFloat(g("rq-jours")) || 0, motif: g("rq-motif"), retourEstime: g("rq-fin"), montant: parseFloat(g("rq-montant")) || 0, moisDeduction: g("rq-mois"), datePointage: g("rq-date-pointage"), correction: g("rq-correction"), heuresJour: parseFloat(g("rq-hj")) || 0, heuresNuit: parseFloat(g("rq-hn")) || 0 };
    post("request", payload).then(function (j) {
      if (j && j.ok) { window.__closePop(); loadData(); }
      else el("rq-err").textContent = "Envoi impossible. Réessayez.";
    });
  };

  function currentMonth() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }

  /* Plus d'actualisation automatique : elle faisait sauter la page.
     Un bouton 🔄 dans la barre du haut actualise à la demande. */
  window.__refreshEspace = function () {
    try {
      var b = document.querySelector('.topRefresh');
      if (b) { b.classList.add('spin'); setTimeout(function () { try { b.classList.remove('spin'); } catch (eS) {} }, 800); }
    } catch (eB) {}
    try { loadData(true); } catch (e) {}
  };

  /* ---------------- Démarrage ---------------- */
  function boot() {
    if (!uid) { document.body.classList.add("login-mode"); el("app").innerHTML = '<div class="card login"><h2>Lien incomplet</h2><div class="intro">Ouvrez cette page depuis le QR de votre bulletin ou demandez le lien au service paie.</div></div>'; return; }
    var tok = "";
    try { tok = sessionStorage.getItem("mdb_portail_token") || ""; } catch (e) {}
    /* On attend le nom/logo de l'entreprise AVANT le premier rendu :
       sinon le logo par défaut apparaît une fraction de seconde. */
    /* SÉCURITÉ : seulement le nom et le logo de l'entreprise (avant : tout le
       dossier entreprise), et seulement CE bulletin (avant : toute la paie). */
    var _base = API.replace(/\/api\/portail$/, "");
    var entReady = fetch(_base + "/api/espace", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ uid: uid, action: "entreprise" }) })
      .then(function (r) { return r.json(); }).then(function (j) {
        state.ent = (j && j.ok && j.ent) || {};
        return state.ent;
      }).catch(function () { state.ent = {}; return state.ent; });
    if (qtoken) {
      Promise.all([
        entReady,
        fetch(SYNC.replace("https://montabbord-api.kkcj2019.workers.dev", _base) + "?uid=" + encodeURIComponent(uid) + "&verif=" + encodeURIComponent(qtoken) + "&t=" + Date.now(), { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
      ]).then(function (res) {
        var b = (res[1] && res[1].bulletin && res[1].rec) ? res[1].rec : null;
        state.bulletin = b;
        if (tok) { state.token = tok; loadData(); } else renderLogin();
      });
    } else {
      entReady.then(function () {
        if (tok) { state.token = tok; loadData(); } else renderLogin();
      });
    }
  }
  boot();
})();
</script>
</body>
</html>
