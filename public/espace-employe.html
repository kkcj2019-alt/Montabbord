<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Mon espace employé — Montabbord</title>
<style>
  :root{--blue:#0b3a6f;--red:#d71920;--gold:#ecc95f;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);font-size:14px}
  button{font-family:inherit}
  .top{background:var(--blue);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .top img{max-height:42px;max-width:150px;object-fit:contain;background:#fff;border-radius:6px;padding:3px}
  .top .brand{font-size:16px;font-weight:900;letter-spacing:.02em}
  .top .sub{font-size:11px;color:#cbd5e1}
  .top .who{margin-left:auto;text-align:right;font-size:12px;line-height:1.4}
  .top .who b{display:block;color:var(--gold)}
  .top button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:7px 11px;font-weight:700;cursor:pointer}
  .wrap{max-width:1000px;margin:0 auto;padding:18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(15,23,42,.04)}
  h2{margin:0 0 4px;font-size:19px}
  h3{margin:0 0 10px;font-size:15px;color:var(--blue)}
  .muted{color:var(--muted)}
  .small{font-size:11.5px}
  .login{max-width:430px;margin:26px auto 0}
  .login h2{text-align:center}
  .login .intro{text-align:center;color:var(--muted);font-size:12px;margin-bottom:16px}
  label{display:block;font-size:11.5px;font-weight:800;color:#334155;margin:10px 0 4px}
  input,select,textarea{width:100%;padding:10px 11px;border:1.5px solid #cbd5e1;border-radius:9px;font-size:14px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:9px;padding:11px 16px;font-weight:800;font-size:14px;cursor:pointer}
  .btn:hover{background:#0a2f5a}
  .btn.green{background:#15803d}.btn.green:hover{background:#166534}
  .btn.red{background:#b91c1c}.btn.red:hover{background:#991b1b}
  .btn.gray{background:#475569}.btn.gray:hover{background:#334155}
  .btn.out{background:#fff;color:#334155;border:1.5px solid #cbd5e1}
  .btn.out:hover{background:#f8fafc}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.sm{padding:6px 10px;font-size:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1;min-width:150px}
  .full{width:100%}
  .err{color:#b91c1c;font-size:12.5px;font-weight:700;min-height:18px;margin-top:8px}
  .ok{color:#15803d;font-size:12.5px;font-weight:700;min-height:18px;margin-top:8px}
  .bulletin{background:#f8fafc;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:9px;padding:10px 12px;font-size:12px;margin-bottom:12px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tabs button{background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:800;color:#475569;cursor:pointer}
  .tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi .v{font-size:20px;font-weight:900;color:var(--blue);margin-top:3px}
  .kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.04em}
  .kpi .s{font-size:11px;color:var(--muted);margin-top:4px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 9px;border-bottom:1px solid #eef2f7;text-align:left;font-size:12.5px}
  th{background:#f8fafc;color:#475569;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
  td.r,th.r{text-align:right}
  .badge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:800}
  .b-ok{background:#dcfce7;color:#166534}.b-wait{background:#fef3c7;color:#92400e}.b-bad{background:#fee2e2;color:#b91c1c}.b-info{background:#e0f2fe;color:#075985}.b-gray{background:#f1f5f9;color:#475569}
  .req{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px;cursor:pointer;background:#fff}
  .req:hover{border-color:#93c5fd;background:#f8fbff}
  .req .t{font-weight:800;font-size:13px}.req .m{font-size:11.5px;color:var(--muted);margin-top:2px}
  .thread{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:6px 2px;margin:8px 0}
  .msg{max-width:86%;padding:8px 11px;border-radius:11px;font-size:12.5px;line-height:1.5;white-space:pre-wrap}
  .msg.emp{align-self:flex-start;background:#eef6ff;border:1px solid #bfdbfe}
  .msg.rh{align-self:flex-end;background:#f0fdf4;border:1px solid #bbf7d0}
  .msg .who{font-size:10px;font-weight:800;color:#64748b;margin-bottom:2px}
  .msg .at{font-size:9.5px;color:#94a3b8;margin-top:3px;text-align:right}
  .empty{padding:20px;text-align:center;color:#94a3b8;font-size:12.5px}
  .hidden{display:none!important}
  .pop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
  .pop .box{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:18px}
  .pop .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .pop .head h3{margin:0}
  .pop .x{border:none;background:#f1f5f9;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;color:#64748b}
  @media (max-width:560px){.wrap{padding:12px}.card{padding:13px}.top .who{width:100%;text-align:left;margin-left:0}}
</style>
</head>
<body>
<div id="top" class="top hidden"></div>
<div id="app" class="wrap"></div>
<div id="pop" class="pop hidden"></div>
<script>
(function () {
  var API = "https://montabbord-api.kkcj2019.workers.dev/api/portail";
  var SYNC = "https://montabbord-api.kkcj2019.workers.dev/api/sync";
  var uid = "";
  try { uid = new URLSearchParams(location.search).get("uid") || ""; } catch (e) {}
  var qtoken = "";
  try { qtoken = new URLSearchParams(location.search).get("token") || ""; } catch (e) {}
  var state = { token: "", emp: null, data: null, tab: "accueil", choices: [], bulletin: null, openReq: null, unread: 0 };

  function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function money(n) { n = parseFloat(n) || 0; try { return n.toLocaleString("fr-FR") + " F"; } catch (e) { return n + " F"; } }
  function fmtDate(d) { if (!d) return "-"; try { return new Date(String(d).slice(0,10) + "T00:00:00").toLocaleDateString("fr-FR"); } catch (e) { return d; } }
  function fmtDateTime(d) { if (!d) return "-"; try { return new Date(d).toLocaleString("fr-FR"); } catch (e) { return d; } }
  function moisLbl(m) { try { var d = new Date(String(m) + "-01T00:00:00"); return d.toLocaleDateString("fr-FR", { month: "long", year: "numeric" }); } catch (e) { return m; } }
  function post(action, payload) {
    return fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ uid: uid, action: action, token: state.token }, payload || {})) })
      .then(function (r) { return r.json().catch(function () { return { ok: false, code: "http" }; }); });
  }
  function getKey(cle) {
    return fetch(SYNC + "?uid=" + encodeURIComponent(uid) + "&cle=" + encodeURIComponent(cle) + "&t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { var v = j && j.data && j.data[cle]; if (typeof v === "string") { try { v = JSON.parse(v); } catch (e) { v = null; } } return v; })
      .catch(function () { return null; });
  }
  function el(id) { return document.getElementById(id); }
  function logoSrc(ent) { return ent && ent.logo ? ent.logo : "logo-512.png"; }

  /* ---------------- En-tête ---------------- */
  function renderTop() {
    var ent = state.ent || {};
    var t = el("top");
    var e = state.emp;
    t.classList.remove("hidden");
    t.innerHTML = '<img src="' + esc(logoSrc(ent)) + '" alt="logo">'
      + '<div><div class="brand">' + esc(ent.nom || "Montabbord") + '</div><div class="sub">Mon espace employé</div></div>'
      + (e ? '<div class="who"><b>' + esc(((e.nom || "") + " " + (e.prenoms || "")).trim()) + '</b>'
        + esc(e.matricule || "") + (e.fonction ? " · " + esc(e.fonction) : "")
        + '</div><button onclick="window.__logout()">Déconnexion</button>'
        : '');
  }
  function renderLogin() {
    el("top").classList.add("hidden");
    var b = state.bulletin;
    var h = '<div class="card login">';
    h += '<h2>Mon espace employé</h2><div class="intro">Connectez-vous avec votre nom, votre matricule ou votre numéro de téléphone, puis votre code PIN.</div>';
    if (b) {
      h += '<div class="bulletin"><b>Bulletin ' + esc(moisLbl(b.mois)) + '</b> — Net à payer <b>' + money(b.net) + '</b><br>'
        + '<span class="muted">Employé : ' + esc(b.nom || "") + ' · Matricule ' + esc(b.matricule || "") + '</span><br>'
        + '<a href="verif.html?uid=' + encodeURIComponent(uid) + '&token=' + encodeURIComponent(b.token || qtoken) + '" style="font-size:11px;color:#0b3a6f;font-weight:700">Vérifier l’authenticité du bulletin</a></div>';
    }
    h += '<label>Nom, matricule ou téléphone</label>'
      + '<input id="lg-login" list="lg-choices" autocomplete="off" placeholder="Ex : KANGA, 01, 0707..." value="' + esc(b && b.matricule ? b.matricule : "") + '">'
      + '<datalist id="lg-choices"></datalist>'
      + '<label>Code PIN / mot de passe</label>'
      + '<input id="lg-pin" type="password" inputmode="numeric" maxlength="12" autocomplete="current-password" placeholder="Votre code PIN">'
      + '<div style="height:12px"></div><button class="btn full" id="lg-btn" onclick="window.__login()">Se connecter</button>'
      + '<div class="err" id="lg-err"></div>'
      + '<div style="text-align:center;margin-top:12px"><a href="#" onclick="event.preventDefault();window.__showRegister()" style="font-size:12.5px;font-weight:800;color:#0b3a6f">Créer mon compte employé</a></div>'
      + '<div class="small muted" style="margin-top:8px;text-align:center">Seul le personnel déjà enregistré peut créer un compte.</div>';
    h += '</div>';
    el("app").innerHTML = h;
    var inp = el("lg-login");
    var timer = null;
    inp.addEventListener("input", function () {
      clearTimeout(timer);
      var q = inp.value.trim();
      if (q.length < 2) return;
      timer = setTimeout(function () {
        post("suggest", { q: q }).then(function (j) {
          state.choices = (j && j.choices) || [];
          var dl = el("lg-choices");
          if (dl) dl.innerHTML = state.choices.map(function (c) { return '<option value="' + esc(c.matricule || c.nom) + '">' + esc(((c.nom || "") + " " + (c.prenoms || "")).trim()) + '</option>'; }).join("");
        });
      }, 280);
    });
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") window.__login(); });
    el("lg-pin").addEventListener("keydown", function (e) { if (e.key === "Enter") window.__login(); });
    if (b && b.matricule) setTimeout(function () { el("lg-pin").focus(); }, 150);
  }

  window.__login = function () {
    var login = (el("lg-login") || {}).value || "";
    var pin = (el("lg-pin") || {}).value || "";
    var err = el("lg-err");
    if (!login.trim() || !pin.trim()) { err.textContent = "Saisissez votre identifiant et votre PIN."; return; }
    var btn = el("lg-btn"); btn.disabled = true; err.textContent = "Connexion…";
    post("login", { login: login.trim(), pin: pin.trim() }).then(function (j) {
      btn.disabled = false;
      if (!j || !j.ok) {
        if (j && j.code === "ambiguous") {
          err.innerHTML = "Plusieurs employés correspondent. Choisissez :<br>" + (j.choices || []).map(function (c) {
            return '<button class="btn out sm" style="margin:4px 3px 0 0" onclick="window.__pick(\'' + esc(c.matricule || c.id) + '\')">' + esc(((c.nom || "") + " " + (c.prenoms || "")).trim()) + ' · ' + esc(c.matricule || "") + '</button>';
          }).join("");
          return;
        }
        if (j && j.code === "no_access") err.textContent = "Aucun accès n’a encore été créé. Contactez le service paie.";
        else if (j && j.code === "bad_pin") err.textContent = "Code PIN incorrect.";
        else if (j && j.code === "not_personnel") err.textContent = "Vous n’êtes pas dans la liste du personnel. Création de compte impossible.";
        else if (j && j.code === "inactive") err.textContent = "Compte inactif. Contactez le service paie.";
        else err.textContent = "Connexion impossible. Réessayez.";
        return;
      }
      state.token = j.token; state.emp = j.employe;
      try { sessionStorage.setItem("mdb_portail_token", j.token); sessionStorage.setItem("mdb_portail_uid", uid); } catch (e) {}
      loadData();
    }).catch(function () { btn.disabled = false; err.textContent = "Connexion impossible. Vérifiez Internet."; });
  };
  window.__pick = function (v) { el("lg-login").value = v; window.__login(); };
  function renderRegister() {
    el("top").classList.add("hidden");
    var b = state.bulletin;
    var h = '<div class="card login">';
    h += '<h2>Créer mon compte</h2><div class="intro">Réservé au personnel déjà enregistré. Utilisez votre matricule, votre téléphone et votre date de naissance.</div>';
    if (b) h += '<div class="bulletin"><b>Bulletin ' + esc(moisLbl(b.mois)) + '</b> — ' + esc(b.nom || "") + ' · ' + esc(b.matricule || "") + '</div>';
    h += '<label>Nom, matricule ou téléphone</label><input id="rg-login" autocomplete="off" value="' + esc(b && b.matricule ? b.matricule : "") + '" placeholder="Ex : KANGA, 01, 0707...">';
    h += '<label>Téléphone (vérification)</label><input id="rg-tel" inputmode="tel" placeholder="Le téléphone enregistré dans votre fiche">';
    h += '<label>Date de naissance</label><input type="date" id="rg-dob">';
    h += '<label>Choisissez un code PIN</label><input id="rg-pin" type="password" inputmode="numeric" maxlength="8" placeholder="4 à 8 chiffres">';
    h += '<label>Confirmez le PIN</label><input id="rg-pin2" type="password" inputmode="numeric" maxlength="8" placeholder="Répétez le PIN">';
    h += '<div style="height:12px"></div><button class="btn full green" id="rg-btn" onclick="window.__register()">Créer mon compte</button>';
    h += '<div class="err" id="rg-err"></div>';
    h += '<div style="text-align:center;margin-top:10px"><a href="#" onclick="event.preventDefault();window.__showLogin()" style="font-size:12.5px;font-weight:800;color:#0b3a6f">J’ai déjà un compte</a></div>';
    h += '</div>';
    el("app").innerHTML = h;
  }
  window.__showRegister = function () { renderRegister(); };
  window.__showLogin = function () { renderLogin(); };
  window.__register = function () {
    var login = (el("rg-login") || {}).value || "";
    var tel = (el("rg-tel") || {}).value || "";
    var dob = (el("rg-dob") || {}).value || "";
    var pin = (el("rg-pin") || {}).value || "";
    var pin2 = (el("rg-pin2") || {}).value || "";
    var err = el("rg-err");
    if (!login.trim()) { err.textContent = "Saisissez votre nom, matricule ou téléphone."; return; }
    if (!/^\d{4,8}$/.test(pin)) { err.textContent = "Le PIN doit contenir 4 à 8 chiffres."; return; }
    if (pin !== pin2) { err.textContent = "Les deux PIN ne correspondent pas."; return; }
    if (!tel.trim() && !dob) { err.textContent = "Saisissez votre téléphone ou votre date de naissance pour vérification."; return; }
    var btn = el("rg-btn"); btn.disabled = true; err.textContent = "Création du compte…";
    post("register", { login: login.trim(), telephone: tel.trim(), dateNaissance: dob, pin: pin }).then(function (j) {
      btn.disabled = false;
      if (!j || !j.ok) {
        if (j && j.code === "ambiguous") {
          err.innerHTML = "Plusieurs employés correspondent. Choisissez :<br>" + (j.choices || []).map(function (c) {
            return '<button class="btn out sm" style="margin:4px 3px 0 0" onclick="window.__pickRegister(\'' + esc(c.matricule || c.id) + '\')">' + esc(((c.nom || "") + " " + (c.prenoms || "")).trim()) + ' · ' + esc(c.matricule || "") + '</button>';
          }).join("");
          return;
        }
        if (j && j.code === "already") err.textContent = "Un compte existe déjà pour cet employé. Utilisez « J’ai déjà un compte ».";
        else if (j && j.code === "identity") err.textContent = "Téléphone ou date de naissance incorrecte. Vérifiez vos informations ou contactez le service paie.";
        else if (j && j.code === "identity_missing") err.textContent = "Aucun téléphone ni date de naissance dans votre fiche. Contactez le service paie pour créer votre accès.";
        else if (j && j.code === "not_personnel") err.textContent = "Vous n’êtes pas dans la liste du personnel. Création de compte impossible.";
        else if (j && j.code === "inactive") err.textContent = "Compte inactif. Contactez le service paie.";
        else if (j && j.code === "bad_format") err.textContent = "Le PIN doit contenir 4 à 8 chiffres.";
        else err.textContent = "Création impossible. Réessayez.";
        return;
      }
      state.token = j.token; state.emp = j.employe;
      try { sessionStorage.setItem("mdb_portail_token", j.token); sessionStorage.setItem("mdb_portail_uid", uid); } catch (e) {}
      loadData();
    }).catch(function () { btn.disabled = false; err.textContent = "Création impossible. Vérifiez Internet."; });
  };
  window.__pickRegister = function (v) { var e = el("rg-login"); if (e) e.value = v; window.__register(); };
  window.__logout = function () {
    state.token = ""; state.emp = null; state.data = null;
    try { sessionStorage.removeItem("mdb_portail_token"); } catch (e) {}
    renderLogin();
  };

  function loadData() {
    el("app").innerHTML = '<div class="card"><div class="empty">Chargement de votre espace…</div></div>';
    post("data", {}).then(function (j) {
      if (!j || !j.ok) { window.__logout(); return; }
      state.data = j; state.emp = j.employe;
      renderTop(); renderApp();
    }).catch(function () { el("app").innerHTML = '<div class="card"><div class="empty">Connexion au serveur impossible.</div></div>'; });
  }

  function renderApp() {
    var d = state.data || {};
    var tabs = [["accueil","🏠 Accueil"],["pointage","🕒 Pointage"],["paie","💴 Paie"],["acomptes","💳 Acomptes & dettes"],["requetes","💬 Requêtes" + (state.unread ? " (" + state.unread + ")" : "")]];
    var h = '<div class="tabs">' + tabs.map(function (t) { return '<button class="' + (state.tab === t[0] ? "on" : "") + '" onclick="window.__tab(\'' + t[0] + '\')">' + t[1] + '</button>'; }).join("") + '</div>';
    h += '<div id="tabBody">' + tabHtml() + '</div>';
    el("app").innerHTML = h;
  }
  window.__tab = function (t) { state.tab = t; state.openReq = null; renderApp(); if (t === "requetes") markAllRead(); };

  function tabHtml() {
    if (state.tab === "pointage") return tabPointage();
    if (state.tab === "paie") return tabPaie();
    if (state.tab === "acomptes") return tabAcomptes();
    if (state.tab === "requetes") return tabRequetes();
    return tabAccueil();
  }

  function tabAccueil() {
    var d = state.data || {}, e = d.employe || state.emp || {};
    var pts = d.pointage || [], nowM = currentMonth();
    var moisPts = pts.filter(function (p) { return String(p.date || "").slice(0, 7) === nowM; });
    var jours = moisPts.filter(function (p) { return p.present === true || (parseFloat(p.h_j_manual) || 0) > 0 || (parseFloat(p.h_n_manual) || 0) > 0; }).length;
    var heures = moisPts.reduce(function (s, p) { return s + (parseFloat(p.h_j_manual) || 0) + (parseFloat(p.h_n_manual) || 0); }, 0);
    var dernBul = (d.bulletins || []).slice().sort(function (a, b) { return String(b.mois).localeCompare(String(a.mois)); })[0];
    var dette = (d.acomptes || []).reduce(function (s, a) {
      var m = parseFloat(a.montant) || 0, r = parseFloat(a.montantRembourse) || 0;
      return s + Math.max(0, m - r);
    }, 0);
    var base = parseFloat(e.salaire_base) || 0;
    var tauxH = base > 0 ? base / 173.33 : 0;
    var est = tauxH > 0 ? heures * tauxH : 0;
    var h = '<div class="grid">';
    h += '<div class="kpi"><div class="l">Mois en cours</div><div class="v">' + esc(moisLbl(nowM)) + '</div><div class="s">' + esc(e.fonction || "") + '</div></div>';
    h += '<div class="kpi"><div class="l">Jours pointés</div><div class="v">' + jours + '</div><div class="s">' + (Math.round(heures * 100) / 100) + ' h payées</div></div>';
    h += '<div class="kpi"><div class="l">Salaire estimé (pointage)</div><div class="v">' + (est > 0 ? money(est) : "—") + '</div><div class="s">' + (tauxH > 0 ? 'Base horaire ' + money(tauxH) : 'Salaire de base non renseigné') + '</div></div>';
    h += '<div class="kpi"><div class="l">Dernier bulletin</div><div class="v">' + (dernBul ? money(dernBul.net) : "—") + '</div><div class="s">' + (dernBul ? esc(moisLbl(dernBul.mois)) : "Aucun bulletin") + '</div></div>';
    h += '<div class="kpi"><div class="l">Dettes en cours</div><div class="v">' + money(dette) + '</div><div class="s">Acomptes et prêts</div></div>';
    h += '</div>';
    h += '<div class="card" style="margin-top:14px"><h3>Mon profil</h3><div class="row small">'
      + '<div><b>Matricule</b><br>' + esc(e.matricule || "-") + '</div>'
      + '<div><b>Téléphone</b><br>' + esc(e.telephone || "-") + '</div>'
      + '<div><b>Service</b><br>' + esc(e.service || "-") + '</div>'
      + '<div><b>Contrat</b><br>' + esc(e.type_contrat || "-") + '</div></div></div>';
    return h;
  }

  function tabPointage() {
    var pts = (state.data && state.data.pointage) || [];
    var byM = {};
    pts.forEach(function (p) { var m = String(p.date || "").slice(0, 7); if (!m) return; (byM[m] = byM[m] || []).push(p); });
    var ms = Object.keys(byM).sort().reverse();
    if (!ms.length) return '<div class="card"><div class="empty">Aucun pointage sur les mois autorisés.</div></div>';
    var h = '';
    ms.forEach(function (m) {
      var rows = byM[m].slice().sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
      var jours = 0, heures = 0, abs = 0;
      rows.forEach(function (p) {
        var hh = (parseFloat(p.h_j_manual) || 0) + (parseFloat(p.h_n_manual) || 0);
        if (hh > 0 || p.present === true) jours++;
        if (p.present === false) abs++;
        heures += hh;
      });
      h += '<div class="card"><h3>' + esc(moisLbl(m)) + '</h3><div class="small muted" style="margin-bottom:8px">' + jours + ' jour(s) pointé(s) · ' + abs + ' absence(s) · ' + (Math.round(heures * 100) / 100) + ' h payées</div>';
      h += '<table><thead><tr><th>Date</th><th>Présence</th><th class="r">Heures jour</th><th class="r">Heures nuit</th><th>Motif</th></tr></thead><tbody>';
      rows.forEach(function (p) {
        var ok = p.present === true || (parseFloat(p.h_j_manual) || 0) > 0 || (parseFloat(p.h_n_manual) || 0) > 0;
        h += '<tr><td>' + esc(fmtDate(p.date)) + '</td><td>' + (ok ? '<span class="badge b-ok">Présent</span>' : '<span class="badge b-bad">Absent</span>') + '</td>'
          + '<td class="r">' + (parseFloat(p.h_j_manual) || 0) + '</td><td class="r">' + (parseFloat(p.h_n_manual) || 0) + '</td>'
          + '<td>' + esc(p.motif || "-") + '</td></tr>';
      });
      h += '</tbody></table></div>';
    });
    return h;
  }

  function tabPaie() {
    var buls = (state.data && state.data.bulletins) || [];
    buls = buls.slice().sort(function (a, b) { return String(b.mois).localeCompare(String(a.mois)); });
    if (!buls.length) return '<div class="card"><div class="empty">Aucun bulletin enregistré sur les mois autorisés.</div></div>';
    var h = '<div class="card"><h3>Mes bulletins</h3><table><thead><tr><th>Mois</th><th class="r">Brut</th><th class="r">Net</th><th></th></tr></thead><tbody>';
    buls.forEach(function (b) {
      h += '<tr><td>' + esc(moisLbl(b.mois)) + '</td><td class="r">' + money(b.brut) + '</td><td class="r"><b>' + money(b.net) + '</b></td>'
        + '<td class="r"><a class="btn out sm" href="verif.html?uid=' + encodeURIComponent(uid) + '&token=' + encodeURIComponent(b.token) + '" target="_blank">Voir</a></td></tr>';
    });
    h += '</tbody></table><div class="small muted" style="margin-top:8px">Seuls les mois autorisés par l’administration sont affichés.</div></div>';
    return h;
  }

  function tabAcomptes() {
    var list = (state.data && state.data.acomptes) || [];
    if (!list.length) return '<div class="card"><div class="empty">Aucun acompte ou prêt enregistré.</div></div>';
    list.sort(function (a, b) { return String(b.date || "").localeCompare(String(a.date || "")); });
    var h = '<div class="card"><h3>Mes acomptes, prêts et dettes</h3><table><thead><tr><th>Date</th><th>Type</th><th class="r">Montant</th><th class="r">Remboursé</th><th class="r">Reste</th><th>Déduction</th></tr></thead><tbody>';
    list.forEach(function (a) {
      var m = parseFloat(a.montant) || 0, r = parseFloat(a.montantRembourse) || 0;
      var type = a.type === "pret" ? "Prêt" : a.type === "solde" ? "Solde" : "Acompte";
      h += '<tr><td>' + esc(fmtDate(a.date)) + '</td><td>' + type + '</td><td class="r">' + money(m) + '</td><td class="r">' + money(r) + '</td><td class="r"><b>' + money(Math.max(0, m - r)) + '</b></td><td>' + esc(a.moisDeduction ? moisLbl(a.moisDeduction) : "-") + '</td></tr>';
    });
    h += '</tbody></table></div>';
    return h;
  }

  function statutBadge(s) {
    if (s === "acceptee") return '<span class="badge b-ok">Acceptée</span>';
    if (s === "refusee") return '<span class="badge b-bad">Refusée</span>';
    if (s === "en_cours") return '<span class="badge b-info">En cours</span>';
    if (s === "fermee") return '<span class="badge b-gray">Fermée</span>';
    return '<span class="badge b-wait">Ouverte</span>';
  }
  function typeLabel(t) {
    return { reclamation: "Réclamation", permission: "Permission / absence", conge: "Congé", pret: "Prêt", acompte: "Acompte", pointage: "Contestation de pointage", autre: "Autre" }[t] || "Demande";
  }
  function tabRequetes() {
    var reqs = (state.data && state.data.requetes) || [];
    reqs = reqs.slice().sort(function (a, b) { return String(b.updatedAt || b.createdAt).localeCompare(String(a.updatedAt || a.createdAt)); });
    if (state.openReq) return threadHtml(reqs.filter(function (r) { return r.id === state.openReq; })[0]);
    var h = '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">'
      + '<h3 style="margin:0">Mes requêtes</h3><button class="btn green sm" onclick="window.__newReq()">+ Nouvelle requête</button></div>';
    if (!reqs.length) h += '<div class="empty">Aucune requête pour le moment. Vous pouvez écrire au service paie ou aux RH.</div>';
    reqs.forEach(function (r) {
      var last = (r.messages || [])[(r.messages || []).length - 1] || {};
      h += '<div class="req" onclick="window.__openReq(\'' + esc(r.id) + '\')"><div class="t">' + esc(typeLabel(r.type)) + (r.sujet ? " — " + esc(r.sujet) : "") + '</div>'
        + '<div class="m">' + statutBadge(r.statut) + ' · ' + esc(fmtDateTime(r.updatedAt || r.createdAt)) + '</div>'
        + '<div class="m" style="color:#334155;margin-top:4px">' + esc(String(last.texte || r.message || "").slice(0, 120)) + '</div></div>';
    });
    h += '</div>';
    return h;
  }
  function threadHtml(r) {
    if (!r) { state.openReq = null; return tabRequetes(); }
    var h = '<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">'
      + '<div><h3 style="margin:0">' + esc(typeLabel(r.type)) + (r.sujet ? " — " + esc(r.sujet) : "") + '</h3>'
      + '<div class="small muted">' + statutBadge(r.statut) + ' · ouverte le ' + esc(fmtDateTime(r.createdAt)) + '</div></div>'
      + '<button class="btn out sm" onclick="window.__backReq()">← Retour</button></div>';
    if (r.type === 'permission' || r.type === 'conge') {
      h += '<div class="small muted" style="margin-top:8px">Du ' + esc(fmtDate(r.dateDebut)) + ' au ' + esc(fmtDate(r.dateFin)) + (r.dureeJours ? ' · ' + r.dureeJours + ' jour(s)' : '') + (r.retourEstime ? ' · retour estimé ' + esc(fmtDate(r.retourEstime)) : '') + (r.motif ? '<br>Motif : ' + esc(r.motif) : '') + '</div>';
    }
    if (r.type === 'pret' || r.type === 'acompte') {
      h += '<div class="small muted" style="margin-top:8px">Montant demandé : <b>' + money(r.montant) + '</b>' + (r.moisDeduction ? ' · déduction souhaitée : ' + esc(moisLbl(r.moisDeduction)) : '') + '</div>';
    }
    if (r.type === 'pointage') {
      h += '<div class="small muted" style="margin-top:8px">Date contestée : <b>' + esc(fmtDate(r.datePointage)) + '</b>'
        + (r.correction === 'heures' ? ' · heures demandées : ' + (r.heuresJour || 0) + ' h jour / ' + (r.heuresNuit || 0) + ' h nuit' : r.correction === 'present' ? ' · demande : être marqué présent' : ' · autre correction') + '</div>';
    }
    h += '<div class="thread">';
    (r.messages || []).forEach(function (m) {
      var emp = m.auteur === 'employe';
      h += '<div class="msg ' + (emp ? 'emp' : 'rh') + '"><div class="who">' + esc(emp ? "Moi" : (m.nom || "Administration")) + '</div>' + esc(m.texte) + '<div class="at">' + esc(fmtDateTime(m.at)) + '</div></div>';
    });
    h += '</div>';
    if (r.statut !== 'fermee') {
      h += '<div class="row" style="margin-top:6px"><textarea id="rep-texte" rows="2" placeholder="Votre message…" style="min-height:44px"></textarea>'
        + '<button class="btn sm" style="max-width:120px" onclick="window.__reply(\'' + esc(r.id) + '\')">Envoyer</button></div>';
    }
    h += '</div>';
    return h;
  }
  window.__openReq = function (id) { state.openReq = id; renderApp(); markRead(id); };
  window.__backReq = function () { state.openReq = null; renderApp(); };
  window.__reply = function (id) {
    var t = (el("rep-texte") || {}).value || "";
    if (!t.trim()) return;
    post("reply", { requestId: id, texte: t.trim() }).then(function (j) {
      if (j && j.ok) loadData();
    });
  };
  function markRead(id) { post("markread", { requestId: id || "" }); }
  function markAllRead() { if (state.unread) { post("markread", {}); state.unread = 0; } }

  window.__newReq = function () {
    var h = '<div class="box"><div class="head"><h3>Nouvelle requête</h3><button class="x" onclick="window.__closePop()">✕</button></div>'
      + '<div class="small muted" style="margin-bottom:8px">Choisissez le type. Les RH et la paie verront votre demande et pourront répondre.</div>'
      + '<label>Type</label><select id="rq-type" onchange="window.__reqFields()">'
      + '<option value="reclamation">Réclamation</option><option value="permission">Permission / absence</option><option value="conge">Congé</option><option value="pret">Prêt</option><option value="acompte">Acompte</option><option value="pointage">Contestation de pointage</option><option value="autre">Autre</option></select>'
      + '<label>Sujet</label><input id="rq-sujet" placeholder="Ex : Pointage du 12/10 erroné">'
      + '<div id="rq-extra"></div>'
      + '<label>Message</label><textarea id="rq-message" rows="4" placeholder="Expliquez votre demande…"></textarea>'
      + '<div class="err" id="rq-err"></div><div style="height:10px"></div>'
      + '<div class="row"><button class="btn out" onclick="window.__closePop()">Annuler</button><button class="btn green" onclick="window.__sendReq()">Envoyer</button></div></div>';
    el("pop").classList.remove("hidden"); el("pop").innerHTML = h;
    window.__reqFields();
  };
  window.__reqFields = function () {
    var t = (el("rq-type") || {}).value || "reclamation";
    var x = el("rq-extra"); if (!x) return;
    if (t === "permission" || t === "conge") {
      x.innerHTML = '<div class="row"><div><label>Date début</label><input type="date" id="rq-debut"></div><div><label>Date fin</label><input type="date" id="rq-fin"></div></div>'
        + '<div class="row"><div><label>Nombre de jours</label><input type="number" min="0" step="0.5" id="rq-jours"></div><div><label>Retour estimé</label><input type="date" id="rq-retour"></div></div>'
        + '<label>Motif</label><input id="rq-motif" placeholder="Ex : décès dans la famille, maladie…">';
    } else if (t === "pret" || t === "acompte") {
      x.innerHTML = '<div class="row"><div><label>Montant demandé</label><input type="number" min="0" step="1000" id="rq-montant"></div><div><label>Mois de déduction souhaité</label><input type="month" id="rq-mois"></div></div>'
        + '<div class="small muted">L’administration choisira la caisse ou la banque de paiement après validation.</div>';
    } else if (t === "pointage") {
      x.innerHTML = '<div class="row"><div><label>Date concernée</label><input type="date" id="rq-date-pointage"></div>'
        + '<div><label>Correction demandée</label><select id="rq-correction"><option value="present">Me marquer présent</option><option value="heures">Corriger les heures</option><option value="autre">Autre correction</option></select></div></div>'
        + '<div class="row"><div><label>Heures jour (si correction)</label><input type="number" min="0" step="0.5" id="rq-hj"></div><div><label>Heures nuit</label><input type="number" min="0" step="0.5" id="rq-hn"></div></div>'
        + '<div class="small muted">Le service paie vérifiera et corrigera le pointage après validation.</div>';
    } else x.innerHTML = '';
  };
  window.__closePop = function () { el("pop").classList.add("hidden"); el("pop").innerHTML = ""; };
  window.__sendReq = function () {
    var g = function (id) { return (el(id) || {}).value || ""; };
    var t = g("rq-type");
    var msg = g("rq-message").trim();
    if (!msg) { el("rq-err").textContent = "Écrivez un message."; return; }
    var payload = { type: t, sujet: g("rq-sujet"), message: msg, dateDebut: g("rq-debut"), dateFin: g("rq-fin"), dureeJours: parseFloat(g("rq-jours")) || 0, motif: g("rq-motif"), retourEstime: g("rq-retour"), montant: parseFloat(g("rq-montant")) || 0, moisDeduction: g("rq-mois"), datePointage: g("rq-date-pointage"), correction: g("rq-correction"), heuresJour: parseFloat(g("rq-hj")) || 0, heuresNuit: parseFloat(g("rq-hn")) || 0 };
    post("request", payload).then(function (j) {
      if (j && j.ok) { window.__closePop(); loadData(); }
      else el("rq-err").textContent = "Envoi impossible. Réessayez.";
    });
  };

  function currentMonth() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }

  /* ---------------- Démarrage ---------------- */
  function boot() {
    if (!uid) { el("app").innerHTML = '<div class="card login"><h2>Lien incomplet</h2><div class="intro">Ouvrez cette page depuis le QR de votre bulletin ou demandez le lien au service paie.</div></div>'; return; }
    getKey("mdb_entreprise").then(function (ent) { state.ent = ent || {}; });
    if (qtoken) {
      getKey("mdb_paye").then(function (paye) {
        var arr = (paye && Array.isArray(paye.bulletinVerifs)) ? paye.bulletinVerifs : [];
        var b = null;
        for (var i = 0; i < arr.length; i++) { if (arr[i] && String(arr[i].token) === String(qtoken)) { b = arr[i]; break; } }
        state.bulletin = b;
        var tok = "";
        try { tok = sessionStorage.getItem("mdb_portail_token") || ""; } catch (e) {}
        if (tok) { state.token = tok; loadData(); } else renderLogin();
      }).catch(function () { renderLogin(); });
    } else {
      var tok = "";
      try { tok = sessionStorage.getItem("mdb_portail_token") || ""; } catch (e) {}
      if (tok) { state.token = tok; loadData(); } else renderLogin();
    }
  }
  boot();
})();
</script>
</body>
</html>
