<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACSER — Production & Stock</title>
<style>
:root{--bg:#0f172a;--surface:#1e293b;--card:#1e293b;--border:#334155;--text:#e2e8f0;--dim:#94a3b8;--accent:#f97316;--accent2:#fb923c;--green:#22c55e;--blue:#3b82f6;--red:#ef4444;--purple:#a855f7;--gold:#eab308}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#475569;border-radius:3px}
.sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .3s}
.sidebar.hidden{transform:translateX(-100%)}
.sidebar-header{padding:1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem}
.sidebar-header h2{font-size:1rem;color:var(--accent)}
.sidebar-header small{color:var(--dim);font-size:.65rem}
.nav-group{padding:.5rem 0}
.nav-group-title{padding:.3rem 1rem;font-size:.65rem;text-transform:uppercase;color:var(--dim);letter-spacing:1px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:.6rem;padding:.5rem 1rem;cursor:pointer;font-size:.82rem;color:var(--dim);transition:all .2s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(249,115,22,.08);color:var(--text)}
.nav-item.active{background:rgba(249,115,22,.12);color:var(--accent);border-left-color:var(--accent);font-weight:600}
.nav-item .badge{background:var(--red);color:#fff;font-size:.6rem;padding:1px 5px;border-radius:8px;margin-left:auto}
.main{margin-left:260px;flex:1;padding:1.5rem;min-height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:.5rem}
.topbar h1{font-size:1.3rem}
.btn{padding:.45rem .9rem;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer;font-size:.8rem;transition:all .2s;display:inline-flex;align-items:center;gap:.4rem}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-accent:hover{background:var(--accent2)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-red{background:var(--red);color:#fff;border-color:var(--red)}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:1rem}
.card h3{font-size:.9rem;margin-bottom:.5rem;color:var(--accent)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.8rem;margin-bottom:1rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.8rem;text-align:center}
.stat-card .value{font-size:1.5rem;font-weight:800;color:var(--accent)}
.stat-card .label{font-size:.7rem;color:var(--dim);margin-top:.2rem}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th,td{padding:.45rem .6rem;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--surface);color:var(--dim);font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0}
tr:hover{background:rgba(249,115,22,.04)}
.badge-draft{background:#fde68a;color:#92400e;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600}
.badge-active{background:#bbf7d0;color:#166534;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600}
.badge-done{background:#bfdbfe;color:#1e40af;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600}
.badge-danger{background:#fecaca;color:#991b1b;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600}
.form-group{margin-bottom:.8rem}
.form-group label{display:block;font-size:.75rem;font-weight:600;color:var(--dim);margin-bottom:.2rem}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:.45rem .6rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.82rem}
.form-group textarea{min-height:60px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.8rem}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:1rem}
.tab{padding:.5rem 1rem;cursor:pointer;font-size:.8rem;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;padding:.7rem 1.2rem;border-radius:8px;font-size:.82rem;z-index:9999;animation:slideIn .3s}
.toast-success{background:#166534;color:#fff}
.toast-error{background:#991b1b;color:#fff}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;max-width:600px;width:90%;max-height:80vh;overflow-y:auto}
.modal h2{font-size:1rem;margin-bottom:1rem;color:var(--accent)}
.empty{text-align:center;padding:3rem;color:var(--dim);font-size:.85rem}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:.3rem}
.progress-bar .fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.search-box{padding:.45rem .8rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.82rem;width:250px}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.show{transform:translateX(0)}.main{margin-left:0}.form-row,.form-row-3{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div>
      <h2>🏭 PRODUCTION</h2>
      <small>ACSER — Gestion Production & Stock</small>
    </div>
  </div>
  <nav id="nav"></nav>
  <div style="margin-top:auto;padding:.8rem;border-top:1px solid var(--border)">
    <a href="index.html" style="color:var(--dim);font-size:.75rem;text-decoration:none">← Retour à Montabbord</a>
  </div>
</aside>

<main class="main" id="app">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:.8rem">
      <button class="btn" onclick="toggleSidebar()" style="display:none" id="menuBtn">☰</button>
      <h1 id="pageTitle">Tableau de Bord</h1>
    </div>
    <div style="display:flex;gap:.5rem;align-items:center">
      <input type="text" class="search-box" placeholder="🔍 Rechercher..." id="globalSearch" oninput="globalSearchFn(this.value)">
      <span style="font-size:.75rem;color:var(--dim)" id="dateDisplay"></span>
    </div>
  </div>
  <div id="content"></div>
</main>

<script>
/* ==================== CONFIG ==================== */
var DB_KEY = 'mdb_production';
var CURRENT_PAGE = 'dashboard';

function getDB() { try { return JSON.parse(localStorage.getItem(DB_KEY)) || {}; } catch(e) { return {}; } }
function setDB(v) { localStorage.setItem(DB_KEY, JSON.stringify(v)); }
function getSection(key, def) { var db = getDB(); return db[key] !== undefined ? db[key] : def; }
function setSection(key, val) { var db = getDB(); db[key] = val; setDB(db); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }
function today() { return new Date().toISOString().slice(0, 10); }
function thisMonth() { return new Date().toISOString().slice(0, 7); }
function fmt(n) { return new Intl.NumberFormat('fr-FR').format(Math.floor(n || 0)); }
function fmtF(n) { return fmt(n) + ' F'; }
function escH(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function toast(msg, type) {
  var t = document.createElement('div');
  t.className = 'toast toast-' + (type || 'success');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 3000);
}
function confirm2(msg) { return window.confirm(msg); }

/* ==================== NAVIGATION ==================== */
var NAV = [
  { group: 'Exploitation', items: [
    { id: 'dashboard', label: '📊 Tableau de Bord', icon: '📊' },
    { id: 'production', label: '⚙️ Nouvelle Saisie', icon: '⚙️' },
    { id: 'history', label: '📋 Historique Production', icon: '📋' },
    { id: 'orders', label: '📦 Ordres de Production', icon: '📦' },
  ]},
  { group: 'Stock', items: [
    { id: 'stock-palettes', label: '🟫 Palettes', icon: '🟫' },
    { id: 'stock-finished', label: '✅ Produits Finis', icon: '✅' },
    { id: 'stock-semi', label: '🔧 Semi-Finis', icon: '🔧' },
    { id: 'stock-raw', label: '🪵 Matière Première', icon: '🪵' },
    { id: 'stock-merch', label: '📦 Marchandises', icon: '📦' },
    { id: 'stock-consum', label: '🔩 Consommables', icon: '🔩' },
    { id: 'stock-movements', label: '🔄 Mouvements', icon: '🔄' },
    { id: 'inventory', label: '📊 Inventaire', icon: '📊' },
  ]},
  { group: 'Articles', items: [
    { id: 'articles', label: '📑 Catalogue', icon: '📑' },
    { id: 'fiche-tech', label: '📐 Fiches Techniques', icon: '📐' },
    { id: 'definitions', label: '🧩 Composants', icon: '🧩' },
    { id: 'species', label: '🌲 Essences', icon: '🌲' },
  ]},
  { group: 'Traitement Thermique', items: [
    { id: 'thermal', label: '🌡️ Opérations', icon: '🌡️' },
    { id: 'thermal-types', label: '📦 Types Produits', icon: '📦' },
  ]},
  { group: 'Maintenance', items: [
    { id: 'preventive', label: '🔧 Préventive', icon: '🔧' },
    { id: 'corrective', label: '🛠️ Corrective', icon: '🛠️' },
  ]},
  { group: 'RH & Présence', items: [
    { id: 'rh-dashboard', label: '📊 Dashboard RH', icon: '📊' },
    { id: 'departments', label: '🏢 Départements', icon: '🏢' },
    { id: 'positions', label: '💼 Fonctions', icon: '💼' },
    { id: 'presence', label: '⏱️ Présence & Pointage', icon: '⏱️' },
    { id: 'daily-attendance', label: '📅 Pointage Journalier', icon: '📅' },
    { id: 'epi', label: '🦺 Gestion EPI', icon: '🦺' },
    { id: 'leaves', label: '🏖️ Congés', icon: '🏖️' },
    { id: 'sanctions', label: '⚠️ Sanctions', icon: '⚠️' },
  ]},
  { group: 'Rapports', items: [
    { id: 'reports', label: '📈 Rapports', icon: '📈' },
  ]},
];

function renderNav() {
  var h = '';
  NAV.forEach(function(g) {
    h += '<div class="nav-group"><div class="nav-group-title">' + escH(g.group) + '</div>';
    g.items.forEach(function(item) {
      h += '<div class="nav-item' + (CURRENT_PAGE === item.id ? ' active' : '') + '" onclick="navigate(\'' + item.id + '\')">' + item.label + '</div>';
    });
    h += '</div>';
  });
  document.getElementById('nav').innerHTML = h;
}

function navigate(page) {
  CURRENT_PAGE = page;
  localStorage.setItem('mdb_prod_currentPage', page);
  renderNav();
  renderPage();
  if (window.innerWidth < 768) document.getElementById('sidebar').classList.add('hidden');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('hidden');
}

var PAGE_TITLES = {
  'dashboard': 'Tableau de Bord',
  'production': 'Nouvelle Saisie de Production',
  'history': 'Historique Production',
  'orders': 'Ordres de Production',
  'stock-palettes': 'Gestion Palettes',
  'stock-finished': 'Produits Finis',
  'stock-semi': 'Semi-Finis',
  'stock-raw': 'Matière Première',
  'stock-merch': 'Marchandises',
  'stock-consum': 'Consommables',
  'stock-movements': 'Mouvements de Stock',
  'inventory': 'Inventaire',
  'articles': 'Catalogue Articles',
  'fiche-tech': 'Fiches Techniques',
  'definitions': 'Définitions Composants',
  'species': 'Essences de Bois',
  'thermal': 'Traitement Thermique',
  'thermal-types': 'Types Produits Thermiques',
  'preventive': 'Maintenance Préventive',
  'corrective': 'Maintenance Corrective',
  'rh-dashboard': 'Dashboard RH',
  'departments': 'Départements',
  'positions': 'Fonctions / Postes',
  'presence': 'Présence & Pointage',
  'daily-attendance': 'Pointage Journalier',
  'epi': 'Gestion EPI',
  'leaves': 'Congés',
  'sanctions': 'Sanctions Disciplinaires',
  'reports': 'Rapports',
};

function renderPage() {
  document.getElementById('pageTitle').textContent = PAGE_TITLES[CURRENT_PAGE] || CURRENT_PAGE;
  var fn = window['render_' + CURRENT_PAGE.replace(/-/g, '_')];
  if (fn) { document.getElementById('content').innerHTML = fn(); bindEvents(); }
  else { document.getElementById('content').innerHTML = '<div class="empty">Module en cours de développement...</div>'; }
}

function bindEvents() {}

/* ==================== DATA HELPERS ==================== */
function getProductions() { return getSection('productions', []); }
function setProductions(v) { setSection('productions', v); }
function getProductionOrders() { return getSection('productionOrders', []); }
function setProductionOrders(v) { setSection('productionOrders', v); }
function getArticles() { return getSection('articles', []); }
function setArticles(v) { setSection('articles', v); }
function getStockPalettes() { return getSection('stockPalettes', []); }
function setStockPalettes(v) { setSection('stockPalettes', v); }
function getStockFinished() { return getSection('stockFinished', []); }
function setStockFinished(v) { setSection('stockFinished', v); }
function getStockSemi() { return getSection('stockSemi', []); }
function setStockSemi(v) { setSection('stockSemi', v); }
function getStockRaw() { return getSection('stockRaw', []); }
function setStockRaw(v) { setSection('stockRaw', v); }
function getStockMerch() { return getSection('stockMerch', []); }
function setStockMerch(v) { setSection('stockMerch', v); }
function getStockConsum() { return getSection('stockConsum', []); }
function setStockConsum(v) { setSection('stockConsum', v); }
function getMovements() { return getSection('movements', []); }
function setMovements(v) { setSection('movements', v); }
function getInventories() { return getSection('inventories', []); }
function setInventories(v) { setSection('inventories', v); }
function getFichesTech() { return getSection('fichesTech', []); }
function setFichesTech(v) { setSection('fichesTech', v); }
function getSpecies() { return getSection('species', []); }
function setSpecies(v) { setSection('species', v); }
function getThermalTreatments() { return getSection('thermalTreatments', []); }
function setThermalTreatments(v) { setSection('thermalTreatments', v); }
function getThermalTypes() { return getSection('thermalTypes', []); }
function setThermalTypes(v) { setSection('thermalTypes', v); }
function getPreventive() { return getSection('preventive', []); }
function setPreventive(v) { setSection('preventive', v); }
function getCorrective() { return getSection('corrective', []); }
function setCorrective(v) { setSection('corrective', v); }
function getDepartments() { return getSection('departments', []); }
function setDepartments(v) { setSection('departments', v); }
function getPositions() { return getSection('positions', []); }
function setPositions(v) { setSection('positions', v); }
function getPresence() { return getSection('presence', []); }
function setPresence(v) { setSection('presence', v); }
function getDailyAttendance() { return getSection('dailyAttendance', []); }
function setDailyAttendance(v) { setSection('dailyAttendance', v); }
function getEpiItems() { return getSection('epiItems', []); }
function setEpiItems(v) { setSection('epiItems', v); }
function getEpiAssignments() { return getSection('epiAssignments', []); }
function setEpiAssignments(v) { setSection('epiAssignments', v); }
function getLeaves() { return getSection('leaves', []); }
function setLeaves(v) { setSection('leaves', v); }
function getSanctions() { return getSection('sanctions', []); }
function setSanctions(v) { setSection('sanctions', v); }
function getLosses() { return getSection('losses', []); }
function setLosses(v) { setSection('losses', v); }
function getPersonnel() { try { return JSON.parse(localStorage.getItem('mdb_employes')) || []; } catch(e) { return []; } }

/* ==================== PRODUCTION PHASES ==================== */
var PHASES = [
  { code: 'I', label: 'SORTIE DU BOIS' },
  { code: 'II', label: 'LATTES' },
  { code: 'III', label: 'PLOTS' },
  { code: 'IV', label: 'CONTREPLAQUÉ' },
  { code: 'V', label: 'ASSEMBLAGE (PF)' },
  { code: 'VI', label: 'EN COURS DE PRODUCTION' },
];

function phaseLabel(code) {
  var p = PHASES.find(function(x) { return x.code === code; });
  return p ? p.label : code;
}

function nextProdNumber() {
  var prods = getProductions();
  var max = 0;
  prods.forEach(function(p) {
    var n = parseInt((p.numero || '').replace(/\D/g, ''), 10);
    if (n > max) max = n;
  });
  return 'PRD-' + String(max + 1).padStart(4, '0');
}

function nextOPNumber() {
  var ops = getProductionOrders();
  var max = 0;
  ops.forEach(function(o) {
    var n = parseInt((o.numero || '').replace(/\D/g, ''), 10);
    if (n > max) max = n;
  });
  return 'OP-' + String(max + 1).padStart(4, '0');
}

/* ==================== DASHBOARD ==================== */
function render_dashboard() {
  var prods = getProductions().filter(function(p) { return p.statut === 'validated'; });
  var ops = getProductionOrders();
  var opEnCours = ops.filter(function(o) { return o.statut === 'en_cours'; }).length;
  var opTermine = ops.filter(function(o) { return o.statut === 'termine'; }).length;
  var thisM = thisMonth();
  var prodMois = prods.filter(function(p) { return (p.date || '').indexOf(thisM) === 0; });
  var qtyMois = prodMois.reduce(function(s, p) { return s + (p.quantite || 0); }, 0);
  var pertesMois = getLosses().filter(function(l) { return (l.date || '').indexOf(thisM) === 0; })
    .reduce(function(s, l) { return s + (l.quantite || 0); }, 0);
  var articles = getArticles().length;
  var sp = getStockPalettes().reduce(function(s, p) { return s + (p.quantite || 0); }, 0);
  var sf = getStockFinished().reduce(function(s, p) { return s + (p.quantite || 0); }, 0);

  var h = '<div class="stats-grid">';
  h += statCard(qtyMois, 'Production du mois');
  h += statCard(opEnCours, 'OP en cours');
  h += statCard(opTermine, 'OP terminés');
  h += statCard(pertesMois, 'Pertes mois');
  h += statCard(articles, 'Articles catalogue');
  h += statCard(fmt(sp), 'Stock Palettes');
  h += statCard(fmt(sf), 'Stock Produits Finis');
  h += statCard(ops.length, 'Total OP');
  h += '</div>';

  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">';
  h += '<div class="card"><h3>📦 Derniers Ordres de Production</h3>';
  var lastOps = ops.slice(-5).reverse();
  if (lastOps.length === 0) h += '<div class="empty">Aucun ordre</div>';
  else {
    h += '<table><tr><th>N°</th><th>Article</th><th>Qté</th><th>Statut</th></tr>';
    lastOps.forEach(function(o) {
      var art = getArticles().find(function(a) { return a.id === o.article_id; });
      h += '<tr><td>' + escH(o.numero) + '</td><td>' + escH(art ? art.designation : '-') + '</td><td>' + fmt(o.quantite_realisee || 0) + '/' + fmt(o.quantite_prevue || 0) + '</td><td>' + badgeStatut(o.statut) + '</td></tr>';
    });
    h += '</table>';
  }
  h += '</div>';

  h += '<div class="card"><h3>🏭 Dernières Saisies</h3>';
  var lastProds = prods.slice(-5).reverse();
  if (lastProds.length === 0) h += '<div class="empty">Aucune saisie</div>';
  else {
    h += '<table><tr><th>Date</th><th>Article</th><th>Phase</th><th>Qté</th></tr>';
    lastProds.forEach(function(p) {
      var art = getArticles().find(function(a) { return a.id === p.article_id; });
      h += '<tr><td>' + escH(p.date) + '</td><td>' + escH(art ? art.designation : '-') + '</td><td>' + escH(p.phase) + '</td><td>' + fmt(p.quantite) + '</td></tr>';
    });
    h += '</table>';
  }
  h += '</div></div>';

  h += '<div class="card"><h3>🪵 Stock par Catégorie</h3>';
  h += '<table><tr><th>Catégorie</th><th style="text-align:right">Articles</th><th style="text-align:right">Quantité totale</th></tr>';
  var cats = [
    { name: 'Palettes', data: getStockPalettes() },
    { name: 'Produits Finis', data: getStockFinished() },
    { name: 'Semi-Finis', data: getStockSemi() },
    { name: 'Matière Première', data: getStockRaw() },
    { name: 'Marchandises', data: getStockMerch() },
    { name: 'Consommables', data: getStockConsum() },
  ];
  cats.forEach(function(c) {
    var qty = c.data.reduce(function(s, x) { return s + (x.quantite || 0); }, 0);
    h += '<tr><td>' + escH(c.name) + '</td><td style="text-align:right">' + c.data.length + '</td><td style="text-align:right;font-weight:700">' + fmt(qty) + '</td></tr>';
  });
  h += '</table></div>';

  return h;
}

function statCard(val, label) {
  return '<div class="stat-card"><div class="value">' + val + '</div><div class="label">' + escH(label) + '</div></div>';
}

function badgeStatut(s) {
  var map = { draft: 'Brouillon', en_cours: 'En cours', termine: 'Terminé', annule: 'Annulé', validated: 'Validé', abandoned: 'Abandonné', planifie: 'Planifié', signale: 'Signalé', resolu: 'Résolu', active: 'Actif', expire: 'Expiré', retourne: 'Retourné', approuve: 'Approuvé', refuse: 'Refusé', en_attente: 'En attente', traite: 'Traité', cloture: 'Clôturé' };
  var cls = 'badge-draft';

function saveProduction(validate) {
  var date = document.getElementById('prod_date').value;
  var article_id = document.getElementById('prod_article_id').value;
  var phase = document.getElementById('prod_phase').value;
  var quantite = parseFloat(document.getElementById('prod_quantite').value) || 0;
  var heures = parseFloat(document.getElementById('prod_heures').value) || 0;
  var pertes = parseFloat(document.getElementById('prod_pertes').value) || 0;
  var observations = document.getElementById('prod_observations').value;
  var sel = document.getElementById('prod_employes');
  var employes = [];
  for (var i = 0; i < sel.options.length; i++) { if (sel.options[i].selected) employes.push(sel.options[i].value); }

  if (!date || !article_id || !phase || quantite <= 0) return toast('Remplissez les champs obligatoires', 'error');

  var prod = {
    id: genId(),
    numero: nextProdNumber(),
    date: date,
    article_id: article_id,
    phase: phase,
    quantite: quantite,
    heures: heures,
    pertes: pertes,
    employes: employes,
    observations: observations,
    statut: validate ? 'validated' : 'draft',
    created_at: new Date().toISOString(),
  };
  var prods = getProductions();
  prods.push(prod);
  setProductions(prods);

  if (validate) {
    updateStockArticle(article_id, quantite, 'entree', 'production', prod.numero);
    if (pertes > 0) {
      var losses = getLosses();
      losses.push({ id: genId(), date: date, article_id: article_id, quantite: pertes, production_id: prod.id, motif: observations });
      setLosses(losses);
    }
  }
  toast('Saisie enregistrée ' + (validate ? '(validée)' : '(brouillon)'));
  navigate('history');
}

function updateStockArticle(articleId, qty, type, ref, numero) {
  var article = getArticles().find(function(a) { return a.id === articleId; });
  if (!article) return;
  var cat = article.categorie || 'finished';
  var stockList, setFn;
  if (cat === 'finished') { stockList = getStockFinished(); setFn = setStockFinished; }
  else if (cat === 'semi') { stockList = getStockSemi(); setFn = setStockSemi; }
  else if (cat === 'lattes') { stockList = getStockSemi(); setFn = setStockSemi; }
  else { stockList = getStockFinished(); setFn = setStockFinished; }

  var existing = stockList.find(function(s) { return s.article_id === articleId; });
  if (existing) {
    existing.quantite = (existing.quantite || 0) + (type === 'entree' ? qty : -qty);
    existing.updated_at = new Date().toISOString();
  } else {
    stockList.push({ id: genId(), article_id: articleId, quantite: type === 'entree' ? qty : 0, created_at: new Date().toISOString() });
  }
  setFn(stockList);

  var movements = getMovements();
  movements.push({
    id: genId(), date: today(), type: type, article_id: articleId,
    quantite: qty, reference: ref, motif: 'Saisie production ' + numero,
    created_at: new Date().toISOString()
  });
  setMovements(movements);
}

    h += '<div class="card"><table><tr><th>Date</th><th>Article</th><th style="text-align:right">Qté perdue</th><th>Motif</th></tr>';

function validateProd(id) {
  var prods = getProductions();
  var p = prods.find(function(x) { return x.id === id; });
  if (!p) return;
  p.statut = 'validated';
  setProductions(prods);
  updateStockArticle(p.article_id, p.quantite, 'entree', 'production', p.numero);
  if (p.pertes > 0) {
    var losses = getLosses();
    losses.push({ id: genId(), date: p.date, article_id: p.article_id, quantite: p.pertes, production_id: p.id, motif: p.observations });
    setLosses(losses);
  }
  toast('Saisie validée');
  renderPage();
}

  var qte = parseFloat(document.getElementById('op_update_qte').value) || 0;

  var h = '<div style="display:flex;justify-content:space-between;margin-bottom:1rem"><div></div>';
  h += '<button class="btn btn-accent" onclick="showNewEpi()">+ Nouvel EPI</button></div>';
  if (items.length === 0) return h + '<div class="empty">Aucun EPI</div>';
  h += '<div class="card"><table><tr><th>Code</th><th>Désignation</th><th>Catégorie</th><th style="text-align:right">Stock</th><th style="text-align:right">Seuil min</th><th style="text-align:right">Prix</th><th>Actions</th></tr>';
  items.forEach(function(e) {
    var alert = e.quantite_stock <= (e.seuil_minimum || 0);
    h += '<tr' + (alert ? ' style="background:rgba(239,68,68,.1)"' : '') + '><td>' + escH(e.code) + '</td><td>' + escH(e.designation) + '</td><td>' + escH(e.categorie || '-') + '</td><td style="text-align:right;font-weight:700">' + (e.quantite_stock || 0) + (alert ? ' ⚠️' : '') + '</td><td style="text-align:right">' + (e.seuil_minimum || 0) + '</td><td style="text-align:right">' + fmtF(e.prix_unitaire || 0) + '</td><td><button class="btn btn-red" onclick="deleteEpi(\'' + e.id + '\')" style="font-size:.7rem">🗑️</button></td></tr>';
  });
  h += '</table></div>';
  return h;
}

function showNewEpi() {
  var m = '<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)this.remove()"><div class="modal">';
  m += '<h2>🦺 Nouvel EPI</h2>';
  m += formField('epi_code', 'Code', '', 'text', true);
  m += formField('epi_designation', 'Désignation', '', 'text', true);
  m += formField('epi_categorie', 'Catégorie', '', 'text', false);
  m += '<div class="form-row">';
  m += formField('epi_stock', 'Quantité stock', '', 'number', false);
  m += formField('epi_seuil', 'Seuil minimum', '', 'number', false);
  m += '</div>';
  m += formField('epi_prix', 'Prix unitaire', '', 'number', false);
  m += '<div style="display:flex;gap:.5rem;margin-top:.8rem">';
  m += '<button class="btn btn-accent" onclick="createEpi()">✅ Créer</button>';
  m += '<button class="btn" onclick="document.getElementById(\'modalOverlay\').remove()">Annuler</button>';
  m += '</div></div></div>';
  document.body.insertAdjacentHTML('beforeend', m);
}

function createEpi() {
  var code = document.getElementById('epi_code').value;
  var designation = document.getElementById('epi_designation').value;
  if (!code || !designation) return toast('Champs requis', 'error');
  var items = getEpiItems();
  items.push({ id: genId(), code: code, designation: designation, categorie: document.getElementById('epi_categorie').value, quantite_stock: parseInt(document.getElementById('epi_stock').value) || 0, seuil_minimum: parseInt(document.getElementById('epi_seuil').value) || 0, prix_unitaire: parseFloat(document.getElementById('epi_prix').value) || 0 });
  setEpiItems(items);
  document.getElementById('modalOverlay').remove();
  toast('EPI créé');
  renderPage();
}

function deleteEpi(id) {
  if (!confirm2('Supprimer ?')) return;
  setEpiItems(getEpiItems().filter(function(e) { return e.id !== id; }));
  toast('Supprimé');
  renderPage();
}

/* ==================== RH - CONGES ==================== */
function render_leaves() {
  var leaves = getLeaves().slice().reverse();
  var personnel = getPersonnel();
  var h = '<div style="display:flex;justify-content:space-between;margin-bottom:1rem">';
  h += '<div></div>';
  h += '<button class="btn btn-accent" onclick="showNewLeave()">+ Nouvelle Demande</button>';
  h += '</div>';
  if (leaves.length === 0) return h + '<div class="empty">Aucune demande de congé</div>';
  h += '<div class="card"><table><tr><th>Employé</th><th>Type</th><th>Du</th><th>Au</th><th style="text-align:right">Jours</th><th>Statut</th><th>Actions</th></tr>';
  leaves.forEach(function(l) {
    var emp = personnel.find(function(e) { return e.id === l.employee_id; });
    h += '<tr><td>' + escH(emp ? emp.nom + ' ' + (emp.prenoms || '') : '-') + '</td><td>' + escH(l.type_conge || '-') + '</td><td>' + escH(l.date_debut || '-') + '</td><td>' + escH(l.date_fin || '-') + '</td><td style="text-align:right">' + (l.jours || 0) + '</td><td>' + badgeStatut(l.statut) + '</td><td>';
    if (l.statut === 'en_attente') {
      h += '<button class="btn btn-green" onclick="updateLeave(\'' + l.id + '\',\'approuve\')" style="font-size:.7rem">✅</button> ';
      h += '<button class="btn btn-red" onclick="updateLeave(\'' + l.id + '\',\'refuse\')" style="font-size:.7rem">❌</button>';
    }
    h += '</td></tr>';
  });
  h += '</table></div>';
  return h;
}

function showNewLeave() {
  var personnel = getPersonnel();
  var m = '<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)this.remove()"><div class="modal">';
  m += '<h2>🏖️ Demande de Congé</h2>';
  m += '<div class="form-group"><label>Employé *</label><select id="lv_emp">';
  personnel.forEach(function(p) { m += '<option value="' + p.id + '">' + escH(p.nom) + ' ' + escH(p.prenoms || '') + '</option>'; });
  m += '</select></div>';
  m += '<div class="form-group"><label>Type *</label><select id="lv_type"><option value="annuel">Annuel</option><option value="maladie">Maladie</option><option value="maternite">Maternité</option><option value="exceptionnel">Exceptionnel</option></select></div>';
  m += '<div class="form-row">';
  m += formField('lv_debut', 'Date début', '', 'date', true);
  m += formField('lv_fin', 'Date fin', '', 'date', true);
  m += '</div>';
  m += formTextarea('lv_motif', 'Motif');
  m += '<div style="display:flex;gap:.5rem;margin-top:.8rem">';
  m += '<button class="btn btn-accent" onclick="createLeave()">✅ Soumettre</button>';
  m += '<button class="btn" onclick="document.getElementById(\'modalOverlay\').remove()">Annuler</button>';
  m += '</div></div></div>';
  document.body.insertAdjacentHTML('beforeend', m);
}

function createLeave() {
  var employee_id = document.getElementById('lv_emp').value;
  var date_debut = document.getElementById('lv_debut').value;
  var date_fin = document.getElementById('lv_fin').value;
  if (!employee_id || !date_debut || !date_fin) return toast('Champs requis', 'error');
  var days = Math.ceil((new Date(date_fin) - new Date(date_debut)) / 86400000) + 1;
  var leaves = getLeaves();
  leaves.push({ id: genId(), employee_id: employee_id, type_conge: document.getElementById('lv_type').value, date_debut: date_debut, date_fin: date_fin, jours: days, motif: document.getElementById('lv_motif').value, statut: 'en_attente' });
  setLeaves(leaves);
  document.getElementById('modalOverlay').remove();
  toast('Demande soumise');
  renderPage();
}

function updateLeave(id, statut) {
  var leaves = getLeaves();
  var l = leaves.find(function(x) { return x.id === id; });
  if (l) { l.statut = statut; setLeaves(leaves); toast('Congé ' + statut); renderPage(); }
}

/* ==================== RH - SANCTIONS ==================== */
function render_sanctions() {
  var sanctions = getSanctions().slice().reverse();
  var personnel = getPersonnel();
  var h = '<div style="display:flex;justify-content:space-between;margin-bottom:1rem">';
  h += '<div></div>';
  h += '<button class="btn btn-accent" onclick="showNewSanction()">+ Nouvelle Sanction</button>';
  h += '</div>';
  if (sanctions.length === 0) return h + '<div class="empty">Aucune sanction</div>';
  h += '<div class="card"><table><tr><th>Employé</th><th>Type</th><th>Date</th><th>Motif</th><th>Décision</th></tr>';
  sanctions.forEach(function(s) {
    var emp = personnel.find(function(e) { return e.id === s.employee_id; });
    h += '<tr><td>' + escH(emp ? emp.nom + ' ' + (emp.prenoms || '') : '-') + '</td><td>' + escH(s.type || '-') + '</td><td>' + escH(s.date || '-') + '</td><td>' + escH(s.motif || '-') + '</td><td>' + escH(s.decision || '-') + '</td></tr>';
  });
  h += '</table></div>';
  return h;
}

function showNewSanction() {
  var personnel = getPersonnel();
  var m = '<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)this.remove()"><div class="modal">';
  m += '<h2>⚠️ Nouvelle Sanction</h2>';
  m += '<div class="form-group"><label>Employé *</label><select id="san_emp">';
  personnel.forEach(function(p) { m += '<option value="' + p.id + '">' + escH(p.nom) + ' ' + escH(p.prenoms || '') + '</option>'; });
  m += '</select></div>';
  m += '<div class="form-group"><label>Type *</label><select id="san_type"><option value="Avertissement">Avertissement</option><option value="Blâme">Blâme</option><option value="Suspension">Suspension</option><option value="Licenciement">Licenciement</option></select></div>';
  m += formField('san_date', 'Date', today(), 'date', true);
  m += formTextarea('san_motif', 'Motif');
  m += formTextarea('san_decision', 'Décision');
  m += '<div style="display:flex;gap:.5rem;margin-top:.8rem">';
  m += '<button class="btn btn-accent" onclick="createSanction()">✅ Enregistrer</button>';
  m += '<button class="btn" onclick="document.getElementById(\'modalOverlay\').remove()">Annuler</button>';
  m += '</div></div></div>';
  document.body.insertAdjacentHTML('beforeend', m);
}

function createSanction() {
  var employee_id = document.getElementById('san_emp').value;
  var date = document.getElementById('san_date').value;
  if (!employee_id || !date) return toast('Champs requis', 'error');
  var sanctions = getSanctions();
  sanctions.push({ id: genId(), employee_id: employee_id, type: document.getElementById('san_type').value, date: date, motif: document.getElementById('san_motif').value, decision: document.getElementById('san_decision').value });
  setSanctions(sanctions);
  document.getElementById('modalOverlay').remove();
  toast('Sanction enregistrée');
  renderPage();
}

/* ==================== RAPPORTS ==================== */
function render_reports() {
  var h = '<div class="stats-grid">';
  h += '<div class="card" style="cursor:pointer" onclick="generateReport(\'production\')"><h3>📊 Rapport Production</h3><p style="font-size:.75rem;color:var(--dim)">Synthèse production par mois</p></div>';
  h += '<div class="card" style="cursor:pointer" onclick="generateReport(\'stock\')"><h3>📦 Rapport Stock</h3><p style="font-size:.75rem;color:var(--dim)">Mouvements de stock</p></div>';
  h += '<div class="card" style="cursor:pointer" onclick="generateReport(\'presence\')"><h3>⏱️ Rapport Présence</h3><p style="font-size:.75rem;color:var(--dim)">Taux de présence</p></div>';
  h += '<div class="card" style="cursor:pointer" onclick="generateReport(\'thermal\')"><h3>🌡️ Rapport Thermique</h3><p style="font-size:.75rem;color:var(--dim)">Traitements thermiques</p></div>';
  h += '</div>';
  return h;
}

function generateReport(type) {
  toast('Génération du rapport ' + type + '...');
}

/* ==================== HELPERS ==================== */
function formField(id, label, value, type, required) {
  return '<div class="form-group"><label>' + escH(label) + (required ? ' *' : '') + '</label><input type="' + type + '" id="' + id + '" value="' + escH(value || '') + '"' + (required ? ' required' : '') + '></div>';
}
function formSelect(id, label, options, required) {
  var h = '<div class="form-group"><label>' + escH(label) + (required ? ' *' : '') + '</label><select id="' + id + '">';
  options.forEach(function(o) { h += '<option value="' + escH(o.v) + '">' + escH(o.t) + '</option>'; });
  h += '</select></div>';
  return h;
}
function formTextarea(id, label) {
  return '<div class="form-group"><label>' + escH(label) + '</label><textarea id="' + id + '"></textarea></div>';
}
function filterTable(tableId, q) {
  var rows = document.querySelectorAll('#' + tableId + ' tr');
  q = q.toLowerCase();
  rows.forEach(function(r, i) { if (i === 0) return; r.style.display = r.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none'; });
}
function globalSearchFn(q) {
  if (!q) return renderPage();
  /* Search across articles */
  var results = [];
  getArticles().forEach(function(a) {
    if ((a.code + ' ' + a.designation).toLowerCase().indexOf(q.toLowerCase()) !== -1) results.push('Article: ' + a.code + ' — ' + a.designation);
  });
  if (results.length > 0) {
    document.getElementById('content').innerHTML = '<div class="card"><h3>🔍 Résultats pour "' + escH(q) + '"</h3><ul>' + results.map(function(r) { return '<li>' + escH(r) + '</li>'; }).join('') + '</ul></div>';
  }
}
