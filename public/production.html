/* ==================== HELPERS ==================== */
function formField(id, label, value, type, required) {
  return '<div class="form-group"><label>' + escH(label) + (required ? ' *' : '') + '</label><input type="' + type + '" id="' + id + '" value="' + escH(value || '') + '"' + (required ? ' required' : '') + '></div>';
}
function formSelect(id, label, options, required) {
  var h = '<div class="form-group"><label>' + escH(label) + (required ? ' *' : '') + '</label><select id="' + id + '">';
  options.forEach(function(o) { h += '<option value="' + escH(o.v) + '">' + escH(o.t) + '</option>'; });
  h += '</select></div>';
  return h;
}
function formTextarea(id, label) {
  return '<div class="form-group"><label>' + escH(label) + '</label><textarea id="' + id + '"></textarea></div>';
}
function filterTable(tableId, q) {
  var rows = document.querySelectorAll('#' + tableId + ' tr');
  q = q.toLowerCase();
  rows.forEach(function(r, i) { if (i === 0) return; r.style.display = r.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none'; });
}
function globalSearchFn(q) {
  q = (q || '').trim();
  if (!q || q.length < 2) return renderPage();
  var ql = q.toLowerCase();
  function has() {
    for (var i = 0; i < arguments.length; i++) {
      if (String(arguments[i] || '').toLowerCase().indexOf(ql) !== -1) return true;
    }
    return false;
  }
  function goProduct(id) { navigate('history'); setTimeout(function() { viewFicheProd(id); }, 120); }
  function goAchat(id) { navigate('achats-history'); setTimeout(function() { toggleAccordion('bl_' + id); var el = document.getElementById('arrow_bl_' + id); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' }); }, 120); }
  function goStockRaw(id) {
    setSection('stockRawTab', 'actif'); setSection('stockRawEtat', 'tout');
    window._pendingRawHighlight = id; navigate('stock-raw');
  }
  window.goProduct = goProduct; window.goAchat = goAchat; window.goStockRaw = goStockRaw;
  var sections = [];
  function addSec(icon, title, rows) {
    if (rows.length) sections.push({ icon: icon, title: title, rows: rows.slice(0, 10), more: rows.length > 10 ? rows.length - 10 : 0 });
  }
  /* Articles catalogue */
  var rArt = [];
  getArticles().forEach(function(a) {
    if (has(a.code, a.designation, a.destination)) rArt.push({ t: a.code + ' — ' + a.designation, s: a.destination || a.categorie || '', fn: 'navigate(\'articles\');setTimeout(function(){filterTable(\'artTable\',\'' + q.replace(/'/g, '') + '\')},120)' });
  });
  addSec('📑', 'Catalogue Produits', rArt);
  /* Fiches production */
  var rProd = [];
  getProductions().forEach(function(p) {
    var art = getArticles().find(function(a) { return a.id === p.article_id; }) || {};
    if (has(p.numero, art.code, art.designation, p.chef)) rProd.push({ t: 'Fiche ' + (p.numero || p.id) + ' — ' + (art.code || '') + ' ' + (art.designation || ''), s: fmtD(p.date) + ' · ' + (p.statut || ''), fn: 'goProduct(\'' + p.id + '\')' });
  });
  addSec('⚙️', 'Fiches Production', rProd);
  /* Achats */
  var rAch = [];
  getAchats().forEach(function(a) {
    var itemsTxt = (a.items || []).map(function(it) { return (it.colis_number || it.code || '') + ' ' + (it.designation || it.essence || ''); }).join(' ');
    if (has(a.reference, a.fournisseur, a.receiver_name, itemsTxt)) rAch.push({ t: (a.reference || 'BL') + ' — ' + (a.fournisseur || ''), s: fmtD(a.date) + ' · ' + ((a.items || []).length) + ' colis', fn: 'goAchat(' + a.id + ')' });
  });
  addSec('🛒', 'Achats', rAch);
  /* Livraisons */
  var rLiv = [];
  getLivraisons().forEach(function(l) {
    if (has(l.numero, l.clientNom, l.client, l.chauffeur)) rLiv.push({ t: (l.numero || 'BL') + ' — ' + (l.clientNom || l.client || ''), s: fmtD(l.date), fn: 'navigate(\'livraisons\')' });
  });
  addSec('🚚', 'Livraisons', rLiv);
  /* Stock MP */
  var rRaw = [];
  getStockRaw().forEach(function(s) {
    if (has(s.code, s.colis_number, s.designation, s.essence, s.fournisseur)) rRaw.push({ t: (s.code || s.colis_number) + ' — ' + (s.designation || s.essence || ''), s: 'Stock: ' + (s.quantite || 0), fn: 'goStockRaw(\'' + s.id + '\')' });
  });
  addSec('🪵', 'Stock Matière Première', rRaw);
  /* Produits finis */
  var rFin = [];
  getStockFinished().forEach(function(s) {
    var art = s.article_id ? (getArticles().find(function(a) { return a.id === s.article_id; }) || {}) : {};
    var code = s.code || art.code || '', des = s.designation || art.designation || '';
    if (has(code, des)) rFin.push({ t: code + ' — ' + des, s: 'Stock: ' + (s.quantite || 0), fn: 'showFinishedFiche(\'' + s.id + '\')' });
  });
  addSec('📦', 'Produits Finis', rFin);
  /* Mouvements */
  var rMov = [];
  getMovements().forEach(function(m) {
    var art = m.article_id ? (getArticles().find(function(a) { return a.id === m.article_id; }) || {}) : {};
    if (has(m.reference, m.motif, art.code, art.designation)) rMov.push({ t: fmtD(m.date) + ' · ' + (m.type || '') + ' ' + (m.quantite || 0) + ' — ' + (art.code || art.designation || ''), s: m.motif || m.reference || '', fn: 'navigate(\'stock-movements\')' });
  });
  addSec('🔄', 'Mouvements', rMov);
  var h = '<div class="card"><h3>🔍 Résultats pour "' + escH(q) + '" <span style="font-size:.72rem;color:var(--dim)">(toute l\'application Production)</span></h3>';
  if (!sections.length) h += '<div class="empty">Rien trouvé pour "' + escH(q) + '"</div>';
  sections.forEach(function(sec) {
    h += '<h4 style="margin:.9rem 0 .4rem">' + sec.icon + ' ' + sec.title + ' <span style="font-size:.7rem;color:var(--dim)">(' + (sec.rows.length + sec.more) + ')</span></h4>';
    h += '<table style="font-size:.8rem"><tbody>';
    sec.rows.forEach(function(r) {
      h += '<tr><td>' + escH(r.t) + '<br><span style="font-size:.72rem;color:var(--dim)">' + escH(r.s) + '</span></td>';
      h += '<td style="text-align:right;white-space:nowrap"><button class="btn" onclick="' + r.fn + '" style="font-size:.7rem">Ouvrir →</button></td></tr>';
    });
    h += '</tbody></table>';
    if (sec.more) h += '<div style="font-size:.72rem;color:var(--dim)">… +' + sec.more + ' autres (affinez la recherche)</div>';
  });
  h += '</div>';
  document.getElementById('content').innerHTML = h;
}

  existing.forEach(function(s) { has[s.id] = true; });
  var ref = [

    { id: 'sp_divm', code: 'DIV-MIXTE', nom: 'DIVERS-MIXTE', type: 'Autre', origine: 'Autre' },
    { id: 'sp_emien', code: 'EMIEN', nom: 'EMIEN', type: 'Bois blanc', origine: 'Bois blanc' },
    { id: 'sp_iat', code: 'IAT', nom: 'IATANZA', type: 'Bois rouge', origine: 'Bois rouge' },

    { id: 'sp_loto', code: 'LOTO', nom: 'LOTOFA', type: 'Bois rouge', origine: 'Bois rouge' },
    { id: 'sp_teck', code: 'TECK', nom: 'TECK', type: 'Bois rouge', origine: 'Bois rouge' },
    { id: 'sp_tia', code: 'TIA', nom: 'TIAMA', type: 'Bois rouge', origine: 'Bois rouge' },

function onCompCodeChange(input, type) {
  var tr = input.closest('tr');
  if (!tr) return;
  var code = input.value.trim();
  var defs = defCatalog();
  var def = null;
  for (var i = 0; i < defs.length; i++) {
    if (defs[i].type === type && defs[i].code === code) { def = defs[i]; break; }
  }
  if (!def) {
    var arts = getArticles();
    for (var j = 0; j < arts.length; j++) {
      if (arts[j].code === code) {
        def = { designation: arts[j].designation || arts[j].code, length: arts[j].length || 0, width: arts[j].width || 0, thickness: arts[j].thickness || 0 };
        break;
      }
    }
  }
  if (!def) return;
  var cells = tr.querySelectorAll('input');
  if (cells.length >= 2 && cells[1] && !cells[1].value) cells[1].value = def.designation || code;
  if (type === 'CP') {
    /* CP : la colonne 2 est "Type de CP" ; remplir aussi dims si présents */
    if (cells[1] && !cells[1].value) cells[1].value = def.designation || code;
  }
  var dimInputs = tr.querySelectorAll('input[type="number"]');
  if (dimInputs && dimInputs.length >= 4) {
    /* dimInputs[0] = Qté (saisie libre, ne pas pré-remplir) ; [1]=Long, [2]=Larg, [3]=Épais */
    if (parseFloat(def.length) > 0) dimInputs[1].value = def.length;
    if (parseFloat(def.width) > 0) dimInputs[2].value = def.width;
    if (parseFloat(def.thickness) > 0) dimInputs[3].value = def.thickness;
  }
  /* Recalcul volume */
  var rowId = tr.id || '';
  if (/^latteRow/.test(rowId)) calcLatteVol(parseInt(rowId.replace('latteRow', ''), 10));
  else if (/^plotRow/.test(rowId)) calcPlotVol(parseInt(rowId.replace('plotRow', ''), 10));
  else if (/^cpRow/.test(rowId)) calcCPVol(parseInt(rowId.replace('cpRow', ''), 10));
}


var _sidebarCollapsed = false;
var _sidebarPinned = false;
var _sbExpandTime = 0;

function initSidebarState() {
  try { _sidebarCollapsed = localStorage.getItem('mdb_sidebarCollapsed') === '1'; } catch(e) {}
  try { _sidebarPinned = localStorage.getItem('mdb_sidebarPinned') === '1'; } catch(e) {}

  var sb = document.getElementById('sidebar');
  if (sb) {
    sb.classList.remove('show');
    /* Sur mobile : toujours en tiroir fermé, jamais replié/épinglé (comme index) */
    if (isMobileView()) {
      sb.classList.remove('collapsed');
      sb.classList.remove('pinned');
    } else if (_sidebarPinned) {
      sb.classList.add('pinned');
      _sidebarCollapsed = false;
      sb.classList.remove('collapsed');
    } else if (_sidebarCollapsed) {
      sb.classList.add('collapsed');
    }
  }
  var ov = document.getElementById('sidebarOverlay');
  if (ov) ov.classList.remove('open');
  updateSidebarButtonsUI();
}

function toggleSidebarCollapse() {
  _sidebarCollapsed = !_sidebarCollapsed;
  if (!_sidebarCollapsed) _sbExpandTime = Date.now();
  var sb = document.getElementById('sidebar');
  if (sb) {
    sb.classList.toggle('collapsed', _sidebarCollapsed);
    if (!_sidebarCollapsed) {
      _sidebarPinned = false;
      sb.classList.remove('pinned');
      localStorage.setItem('mdb_sidebarPinned', '0');
    }
  }
  try { localStorage.setItem('mdb_sidebarCollapsed', _sidebarCollapsed ? '1' : '0'); } catch(e) {}
  updateSidebarButtonsUI();
}

function toggleSidebarPin() {
  _sidebarPinned = !_sidebarPinned;
  var sb = document.getElementById('sidebar');
  if (sb) {
    /* L'épingle n'a de sens que sur desktop (comme index : off-canvas sur mobile) */
    if (_sidebarPinned && isMobileView()) _sidebarPinned = false;
    sb.classList.toggle('pinned', _sidebarPinned);
    if (_sidebarPinned) {
      _sidebarCollapsed = false;
      sb.classList.remove('collapsed');
      try { localStorage.setItem('mdb_sidebarCollapsed', '0'); } catch(e) {}
    }
  }
  try { localStorage.setItem('mdb_sidebarPinned', _sidebarPinned ? '1' : '0'); } catch(e) {}
  updateSidebarButtonsUI();
}

function updateSidebarButtonsUI() {
  var pinBtn = document.getElementById('sidebarPinBtn');
  var collapseBtn = document.getElementById('sidebarCollapseBtn');
  if (pinBtn) pinBtn.style.color = _sidebarPinned ? '#f97316' : 'var(--dim)';
  if (collapseBtn) collapseBtn.textContent = _sidebarCollapsed ? '▶' : '◀';
}


document.addEventListener('DOMContentLoaded', function() {
  var sb = document.getElementById('sidebar');
  if (sb) {
    sb.addEventListener('mouseleave', function() {
      if (_sidebarCollapsed && !_sidebarPinned) {
        sb.classList.add('collapsed');
      }
    });
  }
});

/* Comme index : clic dans l'espace de travail = la sidebar se replie (sauf si épinglée).
   Sur mobile : clic dehors = fermeture du tiroir.
   - Seul un clic DANS #app (zone de travail) replie, pas les modals/toasts.
   - Grâce de 600ms après une expansion manuelle (le temps de faire son choix). */
document.addEventListener('click', function(e) {
  var sb = document.getElementById('sidebar');
  if (!sb || _sidebarPinned) return;
  if (e.target.closest('#sidebar') ||
      e.target.closest('#sidebarPinBtn') || e.target.closest('#sidebarCollapseBtn') ||
      e.target.closest('#sidebarOpenBtn') ||
      e.target.closest('#sidebarOverlay')) return;
  if (isMobileView()) {
    if (sb.classList.contains('show')) closeSidebar();
  } else {
    if (!e.target.closest('#app')) return;
    if (Date.now() - _sbExpandTime < 600) return;
    if (!sb.classList.contains('collapsed')) {
      _sidebarCollapsed = true;
      sb.classList.add('collapsed');
      try { localStorage.setItem('mdb_sidebarCollapsed', '1'); } catch(err) {}
      updateSidebarButtonsUI();
    }
  }
});

function updateProductionTotals() {
  // Sum Sortie Bois
  var totalSbQte = 0, totalSbVol = 0;
  var sbRows = document.querySelectorAll('[id^="sb_row_"], [id^="sortieBoisRow"]');
  sbRows.forEach(function(row, idx) {
    var qte = parseFloat((document.getElementById('sb_qte_' + idx) || {}).value || 0);
    var vol = parseFloat((document.getElementById('sb_vol_' + idx) || {}).value || 0);
    totalSbQte += qte;
    totalSbVol += vol;
  });

  var totalSbQteEl = document.getElementById('sb_total_qte');
  var totalSbVolEl = document.getElementById('sb_total_vol');
  if (totalSbQteEl) totalSbQteEl.textContent = totalSbQte;
  if (totalSbVolEl) totalSbVolEl.textContent = totalSbVol.toFixed(4) + ' m³';

  // Sum Lattes
  var totalLatteVol = 0;
  document.querySelectorAll('[id^="latte_vol_"]').forEach(function(input) {
    totalLatteVol += parseFloat(input.value || 0);
  });

  // Sum Plots
  var totalPlotVol = 0;
  document.querySelectorAll('[id^="plot_vol_"]').forEach(function(input) {
    totalPlotVol += parseFloat(input.value || 0);
  });

  // Summary Cards at bottom
  var sumSbEl = document.getElementById('summary_sb_vol');
  var sumLatteEl = document.getElementById('summary_latte_vol');
  var sumPlotEl = document.getElementById('summary_plot_vol');
  var sumTotalProdEl = document.getElementById('summary_total_prod_vol');
  var sumRendementEl = document.getElementById('summary_rendement');

  var totalTransforme = totalLatteVol + totalPlotVol;
  var rendement = totalSbVol > 0 ? ((totalTransforme / totalSbVol) * 100).toFixed(1) : '0.0';

  if (sumSbEl) sumSbEl.textContent = totalSbVol.toFixed(4) + ' m³';
  if (sumLatteEl) sumLatteEl.textContent = totalLatteVol.toFixed(4) + ' m³';
  if (sumPlotEl) sumPlotEl.textContent = totalPlotVol.toFixed(4) + ' m³';
  if (sumTotalProdEl) sumTotalProdEl.textContent = totalTransforme.toFixed(4) + ' m³';
  if (sumRendementEl) sumRendementEl.textContent = rendement + ' %';
}

function onAchatEssenceChange() {
  var codeEl = document.getElementById('ai_essence');
  var typeEl = document.getElementById('ai_type');
  if (!codeEl || !typeEl) return;
  var code = (codeEl.value || '').trim().toUpperCase();
  if (!code) return;
  var sp = getSpecies().find(function(s) { return ((s.code || '').toUpperCase() === code); });
  if (!sp) return;
  var t = spType(sp);
  typeEl.value = t === 'Bois rouge' ? 'Rouge' : (t === 'Bois blanc' ? 'Blanc' : 'Autre');
}
function onLGlobInput() {
  var lglob = parseFloat((document.getElementById('ai_lglob') || {}).value || 0);
  var qte = parseFloat((document.getElementById('ai_qte') || {}).value || 1);
  var largEl = document.getElementById('ai_larg');
  if (lglob > 0 && qte > 0 && largEl) {
    var largMoy = lglob / qte;
    largEl.value = largMoy.toFixed(1);
  }
  calcItemVolLive();
}

function onLargInput() {
  /* La largeur globale n'est jamais remplie auto : seul le sens L.glob -> Larg moy. existe */
  calcItemVolLive();
}

function calcItemVolLive() {
  var qte = parseFloat((document.getElementById('ai_qte') || {}).value || 0);
  var L = parseFloat((document.getElementById('ai_long') || {}).value || 0);
  var l = parseFloat((document.getElementById('ai_larg') || {}).value || 0);
  var e = parseFloat((document.getElementById('ai_epais') || {}).value || 0);

  var vol = 0;
  if (L > 0 && l > 0 && e > 0) {
    vol = (L * l * e / 1000000) * qte;
  }
  var volEl = document.getElementById('ai_vol');
  if (volEl) volEl.value = vol.toFixed(4);
}


/* PU par défaut = celui de la 1ère ligne renseignée (modifiable ensuite) */
function achatDefaultPU() {
  try {
    for (var i = 0; i < _tempAchatItems.length; i++) {
      var u = parseFloat(_tempAchatItems[i].unit_price) || 0;
      if (u > 0) return u;
    }
  } catch(e) {}
  return 0;
}
/* N° colis auto : fournisseur + date + dimensions + séquence unique */
function genColisNumber(sup, dateStr, L, l, e) {
  var s = String(sup || 'SF').replace(/[^A-Za-z0-9]/g, '').substring(0, 4).toUpperCase() || 'SF';
  var d = '';
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr || '');
  if (m) d = m[3] + m[2] + m[1].substring(2, 4);
  else { var t = new Date(); d = (t.getDate() < 10 ? '0' : '') + t.getDate() + ((t.getMonth() + 1 < 10) ? '0' : '') + (t.getMonth() + 1) + String(t.getFullYear()).substring(2, 4); }
  var dim = (L > 0 && l > 0 && e > 0) ? ('-' + L + 'x' + l + 'x' + e) : '';
  var base = 'COL-' + s + '-' + d + dim;
  var used = {};
  try {
    _tempAchatItems.forEach(function(it) { if (it.colis_number) used[it.colis_number] = true; });
    var extra = [];
    if (typeof getStockRaw === 'function') { try { extra = getStockRaw() || []; } catch(e) {} }
    else { try { var pp = JSON.parse(localStorage.getItem('mdb_production')) || {}; extra = pp.stockRaw || []; } catch(e) {} }
    extra.forEach(function(sx) { var c = sx.colis_number || sx.code; if (c) used[c] = true; });
  } catch(e) {}
  var n = 1, code = '';
  do { code = base + '-' + (n < 10 ? '0' : '') + n; n++; } while (used[code] && n < 1000);
  return code;
}
/* Recharge une ligne créée dans les champs pour modification avant validation */
function editAchatItemLine(i, category) {
  var it = _tempAchatItems[i];
  if (!it) return;
  function setV(id, v) { var el = document.getElementById(id); if (el) el.value = (v === null || v === undefined) ? '' : v; }
  if (category === 'raw-materials') {
    setV('ai_colis', it.colis_number); setV('ai_qte', it.quantity);
    setV('ai_long', it.length); setV('ai_larg', it.width); setV('ai_epais', it.thickness);
    setV('ai_vol', it.volume); setV('ai_essence', it.essence); setV('ai_type', it.type);
    setV('ai_zone', it.zone); setV('ai_pu', it.unit_price); setV('ai_obs', it.obs);
    if (typeof calcItemVolLive === 'function') calcItemVolLive();
  } else if (category === 'consumables' || category === 'consumable') {
    setV('ai_code', it.code); setV('ai_designation', it.designation);
    setV('ai_qte', it.paquets != null ? it.paquets : it.quantity);
    setV('ai_qte_paquet', it.cond); setV('ai_constype', it.ctype); setV('ai_emplacement', it.emplacement);
    setV('ai_pu', it.unit_price); setV('ai_obs', it.obs);
  } else {
    setV('ai_code', it.code); setV('ai_designation', it.designation);
    setV('ai_qte', it.quantity); setV('ai_pu', it.unit_price); setV('ai_obs', it.obs);
  }
  _tempAchatItems.splice(i, 1);
  renderAchatItemsTable(category);
  try { var f = document.getElementById('ai_colis') || document.getElementById('ai_code'); if (f) f.focus(); } catch(e) {}
}

    var L = parseFloat((document.getElementById('ai_long') || {}).value || 0);
    var l = parseFloat((document.getElementById('ai_larg') || {}).value || 0);
    var lglob = parseFloat((document.getElementById('ai_lglob') || {}).value || 0);
    var e = parseFloat((document.getElementById('ai_epais') || {}).value || 0);
    var vol = parseFloat((document.getElementById('ai_vol') || {}).value || 0);
    var essence = (document.getElementById('ai_essence') || {}).value || 'AY';
    var type = (document.getElementById('ai_type') || {}).value || 'Rouge';
    var zone = (document.getElementById('ai_zone') || {}).value || '';
    var obs = (document.getElementById('ai_obs') || {}).value || '';

    // If width l is 0 but lglob is entered, compute average width = lglob / qte
    if ((!l || l === 0) && lglob > 0 && qte > 0) {
      l = parseFloat((lglob / qte).toFixed(1));
    }
    // Recalculate volume with effective average width l
    if (L > 0 && l > 0 && e > 0 && (!vol || vol === 0)) {
      vol = (L * l * e / 1000000) * qte;
    }

    var puMP = parseFloat((document.getElementById('ai_pu') || {}).value || 0);
    if (!colis) {
      var _sup = (document.getElementById('ach_fournisseur') || {}).value || '';
      var _dat = (document.getElementById('ach_date') || {}).value || '';
      colis = genColisNumber(_sup, _dat, L, l, e);
      var _ci = document.getElementById('ai_colis');
      if (_ci) _ci.value = colis;
    }
    item = { colis_number: colis, quantity: qte, length: L, width: l, lglob: lglob, thickness: e, volume: vol, essence: essence, type: type, zone: zone, unit_price: puMP, total_price: qte * puMP, obs: obs };
  } else if (category === 'consumables' || category === 'consumable') {
    var code = (document.getElementById('ai_code') || {}).value || 'ART-' + Date.now().toString().slice(-4);
    var des = (document.getElementById('ai_designation') || {}).value || 'Consommable';
    var qte = parseFloat((document.getElementById('ai_qte') || {}).value || 1);
    var pu = parseFloat((document.getElementById('ai_pu') || {}).value || 0);
    var obs = (document.getElementById('ai_obs') || {}).value || '';
    var ctype = (document.getElementById('ai_constype') || {}).value || 'POINTE';
    var empl = (document.getElementById('ai_emplacement') || {}).value || '';
    var qtePaq = parseFloat((document.getElementById('ai_qte_paquet') || {}).value || 1);
    var units = ctype === 'POINTE' ? qte * Math.max(1, qtePaq) : qte;

    item = { code: code, designation: des, quantity: units, paquets: qte, cond: qtePaq, ctype: ctype, emplacement: empl, unit_price: pu, total_price: qte * pu, obs: obs };
  } else {
    var code = (document.getElementById('ai_code') || {}).value || 'ART-' + Date.now().toString().slice(-4);
    var des = (document.getElementById('ai_designation') || {}).value || 'Article';
    var qte = parseFloat((document.getElementById('ai_qte') || {}).value || 1);
    var pu = parseFloat((document.getElementById('ai_pu') || {}).value || 0);
    var obs = (document.getElementById('ai_obs') || {}).value || '';

    item = { code: code, designation: des, quantity: qte, unit_price: pu, total_price: qte * pu, obs: obs };
  }

  _tempAchatItems.push(item);
  renderAchatItemsTable(category);
}

function calcAchatVol() {

  var volEl = document.getElementById('ach_vol');
  if (volEl && L > 0 && l > 0 && e > 0) {

  }
}

}

/* Achat → dette fournisseur auto (compte tiers partagé avec l'app principale) */
function syncProdAchatDette(a) {
  try {
    if (!a || !a.id) return false;
    var dettes = [];
    try { dettes = JSON.parse(localStorage.getItem('mdb_dettesFournisseurs')) || []; } catch(e) { dettes = []; }
    var idx = -1;
    for (var i = 0; i < dettes.length; i++) { if (dettes[i].prodAchatId === a.id) { idx = i; break; } }
    var montant = Math.round((parseFloat(a.montant_total) || 0) * 100) / 100;
    /* Résoudre le fournisseurId depuis le nom (évite les dettes orphelines sans id) */
    function _resolveFid(nm) {
      try {
        var raw = localStorage.getItem('mdb_fournisseurs') || '[]';
        var fl = JSON.parse(raw) || [];
        var t = String(nm || '').trim().toLowerCase();
        for (var k = 0; k < fl.length; k++) {
          if (String(fl[k].nom || '').trim().toLowerCase() === t) return fl[k].id;
        }
      } catch(e) {}
      return '';
    }
    if (idx !== -1) {
      dettes[idx].montant = montant;
      dettes[idx].fournisseur = a.fournisseur || dettes[idx].fournisseur;
      if (!dettes[idx].fournisseurId) dettes[idx].fournisseurId = _resolveFid(a.fournisseur);
      dettes[idx].description = 'Achat production ' + (a.reference || '');
      if (a.date) dettes[idx].date = a.date;
    } else {
      dettes.push({ id: genId(), prodAchatId: a.id, fournisseurId: _resolveFid(a.fournisseur), fournisseur: a.fournisseur || '', description: 'Achat production ' + (a.reference || ''), date: a.date || '', montant: montant });
    }
    try { localStorage.setItem('mdb_dettesFournisseurs', JSON.stringify(dettes)); } catch(e) { return false; }
    return true;
  } catch(e) { return false; }
}
function saveAchatByCategory(e, category) {
  e.preventDefault();
  var achats = getAchats();

  var ref = (document.getElementById('ach_ref') || {}).value || '';
  var date = (document.getElementById('ach_date') || {}).value || today();
  var fournisseur = (document.getElementById('ach_fournisseur') || {}).value || '';
  var receiver = (document.getElementById('ach_receiver') || {}).value || '';
  var acheteur = (document.getElementById('ach_acheteur') || {}).value || '';

  if (_tempAchatItems.length === 0) {
    return toast('Veuillez ajouter au moins un article en cliquant sur le bouton "+"', 'error');
  }

  var totalVol = _tempAchatItems.reduce(function(acc, item) { return acc + (parseFloat(item.volume) || 0); }, 0);
  var totalAmount = _tempAchatItems.reduce(function(acc, item) { return acc + (parseFloat(item.total_price) || 0); }, 0);

  var existingId = window._editingAchatId || null;
  var existing = existingId ? achats.find(function(x) { return x.id === existingId; }) : null;

  if (existing) {
    existing.reference = ref;
    existing.date = date;
    existing.fournisseur = fournisseur;
    existing.receiver_name = receiver;
    existing.acheteur = acheteur;
    existing.items = _tempAchatItems.slice();
    existing.item_count = _tempAchatItems.length;
    existing.total_volume = totalVol;
    existing.montant_total = totalAmount;
    existing.updated_at = today();
  } else {
    var newAchat = {
      id: Date.now(),
      category: category,
      type: category,
      date: date,
      reference: ref,
      fournisseur: fournisseur,
      receiver_name: receiver,
      acheteur: acheteur,
      items: _tempAchatItems.slice(),
      item_count: _tempAchatItems.length,
      total_volume: totalVol,
      montant_total: totalAmount,
      created_at: today()
    };
    achats.unshift(newAchat);
  }

  setAchats(achats);
  window._editingAchatId = null;
  try { syncProdAchatDette(existing || achats[0]); } catch(e) {}

  if (category === 'raw-materials' && !existing) {
    var rawStock = getStockRaw();
    _tempAchatItems.forEach(function(it) {
      rawStock.unshift({
        id: Date.now() + Math.random(),
        code: it.colis_number,
        colis_number: it.colis_number,
        designation: it.essence + ' (' + it.type + ')',
        essence: it.essence,
        type: it.type,
        fournisseur: fournisseur,
        longueur: it.length,
        largeur: it.width,
        epaisseur: it.thickness,
        volume: it.volume,
        quantite: it.quantity,
        zone: it.zone,
        created_at: today()
      });
    });
    setStockRaw(rawStock);
  } else if (category === 'semi' && !existing) {
    var semiStock = getStockSemi();
    _tempAchatItems.forEach(function(it) {
      semiStock.unshift({
        id: Date.now() + Math.random(),
        code: it.code,
        designation: it.designation,
        fournisseur: fournisseur,
        quantite: it.quantity,
        prix_unitaire: it.unit_price,
        created_at: today()
      });
    });
    setStockSemi(semiStock);
  } else if (category === 'finished' && !existing) {
    var finStock = getStockFinished();
    _tempAchatItems.forEach(function(it) {
      finStock.unshift({
        id: Date.now() + Math.random(),
        code: it.code,
        designation: it.designation,
        fournisseur: fournisseur,
        quantite: it.quantity,
        prix_unitaire: it.unit_price,
        created_at: today()
      });
    });
    setStockFinished(finStock);
    /* Journal des mouvements : entrées achats (pour la fiche de stock) */
    try {
      var _arts = getArticles();
      var _movs = getMovements();
      _tempAchatItems.forEach(function(it) {
        var _a = _arts.find(function(x) { return (x.code || '').trim().toLowerCase() === String(it.code || '').trim().toLowerCase(); }) || {};
        _movs.push({ id: genId(), date: date, type: 'entree', article_id: _a.id || '', quantite: parseFloat(it.quantity) || 0, reference: ref, motif: 'Achat ' + ref, created_at: new Date().toISOString() });
      });
      setMovements(_movs);
    } catch (e) {}
  } else if (category === 'merchandises' && !existing) {
    var merchStock = getStockMerch();
    _tempAchatItems.forEach(function(it) {
      merchStock.unshift({
        id: Date.now() + Math.random(),
        code: it.code,
        designation: it.designation,
        fournisseur: fournisseur,
        quantite: it.quantity,
        prix_unitaire: it.unit_price,
        created_at: today()
      });
    });
    setStockMerch(merchStock);
  } else if (category === 'consumables' && !existing) {
    var consumStock = getStockConsum();
    _tempAchatItems.forEach(function(it) {
      consumStock.unshift({
        id: Date.now() + Math.random(),
        code: it.code,
        designation: it.designation,
        fournisseur: fournisseur,
        quantite: it.quantity,
        paquets: it.paquets || it.quantity,
        cond: it.cond || 1,
        ctype: it.ctype || 'DIVERS',
        emplacement: it.emplacement || '',
        prix_unitaire: it.unit_price,
        created_at: today()
      });
    });
    setStockConsum(consumStock);
  }

  toast(existing ? 'Achat mis à jour' : 'Enregistrement réussi !', 'success');
  closeModal();
  renderPage();
}

/* ===== OCR EXTRACTION POUR BON DE LIVRAISON MATIÈRE PREMIÈRE ===== */
function extractAchatFromDoc(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var status = document.getElementById('ach_doc_status');
  var preview = document.getElementById('ach_doc_preview');
  status.textContent = '🔄 Analyse en cours...';
  preview.style.display = 'none';
  preview.textContent = '';

  function processImage(img) {
    if (typeof Tesseract === 'undefined') {
      status.textContent = '❌ Tesseract.js non chargé';
      return;
    }
    Tesseract.recognize(img, 'fra', { logger: function(m) { if (m.status === 'recognizing text') status.textContent = '🔄 OCR: ' + Math.round(m.progress * 100) + '%'; }})
      .then(function(result) {
        var text = result.data.text || '';
        preview.textContent = text;
        preview.style.display = 'block';
        status.textContent = '✅ Texte extrait — vérifiez et complétez les champs';
        applyExtractedAchatData(text);
      })
      .catch(function(err) {
        status.textContent = '❌ Erreur OCR: ' + err.message;
      });
  }

  var url = URL.createObjectURL(file);
  if (file.type === 'application/pdf') {
    if (typeof pdfjsLib === 'undefined') {
      status.textContent = '❌ pdf.js non chargé';
      return;
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    var reader = new FileReader();
    reader.onload = function(e) {
      pdfjsLib.getDocument(new Uint8Array(e.target.result)).promise.then(function(pdf) {
        var maxPages = Math.min(pdf.numPages, 5);
        // 1) extraction de texte Natif (précis + instantané) si le PDF en contient
        var textTasks = [];
        for (var ti = 1; ti <= maxPages; ti++) {
          textTasks.push(pdf.getPage(ti).then(function(page) {
            return page.getTextContent().then(function(tc) {
              return tc.items.map(function(it) { return it.str || ''; }).join(' ');
            });
          }));
        }
        Promise.all(textTasks).then(function(allText) {
          var joined = allText.join('\n---PAGE BREAK---\n');
          var cleaned = joined.replace(/\s{2,}/g, ' ').trim();
          if (cleaned.length > 30) {
            preview.textContent = joined;
            preview.style.display = 'block';
            status.textContent = '✅ Texte extrait du PDF (texte natif) — vérifiez et complétez les champs';
            applyExtractedAchatData(joined);
            return;
          }
          // 2) sinon fallback: rendu canvas de chaque page + OCR Tesseract
          var pages = [];
          for (var pi = 1; pi <= maxPages; pi++) {
            pages.push(pdf.getPage(pi).then(function(page) {
              var viewport = page.getViewport({ scale: 2 });
              var canvas = document.createElement('canvas');
              canvas.width = viewport.width;
              canvas.height = viewport.height;
              var ctx = canvas.getContext('2d');
              return page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function() {
                return canvas.toDataURL('image/png');
              });
            }));
          }
          Promise.all(pages).then(function(imgs) {
            processAllImages(imgs, function(text) {
              preview.textContent = text;
              preview.style.display = 'block';
              status.textContent = '✅ Texte extrait (OCR) — vérifiez et complétez les champs';
              applyExtractedAchatData(text);
            });
          });
        });
      }).catch(function(err) { status.textContent = '❌ Erreur PDF: ' + err.message; });
    };
    reader.readAsArrayBuffer(file);
  } else {
    var img = new Image();
    img.onload = function() { processImage(img); URL.revokeObjectURL(url); };
    img.onerror = function() { status.textContent = '❌ Erreur chargement image'; URL.revokeObjectURL(url); };
    img.src = url;
  }
}
function processAllImages(imgs, done) {
  var texts = [];
  var status = document.getElementById('ach_doc_status');
  var i = 0;
  function next() {
    if (i >= imgs.length) { done(texts.join('\n---PAGE BREAK---\n')); return; }
    if (typeof Tesseract === 'undefined') { status.textContent = '❌ Tesseract.js non chargé'; return; }
    Tesseract.recognize(imgs[i], 'fra', { logger: function(m) { if (m.status === 'recognizing text') status.textContent = '🔄 OCR page ' + (i + 1) + '/' + imgs.length + ': ' + Math.round(m.progress * 100) + '%'; }})
      .then(function(result) { texts.push(result.data.text || ''); i++; next(); })
      .catch(function(err) { status.textContent = '❌ Erreur OCR: ' + err.message; });
  }
  next();
}

function applyExtractedAchatData(text) {
  var lines = text.split(/\r?\n/).map(function(l) { return l.trim(); }).filter(function(l) { return l.length > 0; });
  var full = lines.join(' ');

  // 1. Fournisseur — matching contre liste connue
  var suppliers = getSharedFournisseurs();
  var foundFournisseur = null;
  for (var i = 0; i < suppliers.length; i++) {
    var fn = (suppliers[i].company_name || suppliers[i].name || suppliers[i].nom || '').toLowerCase();
    if (fn && full.toLowerCase().indexOf(fn) >= 0) { foundFournisseur = suppliers[i].company_name || suppliers[i].name || suppliers[i].nom; break; }
  }
  if (foundFournisseur) document.getElementById('ach_fournisseur').value = foundFournisseur;
  else {
    // fallback: première ligne qui ressemble à un nom (pas de chiffres, pas de mots-clés facture)
    for (var i = 0; i < lines.length; i++) {
      if (!/^\d/.test(lines[i]) && !/facture|bl|bon|livraison|numero|date|total|ht|ttc|tva/i.test(lines[i]) && lines[i].length > 3) {
        document.getElementById('ach_fournisseur').value = lines[i];
        break;
      }
    }
  }

  // 2. Référence / N° BL
  var refMatch = full.match(/(?:bl|bon\s*de\s*livraison|facture|n[°o]\s*(?:bl|facture)?)\s*[#:]?\s*([\w\/\-\.]{3,})/i);
  if (refMatch) document.getElementById('ach_ref').value = refMatch[1];

  // 3. Essence — matching contre essences connues
  var species = getSpecies();
  var essList = ['AYOUS','ASSAMELA','BILINGA','SAPELLI','IROKO','MOVINGUI','PADOUK','TAIL','FRAKE','OKOUME','NIANGON','DOUSSIE','AZOBE','BETE','KOTO','LIMBA','MAHOGANY','TEAK','MERANTI','KERUING','KAPUR','MERBAU'];
  for (var i = 0; i < species.length; i++) essList.push(species[i].code, species[i].nom);
  for (var i = 0; i < essList.length; i++) {
    var e = essList[i].toUpperCase();
    if (full.toUpperCase().indexOf(e) >= 0) { document.getElementById('ai_essence').value = e; onAchatEssenceChange(); break; }
  }

  // 4. Dimensions — pattern L×l×E (ex: 114*8*2, 114 x 8 x 2, 114x8x2)
  var dimMatch = full.match(/(\d+(?:[.,]\d+)?)\s*[xX×*]\s*(\d+(?:[.,]\d+)?)\s*[xX×*]\s*(\d+(?:[.,]\d+)?)/);
  if (dimMatch) {
    var L = parseFloat(dimMatch[1].replace(',', '.'));
    var l = parseFloat(dimMatch[2].replace(',', '.'));
    var e = parseFloat(dimMatch[3].replace(',', '.'));
    if (L > 100) { document.getElementById('ai_long').value = L; document.getElementById('ai_larg').value = l; document.getElementById('ai_epais').value = e; }
    else { document.getElementById('ai_long').value = L * 100; document.getElementById('ai_larg').value = l * 100; document.getElementById('ai_epais').value = e * 10; }
    calcItemVolLive();
  }

  // 5. Quantité — nombre avant "pièce", "colis", "qté", "quantité", ou premier gros entier isolé
  var qteMatch = full.match(/(?:qte|qté|quantite|quantité|colis|pieces?|pièces?)\s*[#:]?\s*(\d+)/i) || full.match(/\b(\d{2,4})\b/);
  if (qteMatch) document.getElementById('ai_qte').value = qteMatch[1];

  // 6. Type (Rouge/Blanc)
  if (/rouge/i.test(full)) document.getElementById('ai_type').value = 'Rouge';
  else if (/blanc/i.test(full)) document.getElementById('ai_type').value = 'Blanc';

  // 7. N° Colis
  var colisMatch = full.match(/(?:n[°o]\s*(?:colis|col))\s*[#:]?\s*([\w\/\-\.]{3,})/i);
  if (colisMatch) document.getElementById('ai_colis').value = colisMatch[1];

  calcItemVolLive();
  var status = document.getElementById('ach_doc_status');
  if (status) status.textContent = '✅ Données extraites — vérifiez et complétez avant d\'ajouter la ligne';
}

/* Suppression bordereau : retire du stock les quantités qu'il avait apportées */
function reverseAchatStock(a) {
  try {
    if (!a || !a.items || !a.items.length) return;
    var cat = a.category || '';
    function pull(get, set, match, qtyOf, volOf) {
      var arr = get();
      var changed = false;
      for (var i = 0; i < a.items.length; i++) {
        var it = a.items[i];
        var q = qtyOf(it);
        var v = volOf ? volOf(it) : 0;
        if (q <= 0 && v <= 0) continue;
        for (var j = 0; j < arr.length; j++) {
          if (match(arr[j], it)) {
            arr[j].quantite = Math.max(0, (parseFloat(arr[j].quantite) || 0) - q);
            if (volOf && arr[j].volume !== undefined) arr[j].volume = Math.max(0, (parseFloat(arr[j].volume) || 0) - v);
            if ((parseFloat(arr[j].quantite) || 0) <= 0 && (!volOf || (parseFloat(arr[j].volume) || 0) <= 0)) { arr.splice(j, 1); j--; }
            changed = true;
            break;
          }
        }
      }
      if (changed) set(arr);
    }
    function norm(x) { return String(x || '').trim().toLowerCase(); }
    function codeMatch(s, it) { return norm(s.code || s.colis_number) === norm(it.code || it.colis_number); }
    function qtyIt(it) { return parseFloat(it.quantity) || 0; }
    if (cat === 'raw-materials') { // L.9476-9480
      pull(getStockRaw, setStockRaw,
        function(s, it) { return norm(s.colis_number || s.code) === norm(it.colis_number || it.code); },
        qtyIt,
        function(it) { return parseFloat(it.volume) || 0; });
    } else if (cat === 'semi') {
      pull(getStockSemi, setStockSemi, codeMatch, qtyIt, null);
    } else if (cat === 'finished') {
      pull(getStockFinished, setStockFinished, codeMatch, qtyIt, null);
      try {
        var movs = getMovements();
        movs = movs.filter(function(m) { return !(m && m.type === 'entree' && m.reference === a.reference); });
        setMovements(movs);
      } catch(e) {}
    } else if (cat === 'merchandises') {
      pull(getStockMerch, setStockMerch, codeMatch, qtyIt, null);
    } else if (cat === 'consumables') {
      pull(getStockConsum, setStockConsum, codeMatch, qtyIt, null);
    }
  } catch(e) {}
}

function saveLivraison() {

    applyLivraisonStock(old, +1);
  } else {
    var dup2 = livs.find(function(x) { return (x.numero || '').trim().toLowerCase() === numero.toLowerCase(); });
    if (dup2) return toast('N° BL déjà utilisé', 'error');
  }
  /* Vérifier le stock disponible (après annulation de l'ancien en cas de modification) */
  var need = {};
  lignes.forEach(function(ln) { need[ln.article_id] = (need[ln.article_id] || 0) + ln.qte; });
  var lack = [];
  Object.keys(need).forEach(function(aid) {
    var a = getArticles().find(function(x) { return x.id === aid; }) || {};
    if (livStockOf(aid) < need[aid]) lack.push((a.code || '?') + ' (dispo ' + livStockOf(aid) + ' / demandé ' + need[aid] + ')');
  });
  if (lack.length) return toast('Stock insuffisant : ' + lack.join(', '), 'error');
  var cli = prodClientNames().find(function(c) { return c.nom.trim().toLowerCase() === clientNom.toLowerCase(); }) || {};
  var liv = old || { id: genId(), created_at: new Date().toISOString() };
  liv.numero = numero; liv.date = date; liv.clientNom = clientNom; liv.client = clientNom;
  liv.clientId = cli.id || liv.clientId || null; liv.chauffeur = chauffeur; liv.lignes = lignes;
  applyLivraisonStock(liv, -1);
  pushLivraisonToCommercial(liv);
  if (!old) livs.unshift(liv);
  else { var ix = livs.findIndex(function(x) { return String(x.id) === String(liv.id); }); if (ix !== -1) livs[ix] = liv; }
  setLivraisons(livs);
  window._editingLivId = null;
  document.getElementById('modalOverlay').remove();
  toast(old ? 'BL mis à jour ✅ (stock + gestion commerciale)' : 'BL enregistré ✅ (stock déduit + à facturer en gestion commerciale)');
  renderPage();
}
function deleteLivraison(id) {
  var livs = getLivraisons();
  var l = livs.find(function(x) { return String(x.id) === String(id); });
  if (!l) return;
  var sb = syncedMainBL(l.id);
  if (sb && sb.factureId) return toast('BL déjà facturé en gestion commerciale — suppression impossible', 'error');
  if (!confirm2('Supprimer le BL ' + (l.numero || '') + ' ? Le stock sera restauré.')) return;
  applyLivraisonStock(l, +1);
  try { setMainBLs(getMainBLs().filter(function(b) { return b.prodLivId !== l.id; })); } catch (e) {}
  setLivraisons(livs.filter(function(x) { return String(x.id) !== String(id); }));
  toast('BL supprimé, stock restauré');
  renderPage();
}
function printLivraison(id) {
  var l = getLivraisons().find(function(x) { return String(x.id) === String(id); });
  if (!l) return;
  var tot = 0;
  var rows = (l.lignes || []).map(function(ln) {
    var mt = (parseFloat(ln.qte) || 0) * (parseFloat(ln.pu) || 0);
    tot += mt;
    return '<tr><td>' + escH(ln.code || '-') + '</td><td>' + escH(ln.designation || '-') + '</td><td style="text-align:right">' + ln.qte + '</td><td style="text-align:right">' + fmt(ln.pu || 0) + '</td><td style="text-align:right">' + fmt(mt) + '</td></tr>';
  }).join('');
  var html = '<html><head><meta charset="UTF-8"><title>BL ' + escH(l.numero || '') + '</title>';
  html += '<style>body{font-family:Arial;font-size:11px;margin:20px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #333;padding:5px 7px}th{background:#f0f0f0}h2{text-align:center}.total{font-weight:700;background:#e2e8f0}</style></head><body>';
  html += '<h2>BON DE LIVRAISON ' + escH(l.numero || '') + '</h2>';
  html += '<p><strong>Date :</strong> ' + fmtD(l.date) + ' &nbsp; <strong>Client :</strong> ' + escH(l.clientNom || l.client || '') + (l.chauffeur ? ' &nbsp; <strong>Chauffeur :</strong> ' + escH(l.chauffeur) : '') + '</p>';
  html += '<table><tr><th>Code</th><th>Désignation</th><th style="text-align:right">Qté</th><th style="text-align:right">PU (F)</th><th style="text-align:right">Montant (F)</th></tr>' + rows;
  html += '<tr class="total"><td colspan="4" style="text-align:right">TOTAL</td><td style="text-align:right">' + fmt(tot) + '</td></tr></table>';
  html += '<p style="margin-top:30px;display:flex;justify-content:space-between"><span>Signature client : _________________</span><span>Signature chauffeur : _________________</span></p>';
  html += '</body></html>';
  var w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
  w.onload = function() { w.print(); };
}

/* ==================== FICHE DE STOCK PRODUIT FINI (clic → historique des mouvements) ==================== */
function showFinishedFiche(stockId) {
  var fin = getStockFinished();
  var entry = fin.find(function(s) { return String(s.id) === String(stockId); });
  if (!entry) return toast('Article introuvable', 'error');
  var articles = getArticles();
  var art = entry.article_id ? (articles.find(function(a) { return a.id === entry.article_id; }) || {}) : {};
  var code = stkCode(entry), des = stkDes(entry);
  if (!art.id && code && code !== '-') {
    art = articles.find(function(a) { return (a.code || '').trim().toLowerCase() === String(code).trim().toLowerCase(); }) || {};
  }
  var artId = art.id || entry.article_id || '';
  var codeL = String(code === '-' ? '' : code).trim().toLowerCase();
  var actuel = 0;
  fin.forEach(function(s) { if (artId ? s.article_id === artId : String(s.id) === String(stockId)) actuel += parseFloat(s.quantite) || 0; });
  /* Journal des mouvements = source de la fiche (entrées, sorties, ajustements, annulations) */
  var movs = getMovements().filter(function(mm) { return artId && mm.article_id === artId; });
  movs.sort(function(a, b) { return String(a.date).localeCompare(String(b.date)); });
  var totE = 0, totS = 0, totA = 0;
  movs.forEach(function(mm) {
    var q = parseFloat(mm.quantite) || 0;
    if (mm.type === 'entree') totE += q;
    else if (mm.type === 'sortie') totS += q;
    else if (mm.type === 'ajustement') totA += q;
  });
  var initial = actuel - totE + totS - totA;
  function fnum(n) { return (parseFloat(n) || 0); }
  window._ficheData = { code: code, des: des, actuel: actuel, initial: initial, movs: movs, initDate: initialRowDate(movs.length ? movs[0].date : '') };
  var bal = initial;
  var rows = '<tr style="background:#f8fafc"><td>' + escH(window._ficheData.initDate) + '</td><td style="color:var(--blue);font-weight:600">' + escH(code) + '</td><td style="color:var(--blue);font-weight:600">' + escH(des) + '</td><td style="text-align:right;font-weight:700;color:var(--blue)">' + fnum(initial) + '</td><td style="text-align:center;color:var(--dim)">-</td><td style="text-align:center;color:var(--dim)">-</td><td style="text-align:center;color:var(--dim)">-</td><td style="text-align:right;font-weight:700;color:var(--blue)">' + fnum(initial) + '</td><td style="color:var(--blue)">Stock initial</td><td style="text-align:center;color:var(--dim)">-</td></tr>';
  movs.forEach(function(mm) {
    var q = parseFloat(mm.quantite) || 0;
    var eC = '', sC = '', aC = '';
    if (mm.type === 'entree') { eC = '<span style="color:var(--green);font-weight:700">+' + q + '</span>'; bal += q; }
    else if (mm.type === 'sortie') { sC = '<span style="color:var(--red);font-weight:700">-' + q + '</span>'; bal -= q; }
    else { aC = '<span style="color:var(--accent);font-weight:700">' + (q >= 0 ? '+' : '') + q + '</span>'; bal += q; }
    rows += '<tr><td>' + fmtD(mm.date) + '</td><td>' + escH(code) + '</td><td>' + escH(des) + '</td>';
    rows += '<td style="text-align:right">' + fnum(bal - (mm.type === 'entree' ? q : (mm.type === 'sortie' ? -q : q))) + '</td>';
    rows += '<td style="text-align:right">' + (eC || '<span style="color:var(--dim)">-</span>') + '</td>';
    rows += '<td style="text-align:right">' + (sC || '<span style="color:var(--dim)">-</span>') + '</td>';
    rows += '<td style="text-align:right">' + (aC || '<span style="color:var(--dim)">0.000</span>') + '</td>';
    rows += '<td style="text-align:right;font-weight:700;color:var(--accent)">' + fnum(bal) + '</td>';
    rows += '<td style="font-size:.75rem">' + escH(mm.motif || '-') + '</td>';
    rows += '<td style="text-align:center;color:var(--dim)">-</td></tr>';
  });
  var m = '<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)this.remove()"><div class="modal" style="max-width:1100px">';
  m += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem">';
  m += '<h2 style="margin:0">⇄ HISTORIQUE DES MOUVEMENTS – ' + escH(code) + '</h2>';
  m += '<button class="btn" onclick="printFinishedFiche()">🖨️ Imprimer</button></div>';
  m += '<div class="card" style="overflow-x:auto"><table style="font-size:.75rem"><tr><th>Jour</th><th>Code</th><th>Libellé</th><th style="text-align:right">Stock Initial</th><th style="text-align:right">Entrée</th><th style="text-align:right">Sortie</th><th style="text-align:right">Ajustement</th><th style="text-align:right">Stock Final</th><th>Observation</th><th>Justification</th></tr>' + rows + '</table></div>';
  m += '<div style="display:flex;gap:.5rem;margin-top:.8rem"><button class="btn" onclick="document.getElementById(\'modalOverlay\').remove()">Fermer</button></div>';
  m += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', m);
}
function printFinishedFiche() {
  var d = window._ficheData;
  if (!d) return;
  var bal = d.initial;
  var rows = '<tr><td>' + escH(d.initDate || '-') + '</td><td>' + escH(d.code) + '</td><td>' + escH(d.des) + '</td><td style="text-align:right">' + d.initial + '</td><td style="text-align:center">-</td><td style="text-align:center">-</td><td style="text-align:center">-</td><td style="text-align:right">' + d.initial + '</td><td>Stock initial</td><td style="text-align:center">-</td></tr>';
  (d.movs || []).forEach(function(mm) {
    var q = parseFloat(mm.quantite) || 0;
    var eC = '-', sC = '-', aC = '0.000';
    if (mm.type === 'entree') { eC = '+' + q; bal += q; }
    else if (mm.type === 'sortie') { sC = '-' + q; bal -= q; }
    else { aC = (q >= 0 ? '+' : '') + q; bal += q; }
    rows += '<tr><td>' + fmtD(mm.date) + '</td><td>' + escH(d.code) + '</td><td>' + escH(d.des) + '</td><td style="text-align:right">' + (bal - (mm.type === 'entree' ? q : (mm.type === 'sortie' ? -q : q))) + '</td><td style="text-align:right">' + eC + '</td><td style="text-align:right">' + sC + '</td><td style="text-align:right">' + aC + '</td><td style="text-align:right">' + bal + '</td><td>' + escH(mm.motif || '-') + '</td><td style="text-align:center">-</td></tr>';
  });
  var html = '<html><head><meta charset="UTF-8"><title>Historique des mouvements ' + escH(d.code) + '</title>';
  html += '<style>body{font-family:Arial;font-size:10px;margin:20px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #333;padding:4px 6px}th{background:#f0f0f0}h2{text-align:center}</style></head><body>';
  html += '<h2>HISTORIQUE DES MOUVEMENTS – ' + escH(d.code) + ' (' + escH(d.des) + ')</h2>';
  html += '<table><tr><th>Jour</th><th>Code</th><th>Libellé</th><th>Stock Initial</th><th>Entrée</th><th>Sortie</th><th>Ajustement</th><th>Stock Final</th><th>Observation</th><th>Justification</th></tr>' + rows + '</table>';
  html += '</body></html>';
  var w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
  w.onload = function() { w.print(); };
}
