<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACSER — Production & Stock</title>
<style>
:root{--bg:#f8f9fa;--surface:#fff;--card:#fff;--border:#e5e7eb;--text:#1e293b;--dim:#64748b;--accent:#f97316;--accent2:#fb923c;--accentLight:#fff7ed;--green:#22c55e;--blue:#3b82f6;--red:#ef4444;--purple:#a855f7;--gold:#eab308;--sidebarBg:#1e293b;--sidebarText:#cbd5e1;--sidebarActive:rgba(249,115,22,.15)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:3px}
.sidebar{width:260px;background:var(--sidebarBg);border-right:1px solid #334155;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .3s;overflow-y:auto}
.sidebar.hidden{transform:translateX(-100%)}
.sidebar-header{padding:1rem 1rem .8rem;border-bottom:1px solid #334155}
.sidebar-header .logo{display:flex;align-items:center;gap:.5rem}
.sidebar-header .logo-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem}
.sidebar-header h2{font-size:.95rem;color:#fff;font-weight:700}
.sidebar-header small{color:var(--sidebarText);font-size:.7rem}
.sidebar-search{padding:.6rem .8rem}
.sidebar-search input{width:100%;padding:.4rem .7rem;border-radius:6px;border:1px solid #475569;background:#0f172a;color:#e2e8f0;font-size:.78rem}
.sidebar-search input::placeholder{color:#64748b}
.nav-group{padding:.4rem 0}
.nav-group-label{padding:.4rem 1rem .2rem;font-size:.65rem;text-transform:uppercase;color:#64748b;letter-spacing:1.2px;font-weight:700}
.nav-parent{display:flex;align-items:center;gap:.5rem;padding:.5rem 1rem;cursor:pointer;font-size:.82rem;color:var(--sidebarText);transition:all .15s;user-select:none}
.nav-parent:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-parent.active{background:var(--sidebarActive);color:var(--accent);font-weight:600}
.nav-parent .icon{width:20px;text-align:center;font-size:.85rem}
.nav-parent .label{flex:1}
.nav-parent .arrow{font-size:.6rem;transition:transform .2s;color:#64748b}
.nav-parent.open .arrow{transform:rotate(90deg)}
.nav-children{max-height:0;overflow:hidden;transition:max-height .25s ease}
.nav-children.open{max-height:500px}
.nav-child{display:flex;align-items:center;gap:.5rem;padding:.4rem 1rem .4rem 2.8rem;cursor:pointer;font-size:.78rem;color:#94a3b8;transition:all .15s;border-left:2px solid transparent}
.nav-child:hover{background:rgba(255,255,255,.04);color:#e2e8f0}
.nav-child.active{color:var(--accent);border-left-color:var(--accent);font-weight:600;background:rgba(249,115,22,.08)}
.nav-child .dot{width:5px;height:5px;border-radius:50%;background:#475569;flex-shrink:0}
.nav-child.active .dot{background:var(--accent)}
.nav-section-sep{border-top:1px solid #334155;margin:.3rem 1rem}
.main{margin-left:260px;flex:1;padding:1.5rem;min-height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:.5rem}
.topbar h1{font-size:1.3rem;font-weight:700;color:#1e293b}
.topbar .subtitle{font-size:.75rem;color:var(--dim);margin-top:.1rem}
.btn{padding:.5rem 1rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);cursor:pointer;font-size:.8rem;transition:all .2s;display:inline-flex;align-items:center;gap:.4rem;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 2px 8px rgba(249,115,22,.12)}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.btn-accent:hover{background:var(--accent2)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-red{background:var(--red);color:#fff;border-color:var(--red)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.2rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h3{font-size:.9rem;margin-bottom:.6rem;color:#334155;font-weight:600}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1rem}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:transform .15s,box-shadow .15s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.stat-card .value{font-size:1.6rem;font-weight:800;color:var(--accent)}
.stat-card .label{font-size:.72rem;color:var(--dim);margin-top:.3rem;font-weight:500}
.stat-card .icon{font-size:1.5rem;margin-bottom:.3rem;opacity:.7}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{padding:.55rem .7rem;text-align:left;border-bottom:1px solid var(--border)}
th{background:#f8f9fa;color:var(--dim);font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;font-weight:600}
tr:hover{background:rgba(249,115,22,.03)}
.badge-draft{background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:600}
.badge-active{background:#d1fae5;color:#065f46;padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:600}
.badge-done{background:#dbeafe;color:#1e40af;padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:600}
.badge-danger{background:#fee2e2;color:#991b1b;padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:600}
.form-group{margin-bottom:.8rem}
.form-group label{display:block;font-size:.75rem;font-weight:600;color:#475569;margin-bottom:.3rem}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:.5rem .7rem;background:#fff;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.82rem;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(249,115,22,.1)}
.form-group textarea{min-height:60px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.8rem}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:1rem}
.tab{padding:.5rem 1rem;cursor:pointer;font-size:.82rem;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;font-weight:500}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;padding:.7rem 1.2rem;border-radius:8px;font-size:.82rem;z-index:9999;animation:slideIn .3s;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast-success{background:#065f46;color:#fff}
.toast-error{background:#991b1b;color:#fff}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1rem;max-width:1300px;width:96vw;max-height:92vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.modal h2{font-size:1rem;margin-bottom:1rem;color:#334155;font-weight:600}
.empty{text-align:center;padding:3rem;color:var(--dim);font-size:.85rem}
.progress-bar{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin-top:.3rem}
.progress-bar .fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.search-box{padding:.5rem .8rem;background:#fff;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.82rem;width:250px}
.search-box:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(249,115,22,.1)}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.show{transform:translateX(0)}.main{margin-left:0}.form-row,.form-row-3{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr 1fr}}

.sidebar { transition: width .25s ease, transform .25s ease; }
.sidebar.collapsed { width: 70px !important; }
.sidebar.collapsed .logo div:nth-child(2),
.sidebar.collapsed .sidebar-search,
.sidebar.collapsed .nav-group-label,
.sidebar.collapsed .label,
.sidebar.collapsed .arrow,
.sidebar.collapsed .nav-children { display: none !important; }
.sidebar.collapsed .sidebar-header { justify-content: center; padding: 1rem 0.5rem; }
.sidebar.collapsed .nav-parent { justify-content: center; padding: 0.75rem 0; gap: 0; }
.sidebar.collapsed .nav-parent .icon { font-size: 1.25rem; margin: 0; }

.sidebar-action-btn { background: none; border: none; color: var(--dim); cursor: pointer; padding: 4px 6px; border-radius: 6px; font-size: 0.85rem; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s; }
.sidebar-action-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
.sidebar.pinned { border-right: 2px solid #f97316; box-shadow: 4px 0 25px rgba(0,0,0,0.3); }
/* Desktop : quand la sidebar est repliée, le contenu s'élargit (comme index) */
.sidebar.collapsed + .main { margin-left: 70px; }
/* Overlay mobile (comme index) : clic dessus = fermeture */
#sidebarOverlay { display: none; }
@media(max-width:768px) {
  #sidebarOverlay.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 90; }
  .sidebar.show { z-index: 100; }
}

/* Temporary hover expansion when collapsed */
.sidebar.collapsed:hover { width: 260px !important; z-index: 160; box-shadow: 8px 0 30px rgba(0,0,0,0.3); }
.sidebar.collapsed:hover .logo div:nth-child(2),
.sidebar.collapsed:hover .sidebar-search,
.sidebar.collapsed:hover .nav-group-label,
.sidebar.collapsed:hover .label,
.sidebar.collapsed:hover .arrow { display: block !important; }
.sidebar.collapsed:hover .sidebar-header { justify-content: space-between; padding: 1rem 1.2rem; }
.sidebar.collapsed:hover .nav-parent { justify-content: flex-start; padding: .65rem .9rem; gap: .75rem; }

</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header" style="display:flex;align-items:center;justify-content:space-between;width:100%">
    <div class="logo" style="display:flex;align-items:center;gap:0.6rem">
      <div class="logo-icon">🏭</div>
      <div>
        <h2 style="font-size:1.05rem;margin:0">SmartStock</h2>
        <small style="font-size:0.7rem;color:var(--dim)">Production & Stock</small>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:2px">
      <button class="sidebar-action-btn" id="sidebarPinBtn" onclick="toggleSidebarPin()" title="Épingler le menu (Toujours visible)">📌</button>
      <button class="sidebar-action-btn" id="sidebarCollapseBtn" onclick="toggleSidebarCollapse()" title="Replier / Déplier le menu">◀</button>
    </div>
  </div>
  <div class="sidebar-search">
    <input type="text" placeholder="Rechercher un menu..." id="menuSearch" oninput="filterMenus(this.value)">
  </div>
  <nav id="nav"></nav>
  <div class="nav-section-sep"></div>
  <div style="padding:.5rem 0">
    <div class="nav-parent" onclick="window.location.href='index.html'">
      <span class="icon">⚙️</span>
      <span class="label">Paramètres</span>
    </div>
    <div class="nav-parent" onclick="window.location.href='index.html'" style="color:#ef4444">
      <span class="icon">🚪</span>
      <span class="label">Déconnexion</span>
    </div>
  </div>
  <div style="margin-top:auto;padding:.6rem;border-top:1px solid #334155">
    <a href="index.html" style="color:#64748b;font-size:.72rem;text-decoration:none;display:flex;align-items:center;gap:.3rem">← Retour à Montabbord</a>
  </div>
</aside>
<div id="sidebarOverlay" onclick="closeSidebar()"></div>

<main class="main" id="app">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:.8rem">
      <button class="btn" onclick="toggleSidebar()" style="display:none" id="menuBtn">☰</button>
      <h1 id="pageTitle">Tableau de Bord</h1>
    </div>
    <div style="display:flex;gap:.5rem;align-items:center">
      <input type="text" class="search-box" placeholder="🔍 Rechercher..." id="globalSearch" oninput="globalSearchFn(this.value)">
      <span style="font-size:.75rem;color:var(--dim)" id="dateDisplay"></span>
    </div>
  </div>
  <div id="content"></div>
</main>

<script>
/* ==================== CONFIG ==================== */
var DB_KEY = 'mdb_production';
var CURRENT_PAGE = 'dashboard';

function getDB() { try { return JSON.parse(localStorage.getItem(DB_KEY)) || {}; } catch(e) { return {}; } }
function setDB(v) { localStorage.setItem(DB_KEY, JSON.stringify(v)); }
function getSection(key, def) { var db = getDB(); return db[key] !== undefined ? db[key] : def; }
function setSection(key, val) { var db = getDB(); db[key] = val; setDB(db); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }
function today() { return new Date().toISOString().slice(0, 10); }
function thisMonth() { return new Date().toISOString().slice(0, 7); }
function fmt(n) { return new Intl.NumberFormat('fr-FR').format(Math.floor(n || 0)); }
function fmtF(n) { return fmt(n) + ' F'; }
function escH(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function toast(msg, type) {
  var t = document.createElement('div');
  t.className = 'toast toast-' + (type || 'success');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 3000);
}
function confirm2(msg) { return window.confirm(msg); }

/* ==================== NAVIGATION ==================== */
var NAV = [
  { group: 'ACCUEIL', items: [
    { id: 'dashboard', label: 'Tableau de bord', icon: '📊' }
  ]},
  { group: 'EXPLOITATION', items: [
    { id: 'production', label: 'Production', icon: '⚙️', children: [
      { id: 'production', label: 'Nouvelle Saisie' },
      { id: 'history', label: 'Historique Production' },
      { id: 'orders', label: 'Ordres de Production' }
    ]},
    { id: 'stock', label: 'Stock', icon: '📦', children: [
      { id: 'stock-palettes', label: 'Gestion Palettes' },
      { id: 'stock-raw', label: 'Matière première' },
      { id: 'stock-merch', label: 'Marchandises' },
      { id: 'stock-consum', label: 'Consommables' },
      { id: 'inventory', label: 'Inventaire' },
      { id: 'stock-movements', label: 'Mouvements' }
    ]},
    { id: 'thermal', label: 'Traitement thermique', icon: '🌡️', children: [
      { id: 'thermal', label: 'Opérations' },
      { id: 'thermal-types', label: 'Types de produits' }
    ]}
  ]},
  { group: 'NOMENCLATURE ARTICLES', items: [
    { id: 'articles-group', label: 'Articles', icon: '📑', children: [
      { id: 'articles', label: 'Catalogue Produits' },
      { id: 'fiche-tech', label: 'Fiche Technique' },
      { id: 'definitions', label: 'Définitions Composants' },
      { id: 'stock-merch-art', label: 'Marchandises' },
      { id: 'species', label: 'Gestion des Essences' }
    ]}
  ]},
  { group: 'APPROVISIONNEMENT', items: [
    { id: 'achats-group', label: 'Achat', icon: '🛒', children: [
      { id: 'achats', label: 'Saisie Achat' },
      { id: 'achats-history', label: 'Historique Achats' }
    ]}
  ]},
  { group: 'LOGISTIQUE ET COMMERCIAL', items: [
    { id: 'cost-price', label: 'Coût de Revient', icon: '💰' },
    { id: 'prestation-group', label: 'Prestations', icon: '🔧', children: [
      { id: 'preventive', label: 'Préventive' },
      { id: 'corrective', label: 'Corrective' }
    ]}
  ]},
  { group: 'GÉNÉRAL', items: [
    { id: 'reports', label: 'Rapports', icon: '📈' },
    { id: 'rh-group', label: 'RH & Présence', icon: '👤', children: [
      { id: 'rh-dashboard', label: 'Tableau de Bord RH' },
      { id: 'departments', label: 'Départements' },
      { id: 'positions', label: 'Fonctions' },
      { id: 'presence', label: 'Présence & Pointage' },
      { id: 'daily-attendance', label: 'Pointage Journalier' },
      { id: 'epi', label: 'Gestion EPI' },
      { id: 'leaves', label: 'Congés' },
      { id: 'sanctions', label: 'Sanctions Disciplinaires' }
    ]}
  ]}
];

var OPEN_GROUPS = JSON.parse(localStorage.getItem('mdb_prod_openGroups') || '{}');

function toggleGroup(itemId) {
  /* Si la sidebar est repliée (icônes seules), la déplier d'abord sinon le sous-menu reste invisible */
  var sb = document.getElementById('sidebar');
  if (sb && window.innerWidth > 768 && sb.classList.contains('collapsed') && !_sidebarPinned) {
    _sidebarCollapsed = false;
    sb.classList.remove('collapsed');
    try { localStorage.setItem('mdb_sidebarCollapsed', '0'); } catch(e) {}
    _sbExpandTime = Date.now();
    updateSidebarButtonsUI();
  }
  /* Bascule indépendante : ouvrir un menu ne ferme plus les autres */
  OPEN_GROUPS[itemId] = !OPEN_GROUPS[itemId];
  localStorage.setItem('mdb_prod_openGroups', JSON.stringify(OPEN_GROUPS));
  renderNav();
}

function renderNav() {
  var h = '';
  NAV.forEach(function(g) {
    h += '<div class="nav-group">';
    h += '<div class="nav-group-label">' + escH(g.group) + '</div>';
    g.items.forEach(function(item) {
      if (item.children) {
        var isOpen = OPEN_GROUPS[item.id] || false;
        var hasActive = item.children.some(function(c) { return CURRENT_PAGE === c.id; });
        h += '<div class="nav-parent' + (isOpen ? ' open' : '') + (hasActive ? ' active' : '') + '" onclick="toggleGroup(\x27' + escH(item.id) + '\x27)">';
        h += '<span class="icon">' + item.icon + '</span>';
        h += '<span class="label">' + escH(item.label) + '</span>';
        h += '<span class="arrow">' + (isOpen ? '▼' : '▶') + '</span>';
        h += '</div>';
        h += '<div class="nav-children' + (isOpen ? ' open' : '') + '">';
        item.children.forEach(function(c) {
          h += '<div class="nav-child' + (CURRENT_PAGE === c.id ? ' active' : '') + '" onclick="navigate(\x27' + c.id + '\x27)">';
          h += '<span class="dot"></span>' + escH(c.label);
          h += '</div>';
        });
        h += '</div>';
      } else {
        h += '<div class="nav-parent' + (CURRENT_PAGE === item.id ? ' active' : '') + '" onclick="navigate(\x27' + item.id + '\x27)">';
        h += '<span class="icon">' + item.icon + '</span>';
        h += '<span class="label">' + escH(item.label) + '</span>';
        h += '</div>';
      }
    });
    h += '</div>';
  });
  document.getElementById('nav').innerHTML = h;
}

function filterMenus(q) {
  var items = document.querySelectorAll('.nav-parent, .nav-child');
  var groups = document.querySelectorAll('.nav-group');
  q = q.toLowerCase();
  groups.forEach(function(g) {
    var children = g.querySelectorAll('.nav-parent, .nav-child');
    var anyVisible = false;
    children.forEach(function(c) {
      var match = c.textContent.toLowerCase().indexOf(q) !== -1;
      c.style.display = match || !q ? '' : 'none';
      if (match || !q) anyVisible = true;
    });
    g.style.display = anyVisible || !q ? '' : 'none';
  });
}

function navigate(page) {
  CURRENT_PAGE = page;
  localStorage.setItem('mdb_prod_currentPage', page);
  renderNav();
  renderPage();
  if (window.innerWidth <= 768) closeSidebar();
}

function isMobileView() { return window.innerWidth <= 768; }

function toggleSidebar() {
  /* ☰ : sur mobile ouvre/ferme le tiroir, sur desktop replie/déplie (comme index) */
  var sb = document.getElementById('sidebar');
  if (!sb) return;
  if (isMobileView()) {
    if (sb.classList.contains('show')) closeSidebar();
    else {
      sb.classList.add('show');
      var ov = document.getElementById('sidebarOverlay');
      if (ov) ov.classList.add('open');
    }
  } else {
    toggleSidebarCollapse();
  }
}

function closeSidebar() {
  var sb = document.getElementById('sidebar');
  if (sb) sb.classList.remove('show');
  var ov = document.getElementById('sidebarOverlay');
  if (ov) ov.classList.remove('open');
}

var PAGE_TITLES = {
  'dashboard': 'Tableau de bord',
  'production': 'Nouvelle Saisie de Production',
  'history': 'Historique Production',
  'orders': 'Ordres de Production',
  'stock-palettes': 'Gestion Palettes',
  'stock-raw': 'Stock Matière Première',
  'stock-merch': 'Stock Marchandises',
  'stock-consum': 'Stock Consommables',
  'inventory': 'Inventaire',
  'stock-movements': 'Mouvements de Stock',
  'thermal': 'Traitement Thermique — Opérations',
  'thermal-types': 'Types de Produits Thermiques',
  'articles': 'Catalogue Produits',
  'fiche-tech': 'Fiche Technique',
  'definitions': 'Définitions Composants',
  'species': 'Gestion des Essences',
  'achats': 'Saisie Achat',
  'achats-history': 'Historique des Achats',
  'achats-history': 'Historique Achats',
  'stock-finished-ach': 'Achats — Produits Finis',
  'stock-semi-ach': 'Achats — Semis Finis',
  'stock-raw-ach': 'Achats — Matière Première',
  'stock-consum-ach': 'Achats — Consommables & Divers',
  'cost-price': 'Coût de Revient',
  'preventive': 'Maintenance Préventive',
  'corrective': 'Maintenance Corrective',
  'reports': 'Rapports',
  'rh-dashboard': 'Tableau de Bord RH',
  'departments': 'Départements',
  'positions': 'Fonctions',
  'presence': 'Présence & Pointage',
  'daily-attendance': 'Pointage Journalier',
  'epi': 'Gestion EPI',
  'leaves': 'Congés',
  'sanctions': 'Sanctions Disciplinaires'
};

function renderPage() {

/* ==================== DASHBOARD ==================== */
function calcVolume(length, width, thickness) {
  return (parseFloat(length) || 0) * (parseFloat(width) || 0) * (parseFloat(thickness) || 0) / 1000000;
}

function getStockVolume() {
  var articles = getArticles();
  var totalVol = 0;
  var finishedVol = 0, semiVol = 0, rawVol = 0;
  
  getStockFinished().forEach(function(s) {
    var art = articles.find(function(a) { return a.id === s.article_id; });
    if (art && art.dimensions) {
      var dims = art.dimensions.split('x');
      if (dims.length === 3) {
        var vol = calcVolume(dims[0], dims[1], dims[2]) * (s.quantite || 0);
        finishedVol += vol;
        totalVol += vol;
      }
    }
  });
  
  getStockSemi().forEach(function(s) {
    var art = articles.find(function(a) { return a.id === s.article_id; });
    if (art && art.length && art.width && art.thickness) {
      var vol = calcVolume(art.length, art.width, art.thickness) * (s.quantite || 0);
      semiVol += vol;
      totalVol += vol;
    }
  });
  
  getStockRaw().forEach(function(s) {
    var art = articles.find(function(a) { return a.id === s.article_id; });
    if (art && art.length && art.width && art.thickness) {
      var vol = calcVolume(art.length, art.width, art.thickness) * (s.quantite || 0);
      rawVol += vol;
      totalVol += vol;
    }
  });
  
  return { total: totalVol, finished: finishedVol, semi: semiVol, raw: rawVol };
}

  var cls = 'badge-draft';
  if (s === 'en_cours' || s === 'validated' || s === 'active' || s === 'approuve' || s === 'traite') cls = 'badge-active';

function encoursTotals() {
  var totalQ = 0, totalV = 0, volEntree = 0, volReprise = 0;
  document.querySelectorAll('#encBody tr[id^="encRow"]').forEach(function(r) {
    var inputs = r.querySelectorAll('input[type="number"]');
    if (inputs.length < 4) return;
    totalQ += parseFloat(inputs[0].value) || 0;
    var l = parseFloat(inputs[1].value) || 0, w = parseFloat(inputs[2].value) || 0, t = parseFloat(inputs[3].value) || 0;
    var v = l * w * t / 1000000;
    totalV += v;
    var sel = r.querySelector('select[data-wiptype]');
    if (sel && sel.value === 'reprise') volReprise += v; else volEntree += v;
  });
  return { qte: totalQ, vol: totalV, entree: volEntree, reprise: volReprise };
}
function calcEncoursTotals() {
  var t = encoursTotals();
  var tq = document.getElementById('enc_total_qte');
  var tv = document.getElementById('enc_total_vol');
  if (tq) tq.textContent = t.qte;
  if (tv) tv.textContent = t.vol.toFixed(4);
  updateProductionSummary();
}

/* === RÉSUMÉ DE PRODUCTION (mise à jour live, bilan façon ACSER) === */
function updateProductionSummary() {
  /* Volume bois sorti */
  var sbVolEl = document.getElementById('sb_total_vol');
  var sbVol = sbVolEl ? (parseFloat(sbVolEl.textContent) || 0) : 0;

  /* Volume Lattes */
  var latteVolEl = document.getElementById('latte_total_vol');
  var latteVol = latteVolEl ? (parseFloat(latteVolEl.textContent) || 0) : 0;

  /* Volume Plots */
  var plotVolEl = document.getElementById('plot_total_vol');
  var plotVol = plotVolEl ? (parseFloat(plotVolEl.textContent) || 0) : 0;

  /* Volume CP */
  var cpVolEl = document.getElementById('cp_total_vol');
  var cpVol = cpVolEl ? (parseFloat(cpVolEl.textContent) || 0) : 0;

  /* En-cours : entrée (+) / reprise (+) base matière comme ACSER */
  var enc = encoursTotals();
  var totalProd = latteVol + plotVol + cpVol + enc.entree;
  var base = sbVol + enc.reprise;
  var rendement = base > 0 ? (totalProd / base * 100) : 0;

  var el;
  el = document.getElementById('summary_sb_vol');    if (el) el.textContent = sbVol.toFixed(4) + ' m³';
  el = document.getElementById('summary_latte_vol'); if (el) el.textContent = latteVol.toFixed(4) + ' m³';
  el = document.getElementById('summary_plot_vol');  if (el) el.textContent = plotVol.toFixed(4) + ' m³';
  el = document.getElementById('summary_cp_vol');    if (el) el.textContent = cpVol.toFixed(4) + ' m³';
  el = document.getElementById('summary_enc_vol');   if (el) el.textContent = enc.entree.toFixed(4) + ' m³';
  el = document.getElementById('summary_total_prod_vol'); if (el) el.textContent = totalProd.toFixed(4) + ' m³';
  el = document.getElementById('summary_rendement'); if (el) {
    el.textContent = rendement.toFixed(1) + ' %';
    el.style.color = rendement >= 80 ? 'var(--green)' : rendement >= 60 ? 'var(--orange)' : 'var(--red)';
  }
}

function getSharedFournisseurs() {
  var suppliers = [];

  // 1. Try mdb_fournisseurs from main app (Gestion Commerciale -> Compte Tiers -> Fournisseurs)
  try {
    var raw = localStorage.getItem('mdb_fournisseurs') || localStorage.getItem('acser_fournisseurs') || localStorage.getItem('suppliers');
    if (raw) suppliers = JSON.parse(raw);
  } catch(e) {}

  // 2. Try mdb_app_state from main app
  if (!suppliers || suppliers.length === 0) {
    try {
      var stateRaw = localStorage.getItem('mdb_app_state');
      if (stateRaw) {
        var state = JSON.parse(stateRaw);
        if (state.suppliers && state.suppliers.length) suppliers = state.suppliers;
        else if (state.fournisseurs && state.fournisseurs.length) suppliers = state.fournisseurs;
      }
    } catch(e) {}
  }

  // Fallback defaults if empty
  if (!suppliers || suppliers.length === 0) {
    suppliers = [
      { id: 1, name: 'FOURNISSEUR BOIS CI', company_name: 'FOURNISSEUR BOIS CI' },
      { id: 2, name: 'TROPICAL TIMBER', company_name: 'TROPICAL TIMBER' },
      { id: 3, name: 'SCIERIE DU NORD', company_name: 'SCIERIE DU NORD' },
      { id: 4, name: 'AFRICA SCIAGE', company_name: 'AFRICA SCIAGE' }
    ];
  }

  // Normalize structure
  return suppliers.map(function(s) {
    if (typeof s === 'string') return { id: s, name: s, company_name: s };
    var n = s.nom || s.company_name || s.name || s.raison_sociale || s.libelle || 'Fournisseur';
    return { id: s.id || n, name: n, company_name: n };
  });
}

function getSharedClients() {

}

  var composants = getSection('composants', []).filter(function(c) { return c.article_id === articleId; });
  var lattes = composants.filter(function(c) { return c.type === 'LATTE'; });
  var plots = composants.filter(function(c) { return c.type === 'PLOT'; });
  var cps = composants.filter(function(c) { return c.type === 'CP'; });

  document.getElementById('lattesBody').innerHTML = '';
  document.getElementById('plotsBody').innerHTML = '';
  document.getElementById('cpBody').innerHTML = '';
  _latteIdx = 0; _plotIdx = 0; _cpIdx = 0;

  lattes.forEach(function(c) { addLigneLattes(c.code, c.designation || c.code, c.quantity, c.length, c.width, c.thickness); });

function saveProduction(validate) {
  var date = (document.getElementById('prod_date') || {}).value || today();
  var article_id = (document.getElementById('prod_article_id') || {}).value || '';
  var chef = (document.getElementById('prod_chef') || {}).value || '';
  var tauxPerte = parseFloat((document.getElementById('prod_taux_perte') || {}).value) || 5;
  var observations = (document.getElementById('prod_observations') || {}).value || '';
  var sel = document.getElementById('prod_employes');
  var employes = [];
  if (sel) for (var i = 0; i < sel.options.length; i++) { if (sel.options[i].selected) employes.push(sel.options[i].value); }

  if (!date) return toast('Sélectionnez la date', 'error');

  /* Collecter les lignes Sortie Bois */
  var sortieBois = [];
  document.querySelectorAll('#sortieBoisLignes table tr[id^="sortieBoisRow"]').forEach(function(r) {
    var idx = r.id.replace('sortieBoisRow', '');
    var code = (document.getElementById('sb_code_' + idx) || {}).value || '';
    if (!code) return;
    sortieBois.push({
      code: code,
      date: (document.getElementById('sb_date_' + idx) || {}).value || date,
      libelle: (document.getElementById('sb_libelle_' + idx) || {}).value || '',
      essence: (document.getElementById('sb_essence_' + idx) || {}).value || '',
      fournisseur: (document.getElementById('sb_fournisseur_' + idx) || {}).value || '',
      qte: parseFloat((document.getElementById('sb_qte_' + idx) || {}).value) || 0,
      long: parseFloat((document.getElementById('sb_long_' + idx) || {}).value) || 0,
      larg: parseFloat((document.getElementById('sb_larg_' + idx) || {}).value) || 0,
      epais: parseFloat((document.getElementById('sb_epais_' + idx) || {}).value) || 0,
      volume: parseFloat((document.getElementById('sb_vol_' + idx) || {}).textContent) || 0,
    });
  });

  var volSortieBois = sortieBois.reduce(function(s, l) { return s + l.volume; }, 0);

  /* Collecter les lignes Lattes */
  var lattes = [];
  document.querySelectorAll('#lattesBody tr[id^="latteRow"]').forEach(function(r) {
    var inputs = r.querySelectorAll('input[type="number"]');
    if (!inputs.length) return;
    var texts = r.querySelectorAll('input[type="text"]');
    var vol = parseFloat((r.querySelector('[id^="latte_vol_"]') || {}).textContent) || 0;
    var qte = parseFloat(inputs[0].value)||0;
    if (!qte && !(texts[0] && texts[0].value)) return;
    lattes.push({ code: texts[0] ? texts[0].value : '', designation: texts[1] ? texts[1].value : '', qte: qte, long: parseFloat(inputs[1].value)||0, larg: parseFloat(inputs[2].value)||0, epais: parseFloat(inputs[3].value)||0, volume: vol });
  });

  /* Collecter les lignes Plots */
  var plots = [];
  document.querySelectorAll('#plotsBody tr[id^="plotRow"]').forEach(function(r) {
    var inputs = r.querySelectorAll('input[type="number"]');
    if (!inputs.length) return;
    var texts = r.querySelectorAll('input[type="text"]');
    var vol = parseFloat((r.querySelector('[id^="plot_vol_"]') || {}).textContent) || 0;
    var qte = parseFloat(inputs[0].value)||0;
    if (!qte && !(texts[0] && texts[0].value)) return;
    plots.push({ code: texts[0] ? texts[0].value : '', designation: texts[1] ? texts[1].value : '', qte: qte, long: parseFloat(inputs[1].value)||0, larg: parseFloat(inputs[2].value)||0, epais: parseFloat(inputs[3].value)||0, volume: vol });
  });

  /* Collecter les lignes CP */
  var cps = [];
  document.querySelectorAll('#cpBody tr[id^="cpRow"]').forEach(function(r) {
    var inputs = r.querySelectorAll('input[type="number"]');
    if (!inputs.length) return;
    var texts = r.querySelectorAll('input[type="text"]');
    var vol = parseFloat((r.querySelector('[id^="cp_vol_"]') || {}).textContent) || 0;
    var qte = parseFloat(inputs[0].value)||0;
    if (!qte && !(texts[0] && texts[0].value)) return;
    cps.push({ code: texts[0] ? texts[0].value : '', type_cp: texts[1] ? texts[1].value : '', qte: qte, long: parseFloat(inputs[1].value)||0, larg: parseFloat(inputs[2].value)||0, epais: parseFloat(inputs[3].value)||0, volume: vol, lot: texts[2] ? texts[2].value : '' });
  });

  /* Collecter les lignes Assemblage */
  var assemblage = [];
  document.querySelectorAll('#assBody tr[id^="assRow"]').forEach(function(r) {
    var inputs = r.querySelectorAll('input[type="number"]');
    if (!inputs.length) return;
    var texts = r.querySelectorAll('input[type="text"]');
    var qte = parseFloat(inputs[0].value)||0;
    if (!qte && !(texts[0] && texts[0].value)) return;
    assemblage.push({ code: texts[0] ? texts[0].value : '', designation: texts[1] ? texts[1].value : '', qte: qte, long: parseFloat(inputs[1].value)||0, larg: parseFloat(inputs[2].value)||0, epais: parseFloat(inputs[3].value)||0 });
  });

  /* Collecter les lignes En-cours (wip ACSER : entrée / reprise) */
  var encours = [];
  document.querySelectorAll('#encBody tr[id^="encRow"]').forEach(function(r) {
    var inputs = r.querySelectorAll('input[type="number"]');
    if (inputs.length < 4) return;
    var texts = r.querySelectorAll('input[type="text"]');
    var vol = parseFloat((r.querySelector('[id^="enc_vol_"]') || {}).textContent) || 0;
    var qte = parseFloat(inputs[0].value)||0;
    if (!qte && !(texts[0] && texts[0].value)) return;
    var sel = r.querySelector('select[data-wiptype]');
    encours.push({ code: texts[0] ? texts[0].value : '', designation: texts[1] ? texts[1].value : '', qte: qte, long: parseFloat(inputs[1].value)||0, larg: parseFloat(inputs[2].value)||0, epais: parseFloat(inputs[3].value)||0, volume: vol, wip_type: sel ? sel.value : 'entrée', operateur: texts[2] ? texts[2].value : '' });
  });

  var volLattes = lattes.reduce(function(s, l) { return s + l.volume; }, 0);
  var volPlots = plots.reduce(function(s, l) { return s + l.volume; }, 0);
  var volCP = cps.reduce(function(s, l) { return s + l.volume; }, 0);
  var volEncEntree = encours.filter(function(l) { return l.wip_type !== 'reprise'; }).reduce(function(s, l) { return s + l.volume; }, 0);
  var volEncReprise = encours.filter(function(l) { return l.wip_type === 'reprise'; }).reduce(function(s, l) { return s + l.volume; }, 0);
  var volTotal = volLattes + volPlots + volCP + volEncEntree;
  var rendement = (volSortieBois + volEncReprise) > 0 ? (volTotal / (volSortieBois + volEncReprise) * 100) : 0;

  var prod = {
    id: genId(),
    numero: nextProdNumber(),
    date: date,
    article_id: article_id,
    chef: chef,
    taux_perte: tauxPerte,
    employes: employes,
    observations: observations,
    sortie_bois: sortieBois,
    lattes: lattes,
    plots: plots,
    cp: cps,
    assemblage: assemblage,
    encours: encours,
    vol_sortie_bois: volSortieBois,
    vol_lattes: volLattes,
    vol_plots: volPlots,
    vol_cp: volCP,
    vol_enc_entree: volEncEntree,
    vol_enc_reprise: volEncReprise,
    vol_total: volTotal,
    rendement: rendement,
    statut: validate ? 'validated' : 'draft',
    created_at: new Date().toISOString(),
  };
  var prods = getProductions();
  prods.push(prod);
  setProductions(prods);

  if (validate) {
    /* Déduire du stock les bois sortis */
    sortieBois.forEach(function(sb) {
      if (sb.code) {
        var stockRaw = getStockRaw();
        var item = stockRaw.find(function(s) { return s.code === sb.code; });
        if (item) { item.quantite = Math.max(0, (item.quantite || 0) - sb.qte); item.updated_at = new Date().toISOString(); setStockRaw(stockRaw); }
      }
    });
    toast('Fiche de Production validée ✅ — Rendement: ' + rendement.toFixed(1) + '%');
  } else {
    toast('Fiche enregistrée en brouillon 💾');
  }
  navigate('history');
}

function updateStockArticle(articleId, qty, type, ref, numero) {
  var article = getArticles().find(function(a) { return a.id === articleId; });
  if (!article) return;
  var cat = article.categorie || 'finished';
  var stockList, setFn;
  if (cat === 'finished') { stockList = getStockFinished(); setFn = setStockFinished; }
  else if (cat === 'semi') { stockList = getStockSemi(); setFn = setStockSemi; }
  else if (cat === 'lattes') { stockList = getStockSemi(); setFn = setStockSemi; }
  else if (cat === 'raw') { stockList = getStockRaw(); setFn = setStockRaw; }
  else if (cat === 'consum') { stockList = getStockConsum(); setFn = setStockConsum; }
  else if (cat === 'merch' || cat === 'merchandise') { stockList = getStockMerch(); setFn = setStockMerch; }
  else { stockList = getStockFinished(); setFn = setStockFinished; }

  var existing = stockList.find(function(s) { return s.article_id === articleId; });
  if (existing) {
    existing.quantite = (existing.quantite || 0) + (type === 'entree' ? qty : -qty);
    existing.updated_at = new Date().toISOString();
  } else {
    stockList.push({ id: genId(), article_id: articleId, quantite: type === 'entree' ? qty : 0, created_at: new Date().toISOString() });
  }
  setFn(stockList);

  /* SYNC → mdb_stocks (pour que l'app principale voie le stock) */
  try {
    var mainStocks = JSON.parse(localStorage.getItem('mdb_stocks')) || [];
    var mainArt = mainStocks.find(function(s) { return s.code === article.code || s.article_id === articleId; });
    if (mainArt) {
      mainArt.qte = (mainArt.qte || 0) + (type === 'entree' ? qty : -qty);
      mainArt.date = today();
    } else {
      mainStocks.push({
        id: 'prod_' + genId(),
        code: article.code || articleId,
        designation: article.designation || '',
        qte: type === 'entree' ? qty : 0,
        prixUnitaire: article.prix_revient || 0,
        date: today(),
        categorie: cat
      });
    }
    localStorage.setItem('mdb_stocks', JSON.stringify(mainStocks));
  } catch(e) {}

  var movements = getMovements();
  movements.push({
    id: genId(), date: today(), type: type, article_id: articleId,
    quantite: qty, reference: ref, motif: 'Saisie production ' + numero,
    created_at: new Date().toISOString()
  });
  setMovements(movements);
}

/* ==================== HISTORIQUE ==================== */
function render_history() {
  var prods = getProductions().slice().reverse();
  var losses = getLosses().slice().reverse();
  var tab = getSection('historyTab', 'saisies');

  var h = '<div class="tabs">';
  h += '<div class="tab' + (tab === 'saisies' ? ' active' : '') + '" onclick="setSection(\'historyTab\',\'saisies\');renderPage()">📋 Fiches de Production (' + prods.length + ')</div>';
  h += '<div class="tab' + (tab === 'losses' ? ' active' : '') + '" onclick="setSection(\'historyTab\',\'losses\');renderPage()">⚠️ Pertes (' + losses.length + ')</div>';
  h += '</div>';

  if (tab === 'saisies') {
    if (prods.length === 0) return h + '<div class="empty">Aucune fiche de production</div>';
    h += '<div class="card"><table><tr><th>N°</th><th>Date</th><th>Article / Produit</th><th>Chef Projet</th><th style="text-align:right">Vol. Bois Sorti</th><th style="text-align:right">Vol. Lattes</th><th style="text-align:right">Vol. Plots</th><th style="text-align:right">Rendement</th><th>Statut</th><th>Actions</th></tr>';
    prods.forEach(function(p) {
      var art = getArticles().find(function(a) { return a.id === p.article_id; });
      var rend = p.rendement != null ? p.rendement : (p.quantite != null ? '-' : 0);
      var rendColor = (parseFloat(rend) >= 80) ? 'var(--green)' : (parseFloat(rend) >= 60 ? 'var(--orange)' : 'var(--red)');
      h += '<tr>';
      h += '<td><strong>' + escH(p.numero || '-') + '</strong></td>';
      h += '<td>' + escH(p.date || '-') + '</td>';
      h += '<td>' + escH(art ? (art.code + ' — ' + art.designation) : '-') + '</td>';
      h += '<td>' + escH(p.chef || '-') + '</td>';
      h += '<td style="text-align:right">' + ((p.vol_sortie_bois || 0).toFixed(4)) + ' m³</td>';
      h += '<td style="text-align:right">' + ((p.vol_lattes || 0).toFixed(4)) + ' m³</td>';
      h += '<td style="text-align:right">' + ((p.vol_plots || 0).toFixed(4)) + ' m³</td>';
      h += '<td style="text-align:right;font-weight:700;color:' + rendColor + '">' + (parseFloat(rend || 0).toFixed(1)) + '%</td>';
      h += '<td>' + badgeStatut(p.statut) + '</td>';
      h += '<td>';
      h += '<button class="btn" onclick="viewFicheProd(\'' + p.id + '\')" style="font-size:.7rem">👁️</button> ';
      if (p.statut === 'draft') h += '<button class="btn" onclick="validateProd(\'' + p.id + '\')" style="font-size:.7rem">✅</button> ';
      h += '<button class="btn btn-red" onclick="deleteProd(\'' + p.id + '\')" style="font-size:.7rem">🗑️</button>';
      h += '</td></tr>';
    });
    h += '</table></div>';
  } else {
    if (losses.length === 0) return h + '<div class="empty">Aucune perte enregistrée</div>';
    h += '<div class="card"><table><tr><th>Date</th><th>Article</th><th style="text-align:right">Qté perdue</th><th>Motif</th></tr>';
    losses.forEach(function(l) {
      var art = getArticles().find(function(a) { return a.id === l.article_id; });
      h += '<tr><td>' + escH(l.date) + '</td><td>' + escH(art ? art.designation : '-') + '</td><td style="text-align:right;font-weight:700;color:var(--red)">' + fmt(l.quantite) + '</td><td>' + escH(l.motif || '-') + '</td></tr>';
    });
    h += '</table></div>';
  }
  return h;
}

function validateProd(id) {
  var prods = getProductions();
  var p = prods.find(function(x) { return x.id === id; });
  if (!p) return;
  p.statut = 'validated';
  setProductions(prods);
  /* Déduire bois sorti du stock */
  if (p.sortie_bois && p.sortie_bois.length) {
    p.sortie_bois.forEach(function(sb) {
      if (sb.code) {
        var stockRaw = getStockRaw();
        var item = stockRaw.find(function(s) { return s.code === sb.code; });
        if (item) { item.quantite = Math.max(0, (item.quantite || 0) - sb.qte); item.updated_at = new Date().toISOString(); setStockRaw(stockRaw); }
      }
    });
  } else if (p.article_id && p.quantite) {
    updateStockArticle(p.article_id, p.quantite, 'entree', 'production', p.numero);
  }
  toast('Fiche validée ✅');
  renderPage();
}

/* Origine façon ACSER : BL / SPECIFIC / ENCOURS (via type "en cours") */
function mpOrigin(s) {
  if (s.origin) return s.origin;
  var t = ((s.type || '') + '').toLowerCase();
  if (t.indexOf('en cours') !== -1 || t.indexOf('encours') !== -1) return 'ENCOURS';
  return 'BL';
}

/* Dimensions : champ direct, champs séparés, ou article lié */
function stkDims(it) {
  if (it.dimensions) return it.dimensions;
  var L = it.longueur || it.length || 0, w = it.largeur || it.width || 0, t = it.epaisseur || it.thickness || 0;
  if (L || w || t) return L + 'x' + w + 'x' + t;
  if (it.article_id) {
    var a = getArticles().find(function(x) { return x.id === it.article_id; }) || {};
    if (a.dimensions) return a.dimensions;
    if (a.length || a.width || a.thickness) return (a.length || 0) + 'x' + (a.width || 0) + 'x' + (a.thickness || 0);
  }
  return '-';
}
function stkUnitVol(it) {
  var d = stkDims(it);
  var p = (d || '').split('x').map(function(x) { return parseFloat(x) || 0; });
  if (p.length < 3) return 0;
  return p[0] * p[1] * p[2] / 1000000;
}
function stkVol(it) {
  var v = parseFloat(it.volume);
  if (v) return v;
  return (parseFloat(it.quantite) || 0) * stkUnitVol(it);
}
function stkCode(it) {
  if (it.code) return it.code;
  if (it.colis_number) return it.colis_number;
  if (it.article_id) { var a = getArticles().find(function(x) { return x.id === it.article_id; }); if (a) return a.code; }
  return '-';
}
function stkDes(it) {
  if (it.designation) return it.designation;
  if (it.essence) return it.essence;
  if (it.article_id) { var a = getArticles().find(function(x) { return x.id === it.article_id; }); if (a) return a.designation; }
  return '-';
}

  var totQ = 0, totV = 0;
  items.forEach(function(s) {
    var v = stkVol(s);
    totQ += parseFloat(s.quantite) || 0;
    totV += v;
    h += '<tr><td style="font-weight:600;color:var(--accent)">' + escH(stkCode(s)) + '</td>';
    h += '<td>' + escH(stkDes(s)) + '</td>';

    h += '<td>' + escH(s.zone || s.emplacement || '-') + '</td>';
    h += '<td style="text-align:right;font-weight:700">' + (s.quantite || 0) + '</td>';
    h += '<td style="text-align:right">' + v.toFixed(3) + '</td>';
    h += '<td><button class="btn btn-red" onclick="deleteStockItem(\'' + key + '\',\'' + s.id + '\')" style="font-size:.7rem">🗑️</button></td></tr>';
  });
  h += '<tr style="font-weight:800;background:#f8f9fa"><td colspan="4" style="text-align:right">TOTAL</td><td style="text-align:right">' + totQ + '</td><td style="text-align:right">' + totV.toFixed(3) + '</td><td></td></tr>';
  h += '</table>';
  if (items.length === 0) h += '<div class="empty">Aucun article en stock</div>';
  h += '</div>';
  return h;
}

  articles.forEach(function(a) {

    var qte = stockItem ? (stockItem.quantite || 0) : 0;

function showStockTab(tab) {
  var actuel = document.getElementById('stockActuel');
  var recap = document.getElementById('stockRecap');
  var tabActuel = document.getElementById('tabActuel');
  var tabRecap = document.getElementById('tabRecap');
  if (tab === 'actuel') {
    actuel.style.display = '';
    recap.style.display = 'none';
    tabActuel.classList.add('active');
    tabRecap.classList.remove('active');
  } else {
    actuel.style.display = 'none';
    recap.style.display = '';
    tabActuel.classList.remove('active');
    tabRecap.classList.add('active');

function addStockItem(key) {
  var article_id = document.getElementById('stk_article').value;
  var qte = parseFloat(document.getElementById('stk_qte').value) || 0;
  var prix = parseFloat(document.getElementById('stk_prix').value) || 0;
  if (!article_id || qte <= 0) return toast('Remplissez les champs', 'error');
  var map = { 'stock-palettes': [getStockPalettes, setStockPalettes], 'stock-finished': [getStockFinished, setStockFinished], 'stock-semi': [getStockSemi, setStockSemi], 'stock-raw': [getStockRaw, setStockRaw], 'stock-merch': [getStockMerch, setStockMerch], 'stock-consum': [getStockConsum, setStockConsum] };
  var pair = map[key];
  if (!pair) return;
  var items = pair[0]();
  items.push({ id: genId(), article_id: article_id, quantite: qte, prix_unitaire: prix, created_at: new Date().toISOString() });
  pair[1](items);

  /* SYNC → mdb_stocks */
  try {
    var article = getArticles().find(function(a) { return a.id === article_id; });
    var mainStocks = JSON.parse(localStorage.getItem('mdb_stocks')) || [];
    mainStocks.push({
      id: 'prod_' + genId(),
      code: article ? article.code : article_id,
      designation: article ? article.designation : '',
      qte: qte,
      prixUnitaire: prix,
      date: today(),
      categorie: key.replace('stock-', '')
    });
    localStorage.setItem('mdb_stocks', JSON.stringify(mainStocks));
  } catch(e) {}

  document.getElementById('modalOverlay').remove();
  toast('Article ajouté au stock (synchronisé)');
  renderPage();
}

function deleteStockItem(key, id) {
  if (!confirm2('Supprimer cet article du stock ?')) return;
  var map = { 'stock-palettes': [getStockPalettes, setStockPalettes], 'stock-finished': [getStockFinished, setStockFinished], 'stock-semi': [getStockSemi, setStockSemi], 'stock-raw': [getStockRaw, setStockRaw], 'stock-merch': [getStockMerch, setStockMerch], 'stock-consum': [getStockConsum, setStockConsum] };
  var pair = map[key];
  if (pair) { pair[1](pair[0].filter(function(s) { return s.id !== id; })); renderPage(); }
}

/* ==================== MODAL ARTICLE (copie exacte ACSER) ==================== */
var _afCounters = { lattes: 0, plots: 0, pointe: 0, contreplaque: 0 };
var _afLimits = { lattes: 8, plots: 3, pointe: 3, contreplaque: 5 };
var _afCatToType = { lattes: 'LATTE', plots: 'PLOT', pointe: 'POINTE', contreplaque: 'CP' };
var _afTypeToCat = { LATTE: 'lattes', PLOT: 'plots', POINTE: 'pointe', CP: 'contreplaque' };

/* Définitions disponibles par catégorie (nomenclatures + définitions manuelles) */
function afDefsByCat(cat) {
  var want = _afCatToType[cat];
  var map = {};
  getSection('composants', []).forEach(function(c) {
    if (c.type === want && c.code && !map[c.code]) map[c.code] = { code: c.code, name: c.designation || c.code, long: c.length || 0, larg: c.width || 0, epais: c.thickness || 0 };
  });
  getDefinitions().forEach(function(c) {
    if (c.type === want && c.code && !map[c.code]) map[c.code] = { code: c.code, name: c.designation || c.code, long: c.length || 0, larg: c.width || 0, epais: c.thickness || 0 };
  });
  return Object.keys(map).map(function(k) { return map[k]; });
}

function afRowHTML(cat, idx, preset) {
  var p = preset || {};
  var defs = afDefsByCat(cat);
  var opts = '<option value="">Code</option>' + defs.map(function(d) {
    return '<option value="' + escH(d.code) + '"' + (p.code === d.code ? ' selected' : '') + '>' + escH(d.code) + ' - ' + escH(d.name) + '</option>';
  }).join('');
  var s = _piS('100%');
  var h = '';
  if (cat === 'pointe') {
    h += '<td style="min-width:180px"><select id="af_' + cat + '_' + idx + '_code" onchange="afOnCode(\'' + cat + '\',' + idx + ')" style="' + s + '">' + opts + '</select><div id="af_' + cat + '_' + idx + '_name" style="font-size:.65rem;color:var(--dim);padding:.1rem .2rem">' + escH(p.designation || '') + '</div></td>';
    h += '<td><input type="number" id="af_' + cat + '_' + idx + '_qte" value="' + (p.quantity != null ? p.quantity : 0) + '" min="0" style="' + _pnS('70px') + '" oninput="afRecalc(\'' + cat + '\',' + idx + ')"></td>';
    h += '<td><button class="btn btn-red" onclick="afDelRow(\'' + cat + '\',' + idx + ')" style="font-size:.65rem;padding:2px 6px">🗑️</button></td>';
  } else {
    h += '<td style="min-width:170px"><select id="af_' + cat + '_' + idx + '_code" onchange="afOnCode(\'' + cat + '\',' + idx + ')" style="' + s + '">' + opts + '</select><div id="af_' + cat + '_' + idx + '_name" style="font-size:.65rem;color:var(--dim);padding:.1rem .2rem">' + escH(p.designation || '') + '</div></td>';
    h += '<td><select id="af_' + cat + '_' + idx + '_pos" style="' + _piS('110px') + '">' + ['SUPERIEUR', 'INTERMEDIAIRE BAS', 'INTERMEDIAIRE HAUT', 'INFERIEUR'].map(function(o) { return '<option' + (p.placement === o ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></td>';
    h += '<td><input type="number" id="af_' + cat + '_' + idx + '_long" value="' + (p.length || '') + '" min="0" step="0.1" style="' + _pnS('65px') + '" oninput="afRecalc(\'' + cat + '\',' + idx + ')"></td>';
    h += '<td><input type="number" id="af_' + cat + '_' + idx + '_larg" value="' + (p.width || '') + '" min="0" step="0.1" style="' + _pnS('65px') + '" oninput="afRecalc(\'' + cat + '\',' + idx + ')"></td>';
    h += '<td><input type="number" id="af_' + cat + '_' + idx + '_epais" value="' + (p.thickness || '') + '" min="0" step="0.1" style="' + _pnS('65px') + '" oninput="afRecalc(\'' + cat + '\',' + idx + ')"></td>';
    h += '<td><input type="number" id="af_' + cat + '_' + idx + '_qte" value="' + (p.quantity != null ? p.quantity : 1) + '" min="0" style="' + _pnS('60px') + '" oninput="afRecalc(\'' + cat + '\',' + idx + ')"></td>';
    h += '<td style="text-align:right;font-weight:700;font-size:.76rem;color:var(--accent)" id="af_vol_' + cat + '_' + idx + '">0.0000</td>';
    h += '<td><button class="btn btn-red" onclick="afDelRow(\'' + cat + '\',' + idx + ')" style="font-size:.65rem;padding:2px 6px">🗑️</button></td>';
  }
  return h;
}

function afAddRow(cat, preset) {
  var body = document.getElementById('af_body_' + cat);
  if (!body) return;
  var count = body.querySelectorAll('tr').length;
  if (count >= _afLimits[cat]) return toast('Maximum ' + _afLimits[cat] + ' lignes pour ce type.', 'error');
  var idx = _afCounters[cat]++;
  var tr = document.createElement('tr');
  tr.id = 'af_row_' + cat + '_' + idx;
  tr.innerHTML = afRowHTML(cat, idx, preset);
  body.appendChild(tr);
  afRecalc(cat, idx);
}

function afDelRow(cat, idx) {
  var r = document.getElementById('af_row_' + cat + '_' + idx);
  if (r) r.remove();
  afTotal();
}

function afOnCode(cat, idx) {
  var codeEl = document.getElementById('af_' + cat + '_' + idx + '_code');
  var code = codeEl ? codeEl.value : '';
  var def = afDefsByCat(cat).find(function(d) { return d.code === code; });
  var nameEl = document.getElementById('af_' + cat + '_' + idx + '_name');
  if (nameEl) nameEl.textContent = def ? def.name : '';
  if (def && cat !== 'pointe') {
    var l = document.getElementById('af_' + cat + '_' + idx + '_long');
    var w = document.getElementById('af_' + cat + '_' + idx + '_larg');
    var t = document.getElementById('af_' + cat + '_' + idx + '_epais');
    if (l) l.value = def.long || '';
    if (w) w.value = def.larg || '';
    if (t) t.value = def.epais || '';
  }
  afRecalc(cat, idx);
}

function afRecalc(cat, idx) {
  if (cat === 'pointe') { afTotal(); return; }
  var l = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_long') || {}).value) || 0;
  var w = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_larg') || {}).value) || 0;
  var t = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_epais') || {}).value) || 0;
  var q = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_qte') || {}).value) || 0;
  var v = l * w * t * q / 1000000;
  var cell = document.getElementById('af_vol_' + cat + '_' + idx);
  if (cell) cell.textContent = v.toFixed(4);
  afTotal();
}

function afTotal() {
  var total = 0;
  ['lattes', 'plots', 'contreplaque'].forEach(function(cat) {
    var body = document.getElementById('af_body_' + cat);
    if (!body) return;
    body.querySelectorAll('tr').forEach(function(r) {
      var parts = (r.id || '').split('_');
      var idx = parts[parts.length - 1];
      var l = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_long') || {}).value) || 0;
      var w = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_larg') || {}).value) || 0;
      var t = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_epais') || {}).value) || 0;
      var q = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_qte') || {}).value) || 0;
      total += l * w * t * q / 1000000;
    });
  });
  var badge = document.getElementById('af_voltotal');
  if (badge) badge.textContent = 'VOLUME TOTAL: ' + total.toFixed(4) + ' m³';
}

function afMarge() {
  var pu = parseFloat((document.getElementById('art_pu') || {}).value) || 0;
  var cr = parseFloat((document.getElementById('art_cr') || {}).value) || 0;
  var m = document.getElementById('art_marge');
  if (m) m.value = (pu - cr).toFixed(2);
}

  h += '<table style="width:100%;font-size:.74rem"><thead><tr>' + headCols + '</tr></thead>';
  h += '<tbody id="af_body_' + cat + '"></tbody></table></div>';
  return h;
}

function afCollectRows(cat) {
  var rows = [];
  var body = document.getElementById('af_body_' + cat);
  if (!body) return rows;
  body.querySelectorAll('tr').forEach(function(r) {
    var parts = (r.id || '').split('_');
    var idx = parts[parts.length - 1];
    var code = (document.getElementById('af_' + cat + '_' + idx + '_code') || {}).value || '';
    var qte = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_qte') || {}).value) || 0;
    if (!code && !qte) return;
    var nameEl = document.getElementById('af_' + cat + '_' + idx + '_name');
    var row = { code: code, designation: nameEl ? nameEl.textContent : code, quantity: qte };
    if (cat !== 'pointe') {
      row.length = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_long') || {}).value) || 0;
      row.width = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_larg') || {}).value) || 0;
      row.thickness = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_epais') || {}).value) || 0;
      var pos = document.getElementById('af_' + cat + '_' + idx + '_pos');
      row.placement = pos ? pos.value : '';
      row.volume = row.length * row.width * row.thickness * qte / 1000000;
    } else {
      row.length = 0; row.width = 0; row.thickness = 0; row.placement = ''; row.volume = 0;
    }
    rows.push(row);
  });
  return rows;
}

function saveArticleModal(id) {
  var code = (document.getElementById('art_code') || {}).value || '';
  var designation = (document.getElementById('art_des') || {}).value || '';
  if (!code || !designation) return toast('Code et désignation requis', 'error');
  var articles = getArticles();
  var a = id ? articles.find(function(x) { return x.id === id; }) : null;
  if (id && !a) return;
  if (!a) { a = { id: genId(), created_at: new Date().toISOString() }; articles.push(a); }
  a.code = code;
  a.designation = designation;
  a.destination = (document.getElementById('art_dest') || {}).value || '';
  a.treatment_code = (document.getElementById('art_treat') || {}).value || '';
  a.prix_vente = parseFloat((document.getElementById('art_pu') || {}).value) || 0;
  a.prix_revient = parseFloat((document.getElementById('art_cr') || {}).value) || 0;
  a.category_type = (document.getElementById('art_ctype') || {}).value || 'PALETTE';
  a.categorie = (document.getElementById('art_catstock') || {}).value || 'finished';
  a.unite = (document.getElementById('art_unite') || {}).value || 'Unité';
  a.weight = parseFloat((document.getElementById('art_weight') || {}).value) || 0;
  a.length = parseFloat((document.getElementById('art_long') || {}).value) || 0;
  a.width = parseFloat((document.getElementById('art_larg') || {}).value) || 0;
  a.thickness = parseFloat((document.getElementById('art_epais') || {}).value) || 0;
  a.dimensions = (a.length || '') + 'x' + (a.width || '') + 'x' + (a.thickness || '');
  a.statut = 'active';
  setArticles(articles);
  /* Nomenclature : remplace les composants de l'article */
  var allComp = getSection('composants', []).filter(function(c) { return c.article_id !== a.id; });
  ['lattes', 'plots', 'pointe', 'contreplaque'].forEach(function(cat) {
    afCollectRows(cat).forEach(function(r) {
      allComp.push({ id: genId(), article_id: a.id, type: _afCatToType[cat], code: r.code, designation: r.designation, length: r.length, width: r.width, thickness: r.thickness, quantity: r.quantity, placement: r.placement, volume: r.volume });
    });
  });
  setSection('composants', allComp);
  document.getElementById('modalOverlay').remove();
  toast(id ? 'Article mis à jour' : 'Article créé');
  renderPage();
}

function showNewArticle() { openArticleModal(null); }

function createArticle() { saveArticleModal(null); }

function deleteArticle(id) {
  if (!confirm2('Supprimer cet article ?')) return;
  setArticles(getArticles().filter(function(a) { return a.id !== id; }));

}

/* ==================== FICHES TECHNIQUES ==================== */
function render_fiche_tech() {
  var articles = getArticles().filter(function(a) { return (a.categorie || 'finished') === 'finished'; });
  var composants = getSection('composants', []);
  if (articles.length === 0) return '<div class="empty">Aucun article. Ajoutez des articles dans Nomenclature → Catalogue.</div>';
  var selId = getSection('ficheTechArticle', articles[0].id);
  if (!articles.some(function(a) { return a.id === selId; })) selId = articles[0].id;
  var h = '<div class="card"><div class="form-group" style="max-width:420px;margin-bottom:0"><label>Produit fini</label>';
  h += '<select id="ft_article_sel" onchange="setSection(\'ficheTechArticle\',this.value);renderPage()">';
  articles.forEach(function(a) { h += '<option value="' + a.id + '"' + (a.id === selId ? ' selected' : '') + '>' + escH(a.code) + ' — ' + escH(a.designation) + '</option>'; });
  h += '</select></div></div>';
  var comp = composants.filter(function(c) { return c.article_id === selId; });
  var art = articles.find(function(a) { return a.id === selId; });
  if (comp.length === 0) return h + '<div class="empty">Aucune nomenclature pour ' + escH(art ? art.code : '') + '</div>';
  var groups = {};
  comp.forEach(function(c) { (groups[c.type || 'AUTRE'] = groups[c.type || 'AUTRE'] || []).push(c); });
  var totVol = 0;
  Object.keys(groups).forEach(function(t) {
    h += '<div class="card"><h3>🧩 ' + escH(t) + '</h3>';
    h += '<table><tr><th>Code</th><th>Désignation</th><th style="text-align:right">Qté</th><th style="text-align:right">Long</th><th style="text-align:right">Larg</th><th style="text-align:right">Épais</th><th>Emplacement</th><th style="text-align:right">Volume (m³)</th></tr>';
    groups[t].forEach(function(c) {
      var v = (c.volume != null ? c.volume : ((c.length || 0) * (c.width || 0) * (c.thickness || 0) / 1000000));
      totVol += v;

    });
    h += '</table></div>';
  });
  h += '<div class="card" style="border-left:4px solid var(--accent)"><strong>Nomenclature ' + escH(art ? art.code : '') + ' : ' + comp.length + ' composant(s) — Volume total ' + totVol.toFixed(4) + ' m³</strong></div>';

}

function getDefinitions() { return getSection('definitions', []); }
function setDefinitions(v) { setSection('definitions', v); }

/* Catalogue dédupliqué depuis les nomenclatures + définitions manuelles */
function defCatalog() {
  var map = {};
  getSection('composants', []).forEach(function(c) {
    if (!c.code) return;
    if (!map[c.code]) map[c.code] = { code: c.code, designation: c.designation || c.code, type: c.type || '-', length: c.length || 0, width: c.width || 0, thickness: c.thickness || 0, volume: c.volume || 0, nb_articles: 0, custom: false };
    map[c.code].nb_articles++;
  });
  getDefinitions().forEach(function(c) {
    var prev = map[c.code] || { nb_articles: 0 };
    map[c.code] = { code: c.code, designation: c.designation || c.code, type: c.type || '-', length: c.length || 0, width: c.width || 0, thickness: c.thickness || 0, volume: c.volume || 0, qty_per_packet: c.qty_per_packet || 0, unit_cost: c.unit_cost || 0, observation: c.observation || '', essence: c.essence || '', nb_articles: prev.nb_articles || 0, custom: true, id: c.id };
  });
  return Object.keys(map).map(function(k) { return map[k]; });
}

function markPresence() {
  var employee_id = document.getElementById('pres_emp').value;
  var date = document.getElementById('pres_date').value;
  var statut = document.getElementById('pres_statut').value;
  if (!employee_id || !date) return toast('Champs requis', 'error');

  /* Écrire dans mdb_production.presence (module production) */
  var presences = getPresence();
  presences.push({
    id: genId(), employee_id: employee_id, date: date, statut: statut,
    heure_arrivee: document.getElementById('pres_arrivee').value,
    heure_depart: document.getElementById('pres_depart').value,
    heures_jour: parseFloat(document.getElementById('pres_hjour').value) || 0,
    heures_nuit: parseFloat(document.getElementById('pres_hnuit').value) || 0,
    faute_societe: document.getElementById('pres_faute').checked,
    notes: document.getElementById('pres_notes').value
  });
  setPresence(presences);

  /* SYNC → mdb_paye.pointage (pour que paye.html calculs le salaire) */
  try {
    var payeData = JSON.parse(localStorage.getItem('mdb_paye')) || {};
    if (!payeData.pointage) payeData.pointage = [];
    var arr = document.getElementById('pres_arrivee').value || '';
    var dep = document.getElementById('pres_depart').value || '';
    payeData.pointage.push({
      id: 'prod_' + genId(),
      employee_id: employee_id,
      date: date,
      j_arr: arr,
      j_pd: '',
      j_pf: '',
      j_fin: dep,
      n_arr: '',
      n_pd: '',
      n_pf: '',
      n_fin: '',
      faute_societe: document.getElementById('pres_faute').checked
    });
    localStorage.setItem('mdb_paye', JSON.stringify(payeData));
  } catch(e) {}

  document.getElementById('modalOverlay').remove();
  toast('Présence enregistrée (synchronisée avec Paie)');
  renderPage();
}

/* ==================== COÛT DE REVIENT ==================== */
function render_cost_price() {
  var articles = getArticles();
  var composants = getSection('composants', []);
  var species = getSpecies();

  var h = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">';
  h += '<div></div>';
  h += '<button class="btn" onclick="renderPage()">🔄 Actualiser</button>';
  h += '</div>';

  if (articles.length === 0) return h + '<div class="empty">Aucun article. Ajoutez des articles dans Nomenclature → Catalogue.</div>';

  h += '<div class="card"><table><thead><tr>';
  h += '<th>Code Article</th><th>Désignation</th><th>Type</th>';
  h += '<th style="text-align:right">Vol. Bois (m³)</th>';
  h += '<th style="text-align:right">Pointes</th>';
  h += '<th style="text-align:right">CP (m³)</th>';
  h += '<th style="text-align:right">Coût Matière</th>';
  h += '<th style="text-align:right">Prix Vente</th>';
  h += '<th style="text-align:right">Marge</th>';
  h += '<th style="text-align:right">Marge %</th>';
  h += '</tr></thead><tbody>';

  articles.forEach(function(art) {
    var comps = composants.filter(function(c) { return c.article_id === art.id; });
    var lattes = comps.filter(function(c) { return c.type === 'LATTE'; });
    var plots = comps.filter(function(c) { return c.type === 'PLOT'; });
    var pointes = comps.filter(function(c) { return c.type === 'POINTE'; });
    var cp = comps.filter(function(c) { return c.type === 'CP'; });

    var volBois = 0;
    lattes.forEach(function(c) { volBois += (c.volume || 0) * (c.quantity || 1); });
    plots.forEach(function(c) { volBois += (c.volume || 0) * (c.quantity || 1); });
    var nbPointes = pointes.reduce(function(s, c) { return s + (c.quantity || 0); }, 0);
    var volCP = 0;
    cp.forEach(function(c) { volCP += (c.volume || 0) * (c.quantity || 1); });

    var prixRevient = art.prix_revient || 0;
    var prixVente = art.prix_vente || 0;
    var marge = prixVente - prixRevient;
    var margePct = prixVente > 0 ? ((marge / prixVente) * 100).toFixed(1) : '0.0';
    var margeColor = marge > 0 ? 'color:var(--green)' : 'color:var(--red)';

    h += '<tr>';
    h += '<td style="font-weight:600;color:var(--accent)">' + escH(art.code) + '</td>';
    h += '<td>' + escH(art.designation) + '</td>';
    h += '<td style="font-size:.75rem;color:var(--dim)">' + escH(art.category_type || art.categorie || '-') + '</td>';
    h += '<td style="text-align:right">' + volBois.toFixed(4) + '</td>';
    h += '<td style="text-align:right">' + nbPointes + '</td>';
    h += '<td style="text-align:right">' + volCP.toFixed(4) + '</td>';
    h += '<td style="text-align:right">' + fmt(prixRevient) + ' F</td>';
    h += '<td style="text-align:right;font-weight:700">' + fmt(prixVente) + ' F</td>';
    h += '<td style="text-align:right;font-weight:700;' + margeColor + '">' + fmt(marge) + ' F</td>';
    h += '<td style="text-align:right;font-weight:700;' + margeColor + '">' + margePct + '%</td>';
    h += '</tr>';
  });

  h += '</tbody></table></div>';

  /* Synthèse globale */
  var totalVentes = articles.reduce(function(s, a) { return s + (a.prix_vente || 0); }, 0);
  var totalCouts = articles.reduce(function(s, a) { return s + (a.prix_revient || 0); }, 0);
  h += '<div class="stats-grid" style="margin-top:1rem">';
  h += '<div class="stat-card"><div class="value">' + articles.length + '</div><div class="label">Articles</div></div>';
  h += '<div class="stat-card"><div class="value">' + fmt(totalCouts) + ' F</div><div class="label">Coût Total Articles</div></div>';
  h += '<div class="stat-card"><div class="value">' + fmt(totalVentes) + ' F</div><div class="label">Prix Vente Total</div></div>';
  h += '<div class="stat-card"><div class="value" style="color:var(--green)">' + fmt(totalVentes - totalCouts) + ' F</div><div class="label">Marge Brute Totale</div></div>';
  h += '</div>';
  return h;
}

  var rows = document.querySelectorAll('#' + tableId + ' tr');

}
function globalSearchFn(q) {
  if (!q) return renderPage();
  /* Search across articles */
  var results = [];
  getArticles().forEach(function(a) {
    if ((a.code + ' ' + a.designation).toLowerCase().indexOf(q.toLowerCase()) !== -1) results.push('Article: ' + a.code + ' — ' + a.designation);
  });
  if (results.length > 0) {
    document.getElementById('content').innerHTML = '<div class="card"><h3>🔍 Résultats pour "' + escH(q) + '"</h3><ul>' + results.map(function(r) { return '<li>' + escH(r) + '</li>'; }).join('') + '</ul></div>';
  }
}

function seedSpeciesACSER() {
  var existing = getSpecies();

  var dropIds = { sp_aya: 1, sp_iro: 1, sp_moi: 1, sp_azo: 1, sp_bal: 1, sp_popl: 1, sp_pin: 1, sp_kal: 1 };
  var cleaned = existing.filter(function(s) { return !dropIds[s.id]; });
  if (cleaned.length !== existing.length) { existing = cleaned; setSpecies(existing); }
  var has = {};
  existing.forEach(function(s) { has[s.id] = true; });
  var ref = [
    { id: 'sp_ako', code: 'AKO', nom: 'AKO', origine: 'Bois blanc' },

    { id: 'sp_dab', code: 'DAB', nom: 'DABEMA', origine: 'Bois rouge' },
    { id: 'sp_divb', code: 'DIV-B', nom: 'DIVERS BLANC', origine: 'Bois blanc' },
    { id: 'sp_divr', code: 'DIV-R', nom: 'DIVERS ROUGE', origine: 'Bois rouge' },
    { id: 'sp_divm', code: 'DIV-MIXTE', nom: 'DIVERS-MIXTE', origine: 'Autre' },

function seedConsommablesACSER() {
  var articles = getArticles();

  articles.forEach(function(a) { has[a.id] = true; });
  var ref = [
    { id: 'art_c_p5', code: 'P5', designation: 'POINTE5', categorie: 'consum', unite: 'pcs', statut: 'active' },

  var changed = false;
  ref.forEach(function(a) { if (!has[a.id]) { articles.push(a); changed = true; } });

  var stock = getStockConsum();
  var shas = {};

  });
  if (schanged) setStockConsum(stock);
}

var _sidebarCollapsed = false;
var _sidebarPinned = false;
var _sbExpandTime = 0;

function initSidebarState() {
  try { _sidebarCollapsed = localStorage.getItem('mdb_sidebarCollapsed') === '1'; } catch(e) {}
  try { _sidebarPinned = localStorage.getItem('mdb_sidebarPinned') === '1'; } catch(e) {}

  var sb = document.getElementById('sidebar');
  if (sb) {
    sb.classList.remove('show');
    /* Sur mobile : toujours en tiroir fermé, jamais replié/épinglé (comme index) */
    if (isMobileView()) {
      sb.classList.remove('collapsed');
      sb.classList.remove('pinned');
    } else if (_sidebarPinned) {
      sb.classList.add('pinned');
      _sidebarCollapsed = false;
      sb.classList.remove('collapsed');
    } else if (_sidebarCollapsed) {
      sb.classList.add('collapsed');
    }
  }
  var ov = document.getElementById('sidebarOverlay');
  if (ov) ov.classList.remove('open');
  updateSidebarButtonsUI();
}

function toggleSidebarCollapse() {
  _sidebarCollapsed = !_sidebarCollapsed;
  if (!_sidebarCollapsed) _sbExpandTime = Date.now();
  var sb = document.getElementById('sidebar');
  if (sb) {
    sb.classList.toggle('collapsed', _sidebarCollapsed);
    if (!_sidebarCollapsed) {
      _sidebarPinned = false;
      sb.classList.remove('pinned');
      localStorage.setItem('mdb_sidebarPinned', '0');
    }
  }
  try { localStorage.setItem('mdb_sidebarCollapsed', _sidebarCollapsed ? '1' : '0'); } catch(e) {}
  updateSidebarButtonsUI();
}

function toggleSidebarPin() {
  _sidebarPinned = !_sidebarPinned;
  var sb = document.getElementById('sidebar');
  if (sb) {
    /* L'épingle n'a de sens que sur desktop (comme index : off-canvas sur mobile) */
    if (_sidebarPinned && isMobileView()) _sidebarPinned = false;
    sb.classList.toggle('pinned', _sidebarPinned);
    if (_sidebarPinned) {
      _sidebarCollapsed = false;
      sb.classList.remove('collapsed');
      try { localStorage.setItem('mdb_sidebarCollapsed', '0'); } catch(e) {}
    }
  }
  try { localStorage.setItem('mdb_sidebarPinned', _sidebarPinned ? '1' : '0'); } catch(e) {}
  updateSidebarButtonsUI();
}

function updateSidebarButtonsUI() {
  var pinBtn = document.getElementById('sidebarPinBtn');
  var collapseBtn = document.getElementById('sidebarCollapseBtn');
  if (pinBtn) pinBtn.style.color = _sidebarPinned ? '#f97316' : 'var(--dim)';
  if (collapseBtn) collapseBtn.textContent = _sidebarCollapsed ? '▶' : '◀';
}


document.addEventListener('DOMContentLoaded', function() {
  var sb = document.getElementById('sidebar');
  if (sb) {
    sb.addEventListener('mouseleave', function() {
      if (_sidebarCollapsed && !_sidebarPinned) {
        sb.classList.add('collapsed');
      }
    });
  }
});

/* Comme index : clic dans l'espace de travail = la sidebar se replie (sauf si épinglée).
   Sur mobile : clic dehors = fermeture du tiroir.
   - Seul un clic DANS #app (zone de travail) replie, pas les modals/toasts.
   - Grâce de 600ms après une expansion manuelle (le temps de faire son choix). */
document.addEventListener('click', function(e) {
  var sb = document.getElementById('sidebar');
  if (!sb || _sidebarPinned) return;
  if (e.target.closest('#sidebar') || e.target.closest('#menuBtn') ||
      e.target.closest('#sidebarPinBtn') || e.target.closest('#sidebarCollapseBtn') ||
      e.target.closest('#sidebarOverlay')) return;
  if (isMobileView()) {
    if (sb.classList.contains('show')) closeSidebar();
  } else {
    if (!e.target.closest('#app')) return;
    if (Date.now() - _sbExpandTime < 600) return;
    if (!sb.classList.contains('collapsed')) {
      _sidebarCollapsed = true;
      sb.classList.add('collapsed');
      try { localStorage.setItem('mdb_sidebarCollapsed', '1'); } catch(err) {}
      updateSidebarButtonsUI();
    }
  }
});

function maybeInitACSERData() {
  /* N'initialise les articles ACSER que si le catalogue est vide */
  var existingArticles = getArticles();
  if (existingArticles.length === 0) {
    initACSERData();
  } else {
    /* Catalogue déjà saisi : on ajoute quand même les essences et consommables ACSER si vides */
    seedSpeciesACSER();
    seedConsommablesACSER();
  }
}

function onSortieBoisCodeChange(idx, code) {
  if (!code) return;
  code = code.trim().toLowerCase();
  
  var rawMaterials = getStockRaw();
  var match = rawMaterials.find(function(m) {
    var c = (m.code || m.colis_number || m.reference || '').toLowerCase();
    return c === code || c.includes(code);
  });

  var msgEl = document.getElementById('sb_msg_' + idx);
  if (match) {
    var qteDispo = match.volume || match.quantite || match.stock_quantity || 0;
    if (msgEl) msgEl.innerHTML = '<span style="color:var(--green);font-size:.7rem;font-weight:700">✅ En stock (' + parseFloat(qteDispo).toFixed(3) + ' m³)</span>';
    
    // Auto-fill fields if available
    var libEl = document.getElementById('sb_libelle_' + idx);
    var essEl = document.getElementById('sb_essence_' + idx);
    var fourEl = document.getElementById('sb_fournisseur_' + idx);
    var longEl = document.getElementById('sb_long_' + idx);
    var largEl = document.getElementById('sb_larg_' + idx);
    var epaisEl = document.getElementById('sb_epais_' + idx);

    if (libEl && !libEl.value) libEl.value = match.designation || match.name || match.libelle || '';
    if (essEl && !essEl.value) essEl.value = match.essence || match.wood_type || match.essence_code || '';
    if (fourEl && !fourEl.value) fourEl.value = match.fournisseur || match.supplier_name || '';
    if (longEl && (!longEl.value || longEl.value == '0')) longEl.value = match.longueur || match.length || '';
    if (largEl && (!largEl.value || largEl.value == '0')) largEl.value = match.largeur || match.width || '';
    if (epaisEl && (!epaisEl.value || epaisEl.value == '0')) epaisEl.value = match.epaisseur || match.thickness || '';

    // Trigger volume calculation
    calcSortieBoisVol(idx);
  } else {
    if (msgEl) msgEl.innerHTML = '<span style="color:var(--warning);font-size:.7rem">Saisie libre</span>';
  }
}

function calcSortieBoisVol(idx) {
  var qte = parseFloat((document.getElementById('sb_qte_' + idx) || {}).value || 0);
  var long = parseFloat((document.getElementById('sb_long_' + idx) || {}).value || 0);
  var larg = parseFloat((document.getElementById('sb_larg_' + idx) || {}).value || 0);
  var epais = parseFloat((document.getElementById('sb_epais_' + idx) || {}).value || 0);

  var volInput = document.getElementById('sb_vol_' + idx);
  if (long > 0 && larg > 0 && epais > 0 && qte > 0) {
    // Standard volume calculation for wood in m3: (L_cm * W_cm * T_mm) / 100000 * qte
    var volUnit = (long * larg * epais) / 100000;
    var totalVol = volUnit * qte;
    if (volInput) volInput.value = totalVol.toFixed(4);
  }
  updateProductionTotals();
}

function updateProductionTotals() {
  // Sum Sortie Bois
  var totalSbQte = 0, totalSbVol = 0;
  var sbRows = document.querySelectorAll('[id^="sb_row_"], [id^="sortieBoisRow"]');
  sbRows.forEach(function(row, idx) {
    var qte = parseFloat((document.getElementById('sb_qte_' + idx) || {}).value || 0);
    var vol = parseFloat((document.getElementById('sb_vol_' + idx) || {}).value || 0);
    totalSbQte += qte;
    totalSbVol += vol;
  });

  var totalSbQteEl = document.getElementById('sb_total_qte');
  var totalSbVolEl = document.getElementById('sb_total_vol');
  if (totalSbQteEl) totalSbQteEl.textContent = totalSbQte;
  if (totalSbVolEl) totalSbVolEl.textContent = totalSbVol.toFixed(4) + ' m³';

  // Sum Lattes
  var totalLatteVol = 0;
  document.querySelectorAll('[id^="latte_vol_"]').forEach(function(input) {
    totalLatteVol += parseFloat(input.value || 0);
  });

  // Sum Plots
  var totalPlotVol = 0;
  document.querySelectorAll('[id^="plot_vol_"]').forEach(function(input) {
    totalPlotVol += parseFloat(input.value || 0);
  });

  // Summary Cards at bottom
  var sumSbEl = document.getElementById('summary_sb_vol');
  var sumLatteEl = document.getElementById('summary_latte_vol');
  var sumPlotEl = document.getElementById('summary_plot_vol');
  var sumTotalProdEl = document.getElementById('summary_total_prod_vol');
  var sumRendementEl = document.getElementById('summary_rendement');

  var totalTransforme = totalLatteVol + totalPlotVol;
  var rendement = totalSbVol > 0 ? ((totalTransforme / totalSbVol) * 100).toFixed(1) : '0.0';

  if (sumSbEl) sumSbEl.textContent = totalSbVol.toFixed(4) + ' m³';
  if (sumLatteEl) sumLatteEl.textContent = totalLatteVol.toFixed(4) + ' m³';
  if (sumPlotEl) sumPlotEl.textContent = totalPlotVol.toFixed(4) + ' m³';
  if (sumTotalProdEl) sumTotalProdEl.textContent = totalTransforme.toFixed(4) + ' m³';
  if (sumRendementEl) sumRendementEl.textContent = rendement + ' %';
}

function getAchatCategoryLabel(cat) {

  if (cat === 'consumables') return 'Consommables & Divers';
  return cat;
}
