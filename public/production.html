function updateStockItem(key, id) {
  var map = { 'stock-palettes': [getStockPalettes, setStockPalettes], 'stock-finished': [getStockFinished, setStockFinished], 'stock-semi': [getStockSemi, setStockSemi], 'stock-raw': [getStockRaw, setStockRaw], 'stock-merch': [getStockMerch, setStockMerch], 'stock-consum': [getStockConsum, setStockConsum] };
  var pair = map[key];
  if (!pair) return;
  var items = pair[0]();
  var item = items.find(function(s) { return s.id === id; });
  if (!item) return;
  var qte = parseFloat((document.getElementById('stk_qte') || {}).value) || 0;
  var prix = parseFloat((document.getElementById('stk_prix') || {}).value) || 0;
  var obs = ((document.getElementById('stk_obs') || {}).value || '').trim();
  var oldQ = parseFloat(item.quantite) || parseFloat(item.quantite_stock) || 0;
  item.quantite = qte;
  item.prix_unitaire = prix;
  if (obs) item.observation = obs;
  if (key === 'stock-raw') {
    /* Quantité déclarée manuellement : volume recalculé au prorata */
    var _oV = parseFloat(item.volume) || 0;
    var _uV = stkUnitVol(item) || (oldQ > 0 ? _oV / oldQ : 0);
    item.volume = Math.max(0, Math.round(_uV * qte * 10000) / 10000);
  }
  item.updated_at = new Date().toISOString();
  pair[1](items);
  /* Journal : correction manuelle = ajustement (fiche de stock) + miroir commercial */
  try {
    if (item.article_id && qte !== oldQ) {
      var _m = getMovements();
      _m.push({ id: genId(), date: today(), type: 'ajustement', article_id: item.article_id, quantite: qte - oldQ, reference: '', motif: 'Correction manuelle' + (obs ? ' — ' + obs : ''), created_at: new Date().toISOString() });
      setMovements(_m);
    }
    if (key === 'stock-finished' && item.article_id) syncMirrorFinished(item.article_id);
  } catch (e) {}
  document.getElementById('modalOverlay').remove();
  toast('Stock modifié ✏️');
  renderPage();
}

function addMovement() {
  var date = document.getElementById('mov_date').value;
  var type = document.getElementById('mov_type').value;
  var article_id = document.getElementById('mov_article').value;
  var qte = parseFloat(document.getElementById('mov_qte').value) || 0;
  var ref = document.getElementById('mov_ref').value;
  var motif = document.getElementById('mov_motif').value;
  if (!date || !article_id || qte <= 0) return toast('Remplissez les champs', 'error');
  var movs = getMovements();
  movs.push({ id: genId(), date: date, type: type, article_id: article_id, quantite: qte, reference: ref, motif: motif, created_at: new Date().toISOString() });
  setMovements(movs);
  document.getElementById('modalOverlay').remove();
  toast('Mouvement enregistré');
  renderPage();
}

/* ==================== INVENTAIRE FIN DE MOIS ==================== */
var _invMonthCache = null;
window._invHideZero = false;
window._invHidden = {};
window._invType = 'all';
window._invArticleFilter = 'all';
function render_inventory() {
  var _gmInv = getGlobalMonth();
  var invs = getInventories().filter(function(x) { return !_gmInv || (x.month || '') === _gmInv; }).slice().reverse();
  var _mn = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  var now = new Date();
  var months = [];
  for (var i = 0; i < 12; i++) {
    var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    var ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    months.push({ ym: ym, label: _mn[d.getMonth()] + ' ' + d.getFullYear() });

  h += '<button class="btn" onclick="toggleInvHideZero()" id="btnHideZero" style="background:' + (window._invHideZero ? 'var(--accent)' : '') + ';color:' + (window._invHideZero ? '#fff' : '') + '">👁️ Masquer stock zéro</button>';
  h += '<button class="btn" onclick="saveInventory(\'' + selMonth + '\')" disabled style="opacity:.5">💾 Sauvegarder</button>';

  h += '<h3 style="margin-bottom:.8rem">Paramètres de l\'inventaire</h3>';
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem">';
  h += '<div class="form-group"><label style="font-weight:700">Date</label>';
  h += '<input type="date" id="inv_date" value="' + today() + '" style="width:100%;padding:.4rem;border:1px solid var(--border);border-radius:6px;font-size:.85rem"></div>';
  h += '<div class="form-group"><label>Filtrer articles</label>';
  h += '<select id="inv_article_filter" onchange="window._invArticleFilter=this.value;launchInventory()" style="width:100%;padding:.4rem;border:1px solid var(--border);border-radius:6px;font-size:.85rem">';
  h += '<option value="all"' + (window._invArticleFilter === 'all' ? ' selected' : '') + '>Tous (y compris stock nul)</option>';
  h += '<option value="active"' + (window._invArticleFilter === 'active' ? ' selected' : '') + '>Actifs uniquement</option>';
  h += '</select></div>';
  h += '<div class="form-group"><label>Type d\'élément à inventer</label>';
  h += '<select id="inv_type" onchange="window._invType=this.value;window._invHidden={};launchInventory()" style="width:100%;padding:.4rem;border:1px solid var(--border);border-radius:6px;font-size:.85rem">';
  var invTypes = [

    { v: 'mp', t: 'Matière première (Toutes)' },
    { v: 'mp_bl', t: 'Matière première (BL)' },
    { v: 'mp_spec', t: 'Matière première (Spécifique)' },
    { v: 'mp_enc', t: 'Matière première (En cours)' },

function toggleInvHideZero() {
  window._invHideZero = !window._invHideZero;
  var btn = document.getElementById('btnHideZero');
  if (btn) { btn.style.background = window._invHideZero ? 'var(--accent)' : ''; btn.style.color = window._invHideZero ? '#fff' : ''; }
  launchInventory();
}

function toggleInvRow(idx) {
  window._invHidden[idx] = !window._invHidden[idx];
  var row = document.getElementById('invRow_' + idx);
  if (row) row.style.display = window._invHidden[idx] ? 'none' : '';
}

function launchInventory() {
  /* Le catalogue = les produits finis : s'assurer que chaque article a son entrée stock avant de lister */
  try { if (typeof syncCatalogueToStock === 'function') syncCatalogueToStock(); } catch (e) {}
  var dateEl = document.getElementById('inv_date');
  var month = (dateEl && dateEl.value) ? dateEl.value.slice(0, 7) : thisMonth();
  _invMonthCache = month;
  var items = calcInventoryItems(month);
  var target = document.getElementById('invContent');
  if (!target) return;

  /* Filtrer par type — 'all' = onglet Stock Actif Global (Stock → Matière Première) : stockRaw + règle Actif/Tout */
  function invEtatOk(q) { var et = 'actif'; try { et = getSection('stockRawEtat', 'actif'); } catch (e) {} return et === 'actif' ? (parseFloat(q) || 0) > 0 : true; }
  var filtered = items.filter(function(it) {
    if (window._invType === 'all') return it.store === 'stockRaw' && invEtatOk(it.theo_qte);
    if (window._invType === 'mp') return it.store === 'stockRaw';
    if (window._invType === 'mp_bl') return it.store === 'stockRaw' && (it.source === 'BL' || it.source === 'Matière première (BL)');
    if (window._invType === 'mp_spec') return it.store === 'stockRaw' && (it.source === 'SPECIFIC' || it.source === 'Matière première (Spécifique)');
    if (window._invType === 'mp_enc') return it.store === 'stockRaw' && (it.source === 'En cours' || it.source === 'Matière première (En cours)');
    if (window._invType === 'finished') return it.store === 'stockFinished';
    if (window._invType === 'semi') return it.store === 'stockSemi';
    if (window._invType === 'consum') return it.store === 'stockConsum';
    if (window._invType === 'merch') return it.store === 'stockMerch';
    if (window._invType === 'epi') return it.store === 'epiItems';
    return true;
  });

  /* Filtrer par article (tous / actifs) */
  if (window._invArticleFilter === 'active') {
    filtered = filtered.filter(function(it) { return (parseFloat(it.theo_qte) || 0) > 0; });
  }

  /* Masquer stock zéro */
  if (window._invHideZero) {
    filtered = filtered.filter(function(it) { return (parseFloat(it.theo_qte) || 0) !== 0; });
  }

  var h = '<div class="card">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem">';
  h += '<h3 style="margin:0">Stock théorique au 31 ' + monthLabel(month) + ' — Saisissez le stock réel</h3>';
  h += '<button class="btn btn-accent" onclick="saveInventory(\'' + month + '\')">✅ Sauvegarder</button>';
  h += '</div>';
  h += '<div style="font-size:.75rem;color:var(--dim);margin-bottom:.6rem">Le stock réel saisi deviendra le stock initial du mois suivant.</div>';

  /* Barre de recherche */
  h += '<input type="text" id="invSearchInput" class="search-box" placeholder="🔍 Rechercher par code ou désignation..." oninput="filterTable(\'invTable\',this.value)" style="margin-bottom:.8rem">';

  if (filtered.length === 0) {
    h += '<div class="empty">Aucun article trouvé pour cette sélection.</div>';
  } else {
    var hasDim = (window._invType === 'all' || window._invType === 'mp' || window._invType === 'mp_bl' || window._invType === 'mp_spec' || window._invType === 'mp_enc' || window._invType === 'semi');
    h += '<div style="overflow-x:auto"><table id="invTable">';
    h += '<thead><tr>';
    h += '<th>Code</th><th>Désignation</th><th>Source</th>';
    if (hasDim) h += '<th>Dimensions</th><th style="text-align:right">Volume (m³)</th>';
    h += '<th style="text-align:right">Théorique</th><th style="text-align:right;width:90px">Réel</th><th style="text-align:right">Écart</th><th>Commentaire</th><th></th>';
    h += '</tr></thead><tbody>';
    filtered.forEach(function(it, idx) {
      var ecart = (parseFloat(it.real_qte) || 0) - (parseFloat(it.theo_qte) || 0);
      var ecol = ecart === 0 ? 'var(--dim)' : (ecart > 0 ? 'var(--green)' : 'var(--red)');
      var hidden = window._invHidden[idx] || false;
      h += '<tr id="invRow_' + idx + '"' + (hidden ? ' style="display:none"' : '') + '>';
      h += '<td style="font-weight:600;color:var(--accent)">' + escH(it.code) + '</td>';
      h += '<td>' + escH(it.nom) + '</td>';
      h += '<td>' + escH(it.source || '-') + '</td>';
      if (hasDim) {
        h += '<td style="color:var(--dim)">' + escH(it.dimensions || '-') + '</td>';
        h += '<td style="text-align:right">' + (it.volume ? it.volume.toFixed(4) : '-') + '</td>';
      }
      h += '<td style="text-align:right;font-weight:700">' + fmt(it.theo_qte) + '</td>';
      h += '<td><input type="number" id="inv_real_' + idx + '" min="0" step="any" value="' + (it.theo_qte || 0) + '" style="width:85px;padding:4px;border:1px solid var(--border);border-radius:4px;text-align:right;font-size:.8rem" oninput="calcInvEcart()"></td>';
      h += '<td style="text-align:right;color:' + ecol + ';font-weight:700" id="inv_ecart_' + idx + '">0</td>';
      h += '<td><input type="text" id="inv_comment_' + idx + '" placeholder="Observation..." style="width:120px;padding:4px;border:1px solid var(--border);border-radius:4px;font-size:.75rem"></td>';
      h += '<td style="text-align:center"><span onclick="toggleInvRow(' + idx + ')" style="cursor:pointer;font-size:.9rem;opacity:.5" title="Masquer cette ligne">👁️</span></td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    h += '<div style="display:flex;justify-content:space-between;margin-top:.5rem;font-size:.8rem">';
    h += '<span style="color:var(--dim)">Total articles: <strong>' + filtered.length + '</strong></span>';
    h += '<span style="font-weight:700">Écart total: <span id="inv_ecart_total" style="color:var(--red)">0</span></span>';
    h += '</div>';
  }
  h += '</div>';
  target.innerHTML = h;
  window._invItems = filtered;
  calcInvEcart();
}

function calcInventoryItems(month) {
  var items = [];
  /* Résout l'article catalogue lié (les entrées stock ne portent que article_id) */
  function invArt(s) {
    if (!s || !s.article_id) return {};
    try { return getArticles().find(function(a) { return a.id === s.article_id; }) || {}; } catch (e) { return {}; }
  }
  (getStockRaw() || []).forEach(function(s) {
    var src = mpOrigin(s) || 'BL';
    var dims = '';
    var vol = 0;
    var l = parseFloat(s.longueur || s.length) || 0;
    var w = parseFloat(s.largeur || s.width) || 0;
    var t = parseFloat(s.epaisseur || s.thickness) || 0;
    if (l > 0 && w > 0 && t > 0) { dims = l + 'x' + w + 'x' + t; vol = l * w * t / 1000000; }
    items.push({ code: s.code || s.colis_number || '-', nom: s.essence || s.designation || s.name || '-', categorie: 'MP - ' + src, source: src, emplacement: s.emplacement || s.origin || '', dimensions: dims, volume: vol, theo_qte: parseFloat(s.quantite) || 0, real_qte: parseFloat(s.quantite) || 0, ref: s.code || s.colis_number, store: 'stockRaw', storeIdx: items.length });
  });
  (getStockSemi() || []).forEach(function(s) {
    var _a = invArt(s);
    var dims = '';
    var vol = 0;
    var l = parseFloat(s.length || s.longueur || _a.length) || 0;
    var w = parseFloat(s.width || s.largeur || _a.width) || 0;
    var t = parseFloat(s.thickness || s.epaisseur || _a.thickness) || 0;
    if (l > 0 && w > 0 && t > 0) { dims = l + 'x' + w + 'x' + t; vol = l * w * t / 1000000; }
    else if (_a.dimensions) { dims = _a.dimensions; }
    items.push({ code: s.code || _a.code || '-', nom: s.nom || s.designation || _a.designation || '-', categorie: 'Semi-fini', source: 'Semi-fini', emplacement: '', dimensions: dims, volume: vol, theo_qte: parseFloat(s.quantite) || 0, real_qte: parseFloat(s.quantite) || 0, ref: s.code || _a.code, store: 'stockSemi', storeIdx: items.length });
  });
  (getStockPalettes() || []).forEach(function(s) {
    var _a = invArt(s);
    items.push({ code: s.code || _a.code || '-', nom: s.nom || s.designation || _a.designation || '-', categorie: 'Palette', source: 'Palette', emplacement: s.emplacement || '', dimensions: '', volume: 0, theo_qte: parseFloat(s.quantite) || 0, real_qte: parseFloat(s.quantite) || 0, ref: s.code || _a.code, store: 'stockPalettes', storeIdx: items.length });
  });
  (getStockFinished() || []).forEach(function(s) {
    var _a = invArt(s);
    var _dims = s.dimensions || _a.dimensions || '';
    var _l = parseFloat(s.length) || parseFloat(_a.length) || 0;
    var _w = parseFloat(s.width) || parseFloat(_a.width) || 0;
    var _t = parseFloat(s.thickness) || parseFloat(_a.thickness) || 0;
    if (!_dims && _l > 0 && _w > 0 && _t > 0) _dims = _l + 'x' + _w + 'x' + _t;
    items.push({ code: s.code || _a.code || '-', nom: s.nom || s.designation || _a.designation || '-', categorie: 'Produit fini', source: 'Produit fini', emplacement: s.emplacement || '', dimensions: _dims, volume: 0, theo_qte: parseFloat(s.quantite) || 0, real_qte: parseFloat(s.quantite) || 0, ref: s.code || _a.code, store: 'stockFinished', storeIdx: items.length });
  });
  (getStockMerch() || []).forEach(function(s) {
    var _a = invArt(s);
    items.push({ code: s.code || _a.code || '-', nom: s.nom || s.designation || _a.designation || '-', categorie: 'Marchandise', source: 'Marchandise', emplacement: s.emplacement || '', dimensions: '', volume: 0, theo_qte: parseFloat(s.quantite) || 0, real_qte: parseFloat(s.quantite) || 0, ref: s.code || _a.code, store: 'stockMerch', storeIdx: items.length });
  });
  (getStockConsum() || []).forEach(function(s) {
    var _a = invArt(s);
    items.push({ code: s.code || _a.code || '-', nom: s.nom || s.nom_complet || s.designation || _a.designation || '-', categorie: 'Consommable', source: 'Consommable', emplacement: s.emplacement || s.type || '', dimensions: '', volume: 0, theo_qte: parseFloat(s.quantite_stock) || parseFloat(s.quantite) || 0, real_qte: parseFloat(s.quantite_stock) || parseFloat(s.quantite) || 0, ref: s.code || _a.code, store: 'stockConsum', storeIdx: items.length });
  });
  (getEpiItems() || []).forEach(function(s) {
    items.push({ code: s.code || '-', nom: s.designation || '-', categorie: 'EPI', source: 'EPI', emplacement: s.categorie || '', dimensions: '', volume: 0, theo_qte: parseFloat(s.quantite_stock) || 0, real_qte: parseFloat(s.quantite_stock) || 0, ref: s.code, store: 'epiItems', storeIdx: items.length });
  });
  return items;
}

function calcInvEcart() {
  var items = window._invItems || [];
  var totalEcart = 0;
  items.forEach(function(it, idx) {
    var el = document.getElementById('inv_real_' + idx);
    if (!el) return;
    var real = parseFloat(el.value) || 0;
    it.real_qte = real;
    var ecart = real - (parseFloat(it.theo_qte) || 0);
    totalEcart += Math.abs(ecart);
    var ecartEl = document.getElementById('inv_ecart_' + idx);
    if (ecartEl) {
      ecartEl.textContent = ecart > 0 ? '+' + fmt(ecart) : fmt(ecart);
      ecartEl.style.color = ecart === 0 ? 'var(--dim)' : (ecart > 0 ? 'var(--green)' : 'var(--red)');
    }
  });
  var totalEl = document.getElementById('inv_ecart_total');
  if (totalEl) totalEl.textContent = totalEcart.toFixed(1);
}

function saveInventory(month) {
  if (!confirm2('Enregistrer l\'inventaire de ' + monthLabel(month) + ' ? Le stock réel saisi deviendra le stock initial du mois suivant.')) return;
  var items = window._invItems || [];
  var savedItems = [];
  items.forEach(function(it, idx) {
    var el = document.getElementById('inv_real_' + idx);
    var commentEl = document.getElementById('inv_comment_' + idx);
    var real = el ? (parseFloat(el.value) || 0) : (parseFloat(it.real_qte) || 0);
    savedItems.push({ code: it.code, nom: it.nom, categorie: it.categorie, source: it.source || '', emplacement: it.emplacement, dimensions: it.dimensions || '', volume: it.volume || 0, theo_qte: it.theo_qte, real_qte: real, comment: commentEl ? commentEl.value || '' : '', store: it.store, ref: it.ref });
  });
  var inv = {
    id: genId(), month: month, date: (document.getElementById('inv_date') || {}).value || today(),
    supervisor: (document.getElementById('inv_supervisor') || {}).value || '',
    executants: (document.getElementById('inv_executants') || {}).value || '',
    heure_debut: (document.getElementById('inv_heure_debut') || {}).value || '',
    heure_fin: (document.getElementById('inv_heure_fin') || {}).value || '',
    items: savedItems, created_at: new Date().toISOString()
  };
  var invs = getInventories();
  invs = invs.filter(function(x) { return x.month !== month; });
  invs.push(inv);
  setInventories(invs);
  applyInventoryAsInitial(month, savedItems);
  toast('Inventaire de ' + monthLabel(month) + ' enregistré ✅');
  renderPage();
}

function applyInventoryAsInitial(month, items) {
  /* Met à jour les stocks actuels avec les valeurs réelles de l'inventaire */
  var raw = getStockRaw();
  var semi = getStockSemi();
  var palettes = getStockPalettes();
  var finished = getStockFinished();
  var merch = getStockMerch();
  var consum = getStockConsum();
  var epi = getEpiItems();
  var rawMap = {};
  raw.forEach(function(s, i) { rawMap[s.code || s.colis_number] = i; });
  var semiMap = {};
  semi.forEach(function(s, i) { semiMap[s.code] = i; });
  var palMap = {};
  palettes.forEach(function(s, i) { palMap[s.code] = i; });
  var finMap = {};
  finished.forEach(function(s, i) {
    if (s.code) finMap[s.code] = i;
    if (s.article_id) {
      try {
        var _fa = getArticles().find(function(a) { return a.id === s.article_id; }) || {};
        if (_fa.code) finMap[_fa.code] = i;
      } catch (e) {}
    }
  });
  var merchMap = {};
  merch.forEach(function(s, i) { merchMap[s.code] = i; });
  var consumMap = {};
  consum.forEach(function(s, i) { consumMap[s.code] = i; });
  var epiMap = {};
  epi.forEach(function(s, i) { epiMap[s.code] = i; });
  var _invLogs = [];
  function _invLog(list, idx, real) {
    var s = list[idx];
    if (!s || !s.article_id) return;
    var old = parseFloat(s.quantite) || parseFloat(s.quantite_stock) || 0;
    var nw = parseFloat(real) || 0;
    if (old === nw) return;
    _invLogs.push({ id: genId(), date: today(), type: 'sortie', article_id: s.article_id, quantite: old, reference: '', motif: 'Annulation inventaire - stock théorique', created_at: new Date().toISOString() });
    _invLogs.push({ id: genId(), date: today(), type: 'ajustement', article_id: s.article_id, quantite: nw, reference: '', motif: 'Correction inventaire - stock réel', created_at: new Date().toISOString() });
  }
  items.forEach(function(it) {
    var idx;
    if (!it.ref) it.ref = it.code;
    switch (it.store) {
      case 'stockRaw':
        idx = rawMap[it.ref];
        if (idx !== undefined) {
          /* L'inventaire prime sur tout : quantité déclarée + volume résiduel recalculé au prorata */
          var _oQ = parseFloat(raw[idx].quantite) || 0;
          var _oV = parseFloat(raw[idx].volume) || 0;
          var _uV = stkUnitVol(raw[idx]) || (_oQ > 0 ? _oV / _oQ : 0);
          raw[idx].quantite = it.real_qte;
          raw[idx].volume = Math.max(0, _uV * (parseFloat(it.real_qte) || 0));
          raw[idx].volume = Math.round(raw[idx].volume * 10000) / 10000;
        }
        break;
      case 'stockSemi':
        idx = semiMap[it.ref];
        if (idx !== undefined) { _invLog(semi, idx, it.real_qte); semi[idx].quantite = it.real_qte; }
        break;
      case 'stockPalettes':
      case 'stockFinished':
        /* Les palettes = les produits finis : tout est appliqué au stock finis */
        idx = finMap[it.ref];
        if (idx !== undefined) { _invLog(finished, idx, it.real_qte); finished[idx].quantite = it.real_qte; }
        break;
      case 'stockMerch':
        idx = merchMap[it.ref];
        if (idx !== undefined) { merch[idx].quantite = it.real_qte; }
        break;
      case 'stockConsum':
        idx = consumMap[it.ref];
        if (idx !== undefined) { _invLog(consum, idx, it.real_qte); consum[idx].quantite_stock = it.real_qte; consum[idx].quantite = it.real_qte; }
        break;
      case 'epiItems':
        idx = epiMap[it.ref];
        if (idx !== undefined) { epi[idx].quantite_stock = it.real_qte; }
        break;
    }
  });
  setStockRaw(raw);
  setStockSemi(semi);
  setStockPalettes(palettes);
  setStockFinished(finished);
  setStockMerch(merch);
  setStockConsum(consum);
  setEpiItems(epi);
  if (_invLogs.length) {
    var _mo = getMovements();
    _invLogs.forEach(function(x) { _mo.push(x); });
    setMovements(_mo);
  }
  /* Le réel d'inventaire devient le stock de référence : miroir exact vers la gestion commerciale */
  try {
    var _seen = {};
    items.forEach(function(it) {
      if (it.store !== 'stockFinished' && it.store !== 'stockPalettes') return;
      var f = finished[finMap[it.ref]];
      if (f && f.article_id && !_seen[f.article_id]) { _seen[f.article_id] = true; syncMirrorFinished(f.article_id); }
    });
  } catch (e) {}
}

/* ==================== MODAL ARTICLE (copie exacte ACSER) ==================== */
var _afCounters = { lattes: 0, plots: 0, pointe: 0, contreplaque: 0 };
var _afLimits = { lattes: 8, plots: 3, pointe: 3, contreplaque: 5 };
var _afCatToType = { lattes: 'LATTE', plots: 'PLOT', pointe: 'POINTE', contreplaque: 'CP' };
var _afTypeToCat = { LATTE: 'lattes', PLOT: 'plots', POINTE: 'pointe', CP: 'contreplaque' };

/* Définitions disponibles par catégorie (nomenclatures + définitions manuelles) */
function afDefsByCat(cat) {
  var want = _afCatToType[cat];
  var map = {};
  getSection('composants', []).forEach(function(c) {
    if (c.type === want && c.code && !map[c.code]) map[c.code] = { code: c.code, name: c.designation || c.code, long: c.length || 0, larg: c.width || 0, epais: c.thickness || 0 };
  });
  getDefinitions().forEach(function(c) {
    if (c.type === want && c.code && !map[c.code]) map[c.code] = { code: c.code, name: c.designation || c.code, long: c.length || 0, larg: c.width || 0, epais: c.thickness || 0 };
  });
  return Object.keys(map).map(function(k) { return map[k]; });
}

function afRowHTML(cat, idx, preset) {
  var p = preset || {};
  var defs = afDefsByCat(cat);
  var opts = '<option value="">Code</option>' + defs.map(function(d) {
    return '<option value="' + escH(d.code) + '"' + (p.code === d.code ? ' selected' : '') + '>' + escH(d.code) + ' - ' + escH(d.name) + '</option>';
  }).join('');
  var s = _piS('100%');
  var h = '';
  if (cat === 'pointe') {
    h += '<td style="min-width:180px"><select id="af_' + cat + '_' + idx + '_code" onchange="afOnCode(\'' + cat + '\',' + idx + ')" style="' + s + '">' + opts + '</select><div id="af_' + cat + '_' + idx + '_name" style="font-size:.65rem;color:var(--dim);padding:.1rem .2rem">' + escH(p.designation || '') + '</div></td>';
    h += '<td><input type="number" id="af_' + cat + '_' + idx + '_qte" value="' + (p.quantity != null ? p.quantity : 0) + '" min="0" style="' + _pnS('70px') + '" oninput="afRecalc(\'' + cat + '\',' + idx + ')"></td>';
    h += '<td><button class="btn btn-red" onclick="afDelRow(\'' + cat + '\',' + idx + ')" style="font-size:.65rem;padding:2px 6px">🗑️</button></td>';
  } else {
    h += '<td style="min-width:170px"><select id="af_' + cat + '_' + idx + '_code" onchange="afOnCode(\'' + cat + '\',' + idx + ')" style="' + s + '">' + opts + '</select><div id="af_' + cat + '_' + idx + '_name" style="font-size:.65rem;color:var(--dim);padding:.1rem .2rem">' + escH(p.designation || '') + '</div></td>';
    h += '<td><select id="af_' + cat + '_' + idx + '_pos" style="' + _piS('110px') + '">' + ['SUPERIEUR', 'INTERMEDIAIRE BAS', 'INTERMEDIAIRE HAUT', 'INFERIEUR'].map(function(o) { return '<option' + (p.placement === o ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></td>';
    h += '<td><input type="number" id="af_' + cat + '_' + idx + '_long" value="' + (p.length || '') + '" min="0" step="0.1" style="' + _pnS('65px') + '" oninput="afRecalc(\'' + cat + '\',' + idx + ')"></td>';
    h += '<td><input type="number" id="af_' + cat + '_' + idx + '_larg" value="' + (p.width || '') + '" min="0" step="0.1" style="' + _pnS('65px') + '" oninput="afRecalc(\'' + cat + '\',' + idx + ')"></td>';
    h += '<td><input type="number" id="af_' + cat + '_' + idx + '_epais" value="' + (p.thickness || '') + '" min="0" step="0.1" style="' + _pnS('65px') + '" oninput="afRecalc(\'' + cat + '\',' + idx + ')"></td>';
    h += '<td><input type="number" id="af_' + cat + '_' + idx + '_qte" value="' + (p.quantity != null ? p.quantity : 1) + '" min="0" style="' + _pnS('60px') + '" oninput="afRecalc(\'' + cat + '\',' + idx + ')"></td>';
    h += '<td style="text-align:right;font-weight:700;font-size:.76rem;color:var(--accent)" id="af_vol_' + cat + '_' + idx + '">0.0000</td>';
    h += '<td><button class="btn btn-red" onclick="afDelRow(\'' + cat + '\',' + idx + ')" style="font-size:.65rem;padding:2px 6px">🗑️</button></td>';
  }
  return h;
}

function afAddRow(cat, preset) {
  var body = document.getElementById('af_body_' + cat);
  if (!body) return;
  var count = body.querySelectorAll('tr').length;
  if (count >= _afLimits[cat]) return toast('Maximum ' + _afLimits[cat] + ' lignes pour ce type.', 'error');
  var idx = _afCounters[cat]++;
  var tr = document.createElement('tr');
  tr.id = 'af_row_' + cat + '_' + idx;
  tr.innerHTML = afRowHTML(cat, idx, preset);
  body.appendChild(tr);
  afRecalc(cat, idx);
}

function afDelRow(cat, idx) {
  var r = document.getElementById('af_row_' + cat + '_' + idx);
  if (r) r.remove();
  afTotal();
}

function afOnCode(cat, idx) {
  var codeEl = document.getElementById('af_' + cat + '_' + idx + '_code');
  var code = codeEl ? codeEl.value : '';
  var def = afDefsByCat(cat).find(function(d) { return d.code === code; });
  var nameEl = document.getElementById('af_' + cat + '_' + idx + '_name');
  if (nameEl) nameEl.textContent = def ? def.name : '';
  if (def && cat !== 'pointe') {
    var l = document.getElementById('af_' + cat + '_' + idx + '_long');
    var w = document.getElementById('af_' + cat + '_' + idx + '_larg');
    var t = document.getElementById('af_' + cat + '_' + idx + '_epais');
    if (l) l.value = def.long || '';
    if (w) w.value = def.larg || '';
    if (t) t.value = def.epais || '';
  }
  afRecalc(cat, idx);
}

function afRecalc(cat, idx) {
  if (cat === 'pointe') { afTotal(); return; }
  var l = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_long') || {}).value) || 0;
  var w = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_larg') || {}).value) || 0;
  var t = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_epais') || {}).value) || 0;
  var q = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_qte') || {}).value) || 0;
  var v = l * w * t * q / 1000000;
  var cell = document.getElementById('af_vol_' + cat + '_' + idx);
  if (cell) cell.textContent = v.toFixed(4);
  afTotal();
}

function afTotal() {
  var total = 0;
  ['lattes', 'plots', 'contreplaque'].forEach(function(cat) {
    var body = document.getElementById('af_body_' + cat);
    if (!body) return;
    body.querySelectorAll('tr').forEach(function(r) {
      var parts = (r.id || '').split('_');
      var idx = parts[parts.length - 1];
      var l = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_long') || {}).value) || 0;
      var w = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_larg') || {}).value) || 0;
      var t = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_epais') || {}).value) || 0;
      var q = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_qte') || {}).value) || 0;
      total += l * w * t * q / 1000000;
    });
  });
  var badge = document.getElementById('af_voltotal');
  if (badge) badge.textContent = 'VOLUME TOTAL: ' + total.toFixed(4) + ' m³';
}

function afMarge() {
  var pu = parseFloat((document.getElementById('art_pu') || {}).value) || 0;
  var cr = parseFloat((document.getElementById('art_cr') || {}).value) || 0;
  var m = document.getElementById('art_marge');
  if (m) m.value = (pu - cr).toFixed(2);

function afCollectRows(cat) {
  var rows = [];
  var body = document.getElementById('af_body_' + cat);
  if (!body) return rows;
  body.querySelectorAll('tr').forEach(function(r) {
    var parts = (r.id || '').split('_');
    var idx = parts[parts.length - 1];
    var code = (document.getElementById('af_' + cat + '_' + idx + '_code') || {}).value || '';
    var qte = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_qte') || {}).value) || 0;
    if (!code && !qte) return;
    var nameEl = document.getElementById('af_' + cat + '_' + idx + '_name');
    var row = { code: code, designation: nameEl ? nameEl.textContent : code, quantity: qte };
    if (cat !== 'pointe') {
      row.length = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_long') || {}).value) || 0;
      row.width = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_larg') || {}).value) || 0;
      row.thickness = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_epais') || {}).value) || 0;
      var pos = document.getElementById('af_' + cat + '_' + idx + '_pos');
      row.placement = pos ? pos.value : '';
      row.volume = row.length * row.width * row.thickness * qte / 1000000;
    } else {
      row.length = 0; row.width = 0; row.thickness = 0; row.placement = ''; row.volume = 0;
    }
    rows.push(row);
  });
  return rows;
}

function saveArticleModal(id) {
  var code = (document.getElementById('art_code') || {}).value || '';
  var designation = (document.getElementById('art_des') || {}).value || '';
  if (!code || !designation) return toast('Code et désignation requis', 'error');
  var articles = getArticles();
  var a = id ? articles.find(function(x) { return x.id === id; }) : null;
  if (id && !a) return;
  var oldCat = a ? (a.categorie || 'finished') : null;
  if (!a) { a = { id: genId(), created_at: new Date().toISOString() }; articles.push(a); }
  a.code = code;
  a.designation = designation;
  a.destination = (document.getElementById('art_dest') || {}).value || '';
  a.treatment_code = (document.getElementById('art_treat') || {}).value || '';
  a.prix_vente = parseFloat((document.getElementById('art_pu') || {}).value) || 0;
  a.prix_revient = parseFloat((document.getElementById('art_cr') || {}).value) || 0;
  a.category_type = (document.getElementById('art_ctype') || {}).value || 'PALETTE';
  a.categorie = (document.getElementById('art_catstock') || {}).value || 'finished';
  a.unite = (document.getElementById('art_unite') || {}).value || 'Unité';
  a.weight = parseFloat((document.getElementById('art_weight') || {}).value) || 0;
  a.length = parseFloat((document.getElementById('art_long') || {}).value) || 0;
  a.width = parseFloat((document.getElementById('art_larg') || {}).value) || 0;
  a.thickness = parseFloat((document.getElementById('art_epais') || {}).value) || 0;
  a.dimensions = (a.length || '') + 'x' + (a.width || '') + 'x' + (a.thickness || '');
  a.statut = 'active';
  setArticles(articles);
  /* Nomenclature : remplace les composants de l'article */
  var allComp = getSection('composants', []).filter(function(c) { return c.article_id !== a.id; });
  ['lattes', 'plots', 'pointe', 'contreplaque'].forEach(function(cat) {
    afCollectRows(cat).forEach(function(r) {
      allComp.push({ id: genId(), article_id: a.id, type: _afCatToType[cat], code: r.code, designation: r.designation, length: r.length, width: r.width, thickness: r.thickness, quantity: r.quantity, placement: r.placement, volume: r.volume });
    });
  });
  setSection('composants', allComp);
  /* Le catalogue = les produits finis : synchroniser l'entrée stock (finished/semi) */
  try {
    var newCat = a.categorie || 'finished';
    if (oldCat && oldCat !== newCat && (oldCat === 'finished' || oldCat === 'semi')) {
      if (oldCat === 'finished') setStockFinished(getStockFinished().filter(function(s) { return s.article_id !== a.id; }));
      else setStockSemi(getStockSemi().filter(function(s) { return s.article_id !== a.id; }));
    }
    if (newCat === 'finished' && !getStockFinished().some(function(s) { return s.article_id === a.id; })) {
      var _f = getStockFinished();
      _f.push({ id: genId(), article_id: a.id, quantite: 0, prix_unitaire: a.prix_vente || 0, created_at: new Date().toISOString() });
      setStockFinished(_f);
    } else if (newCat === 'semi' && !getStockSemi().some(function(s) { return s.article_id === a.id; })) {
      var _s = getStockSemi();
      _s.push({ id: genId(), article_id: a.id, quantite: 0, prix_unitaire: a.prix_vente || 0, created_at: new Date().toISOString() });
      setStockSemi(_s);
    }
  } catch (e) {}
  document.getElementById('modalOverlay').remove();
  toast(id ? 'Article mis à jour' : 'Article créé');
  renderPage();
}

function deleteArticle(id) {
  var art = getArticles().find(function(a) { return a.id === id; });
  if (!art) return;
  /* Vérifiez s'il y a du stock */
  var inStock = (getStockFinished().find(function(s) { return s.article_id === id; }) || getStockSemi().find(function(s) { return s.article_id === id; }));
  var msg = '⚠️ Supprimer l\'article ' + (art.code || '-') + ' — ' + (art.designation || '') + ' ?';
  if (inStock) msg += '\n\n⚠️ Cet article a du stock enregistré !\nSa suppression impactera les stocks liés.';
  msg += '\n\nConfirmer ?';
  if (!confirm2(msg)) return;
  setArticles(getArticles().filter(function(a) { return a.id !== id; }));
  /* Le catalogue = les produits finis : supprimer aussi les entrées stock liées */
  setStockFinished(getStockFinished().filter(function(s) { return s.article_id !== id; }));
  setStockSemi(getStockSemi().filter(function(s) { return s.article_id !== id; }));
  toast('Article supprimé');
  renderPage();
}

/* Catalogue dédupliqué depuis les nomenclatures + définitions manuelles */
function defCatalog() {
  var map = {};
  getSection('composants', []).forEach(function(c) {
    if (!c.code) return;
    if (!map[c.code]) map[c.code] = { id: 'cat_' + c.code, code: c.code, designation: c.designation || c.code, type: c.type || '-', length: c.length || 0, width: c.width || 0, thickness: c.thickness || 0, volume: c.volume || 0, nb_articles: 0, custom: false };
    map[c.code].nb_articles++;
  });
  getDefinitions().forEach(function(c) {
    var prev = map[c.code] || { nb_articles: 0 };
    map[c.code] = { code: c.code, designation: c.designation || c.code, type: c.type || '-', length: c.length || 0, width: c.width || 0, thickness: c.thickness || 0, volume: c.volume || 0, qty_per_packet: c.qty_per_packet || 0, unit_cost: c.unit_cost || 0, observation: c.observation || '', essence: c.essence || '', nb_articles: prev.nb_articles || 0, custom: true, id: c.id };
  });
  return Object.keys(map).map(function(k) { return map[k]; });
}

/* Type essence façon ACSER : essence x type (Bois rouge / Bois blanc / Autre) */
function spType(s) {
  if (s && s.type) return s.type;
  var o = ((s && s.origine) || '').toLowerCase();
  if (o.indexOf('blanc') !== -1) return 'Bois blanc';
  if (o.indexOf('rouge') !== -1) return 'Bois rouge';
  if (o.indexOf('autre') !== -1 || o.indexOf('mixte') !== -1) return 'Autre';
  return 'Bois rouge';
}

/* ==================== TRAITEMENT THERMIQUE — CLIENTS (facon ACSER) ====================
   Registre : Date | Client | Dest | Code trt | Produit | Qte | PU | Montant |
   Att | Rap | Livraison | Agent | Duree | Hum | Observations. Une operation =
   un en-tete (date, agent, chauffage, traitement, duree tot, observations) +
   N lignes produits. */
function nextThermalNumber() {
  var list = getThermalTreatments();
  var max = 0;
  list.forEach(function(t) {
    var n = parseInt(String(t.numero || '').replace(/\D/g, ''), 10);
    if (!isNaN(n) && n > max) max = n;
  });
  return 'TT-' + String(max + 1).padStart(4, '0');
}
function thOpLines(t) {
  if (t.lignes && t.lignes.length) return t.lignes;
  return [{ client: '-', dest: '-', produit: t.type_traitement || '-', qte: '-', pu: '-', montant: 0, code_trt: t.numero || '-', att: '-', rap: '-', hum: '-', livraison: t.date_fin_prevue || t.date_debut || '' }];
}

  var treatments = getThermalTreatments().slice().reverse();
  var h = '<div class="card" style="border:none;box-shadow:none;background:transparent;padding:0;margin-bottom:.6rem">';

      h += '<td>' + escH(L.dest || '-') + '</td>';

function thAddLine(preset) {

function thDelLine(idx) {

function saveThermal() {
  var date = (document.getElementById('th_date') || {}).value;
  if (!date) return toast('Date requise', 'error');
  var rows = document.querySelectorAll('#thLinesBody tr');
  if (!rows.length) return toast('Ajoutez au moins une ligne produit', 'error');
  var numero = (document.getElementById('th_num_preview') || {}).textContent || nextThermalNumber();
  var lignes = [];
  for (var i = 0; i < rows.length; i++) {
    var id = (rows[i].id || '').replace('thl_row_', '');
    var g = function(s) { var el = document.getElementById('thl_' + s + '_' + id); return el ? el.value : ''; };
    var q = parseFloat(g('qte')) || 0, pu = parseFloat(g('pu')) || 0;
    lignes.push({ client: g('client'), dest: g('dest'), produit: g('produit'), qte: q, pu: pu, montant: q * pu, code_trt: g('code') || numero, att: g('att'), rap: g('rap'), hum: g('hum'), livraison: g('liv') || date });
  }
  var data = {
    numero: numero, date: date,
    agent: (document.getElementById('th_agent') || {}).value || '',
    chauffage: (document.getElementById('th_chauffage') || {}).value || '',
    traitement: (document.getElementById('th_traitement') || {}).value || '',
    duree_tot: (document.getElementById('th_duree_tot') || {}).value || '',
    observations: (document.getElementById('th_obs') || {}).value || '',
    lignes: lignes, statut: 'termine', created_at: new Date().toISOString()
  };
  var list = getThermalTreatments();
  if (window._thEditId) {
    for (var j = 0; j < list.length; j++) { if (list[j].id === window._thEditId) { data.id = window._thEditId; list[j] = data; break; } }
    toast('Traitement modifie');
  } else {
    data.id = genId();
    list.push(data);
    toast('Traitement enregistre');
  }
  setThermalTreatments(list);
  window._thEditId = null;
  document.getElementById('modalOverlay').remove();
  renderPage();
}

/* ==================== RH - DÉPARTEMENTS / FONCTIONS (sync depuis paye) ==================== */
function getDepartementsFromPaye() {
  try {
    var payeData = JSON.parse(localStorage.getItem('mdb_paye')) || {};
    var svcs = payeData.services || [];
    if (svcs.length) return svcs.map(function(s) { return s.nom || s.name || s; }).filter(Boolean).sort();
    var cats = payeData.categories || [];
    var depts = new Set();
    cats.forEach(function(c) { if (c.service) depts.add(c.service); });
    return Array.from(depts).sort();
  } catch(e) { return ['Production', 'Maintenance', 'Logistique', 'Administration']; }
}
function getFonctionsFromPaye() {
  try {
    var payeData = JSON.parse(localStorage.getItem('mdb_paye')) || {};
    var fncs = payeData.fonctions || [];
    if (fncs.length) return fncs.map(function(f) { return f.nom || f.name || f; }).filter(Boolean).sort();
    var cats = payeData.categories || [];
    var funcs = new Set();
    cats.forEach(function(c) { if (c.fonction) funcs.add(c.fonction); });
    return Array.from(funcs).sort();
  } catch(e) { return ['Machiniste', 'Monteur', 'Manutentionnaire', 'Chef d\'équipe', 'Superviseur']; }
}

  return getPersonnel().filter(function(e) { return (e.fonction || e.service || '').trim() === fonction; });

function pgGlobVal(id) {

function pgEff(empId, dk) {
  var pts = getPointagePaye();
  var rec = null;
  for (var i = 0; i < pts.length; i++) {
    if (pts[i] && pts[i].employee_id === empId && pts[i].date === dk) { rec = pts[i]; break; }
  }
  function slot(persSuf, globId, oldKey) {
    var pv = pgPersVal('pgp-' + empId + '-' + persSuf);
    if (pv) return pv;
    var gv = pgGlobVal(globId);
    if (gv) return gv;
    return rec ? (rec[oldKey] || '') : '';
  }
  var nightPers = !!((document.getElementById('pgp-' + empId + '-n') || {}).checked);
  var nightGlob = !!((document.getElementById('pg-nuit') || {}).checked);
  var e = {
    ja: slot('ja', 'pg-arr', 'j_arrivee'),
    jp1: slot('jp1', 'pg-pdeb', 'j_pause'),
    jp2: slot('jp2', 'pg-pfin', 'j_reprise'),
    jf: slot('jf', 'pg-dep', 'j_fin'),
    na: '', np1: '', np2: '', nf: ''
  };
  if (nightPers || nightGlob) {
    e.na = slot('na', 'pg-narr', 'n_arrivee');
    e.np1 = slot('np1', 'pg-npdeb', 'n_pause');
    e.np2 = slot('np2', 'pg-npfin', 'n_reprise');
    e.nf = slot('nf', 'pg-ndep', 'n_fin');

}
function pgRefreshSummaries() {
  if (!document.getElementById('pg-emp-list')) return;

function pgApply() {
  var cbs = document.querySelectorAll('.pg-emp-cb:checked');
  if (cbs.length === 0) { toast('Sélectionnez au moins un employé', 'error'); return; }
  var dk = (document.getElementById('pg-date') || {}).value;
  if (!dk) { toast('Choisissez une date', 'error'); return; }
  var absentAll = (document.getElementById('pg-absent-all') || {}).checked;
  var motif = ((document.getElementById('pg-motif') || {}).value || '').trim();
  var rattrapage = (document.getElementById('pg-rattrapage') || {}).checked;
  var hg = parseFloat((document.getElementById('pg-hg') || {}).value) || 0;
  var hu = parseFloat((document.getElementById('pg-hu') || {}).value) || 0;
  var autoLock = !!((document.getElementById('pg-lock') || {}).checked);
  var pts = getPointagePaye();
  var personnel = getPersonnel();
  var needCode = false;
  cbs.forEach(function(cb) {
    var r = null;
    for (var i = 0; i < pts.length; i++) { if (pts[i] && pts[i].employee_id === cb.value && pts[i].date === dk) { r = pts[i]; break; } }
    if (r && r.protege === true && !(window._ptUnlocked && window._ptUnlocked[r.id])) needCode = true;
  });
  if (needCode && !ptIsAdmin()) { toast('Pointages verrouillés — admin requis', 'error'); return; }
  function storeH(h) {
    h = Math.round((parseFloat(h) || 0) * 100) / 100;
    if (h <= 0) return '';
    return String(h);
  }
  var count = 0, locked = 0;
  cbs.forEach(function(cb) {
    var eid = cb.value;
    var idx = -1;
    for (var i = 0; i < pts.length; i++) { if (pts[i] && pts[i].employee_id === eid && pts[i].date === dk) { idx = i; break; } }
    var emp = {};
    for (var k = 0; k < personnel.length; k++) { if (personnel[k].id === eid) { emp = personnel[k]; break; } }
    var isR = (emp.rendement === true);
    if (absentAll) {
      var r0 = idx !== -1 ? pts[idx] : { id: genId(), employee_id: eid, date: dk };
      if (idx === -1) pts.push(r0);
      r0.present = false;
      r0.h_j_manual = ''; r0.h_n_manual = '';
      r0.j_arrivee = ''; r0.j_pause = ''; r0.j_reprise = ''; r0.j_fin = '';
      r0.n_arrivee = ''; r0.n_pause = ''; r0.n_reprise = ''; r0.n_fin = '';
      r0.h_libres = 0;
      r0.obs = motif;
      r0.rattrap_gagnees = hg; r0.rattrap_utilisees = hu; r0.jour_rattrapage = rattrapage;
      count++;
    } else {
      var e = pgEff(eid, dk);
      var rec2 = idx !== -1 ? pts[idx] : { id: genId(), employee_id: eid, date: dk };
      if (idx === -1) pts.push(rec2);
      rec2.j_arrivee = e.ja; rec2.j_pause = e.jp1; rec2.j_reprise = e.jp2; rec2.j_fin = e.jf;
      rec2.n_arrivee = e.na; rec2.n_pause = e.np1; rec2.n_reprise = e.np2; rec2.n_fin = e.nf;
      rec2.rattrap_gagnees = hg; rec2.rattrap_utilisees = hu; rec2.jour_rattrapage = rattrapage;
      if (rattrapage) {
        rec2.present = false;
        rec2.h_j_manual = ''; rec2.h_n_manual = '';
      } else {
        rec2.present = true;
        var c = ptPXCalcInputs({ ja: e.ja, jp1: e.jp1, jp2: e.jp2, jf: e.jf, na: e.na, np1: e.np1, np2: e.np2, nf: e.nf, libres: 0 }, isR);
        if (isR) { rec2.h_j_manual = storeH(c.r); rec2.h_n_manual = ''; }
        else { rec2.h_j_manual = storeH(c.j); rec2.h_n_manual = storeH(c.n); }
      }
      var fullJ = e.ja && e.jp1 && e.jp2 && e.jf;
      var fullN = e.na && e.np1 && e.np2 && e.nf;
      if (autoLock && (fullJ || fullN) && !rattrapage) { rec2.protege = true; locked++; }
      count++;
    }
  });
  setPointagePaye(pts);
  toast(count + ' employé(s) pointé(s) le ' + dk + (locked ? ' — ' + locked + ' verrouillé(s) 🔒' : ''), 'success');
  closePtModal();
  renderPage();
}

function genApply() {
  var cbs = document.querySelectorAll('.gen-emp-cb:checked');
  if (cbs.length === 0) { toast('Sélectionnez au moins un employé', 'error'); return; }
  var mois = ptPXSelMois();
  var periode = (document.getElementById('gen-periode') || {}).value || 'all';
  var day = (document.getElementById('gen-day') || {}).value || '';
  if (periode === 'day' && !day) { toast('Choisissez le jour à générer', 'error'); return; }
  var year = parseInt(mois.split('-')[0], 10), mIdx = parseInt(mois.split('-')[1], 10) - 1;
  var daysInMonth = new Date(year, mIdx + 1, 0).getDate();
  var pts = getPointagePaye();
  var dks = [];
  if (periode === 'day') {
    dks.push(day);
  } else {
    for (var d = 1; d <= daysInMonth; d++) {
      var dk = mois + '-' + (d < 10 ? '0' : '') + d;
      var dw = new Date(year, mIdx, d).getDay();
      if (dw === 0 || dw === 6) continue;
      dks.push(dk);
    }
  }
  var count = 0, skipped = 0, skippedAP = 0;
  cbs.forEach(function(cb) {
    var eid = cb.value;
    dks.forEach(function(dk) {
      var idx = -1;
      for (var i = 0; i < pts.length; i++) { if (pts[i] && pts[i].employee_id === eid && pts[i].date === dk) { idx = i; break; } }
      if (idx !== -1 && pts[idx].protege === true) { skipped++; return; }
      if (idx !== -1 && pts[idx].absent_paye === true) { skippedAP++; return; }
      if (periode === 'empty' && idx !== -1) return;
      if (idx === -1) {
        pts.push({
          id: genId(), employee_id: eid, date: dk, present: true, h_j_manual: '8', h_n_manual: '',
          j_arrivee: '08:00', j_pause: '12:00', j_reprise: '13:00', j_fin: '17:00',
          n_arrivee: '', n_pause: '', n_reprise: '', n_fin: ''
        });
        count++;
      } else {
        pts[idx].present = true;
        pts[idx].h_j_manual = '8';
        pts[idx].j_arrivee = '08:00'; pts[idx].j_pause = '12:00';
        pts[idx].j_reprise = '13:00'; pts[idx].j_fin = '17:00';
        count++;
      }
    });
  });
  setPointagePaye(pts);
  toast(count + ' jour(s) généré(s) pour ' + cbs.length + ' employé(s)' + (skipped ? ' — ' + skipped + ' verrouillé(s) ignoré(s)' : '') + (skippedAP ? ' — ' + skippedAP + ' absent(s) payé(s) conservé(s)' : ''), 'success');
  closePtModal();
  renderPage();
}

  var funcs = getFonctionsFromPaye();
  var m = '<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)this.remove()"><div class="modal" style="max-width:500px">';
  m += '<h2>🖨️ Imprimer Fiches de Pointage</h2>';
  m += '<p style="color:var(--dim);font-size:.8rem;margin-bottom:1rem">Sélectionnez les employés pour générer leur fiche individuelle de pointage au format PDF.</p>';
  m += '<div style="margin-bottom:1rem"><select id="pfFonction" onchange="renderPrintFichesList()" style="width:100%"><option value="">Toutes les fonctions</option>';
  funcs.forEach(function(f) { m += '<option value="' + escH(f) + '">' + escH(f) + '</option>'; });
  m += '</select></div>';
  m += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">';
  m += '<label style="display:flex;align-items:center;gap:.3rem;cursor:pointer"><input type="checkbox" id="pfSelectAll" onchange="pfToggleAll(this.checked)"> Tout sélectionner</label>';
  m += '<span id="pfCount" style="font-size:.75rem;color:var(--dim)"></span>';
  m += '</div>';
  m += '<div id="pfEmployeeList" style="max-height:250px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:.3rem"></div>';
  m += '<div style="display:flex;gap:.5rem;margin-top:1rem"><button class="btn" onclick="printSelectedFiches()">🖨️ Imprimer direct</button><button class="btn btn-accent" onclick="downloadSelectedFiches()">📄 Télécharger PDF</button><button class="btn" onclick="document.getElementById(\'modalOverlay\').remove()">Annuler</button></div>';
  m += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', m);
  renderPrintFichesList();
}

function renderPrintFichesList() {
  var personnel = getPersonnel();
  var foncFilter = (document.getElementById('pfFonction') || {}).value;
  var filtered = foncFilter ? personnel.filter(function(e) { return (e.fonction || '') === foncFilter; }) : personnel;
  var el = document.getElementById('pfEmployeeList');
  if (!el) return;
  var h = '';
  filtered.forEach(function(e) {
    h += '<label style="display:flex;align-items:center;gap:.5rem;padding:4px 6px;cursor:pointer;border-bottom:1px solid var(--border)">';
    h += '<input type="checkbox" class="pf-emp" value="' + e.id + '" checked>';
    h += '<span style="font-size:.78rem"><strong>[' + escH(e.matricule || '—') + ']</strong> ' + escH(e.nom + ' ' + (e.prenoms || '')) + ' <span style="color:var(--dim)">(' + escH((e.fonction || '').toUpperCase()) + ')</span></span>';
    h += '</label>';
  });
  el.innerHTML = h || '<div style="padding:.5rem;color:var(--dim)">Aucun employé</div>';
  document.getElementById('pfCount').textContent = filtered.length + ' employé(s)';
}

function pfToggleAll(checked) {
  document.querySelectorAll('.pf-emp').forEach(function(cb) { cb.checked = checked; });
}

function getSelectedFicheEmpIds() {
  return Array.from(document.querySelectorAll('.pf-emp:checked')).map(function(cb) { return cb.value; });
}

function buildFichePointageHTML(emp) {
  var pres = getPointagePaye();
  var now = new Date();
  var year = now.getFullYear();
  var month = now.getMonth() + 1;
  var ym = year + '-' + (month < 10 ? '0' : '') + month;
  var montSetF = {};
  try {
    var _pmf = JSON.parse(localStorage.getItem('mdb_paye') || '{}').pointageMontage || [];
    for (var mi = 0; mi < _pmf.length; mi++) { var _mm = _pmf[mi]; if (_mm && _mm.employee_id === emp.id && (_mm.date || '').indexOf(ym) === 0 && (_mm.quantite || 0) > 0) montSetF[_mm.date] = true; }
  } catch(e) {}
  var daysInMonth = new Date(year, month, 0).getDate();
  var monthNames = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  var html = '<html><head><style>body{font-family:Arial,sans-serif;font-size:11px;margin:20px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #ccc;padding:4px 6px;text-align:left}th{background:#f0f0f0;font-size:10px}td{font-size:10px}.header{text-align:center;margin-bottom:15px}.summary{margin-top:15px;display:flex;gap:20px}.summary-box{border:1px solid #ccc;padding:8px;flex:1}</style></head><body>';
  html += '<div class="header"><strong>Fiche de pointage détaillée</strong></div>';
  html += '<div style="font-size:10px;margin-bottom:10px">Employé: <strong>' + escH(emp.nom + ' ' + (emp.prenoms || '')) + '</strong> | Matricule: ' + escH(emp.matricule || '—') + ' | Fonction: ' + escH((emp.fonction || '').toUpperCase()) + '</div>';
  html += '<table><tr><th>Date</th><th>Pointages</th><th>Jour (H)</th><th>Nuit (H)</th><th>Total (H)</th><th>Rendement</th><th>Observations</th></tr>';
  var totalJour = 0, totalNuit = 0, totalR = 0, gTot = 0, uTot = 0;
  for (var d = 1; d <= daysInMonth; d++) {
    var dateStr = year + '-' + String(month).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    var dt = new Date(year, month - 1, d);
    var dayNames = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
    var label = dayNames[dt.getDay()] + ' ' + String(d).padStart(2,'0') + '/' + String(month).padStart(2,'0');
    var p = null;
    for (var fi = 0; fi < pres.length; fi++) { if (pres[fi] && pres[fi].employee_id === emp.id && pres[fi].date === dateStr) { p = pres[fi]; break; } }
    var jStr = '-', nStr = '-', total = '-', rend = '-', obs = '';
    if (p) {
      var isRf = (emp.rendement === true) || (p.rendement === true);
      var cc = ptPXDay(p, isRf);
      var hJ = cc.j, hN = cc.n, hR = cc.r;
      if (hJ === 0 && hN === 0 && hR === 0 && p.present === true && !isRf) hJ = 8;
      var ptg = '-';
      if (p.j_arrivee || p.j_fin) ptg = (p.j_arrivee || '?') + '-' + (p.j_fin || '?');
      else if (p.h_j_manual) ptg = p.h_j_manual + (p.h_n_manual ? ' / N:' + p.h_n_manual : '');
      else if (p.present === false) ptg = 'Absent';
      else ptg = 'Présent';
      if (isRf) {
        rend = 'R';
        if (hR > 0) { jStr = 'R+' + hR + 'h'; total = 'R+' + hR + 'h'; totalR += hR; }
        else if (montSetF[dateStr]) { jStr = 'R'; total = 'R'; }
        else if (p.present === true) { jStr = 'RENDEMENT'; total = 'RENDEMENT'; }
        if (p.present === false && !p.absent_paye) obs = 'Absent';
      } else {
        if (hJ > 0) { jStr = hJ; totalJour += hJ; }
        if (hN > 0) { nStr = hN; totalNuit += hN; }
        if (hJ > 0 || hN > 0) total = Math.round((hJ + hN) * 100) / 100;
        if (p.present === false) obs = 'Absent';
      }
      if (p.faute_societe) obs = 'Faute société';
      if (p.paye_sans_travail) obs = 'Payé sans travail' + (p.pst_a_rattraper ? ' — à rattraper' : '');
      if (p.jour_rattrapage) obs = 'Jour de rattrapage';
      if (p.absent_paye) obs = 'Absent payé (faute entreprise) — à rattraper';
      if (montSetF[dateStr]) obs = (obs ? obs + ' — ' : '') + 'Montage (rendement)';
      var rg = parseFloat(p.rattrap_gagnees) || 0, ru = parseFloat(p.rattrap_utilisees) || 0;
      if (rg > 0 || ru > 0) { obs = (obs ? obs + ' — ' : '') + 'Rattrapage (+' + rg + 'h / -' + ru + 'h)'; gTot += rg; uTot += ru; }
      if (p.obs) obs = (obs ? obs + ' — ' : '') + p.obs;
      html += '<tr><td>' + label + '</td><td>' + escH(ptg) + '</td><td>' + jStr + '</td><td>' + nStr + '</td><td>' + total + '</td><td>' + rend + '</td><td>' + escH(obs) + '</td></tr>';
    } else {
      var dwx = new Date(year, month - 1, d).getDay();
      if (dwx === 0 || dwx === 6) obs = 'Week-end';
      else if (montSetF[dateStr] && emp.rendement === true) { jStr = 'R'; total = 'R'; rend = 'R'; obs = 'Montage (rendement)'; }
      html += '<tr><td>' + label + '</td><td>-</td><td>' + jStr + '</td><td>' + nStr + '</td><td>' + total + '</td><td>' + rend + '</td><td>' + escH(obs) + '</td></tr>';
    }
  }
  html += '</table>';
  html += '<div class="summary">';
  totalJour = Math.round(totalJour * 100) / 100; totalNuit = Math.round(totalNuit * 100) / 100; totalR = Math.round(totalR * 100) / 100;
  gTot = Math.round(gTot * 100) / 100; uTot = Math.round(uTot * 100) / 100;
  html += '<div class="summary-box"><strong>Total Heures Jour :</strong> ' + totalJour + 'h<br><strong>Total Heures Nuit :</strong> ' + totalNuit + 'h<br><strong>Rendement :</strong> ' + totalR + 'h<br><strong>TOTAL MENSUEL :</strong> ' + Math.round((totalJour + totalNuit + totalR) * 100) / 100 + 'h</div>';
  html += '<div class="summary-box"><strong>Heures à rattraper</strong><br>Total gagné: ' + gTot + 'h<br>Total rattrapage: ' + uTot + 'h</div>';
  html += '<div class="summary-box"><strong>Solde Restant à rattraper</strong><br><span style="font-size:20px;font-weight:800">' + Math.round((gTot - uTot) * 100) / 100 + 'h</span></div>';
  html += '</div></body></html>';
  return html;
}

function printSelectedFiches() {
  var ids = getSelectedFicheEmpIds();
  if (!ids.length) return toast('Sélectionnez au moins un employé', 'error');
  var personnel = getPersonnel();
  ids.forEach(function(id) {
    var emp = personnel.find(function(e) { return e.id === id; });
    if (!emp) return;
    var win = window.open('', '_blank');
    win.document.write(buildFichePointageHTML(emp));
    win.document.close();
    win.print();
  });
  toast(ids.length + ' fiche(s) envoyée(s) à l\'impression');
}

function downloadSelectedFiches() {
  var ids = getSelectedFicheEmpIds();
  if (!ids.length) return toast('Sélectionnez au moins un employé', 'error');
  if (typeof window.jspdf === 'undefined') return toast('jsPDF non chargé', 'error');
  var personnel = getPersonnel();
  var doc = new window.jspdf.jsPDF();
  var first = true;
  ids.forEach(function(id) {
    var emp = personnel.find(function(e) { return e.id === id; });
    if (!emp) return;
    if (!first) doc.addPage();
    first = false;
    var html = buildFichePointageHTML(emp);
    doc.html(html, { callback: function(d) { d.save('Fiche_Pointage_' + (emp.matricule || emp.nom) + '.pdf'); }, x: 5, y: 5, width: 200, windowWidth: 700 });
  });
  toast(ids.length + ' fiche(s) téléchargée(s)');
}

function exportPointagePDF() {
  if (typeof window.jspdf === 'undefined') return toast('jsPDF non chargé', 'error');
  var ids = getPersonnel().map(function(e) { return e.id; });
  var doc = new window.jspdf.jsPDF();
  var first = true;
  ids.forEach(function(id) {
    var emp = getPersonnel().find(function(e) { return e.id === id; });
    if (!emp) return;
    if (!first) doc.addPage();
    first = false;
    doc.html(buildFichePointageHTML(emp), { callback: function(d) { d.save('Pointage_Compact_' + new Date().toISOString().slice(0,10) + '.pdf'); }, x: 5, y: 5, width: 200, windowWidth: 700 });
  });
  toast('PDF exporté');
}

function printPointageFiches() { printSelectedFiches(); }

function markCollectivePresence(statut) {
  var deptFilter = getSection('ptFilterDept', '');
  var foncFilter = getSection('ptFilterFonction', '');
  var typeFilter = getSection('ptFilterType', '');
  var personnel = getPersonnel();
  var filtered = personnel;
  if (deptFilter) filtered = filtered.filter(function(e) { return (e.service || '') === deptFilter; });
  if (foncFilter) filtered = filtered.filter(function(e) { return (e.fonction || '') === foncFilter; });
  if (typeFilter === 'jour') filtered = filtered.filter(function(e) { return (e.horaires || '').indexOf('nuit') === -1; });
  else if (typeFilter === 'nuit') filtered = filtered.filter(function(e) { return (e.horaires || '').indexOf('nuit') !== -1; });

  var date = (document.getElementById('ptDate') || {}).value || today();
  var isP = statut === 'present';
  var arr = getPointagePaye();
  filtered.forEach(function(e) {
    var idx = -1;
    for (var i = 0; i < arr.length; i++) { if (arr[i] && arr[i].employee_id === e.id && arr[i].date === date) { idx = i; break; } }
    var rec = { employee_id: e.id, date: date, present: isP, h_j_manual: isP ? '8' : '', h_n_manual: '' };
    if (idx !== -1) { rec.id = arr[idx].id || genId(); arr[idx] = rec; }
    else { rec.id = genId(); arr.push(rec); }
  });
  setPointagePaye(arr);
  toast('Marquage collectif ' + statut + ' appliqué à ' + filtered.length + ' personnes');
  renderPage();
}

function markFonctionCollective(fonction, statut) {
  var personnel = getPersonnel().filter(function(e) { return (e.fonction || '').trim() === fonction; });
  var date = (document.getElementById('ptDate') || {}).value || today();
  var isP2 = statut === 'present';
  var arr2 = getPointagePaye();
  personnel.forEach(function(e) {
    var idx = -1;
    for (var i = 0; i < arr2.length; i++) { if (arr2[i] && arr2[i].employee_id === e.id && arr2[i].date === date) { idx = i; break; } }
    var rec = { employee_id: e.id, date: date, present: isP2, h_j_manual: isP2 ? '8' : '', h_n_manual: '' };
    if (idx !== -1) { rec.id = arr2[idx].id || genId(); arr2[idx] = rec; }
    else { rec.id = genId(); arr2.push(rec); }
  });
  setPointagePaye(arr2);
  toast('Fonction ' + fonction + ' : ' + statut + ' appliqué à ' + personnel.length + ' personnes');
  renderPage();
}

function clearDayPresence() {
  var date = (document.getElementById('ptDate') || {}).value || today();
  setPointagePaye(getPointagePaye().filter(function(p) { return !p || p.date !== date; }));
  toast('Pointage du jour effacé');
  renderPage();
}

function updateSinglePresence(empId, statut) {
  var date = (document.getElementById('ptDate') || {}).value || today();
  var arr3 = getPointagePaye();
  var idx3 = -1;
  for (var i = 0; i < arr3.length; i++) { if (arr3[i] && arr3[i].employee_id === empId && arr3[i].date === date) { idx3 = i; break; } }
  if (statut === '') {
    if (idx3 !== -1) { arr3.splice(idx3, 1); setPointagePaye(arr3); }
  } else {
    var isP3 = statut === 'present';
    var rec3 = { employee_id: empId, date: date, present: isP3, h_j_manual: isP3 ? '8' : '', h_n_manual: '' };
    if (idx3 !== -1) { rec3.id = arr3[idx3].id || genId(); arr3[idx3] = rec3; }
    else { rec3.id = genId(); arr3.push(rec3); }
    setPointagePaye(arr3);
  }
  renderPage();
}

function closePtModal() { var o = document.getElementById('modalOverlay'); if (o) o.remove(); }
function peTimeField(id, label, val, dis) {
  return '<div><label style="font-size:.7rem;color:#666">' + label + '</label>' +
    '<input type="time" id="' + id + '" value="' + escH(val || '') + '" ' + dis + ' oninput="peAutoNext(this)" style="width:100%;padding:7px;border:1px solid #ddd;border-radius:8px;font-size:.82rem;background:#f8fafc;box-sizing:border-box"></div>';
}
var PE_TIME_ORDER = ['pe-ja', 'pe-jp1', 'pe-jp2', 'pe-jf', 'pe-na', 'pe-np1', 'pe-np2', 'pe-nf'];
function peAutoNext(el) {
  var was = '';
  try { was = el.getAttribute('data-was') || ''; } catch(eWas) {}
  var v = el.value || '';
  try { el.setAttribute('data-was', v); } catch(eSet) {}
  ptEditRecalc();
  if (!/^\d{2}:\d{2}$/.test(was) && /^\d{2}:\d{2}$/.test(v)) {
    var i = PE_TIME_ORDER.indexOf(el.id);
    if (i === -1) return;
    for (var k = i + 1; k < PE_TIME_ORDER.length; k++) {
      var nx = document.getElementById(PE_TIME_ORDER[k]);
      if (nx && !nx.disabled && nx.offsetParent !== null) { try { nx.focus(); } catch(eFo) {} break; }
    }
  }
}
function ptPXSpanJN(a, b) {
  var s = ptPXToMin(a), e = ptPXToMin(b);
  if (s === null || e === null) return { j: 0, n: 0 };
  if (e <= s) e += 1440;
  var j = 0, n = 0;
  for (var t = s; t < e; t++) { if (ptPXIsNight(t)) n++; else j++; }
  return { j: j / 60, n: n / 60 };
}
function ptPXCalcInputs(o, isR) {
  function pairT(a, p1, p2, f) {
    var r = { j: 0, n: 0 };
    function add(x, y) { var s = ptPXSpanJN(x, y); r.j += s.j; r.n += s.n; }
    if (a && p1) add(a, p1);
    if (p2 && f) add(p2, f);
    if (r.j + r.n === 0 && a && f && !isR) add(a, f);
    return r;
  }
  var dj = pairT(o.ja, o.jp1, o.jp2, o.jf), dn = pairT(o.na, o.np1, o.np2, o.nf);
  var libres = parseFloat(o.libres) || 0;
  if (isR) return { j: 0, n: 0, r: Math.round((dj.j + dj.n + dn.j + dn.n + libres) * 100) / 100 };
  return { j: Math.round((dj.j + dn.j + libres) * 100) / 100, n: Math.round((dj.n + dn.n) * 100) / 100, r: 0 };
}

    '</div>';

function ptIsAdmin() {
  try {
    var cur = null;
    try { cur = JSON.parse(localStorage.getItem('mdb_userDisplay') || 'null'); } catch(e1) {}
    if (!cur) { try { cur = JSON.parse(localStorage.getItem('mdb_currentUser') || 'null'); } catch(e2) {} }
    if (typeof cur === 'string') cur = { login: cur };
    if (cur && cur.isAdmin === true) return true;
    var key = cur && (cur.id || cur.login || cur.nom || cur.username);
    if (!key) return true;
    if (key === 'admin' || key === 'Direction') return true;
    var users = [];
    try { users = JSON.parse(localStorage.getItem('mdb_users') || '[]') || []; } catch(eU) {}
    for (var i = 0; i < users.length; i++) {
      var u = users[i];
      if (u && (u.id === key || u.login === key || u.nom === key || u.username === key)) return u.isAdmin === true;
    }
    return false;
  } catch(e) { return true; }
}

function ptEditUnlock() {
  var ctx = window._peCtx || {};
  function doUnlock(msg) {

    for (var i = 0; i < pts0.length; i++) { if (pts0[i] && pts0[i].employee_id === ctx.empId && pts0[i].date === ctx.dk) { rec0 = pts0[i]; break; } }

  }

function ptEditSave() {
  var ctx = window._peCtx || {};
  var empId = ctx.empId, dk = ctx.dk;
  if (!empId || !dk) return;
  var pts = getPointagePaye();
  var idx = -1;
  for (var i = 0; i < pts.length; i++) { if (pts[i] && pts[i].employee_id === empId && pts[i].date === dk) { idx = i; break; } }
  var rec = idx !== -1 ? pts[idx] : null;
  if (rec && rec.protege === true && !(window._ptUnlocked && window._ptUnlocked[rec.id])) { toast('Pointage verrouillé — déverrouillage admin requis', 'error'); return; }
  function g(id) { return (document.getElementById(id) || {}).value || ''; }
  function gc(id) { return !!((document.getElementById(id) || {}).checked); }
  var absent = gc('pe-abs');
  var pst = gc('pe-pst');
  var pstR = pst && gc('pe-pst-rattrap');
  var absPaye = absent && gc('pe-abs-paye');
  var rattrap = gc('pe-rattrap');
  if (!rec) {
    rec = { id: genId(), employee_id: empId, date: dk, present: true, h_j_manual: '', h_n_manual: '' };
    pts.push(rec);
    idx = pts.length - 1;
  }
  rec.obs = g('pe-obs');
  rec.j_arrivee = g('pe-ja') || ''; rec.j_pause = g('pe-jp1') || '';
  rec.j_reprise = g('pe-jp2') || ''; rec.j_fin = g('pe-jf') || '';
  rec.n_arrivee = g('pe-na') || ''; rec.n_pause = g('pe-np1') || '';
  rec.n_reprise = g('pe-np2') || ''; rec.n_fin = g('pe-nf') || '';
  rec.rendement = gc('pe-rend');
  rec.h_libres = parseFloat(g('pe-libres')) || 0;
  rec.paye_sans_travail = pst;
  rec.pst_a_rattraper = pstR;
  rec.absent_paye = absPaye;
  rec.rattrap_gagnees = parseFloat(g('pe-hg')) || 0;
  rec.rattrap_utilisees = parseFloat(g('pe-hu')) || 0;
  rec.jour_rattrapage = rattrap;
  rec.protege = gc('pe-protege');
  var emp = null;
  try { emp = getPersonnel().find(function(p) { return p.id === empId; }); } catch(e) {}
  var isR = (emp && emp.rendement === true) || rec.rendement === true;
  function storeH(h) {
    h = Math.round((parseFloat(h) || 0) * 100) / 100;
    if (h <= 0) return '';
    return String(h);
  }
  if ((absent && !absPaye) || rattrap) {
    rec.present = false;
    rec.absent_paye = false;
    rec.h_j_manual = ''; rec.h_n_manual = '';
  } else if (absPaye) {
    rec.present = false;
    rec.j_arrivee = ''; rec.j_pause = ''; rec.j_reprise = ''; rec.j_fin = '';
    rec.n_arrivee = ''; rec.n_pause = ''; rec.n_reprise = ''; rec.n_fin = '';
    rec.h_libres = 0;
    rec.h_j_manual = storeH(8); rec.h_n_manual = '';
    rec.rattrap_gagnees = 8;
  } else {
    rec.present = true;
    rec.absent_paye = false;
    var hasTimes = rec.j_arrivee || rec.j_pause || rec.j_reprise || rec.j_fin ||
      rec.n_arrivee || rec.n_pause || rec.n_reprise || rec.n_fin || rec.h_libres;
    if (hasTimes) {
      var c = ptPXCalcInputs({
        ja: rec.j_arrivee, jp1: rec.j_pause, jp2: rec.j_reprise, jf: rec.j_fin,
        na: rec.n_arrivee, np1: rec.n_pause, np2: rec.n_reprise, nf: rec.n_fin,
        libres: rec.h_libres
      }, isR);
      if (isR) { rec.h_j_manual = storeH(c.r); rec.h_n_manual = ''; }
      else { rec.h_j_manual = storeH(c.j); rec.h_n_manual = storeH(c.n); }
    }
  }
  setPointagePaye(pts);
  toast('Pointage enregistré (' + dk + ')', 'success');
  closePtModal();
  renderPage();
}
function ptEditDelete() {
  var ctx = window._peCtx || {};
  if (!ctx.empId || !ctx.dk) return;
  var pts = getPointagePaye();
  var idx = -1;
  for (var i = 0; i < pts.length; i++) {
    if (pts[i] && pts[i].employee_id === ctx.empId && pts[i].date === ctx.dk) { idx = i; break; }
  }
  if (idx === -1) { toast('Rien à supprimer pour ce jour', 'error'); return; }
  var rec = pts[idx];
  if (rec.protege === true && !(window._ptUnlocked && window._ptUnlocked[rec.id])) { toast('Pointage verrouillé — déverrouillage admin requis', 'error'); return; }
  if (!confirm2('Supprimer définitivement le pointage du ' + ctx.dk + ' ?')) return;
  pts.splice(idx, 1);
  setPointagePaye(pts);
  toast('Pointage supprimé (' + ctx.dk + ')', 'success');
  closePtModal();
  renderPage();
}

function updateEpiCatalogue(id) {
  var cat = getEpiCatalogue();
  var e = cat.find(function(x) { return x.id === id; });
  if (!e) return;
  e.code = (document.getElementById('ec_code')||{}).value || e.code;
  e.designation = (document.getElementById('ec_designation')||{}).value || e.designation;
  e.categorie = (document.getElementById('ec_categorie')||{}).value;
  e.taille = (document.getElementById('ec_taille')||{}).value;
  e.unite = (document.getElementById('ec_unite')||{}).value || 'pièce';
  e.prix_unitaire = parseFloat((document.getElementById('ec_prix')||{}).value)||0;
  e.stock = parseInt((document.getElementById('ec_stock')||{}).value)||0;
  e.seuil_minimum = parseInt((document.getElementById('ec_seuil')||{}).value)||0;
  setEpiCatalogue(cat);
  document.getElementById('modalOverlay').remove();
  toast('EPI modifié');
  renderPage();
}

function deleteEpiCatalogue(id) {
  var e = getEpiCatalogue().find(function(x) { return x.id === id; });
  if (!e) return;
  var asg = getEpiAttributions().filter(function(a) { return a.epi_id === id && a.statut === 'actif'; });
  var msg = 'Supprimer ' + (e.code || '') + ' — ' + (e.designation || '') + ' ?';
  if (asg.length) msg += '\n\n⚠️ ' + asg.length + ' attribution(s) active(s) seront supprimées.';
  if (!confirm2(msg)) return;
  setEpiCatalogue(getEpiCatalogue().filter(function(x) { return x.id !== id; }));
  setEpiAttributions(getEpiAttributions().filter(function(a) { return a.epi_id !== id; }));
  toast('EPI supprimé');
  renderPage();
}

function addAchatEpiLigne() {
  var cat = getEpiCatalogue();
  var el = document.getElementById('pa_lignes');
  var d = document.createElement('div');
  d.className = 'card';
  d.style.cssText = 'padding:.5rem;margin-bottom:.5rem;display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:.5rem;align-items:end';
  var opts = '<option value="">Choisir l\'EPI</option>';
  cat.forEach(function(e) { opts += '<option value="' + e.id + '">' + escH(e.code) + ' — ' + escH(e.designation) + '</option>'; });
  d.innerHTML = '<div><select class="pa_article" style="width:100%">' + opts + '</select></div><div><input type="number" class="pa_qte" value="1" min="1" style="width:100%" onchange="updateAchatLigneTotal(this)"></div><div><input type="number" class="pa_pu" value="0" style="width:100%" onchange="updateAchatLigneTotal(this)"></div><div><div class="pa_total" style="padding:6px;font-weight:600">0</div></div><button class="btn btn-red" onclick="this.closest(\'.card\').remove();updateAchatGrandTotal()" style="font-size:.7rem">🗑️</button>';
  el.appendChild(d);
  updateAchatGrandTotal();

function updateAchatLigneTotal(el) {
  var row = el.closest('.card');
  var q = parseFloat(row.querySelector('.pa_qte').value) || 0;
  var p = parseFloat(row.querySelector('.pa_pu').value) || 0;
  row.querySelector('.pa_total').textContent = fmtF(q * p);
  updateAchatGrandTotal();
}

function updateAchatGrandTotal() {
  var total = 0, count = 0;
  document.querySelectorAll('#pa_lignes .card').forEach(function(row) {
    var q = parseFloat(row.querySelector('.pa_qte').value) || 0;
    var p = parseFloat(row.querySelector('.pa_pu').value) || 0;
    total += q * p;
    count++;
  });
  var el = document.getElementById('pa_grandTotal');
  if (el) el.textContent = fmtF(total) + ' FCFA';
  var el2 = document.getElementById('pa_ligneCount');
  if (el2) el2.textContent = count;
}

function saveAchatEpi(addMore) {
  var date = (document.getElementById('pa_date')||{}).value;
  if (!date) return toast('Date requise', 'error');
  var four = (document.getElementById('pa_fournisseur')||{}).value || '';
  var acheteur = (document.getElementById('pa_acheteur')||{}).value || '';
  var lignes = [];
  document.querySelectorAll('#pa_lignes .card').forEach(function(row) {
    var artId = row.querySelector('.pa_article').value;
    var qte = parseInt(row.querySelector('.pa_qte').value) || 0;
    var pu = parseFloat(row.querySelector('.pa_pu').value) || 0;
    if (artId && qte > 0) {
      var epi = getEpiCatalogue().find(function(e) { return e.id === artId; });
      lignes.push({ epi_id: artId, article: epi ? (epi.code + ' — ' + epi.designation) : '', quantite: qte, prix_unitaire: pu });
    }
  });
  if (!lignes.length) return toast('Ajoutez au moins une ligne', 'error');
  var purchases = getEpiPurchases();
  purchases.push({ id: genId(), date: date, fournisseur: four, acheteur: acheteur, lignes: lignes });
  setEpiPurchases(purchases);
  /* Mise à jour stock */
  var cat = getEpiCatalogue();
  lignes.forEach(function(l) {
    var e = cat.find(function(x) { return x.id === l.epi_id; });
    if (e) e.stock = (e.stock || 0) + l.quantite;
  });
  setEpiCatalogue(cat);
  toast(lignes.length + ' ligne(s) enregistrée(s), stock mis à jour');
  if (addMore) { document.getElementById('pa_lignes').innerHTML = ''; addAchatEpiLigne(); updateAchatGrandTotal(); }
  else { document.getElementById('modalOverlay').remove(); renderPage(); }
}

function deleteEpiPurchase(id) {
  if (!confirm2('Supprimer cet achat et déduire le stock ?')) return;
  var purchase = getEpiPurchases().find(function(p) { return p.id === id; });
  if (purchase) {
    var cat = getEpiCatalogue();
    (purchase.lignes || []).forEach(function(l) {
      var e = cat.find(function(x) { return x.id === l.epi_id; });
      if (e) e.stock = Math.max(0, (e.stock || 0) - (l.quantite || 0));
    });
    setEpiCatalogue(cat);
  }
  setEpiPurchases(getEpiPurchases().filter(function(p) { return p.id !== id; }));
  toast('Achat supprimé, stock déduit');
  renderPage();
}

function filterAeList() {
  var q = ((document.getElementById('aeSearch')||{}).value || '').toLowerCase();
  document.querySelectorAll('.ae-emp').forEach(function(cb) {
    var label = cb.parentElement;
    cb.parentElement.style.display = label.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none';
  });
}

function aeToggleAll(checked) {
  document.querySelectorAll('.ae-emp').forEach(function(cb) { if (cb.parentElement.style.display !== 'none') cb.checked = checked; });
  document.getElementById('aeCount').textContent = document.querySelectorAll('.ae-emp:checked').length;
}

function saveAttributionEpi() {
  var checked = document.querySelectorAll('.ae-emp:checked');
  var epiId = (document.getElementById('aeEpi')||{}).value;
  var qte = parseInt((document.getElementById('ae_qte')||{}).value) || 1;
  if (!checked.length) return toast('Sélectionnez au moins un employé', 'error');
  if (!epiId) return toast('Choisissez un EPI', 'error');
  var cat = getEpiCatalogue();
  var epi = cat.find(function(e) { return e.id === epiId; });
  var totalNeeded = checked.length * qte;
  if ((epi.stock || 0) < totalNeeded) return toast('Stock insuffisant (' + (epi.stock || 0) + ' disponible, ' + totalNeeded + ' requis)', 'error');
  var attribs = getEpiAttributions();
  var date = (document.getElementById('ae_date')||{}).value || today();
  var statut = (document.getElementById('ae_statut')||{}).value || 'actif';
  var comment = (document.getElementById('ae_comment')||{}).value || '';
  checked.forEach(function(cb) {
    for (var i = 0; i < qte; i++) {
      attribs.push({ id: genId(), employee_id: cb.value, epi_id: epiId, date_attribution: date, statut: statut, etat: 'Bon', commentaire: comment });
    }
  });
  setEpiAttributions(attribs);
  epi.stock = (epi.stock || 0) - totalNeeded;
  setEpiCatalogue(cat);
  document.getElementById('modalOverlay').remove();
  toast(totalNeeded + ' EPI attribué(s) à ' + checked.length + ' employé(s), stock déduit');
  renderPage();
}

function returnEpiAttribution(id) {
  var attribs = getEpiAttributions();
  var a = attribs.find(function(x) { return x.id === id; });
  if (!a) return;
  a.statut = 'inactif';
  a.date_remplacement = today();
  setEpiAttributions(attribs);
  var cat = getEpiCatalogue();
  var e = cat.find(function(x) { return x.id === a.epi_id; });
  if (e) e.stock = (e.stock || 0) + 1;
  setEpiCatalogue(cat);
  toast('EPI retourné, stock réaugmenté');
  renderPage();
}

function deleteEpiAttribution(id) {
  if (!confirm2('Supprimer cette attribution ?')) return;
  setEpiAttributions(getEpiAttributions().filter(function(a) { return a.id !== id; }));
  toast('Attribution supprimée');
  renderPage();
}

  var h = '<div style="display:flex;gap:.5rem;margin-bottom:1rem;align-items:center">';

  filtered.forEach(function(e) {
    var stock = e.stock || 0;
    var min = e.seuil_minimum || 0;
    var etat = stock <= 0 ? '🔴 Rupture' : stock <= min ? '🟡 Sous seuil' : '🟢 OK';
    h += '<tr>';
    h += '<td style="font-weight:600">' + escH(e.code) + ' — ' + escH(e.designation) + '</td>';
    h += '<td style="text-align:right;font-weight:700;' + (stock <= min ? 'color:var(--red)' : '') + '">' + stock + '</td>';

function calcColisSortie(colisCode) {
  if (!colisCode) return { totalSortie: 0, qteSortie: 0, restant: 0, details: '' };
  var totalSortie = 0;
  var qteSortie = 0;
  var details = [];
  var prods = getProductions();
  prods.forEach(function(p) {
    if (!p.sortie_bois) return;
    p.sortie_bois.forEach(function(sb) {
      if (sb.code === colisCode) {
        totalSortie += parseFloat(sb.volume || 0);
        qteSortie += parseInt(sb.qte || 0, 10);
        details.push('Fiche ' + (p.numero || p.id) + ' (' + fmtD(p.date) + ')');
      }
    });
  });
  /* Chercher le volume d'origine dans stockRaw */
  var stockRaw = getStockRaw();
  var original = 0;
  for (var i = 0; i < stockRaw.length; i++) {
    if (stockRaw[i].code === colisCode || stockRaw[i].colis_number === colisCode) {
      original = parseFloat(stockRaw[i].volume || 0);
      break;
    }
  }
  var restant = original - totalSortie;
  return { totalSortie: totalSortie, qteSortie: qteSortie, restant: restant, details: details.join(', ') || 'Aucune sortie' };
}
