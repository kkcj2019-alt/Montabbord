<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACSER — Exploitation</title>
<style>
:root{--bg:#f8f9fa;--surface:#fff;--card:#fff;--border:#e5e7eb;--text:#1e293b;--dim:#64748b;--accent:#f97316;--accent2:#fb923c;--accentLight:#fff7ed;--green:#22c55e;--blue:#3b82f6;--red:#ef4444;--purple:#a855f7;--gold:#eab308;--sidebarBg:#1e293b;--sidebarText:#cbd5e1;--sidebarActive:rgba(249,115,22,.15)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:3px}
.sidebar{width:260px;background:var(--sidebarBg);border-right:1px solid #334155;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .3s;overflow-y:auto}
.sidebar.hidden{transform:translateX(-100%)}
.sidebar-header{padding:1rem 1rem .8rem;border-bottom:1px solid #334155}
.sidebar-header .logo{display:flex;align-items:center;gap:.5rem}
.sidebar-header .logo-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem}
.sidebar-header h2{font-size:.95rem;color:#fff;font-weight:700}
.sidebar-header small{color:var(--sidebarText);font-size:.7rem}
.sidebar-search{padding:.6rem .8rem}
.sidebar-search input{width:100%;padding:.4rem .7rem;border-radius:6px;border:1px solid #475569;background:#0f172a;color:#e2e8f0;font-size:.78rem}
.sidebar-search input::placeholder{color:#64748b}
.nav-group{padding:.4rem 0}
.nav-group-label{padding:.4rem 1rem .2rem;font-size:.65rem;text-transform:uppercase;color:#64748b;letter-spacing:1.2px;font-weight:700}
.nav-parent{display:flex;align-items:center;gap:.5rem;padding:.5rem 1rem;cursor:pointer;font-size:.82rem;color:var(--sidebarText);transition:all .15s;user-select:none}
.nav-parent:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-parent.active{background:var(--sidebarActive);color:var(--accent);font-weight:600}
.nav-parent .icon{width:20px;text-align:center;font-size:.85rem}
.nav-parent .label{flex:1}
.nav-parent .arrow{font-size:.6rem;transition:transform .2s;color:#64748b}
.nav-parent.open .arrow{transform:rotate(90deg)}
.nav-children{max-height:0;overflow:hidden;transition:max-height .25s ease}
.nav-children.open{max-height:500px}
.nav-child{display:flex;align-items:center;gap:.5rem;padding:.4rem 1rem .4rem 2.8rem;cursor:pointer;font-size:.78rem;color:#94a3b8;transition:all .15s;border-left:2px solid transparent}
.nav-child:hover{background:rgba(255,255,255,.04);color:#e2e8f0}
.nav-child.active{color:var(--accent);border-left-color:var(--accent);font-weight:600;background:rgba(249,115,22,.08)}
.nav-child .dot{width:5px;height:5px;border-radius:50%;background:#475569;flex-shrink:0}
.nav-child.active .dot{background:var(--accent)}
.nav-section-sep{border-top:1px solid #334155;margin:.3rem 1rem}
.main{margin-left:260px;flex:1;padding:1.5rem;min-height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:.5rem}
.topbar h1{font-size:1.3rem;font-weight:700;color:#1e293b}
.topbar .subtitle{font-size:.75rem;color:var(--dim);margin-top:.1rem}
.btn{padding:.5rem 1rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);cursor:pointer;font-size:.8rem;transition:all .2s;display:inline-flex;align-items:center;gap:.4rem;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 2px 8px rgba(249,115,22,.12)}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.btn-accent:hover{background:var(--accent2)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-red{background:var(--red);color:#fff;border-color:var(--red)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.2rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h3{font-size:.9rem;margin-bottom:.6rem;color:#334155;font-weight:600}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1rem}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:transform .15s,box-shadow .15s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.stat-card .value{font-size:1.6rem;font-weight:800;color:var(--accent)}
.stat-card .label{font-size:.72rem;color:var(--dim);margin-top:.3rem;font-weight:500}
.stat-card .icon{font-size:1.5rem;margin-bottom:.3rem;opacity:.7}
table{width:100%;border-collapse:collapse;font-size:.82rem;background:#fff;border:1px solid #94a3b8}
th,td{padding:.55rem .7rem;text-align:left;border:1px solid #94a3b8}
th{background:linear-gradient(180deg,#f1f5f9,#e2e8f0);color:#0f172a;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;font-weight:700;z-index:1}
tbody tr:nth-child(even) td{background:#f8fafc}
tbody tr:hover td{background:#e8f1fd}
/* Tableaux stock : en-têtes bleus unifiés (façon onglet Stock BL) */
#stockTable thead th, #blTable thead th{background:linear-gradient(180deg,#eff6ff,#dbeafe);color:#1e40af;border-color:#bfdbfe}
#stockTable, #blTable{border-color:#bfdbfe}
#stockTable td, #blTable td{border-color:#dbeafe}
.badge-draft{background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:600}
.badge-active{background:#d1fae5;color:#065f46;padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:600}
.badge-done{background:#dbeafe;color:#1e40af;padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:600}
.badge-danger{background:#fee2e2;color:#991b1b;padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:600}
.form-group{margin-bottom:.8rem}
.form-group label{display:block;font-size:.75rem;font-weight:600;color:#475569;margin-bottom:.3rem}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:.5rem .7rem;background:#fff;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.82rem;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(249,115,22,.1)}
.form-group textarea{min-height:60px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.8rem}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:1rem}
.tab{padding:.5rem 1rem;cursor:pointer;font-size:.82rem;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;font-weight:500}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;padding:.7rem 1.2rem;border-radius:8px;font-size:.82rem;z-index:9999;animation:slideIn .3s;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast-success{background:#065f46;color:#fff}
.toast-error{background:#991b1b;color:#fff}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1rem;max-width:1300px;width:96vw;max-height:92vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.modal h2{font-size:1rem;margin-bottom:1rem;color:#334155;font-weight:600}
.empty{text-align:center;padding:3rem;color:var(--dim);font-size:.85rem}
.progress-bar{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin-top:.3rem}
.progress-bar .fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.search-box{padding:.5rem .8rem;background:#fff;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.82rem;width:250px}
.search-box:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(249,115,22,.1)}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.show{transform:translateX(0)}.main{margin-left:0}.form-row,.form-row-3{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr 1fr}}

.sidebar { transition: width .25s ease, transform .25s ease; }
.sidebar.collapsed { width: 70px !important; }
.sidebar.collapsed .logo div:nth-child(2),
.sidebar.collapsed .sidebar-search,
.sidebar.collapsed .nav-group-label,
.sidebar.collapsed .label,
.sidebar.collapsed .arrow,
.sidebar.collapsed .nav-children { display: none !important; }
.sidebar.collapsed .sidebar-header { justify-content: center; padding: 1rem 0.5rem; }
.sidebar.collapsed .nav-parent { justify-content: center; padding: 0.75rem 0; gap: 0; }
.sidebar.collapsed .nav-parent .icon { font-size: 1.25rem; margin: 0; }

.sidebar-action-btn { background: none; border: none; color: var(--dim); cursor: pointer; padding: 4px 6px; border-radius: 6px; font-size: 0.85rem; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s; }
.sidebar-action-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
.sidebar.pinned { border-right: 2px solid #f97316; box-shadow: 4px 0 25px rgba(0,0,0,0.3); }
/* Bouton hamburger : caché sur desktop, affiché uniquement sur mobile */
#sidebarOpenBtn { display: none; background: none; border: none; cursor: pointer; color: var(--text); padding: 6px; border-radius: 6px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
#sidebarOpenBtn:hover { background: var(--border); }
/* Bouton Retour : toujours visible (desktop + mobile) */
#navBackBtn { display: inline-flex; align-items: center; justify-content: center; background: none; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; color: var(--text); font-size: 1rem; font-weight: 700; width: 34px; height: 34px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
#navBackBtn:hover { background: var(--border); color: var(--accent); border-color: var(--accent); }
@media(max-width:768px) { #sidebarOpenBtn { display: inline-flex; align-items: center; justify-content: center; } }

/* Fiche production : cases ouvertes style tableur (pas de cadre) — clic + saisie directe */
#lattesBody input, #plotsBody input, #cpBody input, #assBody input, #encBody input,
#lattesBody select, #plotsBody select, #cpBody select, #assBody select, #encBody select,
#sortieBoisLignes input, #sortieBoisLignes select {
  border: none !important; background: transparent !important; box-shadow: none !important;
  border-radius: 0 !important; outline: none !important; width: 100% !important; min-width: 40px;
}
#lattesBody input:hover, #plotsBody input:hover, #cpBody input:hover, #assBody input:hover, #encBody input:hover,
#lattesBody select:hover, #plotsBody select:hover, #cpBody select:hover, #assBody select:hover, #encBody select:hover,
#sortieBoisLignes input:hover, #sortieBoisLignes select:hover { background: #f1f5f9 !important; }
#lattesBody input:focus, #plotsBody input:focus, #cpBody input:focus, #assBody input:focus, #encBody input:focus,
#lattesBody select:focus, #plotsBody select:focus, #cpBody select:focus, #assBody select:focus, #encBody select:focus,
#sortieBoisLignes input:focus, #sortieBoisLignes select:focus { background: #fff7ed !important; box-shadow: inset 0 -2px 0 var(--accent) !important; }
/* Desktop : quand la sidebar est repliée, le contenu s'élargit (comme index) */
.sidebar.collapsed + .main { margin-left: 70px; }
/* Champs de recherche : encadré ambre, impossible à rater */
input[placeholder*="echerch" i],input[placeholder*="iltrer" i],input[type="search"]{border:2px solid #f59e0b !important;background-color:#fffbeb !important;box-shadow:0 0 0 3px rgba(245,158,11,.15) !important}
input[placeholder*="echerch" i]:focus,input[placeholder*="iltrer" i]:focus,input[type="search"]:focus{outline:none !important;border-color:#ea580c !important;box-shadow:0 0 0 4px rgba(234,88,12,.2) !important;background-color:#fff !important}
/* Overlay mobile (comme index) : clic dessus = fermeture */
#sidebarOverlay { display: none; }
@media(max-width:768px) {
  #sidebarOverlay.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 90; }
  .sidebar.show { z-index: 100; }
}
/* ===== Mobile : stabilité + confort téléphone ===== */
#pageActions { flex-wrap: wrap; }
.tabs { overflow-x: auto; }
.tabs .tab, .tab { white-space: nowrap; flex-shrink: 0; }
/* Lecture seule (droits) : masque les boutons de création/suppression */
body.prod-readonly .btn-accent, body.prod-readonly .btn-red { display: none !important; }
@media(max-width:768px) {
  .main { padding: .8rem !important; }
  .card { padding: .8rem !important; overflow-x: auto; }
  .sidebar { max-width: 85vw; }
  .sidebar.collapsed + .main { margin-left: 0 !important; }
  .modal-overlay { padding: 8px; }
  .modal { padding: .8rem; border-radius: 12px; width: calc(100vw - 16px); }
  .modal [style*="display:flex"] { flex-wrap: wrap; }
  .toast { left: 1rem; right: 1rem; bottom: 1rem; }
  .search-box { width: 100%; max-width: 100%; }
  .stats-grid { grid-template-columns: 1fr !important; }
  .empty { padding: 1.5rem .5rem; }
}

/* Temporary hover expansion when collapsed */
.sidebar.collapsed:hover { width: 260px !important; z-index: 160; box-shadow: 8px 0 30px rgba(0,0,0,0.3); }
.sidebar.collapsed:hover .logo div:nth-child(2),
.sidebar.collapsed:hover .sidebar-search,
.sidebar.collapsed:hover .nav-group-label,
.sidebar.collapsed:hover .label,
.sidebar.collapsed:hover .arrow { display: block !important; }
.sidebar.collapsed:hover .sidebar-header { justify-content: space-between; padding: 1rem 1.2rem; }
.sidebar.collapsed:hover .nav-parent { justify-content: flex-start; padding: .65rem .9rem; gap: .75rem; }

</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="supabase-sdk/supabase.js"></script>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header" style="display:flex;align-items:center;justify-content:space-between;width:100%">
    <div class="logo" style="display:flex;align-items:center;gap:0.6rem">
      <div class="logo-icon">🏭</div>
      <div>
        <h2 style="font-size:1.05rem;margin:0">SmartStock</h2>
        <small style="font-size:0.7rem;color:var(--dim)">Exploitation</small>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:2px">
      <button class="sidebar-action-btn" id="sidebarPinBtn" onclick="toggleSidebarPin()" title="Épingler le menu (Toujours visible)">📌</button>
      <button class="sidebar-action-btn" id="sidebarCollapseBtn" onclick="toggleSidebarCollapse()" title="Replier / Déplier le menu">◀</button>
    </div>
  </div>
  <div class="sidebar-search">
    <input type="text" placeholder="Rechercher un menu..." id="menuSearch" oninput="filterMenus(this.value)">
  </div>
  <nav id="nav"></nav>
  <div class="nav-section-sep"></div>
  <div style="padding:.5rem 0">
    <div class="nav-parent" onclick="localStorage.setItem('mdb_aliveTs',String(Date.now()));window.location.href='index.html#entreprise'">
      <span class="icon">⚙️</span>
      <span class="label">Paramètres</span>
    </div>
    <div class="nav-parent" onclick="window.location.href='index.html?logout=1'" style="color:#ef4444">
      <span class="icon">🚪</span>
      <span class="label">Déconnexion</span>
    </div>
  </div>
  <div style="margin-top:auto;padding:.6rem;border-top:1px solid #334155">
    <a href="index.html" style="color:#64748b;font-size:.72rem;text-decoration:none;display:flex;align-items:center;gap:.3rem">← Retour à Montabbord</a>
  </div>
</aside>
<div id="sidebarOverlay" onclick="closeSidebar()"></div>

<main class="main" id="app">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:.8rem">
      <button id="navBackBtn" onclick="goBack()" title="Retour à la page précédente" aria-label="Retour">←</button>
      <button id="sidebarOpenBtn" onclick="toggleSidebar()" title="Afficher le menu" aria-label="Menu"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <h1 id="pageTitle">Tableau de Bord</h1>
      <span id="pageActions" style="display:flex;gap:.4rem;align-items:center"></span>
    </div>
    <div style="display:flex;gap:.5rem;align-items:center">
      <label for="globalMonth" style="font-size:.72rem;color:var(--dim);font-weight:600" title="Filtrer toutes les données par mois">Mois</label>
      <input type="month" id="globalMonth" onchange="setGlobalMonth(this.value)" title="Afficher uniquement les données du mois sélectionné (vide = tout)" style="padding:.4rem .6rem;border:1px solid var(--border);border-radius:8px;font-size:.78rem;color:var(--text);background:#fff;max-width:150px">
      <input type="text" class="search-box" placeholder="🔍 Rechercher..." id="globalSearch" oninput="globalSearchFn(this.value)">
      <span style="font-size:.75rem;color:var(--dim)" id="dateDisplay"></span>
    </div>
  </div>
  <div id="content"></div>
</main>

<script>
/* ==================== CONFIG ==================== */
var DB_KEY = 'mdb_production';
var CURRENT_PAGE = 'dashboard';

function getDB() { try { return JSON.parse(localStorage.getItem(DB_KEY)) || {}; } catch(e) { return {}; } }
function setDB(v) { localStorage.setItem(DB_KEY, JSON.stringify(v)); }
function getSection(key, def) { var db = getDB(); return db[key] !== undefined ? db[key] : def; }
function setSection(key, val) { var db = getDB(); db[key] = val; setDB(db); try { if (typeof scheduleProdPush === 'function') scheduleProdPush(); } catch(e) {} }
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }
function today() { return new Date().toISOString().slice(0, 10); }
function thisMonth() { return new Date().toISOString().slice(0, 7); }
function monthLabel(ym) {
  var _mn = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  var mIdx = parseInt((ym || '').slice(5, 7), 10) - 1;
  return mIdx >= 0 ? _mn[mIdx] + ' ' + (ym || '').slice(0, 4) : ym || '';
}
function fmt(n) { return new Intl.NumberFormat('fr-FR').format(Math.floor(n || 0)); }
function fmtF(n) { return fmt(n) + ' F'; }
function escH(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function fmtD(d) { if (!d) return '-'; var s = String(d).slice(0, 10); var m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/); if (m) return m[3] + '-' + m[2] + '-' + m[1]; return s; }
function toast(msg, type) {
  var t = document.createElement('div');
  t.className = 'toast toast-' + (type || 'success');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 3000);
}
function confirm2(msg) { return window.confirm(msg); }

function isLoggedInProd() {
  try {
    var rawU = localStorage.getItem('mdb_currentUser');
    if (rawU) return true;
    var uDisp = JSON.parse(localStorage.getItem('mdb_userDisplay') || 'null');
    if (uDisp && (uDisp.nom || uDisp.username || uDisp.login)) return true;
    return false;
  } catch(e) { return false; }
}

/* ============ IDLE TIMEOUT PARTAGÉ (index / paye / production) ============ */
var _idleTimeoutMs = 30 * 60 * 1000;
var _lastActivityProd = Date.now();
var _idleTimerProd = null;
var _idleStartedProd = false;
function persistIdleActivityProd() {
  try { localStorage.setItem('mdb_lastActivity', String(_lastActivityProd)); } catch(e) {}
}
function resetIdleTimerProd() {
  _lastActivityProd = Date.now();
  persistIdleActivityProd();
}
function startIdleTrackingProd() {
  if (_idleStartedProd) return;
  _idleStartedProd = true;
  var stored = parseInt(localStorage.getItem('mdb_lastActivity'), 10) || 0;
  if (stored) _lastActivityProd = stored;
  var evts = ['mousemove', 'mousedown', 'keydown', 'click', 'scroll', 'touchstart', 'wheel'];
  var onActivity = function() { _lastActivityProd = Date.now(); };
  for (var i = 0; i < evts.length; i++) {
    window.addEventListener(evts[i], onActivity, {passive: true});
  }
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible' && isLoggedInProd() && (Date.now() - _lastActivityProd) > _idleTimeoutMs) {
      window.location.href = 'index.html';
    }
  });
  _idleTimerProd = setInterval(function() {
    persistIdleActivityProd();
    if (isLoggedInProd() && (Date.now() - _lastActivityProd) > _idleTimeoutMs) {
      window.location.href = 'index.html';
    }
  }, 30000);
}

/* ==================== NAVIGATION ==================== */
var NAV = [
  { group: 'ACCUEIL', items: [
    { id: 'dashboard', label: 'Tableau de bord', icon: '📊' }
  ]},

var OPEN_GROUPS = JSON.parse(localStorage.getItem('mdb_prod_openGroups') || '{}');

function toggleGroup(itemId) {
  /* Si la sidebar est repliée (icônes seules), la déplier d'abord sinon le sous-menu reste invisible */
  var sb = document.getElementById('sidebar');
  if (sb && window.innerWidth > 768 && sb.classList.contains('collapsed') && !_sidebarPinned) {
    _sidebarCollapsed = false;
    sb.classList.remove('collapsed');
    try { localStorage.setItem('mdb_sidebarCollapsed', '0'); } catch(e) {}
    _sbExpandTime = Date.now();
    updateSidebarButtonsUI();
  }
  /* Bascule indépendante : ouvrir un menu ne ferme plus les autres */
  OPEN_GROUPS[itemId] = !OPEN_GROUPS[itemId];
  localStorage.setItem('mdb_prod_openGroups', JSON.stringify(OPEN_GROUPS));
  renderNav();
}

function renderNav() {
  var h = '';
  NAV.forEach(function(g) {
    h += '<div class="nav-group">';
    h += '<div class="nav-group-label">' + escH(g.group) + '</div>';
    g.items.forEach(function(item) {
      if (item.children) {
        var isOpen = OPEN_GROUPS[item.id] || false;
        var hasActive = item.children.some(function(c) { return CURRENT_PAGE === c.id; });
        h += '<div class="nav-parent' + (isOpen ? ' open' : '') + (hasActive ? ' active' : '') + '" onclick="toggleGroup(\x27' + escH(item.id) + '\x27)">';
        h += '<span class="icon">' + item.icon + '</span>';
        h += '<span class="label">' + escH(item.label) + '</span>';
        h += '<span class="arrow">' + (isOpen ? '▼' : '▶') + '</span>';
        h += '</div>';
        h += '<div class="nav-children' + (isOpen ? ' open' : '') + '">';
        var _visKids = (typeof prodChildVisible === 'function') ? item.children.filter(function(c) { return prodChildVisible(c.id); }) : item.children;
        if (!_visKids.length) return;
        _visKids.forEach(function(c) {
          h += '<div class="nav-child' + (CURRENT_PAGE === c.id ? ' active' : '') + '" onclick="navigate(\x27' + c.id + '\x27)">';
          h += '<span class="dot"></span>' + escH(c.label);
          h += '</div>';
        });
        h += '</div>';
      } else {
        if (typeof prodChildVisible === 'function' && !prodChildVisible(item.id)) return;
        h += '<div class="nav-parent' + (CURRENT_PAGE === item.id ? ' active' : '') + '" onclick="navigate(\x27' + item.id + '\x27)">';
        h += '<span class="icon">' + item.icon + '</span>';
        h += '<span class="label">' + escH(item.label) + '</span>';
        h += '</div>';
      }
    });
    h += '</div>';
  });
  document.getElementById('nav').innerHTML = h;
}

function filterMenus(q) {
  var items = document.querySelectorAll('.nav-parent, .nav-child');
  var groups = document.querySelectorAll('.nav-group');
  q = q.toLowerCase();
  groups.forEach(function(g) {
    var children = g.querySelectorAll('.nav-parent, .nav-child');
    var anyVisible = false;
    children.forEach(function(c) {
      var match = c.textContent.toLowerCase().indexOf(q) !== -1;
      c.style.display = match || !q ? '' : 'none';
      if (match || !q) anyVisible = true;
    });
    g.style.display = anyVisible || !q ? '' : 'none';
  });
}

/* ===== Auto-draft: mémorise la saisie en cours entre les menus (même app) ===== */
var _autoDTimer = null;
function autoSaveDraft() {
  try {
    var form = document.getElementById('prod-form');
    if (!form) return;
    var draft = { t: Date.now(), v: {} };
    var el = form.querySelectorAll('input,textarea,select');
    for (var i = 0; i < el.length; i++) {
      var f = el[i];
      if (!f.id) continue;
      draft.v[f.id] = (f.type === 'checkbox' ? (f.checked ? '1' : '0') : f.value);
    }
    sessionStorage.setItem('mdb_prod_autoDraft', JSON.stringify(draft));
  } catch (e) {}
}
function clearAutoDraft() {
  try { sessionStorage.removeItem('mdb_prod_autoDraft'); } catch (e) {}
}
function applyAutoDraft() {
  try {
    var raw = sessionStorage.getItem('mdb_prod_autoDraft');
    if (!raw) return;
    var draft = JSON.parse(raw);
    var form = document.getElementById('prod-form');
    if (!form) return;
    var el = form.querySelectorAll('input,textarea,select');
    for (var i = 0; i < el.length; i++) {
      var f = el[i];
      if (!f.id || !(f.id in draft.v)) continue;
      var sv = draft.v[f.id];
      if (f.type === 'checkbox') f.checked = (sv === '1');
      else if (f.value === '' || f.value === null || f.value === undefined) f.value = sv;
    }
  } catch (e) {}
}
document.addEventListener('input', function(e) {
  if (e.target && e.target.closest && e.target.closest('#prod-form')) {
    if (_autoDTimer) clearTimeout(_autoDTimer);
    _autoDTimer = setTimeout(autoSaveDraft, 600);
  }
});
document.addEventListener('change', function(e) {
  if (e.target && e.target.closest && e.target.closest('#prod-form')) {
    if (_autoDTimer) clearTimeout(_autoDTimer);
    _autoDTimer = setTimeout(autoSaveDraft, 300);
  }
});

function prodGrantedMap() { try { var g = JSON.parse(localStorage.getItem('mdb_prod_granted')); if (g && g.pages) return g.pages; } catch(e) {} return null; }

function navigate(page) {
  autoSaveDraft();
  if (typeof prodPageKey === 'function') {
    var _pk = prodPageKey(page);
    if (_pk && !prodCanRead(_pk)) { try { toast('Accès non autorisé', 'error'); } catch(e) {} return; }
  }
  /* Historique pour le bouton Retour */
  if (!window._navHist) window._navHist = [];
  if (!window._navigatingBack && CURRENT_PAGE && CURRENT_PAGE !== page) {
    window._navHist.push(CURRENT_PAGE);
    if (window._navHist.length > 20) window._navHist.shift();
  }
  window._navigatingBack = false;
  CURRENT_PAGE = page;
  localStorage.setItem('mdb_prod_currentPage', page);
  renderNav();

  if (window.innerWidth <= 768) closeSidebar();
}

function getGlobalMonth() { return window._globalMonth || ''; }
function setGlobalMonth(v) {
  window._globalMonth = v || '';
  try { localStorage.setItem('mdb_prod_globalMonth', window._globalMonth); } catch (e) {}
  var inp = document.getElementById('globalMonth');
  if (inp && inp.value !== window._globalMonth) inp.value = window._globalMonth;
  renderPage();
}
function monthMatch(d) {
  var gm = getGlobalMonth();
  if (!gm) return true;
  return String(d || '').indexOf(gm) === 0;
}
/* Date du stock initial = le 01 du mois en question (mois global sélectionné, sinon mois du 1er mouvement, sinon mois courant) */
function initialRowDate(firstEvtDate) {
  var gm = getGlobalMonth();
  var ym = gm || (firstEvtDate ? String(firstEvtDate).slice(0, 7) : thisMonth());
  if (!/^\d{4}-\d{2}$/.test(ym)) ym = thisMonth();
  return '01-' + ym.slice(5, 7) + '-' + ym.slice(0, 4);
}

function goBack() {
  var prev = (window._navHist && window._navHist.length) ? window._navHist.pop() : 'dashboard';
  window._navigatingBack = true;
  navigate(prev);
}

function toggleSidebar() {
  /* ☰ : sur mobile ouvre/ferme le tiroir, sur desktop replie/déplie (comme index) */

  if (isMobileView()) {

      if (ov) ov.classList.add('open');

  }
}

  var sb = document.getElementById('sidebar');

  if (ov) ov.classList.remove('open');
}

    var _rk = (typeof prodPageKey === 'function') ? prodPageKey(CURRENT_PAGE) : '';
    if (_rk && !prodCanRead(_rk)) {
      document.getElementById('content').innerHTML = '<div class="empty">🔒 Accès non autorisé à cette page.</div>';
      return;
    }
    var _rw = (typeof prodCanWrite === 'function') ? prodCanWrite(_rk) : true;

  } catch(e) {}
  var actions = document.getElementById('pageActions');

/* Parse heures "8", "8:00", "8h00", "7h30", décimal → heures (float) */
function ptPXParseH(v) {
  if (v === null || v === undefined) return 0;
  var s = String(v).trim().replace(',', '.');
  if (!s) return 0;
  var m = s.match(/^(\d{1,2})\s*[:hH]\s*(\d{1,2})$/);
  if (m) return (parseInt(m[1], 10) || 0) + (parseInt(m[2], 10) || 0) / 60;
  var f = parseFloat(s);
  return isNaN(f) ? 0 : f;
}
function ptPXFmtH(h) {
  h = Math.round((parseFloat(h) || 0) * 100) / 100;
  var H = Math.floor(h), M = Math.round((h - H) * 60);
  if (M === 60) { H++; M = 0; }
  return H + 'h' + (M < 10 ? '0' : '') + M;
}
function ptPXToMin(t) {
  if (t === null || t === undefined || t === '') return null;
  var m = String(t).trim().match(/^(\d{1,2})\s*[:hH]\s*(\d{2})$/);
  if (!m) return null;
  var h = parseInt(m[1], 10), mm = parseInt(m[2], 10);
  if (h > 23 || mm > 59) return null;
  return h * 60 + mm;
}
function ptPXIsNight(min) { var m = ((min % 1440) + 1440) % 1440; return m >= 1260 || m < 300; }
/* Durée des créneaux détaillés (heures) */
function ptPXDurDetailed(rec) {
  function one(a, b) {
    var s = ptPXToMin(a), e = ptPXToMin(b);
    if (s === null || e === null) return 0;
    if (e <= s) e += 1440;
    return (e - s) / 60;
  }
  var t = 0, tj = 0, tn = 0;
  if (rec.j_arrivee && rec.j_pause) tj += one(rec.j_arrivee, rec.j_pause);
  if (rec.j_reprise && rec.j_fin) tj += one(rec.j_reprise, rec.j_fin);
  if (tj === 0 && rec.j_arrivee && rec.j_fin) tj += one(rec.j_arrivee, rec.j_fin);
  if (rec.n_arrivee && rec.n_pause) tn += one(rec.n_arrivee, rec.n_pause);
  if (rec.n_reprise && rec.n_fin) tn += one(rec.n_reprise, rec.n_fin);
  if (tn === 0 && rec.n_arrivee && rec.n_fin) tn += one(rec.n_arrivee, rec.n_fin);
  t = tj + tn;
  return Math.round(t * 100) / 100;
}
/* Calcule {j, n, r} d'une fiche (même logique que la Paye) */
function ptPXDay(rec, isR) {
  if (!rec || (rec.present === false && !rec.absent_paye)) return { j: 0, n: 0, r: 0 };
  var libres = parseFloat(rec.h_libres) || 0;
  if (isR) return { j: 0, n: 0, r: Math.round((ptPXDurDetailed(rec) + libres) * 100) / 100 };
  if (rec.absent_paye) return { j: ptPXParseH(rec.h_j_manual), n: ptPXParseH(rec.h_n_manual), r: 0 };
  var hasJ = rec.j_arrivee || rec.j_pause || rec.j_reprise || rec.j_fin;
  var hasN = rec.n_arrivee || rec.n_pause || rec.n_reprise || rec.n_fin;
  if (!hasJ && !hasN) return { j: Math.round((ptPXParseH(rec.h_j_manual) + libres) * 100) / 100, n: ptPXParseH(rec.h_n_manual), r: 0 };
  function span(a, b) {
    var s = ptPXToMin(a), e = ptPXToMin(b);
    if (s === null || e === null) return { j: 0, n: 0 };
    if (e <= s) e += 1440;
    var j = 0, n = 0;
    for (var t = s; t < e; t++) { if (ptPXIsNight(t)) n++; else j++; }
    return { j: j / 60, n: n / 60 };
  }
  function pair(a, p1, p2, f) {
    var r1 = (a && p1) ? span(a, p1) : { j: 0, n: 0 };
    var r2 = (p2 && f) ? span(p2, f) : { j: 0, n: 0 };
    if (r1.j + r1.n + r2.j + r2.n === 0 && a && f) return span(a, f);
    return { j: r1.j + r2.j, n: r1.n + r2.n };
  }
  var dj = pair(rec.j_arrivee, rec.j_pause, rec.j_reprise, rec.j_fin);
  var dn = pair(rec.n_arrivee, rec.n_pause, rec.n_reprise, rec.n_fin);
  var j = dj.j + dn.j, n = dj.n + dn.n;
  if (j === 0) { var lj = ptPXParseH(rec.h_j_manual); if (lj > 0) j = lj; }
  if (n === 0) { var ln = ptPXParseH(rec.h_n_manual); if (ln > 0) n = ln; }
  j += libres;
  return { j: Math.round(j * 100) / 100, n: Math.round(n * 100) / 100, r: 0 };
}

/* Stats HS mensuelles (même calcul que la Paye : dim → 75/100, nuit → 75, jour au-delà de 40h/sem → 15 puis 50) */
function ptPXMonthStats(empId, ym, arr) {
  var hs15 = 0, hs50 = 0, hs75 = 0, hs100 = 0, weeklyNormal = 0, weeklyHS15 = 0, curWeek = -1;
  var y = parseInt(ym.slice(0, 4), 10), mi = parseInt(ym.slice(5, 7), 10) - 1;
  var dim = new Date(y, mi + 1, 0).getDate();
  var firstDow = (new Date(y, mi, 1).getDay() + 6) % 7;
  for (var d = 1; d <= dim; d++) {
    var dk = ym + '-' + (d < 10 ? '0' : '') + d;
    var week = Math.floor((d + firstDow - 1) / 7);
    if (week !== curWeek) { weeklyNormal = 0; weeklyHS15 = 0; curWeek = week; }
    var isSun = new Date(y, mi, d).getDay() === 0;
    var rec = null;
    for (var i = 0; i < arr.length; i++) { if (arr[i] && arr[i].employee_id === empId && arr[i].date === dk) { rec = arr[i]; break; } }

    var hN = (rec.h_n_manual !== undefined && rec.h_n_manual !== '') ? ptPXParseH(rec.h_n_manual) : 0;
    if (isSun) { hs75 += hJ; hs100 += hN; }

function phaseLabel(code) {
  var p = PHASES.find(function(x) { return x.code === code; });
  return p ? p.label : code;
}

function nextProdNumber() {
  var prods = getProductions();
  var now = new Date();
  var year = String(now.getFullYear()).slice(-2);
  var month = String(now.getMonth() + 1).padStart(2, '0');
  var prefix = year + month;
  var maxSeq = 0;
  prods.forEach(function(p) {
    var num = p.numero || '';
    if (num.startsWith(prefix)) {
      var seq = parseInt(num.slice(4), 10);
      if (seq > maxSeq) maxSeq = seq;
    }
  });
  return prefix + String(maxSeq + 1).padStart(2, '0');
}

function isCurrentUserAdmin() {
  try {
    var uDisp = JSON.parse(localStorage.getItem('mdb_userDisplay') || 'null');
    if (uDisp && uDisp.isAdmin) return true;
    var rawU = localStorage.getItem('mdb_currentUser');
    if (rawU) {
      var cu = JSON.parse(rawU);
      if (cu && cu.isAdmin) return true;
    }
    var users = JSON.parse(localStorage.getItem('mdb_users') || '[]');
    var curName = (uDisp && (uDisp.nom || uDisp.username || uDisp.login)) || (cu && (cu.nom || cu.login || cu.username)) || '';
    var found = users.find(function(u) { return u && (u.id === curName || u.login === curName || u.nom === curName) && u.isAdmin; });
    if (found) return true;
  } catch(e) {}
  return false;
}

function nextOPNumber() {
  var ops = getProductionOrders();
  var max = 0;
  ops.forEach(function(o) {
    var n = parseInt((o.numero || '').replace(/\D/g, ''), 10);
    if (n > max) max = n;
  });
  return 'OP-' + String(max + 1).padStart(4, '0');
}

/* ==================== DASHBOARD ==================== */
function calcVolume(length, width, thickness) {
  return (parseFloat(length) || 0) * (parseFloat(width) || 0) * (parseFloat(thickness) || 0) / 1000000;
}

function getStockVolume() {
  var articles = getArticles();
  var totalVol = 0;
  var finishedVol = 0, semiVol = 0, rawVol = 0;
  
  getStockFinished().forEach(function(s) {
    var art = articles.find(function(a) { return a.id === s.article_id; });
    if (art && art.dimensions) {
      var dims = art.dimensions.split('x');
      if (dims.length === 3) {
        var vol = calcVolume(dims[0], dims[1], dims[2]) * (s.quantite || 0);
        finishedVol += vol;
        totalVol += vol;
      }
    }
  });
  
  getStockSemi().forEach(function(s) {
    var art = articles.find(function(a) { return a.id === s.article_id; });
    if (art && art.length && art.width && art.thickness) {
      var vol = calcVolume(art.length, art.width, art.thickness) * (s.quantite || 0);
      semiVol += vol;
      totalVol += vol;
    }
  });
  
  getStockRaw().forEach(function(s) {
    /* Volume réel de chaque entrée MP (champ volume ou dims × qté) */
    var v = 0;
    try { v = stkVol(s); } catch (e) { v = 0; }
    rawVol += v;
    totalVol += v;
  });
  
  return { total: totalVol, finished: finishedVol, semi: semiVol, raw: rawVol };
}

  getProductions().filter(function(p) { return p.statut === 'draft'; }).slice(0, 3).forEach(function(p) {
    alerts.push({ tag: 'PRODUCTION', name: p.numero || 'Fiche', sub: 'En attente de validation', n: '' });

  if (!alerts.length) h += '<div class="empty">Aucune alerte 🎉</div>';
  else {
    alerts.slice(0, 8).forEach(function(al) {
      h += '<div style="display:flex;align-items:center;gap:.7rem;padding:.5rem .2rem;border-bottom:1px solid var(--border)">';

      h += '<span style="font-size:.78rem;font-weight:800;color:#dc2626">' + escH(al.n) + '</span></div>';
    });
  }
  h += '</div>';

  return h;
}

/* Code colis tapé en sortie bois -> lot trouvé en stock : volume + quantité restante + pré-remplissage + blocage si absent */
function onSortieBoisCodeChange(idx, code) {
  var msg = document.getElementById('sb_msg_' + idx);
  if (!msg) return;
  var v = (code || '').trim().toLowerCase();
  if (!v) { msg.innerHTML = ''; _sbFieldState(idx, false); return; }
  var lot = getStockRaw().find(function(s) { return ((s.code || s.colis_number || '').toLowerCase() === v); });
  if (!lot) {
    msg.innerHTML = '<span style="font-size:.65rem;color:var(--red);font-weight:700">❌ Code non trouvé — saisie bloquée</span>';
    _sbFieldState(idx, true);
    return;
  }
  var q = parseFloat(lot.quantite) || 0;
  var vol = stkVol(lot);
  var col = q > 0 ? 'var(--green)' : 'var(--red)';
  msg.innerHTML = '<span style="font-size:.65rem;color:' + col + ';font-weight:700">En stock (' + q + ' pcs · ' + vol.toFixed(3) + ' m³)</span>';
  _sbFieldState(idx, false);
  var eEl = document.getElementById('sb_essence_' + idx);
  if (eEl && !eEl.value && lot.essence) eEl.value = lot.essence;
  var fEl = document.getElementById('sb_fournisseur_' + idx);
  if (fEl && !fEl.value && lot.fournisseur) fEl.value = lot.fournisseur;
  var dims = { qte: 'sb_qte_', long: 'sb_long_', larg: 'sb_larg_', epais: 'sb_epais_' };
  var vals = { qte: lot.quantite, long: lot.longueur || lot.length, larg: lot.largeur || lot.width, epais: lot.epaisseur || lot.thickness };
  var touched = false;
  Object.keys(dims).forEach(function(k) {
    var el = document.getElementById(dims[k] + idx);
    if (el && !el.value && vals[k]) { el.value = vals[k]; touched = true; }

  if (touched) calcSBVolume(idx);

function ensureAssDatalist() {

  dl.id = 'assCodeList';
  getAssCodeList().forEach(function(c) { dl.innerHTML += '<option value="' + escH(c.code) + '">' + escH(c.code + (c.designation ? ' — ' + c.designation : '')) + '</option>'; });

function onAssCodeChange(input) {
  var code = input.value.trim();
  var articles = getArticles();
  var match = articles.find(function(a) { return (a.code || '').toUpperCase() === code.toUpperCase(); });
  if (match) {
    var row = input.closest('tr');
    var texts = row.querySelectorAll('input[type="text"]');
    if (texts[1]) texts[1].value = match.designation || '';
    var nums = row.querySelectorAll('input[type="number"]');
    if (nums[1]) nums[1].value = match.length || match.longueur || 0;
    if (nums[2]) nums[2].value = match.width || match.largeur || 0;
    if (nums[3]) nums[3].value = match.thickness || match.epaisseur || 0;
    updateStockBadge(code);
  }
}
function updateStockBadge(articleCode) {
  var badge = document.getElementById('stockBadge');
  if (!badge) {
    badge = document.createElement('div');
    badge.id = 'stockBadge';
    badge.style.cssText = 'position:fixed;top:60px;right:12px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:.6rem .8rem;font-size:.7rem;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:999;max-width:280px;display:none';
    document.body.appendChild(badge);
  }
  if (!articleCode) { badge.style.display = 'none'; return; }
  var articles = getArticles();
  var article = articles.find(function(a) { return (a.code || '').toUpperCase() === articleCode.toUpperCase(); });
  if (!article) { badge.style.display = 'none'; return; }
  var composants = getSection('composants', []).filter(function(c) { return c.article_id === article.id; });
  if (!composants.length) { badge.style.display = 'none'; return; }
  var h = '<div style="font-weight:700;margin-bottom:.3rem;color:var(--accent)">📦 Stock ' + escH(article.code) + '</div>';
  composants.forEach(function(c) {
    var stock = 0;
    if (c.type === 'LATTE' || c.type === 'PLOT' || c.type === 'CP') {
      stock = semiStockQty(c.code);
    } else if (c.type === 'POINTE') {
      stock = consumStockQty(c.code);
    } else {
      var item = getStockRaw().find(function(s) { return (s.code || s.colis_number) === c.code; });
      stock = item ? (parseFloat(item.quantite) || 0) : 0;
    }
    var need = parseFloat(c.quantity) || 0;
    var ok = stock >= need;
    h += '<div style="display:flex;justify-content:space-between;padding:.15rem 0;border-bottom:1px solid #f1f5f9">';
    h += '<span>' + escH(c.code) + ' (' + escH(c.type || '') + ')</span>';
    h += '<span style="color:' + (ok ? 'var(--green)' : 'var(--red)') + ';font-weight:700">' + stock + (need ? ' / ' + need : '') + '</span>';
    h += '</div>';
  });
  badge.innerHTML = h;
  badge.style.display = 'block';
}

function encoursTotals() {
  var totalQ = 0, totalV = 0, volEntree = 0, volReprise = 0;
  document.querySelectorAll('#encBody tr[id^="encRow"]').forEach(function(r) {
    var inputs = r.querySelectorAll('input[type="number"]');
    if (inputs.length < 4) return;
    var qte = parseFloat(inputs[0].value) || 0;
    totalQ += qte;
    var l = parseFloat(inputs[1].value) || 0, w = parseFloat(inputs[2].value) || 0, t = parseFloat(inputs[3].value) || 0;
    var v = l * w * t / 1000000 * qte;
    totalV += v;
    var sel = r.querySelector('select[data-wiptype]');
    if (sel && sel.value === 'reprise') volReprise += v; else volEntree += v;
  });
  return { qte: totalQ, vol: totalV, entree: volEntree, reprise: volReprise };
}
function calcEncoursTotals() {
  var t = encoursTotals();
  var tq = document.getElementById('enc_total_qte');
  var tv = document.getElementById('enc_total_vol');
  if (tq) tq.textContent = t.qte;
  if (tv) tv.textContent = t.vol.toFixed(4);
  updateProductionSummary();
}

function onEncoursCodeChange(input) {

/* === RÉSUMÉ DE PRODUCTION (mise à jour live, bilan façon ACSER) === */
function updateProductionSummary() {
  /* Volume bois sorti */
  var sbVolEl = document.getElementById('sb_total_vol');
  var sbVol = sbVolEl ? (parseFloat(sbVolEl.textContent) || 0) : 0;

  /* Volume Lattes */
  var latteVolEl = document.getElementById('latte_total_vol');
  var latteVol = latteVolEl ? (parseFloat(latteVolEl.textContent) || 0) : 0;

  /* Volume Plots */
  var plotVolEl = document.getElementById('plot_total_vol');
  var plotVol = plotVolEl ? (parseFloat(plotVolEl.textContent) || 0) : 0;

  /* Volume CP */
  var cpVolEl = document.getElementById('cp_total_vol');
  var cpVol = cpVolEl ? (parseFloat(cpVolEl.textContent) || 0) : 0;

  /* En-cours : entrée (+) / reprise (+) base matière comme ACSER */
  var enc = encoursTotals();
  var totalProd = latteVol + plotVol + cpVol + enc.entree;
  var base = sbVol + enc.reprise;
  var rendement = base > 0 ? (totalProd / base * 100) : 0;
  var perteVol = base > 0 ? (base - totalProd) : 0;
  var perteTaux = base > 0 ? (perteVol / base * 100) : 0;

  var el;
  el = document.getElementById('summary_sb_vol');    if (el) el.textContent = sbVol.toFixed(4) + ' m³';
  el = document.getElementById('summary_latte_vol'); if (el) el.textContent = latteVol.toFixed(4) + ' m³';
  el = document.getElementById('summary_plot_vol');  if (el) el.textContent = plotVol.toFixed(4) + ' m³';
  el = document.getElementById('summary_cp_vol');    if (el) el.textContent = cpVol.toFixed(4) + ' m³';
  el = document.getElementById('summary_enc_vol');   if (el) el.textContent = enc.entree.toFixed(4) + ' m³';
  el = document.getElementById('summary_perte_vol'); if (el) el.textContent = perteVol.toFixed(4) + ' m³';
  el = document.getElementById('summary_perte_taux'); if (el) el.textContent = perteTaux.toFixed(1) + ' %';
  el = document.getElementById('summary_rendement'); if (el) {
    el.textContent = rendement.toFixed(1) + ' %';
    el.style.color = rendement >= 80 ? 'var(--green)' : rendement >= 60 ? 'var(--orange)' : 'var(--red)';
  }

  /* Contrainte taux de perte : produit >= (100 - taux)% de la base */
  var tauxEl = document.getElementById('prod_taux_perte');
  var taux = tauxEl ? parseFloat(tauxEl.value) : NaN;
  if (isNaN(taux)) taux = 10;
  if (taux < 0) taux = 0;
  if (taux > 100) taux = 100;
  var warnEl = document.getElementById('summary_perte_warn');
  if (warnEl) {
    if (base > 0) {
      var minProd = base * (100 - taux) / 100;
      if (totalProd < minProd - 0.001) {
        var perteReelle = (1 - totalProd / base) * 100;
        warnEl.innerHTML = '⚠️ Perte réelle de <b>' + perteReelle.toFixed(1) + '%</b> (' + totalProd.toFixed(3) + ' m³ produits) &gt; taux accepté (<b>' + taux + '%</b>). Volume minimum requis : <b>' + minProd.toFixed(3) + ' m³</b>.';
        warnEl.style.display = 'block';
      } else {
        warnEl.style.display = 'none';
      }
    } else {
      warnEl.style.display = 'none';
    }
  }
}

/* Cohérence fiche : produit (lattes+plots+CP+encours entrée) <= base (sortie+reprise) */
function ficheVolumes(p) {
  var prod = (p.vol_lattes || 0) + (p.vol_plots || 0) + (p.vol_cp || 0) + (p.vol_enc_entree || 0);
  var base = (p.vol_sortie_bois || 0) + (p.vol_enc_reprise || 0);
  return { prod: prod, base: base };
}
function ficheCoherenceOk(p) {
  var v = ficheVolumes(p);
  if (v.prod > v.base + 0.001) {
    toast('Notice : production (' + v.prod.toFixed(3) + ' m³) supérieure au bois disponible (' + v.base.toFixed(3) + ' m³). Saisie libre : la fiche sera enregistrée sans blocage.', 'error');
  } else if (v.base > 0) {
    var taux = parseFloat(p.taux_perte);
    if (isNaN(taux)) taux = 10;
    if (taux < 0) taux = 0;
    if (taux > 100) taux = 100;
    var minProd = v.base * (100 - taux) / 100;
    if (v.prod < minProd - 0.001) {
      var perteReelle = (1 - v.prod / v.base) * 100;
      toast('Notice : perte réelle de ' + perteReelle.toFixed(1) + '% (' + v.prod.toFixed(3) + ' m³ produits) supérieure au taux de perte accepté de ' + taux + '%. Saisie libre : la fiche sera enregistrée sans blocage.', 'error');
    }
  }
  return true;
}
/* Décrément stock MP : sortie (-) + entrée encours (reste en stock : réintégré) + reprise (re-sort du stock) */
function deductBoisSorti(p) {
  var stockRaw = getStockRaw();
  function lot(code) { return stockRaw.find(function(s) { return s.code === code; }); }
  function applyDeduct(item, q, v) {
    var oldQ = parseFloat(item.quantite) || 0;
    var oldV = parseFloat(item.volume) || 0;
    var unitVol = oldQ > 0 ? oldV / oldQ : calcVolume(item.longueur || item.length, item.largeur || item.width, item.epaisseur || item.thickness);
    item.quantite = Math.max(0, oldQ - q);
    if (v > 0 && oldV > 0) item.volume = Math.max(0, oldV - v);
    else item.volume = Math.max(0, unitVol * item.quantite);
    item.updated_at = new Date().toISOString();
  }
  (p.sortie_bois || []).forEach(function(sb) {
    if (!sb.code) return;
    var item = lot(sb.code);
    if (item) applyDeduct(item, parseFloat(sb.qte) || 0, parseFloat(sb.volume) || 0);
  });
  (p.encours || []).filter(function(e) { return (e.wip_type || 'entrée') !== 'reprise'; }).forEach(function(e) {
    if (!e.code) return;
    var item = lot(e.code);
    if (item) {
      item.quantite = (parseFloat(item.quantite) || 0) + (parseFloat(e.qte) || 0);
      item.volume = Math.max(0, (parseFloat(item.volume) || 0) + (parseFloat(e.volume) || 0));
      item.updated_at = new Date().toISOString();
    }
  });
  (p.encours || []).filter(function(e) { return (e.wip_type || '') === 'reprise'; }).forEach(function(e) {
    if (!e.code) return;
    var item = lot(e.code);
    if (item) applyDeduct(item, parseFloat(e.qte) || 0, parseFloat(e.volume) || 0);
  });
  setStockRaw(stockRaw);
}

/* Stock semi par code composant : direct s.code, sinon via article (code -> article_id) */
function semiStockQty(compCode) {
  if (!compCode) return 0;
  var key = (compCode || '').toUpperCase();
  var qty = 0;
  getStockSemi().forEach(function(s) {
    if ((s.code || '').toUpperCase() === key) qty += parseFloat(s.quantite) || 0;
  });
  if (qty > 0) return qty;
  var art = getArticles().find(function(a) { return (a.code || '').toUpperCase() === key; });
  if (art) {
    getStockSemi().forEach(function(s) { if (s.article_id === art.id) qty += parseFloat(s.quantite) || 0; });
  }
  return qty;
}
function deductSemiQty(compCode, need) {
  if (!compCode || !(need > 0)) return;
  var key = (compCode || '').toUpperCase();
  var semi = getStockSemi();
  var rest = need;
  semi.forEach(function(s) {
    if (rest <= 0) return;
    if ((s.code || '').toUpperCase() === key) {
      var q = parseFloat(s.quantite) || 0;
      var d = Math.min(q, rest);
      s.quantite = Math.max(0, q - d);
      s.updated_at = new Date().toISOString();
      rest -= d;
    }
  });
  if (rest > 0) {
    var art = getArticles().find(function(a) { return (a.code || '').toUpperCase() === key; });
    if (art) {
      semi.forEach(function(s) {
        if (rest <= 0) return;
        if (s.article_id === art.id) {
          var q2 = parseFloat(s.quantite) || 0;
          var d2 = Math.min(q2, rest);
          s.quantite = Math.max(0, q2 - d2);
          s.updated_at = new Date().toISOString();
          rest -= d2;
        }
      });
    }
  }
  setStockSemi(semi);
}
/* Stock conso par code : direct s.code, sinon via article P5/P6/P7... (article_id) */
function consumStockQty(compCode) {
  if (!compCode) return 0;
  var key = (compCode || '').toUpperCase();
  var qty = 0;
  getStockConsum().forEach(function(s) {
    if ((s.code || '').toUpperCase() === key) qty += parseFloat(s.quantite) || 0;
  });
  if (qty > 0) return qty;
  var art = getArticles().find(function(a) { return (a.code || '').toUpperCase() === key; });
  if (art) {
    getStockConsum().forEach(function(s) { if (s.article_id === art.id) qty += parseFloat(s.quantite) || 0; });
  }
  return qty;
}
function deductConsumQty(compCode, need) {
  if (!compCode || !(need > 0)) return;
  var key = (compCode || '').toUpperCase();
  var stock = getStockConsum();
  var rest = need;
  stock.forEach(function(s) {
    if (rest <= 0) return;
    if ((s.code || '').toUpperCase() === key) {
      var q = parseFloat(s.quantite) || 0;
      var d = Math.min(q, rest);
      s.quantite = Math.max(0, q - d);
      if (s.quantite_stock != null) s.quantite_stock = s.quantite;
      s.updated_at = new Date().toISOString();
      rest -= d;
    }
  });
  if (rest > 0) {
    var art = getArticles().find(function(a) { return (a.code || '').toUpperCase() === key; });
    if (art) {
      stock.forEach(function(s) {
        if (rest <= 0) return;
        if (s.article_id === art.id) {
          var q2 = parseFloat(s.quantite) || 0;
          var d2 = Math.min(q2, rest);
          s.quantite = Math.max(0, q2 - d2);
          if (s.quantite_stock != null) s.quantite_stock = s.quantite;
          s.updated_at = new Date().toISOString();
          rest -= d2;
        }
      });
    }
  }
  setStockConsum(stock);
}

/* Deduction assemblage : decrementer stock selon composants utilises */
function deductAssemblageStock(p) {
  if (!p.assemblage || !p.assemblage.length) return;
  var articles = getArticles();
  var composants = getSection('composants', []);
  /* p.assemblage = lignes produit fini {code, qte} : chaque ligne consomme
     (qte_per_unit de la nomenclature x qte assemblee) pour chaque composant */
  p.assemblage.forEach(function(row) {
    if (!row.code || !row.qte) return;
    var article = articles.find(function(a) { return (a.code || '').toUpperCase() === (row.code || '').toUpperCase(); });
    if (!article) return;
    var comps = composants.filter(function(c) { return c.article_id === article.id; });
    comps.forEach(function(comp) {
      var totalNeeded = (parseFloat(comp.quantity) || 0) * (parseFloat(row.qte) || 0);
      if (totalNeeded <= 0) return;
      var type = comp.type;
      if (type === "LATTE" || type === "PLOT" || type === "CP") {
        deductSemiQty(comp.code, totalNeeded);
      } else if (type === "POINTE") {
        deductConsumQty(comp.code, totalNeeded);
      } else {
        var rawStock = getStockRaw();
        var rest = totalNeeded;
        rawStock.forEach(function(s) {
          if (rest <= 0) return;
          if ((s.code || s.colis_number) === comp.code) {
            var oldQ = parseFloat(s.quantite) || 0;
            var d = Math.min(oldQ, rest);
            s.quantite = Math.max(0, oldQ - d);
            s.updated_at = new Date().toISOString();
            rest -= d;
          }
        });
        setStockRaw(rawStock);
      }
    });
  });
}

function checkAssemblageStock(assemblage) {
  if (!assemblage || !assemblage.length) return { ok: true, errors: [] };
  var articles = getArticles();
  var composants = getSection('composants', []);
  var errors = [];
  assemblage.forEach(function(row) {
    if (!row.code || !row.qte) return;
    var article = articles.find(function(a) { return (a.code || '').toUpperCase() === row.code.toUpperCase(); });
    if (!article) return;
    var comps = composants.filter(function(c) { return c.article_id === article.id; });
    if (!comps.length) return;
    comps.forEach(function(c) {
      var totalNeeded = (parseFloat(c.quantity) || 0) * row.qte;
      if (totalNeeded <= 0) return;
      var stock = 0;
      if (c.type === 'LATTE' || c.type === 'PLOT' || c.type === 'CP') {
        stock = semiStockQty(c.code);
      } else if (c.type === 'POINTE') {
        stock = consumStockQty(c.code);
      } else {
        var item = getStockRaw().find(function(s) { return (s.code || s.colis_number) === c.code; });
        stock = item ? (parseFloat(item.quantite) || 0) : 0;
      }
      if (stock < totalNeeded) {
        errors.push(row.code + ' (' + row.qte + ' unités) → ' + c.code + ' : stock ' + stock + ' < besoin ' + totalNeeded);
      }
    });
  });
  return { ok: errors.length === 0, errors: errors };
}

    var vol = parseFloat((r.querySelector('[id^="cp_vol_"]') || {}).textContent) || 0;
    var qte = parseFloat(inputs[0].value)||0;
    if (!qte && !(texts[0] && texts[0].value)) return;
    cps.push({ code: texts[0] ? texts[0].value : '', type_cp: '', qte: qte, long: parseFloat(inputs[1].value)||0, larg: parseFloat(inputs[2].value)||0, epais: parseFloat(inputs[3].value)||0, volume: vol, lot: texts[1] ? texts[1].value : '' });
  });

  /* Collecter les lignes Assemblage */
  var assemblage = [];
  document.querySelectorAll('#assBody tr[id^="assRow"]').forEach(function(r) {
    var inputs = r.querySelectorAll('input[type="number"]');
    if (!inputs.length) return;
    var texts = r.querySelectorAll('input[type="text"]');
    var qte = parseFloat(inputs[0].value)||0;
    if (!qte && !(texts[0] && texts[0].value)) return;
    assemblage.push({ code: texts[0] ? texts[0].value : '', designation: texts[1] ? texts[1].value : '', qte: qte, long: parseFloat(inputs[1].value)||0, larg: parseFloat(inputs[2].value)||0, epais: parseFloat(inputs[3].value)||0 });
  });

  /* Collecter les lignes En-cours (wip ACSER : entrée / reprise) */
  var encours = [];
  document.querySelectorAll('#encBody tr[id^="encRow"]').forEach(function(r) {
    var inputs = r.querySelectorAll('input[type="number"]');
    if (inputs.length < 4) return;
    var texts = r.querySelectorAll('input[type="text"]');
    var vol = parseFloat((r.querySelector('[id^="enc_vol_"]') || {}).textContent) || 0;
    var qte = parseFloat(inputs[0].value)||0;
    if (!qte && !(texts[0] && texts[0].value)) return;
    var sel = r.querySelector('select[data-wiptype]');
    encours.push({ code: texts[0] ? texts[0].value : '', designation: texts[1] ? texts[1].value : '', qte: qte, long: parseFloat(inputs[1].value)||0, larg: parseFloat(inputs[2].value)||0, epais: parseFloat(inputs[3].value)||0, volume: vol, wip_type: sel ? sel.value : 'entrée', operateur: texts[2] ? texts[2].value : '' });
  });

  var volLattes = lattes.reduce(function(s, l) { return s + l.volume; }, 0);
  var volPlots = plots.reduce(function(s, l) { return s + l.volume; }, 0);
  var volCP = cps.reduce(function(s, l) { return s + l.volume; }, 0);
  var volEncEntree = encours.filter(function(l) { return l.wip_type !== 'reprise'; }).reduce(function(s, l) { return s + l.volume; }, 0);
  var volEncReprise = encours.filter(function(l) { return l.wip_type === 'reprise'; }).reduce(function(s, l) { return s + l.volume; }, 0);
  var volTotal = volLattes + volPlots + volCP + volEncEntree;
  var rendement = (volSortieBois + volEncReprise) > 0 ? (volTotal / (volSortieBois + volEncReprise) * 100) : 0;

  var prod = {
    id: existing ? existing.id : genId(),
    numero: existing ? existing.numero : nextProdNumber(),
    date: date,
    article_id: article_id,
    chef: chef,
    taux_perte: tauxPerte,
    employes: employes,
    observations: observations,
    sortie_bois: sortieBois,
    lattes: lattes,
    plots: plots,
    cp: cps,
    assemblage: assemblage,
    encours: encours,
    vol_sortie_bois: volSortieBois,
    vol_lattes: volLattes,
    vol_plots: volPlots,
    vol_cp: volCP,
    vol_enc_entree: volEncEntree,
    vol_enc_reprise: volEncReprise,
    vol_total: volTotal,
    rendement: rendement,
    statut: (mode === 'validate') ? 'validated' : 'draft',
    created_at: existing ? existing.created_at : new Date().toISOString(),
    updated_at: new Date().toISOString(),
  };
  /* Le brouillon ne vérifie jamais le stock : enregistrement libre */
  if (assemblage.length && mode !== 'brouillon') {
    var stockCheck = checkAssemblageStock(assemblage);
    if (!stockCheck.ok) {
      toast('❌ Stock insuffisant pour assemblage :\n' + stockCheck.errors.join('\n'), 'error');
      return;
    }
  }
  if (mode === 'validate' && !ficheCoherenceOk(prod)) return;
  if (mode === 'validate' && !confirm2('Confirmer la VALIDATION de cette fiche ?\n\n⚠️ La validation impactera les stocks (sortie de bois nette : sortie − réintégration encours).\nCette action est irréversible.')) return;
  var prods = getProductions();
  if (existing) {
    Object.keys(prod).forEach(function(k) { existing[k] = prod[k]; });
    existing.updated_at = new Date().toISOString();
  } else {
    prods.push(prod);
  }
  setProductions(prods);

  if (mode === 'validate') {
    /* Sortie nette : sortie (-) + entrée encours (reste en stock) + reprise (re-sort) */
    deductBoisSorti(prod);
    /* Deduction assemblage : decrementer stock selon composants utilises */
    deductAssemblageStock(prod);
    clearAutoDraft();
    localStorage.removeItem('mdb_prod_editId');
    toast('Fiche de Production validée ✅ — Rendement: ' + prod.rendement.toFixed(1) + '%');
    navigate('history');
  } else if (mode === 'brouillon') {
    clearAutoDraft();
    localStorage.setItem('mdb_prod_editId', prod.id);
    toast('Brouillon enregistré 📝 — continuez la saisie ou reprenez-le plus tard depuis l\'historique');
  } else {
    clearAutoDraft();
    localStorage.removeItem('mdb_prod_editId');
    toast('Fiche enregistrée 💾 (sans impact stock — validez-la pour impacter les stocks)');
    navigate('history');
  }
}

  document.querySelectorAll('#sortieBoisLignes tr[id^="sortieBoisRow"]').forEach(function(r) { r.remove(); });
  (p.sortie_bois || []).forEach(function(sb) {
    addSortieBoisLigne();
    var idx = _sbRowIdx - 1;
    setV('sb_code_' + idx, sb.code);
    setV('sb_date_' + idx, sb.date || p.date);
    setV('sb_libelle_' + idx, sb.libelle);
    setV('sb_essence_' + idx, sb.essence);
    setV('sb_fournisseur_' + idx, sb.fournisseur);
    setV('sb_qte_' + idx, sb.qte);
    setV('sb_long_' + idx, sb.long);
    setV('sb_larg_' + idx, sb.larg);
    setV('sb_epais_' + idx, sb.epais);
    setV('sb_comment_' + idx, sb.comment);
    calcSBVolume(idx);

  /* Tableaux composants : régénérer depuis le brouillon */

  t = document.getElementById('plotsBody');

  t = document.getElementById('cpBody');

  (p.cp || []).forEach(function(l) {

  updateProductionSummary();
  toast('Brouillon ' + (p.numero || '') + ' chargé ✏️ — continuez la saisie');
}

function updateStockArticle(articleId, qty, type, ref, numero, motifOverride) {
  var article = getArticles().find(function(a) { return a.id === articleId; });
  if (!article) return;
  var cat = article.categorie || 'finished';
  var stockList, setFn;
  if (cat === 'finished') { stockList = getStockFinished(); setFn = setStockFinished; }
  else if (cat === 'semi') { stockList = getStockSemi(); setFn = setStockSemi; }
  else if (cat === 'lattes') { stockList = getStockSemi(); setFn = setStockSemi; }
  else if (cat === 'raw') { stockList = getStockRaw(); setFn = setStockRaw; }
  else if (cat === 'consum') { stockList = getStockConsum(); setFn = setStockConsum; }
  else if (cat === 'merch' || cat === 'merchandise') { stockList = getStockMerch(); setFn = setStockMerch; }
  else { stockList = getStockFinished(); setFn = setStockFinished; }

  var existing = stockList.find(function(s) { return s.article_id === articleId; });
  if (existing) {
    existing.quantite = (existing.quantite || 0) + (type === 'entree' ? qty : -qty);
    existing.updated_at = new Date().toISOString();
  } else {
    stockList.push({ id: genId(), article_id: articleId, quantite: type === 'entree' ? qty : 0, created_at: new Date().toISOString() });
  }
  setFn(stockList);

  /* SYNC → mdb_stocks (pour que l'app principale voie le stock : articleNom/articleCode requis par la gestion commerciale) */
  try {
    var mainStocks = JSON.parse(localStorage.getItem('mdb_stocks')) || [];
    var mainArt = mainStocks.find(function(s) { return s.code === article.code || s.articleCode === article.code || s.article_id === articleId; });
    if (mainArt) {
      mainArt.qte = (mainArt.qte || 0) + (type === 'entree' ? qty : -qty);
      mainArt.date = today();
      mainArt.articleCode = mainArt.articleCode || article.code || '';
      mainArt.articleNom = mainArt.articleNom || article.designation || '';
      mainArt.article_id = mainArt.article_id || articleId;
    } else {
      mainStocks.push({
        id: 'prod_' + genId(),
        code: article.code || articleId,
        designation: article.designation || '',
        articleCode: article.code || '',
        articleNom: article.designation || '',
        article_id: articleId,
        qte: type === 'entree' ? qty : 0,
        quantite: type === 'entree' ? qty : 0,
        prixUnitaire: article.prix_revient || 0,
        date: today(),
        categorie: cat
      });
    }
    localStorage.setItem('mdb_stocks', JSON.stringify(mainStocks));
  } catch(e) {}

  var movements = getMovements();
  movements.push({
    id: genId(), date: today(), type: type, article_id: articleId,
    quantite: qty, reference: ref, motif: motifOverride || (ref === 'production' ? 'Production ' + numero + ' – Assemblage (Produits Finis) (Entrée)' : 'Saisie production ' + numero),
    created_at: new Date().toISOString()
  });
  setMovements(movements);
}

function validateProd(id) {
  var prods = getProductions();
  var p = prods.find(function(x) { return x.id === id; });
  if (!p) return;
  /* Migration anciennes fiches : volume sortie = dims x qté (l'ancien calcul oubliait x qté) */
  (p.sortie_bois || []).forEach(function(sb) {
    var L = parseFloat(sb.long) || 0, W = parseFloat(sb.larg) || 0, T = parseFloat(sb.epais) || 0, Q = parseFloat(sb.qte) || 0;
    if (L > 0 && W > 0 && T > 0 && Q > 0) sb.volume = L * W * T / 1000000 * Q;
  });
  p.vol_sortie_bois = (p.sortie_bois || []).reduce(function(s, l) { return s + (l.volume || 0); }, 0);
  if (!ficheCoherenceOk(p)) return;
  p.statut = 'validated';
  setProductions(prods);
  /* Sortie nette : sortie (-) + entrée encours (reste en stock) + reprise (re-sort) */
  if ((p.sortie_bois && p.sortie_bois.length) || (p.encours && p.encours.length)) {
    deductBoisSorti(p);
  } else if (p.article_id && p.quantite) {
    updateStockArticle(p.article_id, p.quantite, 'entree', 'production', p.numero);
  }
  toast('Fiche validée ✅');
  renderPage();
}

function deleteProd(id) {
  var prods = getProductions();
  var p = prods.find(function(x) { return x.id === id; });
  if (!p) return;
  var msg = 'Supprimer cette fiche de production ?';
  if (p.statut === 'validated') {
    var nSB = (p.sortie_bois || []).length;
    msg = '⚠️ Cette fiche est VALIDÉE.\n\n' +
      '• Sortie bois : ' + nSB + ' lot(s)\n' +
      '• Lattes : ' + fmt(p.vol_lattes || 0) + ' m³\n' +
      '• Plots : ' + fmt(p.vol_plots || 0) + ' m³\n' +
      '• CP : ' + fmt(p.vol_cp || 0) + ' m³\n\n' +
      'Supprimer cette fiche restaurera le stock de ' + fmt(p.vol_sortie_bois || 0) + ' m³.\n\nConfirmer ?';
  }
  if (!confirm2(msg)) return;
  if (p.statut === 'validated') {
    restoreBoisSorti(p);
    /* Annulation : les produits finis entrés en stock repartent (sortie) */
    if (!((p.sortie_bois && p.sortie_bois.length) || (p.encours && p.encours.length)) && p.article_id && (parseFloat(p.quantite) || 0) > 0) {
      updateStockArticle(p.article_id, parseFloat(p.quantite) || 0, 'sortie', 'production', p.numero, 'ANNULATION Production ' + (p.numero || '') + ' – Assemblage (Produits Finis) (Sortie) – Annulation – suppression fiche');
    }
  }
  setProductions(prods.filter(function(x) { return x.id !== id; }));
  toast('Fiche supprimée');
  renderPage();
}
function restoreBoisSorti(p) {
  var stockRaw = getStockRaw();
  function lot(code) { return stockRaw.find(function(s) { return s.code === code; }); }
  (p.sortie_bois || []).forEach(function(sb) {
    if (!sb.code) return;
    var item = lot(sb.code);
    if (item) { item.quantite = (parseFloat(item.quantite) || 0) + (parseFloat(sb.qte) || 0); item.volume = (parseFloat(item.volume) || 0) + (parseFloat(sb.volume) || 0); item.updated_at = new Date().toISOString(); }
  });
  setStockRaw(stockRaw);
}

function createOP() {
  var article_id = document.getElementById('op_article').value;
  var qte = parseFloat(document.getElementById('op_qte').value) || 0;
  var date = document.getElementById('op_date').value;
  var priorite = document.getElementById('op_priorite').value;
  var notes = document.getElementById('op_notes').value;
  if (!article_id || qte <= 0 || !date) return toast('Remplissez les champs obligatoires', 'error');
  var ops = getProductionOrders();
  ops.push({
    id: genId(), numero: nextOPNumber(), article_id: article_id,
    quantite_prevue: qte, quantite_realisee: 0,
    date_prevue: date, priorite: priorite, notes: notes,
    statut: 'draft', progression: 0, created_at: new Date().toISOString()
  });

function render_stock_palettes() {
  syncCatalogueToStock();
  /* Les palettes = les produits finis : rapatrier d'éventuelles anciennes entrées stock-palettes */
  try {
    var pal = getStockPalettes();
    if (pal.length) {
      var fin = getStockFinished();
      pal.forEach(function(p) {
        var ex = p.article_id ? fin.find(function(f) { return f.article_id === p.article_id; }) : null;
        if (ex) { ex.quantite = (parseFloat(ex.quantite) || 0) + (parseFloat(p.quantite) || 0); }
        else { fin.push(p); }
      });
      setStockFinished(fin);
      setStockPalettes([]);
    }
  } catch (e) {}
  return renderStockFiche('stock-finished', getStockFinished, 'Fiche de Stock - Palettes (Produits Finis)', 'showAddStock');
}

/* ==================== STOCK PRODUITS FINIS ==================== */
/* Le catalogue = les produits finis : chaque article (finished/semi) possède une entrée stock (qte 0 par défaut) */
function syncCatalogueToStock() {
  var articles = getArticles();
  var fin = getStockFinished();
  var semi = getStockSemi();
  var changedF = false, changedS = false;
  articles.forEach(function(a) {
    var cat = a.categorie || 'finished';
    if (cat === 'finished') {
      if (!fin.some(function(s) { return s.article_id === a.id; })) {
        fin.push({ id: genId(), article_id: a.id, quantite: 0, prix_unitaire: a.prix_vente || 0, created_at: new Date().toISOString() });
        changedF = true;
      }
    } else if (cat === 'semi') {
      if (!semi.some(function(s) { return s.article_id === a.id; })) {
        semi.push({ id: genId(), article_id: a.id, quantite: 0, prix_unitaire: a.prix_vente || 0, created_at: new Date().toISOString() });
        changedS = true;
      }
    }
  });
  if (changedF) setStockFinished(fin);
  if (changedS) setStockSemi(semi);
  /* Backfill : les anciennes entrées miroir mdb_stocks sans articleNom/articleCode (invisibles en gestion commerciale) */
  try { backfillMirrorFields(); } catch (e) {}
}

/* Le stock PF de production = le stock des articles type produits finis en gestion commerciale : miroir exact */
function syncMirrorFinished(articleId) {
  try {
    var a = getArticles().find(function(x) { return x.id === articleId; }) || {};
    var q = 0;
    getStockFinished().forEach(function(s) { if (s.article_id === articleId) q += parseFloat(s.quantite) || 0; });
    var ms = JSON.parse(localStorage.getItem('mdb_stocks')) || [];
    var code = a.code || '';
    var ex = ms.find(function(s) { return (code && (s.code === code || s.articleCode === code)) || (s.article_id && s.article_id === articleId); });
    if (ex) {
      ex.qte = q; ex.quantite = q; ex.date = today();
      ex.articleCode = ex.articleCode || code; ex.articleNom = ex.articleNom || a.designation || '';
    } else {
      ms.push({ id: 'prod_' + genId(), code: code || articleId, designation: a.designation || '', articleCode: code, articleNom: a.designation || '', article_id: articleId, qte: q, quantite: q, prixUnitaire: a.prix_vente || a.prix_revient || 0, date: today(), categorie: 'finished' });
    }
    localStorage.setItem('mdb_stocks', JSON.stringify(ms));
  } catch (e) {}
}
function backfillMirrorFields() {
  var ms = JSON.parse(localStorage.getItem('mdb_stocks')) || [];
  var changed = false;
  ms.forEach(function(s) {
    if (((!s.articleNom && s.designation) || (!s.articleCode && s.code)) && (s.id || '').indexOf('prod_') === 0) {
      if (!s.articleNom && s.designation) { s.articleNom = s.designation; changed = true; }
      if (!s.articleCode && s.code) { s.articleCode = s.code; changed = true; }
      if (s.qte == null && s.quantite != null) { s.qte = s.quantite; changed = true; }
    }
  });
  if (changed) localStorage.setItem('mdb_stocks', JSON.stringify(ms));
}

function render_stock_finished() { syncCatalogueToStock(); return renderStockFiche('stock-finished', getStockFinished, 'Fiche de Stock - Produits Finis', 'showAddStock'); }

function mpOriginLabel(o) {

function buildColisBLMap() {

function semiVol(s) {

/* ==================== ONGLET STOCK BL : accordéon BL → colis → mouvements ====================
   Résidus pilotés par le stock (l'inventaire prime sur tout : qté + volume résiduels lus sur l'entrée stock) */
function colisSorties(colisCode) {
  var out = [];

  getProductions().forEach(function(p) {
    (p.sortie_bois || []).forEach(function(sb) {
      if ((sb.code || '') === colisCode) {
        out.push({ date: p.date || '', numero: p.numero || '', qte: parseFloat(sb.qte) || 0, vol: parseFloat(sb.volume) || 0 });
      }

}
/* Tableau des mouvements d'un colis — partagé entre Stock BL et Stock Spécifique.

  }
  var h = '<div style="overflow-x:auto"><table style="font-size:.75rem"><thead><tr><th>Jour</th><th>Code</th><th>Libellé</th><th style="text-align:right">Init Qté</th><th style="text-align:right">Init Vol</th><th style="text-align:right">Entrée Qté</th><th style="text-align:right">Entrée Vol</th><th style="text-align:right">Sortie Qté</th><th style="text-align:right">Sortie Vol</th><th style="text-align:right">Réglage Qté</th><th style="text-align:right">Réglage Vol</th><th style="text-align:right">Final Qté</th><th style="text-align:right">Final Vol</th><th>Observation</th><th>Justification</th></tr></thead><tbody>';
  var bQ = 0, bV = 0;

function cleanOrphanStockRaw() {

    var achats = getAchats();
    var have = {};
    achats.forEach(function(a) {
      (a.items || []).forEach(function(it) {
        var k = String(it.colis_number || it.code || '').trim().toLowerCase();
        if (k) have[k] = true;
      });
    });
    var raw = getStockRaw();
    var orph = raw.filter(function(s) {
      var k = String(s.colis_number || s.code || '').trim().toLowerCase();
      return k && !have[k];
    });
    if (!orph.length) { toast('Aucun orphelin — stock cohérent', 'success'); return; }
    var lbl = orph.slice(0, 10).map(function(s) { return (s.colis_number || s.code) + ' (' + (s.quantite || 0) + ')'; }).join('\n');

    var keys = {};
    orph.forEach(function(s) { keys[String(s.colis_number || s.code || '').trim().toLowerCase()] = true; });
    setStockRaw(raw.filter(function(s) {
      var k = String(s.colis_number || s.code || '').trim().toLowerCase();
      return !(k && keys[k]);
    }));

    renderPage();

/* Origine façon ACSER : BL / SPECIFIC / ENCOURS (via type "en cours") */
function mpOrigin(s) {
  if (s.origin) return s.origin;
  var t = ((s.type || '') + '').toLowerCase();
  if (t.indexOf('en cours') !== -1 || t.indexOf('encours') !== -1) return 'ENCOURS';
  return 'BL';
}

/* Dimensions : champ direct, champs séparés, ou article lié */
function stkDims(it) {
  if (it.dimensions) return it.dimensions;
  var L = it.longueur || it.length || 0, w = it.largeur || it.width || 0, t = it.epaisseur || it.thickness || 0;
  if (L || w || t) return L + 'x' + w + 'x' + t;
  if (it.article_id) {
    var a = getArticles().find(function(x) { return x.id === it.article_id; }) || {};
    if (a.dimensions) return a.dimensions;
    if (a.length || a.width || a.thickness) return (a.length || 0) + 'x' + (a.width || 0) + 'x' + (a.thickness || 0);
  }
  return '-';
}
function stkUnitVol(it) {
  var d = stkDims(it);
  var p = (d || '').split('x').map(function(x) { return parseFloat(x) || 0; });
  if (p.length < 3) return 0;
  return p[0] * p[1] * p[2] / 1000000;
}
function stkVol(it) {
  var v = parseFloat(it.volume);
  if (v) return v;
  return (parseFloat(it.quantite) || 0) * stkUnitVol(it);
}
function stkCode(it) {
  if (it.code) return it.code;
  if (it.colis_number) return it.colis_number;
  if (it.article_id) { var a = getArticles().find(function(x) { return x.id === it.article_id; }); if (a) return a.code; }
  return '-';
}
function stkDes(it) {
  if (it.designation) return it.designation;
  if (it.essence) return it.essence;
  if (it.article_id) { var a = getArticles().find(function(x) { return x.id === it.article_id; }); if (a) return a.designation; }
  return '-';
}

  });

      var addr = XLSX.utils.encode_cell({r:R,c:C});

      ws[addr].s = { border: { top: {style:'thin'}, bottom: {style:'thin'}, left: {style:'thin'}, right: {style:'thin'} } };

function addStockItem(key) {
  var article_id = document.getElementById('stk_article').value;
  var qte = parseFloat(document.getElementById('stk_qte').value) || 0;
  var prix = parseFloat(document.getElementById('stk_prix').value) || 0;
  if (!article_id || qte <= 0) return toast('Remplissez les champs', 'error');
  var map = { 'stock-palettes': [getStockPalettes, setStockPalettes], 'stock-finished': [getStockFinished, setStockFinished], 'stock-semi': [getStockSemi, setStockSemi], 'stock-raw': [getStockRaw, setStockRaw], 'stock-merch': [getStockMerch, setStockMerch], 'stock-consum': [getStockConsum, setStockConsum] };
  var pair = map[key];
  if (!pair) return;
  var items = pair[0]();
  var _obs = ((document.getElementById('stk_obs') || {}).value || '').trim();
  /* Le catalogue = les produits finis : on fusionne avec l'entrée existante plutôt que dupliquer */
  var existing = items.find(function(s) { return s.article_id && s.article_id === article_id; });
  if (existing) {
    existing.quantite = (parseFloat(existing.quantite) || 0) + qte;
    if (prix) existing.prix_unitaire = prix;
    if (_obs) existing.observation = _obs;
    existing.updated_at = new Date().toISOString();
  } else {
    items.push({ id: genId(), article_id: article_id, quantite: qte, prix_unitaire: prix, observation: _obs, created_at: new Date().toISOString() });
  }
  pair[1](items);
  /* Journal : entrée manuelle (fiche de stock) */
  try {
    var _m = getMovements();
    _m.push({ id: genId(), date: today(), type: 'entree', article_id: article_id, quantite: qte, reference: '', motif: 'Ajout manuel au stock' + (_obs ? ' — ' + _obs : ''), created_at: new Date().toISOString() });
    setMovements(_m);
  } catch (e) {}

  /* SYNC → mdb_stocks (articleNom/articleCode requis par la gestion commerciale) */
  try {
    var article = getArticles().find(function(a) { return a.id === article_id; });
    var mainStocks = JSON.parse(localStorage.getItem('mdb_stocks')) || [];
    var _msCode = article ? article.code : article_id;
    var _msEx = mainStocks.find(function(s) { return (s.code && _msCode && s.code === _msCode) || (s.articleCode && _msCode && s.articleCode === _msCode); });
    if (_msEx) {
      _msEx.qte = (parseFloat(_msEx.qte) || parseFloat(_msEx.quantite) || 0) + qte;
      _msEx.quantite = _msEx.qte;
      _msEx.date = today();
      _msEx.articleCode = _msEx.articleCode || _msCode || '';
      _msEx.articleNom = _msEx.articleNom || (article ? article.designation : '') || '';
    } else {
      mainStocks.push({
        id: 'prod_' + genId(),
        code: _msCode,
        designation: article ? article.designation : '',
        articleCode: _msCode || '',
        articleNom: article ? article.designation : '',
        article_id: article_id,
        qte: qte,
        quantite: qte,
        prixUnitaire: prix,
        date: today(),
        categorie: key.replace('stock-', '')
      });
    }
    localStorage.setItem('mdb_stocks', JSON.stringify(mainStocks));
  } catch(e) {}

  document.getElementById('modalOverlay').remove();
  toast('Article ajouté au stock (synchronisé)');
  renderPage();
}
