}

function launchInventory() {
  var sel = document.getElementById('inv_month');
  if (!sel) return;
  _invMonthCache = sel.value;
  var month = sel.value;
  var items = calcInventoryItems(month);
  var target = document.getElementById('invContent');
  if (!target) return;

  /* Filtrer par type */
  var filtered = items.filter(function(it) {
    if (window._invType === 'all') return true;
    if (window._invType === 'mp') return it.store === 'stockRaw';
    if (window._invType === 'mp_bl') return it.store === 'stockRaw' && (it.source === 'BL' || it.source === 'Matière première (BL)');
    if (window._invType === 'mp_spec') return it.store === 'stockRaw' && (it.source === 'SPECIFIC' || it.source === 'Matière première (Spécifique)');
    if (window._invType === 'mp_enc') return it.store === 'stockRaw' && (it.source === 'En cours' || it.source === 'Matière première (En cours)');
    if (window._invType === 'finished') return it.store === 'stockFinished';
    if (window._invType === 'semi') return it.store === 'stockSemi';
    if (window._invType === 'consum') return it.store === 'stockConsum';
    if (window._invType === 'merch') return it.store === 'stockMerch';
    if (window._invType === 'epi') return it.store === 'epiItems';
    return true;
  });

  /* Filtrer par article (tous / actifs) */
  if (window._invArticleFilter === 'active') {
    filtered = filtered.filter(function(it) { return (parseFloat(it.theo_qte) || 0) > 0; });
  }

  /* Masquer stock zéro */
  if (window._invHideZero) {
    filtered = filtered.filter(function(it) { return (parseFloat(it.theo_qte) || 0) !== 0; });
  }

  var h = '<div class="card">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem">';
  h += '<h3 style="margin:0">Stock théorique au 31 ' + monthLabel(month) + ' — Saisissez le stock réel</h3>';
  h += '<button class="btn btn-accent" onclick="saveInventory(\'' + month + '\')">✅ Sauvegarder</button>';
  h += '</div>';
  h += '<div style="font-size:.75rem;color:var(--dim);margin-bottom:.6rem">Le stock réel saisi deviendra le stock initial du mois suivant.</div>';

  /* Barre de recherche */
  h += '<input type="text" id="invSearchInput" class="search-box" placeholder="🔍 Rechercher par code ou désignation..." oninput="filterTable(\'invTable\',this.value)" style="margin-bottom:.8rem">';

  if (filtered.length === 0) {
    h += '<div class="empty">Aucun article trouvé pour cette sélection.</div>';
  } else {
    var hasDim = (window._invType === 'mp' || window._invType === 'mp_bl' || window._invType === 'mp_spec' || window._invType === 'mp_enc' || window._invType === 'semi');
    h += '<div style="overflow-x:auto"><table id="invTable">';
    h += '<thead><tr>';
    h += '<th>Code</th><th>Désignation</th><th>Source</th>';
    if (hasDim) h += '<th>Dimensions</th><th style="text-align:right">Volume (m³)</th>';
    h += '<th style="text-align:right">Théorique</th><th style="text-align:right;width:90px">Réel</th><th style="text-align:right">Écart</th><th>Commentaire</th><th></th>';
    h += '</tr></thead><tbody>';
    filtered.forEach(function(it, idx) {
      var ecart = (parseFloat(it.real_qte) || 0) - (parseFloat(it.theo_qte) || 0);
      var ecol = ecart === 0 ? 'var(--dim)' : (ecart > 0 ? 'var(--green)' : 'var(--red)');
      var hidden = window._invHidden[idx] || false;
      h += '<tr id="invRow_' + idx + '"' + (hidden ? ' style="display:none"' : '') + '>';
      h += '<td style="font-weight:600;color:var(--accent)">' + escH(it.code) + '</td>';
      h += '<td>' + escH(it.nom) + '</td>';
      h += '<td>' + escH(it.source || '-') + '</td>';
      if (hasDim) {
        h += '<td style="color:var(--dim)">' + escH(it.dimensions || '-') + '</td>';
        h += '<td style="text-align:right">' + (it.volume ? it.volume.toFixed(4) : '-') + '</td>';
      }
      h += '<td style="text-align:right;font-weight:700">' + fmt(it.theo_qte) + '</td>';
      h += '<td><input type="number" id="inv_real_' + idx + '" min="0" step="any" value="' + (it.theo_qte || 0) + '" style="width:85px;padding:4px;border:1px solid var(--border);border-radius:4px;text-align:right;font-size:.8rem" oninput="calcInvEcart()"></td>';
      h += '<td style="text-align:right;color:' + ecol + ';font-weight:700" id="inv_ecart_' + idx + '">0</td>';
      h += '<td><input type="text" id="inv_comment_' + idx + '" placeholder="Observation..." style="width:120px;padding:4px;border:1px solid var(--border);border-radius:4px;font-size:.75rem"></td>';
      h += '<td style="text-align:center"><span onclick="toggleInvRow(' + idx + ')" style="cursor:pointer;font-size:.9rem;opacity:.5" title="Masquer cette ligne">👁️</span></td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    h += '<div style="display:flex;justify-content:space-between;margin-top:.5rem;font-size:.8rem">';
    h += '<span style="color:var(--dim)">Total articles: <strong>' + filtered.length + '</strong></span>';
    h += '<span style="font-weight:700">Écart total: <span id="inv_ecart_total" style="color:var(--red)">0</span></span>';
    h += '</div>';
  }
  h += '</div>';
  target.innerHTML = h;
  window._invItems = filtered;
  calcInvEcart();
}

function calcInventoryItems(month) {
  var items = [];
  (getStockRaw() || []).forEach(function(s) {
    var src = mpOrigin(s) || 'BL';
    var dims = '';
    var vol = 0;
    var l = parseFloat(s.longueur || s.length) || 0;
    var w = parseFloat(s.largeur || s.width) || 0;
    var t = parseFloat(s.epaisseur || s.thickness) || 0;
    if (l > 0 && w > 0 && t > 0) { dims = l + 'x' + w + 'x' + t; vol = l * w * t / 1000000; }
    items.push({ code: s.code || s.colis_number || '-', nom: s.essence || s.designation || s.name || '-', categorie: 'MP - ' + src, source: src, emplacement: s.emplacement || s.origin || '', dimensions: dims, volume: vol, theo_qte: parseFloat(s.quantite) || 0, real_qte: parseFloat(s.quantite) || 0, ref: s.code || s.colis_number, store: 'stockRaw', storeIdx: items.length });
  });
  (getStockSemi() || []).forEach(function(s) {
    var dims = '';
    var vol = 0;
    var l = parseFloat(s.length || s.longueur) || 0;
    var w = parseFloat(s.width || s.largeur) || 0;
    var t = parseFloat(s.thickness || s.epaisseur) || 0;
    if (l > 0 && w > 0 && t > 0) { dims = l + 'x' + w + 'x' + t; vol = l * w * t / 1000000; }
    items.push({ code: s.code || '-', nom: s.nom || s.designation || '-', categorie: 'Semi-fini', source: 'Semi-fini', emplacement: '', dimensions: dims, volume: vol, theo_qte: parseFloat(s.quantite) || 0, real_qte: parseFloat(s.quantite) || 0, ref: s.code, store: 'stockSemi', storeIdx: items.length });
  });
  (getStockPalettes() || []).forEach(function(s) {
    items.push({ code: s.code || '-', nom: s.nom || s.designation || '-', categorie: 'Palette', source: 'Palette', emplacement: s.emplacement || '', dimensions: '', volume: 0, theo_qte: parseFloat(s.quantite) || 0, real_qte: parseFloat(s.quantite) || 0, ref: s.code, store: 'stockPalettes', storeIdx: items.length });
  });
  (getStockFinished() || []).forEach(function(s) {
    items.push({ code: s.code || '-', nom: s.nom || s.designation || '-', categorie: 'Produit fini', source: 'Produit fini', emplacement: s.emplacement || '', dimensions: '', volume: 0, theo_qte: parseFloat(s.quantite) || 0, real_qte: parseFloat(s.quantite) || 0, ref: s.code, store: 'stockFinished', storeIdx: items.length });
  });
  (getStockMerch() || []).forEach(function(s) {
    items.push({ code: s.code || '-', nom: s.nom || s.designation || '-', categorie: 'Marchandise', source: 'Marchandise', emplacement: s.emplacement || '', dimensions: '', volume: 0, theo_qte: parseFloat(s.quantite) || 0, real_qte: parseFloat(s.quantite) || 0, ref: s.code, store: 'stockMerch', storeIdx: items.length });
  });
  (getStockConsum() || []).forEach(function(s) {
    items.push({ code: s.code || '-', nom: s.nom || s.nom_complet || s.designation || '-', categorie: 'Consommable', source: 'Consommable', emplacement: s.emplacement || s.type || '', dimensions: '', volume: 0, theo_qte: parseFloat(s.quantite_stock) || parseFloat(s.quantite) || 0, real_qte: parseFloat(s.quantite_stock) || parseFloat(s.quantite) || 0, ref: s.code, store: 'stockConsum', storeIdx: items.length });
  });
  (getEpiItems() || []).forEach(function(s) {
    items.push({ code: s.code || '-', nom: s.designation || '-', categorie: 'EPI', source: 'EPI', emplacement: s.categorie || '', dimensions: '', volume: 0, theo_qte: parseFloat(s.quantite_stock) || 0, real_qte: parseFloat(s.quantite_stock) || 0, ref: s.code, store: 'epiItems', storeIdx: items.length });
  });
  return items;
}

function calcInvEcart() {
  var items = window._invItems || [];
  var totalEcart = 0;
  items.forEach(function(it, idx) {
    var el = document.getElementById('inv_real_' + idx);
    if (!el) return;
    var real = parseFloat(el.value) || 0;
    it.real_qte = real;
    var ecart = real - (parseFloat(it.theo_qte) || 0);
    totalEcart += Math.abs(ecart);
    var ecartEl = document.getElementById('inv_ecart_' + idx);
    if (ecartEl) {
      ecartEl.textContent = ecart > 0 ? '+' + fmt(ecart) : fmt(ecart);
      ecartEl.style.color = ecart === 0 ? 'var(--dim)' : (ecart > 0 ? 'var(--green)' : 'var(--red)');
    }
  });
  var totalEl = document.getElementById('inv_ecart_total');
  if (totalEl) totalEl.textContent = totalEcart.toFixed(1);
}

function saveInventory(month) {
  if (!confirm2('Enregistrer l\'inventaire de ' + monthLabel(month) + ' ? Le stock réel saisi deviendra le stock initial du mois suivant.')) return;
  var items = window._invItems || [];
  var savedItems = [];
  items.forEach(function(it, idx) {
    var el = document.getElementById('inv_real_' + idx);
    var commentEl = document.getElementById('inv_comment_' + idx);
    var real = el ? (parseFloat(el.value) || 0) : (parseFloat(it.real_qte) || 0);
    savedItems.push({ code: it.code, nom: it.nom, categorie: it.categorie, source: it.source || '', emplacement: it.emplacement, dimensions: it.dimensions || '', volume: it.volume || 0, theo_qte: it.theo_qte, real_qte: real, comment: commentEl ? commentEl.value || '' : '', store: it.store });
  });
  var inv = {
    id: genId(), month: month, date: (document.getElementById('inv_date') || {}).value || today(),
    supervisor: (document.getElementById('inv_supervisor') || {}).value || '',
    executants: (document.getElementById('inv_executants') || {}).value || '',
    heure_debut: (document.getElementById('inv_heure_debut') || {}).value || '',
    heure_fin: (document.getElementById('inv_heure_fin') || {}).value || '',
    items: savedItems, created_at: new Date().toISOString()
  };
  var invs = getInventories();
  invs = invs.filter(function(x) { return x.month !== month; });
  invs.push(inv);
  setInventories(invs);
  applyInventoryAsInitial(month, savedItems);
  toast('Inventaire de ' + monthLabel(month) + ' enregistré ✅');
  renderPage();
}

function applyInventoryAsInitial(month, items) {
  /* Met à jour les stocks actuels avec les valeurs réelles de l'inventaire */
  var raw = getStockRaw();
  var semi = getStockSemi();
  var palettes = getStockPalettes();
  var finished = getStockFinished();
  var merch = getStockMerch();
  var consum = getStockConsum();
  var epi = getEpiItems();
  var rawMap = {};
  raw.forEach(function(s, i) { rawMap[s.code || s.colis_number] = i; });
  var semiMap = {};
  semi.forEach(function(s, i) { semiMap[s.code] = i; });
  var palMap = {};
  palettes.forEach(function(s, i) { palMap[s.code] = i; });
  var finMap = {};
  finished.forEach(function(s, i) { finMap[s.code] = i; });
  var merchMap = {};
  merch.forEach(function(s, i) { merchMap[s.code] = i; });
  var consumMap = {};
  consum.forEach(function(s, i) { consumMap[s.code] = i; });
  var epiMap = {};
  epi.forEach(function(s, i) { epiMap[s.code] = i; });
  items.forEach(function(it) {
    var idx;
    switch (it.store) {
      case 'stockRaw':
        idx = rawMap[it.ref];
        if (idx !== undefined) { raw[idx].quantite = it.real_qte; raw[idx].volume = it.real_qte * stkUnitVol(raw[idx]); }
        break;
      case 'stockSemi':
        idx = semiMap[it.ref];
        if (idx !== undefined) { semi[idx].quantite = it.real_qte; }
        break;
      case 'stockPalettes':
        idx = palMap[it.ref];
        if (idx !== undefined) { palettes[idx].quantite = it.real_qte; }
        break;
      case 'stockFinished':
        idx = finMap[it.ref];
        if (idx !== undefined) { finished[idx].quantite = it.real_qte; }
        break;
      case 'stockMerch':
        idx = merchMap[it.ref];
        if (idx !== undefined) { merch[idx].quantite = it.real_qte; }
        break;
      case 'stockConsum':
        idx = consumMap[it.ref];
        if (idx !== undefined) { consum[idx].quantite_stock = it.real_qte; consum[idx].quantite = it.real_qte; }
        break;
      case 'epiItems':
        idx = epiMap[it.ref];
        if (idx !== undefined) { epi[idx].quantite_stock = it.real_qte; }
        break;
    }
  });
  setStockRaw(raw);
  setStockSemi(semi);
  setStockPalettes(palettes);
  setStockFinished(finished);
  setStockMerch(merch);
  setStockConsum(consum);
  setEpiItems(epi);
}

function deleteInventory(id) {

    h += '<td style="text-align:right">' + fmt(a.prix_revient || 0) + ' FCFA</td>';
    h += '<td style="text-align:right;color:var(--accent);font-weight:600">' + fmt(marge) + ' FCFA</td>';

function showArticleDetail(id) {
  var a = getArticles().find(function(x) { return x.id === id; });
  if (!a) return;
  var composants = getSection('composants', []).filter(function(c) { return c.article_id === id; });
  var lattes = composants.filter(function(c) { return c.type === 'LATTE'; });
  var plots = composants.filter(function(c) { return c.type === 'PLOT'; });
  var pointes = composants.filter(function(c) { return c.type === 'POINTE'; });
  var cp = composants.filter(function(c) { return c.type === 'CP'; });

  var m = '<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)this.remove()"><div class="modal" style="max-width:700px">';
  m += '<h2>' + escH(a.code) + ' — ' + escH(a.designation) + '</h2>';
  m += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;font-size:.82rem;margin-bottom:1rem">';
  m += '<div><strong>Destination:</strong> ' + escH(a.destination || '-') + '</div>';
  m += '<div><strong>Type:</strong> ' + escH(a.category_type || a.categorie || '-') + '</div>';
  m += '<div><strong>Prix:</strong> ' + fmt(a.prix_vente || 0) + ' FCFA</div>';
  m += '<div><strong>Coût:</strong> ' + fmt(a.prix_revient || 0) + ' FCFA</div>';
  m += '<div><strong>Taxe:</strong> ' + (a.tax_rate || 18) + '%</div>';
  m += '<div><strong>Stock:</strong> ' + fmt(a.stock_quantity || 0) + '</div>';

/* ==================== MODAL ARTICLE (copie exacte ACSER) ==================== */
var _afCounters = { lattes: 0, plots: 0, pointe: 0, contreplaque: 0 };
var _afLimits = { lattes: 8, plots: 3, pointe: 3, contreplaque: 5 };
var _afCatToType = { lattes: 'LATTE', plots: 'PLOT', pointe: 'POINTE', contreplaque: 'CP' };
var _afTypeToCat = { LATTE: 'lattes', PLOT: 'plots', POINTE: 'pointe', CP: 'contreplaque' };

/* Définitions disponibles par catégorie (nomenclatures + définitions manuelles) */
function afDefsByCat(cat) {
  var want = _afCatToType[cat];
  var map = {};
  getSection('composants', []).forEach(function(c) {
    if (c.type === want && c.code && !map[c.code]) map[c.code] = { code: c.code, name: c.designation || c.code, long: c.length || 0, larg: c.width || 0, epais: c.thickness || 0 };
  });
  getDefinitions().forEach(function(c) {
    if (c.type === want && c.code && !map[c.code]) map[c.code] = { code: c.code, name: c.designation || c.code, long: c.length || 0, larg: c.width || 0, epais: c.thickness || 0 };
  });
  return Object.keys(map).map(function(k) { return map[k]; });
}

function afRowHTML(cat, idx, preset) {
  var p = preset || {};
  var defs = afDefsByCat(cat);
  var opts = '<option value="">Code</option>' + defs.map(function(d) {
    return '<option value="' + escH(d.code) + '"' + (p.code === d.code ? ' selected' : '') + '>' + escH(d.code) + ' - ' + escH(d.name) + '</option>';
  }).join('');
  var s = _piS('100%');
  var h = '';
  if (cat === 'pointe') {
    h += '<td style="min-width:180px"><select id="af_' + cat + '_' + idx + '_code" onchange="afOnCode(\'' + cat + '\',' + idx + ')" style="' + s + '">' + opts + '</select><div id="af_' + cat + '_' + idx + '_name" style="font-size:.65rem;color:var(--dim);padding:.1rem .2rem">' + escH(p.designation || '') + '</div></td>';
    h += '<td><input type="number" id="af_' + cat + '_' + idx + '_qte" value="' + (p.quantity != null ? p.quantity : 0) + '" min="0" style="' + _pnS('70px') + '" oninput="afRecalc(\'' + cat + '\',' + idx + ')"></td>';
    h += '<td><button class="btn btn-red" onclick="afDelRow(\'' + cat + '\',' + idx + ')" style="font-size:.65rem;padding:2px 6px">🗑️</button></td>';
  } else {
    h += '<td style="min-width:170px"><select id="af_' + cat + '_' + idx + '_code" onchange="afOnCode(\'' + cat + '\',' + idx + ')" style="' + s + '">' + opts + '</select><div id="af_' + cat + '_' + idx + '_name" style="font-size:.65rem;color:var(--dim);padding:.1rem .2rem">' + escH(p.designation || '') + '</div></td>';
    h += '<td><select id="af_' + cat + '_' + idx + '_pos" style="' + _piS('110px') + '">' + ['SUPERIEUR', 'INTERMEDIAIRE BAS', 'INTERMEDIAIRE HAUT', 'INFERIEUR'].map(function(o) { return '<option' + (p.placement === o ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></td>';
    h += '<td><input type="number" id="af_' + cat + '_' + idx + '_long" value="' + (p.length || '') + '" min="0" step="0.1" style="' + _pnS('65px') + '" oninput="afRecalc(\'' + cat + '\',' + idx + ')"></td>';
    h += '<td><input type="number" id="af_' + cat + '_' + idx + '_larg" value="' + (p.width || '') + '" min="0" step="0.1" style="' + _pnS('65px') + '" oninput="afRecalc(\'' + cat + '\',' + idx + ')"></td>';
    h += '<td><input type="number" id="af_' + cat + '_' + idx + '_epais" value="' + (p.thickness || '') + '" min="0" step="0.1" style="' + _pnS('65px') + '" oninput="afRecalc(\'' + cat + '\',' + idx + ')"></td>';
    h += '<td><input type="number" id="af_' + cat + '_' + idx + '_qte" value="' + (p.quantity != null ? p.quantity : 1) + '" min="0" style="' + _pnS('60px') + '" oninput="afRecalc(\'' + cat + '\',' + idx + ')"></td>';
    h += '<td style="text-align:right;font-weight:700;font-size:.76rem;color:var(--accent)" id="af_vol_' + cat + '_' + idx + '">0.0000</td>';
    h += '<td><button class="btn btn-red" onclick="afDelRow(\'' + cat + '\',' + idx + ')" style="font-size:.65rem;padding:2px 6px">🗑️</button></td>';
  }
  return h;
}

function afAddRow(cat, preset) {
  var body = document.getElementById('af_body_' + cat);
  if (!body) return;
  var count = body.querySelectorAll('tr').length;
  if (count >= _afLimits[cat]) return toast('Maximum ' + _afLimits[cat] + ' lignes pour ce type.', 'error');
  var idx = _afCounters[cat]++;
  var tr = document.createElement('tr');
  tr.id = 'af_row_' + cat + '_' + idx;
  tr.innerHTML = afRowHTML(cat, idx, preset);
  body.appendChild(tr);
  afRecalc(cat, idx);
}

function afDelRow(cat, idx) {
  var r = document.getElementById('af_row_' + cat + '_' + idx);
  if (r) r.remove();
  afTotal();
}

function afOnCode(cat, idx) {
  var codeEl = document.getElementById('af_' + cat + '_' + idx + '_code');
  var code = codeEl ? codeEl.value : '';
  var def = afDefsByCat(cat).find(function(d) { return d.code === code; });
  var nameEl = document.getElementById('af_' + cat + '_' + idx + '_name');
  if (nameEl) nameEl.textContent = def ? def.name : '';
  if (def && cat !== 'pointe') {
    var l = document.getElementById('af_' + cat + '_' + idx + '_long');
    var w = document.getElementById('af_' + cat + '_' + idx + '_larg');
    var t = document.getElementById('af_' + cat + '_' + idx + '_epais');
    if (l) l.value = def.long || '';
    if (w) w.value = def.larg || '';
    if (t) t.value = def.epais || '';
  }
  afRecalc(cat, idx);
}

function afRecalc(cat, idx) {
  if (cat === 'pointe') { afTotal(); return; }
  var l = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_long') || {}).value) || 0;
  var w = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_larg') || {}).value) || 0;
  var t = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_epais') || {}).value) || 0;
  var q = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_qte') || {}).value) || 0;
  var v = l * w * t * q / 1000000;
  var cell = document.getElementById('af_vol_' + cat + '_' + idx);
  if (cell) cell.textContent = v.toFixed(4);
  afTotal();
}

function afTotal() {
  var total = 0;
  ['lattes', 'plots', 'contreplaque'].forEach(function(cat) {
    var body = document.getElementById('af_body_' + cat);
    if (!body) return;
    body.querySelectorAll('tr').forEach(function(r) {
      var parts = (r.id || '').split('_');
      var idx = parts[parts.length - 1];
      var l = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_long') || {}).value) || 0;
      var w = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_larg') || {}).value) || 0;
      var t = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_epais') || {}).value) || 0;
      var q = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_qte') || {}).value) || 0;
      total += l * w * t * q / 1000000;
    });
  });
  var badge = document.getElementById('af_voltotal');
  if (badge) badge.textContent = 'VOLUME TOTAL: ' + total.toFixed(4) + ' m³';
}

function afMarge() {
  var pu = parseFloat((document.getElementById('art_pu') || {}).value) || 0;
  var cr = parseFloat((document.getElementById('art_cr') || {}).value) || 0;
  var m = document.getElementById('art_marge');
  if (m) m.value = (pu - cr).toFixed(2);
}

}

function afCollectRows(cat) {
  var rows = [];
  var body = document.getElementById('af_body_' + cat);
  if (!body) return rows;
  body.querySelectorAll('tr').forEach(function(r) {
    var parts = (r.id || '').split('_');
    var idx = parts[parts.length - 1];
    var code = (document.getElementById('af_' + cat + '_' + idx + '_code') || {}).value || '';
    var qte = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_qte') || {}).value) || 0;
    if (!code && !qte) return;
    var nameEl = document.getElementById('af_' + cat + '_' + idx + '_name');
    var row = { code: code, designation: nameEl ? nameEl.textContent : code, quantity: qte };
    if (cat !== 'pointe') {
      row.length = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_long') || {}).value) || 0;
      row.width = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_larg') || {}).value) || 0;
      row.thickness = parseFloat((document.getElementById('af_' + cat + '_' + idx + '_epais') || {}).value) || 0;
      var pos = document.getElementById('af_' + cat + '_' + idx + '_pos');
      row.placement = pos ? pos.value : '';
      row.volume = row.length * row.width * row.thickness * qte / 1000000;
    } else {
      row.length = 0; row.width = 0; row.thickness = 0; row.placement = ''; row.volume = 0;
    }
    rows.push(row);
  });
  return rows;
}

function saveArticleModal(id) {
  var code = (document.getElementById('art_code') || {}).value || '';
  var designation = (document.getElementById('art_des') || {}).value || '';
  if (!code || !designation) return toast('Code et désignation requis', 'error');
  var articles = getArticles();
  var a = id ? articles.find(function(x) { return x.id === id; }) : null;
  if (id && !a) return;
  if (!a) { a = { id: genId(), created_at: new Date().toISOString() }; articles.push(a); }
  a.code = code;
  a.designation = designation;
  a.destination = (document.getElementById('art_dest') || {}).value || '';
  a.treatment_code = (document.getElementById('art_treat') || {}).value || '';
  a.prix_vente = parseFloat((document.getElementById('art_pu') || {}).value) || 0;
  a.prix_revient = parseFloat((document.getElementById('art_cr') || {}).value) || 0;
  a.category_type = (document.getElementById('art_ctype') || {}).value || 'PALETTE';
  a.categorie = (document.getElementById('art_catstock') || {}).value || 'finished';
  a.unite = (document.getElementById('art_unite') || {}).value || 'Unité';
  a.weight = parseFloat((document.getElementById('art_weight') || {}).value) || 0;
  a.length = parseFloat((document.getElementById('art_long') || {}).value) || 0;
  a.width = parseFloat((document.getElementById('art_larg') || {}).value) || 0;
  a.thickness = parseFloat((document.getElementById('art_epais') || {}).value) || 0;
  a.dimensions = (a.length || '') + 'x' + (a.width || '') + 'x' + (a.thickness || '');
  a.statut = 'active';
  setArticles(articles);
  /* Nomenclature : remplace les composants de l'article */
  var allComp = getSection('composants', []).filter(function(c) { return c.article_id !== a.id; });
  ['lattes', 'plots', 'pointe', 'contreplaque'].forEach(function(cat) {
    afCollectRows(cat).forEach(function(r) {
      allComp.push({ id: genId(), article_id: a.id, type: _afCatToType[cat], code: r.code, designation: r.designation, length: r.length, width: r.width, thickness: r.thickness, quantity: r.quantity, placement: r.placement, volume: r.volume });
    });
  });
  setSection('composants', allComp);
  document.getElementById('modalOverlay').remove();
  toast(id ? 'Article mis à jour' : 'Article créé');
  renderPage();
}

function showNewArticle() { openArticleModal(null); }
function editArticle(id) { openArticleModal(id); }

function createArticle() { saveArticleModal(null); }
function updateArticle(id) { saveArticleModal(id); }

function deleteArticle(id) {
  var art = getArticles().find(function(a) { return a.id === id; });
  if (!art) return;
  /* Vérifiez s'il y a du stock */
  var inStock = (getStockFinished().find(function(s) { return s.article_id === id; }) || getStockSemi().find(function(s) { return s.article_id === id; }));
  var msg = '⚠️ Supprimer l\'article ' + (art.code || '-') + ' — ' + (art.designation || '') + ' ?';
  if (inStock) msg += '\n\n⚠️ Cet article a du stock enregistré !\nSa suppression impactera les stocks liés.';
  msg += '\n\nConfirmer ?';
  if (!confirm2(msg)) return;
  setArticles(getArticles().filter(function(a) { return a.id !== id; }));
  toast('Article supprimé');
  renderPage();
}

/* ==================== FICHES TECHNIQUES ==================== */
function render_fiche_tech() {
  var articles = getArticles().filter(function(a) { return (a.categorie || 'finished') === 'finished'; });
  var composants = getSection('composants', []);
  if (articles.length === 0) return '<div class="empty">Aucun article. Ajoutez des articles dans Nomenclature → Catalogue.</div>';
  var selId = getSection('ficheTechArticle', articles[0].id);
  if (!articles.some(function(a) { return a.id === selId; })) selId = articles[0].id;
  var h = '<div class="card"><div class="form-group" style="max-width:420px;margin-bottom:0"><label>Produit fini</label>';
  h += '<select id="ft_article_sel" onchange="setSection(\'ficheTechArticle\',this.value);renderPage()">';
  articles.forEach(function(a) { h += '<option value="' + a.id + '"' + (a.id === selId ? ' selected' : '') + '>' + escH(a.code) + ' — ' + escH(a.designation) + '</option>'; });
  h += '</select></div></div>';
  var comp = composants.filter(function(c) { return c.article_id === selId; });
  var art = articles.find(function(a) { return a.id === selId; });

    });
    h += '</table></div>';
  });
  h += '<div class="card" style="border-left:4px solid var(--accent)"><strong>Nomenclature ' + escH(art ? art.code : '') + ' : ' + comp.length + ' composant(s) — Volume total ' + totVol.toFixed(4) + ' m³</strong></div>';
  return h;
}

function getDefinitions() { return getSection('definitions', []); }

/* Catalogue dédupliqué depuis les nomenclatures + définitions manuelles */
function defCatalog() {
  var map = {};
  getSection('composants', []).forEach(function(c) {
    if (!c.code) return;
    if (!map[c.code]) map[c.code] = { id: 'cat_' + c.code, code: c.code, designation: c.designation || c.code, type: c.type || '-', length: c.length || 0, width: c.width || 0, thickness: c.thickness || 0, volume: c.volume || 0, nb_articles: 0, custom: false };
    map[c.code].nb_articles++;
  });
  getDefinitions().forEach(function(c) {
    var prev = map[c.code] || { nb_articles: 0 };
    map[c.code] = { code: c.code, designation: c.designation || c.code, type: c.type || '-', length: c.length || 0, width: c.width || 0, thickness: c.thickness || 0, volume: c.volume || 0, qty_per_packet: c.qty_per_packet || 0, unit_cost: c.unit_cost || 0, observation: c.observation || '', essence: c.essence || '', nb_articles: prev.nb_articles || 0, custom: true, id: c.id };
  });
  return Object.keys(map).map(function(k) { return map[k]; });
}

function filterDefTable() {
  var input = document.getElementById('defSearchInput');
  if (!input) return;
  var q = (input.value || '').toLowerCase();
  setSection('defSearch', input.value);
  var rows = document.querySelectorAll('#defTable tbody tr, #defTable > tbody tr');
  if (!rows.length) rows = document.querySelectorAll('#defTable tr');
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (!r.querySelector('td')) continue;
    if (!q) r.style.display = '';
    else r.style.display = r.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
  }
}

/* Type essence façon ACSER : essence x type (Bois rouge / Bois blanc / Autre) */
function spType(s) {
  if (s && s.type) return s.type;
  var o = ((s && s.origine) || '').toLowerCase();
  if (o.indexOf('blanc') !== -1) return 'Bois blanc';
  if (o.indexOf('rouge') !== -1) return 'Bois rouge';
  if (o.indexOf('autre') !== -1 || o.indexOf('mixte') !== -1) return 'Autre';
  return 'Bois rouge';
}

/* ==================== RH - DÉPARTEMENTS / FONCTIONS (sync depuis paye) ==================== */
function getDepartementsFromPaye() {
  try {
    var payeData = JSON.parse(localStorage.getItem('mdb_paye')) || {};
    var svcs = payeData.services || [];
    if (svcs.length) return svcs.map(function(s) { return s.nom || s.name || s; }).filter(Boolean).sort();
    var cats = payeData.categories || [];
    var depts = new Set();
    cats.forEach(function(c) { if (c.service) depts.add(c.service); });
    return Array.from(depts).sort();
  } catch(e) { return ['Production', 'Maintenance', 'Logistique', 'Administration']; }
}
function getFonctionsFromPaye() {
  try {
    var payeData = JSON.parse(localStorage.getItem('mdb_paye')) || {};
    var fncs = payeData.fonctions || [];
    if (fncs.length) return fncs.map(function(f) { return f.nom || f.name || f; }).filter(Boolean).sort();
    var cats = payeData.categories || [];
    var funcs = new Set();
    cats.forEach(function(c) { if (c.fonction) funcs.add(c.fonction); });
    return Array.from(funcs).sort();
  } catch(e) { return ['Machiniste', 'Monteur', 'Manutentionnaire', 'Chef d\'équipe', 'Superviseur']; }
}
function getPersonnelByFonction(fonction) {
  return getPersonnel().filter(function(e) { return (e.fonction || e.service || '').trim() === fonction; });
}
function getPersonnelByDepartement(dept) {
  return getPersonnel().filter(function(e) { return (e.service || '').trim() === dept; });
}

  if (!checked.length) return toast('Sélectionnez au moins un employé', 'error');
  var presences = getPresence();
  var count = 0;
  checked.forEach(function(cb) {
    var empId = cb.value;
    for (var d = 1; d <= daysInMonth; d++) {
      var dt = new Date(year, month - 1, d);
      var dow = dt.getDay();
      if (dow === 0 || dow === 6) continue;
      var dateStr = year + '-' + String(month).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      var existing = presences.find(function(p) { return p.employee_id === empId && p.date === dateStr; });
      if (!existing) {
        presences.push({ id: genId(), employee_id: empId, date: dateStr, statut: 'present', heure_arrivee: '08:00', heure_depart: '17:00', heures_jour: 8, heures_nuit: 0 });
        count++;
      }
    }
  });
  setPresence(presences);
  document.getElementById('modalOverlay').remove();
  toast(count + ' pointages générés automatiquement');
  renderPage();
}

function buildFichePointageHTML(emp) {
  var pres = getPresence();
  var now = new Date();
  var year = now.getFullYear();
  var month = now.getMonth() + 1;
  var daysInMonth = new Date(year, month, 0).getDate();
  var monthNames = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  var html = '<html><head><style>body{font-family:Arial,sans-serif;font-size:11px;margin:20px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #ccc;padding:4px 6px;text-align:left}th{background:#f0f0f0;font-size:10px}td{font-size:10px}.header{text-align:center;margin-bottom:15px}.summary{margin-top:15px;display:flex;gap:20px}.summary-box{border:1px solid #ccc;padding:8px;flex:1}</style></head><body>';
  html += '<div class="header"><strong>Fiche de pointage détaillée</strong></div>';
  html += '<div style="font-size:10px;margin-bottom:10px">Employé: <strong>' + escH(emp.nom + ' ' + (emp.prenoms || '')) + '</strong> | Matricule: ' + escH(emp.matricule || '—') + ' | Fonction: ' + escH((emp.fonction || '').toUpperCase()) + '</div>';
  html += '<table><tr><th>Date</th><th>Pointages</th><th>Jour (H)</th><th>Nuit (H)</th><th>Total (H)</th><th>Rendement</th><th>Observations</th></tr>';
  var totalJour = 0, totalNuit = 0;
  for (var d = 1; d <= daysInMonth; d++) {
    var dateStr = year + '-' + String(month).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    var dt = new Date(year, month - 1, d);
    var dayNames = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
    var label = dayNames[dt.getDay()] + ' ' + String(d).padStart(2,'0') + '/' + String(month).padStart(2,'0');
    var p = pres.find(function(p) { return p.employee_id === emp.id && p.date === dateStr; });
    var ptg = p ? (p.heure_arrivee || '') + '-' + (p.heure_depart || '') : '-';
    var hj = p ? (parseFloat(p.heures_jour) || 0) : 0;
    var hn = p ? (parseFloat(p.heures_nuit) || 0) : 0;
    totalJour += hj;
    totalNuit += hn;
    html += '<tr><td>' + label + '</td><td>' + ptg + '</td><td>' + hj + '</td><td>' + hn + '</td><td>' + (hj + hn) + '</td><td>-</td><td>' + (p ? (p.statut || '') : '') + '</td></tr>';
  }
  html += '</table>';
  html += '<div class="summary">';
  html += '<div class="summary-box"><strong>Total Heures Jour :</strong> ' + totalJour + 'h<br><strong>Total Heures Nuit :</strong> ' + totalNuit + 'h<br><strong>TOTAL MENSUEL :</strong> ' + (totalJour + totalNuit) + 'h</div>';
  html += '<div class="summary-box"><strong>Heures à rattraper</strong><br>Total gagné: 0h<br>Total rattrapage: 0h</div>';
  html += '<div class="summary-box"><strong>Solde Restant à rattraper</strong><br><span style="font-size:20px;font-weight:800">' + (totalJour + totalNuit) + 'h</span></div>';
  html += '</div></body></html>';
  return html;
}

function printSelectedFiches() {
  var ids = getSelectedFicheEmpIds();
  if (!ids.length) return toast('Sélectionnez au moins un employé', 'error');
  var personnel = getPersonnel();
  ids.forEach(function(id) {
    var emp = personnel.find(function(e) { return e.id === id; });
    if (!emp) return;
    var win = window.open('', '_blank');
    win.document.write(buildFichePointageHTML(emp));
    win.document.close();
    win.print();
  });
  toast(ids.length + ' fiche(s) envoyée(s) à l\'impression');
}

function downloadSelectedFiches() {
  var ids = getSelectedFicheEmpIds();
  if (!ids.length) return toast('Sélectionnez au moins un employé', 'error');
  if (typeof window.jspdf === 'undefined') return toast('jsPDF non chargé', 'error');
  var personnel = getPersonnel();
  var doc = new window.jspdf.jsPDF();
  var first = true;
  ids.forEach(function(id) {
    var emp = personnel.find(function(e) { return e.id === id; });
    if (!emp) return;
    if (!first) doc.addPage();
    first = false;
    var html = buildFichePointageHTML(emp);
    doc.html(html, { callback: function(d) { d.save('Fiche_Pointage_' + (emp.matricule || emp.nom) + '.pdf'); }, x: 5, y: 5, width: 200, windowWidth: 700 });
  });
  toast(ids.length + ' fiche(s) téléchargée(s)');
}

function exportPointagePDF() {
  if (typeof window.jspdf === 'undefined') return toast('jsPDF non chargé', 'error');
  var ids = getPersonnel().map(function(e) { return e.id; });
  var doc = new window.jspdf.jsPDF();
  var first = true;
  ids.forEach(function(id) {
    var emp = getPersonnel().find(function(e) { return e.id === id; });
    if (!emp) return;
    if (!first) doc.addPage();
    first = false;
    doc.html(buildFichePointageHTML(emp), { callback: function(d) { d.save('Pointage_Compact_' + new Date().toISOString().slice(0,10) + '.pdf'); }, x: 5, y: 5, width: 200, windowWidth: 700 });
  });
  toast('PDF exporté');
}

function markCollectivePresence(statut) {
  var deptFilter = getSection('ptFilterDept', '');
  var foncFilter = getSection('ptFilterFonction', '');
  var typeFilter = getSection('ptFilterType', '');
  var personnel = getPersonnel();
  var filtered = personnel;
  if (deptFilter) filtered = filtered.filter(function(e) { return (e.service || '') === deptFilter; });
  if (foncFilter) filtered = filtered.filter(function(e) { return (e.fonction || '') === foncFilter; });
  if (typeFilter === 'jour') filtered = filtered.filter(function(e) { return (e.horaires || '').indexOf('nuit') === -1; });
  else if (typeFilter === 'nuit') filtered = filtered.filter(function(e) { return (e.horaires || '').indexOf('nuit') !== -1; });

  var date = (document.getElementById('ptDate') || {}).value || today();
  var presences = getPresence();
  filtered.forEach(function(e) {
    var existing = presences.find(function(p) { return p.employee_id === e.id && p.date === date; });
    if (existing) {
      existing.statut = statut;
      existing.heure_arrivee = statut === 'present' ? '08:00' : '';
      existing.heure_depart = statut === 'present' ? '17:00' : '';
    } else {
      presences.push({ id: genId(), employee_id: e.id, date: date, statut: statut, heure_arrivee: statut === 'present' ? '08:00' : '', heure_depart: statut === 'present' ? '17:00' : '', heures_jour: 8, heures_nuit: 0, faute_societe: false });
    }
  });
  setPresence(presences);
  toast('Marquage collectif ' + statut + ' appliqué à ' + filtered.length + ' personnes');
  renderPage();
}

  renderPage();

function deleteEpiCatalogue(id) {
  var e = getEpiCatalogue().find(function(x) { return x.id === id; });
  if (!e) return;
  var asg = getEpiAttributions().filter(function(a) { return a.epi_id === id && a.statut === 'actif'; });
  var msg = 'Supprimer ' + (e.code || '') + ' — ' + (e.designation || '') + ' ?';
  if (asg.length) msg += '\n\n⚠️ ' + asg.length + ' attribution(s) active(s) seront supprimées.';
  if (!confirm2(msg)) return;
  setEpiCatalogue(getEpiCatalogue().filter(function(x) { return x.id !== id; }));
  setEpiAttributions(getEpiAttributions().filter(function(a) { return a.epi_id !== id; }));
  toast('EPI supprimé');
  renderPage();
}

function addAchatEpiLigne() {
  var cat = getEpiCatalogue();
  var el = document.getElementById('pa_lignes');
  var d = document.createElement('div');
  d.className = 'card';
  d.style.cssText = 'padding:.5rem;margin-bottom:.5rem;display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:.5rem;align-items:end';
  var opts = '<option value="">Choisir l\'EPI</option>';
  cat.forEach(function(e) { opts += '<option value="' + e.id + '">' + escH(e.code) + ' — ' + escH(e.designation) + '</option>'; });
  d.innerHTML = '<div><select class="pa_article" style="width:100%">' + opts + '</select></div><div><input type="number" class="pa_qte" value="1" min="1" style="width:100%" onchange="updateAchatLigneTotal(this)"></div><div><input type="number" class="pa_pu" value="0" style="width:100%" onchange="updateAchatLigneTotal(this)"></div><div><div class="pa_total" style="padding:6px;font-weight:600">0</div></div><button class="btn btn-red" onclick="this.closest(\'.card\').remove();updateAchatGrandTotal()" style="font-size:.7rem">🗑️</button>';

function updateAchatLigneTotal(el) {
  var row = el.closest('.card');
  var q = parseFloat(row.querySelector('.pa_qte').value) || 0;
  var p = parseFloat(row.querySelector('.pa_pu').value) || 0;
  row.querySelector('.pa_total').textContent = fmtF(q * p);
  updateAchatGrandTotal();
}

function updateAchatGrandTotal() {
  var total = 0, count = 0;
  document.querySelectorAll('#pa_lignes .card').forEach(function(row) {
    var q = parseFloat(row.querySelector('.pa_qte').value) || 0;
    var p = parseFloat(row.querySelector('.pa_pu').value) || 0;
    total += q * p;
    count++;
  });
  var el = document.getElementById('pa_grandTotal');
  if (el) el.textContent = fmtF(total) + ' FCFA';
  var el2 = document.getElementById('pa_ligneCount');
  if (el2) el2.textContent = count;
}

function saveAchatEpi(addMore) {
  var date = (document.getElementById('pa_date')||{}).value;
  if (!date) return toast('Date requise', 'error');
  var four = (document.getElementById('pa_fournisseur')||{}).value || '';
  var acheteur = (document.getElementById('pa_acheteur')||{}).value || '';
  var lignes = [];
  document.querySelectorAll('#pa_lignes .card').forEach(function(row) {
    var artId = row.querySelector('.pa_article').value;
    var qte = parseInt(row.querySelector('.pa_qte').value) || 0;
    var pu = parseFloat(row.querySelector('.pa_pu').value) || 0;
    if (artId && qte > 0) {
      var epi = getEpiCatalogue().find(function(e) { return e.id === artId; });
      lignes.push({ epi_id: artId, article: epi ? (epi.code + ' — ' + epi.designation) : '', quantite: qte, prix_unitaire: pu });
    }
  });
  if (!lignes.length) return toast('Ajoutez au moins une ligne', 'error');
  var purchases = getEpiPurchases();
  purchases.push({ id: genId(), date: date, fournisseur: four, acheteur: acheteur, lignes: lignes });
  setEpiPurchases(purchases);
  /* Mise à jour stock */
  var cat = getEpiCatalogue();
  lignes.forEach(function(l) {
    var e = cat.find(function(x) { return x.id === l.epi_id; });
    if (e) e.stock = (e.stock || 0) + l.quantite;
  });
  setEpiCatalogue(cat);
  toast(lignes.length + ' ligne(s) enregistrée(s), stock mis à jour');
  if (addMore) { document.getElementById('pa_lignes').innerHTML = ''; addAchatEpiLigne(); updateAchatGrandTotal(); }
  else { document.getElementById('modalOverlay').remove(); renderPage(); }
}

function deleteEpiPurchase(id) {
  if (!confirm2('Supprimer cet achat et déduire le stock ?')) return;
  var purchase = getEpiPurchases().find(function(p) { return p.id === id; });
  if (purchase) {
    var cat = getEpiCatalogue();
    (purchase.lignes || []).forEach(function(l) {
      var e = cat.find(function(x) { return x.id === l.epi_id; });
      if (e) e.stock = Math.max(0, (e.stock || 0) - (l.quantite || 0));
    });
    setEpiCatalogue(cat);
  }
  setEpiPurchases(getEpiPurchases().filter(function(p) { return p.id !== id; }));
  toast('Achat supprimé, stock déduit');
  renderPage();
}

function filterAeList() {
  var q = ((document.getElementById('aeSearch')||{}).value || '').toLowerCase();
  document.querySelectorAll('.ae-emp').forEach(function(cb) {
    var label = cb.parentElement;
    cb.parentElement.style.display = label.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none';
  });
}

function aeToggleAll(checked) {
  document.querySelectorAll('.ae-emp').forEach(function(cb) { if (cb.parentElement.style.display !== 'none') cb.checked = checked; });
  document.getElementById('aeCount').textContent = document.querySelectorAll('.ae-emp:checked').length;
}

function saveAttributionEpi() {
  var checked = document.querySelectorAll('.ae-emp:checked');
  var epiId = (document.getElementById('aeEpi')||{}).value;
  var qte = parseInt((document.getElementById('ae_qte')||{}).value) || 1;
  if (!checked.length) return toast('Sélectionnez au moins un employé', 'error');
  if (!epiId) return toast('Choisissez un EPI', 'error');
  var cat = getEpiCatalogue();
  var epi = cat.find(function(e) { return e.id === epiId; });
  var totalNeeded = checked.length * qte;
  if ((epi.stock || 0) < totalNeeded) return toast('Stock insuffisant (' + (epi.stock || 0) + ' disponible, ' + totalNeeded + ' requis)', 'error');
  var attribs = getEpiAttributions();
  var date = (document.getElementById('ae_date')||{}).value || today();
  var statut = (document.getElementById('ae_statut')||{}).value || 'actif';
  var comment = (document.getElementById('ae_comment')||{}).value || '';
  checked.forEach(function(cb) {
    for (var i = 0; i < qte; i++) {
      attribs.push({ id: genId(), employee_id: cb.value, epi_id: epiId, date_attribution: date, statut: statut, etat: 'Bon', commentaire: comment });
    }
  });
  setEpiAttributions(attribs);
  epi.stock = (epi.stock || 0) - totalNeeded;
  setEpiCatalogue(cat);
  document.getElementById('modalOverlay').remove();
  toast(totalNeeded + ' EPI attribué(s) à ' + checked.length + ' employé(s), stock déduit');
  renderPage();
}

function returnEpiAttribution(id) {
  var attribs = getEpiAttributions();
  var a = attribs.find(function(x) { return x.id === id; });
  if (!a) return;
  a.statut = 'inactif';
  a.date_remplacement = today();
  setEpiAttributions(attribs);
  var cat = getEpiCatalogue();
  var e = cat.find(function(x) { return x.id === a.epi_id; });
  if (e) e.stock = (e.stock || 0) + 1;
  setEpiCatalogue(cat);
  toast('EPI retourné, stock réaugmenté');
  renderPage();
}

function deleteEpiAttribution(id) {
  if (!confirm2('Supprimer cette attribution ?')) return;
  setEpiAttributions(getEpiAttributions().filter(function(a) { return a.id !== id; }));
  toast('Attribution supprimée');
  renderPage();
}

function calcColisSortie(colisCode) {
  if (!colisCode) return { totalSortie: 0, qteSortie: 0, restant: 0, details: '' };
  var totalSortie = 0;
  var qteSortie = 0;
  var details = [];
  var prods = getProductions();
  prods.forEach(function(p) {
    if (!p.sortie_bois) return;
    p.sortie_bois.forEach(function(sb) {
      if (sb.code === colisCode) {
        totalSortie += parseFloat(sb.volume || 0);
        qteSortie += parseInt(sb.qte || 0, 10);
        details.push('Fiche ' + (p.numero || p.id) + ' (' + (p.date || '') + ')');
      }
    });
  });
  /* Chercher le volume d'origine dans stockRaw */
  var stockRaw = getStockRaw();
  var original = 0;
  for (var i = 0; i < stockRaw.length; i++) {
    if (stockRaw[i].code === colisCode || stockRaw[i].colis_number === colisCode) {
      original = parseFloat(stockRaw[i].volume || 0);
      break;
    }
  }
  var restant = original - totalSortie;
  return { totalSortie: totalSortie, qteSortie: qteSortie, restant: restant, details: details.join(', ') || 'Aucune sortie' };
}

}
function formSelect(id, label, options, required) {
  var h = '<div class="form-group"><label>' + escH(label) + (required ? ' *' : '') + '</label><select id="' + id + '">';
  options.forEach(function(o) { h += '<option value="' + escH(o.v) + '">' + escH(o.t) + '</option>'; });
  h += '</select></div>';
  return h;
}
function formTextarea(id, label) {
  return '<div class="form-group"><label>' + escH(label) + '</label><textarea id="' + id + '"></textarea></div>';
}
function filterTable(tableId, q) {
  var rows = document.querySelectorAll('#' + tableId + ' tr');
  q = q.toLowerCase();
  rows.forEach(function(r, i) { if (i === 0) return; r.style.display = r.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none'; });
}
function globalSearchFn(q) {
  if (!q) return renderPage();
  /* Search across articles */
  var results = [];
  getArticles().forEach(function(a) {
    if ((a.code + ' ' + a.designation).toLowerCase().indexOf(q.toLowerCase()) !== -1) results.push('Article: ' + a.code + ' — ' + a.designation);
  });
  if (results.length > 0) {
    document.getElementById('content').innerHTML = '<div class="card"><h3>🔍 Résultats pour "' + escH(q) + '"</h3><ul>' + results.map(function(r) { return '<li>' + escH(r) + '</li>'; }).join('') + '</ul></div>';
  }
}

function seedSpeciesACSER() {
  var existing = getSpecies();
  /* Purge les essences ajoutées manuellement hors API (on ne garde que acser.com) */
  var dropIds = { sp_aya: 1, sp_iro: 1, sp_moi: 1, sp_azo: 1, sp_bal: 1, sp_popl: 1, sp_pin: 1, sp_kal: 1 };
  var cleaned = existing.filter(function(s) { return !dropIds[s.id]; });
  if (cleaned.length !== existing.length) { existing = cleaned; setSpecies(existing); }
  var has = {};
  existing.forEach(function(s) { has[s.id] = true; });
  var ref = [
    { id: 'sp_ako', code: 'AKO', nom: 'AKO', type: 'Bois blanc', origine: 'Bois blanc' },
    { id: 'sp_awale', code: 'AWALE', nom: 'AWALE', type: 'Bois blanc', origine: 'Bois blanc' },

    { id: 'sp_divm', code: 'DIV-MIXTE', nom: 'DIVERS-MIXTE', type: 'Autre', origine: 'Autre' },
    { id: 'sp_emien', code: 'EMIEN', nom: 'EMIEN', type: 'Bois blanc', origine: 'Bois blanc' },

    { id: 'sp_tia', code: 'TIA', nom: 'TIAMA', type: 'Bois rouge', origine: 'Bois rouge' },

  if (changed) setSpecies(existing);
}

  }).join('');
  return html;
}
function compDefDatalistHTML(type) {
  return '<datalist id="compDefList_' + type + '">' + compDefOptionsHTML(type) + '</datalist>';
}
function ensureCompDefDatalists() {
  ['LATTE', 'PLOT', 'CP'].forEach(function(type) {
    var id = 'compDefList_' + type;
    var dl = document.getElementById(id);
    if (!dl) document.body.insertAdjacentHTML('beforeend', compDefDatalistHTML(type));
    else dl.innerHTML = compDefOptionsHTML(type);
  });
}
function onCompCodeChange(input, type) {
  var tr = input.closest('tr');
  if (!tr) return;
  var code = input.value.trim();
  var defs = defCatalog();
  var def = null;
  for (var i = 0; i < defs.length; i++) {
    if (defs[i].type === type && defs[i].code === code) { def = defs[i]; break; }
  }
  if (!def) {
    var arts = getArticles();
    for (var j = 0; j < arts.length; j++) {
      if (arts[j].code === code) {
        def = { designation: arts[j].designation || arts[j].code, length: arts[j].length || 0, width: arts[j].width || 0, thickness: arts[j].thickness || 0 };
        break;
      }
    }
  }
  if (!def) return;
  var cells = tr.querySelectorAll('input');
  if (cells.length >= 2 && cells[1] && !cells[1].value) cells[1].value = def.designation || code;
  if (type === 'CP') {
    /* CP : la colonne 2 est "Type de CP" ; remplir aussi dims si présents */
    if (cells[1] && !cells[1].value) cells[1].value = def.designation || code;
  }
  var dimInputs = tr.querySelectorAll('input[type="number"]');
  if (dimInputs && dimInputs.length >= 4) {
    /* dimInputs[0] = Qté (saisie libre, ne pas pré-remplir) ; [1]=Long, [2]=Larg, [3]=Épais */
    if (parseFloat(def.length) > 0) dimInputs[1].value = def.length;
    if (parseFloat(def.width) > 0) dimInputs[2].value = def.width;
    if (parseFloat(def.thickness) > 0) dimInputs[3].value = def.thickness;
  }
  /* Recalcul volume */
  var rowId = tr.id || '';
  if (/^latteRow/.test(rowId)) calcLatteVol(parseInt(rowId.replace('latteRow', ''), 10));
  else if (/^plotRow/.test(rowId)) calcPlotVol(parseInt(rowId.replace('plotRow', ''), 10));
  else if (/^cpRow/.test(rowId)) calcCPVol(parseInt(rowId.replace('cpRow', ''), 10));
}


var _sidebarCollapsed = false;
var _sidebarPinned = false;
var _sbExpandTime = 0;

function initSidebarState() {
  try { _sidebarCollapsed = localStorage.getItem('mdb_sidebarCollapsed') === '1'; } catch(e) {}
  try { _sidebarPinned = localStorage.getItem('mdb_sidebarPinned') === '1'; } catch(e) {}

  var sb = document.getElementById('sidebar');
  if (sb) {
    sb.classList.remove('show');
    /* Sur mobile : toujours en tiroir fermé, jamais replié/épinglé (comme index) */
    if (isMobileView()) {
      sb.classList.remove('collapsed');
      sb.classList.remove('pinned');
    } else if (_sidebarPinned) {
      sb.classList.add('pinned');
      _sidebarCollapsed = false;
      sb.classList.remove('collapsed');
    } else if (_sidebarCollapsed) {
      sb.classList.add('collapsed');
    }
  }
  var ov = document.getElementById('sidebarOverlay');
  if (ov) ov.classList.remove('open');
  updateSidebarButtonsUI();
}

function toggleSidebarCollapse() {
  _sidebarCollapsed = !_sidebarCollapsed;
  if (!_sidebarCollapsed) _sbExpandTime = Date.now();
  var sb = document.getElementById('sidebar');
  if (sb) {
    sb.classList.toggle('collapsed', _sidebarCollapsed);
    if (!_sidebarCollapsed) {
      _sidebarPinned = false;
      sb.classList.remove('pinned');
      localStorage.setItem('mdb_sidebarPinned', '0');
    }
  }
  try { localStorage.setItem('mdb_sidebarCollapsed', _sidebarCollapsed ? '1' : '0'); } catch(e) {}
  updateSidebarButtonsUI();
}

function toggleSidebarPin() {
  _sidebarPinned = !_sidebarPinned;
  var sb = document.getElementById('sidebar');
  if (sb) {
    /* L'épingle n'a de sens que sur desktop (comme index : off-canvas sur mobile) */
    if (_sidebarPinned && isMobileView()) _sidebarPinned = false;
    sb.classList.toggle('pinned', _sidebarPinned);
    if (_sidebarPinned) {
      _sidebarCollapsed = false;
      sb.classList.remove('collapsed');
      try { localStorage.setItem('mdb_sidebarCollapsed', '0'); } catch(e) {}
    }
  }
  try { localStorage.setItem('mdb_sidebarPinned', _sidebarPinned ? '1' : '0'); } catch(e) {}
  updateSidebarButtonsUI();
}

function updateSidebarButtonsUI() {
  var pinBtn = document.getElementById('sidebarPinBtn');
  var collapseBtn = document.getElementById('sidebarCollapseBtn');
  if (pinBtn) pinBtn.style.color = _sidebarPinned ? '#f97316' : 'var(--dim)';
  if (collapseBtn) collapseBtn.textContent = _sidebarCollapsed ? '▶' : '◀';
}


document.addEventListener('DOMContentLoaded', function() {
  var sb = document.getElementById('sidebar');
  if (sb) {
    sb.addEventListener('mouseleave', function() {
      if (_sidebarCollapsed && !_sidebarPinned) {
        sb.classList.add('collapsed');
      }
    });
  }
});

/* Comme index : clic dans l'espace de travail = la sidebar se replie (sauf si épinglée).
   Sur mobile : clic dehors = fermeture du tiroir.
   - Seul un clic DANS #app (zone de travail) replie, pas les modals/toasts.
   - Grâce de 600ms après une expansion manuelle (le temps de faire son choix). */
document.addEventListener('click', function(e) {
  var sb = document.getElementById('sidebar');
  if (!sb || _sidebarPinned) return;
  if (e.target.closest('#sidebar') ||
      e.target.closest('#sidebarPinBtn') || e.target.closest('#sidebarCollapseBtn') ||
      e.target.closest('#sidebarOverlay')) return;
  if (isMobileView()) {
    if (sb.classList.contains('show')) closeSidebar();
  } else {
    if (!e.target.closest('#app')) return;
    if (Date.now() - _sbExpandTime < 600) return;
    if (!sb.classList.contains('collapsed')) {
      _sidebarCollapsed = true;
      sb.classList.add('collapsed');
      try { localStorage.setItem('mdb_sidebarCollapsed', '1'); } catch(err) {}
      updateSidebarButtonsUI();
    }
  }
});

/* ==================== SORTIE DE BOIS AUTO-LOOKUP (removed duplicate — kept original at ~1053) ==================== */
function updateProductionTotals() {
  // Sum Sortie Bois
  var totalSbQte = 0, totalSbVol = 0;
  var sbRows = document.querySelectorAll('[id^="sb_row_"], [id^="sortieBoisRow"]');
  sbRows.forEach(function(row, idx) {
    var qte = parseFloat((document.getElementById('sb_qte_' + idx) || {}).value || 0);
    var vol = parseFloat((document.getElementById('sb_vol_' + idx) || {}).value || 0);
    totalSbQte += qte;
    totalSbVol += vol;
  });

  var totalSbQteEl = document.getElementById('sb_total_qte');
  var totalSbVolEl = document.getElementById('sb_total_vol');
  if (totalSbQteEl) totalSbQteEl.textContent = totalSbQte;
  if (totalSbVolEl) totalSbVolEl.textContent = totalSbVol.toFixed(4) + ' m³';

  // Sum Lattes
  var totalLatteVol = 0;
  document.querySelectorAll('[id^="latte_vol_"]').forEach(function(input) {
    totalLatteVol += parseFloat(input.value || 0);
  });

  // Sum Plots
  var totalPlotVol = 0;
  document.querySelectorAll('[id^="plot_vol_"]').forEach(function(input) {
    totalPlotVol += parseFloat(input.value || 0);
  });

  // Summary Cards at bottom
  var sumSbEl = document.getElementById('summary_sb_vol');
  var sumLatteEl = document.getElementById('summary_latte_vol');
  var sumPlotEl = document.getElementById('summary_plot_vol');
  var sumTotalProdEl = document.getElementById('summary_total_prod_vol');
  var sumRendementEl = document.getElementById('summary_rendement');

  var totalTransforme = totalLatteVol + totalPlotVol;
  var rendement = totalSbVol > 0 ? ((totalTransforme / totalSbVol) * 100).toFixed(1) : '0.0';

  if (sumSbEl) sumSbEl.textContent = totalSbVol.toFixed(4) + ' m³';
  if (sumLatteEl) sumLatteEl.textContent = totalLatteVol.toFixed(4) + ' m³';
  if (sumPlotEl) sumPlotEl.textContent = totalPlotVol.toFixed(4) + ' m³';
  if (sumTotalProdEl) sumTotalProdEl.textContent = totalTransforme.toFixed(4) + ' m³';
  if (sumRendementEl) sumRendementEl.textContent = rendement + ' %';
}

function onAchatEssenceChange() {
  var codeEl = document.getElementById('ai_essence');
  var typeEl = document.getElementById('ai_type');
  if (!codeEl || !typeEl) return;
  var code = (codeEl.value || '').trim().toUpperCase();
  if (!code) return;
  var sp = getSpecies().find(function(s) { return ((s.code || '').toUpperCase() === code); });
  if (!sp) return;
  var t = spType(sp);
  typeEl.value = t === 'Bois rouge' ? 'Rouge' : (t === 'Bois blanc' ? 'Blanc' : 'Autre');
}
function onLGlobInput() {
  var lglob = parseFloat((document.getElementById('ai_lglob') || {}).value || 0);
  var qte = parseFloat((document.getElementById('ai_qte') || {}).value || 1);
  var largEl = document.getElementById('ai_larg');
  if (lglob > 0 && qte > 0 && largEl) {
    var largMoy = lglob / qte;
    largEl.value = largMoy.toFixed(1);
  }
  calcItemVolLive();
}

function onLargInput() {
  /* La largeur globale n'est jamais remplie auto : seul le sens L.glob -> Larg moy. existe */
  calcItemVolLive();
}

function calcItemVolLive() {
  var qte = parseFloat((document.getElementById('ai_qte') || {}).value || 0);
  var L = parseFloat((document.getElementById('ai_long') || {}).value || 0);
  var l = parseFloat((document.getElementById('ai_larg') || {}).value || 0);
  var e = parseFloat((document.getElementById('ai_epais') || {}).value || 0);

  var vol = 0;
  if (L > 0 && l > 0 && e > 0) {
    vol = (L * l * e / 1000000) * qte;
  }
  var volEl = document.getElementById('ai_vol');
  if (volEl) volEl.value = vol.toFixed(4);
}


function addAchatItemLine(category) {
  var item = {};
  if (category === 'raw-materials') {
    var colis = (document.getElementById('ai_colis') || {}).value || 'COL-' + Date.now().toString().slice(-4);
    var qte = parseFloat((document.getElementById('ai_qte') || {}).value || 1);
    var L = parseFloat((document.getElementById('ai_long') || {}).value || 0);
    var l = parseFloat((document.getElementById('ai_larg') || {}).value || 0);
    var lglob = parseFloat((document.getElementById('ai_lglob') || {}).value || 0);
    var e = parseFloat((document.getElementById('ai_epais') || {}).value || 0);
    var vol = parseFloat((document.getElementById('ai_vol') || {}).value || 0);
    var essence = (document.getElementById('ai_essence') || {}).value || 'AY';
    var type = (document.getElementById('ai_type') || {}).value || 'Rouge';
    var zone = (document.getElementById('ai_zone') || {}).value || '';
    var obs = (document.getElementById('ai_obs') || {}).value || '';

    // If width l is 0 but lglob is entered, compute average width = lglob / qte
    if ((!l || l === 0) && lglob > 0 && qte > 0) {
      l = parseFloat((lglob / qte).toFixed(1));
    }
    // Recalculate volume with effective average width l
    if (L > 0 && l > 0 && e > 0 && (!vol || vol === 0)) {
      vol = (L * l * e / 1000000) * qte;
    }

    item = { colis_number: colis, quantity: qte, length: L, width: l, lglob: lglob, thickness: e, volume: vol, essence: essence, type: type, zone: zone, obs: obs };
  } else if (category === 'consumables' || category === 'consumable') {
    var code = (document.getElementById('ai_code') || {}).value || 'ART-' + Date.now().toString().slice(-4);
    var des = (document.getElementById('ai_designation') || {}).value || 'Consommable';
    var qte = parseFloat((document.getElementById('ai_qte') || {}).value || 1);
    var pu = parseFloat((document.getElementById('ai_pu') || {}).value || 0);
    var obs = (document.getElementById('ai_obs') || {}).value || '';
    var ctype = (document.getElementById('ai_constype') || {}).value || 'POINTE';
    var empl = (document.getElementById('ai_emplacement') || {}).value || '';
    var qtePaq = parseFloat((document.getElementById('ai_qte_paquet') || {}).value || 1);
    var units = ctype === 'POINTE' ? qte * Math.max(1, qtePaq) : qte;

    item = { code: code, designation: des, quantity: units, paquets: qte, cond: qtePaq, ctype: ctype, emplacement: empl, unit_price: pu, total_price: qte * pu, obs: obs };
  } else {
    var code = (document.getElementById('ai_code') || {}).value || 'ART-' + Date.now().toString().slice(-4);
    var des = (document.getElementById('ai_designation') || {}).value || 'Article';
    var qte = parseFloat((document.getElementById('ai_qte') || {}).value || 1);
    var pu = parseFloat((document.getElementById('ai_pu') || {}).value || 0);
    var obs = (document.getElementById('ai_obs') || {}).value || '';

    item = { code: code, designation: des, quantity: qte, unit_price: pu, total_price: qte * pu, obs: obs };
  }

  _tempAchatItems.push(item);
  renderAchatItemsTable(category);
}

function removeAchatItemLine(idx, category) {
  _tempAchatItems.splice(idx, 1);
  renderAchatItemsTable(category);
}

      h += '<td style="padding:0.5rem">' + escH(it.designation) + (it.ctype ? ' <span style="font-size:.65rem;background:#eef2ff;color:#3730a3;border-radius:8px;padding:1px 7px;font-weight:700">' + escH(it.ctype) + '</span>' : '') + '</td>';

      h += '<td style="padding:0.5rem;font-weight:600">' + escH(it.code) + '</td>';

function calcAchatVol() {
  var qte = parseFloat((document.getElementById('ach_qte') || {}).value || 0);
  var L = parseFloat((document.getElementById('ach_long') || {}).value || 0);
  var l = parseFloat((document.getElementById('ach_larg') || {}).value || 0);
  var e = parseFloat((document.getElementById('ach_epais') || {}).value || 0);
  var volEl = document.getElementById('ach_vol');
  if (volEl && L > 0 && l > 0 && e > 0) {
    var v = (L * l * (e / 10) / 1000000) * qte;
    volEl.value = v.toFixed(4);
  }
}

function calcAchatTotal() {
  var qte = parseFloat((document.getElementById('ach_qte') || {}).value || 0);
  var pu = parseFloat((document.getElementById('ach_prix_unit') || {}).value || 0);
  var mtEl = document.getElementById('ach_montant');
  if (mtEl && qte > 0 && pu > 0) {
    mtEl.value = (qte * pu).toString();
  }
}

function saveAchatByCategory(e, category) {
  e.preventDefault();
  var achats = getAchats();

  var ref = (document.getElementById('ach_ref') || {}).value || '';
  var date = (document.getElementById('ach_date') || {}).value || today();
  var fournisseur = (document.getElementById('ach_fournisseur') || {}).value || '';
  var receiver = (document.getElementById('ach_receiver') || {}).value || '';
  var acheteur = (document.getElementById('ach_acheteur') || {}).value || '';

  if (_tempAchatItems.length === 0) {
    return toast('Veuillez ajouter au moins un article en cliquant sur le bouton "+"', 'error');
  }

  var totalVol = _tempAchatItems.reduce(function(acc, item) { return acc + (parseFloat(item.volume) || 0); }, 0);
  var totalAmount = _tempAchatItems.reduce(function(acc, item) { return acc + (parseFloat(item.total_price) || 0); }, 0);

  var existingId = window._editingAchatId || null;
  var existing = existingId ? achats.find(function(x) { return x.id === existingId; }) : null;

  if (existing) {
    existing.reference = ref;
    existing.date = date;
    existing.fournisseur = fournisseur;
    existing.receiver_name = receiver;
    existing.acheteur = acheteur;
    existing.items = _tempAchatItems.slice();
    existing.item_count = _tempAchatItems.length;
    existing.total_volume = totalVol;
    existing.montant_total = totalAmount;
    existing.updated_at = today();
  } else {
    var newAchat = {
      id: Date.now(),
      category: category,
      type: category,
      date: date,
      reference: ref,
      fournisseur: fournisseur,
      receiver_name: receiver,
      acheteur: acheteur,
      items: _tempAchatItems.slice(),
      item_count: _tempAchatItems.length,
      total_volume: totalVol,
      montant_total: totalAmount,
      created_at: today()
    };
    achats.unshift(newAchat);
  }

  setAchats(achats);
  window._editingAchatId = null;

  if (category === 'raw-materials' && !existing) {
    var rawStock = getStockRaw();
    _tempAchatItems.forEach(function(it) {
      rawStock.unshift({
        id: Date.now() + Math.random(),
        code: it.colis_number,
        colis_number: it.colis_number,
        designation: it.essence + ' (' + it.type + ')',
        essence: it.essence,
        type: it.type,
        fournisseur: fournisseur,
        longueur: it.length,
        largeur: it.width,
        epaisseur: it.thickness,
        volume: it.volume,
        quantite: it.quantity,
        zone: it.zone,
        created_at: today()
      });
    });
    setStockRaw(rawStock);
  } else if (category === 'semi' && !existing) {
    var semiStock = getStockSemi();
    _tempAchatItems.forEach(function(it) {
      semiStock.unshift({
        id: Date.now() + Math.random(),
        code: it.code,
        designation: it.designation,
        fournisseur: fournisseur,
        quantite: it.quantity,
        prix_unitaire: it.unit_price,
        created_at: today()
      });
    });
    setStockSemi(semiStock);
  } else if (category === 'finished' && !existing) {
    var finStock = getStockFinished();
    _tempAchatItems.forEach(function(it) {
      finStock.unshift({
        id: Date.now() + Math.random(),
        code: it.code,
        designation: it.designation,
        fournisseur: fournisseur,
        quantite: it.quantity,
        prix_unitaire: it.unit_price,
        created_at: today()
      });
    });
    setStockFinished(finStock);
  } else if (category === 'merchandises' && !existing) {
    var merchStock = getStockMerch();
    _tempAchatItems.forEach(function(it) {
      merchStock.unshift({
        id: Date.now() + Math.random(),
        code: it.code,
        designation: it.designation,
        fournisseur: fournisseur,
        quantite: it.quantity,
        prix_unitaire: it.unit_price,
        created_at: today()
      });
    });
    setStockMerch(merchStock);
  } else if (category === 'consumables' && !existing) {
    var consumStock = getStockConsum();
    _tempAchatItems.forEach(function(it) {
      consumStock.unshift({
        id: Date.now() + Math.random(),
        code: it.code,
        designation: it.designation,
        fournisseur: fournisseur,
        quantite: it.quantity,
        paquets: it.paquets || it.quantity,
        cond: it.cond || 1,
        ctype: it.ctype || 'DIVERS',
        emplacement: it.emplacement || '',
        prix_unitaire: it.unit_price,
        created_at: today()
      });
    });
    setStockConsum(consumStock);
  }

  toast(existing ? 'Achat mis à jour' : 'Enregistrement réussi !', 'success');
  closeModal();
  renderPage();
}

function extractAchatFromDoc(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var status = document.getElementById('ach_doc_status');
  var preview = document.getElementById('ach_doc_preview');
  status.textContent = '🔄 Analyse en cours...';
  preview.style.display = 'none';
  preview.textContent = '';

  function processImage(img) {
    if (typeof Tesseract === 'undefined') {
      status.textContent = '❌ Tesseract.js non chargé';
      return;
    }
    Tesseract.recognize(img, 'fra', { logger: function(m) { if (m.status === 'recognizing text') status.textContent = '🔄 OCR: ' + Math.round(m.progress * 100) + '%'; }})
      .then(function(result) {
        var text = result.data.text || '';
        preview.textContent = text;
        preview.style.display = 'block';
        status.textContent = '✅ Texte extrait — vérifiez et complétez les champs';
        applyExtractedAchatData(text);
      })
      .catch(function(err) {
        status.textContent = '❌ Erreur OCR: ' + err.message;
      });
  }

  var url = URL.createObjectURL(file);
  if (file.type === 'application/pdf') {
    if (typeof pdfjsLib === 'undefined') {
      status.textContent = '❌ pdf.js non chargé';
      return;
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    var reader = new FileReader();
    reader.onload = function(e) {
      pdfjsLib.getDocument(new Uint8Array(e.target.result)).promise.then(function(pdf) {
        var maxPages = Math.min(pdf.numPages, 5);
        // 1) extraction de texte Natif (précis + instantané) si le PDF en contient
        var textTasks = [];
        for (var ti = 1; ti <= maxPages; ti++) {
          textTasks.push(pdf.getPage(ti).then(function(page) {
            return page.getTextContent().then(function(tc) {
              return tc.items.map(function(it) { return it.str || ''; }).join(' ');
            });
          }));
        }
        Promise.all(textTasks).then(function(allText) {
          var joined = allText.join('\n---PAGE BREAK---\n');
          var cleaned = joined.replace(/\s{2,}/g, ' ').trim();
          if (cleaned.length > 30) {
            preview.textContent = joined;
            preview.style.display = 'block';
            status.textContent = '✅ Texte extrait du PDF (texte natif) — vérifiez et complétez les champs';
            applyExtractedAchatData(joined);
            return;
          }
          // 2) sinon fallback: rendu canvas de chaque page + OCR Tesseract
          var pages = [];
          for (var pi = 1; pi <= maxPages; pi++) {
            pages.push(pdf.getPage(pi).then(function(page) {
              var viewport = page.getViewport({ scale: 2 });
              var canvas = document.createElement('canvas');
              canvas.width = viewport.width;
              canvas.height = viewport.height;
              var ctx = canvas.getContext('2d');
              return page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function() {
                return canvas.toDataURL('image/png');
              });
            }));
          }
          Promise.all(pages).then(function(imgs) {
            processAllImages(imgs, function(text) {
              preview.textContent = text;
              preview.style.display = 'block';
              status.textContent = '✅ Texte extrait (OCR) — vérifiez et complétez les champs';
              applyExtractedAchatData(text);
            });
          });
        });
      }).catch(function(err) { status.textContent = '❌ Erreur PDF: ' + err.message; });
    };
    reader.readAsArrayBuffer(file);
  } else {
    var img = new Image();
    img.onload = function() { processImage(img); URL.revokeObjectURL(url); };
    img.onerror = function() { status.textContent = '❌ Erreur chargement image'; URL.revokeObjectURL(url); };
    img.src = url;
  }
}
function processAllImages(imgs, done) {
  var texts = [];
  var status = document.getElementById('ach_doc_status');
  var i = 0;
  function next() {
    if (i >= imgs.length) { done(texts.join('\n---PAGE BREAK---\n')); return; }
    if (typeof Tesseract === 'undefined') { status.textContent = '❌ Tesseract.js non chargé'; return; }
    Tesseract.recognize(imgs[i], 'fra', { logger: function(m) { if (m.status === 'recognizing text') status.textContent = '🔄 OCR page ' + (i + 1) + '/' + imgs.length + ': ' + Math.round(m.progress * 100) + '%'; }})
      .then(function(result) { texts.push(result.data.text || ''); i++; next(); })
      .catch(function(err) { status.textContent = '❌ Erreur OCR: ' + err.message; });
  }
  next();
}

function applyExtractedAchatData(text) {
  var lines = text.split(/\r?\n/).map(function(l) { return l.trim(); }).filter(function(l) { return l.length > 0; });
  var full = lines.join(' ');

  // 1. Fournisseur — matching contre liste connue
  var suppliers = getSharedFournisseurs();
  var foundFournisseur = null;
  for (var i = 0; i < suppliers.length; i++) {
    var fn = (suppliers[i].company_name || suppliers[i].name || suppliers[i].nom || '').toLowerCase();
    if (fn && full.toLowerCase().indexOf(fn) >= 0) { foundFournisseur = suppliers[i].company_name || suppliers[i].name || suppliers[i].nom; break; }
  }
  if (foundFournisseur) document.getElementById('ach_fournisseur').value = foundFournisseur;
  else {
    // fallback: première ligne qui ressemble à un nom (pas de chiffres, pas de mots-clés facture)
    for (var i = 0; i < lines.length; i++) {
      if (!/^\d/.test(lines[i]) && !/facture|bl|bon|livraison|numero|date|total|ht|ttc|tva/i.test(lines[i]) && lines[i].length > 3) {
        document.getElementById('ach_fournisseur').value = lines[i];
        break;
      }
    }
  }

  // 2. Référence / N° BL
  var refMatch = full.match(/(?:bl|bon\s*de\s*livraison|facture|n[°o]\s*(?:bl|facture)?)\s*[#:]?\s*([\w\/\-\.]{3,})/i);
  if (refMatch) document.getElementById('ach_ref').value = refMatch[1];

  // 3. Essence — matching contre essences connues
  var species = getSpecies();
  var essList = ['AYOUS','ASSAMELA','BILINGA','SAPELLI','IROKO','MOVINGUI','PADOUK','TAIL','FRAKE','OKOUME','NIANGON','DOUSSIE','AZOBE','BETE','KOTO','LIMBA','MAHOGANY','TEAK','MERANTI','KERUING','KAPUR','MERBAU'];
  for (var i = 0; i < species.length; i++) essList.push(species[i].code, species[i].nom);
  for (var i = 0; i < essList.length; i++) {
    var e = essList[i].toUpperCase();
    if (full.toUpperCase().indexOf(e) >= 0) { document.getElementById('ai_essence').value = e; onAchatEssenceChange(); break; }
  }

  // 4. Dimensions — pattern L×l×E (ex: 114*8*2, 114 x 8 x 2, 114x8x2)
  var dimMatch = full.match(/(\d+(?:[.,]\d+)?)\s*[xX×*]\s*(\d+(?:[.,]\d+)?)\s*[xX×*]\s*(\d+(?:[.,]\d+)?)/);
  if (dimMatch) {
    var L = parseFloat(dimMatch[1].replace(',', '.'));
    var l = parseFloat(dimMatch[2].replace(',', '.'));
    var e = parseFloat(dimMatch[3].replace(',', '.'));
    if (L > 100) { document.getElementById('ai_long').value = L; document.getElementById('ai_larg').value = l; document.getElementById('ai_epais').value = e; }
    else { document.getElementById('ai_long').value = L * 100; document.getElementById('ai_larg').value = l * 100; document.getElementById('ai_epais').value = e * 10; }
    calcItemVolLive();
  }

  // 5. Quantité — nombre avant "pièce", "colis", "qté", "quantité", ou premier gros entier isolé
  var qteMatch = full.match(/(?:qte|qté|quantite|quantité|colis|pieces?|pièces?)\s*[#:]?\s*(\d+)/i) || full.match(/\b(\d{2,4})\b/);
  if (qteMatch) document.getElementById('ai_qte').value = qteMatch[1];

  // 6. Type (Rouge/Blanc)
  if (/rouge/i.test(full)) document.getElementById('ai_type').value = 'Rouge';
  else if (/blanc/i.test(full)) document.getElementById('ai_type').value = 'Blanc';

  // 7. N° Colis
  var colisMatch = full.match(/(?:n[°o]\s*(?:colis|col))\s*[#:]?\s*([\w\/\-\.]{3,})/i);
  if (colisMatch) document.getElementById('ai_colis').value = colisMatch[1];

  calcItemVolLive();
  var status = document.getElementById('ach_doc_status');
  if (status) status.textContent = '✅ Données extraites — vérifiez et complétez avant d\'ajouter la ligne';
}

function achatHasMouvements(a) {
  var used = {};
  getProductions().forEach(function(p) {
    (p.sortie_bois || []).forEach(function(sb) { if (sb && sb.code) used[String(sb.code).trim().toLowerCase()] = true; });
    (p.encours || []).forEach(function(e) { if (e && e.code) used[String(e.code).trim().toLowerCase()] = true; });
    (p.lattes || []).forEach(function(l) { if (l && l.code) used[String(l.code).trim().toLowerCase()] = true; });
    (p.plots || []).forEach(function(l) { if (l && l.code) used[String(l.code).trim().toLowerCase()] = true; });
    (p.cp || []).forEach(function(l) { if (l && l.code) used[String(l.code).trim().toLowerCase()] = true; });
    (p.assemblage || []).forEach(function(l) { if (l && l.code) used[String(l.code).trim().toLowerCase()] = true; });
  });
  var items = a.items || [];
  for (var i = 0; i < items.length; i++) {
    var cod = (items[i].colis_number || items[i].code || '').trim().toLowerCase();
    if (cod && used[cod]) return true;
  }
  return false;
}

function deleteAchat(id) {
  var achats = getAchats();
  var a = achats.find(function(x) { return String(x.id) === String(id); });
  if (!a) return;
  if (achatHasMouvements(a)) {
    return toast('Impossible de supprimer : des mouvements de production (sortie bois, en-cours, assemblage) existent sur ce bon. Vous pouvez le modifier mais pas le supprimer.', 'error');
  }
  var nItems = (a.items || []).length;
  var msg = '⚠️ Supprimer cet achat ' + (a.categorie || '') + ' ?\n\n' +
    '• ' + nItems + ' article(s) concerné(s)\n' +
    '• Montant : ' + fmtF(a.montant_total || 0) + '\n' +
    '• Fournisseur : ' + (a.fournisseur || '-') + '\n\n' +
    'Le stock sera impacté si cet achat a déjà été réceptionné.\nConfirmer ?';
  if (!confirm2(msg)) return;
  setAchats(achats.filter(function(x) { return String(x.id) !== String(id); }));
  toast('Achat supprimé');
  renderPage();
}
