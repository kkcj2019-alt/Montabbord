  m += '      <tr><td colSpan="12" style="text-align:center;padding:1.5rem;color:#94a3b8">Aucun article ajouté</td></tr>';
  m += '    </tbody>';
  m += '  </table>';
  m += '</div>';

  // Bottom Buttons
  m += '<div style="display:flex;justify-content:flex-end;gap:0.75rem;padding-top:1rem;border-top:1px solid #f1f5f9">';
  m += '  <button type="button" onclick="closeModal()" style="padding:0.5rem 1.25rem;border:1px solid #cbd5e1;border-radius:20px;background:#fff;color:#475569;font-weight:600;font-size:0.85rem;cursor:pointer">Annuler</button>';
  m += '  <button type="submit" style="padding:0.5rem 1.5rem;border:none;border-radius:20px;background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;font-weight:700;font-size:0.85rem;cursor:pointer;box-shadow:0 4px 12px rgba(249,115,22,0.3)">Enregistrer</button>';
  m += '</div>';

  m += '</form></div>';

  openModal(m);
}


function onLGlobInput() {
  var lglob = parseFloat((document.getElementById('ai_lglob') || {}).value || 0);
  var qte = parseFloat((document.getElementById('ai_qte') || {}).value || 1);
  var largEl = document.getElementById('ai_larg');
  if (lglob > 0 && qte > 0 && largEl) {
    var largMoy = lglob / qte;
    largEl.value = largMoy.toFixed(1);
  }
  calcItemVolLive();
}

function onLargInput() {
  var larg = parseFloat((document.getElementById('ai_larg') || {}).value || 0);
  var qte = parseFloat((document.getElementById('ai_qte') || {}).value || 1);
  var lglobEl = document.getElementById('ai_lglob');
  if (larg > 0 && qte > 0 && lglobEl) {
    lglobEl.value = (larg * qte).toFixed(1);
  }
  calcItemVolLive();
}

function calcItemVolLive() {
  var qte = parseFloat((document.getElementById('ai_qte') || {}).value || 0);
  var L = parseFloat((document.getElementById('ai_long') || {}).value || 0);
  var l = parseFloat((document.getElementById('ai_larg') || {}).value || 0);
  var e = parseFloat((document.getElementById('ai_epais') || {}).value || 0);

  var vol = 0;
  if (L > 0 && l > 0 && e > 0) {
    vol = (L * l * e / 1000000) * qte;
  }
  var volEl = document.getElementById('ai_vol');
  if (volEl) volEl.value = vol.toFixed(4);
}


function addAchatItemLine(category) {
  var item = {};
  if (category === 'raw-materials') {
    var colis = (document.getElementById('ai_colis') || {}).value || 'COL-' + Date.now().toString().slice(-4);
    var qte = parseFloat((document.getElementById('ai_qte') || {}).value || 1);
    var L = parseFloat((document.getElementById('ai_long') || {}).value || 0);
    var l = parseFloat((document.getElementById('ai_larg') || {}).value || 0);
    var lglob = parseFloat((document.getElementById('ai_lglob') || {}).value || 0);
    var e = parseFloat((document.getElementById('ai_epais') || {}).value || 0);
    var vol = parseFloat((document.getElementById('ai_vol') || {}).value || 0);
    var essence = (document.getElementById('ai_essence') || {}).value || 'AY';
    var type = (document.getElementById('ai_type') || {}).value || 'Rouge';
    var zone = (document.getElementById('ai_zone') || {}).value || '';
    var obs = (document.getElementById('ai_obs') || {}).value || '';

    // If width l is 0 but lglob is entered, compute average width = lglob / qte
    if ((!l || l === 0) && lglob > 0 && qte > 0) {
      l = parseFloat((lglob / qte).toFixed(1));
    }
    // Recalculate volume with effective average width l
    if (L > 0 && l > 0 && e > 0 && (!vol || vol === 0)) {
      vol = (L * l * e / 1000000) * qte;
    }

    item = { colis_number: colis, quantity: qte, length: L, width: l, lglob: lglob, thickness: e, volume: vol, essence: essence, type: type, zone: zone, obs: obs };
  } else if (category === 'consumables' || category === 'consumable') {
    var code = (document.getElementById('ai_code') || {}).value || 'ART-' + Date.now().toString().slice(-4);
    var des = (document.getElementById('ai_designation') || {}).value || 'Consommable';
    var qte = parseFloat((document.getElementById('ai_qte') || {}).value || 1);
    var pu = parseFloat((document.getElementById('ai_pu') || {}).value || 0);
    var obs = (document.getElementById('ai_obs') || {}).value || '';

    item = { code: code, designation: des, quantity: qte, unit_price: pu, total_price: qte * pu, obs: obs };
  } else {
    var code = (document.getElementById('ai_code') || {}).value || 'ART-' + Date.now().toString().slice(-4);
    var des = (document.getElementById('ai_designation') || {}).value || 'Article';
    var qte = parseFloat((document.getElementById('ai_qte') || {}).value || 1);
    var pu = parseFloat((document.getElementById('ai_pu') || {}).value || 0);
    var obs = (document.getElementById('ai_obs') || {}).value || '';

    item = { code: code, designation: des, quantity: qte, unit_price: pu, total_price: qte * pu, obs: obs };
  }

  _tempAchatItems.push(item);
  renderAchatItemsTable(category);
}

function removeAchatItemLine(idx, category) {
  _tempAchatItems.splice(idx, 1);
  renderAchatItemsTable(category);
}

function renderAchatItemsTable(category) {
  var tbody = document.getElementById('achatItemsTableBody');
  if (!tbody) return;
  if (_tempAchatItems.length === 0) {
    tbody.innerHTML = '<tr><td colSpan="12" style="text-align:center;padding:1.5rem;color:#94a3b8">Aucun article ajouté</td></tr>';
    return;
  }

  var h = '';
  _tempAchatItems.forEach(function(it, i) {
    h += '<tr style="border-bottom:1px solid #f1f5f9">';
    if (category === 'raw-materials') {
      h += '<td style="padding:0.5rem;font-weight:600">' + escH(it.colis_number) + '</td>';
      h += '<td style="padding:0.5rem;text-align:right">' + it.quantity + '</td>';
      h += '<td style="padding:0.5rem;text-align:right">' + it.length + '</td>';
      h += '<td style="padding:0.5rem;text-align:right">' + it.width + '</td>';
      h += '<td style="padding:0.5rem;text-align:right">' + escH(it.lglob || '-') + '</td>';
      h += '<td style="padding:0.5rem;text-align:right">' + it.thickness + '</td>';
      h += '<td style="padding:0.5rem;text-align:right;font-weight:700;color:#ea580c">' + parseFloat(it.volume).toFixed(4) + '</td>';
      h += '<td style="padding:0.5rem">' + escH(it.essence) + '</td>';
      h += '<td style="padding:0.5rem">' + escH(it.type) + '</td>';
      h += '<td style="padding:0.5rem">' + escH(it.zone || '-') + '</td>';
      h += '<td style="padding:0.5rem">' + escH(it.obs || '-') + '</td>';
    } else if (category === 'consumable' || category === 'consumables') {
      h += '<td style="padding:0.5rem;font-weight:600">' + escH(it.code) + '</td>';
      h += '<td style="padding:0.5rem">' + escH(it.designation) + '</td>';
      h += '<td style="padding:0.5rem;text-align:right">' + it.quantity + '</td>';
      h += '<td style="padding:0.5rem;text-align:right">' + fmt(it.unit_price) + ' F</td>';
      h += '<td style="padding:0.5rem;text-align:right;font-weight:700">' + fmt(it.total_price) + ' F</td>';
      h += '<td style="padding:0.5rem">' + escH(it.obs || '-') + '</td>';
    } else {
    h += '<td style="padding:0.5rem;text-align:center"><button type="button" onclick="removeAchatItemLine(' + i + ',\'' + category + '\')" style="background:none;border:none;color:#ef4444;cursor:pointer">🗑️</button></td>';
    h += '</tr>';
  }
  });
  tbody.innerHTML = h;
}



function calcAchatVol() {
  var qte = parseFloat((document.getElementById('ach_qte') || {}).value || 0);
  var L = parseFloat((document.getElementById('ach_long') || {}).value || 0);
  var l = parseFloat((document.getElementById('ach_larg') || {}).value || 0);
  var e = parseFloat((document.getElementById('ach_epais') || {}).value || 0);
  var volEl = document.getElementById('ach_vol');
  if (volEl && L > 0 && l > 0 && e > 0) {
    var v = (L * l * (e / 10) / 1000000) * qte;
    volEl.value = v.toFixed(4);
  }
}

function calcAchatTotal() {
  var qte = parseFloat((document.getElementById('ach_qte') || {}).value || 0);
  var pu = parseFloat((document.getElementById('ach_prix_unit') || {}).value || 0);
  var mtEl = document.getElementById('ach_montant');
  if (mtEl && qte > 0 && pu > 0) {
    mtEl.value = (qte * pu).toString();
  }
}

function saveAchatByCategory(e, category) {
  e.preventDefault();
  var achats = getAchats();

  var ref = (document.getElementById('ach_ref') || {}).value || '';
  var date = (document.getElementById('ach_date') || {}).value || today();
  var fournisseur = (document.getElementById('ach_fournisseur') || {}).value || '';
  var receiver = (document.getElementById('ach_receiver') || {}).value || 'Magasinier';
  var acheteur = (document.getElementById('ach_acheteur') || {}).value || '';

  if (_tempAchatItems.length === 0) {
    return toast('Veuillez ajouter au moins un article en cliquant sur le bouton "+"', 'error');
  }

  var totalVol = _tempAchatItems.reduce(function(acc, item) { return acc + (parseFloat(item.volume) || 0); }, 0);
  var totalAmount = _tempAchatItems.reduce(function(acc, item) { return acc + (parseFloat(item.total_price) || 0); }, 0);

  var newAchat = {
    id: Date.now(),
    category: category,
    type: category,
    date: date,
    reference: ref,
    fournisseur: fournisseur,
    receiver_name: receiver,
    acheteur: acheteur,
    items: _tempAchatItems.slice(),
    item_count: _tempAchatItems.length,
    total_volume: totalVol,
    montant_total: totalAmount,
    created_at: today()
  };

  achats.unshift(newAchat);
  setAchats(achats);

  // Sync to respective stock tables
  if (category === 'raw-materials') {
    var rawStock = getStockRaw();
    _tempAchatItems.forEach(function(it) {
      rawStock.unshift({
        id: Date.now() + Math.random(),
        code: it.colis_number,
        colis_number: it.colis_number,
        designation: it.essence + ' (' + it.type + ')',
        essence: it.essence,
        type: it.type,
        fournisseur: fournisseur,
        longueur: it.length,
        largeur: it.width,
        epaisseur: it.thickness,
        volume: it.volume,
        quantite: it.quantity,
        zone: it.zone,
        created_at: today()
      });
    });
    setStockRaw(rawStock);
  } else if (category === 'semi') {
    var semiStock = getStockSemi();
    _tempAchatItems.forEach(function(it) {
      semiStock.unshift({
        id: Date.now() + Math.random(),
        code: it.code,
        designation: it.designation,
        fournisseur: fournisseur,
        quantite: it.quantity,
        prix_unitaire: it.unit_price,
        created_at: today()
      });
    });
    setStockSemi(semiStock);
  } else if (category === 'finished') {
    var finStock = getStockFinished();
    _tempAchatItems.forEach(function(it) {
      finStock.unshift({
        id: Date.now() + Math.random(),
        code: it.code,
        designation: it.designation,
        fournisseur: fournisseur,
        quantite: it.quantity,
        prix_unitaire: it.unit_price,
        created_at: today()
      });
    });
    setStockFinished(finStock);
  } else if (category === 'merchandises') {
    var merchStock = getStockMerch();
    _tempAchatItems.forEach(function(it) {
      merchStock.unshift({
        id: Date.now() + Math.random(),
        code: it.code,
        designation: it.designation,
        fournisseur: fournisseur,
        quantite: it.quantity,
        prix_unitaire: it.unit_price,
        created_at: today()
      });
    });
    setStockMerch(merchStock);
  } else if (category === 'consumables') {
    var consumStock = getStockConsum();
    _tempAchatItems.forEach(function(it) {
      consumStock.unshift({
        id: Date.now() + Math.random(),
        code: it.code,
        designation: it.designation,
        fournisseur: fournisseur,
        quantite: it.quantity,
        prix_unitaire: it.unit_price,
        created_at: today()
      });
    });
    setStockConsum(consumStock);
  }

  toast('Enregistrement réussi !', 'success');
  closeModal();
  renderPage();
}

function deleteAchat(id) {
  if (confirm('Êtes-vous sûr de vouloir supprimer cet achat ?')) {
    var achats = getAchats().filter(function(a) { return String(a.id) !== String(id); });
    setAchats(achats);
    renderPage();
  }
}
