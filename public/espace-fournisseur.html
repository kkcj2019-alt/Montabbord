<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Espace fournisseur</title>
<style>
  :root{--navy:#0b3a6f;--teal:#0e7490;--gold:#ecc95f;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f4f7fb;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,Segoe UI,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-text-size-adjust:100%}
  button,input,select,textarea{font-family:inherit}
  .fxTop{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:linear-gradient(120deg,#071a33,#0b3a6f 58%,#0e7490);color:#fff;box-shadow:0 6px 22px rgba(2,20,45,.28)}
  .fxTop img{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:12px;padding:4px;display:block;flex-shrink:0}
  .fxMainBtn{width:38px;height:38px;border-radius:11px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.13);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;transition:background .18s ease,transform .18s ease}
  .fxMainBtn:hover{background:rgba(255,255,255,.26);transform:translateY(-1px)}
  .fxMainBtn:active{transform:scale(.94)}
  @media(max-width:640px){.fxMainBtn{width:34px;height:34px}}
  .fxBrand{flex:1;min-width:0}
  .fxBrand b{display:block;font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fxBrand span{display:block;font-size:10.5px;color:#cbd5e1;margin-top:2px}
  .fxBtn{border:none;border-radius:10px;padding:9px 13px;font-size:12px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .fxBtn.primary{background:linear-gradient(135deg,#ecc95f,#f6df9a);color:#0b3a6f}
  .fxBtn.dark{background:#0b3a6f;color:#fff}
  .fxBtn.ghost{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0}
  .fxBtn.gold{background:linear-gradient(135deg,#ecc95f,#f6df9a);color:#0b3a6f}
  .fxBtn.dang{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
  .fxBtn.sm{padding:7px 11px;font-size:11.5px}
  .fxWrap{max-width:1100px;margin:0 auto;padding:16px 14px calc(24px + env(safe-area-inset-bottom,0px))}
  .fxCard{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 26px rgba(15,23,42,.06);padding:16px;margin-bottom:14px}
  .fxCard h2{margin:0 0 4px;font-size:16px;font-weight:900}
  .fxCard h3{margin:0 0 6px;font-size:13.5px;font-weight:900}
  .fxNote{font-size:11.5px;color:var(--muted);line-height:1.5}
  .fxHero{background:linear-gradient(135deg,#0b3a6f,#1b5fa8 60%,#0e7490);color:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 14px 34px rgba(2,20,45,.2)}
  .fxHero h1{margin:0 0 4px;font-size:20px;font-weight:900}
  .fxHero p{margin:0;font-size:12.5px;color:#dbeafe;line-height:1.5}
  .fxTabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 4px 16px rgba(15,23,42,.05)}
  .fxTab{border:none;background:transparent;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:800;color:#475569;cursor:pointer;white-space:nowrap}
  .fxTab.on{background:linear-gradient(135deg,#0b3a6f,#0e7490);color:#fff;box-shadow:0 6px 16px rgba(11,58,111,.25)}
  .fxGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .fxItem{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff}
  .fxItem .t{font-size:13px;font-weight:900}
  .fxItem .m{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
  .fxBadge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:900;margin-left:6px;vertical-align:middle}
  .b-new{background:#e0f2fe;color:#075985}.b-wait{background:#fef3c7;color:#92400e}.b-ok{background:#dcfce7;color:#166534}.b-bad{background:#fee2e2;color:#b91c1c}.b-gray{background:#f1f5f9;color:#475569}
  .fxTable{width:100%;border-collapse:collapse;font-size:12px}
  .fxTable th{background:#f8fafc;color:#475569;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  .fxTable td{padding:7px 8px;border-bottom:1px solid #f1f5f9;vertical-align:top}
  .fxTable td.num,.fxTable th.num{text-align:right;white-space:nowrap}
  .fxThread{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:8px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;margin:8px 0}
  .fxMsg{max-width:84%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.45}
  .fxMsg.mine{align-self:flex-end;background:linear-gradient(135deg,#0b3a6f,#0e7490);color:#fff;border-bottom-right-radius:4px}
  .fxMsg.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .fxMsg .who{font-size:9.5px;font-weight:900;opacity:.8;margin-bottom:2px;text-transform:uppercase}
  .fxMsg .at{font-size:9px;opacity:.65;margin-top:3px}
  .fxEmpty{padding:22px 10px;text-align:center;color:var(--muted);font-size:12.5px}
  .fxField label{display:block;font-size:10.5px;font-weight:900;color:#475569;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .fxField input,.fxField textarea,.fxField select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px;outline:none;background:#fff}
  .fxField textarea{min-height:70px;resize:vertical}
  .fxErr{color:var(--bad);font-size:12px;font-weight:800;min-height:16px}
  .fxOk{color:var(--ok);font-size:12px;font-weight:800;min-height:16px}
  .fxAuth{max-width:420px;margin:24px auto}
  .fxAuthTabs{display:flex;gap:4px;background:#e8eef7;padding:4px;border-radius:10px;margin-bottom:12px}
  .fxAuthTabs button{flex:1;border:none;background:transparent;padding:8px;border-radius:8px;font-size:12.5px;font-weight:800;color:#475569;cursor:pointer}
  .fxAuthTabs button.on{background:#fff;color:var(--navy);box-shadow:0 3px 10px rgba(15,23,42,.1)}
  .fxStat{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:900;border:1px solid transparent}
  .fxStat.on{background:#dcfce7;color:#166534;border-color:#bbf7d0}
  .fxStat.off{background:#fef3c7;color:#92400e;border-color:#fde68a}
  @media(max-width:640px){
    .fxWrap{padding:12px}
    .fxGrid{grid-template-columns:1fr}
    .fxTabs{gap:4px;overflow-x:auto;flex-wrap:nowrap}
    .fxTab{padding:8px 10px;font-size:12px}
    .fxTable th:nth-child(2),.fxTable td:nth-child(2){display:none}
    .fxTop{padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px}
    .fxTop img{width:40px;height:40px}
    .fxBrand b{font-size:13.5px}
  }
</style>
</head>
<body>
<header class="fxTop">
  <img id="fxLogo" src="logo-192.png" alt="">
  <div class="fxBrand"><b id="fxNom">Espace fournisseur</b><span>Commandes, livraisons, factures et messages</span></div>
  <span id="fxPresence" class="fxStat off">Service achats hors ligne</span>
  <button id="fxMainBtn" class="fxMainBtn" onclick="window.fxGoMain()" title="Retour à l'application principale" aria-label="Retour à l'application principale"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></button>
</header>
<div class="fxWrap" id="fxApp"><div class="fxCard"><div class="fxEmpty">Chargement…</div></div></div>
<script>
(function () {
  'use strict';
  var API = '/api/sync';
  var UID = '';
  try { UID = (new URLSearchParams(location.search).get('uid') || localStorage.getItem('mdb_fournisseurUid') || '').replace(/^["']+|["']+$/g, '').trim(); } catch (e) {}
  if (UID) { try { localStorage.setItem('mdb_fournisseurUid', UID); } catch (eU) {} }
  var S = {
    ent: {}, acc: null, four: null, bcs: [], dettes: [], threads: [], presence: null,
    accounts: {}, fournisseurs: [],
    tab: 'commandes', thread: null, authMode: 'login', busy: false, openBc: ''
  };
  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { try { return new Intl.NumberFormat('fr-FR').format(Math.round(parseFloat(n) || 0)) + ' F'; } catch (e) { return String(Math.round(parseFloat(n) || 0)) + ' F'; } }
  function uid() { return 'FX' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase(); }
  function fmtDT(t) { if (!t) return '-'; try { return new Date(t).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return '-'; } }
  function fmtD(t) { if (!t) return '-'; try { var d = new Date(t); if (isNaN(d.getTime())) return String(t); return d.toLocaleDateString('fr-FR'); } catch (e) { return String(t); } }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function norm(s) { return String(s == null ? '' : s).trim().toLowerCase(); }

  async function sha256(txt) {
    try {
      var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('00' + b.toString(16)).slice(-2); }).join('');
    } catch (e) { return ''; }
  }
  function randSalt() { return Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10); }

  async function syncGet(key) {
    if (!UID) return null;
    try {
      var r = await fetch(API + '?uid=' + encodeURIComponent(UID) + '&cle=' + encodeURIComponent(key) + '&t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return null;
      var j = await r.json();
      var v = (j && j.data && j.data[key] !== undefined) ? j.data[key] : null;
      if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return v; } }
      return v;
    } catch (e) { return null; }
  }
  async function syncSet(key, val) {
    if (!UID) throw new Error('uid');
    var body = { uid: UID, updates: {} }; body.updates[key] = val;
    var r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('sync');
    return true;
  }

  function statutBadge(s) {
    s = String(s || '').toLowerCase();
    if (s === 'envoye' || s === 'envoyé') return '<span class="fxBadge b-new">Envoyée</span>';
    if (s === 'confirme' || s === 'confirmé') return '<span class="fxBadge b-ok">Confirmée</span>';
    if (s === 'termine' || s === 'terminé') return '<span class="fxBadge b-gray">Terminée</span>';
    if (s === 'annule' || s === 'annulé') return '<span class="fxBadge b-bad">Annulée</span>';
    if (s === 'brouillon') return '<span class="fxBadge b-gray">Brouillon</span>';
    return '<span class="fxBadge b-gray">' + esc(s || '-') + '</span>';
  }
  function statutDette(d) {
    var m = parseFloat(d.montant) || 0;
    var p = parseFloat(d.payee != null ? d.payee : d.montantPaye) || 0;
    if (d.statut === 'payee' || d.statut === 'payée' || (m > 0 && p >= m)) return '<span class="fxBadge b-ok">Payée</span>';
    if (p > 0) return '<span class="fxBadge b-wait">Partielle</span>';
    return '<span class="fxBadge b-bad">À payer</span>';
  }

  function myBcs() {
    if (!S.acc || !S.acc.fournisseurId) return [];
    return (S.bcs || []).filter(function (b) {
      return b && String(b.fournisseurId) === String(S.acc.fournisseurId) && String(b.statut || '') !== 'brouillon';
    }).sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
  }
  function myDettes() {
    if (!S.four) return [];
    var n = norm(S.four.nom);
    return (S.dettes || []).filter(function (d) {
      return d && norm(d.fournisseur) === n;
    }).sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
  }
  function myThreads() {
    if (!S.acc) return [];
    return (S.threads || []).filter(function (t) { return t && (t.fournisseurId === S.acc.fournisseurId || t.email === S.acc.email); })
      .sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
  }

  /* ---------------- Connexion ---------------- */
  async function resolveUid() {
    if (UID) return true;
    var input = el('fxEntId');
    var v = (input && input.value || '').trim();
    if (!v) { if (el('fxEntErr')) el('fxEntErr').textContent = 'Identifiant entreprise requis.'; return false; }
    try {
      var r = await fetch('/api/enterprise?identifiant=' + encodeURIComponent(v));
      var j = await r.json();
      if (!j || !j.found || !j.enterprise || !j.enterprise.id) { if (el('fxEntErr')) el('fxEntErr').textContent = 'Entreprise introuvable.'; return false; }
      UID = j.enterprise.id;
      try { localStorage.setItem('mdb_fournisseurUid', UID); } catch (e) {}
      try { history.replaceState(null, '', '?uid=' + encodeURIComponent(UID)); } catch (e2) {}
      await bootData();
      return true;
    } catch (e) { if (el('fxEntErr')) el('fxEntErr').textContent = 'Connexion impossible.'; return false; }
  }

  async function bootData() {
    if (!UID) return;
    var pub = await syncGet('mdb_fournisseurPublic');
    if (pub && typeof pub === 'object') S.ent = pub;
    else {
      var ent = await syncGet('mdb_entreprise');
      if (ent && typeof ent === 'object') S.ent = { nom: ent.nom || '', logo: ent.logo || '', telephone: ent.telephone || ent.tel || '', email: ent.email || '', adresse: ent.adresse || '' };
    }
    var accounts = (await syncGet('mdb_fournisseurAccounts')) || {};
    S.accounts = (accounts && typeof accounts === 'object') ? accounts : {};
    S.bcs = (await syncGet('mdb_bonsCommandeFournisseurs')) || [];
    S.dettes = (await syncGet('mdb_dettesFournisseurs')) || [];
    S.threads = (await syncGet('mdb_fournisseurThreads')) || [];
    S.presence = (await syncGet('mdb_fournisseurPresence')) || null;
    var fournisseurs = (await syncGet('mdb_fournisseurs')) || [];
    S.fournisseurs = Array.isArray(fournisseurs) ? fournisseurs : [];
    try {
      var mail = localStorage.getItem('mdb_fournisseur_session_' + UID);
      if (mail && S.accounts[mail] && S.accounts[mail].actif !== false) { S.acc = S.accounts[mail]; S.acc.email = S.acc.email || mail; }
    } catch (e) {}
    if (S.acc) S.four = S.fournisseurs.filter(function (f) { return f && String(f.id) === String(S.acc.fournisseurId); })[0] || null;
    renderTop();
  }

  function renderTop() {
    try { var _fm = el('fxMainBtn'); if (_fm) _fm.style.display = S.acc ? 'inline-flex' : 'none'; } catch (eFM) {}
    var nom = S.ent.nom || 'Espace fournisseur';
    var logo = S.ent.logo || 'logo-192.png';
    if (el('fxLogo')) el('fxLogo').src = logo;
    if (el('fxNom')) el('fxNom').textContent = nom + (S.acc ? ' — Fournisseur' : '');
    var online = !!(S.presence && S.presence.dispo !== false && (Date.now() - (S.presence.at || 0) < 5 * 60 * 1000));
    var st = el('fxPresence');
    if (st) { st.className = 'fxStat ' + (online ? 'on' : 'off'); st.textContent = online ? 'Service achats disponible' : 'Service achats hors ligne'; }
  }

  function renderAuth(msg) {
    var h = '<div class="fxCard fxAuth"><h2>Espace fournisseur</h2><div class="fxNote" style="margin-bottom:12px">Accédez à vos commandes, livraisons, factures et échangez avec le service achats.</div>';
    if (!UID) {
      h += '<div class="fxField" style="margin-bottom:10px"><label>Identifiant entreprise</label><input id="fxEntId" placeholder="Ex : MONTABBORD"><div class="fxErr" id="fxEntErr"></div></div>'
        + '<button class="fxBtn dark" id="fxEntGo" style="width:100%">Continuer</button></div>';
    } else {
      h += '<div class="fxAuthTabs"><button class="on">Connexion</button></div>'
        + '<div class="fxField" style="margin-bottom:10px"><label>Email</label><input id="fxLoginEmail" type="email" autocomplete="username" placeholder="vous@exemple.com"></div>'
        + '<div class="fxField" style="margin-bottom:10px"><label>Mot de passe</label><input id="fxLoginPass" type="password" autocomplete="current-password"></div>'
        + '<button class="fxBtn dark" id="fxLoginBtn" style="width:100%">Se connecter</button>'
        + '<div class="fxErr" id="fxLoginErr">' + esc(msg || '') + '</div>'
        + '<div class="fxNote" style="margin-top:10px">Votre compte est créé par le service achats. Mot de passe oublié : contactez-nous (coordonnées ci-dessous).</div>'
        + '<div class="fxNote" style="margin-top:10px">' + (S.ent.telephone ? '📞 ' + esc(S.ent.telephone) + ' · ' : '') + (S.ent.email ? '✉️ ' + esc(S.ent.email) : '') + '</div></div>';
    }
    el('fxApp').innerHTML = h;
    if (!UID) {
      el('fxEntGo').onclick = async function () { if (await resolveUid()) renderAuth(); };
      var i = el('fxEntId'); if (i) i.addEventListener('keydown', function (e) { if (e.key === 'Enter') el('fxEntGo').click(); });
    } else {
      el('fxLoginBtn').onclick = doLogin;
      var p = el('fxLoginPass'); if (p) p.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
    }
  }

  async function doLogin() {
    var email = (el('fxLoginEmail').value || '').trim().toLowerCase();
    var pass = el('fxLoginPass').value || '';
    var err = el('fxLoginErr');
    if (!email || !pass) { err.textContent = 'Email et mot de passe requis.'; return; }
    err.textContent = 'Connexion…';
    var c = S.accounts[email];
    if (!c) { err.textContent = 'Aucun compte fournisseur avec cet email.'; return; }
    if (c.actif === false) { err.textContent = 'Compte désactivé : contactez le service achats.'; return; }
    var hash = await sha256((c.salt || '') + '|' + pass);
    if (!hash || hash !== c.hash) { err.textContent = 'Mot de passe incorrect.'; return; }
    S.acc = c; S.acc.email = S.acc.email || email;
    S.four = S.fournisseurs.filter(function (f) { return f && String(f.id) === String(c.fournisseurId); })[0] || null;
    try { localStorage.setItem('mdb_fournisseur_session_' + UID, email); } catch (e) {}
    S.tab = 'commandes';
    renderTop(); renderApp();
  }
  function logout() {
    S.acc = null; S.four = null;
    try { localStorage.removeItem('mdb_fournisseur_session_' + UID); } catch (e) {}
    renderTop(); renderAuth();
  }

  /* ---------------- Application ---------------- */
  function renderApp() {
    if (!S.acc) { renderAuth(); return; }
    if (!S.four) {
      el('fxApp').innerHTML = '<div class="fxCard"><h2>Compte non rattaché</h2><div class="fxNote">Votre compte n’est lié à aucune fiche fournisseur. Contactez le service achats pour corriger cela.</div><div style="margin-top:12px"><button class="fxBtn ghost" onclick="fxLogout()">Se déconnecter</button></div></div>';
      return;
    }
    var h = '<div class="fxHero"><h1>Bonjour ' + esc((S.four.nom || '').split(' ')[0] || '') + '</h1>'
      + '<p>Suivez vos commandes, déclarez vos livraisons, consultez vos factures et échangez avec ' + esc(S.ent.nom || 'notre service achats') + '.</p></div>';
    var tabs = [['commandes', 'Commandes'], ['livraisons', 'Livraisons'], ['dettes', 'Factures & dettes'], ['messages', 'Messages']];
    h += '<div class="fxTabs">';
    tabs.forEach(function (t) { h += '<button class="fxTab ' + (S.tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>'; });
    h += '<button class="fxBtn ghost sm" style="margin-left:auto" onclick="fxLogout()">Déconnexion</button></div><div id="fxTabBody"></div>';
    el('fxApp').innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll('.fxTab'), function (b) { b.onclick = function () { S.tab = b.getAttribute('data-tab'); S.thread = null; renderApp(); }; });
    var body = el('fxTabBody');
    if (S.tab === 'commandes') { body.innerHTML = tabCommandes(); bindCommandes(); }
    else if (S.tab === 'livraisons') { body.innerHTML = tabLivraisons(); bindLivraisons(); }
    else if (S.tab === 'dettes') body.innerHTML = tabDettes();
    else { body.innerHTML = tabMessages(); bindMessages(); }
  }

  function lignesTable(bc) {
    var lignes = bc.lignes || [];
    var h = '<table class="fxTable"><thead><tr><th>Désignation</th><th>Unité</th><th class="num">Qté</th><th class="num">P.U</th><th class="num">Montant</th></tr></thead><tbody>';
    if (!lignes.length) h += '<tr><td colspan="5" style="color:#94a3b8">Aucune ligne</td></tr>';
    lignes.forEach(function (l) {
      if (!l) return;
      if (l.isTitle) {
        h += '<tr><td colspan="5" style="font-weight:800;background:#f8fafc">' + esc(l.titre || 'Sans titre') + '</td></tr>';
        (l.sousLignes || []).forEach(function (sl) {
          h += '<tr><td style="padding-left:16px">' + esc(sl.designation || '-') + '</td><td>' + esc(sl.unite || '-') + '</td><td class="num">' + (sl.qte || '-') + '</td><td class="num">' + (sl.prixUnitaire ? money(sl.prixUnitaire) : '-') + '</td><td class="num">' + money(sl.montant || 0) + '</td></tr>';
        });
      } else {
        h += '<tr><td>' + esc(l.designation || l.titre || '-') + '</td><td>' + esc(l.unite || '-') + '</td><td class="num">' + (l.qte || '-') + '</td><td class="num">' + (l.prixUnitaire ? money(l.prixUnitaire) : '-') + '</td><td class="num">' + money(l.montant || 0) + '</td></tr>';
      }
    });
    h += '</tbody></table>';
    h += '<div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end;margin-top:8px;font-size:12px">'
      + '<span>Total HT : <b>' + money(bc.totalHT || 0) + '</b></span>'
      + (bc.tvaActive ? '<span>TVA ' + (bc.tauxTva || 18) + ' % : <b>' + money(bc.totalTVA || 0) + '</b></span>' : '')
      + '<span>Total TTC : <b style="color:#0b3a6f">' + money(bc.totalTTC || bc.totalHT || 0) + '</b></span></div>';
    return h;
  }

  function bcCard(bc, mode) {
    var open = S.openBc === bc.id;
    var h = '<div class="fxItem"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start">'
      + '<div><div class="t">' + esc(bc.numero || 'Commande') + statutBadge(bc.statut) + '</div>'
      + '<div class="m">' + fmtD(bc.date) + (bc.delaiLivraison ? ' · Livraison : ' + esc(bc.delaiLivraison) : '') + (bc.reference ? ' · Réf : ' + esc(bc.reference) : '') + '</div>'
      + (bc.objet ? '<div class="m">Objet : ' + esc(bc.objet) + '</div>' : '') + '</div>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap">'
      + '<button class="fxBtn ghost sm" data-bc="' + esc(bc.id) + '" data-act="toggle">' + (open ? 'Masquer le détail' : 'Voir le détail') + '</button>'
      + (mode === 'commandes' && String(bc.statut) === 'envoye' ? '<button class="fxBtn primary sm" data-bc="' + esc(bc.id) + '" data-act="confirm">Confirmer la commande</button>' : '')
      + (mode === 'livraisons' && (String(bc.statut) === 'confirme' || String(bc.statut) === 'envoye') ? '<button class="fxBtn gold sm" data-bc="' + esc(bc.id) + '" data-act="deliver">Déclarer la livraison</button>' : '')
      + '</div></div>';
    if (open) {
      h += '<div style="margin-top:10px">' + lignesTable(bc);
      if (bc.conditions) h += '<div class="m" style="margin-top:6px">Règlement : ' + esc(bc.conditions) + '</div>';
      if (Array.isArray(bc.livraisonsDeclarees) && bc.livraisonsDeclarees.length) {
        h += '<div class="m" style="margin-top:8px"><b>Livraisons déclarées :</b><ul style="margin:4px 0 0 16px;padding:0">';
        bc.livraisonsDeclarees.forEach(function (l) { h += '<li>' + fmtDT(l.at) + (l.note ? ' — ' + esc(l.note) : '') + '</li>'; });
        h += '</ul></div>';
      }
      h += '</div>';
    }
    return h + '</div>';
  }

  function tabCommandes() {
    var list = myBcs();
    var h = '<div class="fxCard"><h2>Mes commandes (' + list.length + ')</h2><div class="fxNote" style="margin-bottom:10px">Les bons de commande que ' + esc(S.ent.nom || 'nous') + ' vous a adressés. Confirmez la commande pour nous prévenir de sa prise en charge.</div>';
    if (!list.length) return h + '<div class="fxEmpty">Aucune commande pour le moment.</div></div>';
    h += '<div class="fxGrid">';
    list.forEach(function (bc) { h += bcCard(bc, 'commandes'); });
    return h + '</div></div>';
  }

  function tabLivraisons() {
    var list = myBcs().filter(function (b) { return ['confirme', 'termine'].indexOf(String(b.statut)) !== -1; });
    var declares = [];
    myBcs().forEach(function (b) { (b.livraisonsDeclarees || []).forEach(function (l) { declares.push({ bc: b, l: l }); }); });
    var h = '<div class="fxCard"><h2>Livraisons</h2><div class="fxNote" style="margin-bottom:10px">Commandes confirmées à livrer. « Déclarer la livraison » prévient le service achats (date + précision) ; les bons de livraison officiels restent gérés par nos services.</div>';
    if (!list.length) h += '<div class="fxEmpty">Aucune commande confirmée à livrer pour le moment.</div>';
    else { h += '<div class="fxGrid">'; list.forEach(function (bc) { h += bcCard(bc, 'livraisons'); }); h += '</div>'; }
    h += '</div>';
    if (declares.length) {
      h += '<div class="fxCard"><h2>Historique des livraisons déclarées (' + declares.length + ')</h2><div style="margin-top:8px">';
      declares.sort(function (a, b) { return (b.l.at || 0) - (a.l.at || 0); }).forEach(function (x) {
        h += '<div class="fxItem" style="margin-bottom:8px"><div class="t">' + esc(x.bc.numero || 'Commande') + '</div><div class="m">' + fmtDT(x.l.at) + (x.l.note ? ' — ' + esc(x.l.note) : '') + '</div></div>';
      });
      h += '</div></div>';
    }
    return h;
  }

  function tabDettes() {
    var list = myDettes();
    var total = 0, paye = 0;
    list.forEach(function (d) { total += parseFloat(d.montant) || 0; paye += parseFloat(d.payee != null ? d.payee : d.montantPaye) || 0; });
    var h = '<div class="fxCard"><h2>Factures & dettes (' + list.length + ')</h2>'
      + '<div class="fxNote" style="margin-bottom:10px">Situation enregistrée par nos services. Un écart ? Écrivez-nous depuis l’onglet Messages.</div>'
      + '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">'
      + '<span class="fxBadge b-gray">Total : ' + money(total) + '</span>'
      + '<span class="fxBadge b-ok">Réglé : ' + money(paye) + '</span>'
      + '<span class="fxBadge b-bad">Reste : ' + money(Math.max(0, total - paye)) + '</span></div>';
    if (!list.length) return h + '<div class="fxEmpty">Aucune facture enregistrée à votre nom.</div></div>';
    h += '<table class="fxTable"><thead><tr><th>Date</th><th>Description</th><th class="num">Montant</th><th class="num">Réglé</th><th>Statut</th></tr></thead><tbody>';
    list.forEach(function (d) {
      var m = parseFloat(d.montant) || 0;
      var p = parseFloat(d.payee != null ? d.payee : d.montantPaye) || 0;
      h += '<tr><td>' + fmtD(d.date) + '</td><td>' + esc(d.description || '-') + '</td><td class="num">' + money(m) + '</td><td class="num">' + money(p) + '</td><td>' + statutDette(d) + '</td></tr>';
    });
    return h + '</tbody></table></div>';
  }

  function tabMessages() {
    if (S.thread) {
      var t = myThreads().filter(function (x) { return x.id === S.thread; })[0];
      if (!t) { S.thread = null; return tabMessages(); }
      var h = '<div class="fxCard"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><div><h2>' + esc(t.sujet || 'Discussion') + '</h2><div class="fxNote">' + fmtDT(t.updatedAt) + '</div></div><button class="fxBtn ghost sm" onclick="fxBackThreads()">← Retour</button></div>';
      h += '<div class="fxThread">';
      (t.messages || []).forEach(function (m) {
        var mine = m.auteur === 'fournisseur';
        h += '<div class="fxMsg ' + (mine ? 'mine' : 'them') + '"><div class="who">' + esc(mine ? 'Vous' : (m.nom || S.ent.nom || 'Service achats')) + '</div>' + esc(m.texte) + '<div class="at">' + fmtDT(m.at) + '</div></div>';
      });
      h += '</div>';
      h += '<div class="fxField"><label>Votre message</label><textarea id="fxReply" placeholder="Écrivez votre message…"></textarea></div>'
        + '<button class="fxBtn dark" id="fxSendReply" style="margin-top:8px">Envoyer</button><div class="fxErr" id="fxReplyErr"></div></div>';
      return h;
    }
    var list = myThreads();
    var h2 = '<div class="fxCard"><h2>Messages (' + list.length + ')</h2><div class="fxNote" style="margin-bottom:10px">Échangez avec le service achats (réponse automatique si nous sommes indisponibles).</div>';
    if (!list.length) h2 += '<div class="fxEmpty">Aucune discussion. Écrivez-nous ci-dessous.</div>';
    else {
      h2 += '<div style="display:flex;flex-direction:column;gap:8px">';
      list.forEach(function (t) {
        var last = (t.messages || [])[(t.messages || []).length - 1] || {};
        h2 += '<div class="fxItem" style="cursor:pointer" data-thread="' + esc(t.id) + '"><div class="t">' + esc(t.sujet || 'Discussion') + '</div><div class="m">' + esc(String(last.texte || '').slice(0, 120)) + '</div><div class="m">' + fmtDT(t.updatedAt) + '</div></div>';
      });
      h2 += '</div>';
    }
    h2 += '<button class="fxBtn ghost" id="fxNewThread" style="margin-top:12px">+ Nouvelle discussion</button></div>';
    return h2;
  }

  function bindCommandes() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-bc]'), function (b) {
      b.onclick = async function () {
        var id = b.getAttribute('data-bc');
        var act = b.getAttribute('data-act');
        if (act === 'toggle') { S.openBc = (S.openBc === id ? '' : id); renderApp(); return; }
        if (act === 'confirm') { await confirmerBc(id); }
      };
    });
  }
  function bindLivraisons() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-bc]'), function (b) {
      b.onclick = async function () {
        var id = b.getAttribute('data-bc');
        var act = b.getAttribute('data-act');
        if (act === 'toggle') { S.openBc = (S.openBc === id ? '' : id); renderApp(); return; }
        if (act === 'deliver') {
          var note = prompt('Précisez la livraison (date, quantité, transporteur…) :', '');
          if (note === null) return;
          await declarerLivraison(id, String(note || '').trim());
        }
      };
    });
  }
  async function confirmerBc(id) {
    var bc = (S.bcs || []).filter(function (x) { return x && x.id === id; })[0];
    if (!bc) return;
    if (!confirm('Confirmer la commande ' + (bc.numero || '') + ' ?')) return;
    bc.statut = 'confirme';
    bc.confirmedAt = Date.now();
    var th = ensureThread('Commande ' + (bc.numero || ''), 'commande', bc.id);
    th.messages.push({ auteur: 'fournisseur', nom: S.four.nom, texte: 'Commande ' + (bc.numero || '') + ' confirmée.', at: Date.now() });
    th.updatedAt = Date.now();
    try {
      await syncSet('mdb_bonsCommandeFournisseurs', S.bcs);
      await syncSet('mdb_fournisseurThreads', S.threads);
      renderApp();
    } catch (e) { alert('Enregistrement impossible. Réessayez.'); }
  }
  async function declarerLivraison(id, note) {
    var bc = (S.bcs || []).filter(function (x) { return x && x.id === id; })[0];
    if (!bc) return;
    bc.livraisonsDeclarees = Array.isArray(bc.livraisonsDeclarees) ? bc.livraisonsDeclarees : [];
    bc.livraisonsDeclarees.push({ at: Date.now(), note: note || '', par: S.four.nom });
    var th = ensureThread('Commande ' + (bc.numero || ''), 'commande', bc.id);
    th.messages.push({ auteur: 'fournisseur', nom: S.four.nom, texte: 'Livraison déclarée pour ' + (bc.numero || '') + (note ? ' : ' + note : ''), at: Date.now() });
    th.updatedAt = Date.now();
    try {
      await syncSet('mdb_bonsCommandeFournisseurs', S.bcs);
      await syncSet('mdb_fournisseurThreads', S.threads);
      alert('Livraison déclarée. Le service achats est prévenu.');
      renderApp();
    } catch (e) { alert('Enregistrement impossible. Réessayez.'); }
  }

  function ensureThread(sujet, type, refId) {
    var t = (S.threads || []).filter(function (x) { return x && x.refId === refId && x.type === type; })[0];
    if (!t) {
      t = { id: uid(), fournisseurId: S.acc.fournisseurId, fournisseurNom: S.four.nom, email: S.acc.email, sujet: sujet, type: type, refId: refId, messages: [], statut: 'ouvert', createdAt: Date.now(), updatedAt: Date.now() };
      S.threads.push(t);
    }
    return t;
  }
  function bindMessages() {
    var nb = el('fxNewThread');
    if (nb) nb.onclick = async function () {
      var txt = prompt('Votre message au service achats :');
      if (!txt || !txt.trim()) return;
      var th = { id: uid(), fournisseurId: S.acc.fournisseurId, fournisseurNom: S.four.nom, email: S.acc.email, sujet: 'Message fournisseur', type: 'message', refId: '', messages: [{ auteur: 'fournisseur', nom: S.four.nom, texte: txt.trim(), at: Date.now() }], statut: 'ouvert', createdAt: Date.now(), updatedAt: Date.now() };
      S.threads.push(th);
      try { await syncSet('mdb_fournisseurThreads', S.threads); S.thread = th.id; renderApp(); } catch (e) { alert('Envoi impossible.'); }
    };
    var send = el('fxSendReply');
    if (send) send.onclick = async function () {
      var ta = el('fxReply'), err = el('fxReplyErr'); var txt = (ta.value || '').trim();
      if (!txt) { err.textContent = 'Écrivez un message.'; return; }
      var t = (S.threads || []).filter(function (x) { return x && x.id === S.thread; })[0]; if (!t) return;
      t.messages = t.messages || [];
      t.messages.push({ auteur: 'fournisseur', nom: S.four.nom, texte: txt, at: Date.now() });
      t.updatedAt = Date.now();
      try { await syncSet('mdb_fournisseurThreads', S.threads); ta.value = ''; renderApp(); } catch (e) { err.textContent = 'Envoi impossible.'; }
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-thread]'), function (d) {
      d.onclick = function () { S.thread = d.getAttribute('data-thread'); renderApp(); };
    });
    var box = document.querySelector('.fxThread'); if (box) box.scrollTop = box.scrollHeight;
  }
  window.fxGoMain = function () {
    try { localStorage.setItem('mdb_aliveTs', String(Date.now())); } catch (eHb) {}
    try {
      if (window.parent && window.parent !== window) {
        if (typeof window.parent.closePayeOverlay === 'function') { window.parent.closePayeOverlay(); return; }
        if (typeof window.parent.navigateTo === 'function') { window.parent.navigateTo('dashboard'); return; }
      }
    } catch (eP) {}
    try {
      var op = window.opener;
      if (op && !op.closed) {
        try { op.focus(); } catch (eF) {}
        try { if (typeof op.navigateTo === 'function') op.navigateTo('dashboard'); } catch (eN) {}
      }
    } catch (eO) {}
    try { window.close(); } catch (eC) {}
    setTimeout(function () {
      try { if (!window.closed) location.replace('index.html'); } catch (eR) { try { location.href = 'index.html'; } catch (eH) {} }
    }, 140);
  };
  window.fxLogout = logout;
  window.fxBackThreads = function () { S.thread = null; renderApp(); };

  async function boot() {
    if (!UID) { renderAuth(); return; }
    await bootData();
    if (S.acc) renderApp(); else renderAuth();
    setInterval(async function () {
      if (!S.acc) return;
      try {
        var b = await syncGet('mdb_bonsCommandeFournisseurs');
        var t = await syncGet('mdb_fournisseurThreads');
        var p = await syncGet('mdb_fournisseurPresence');
        if (Array.isArray(b)) S.bcs = b;
        if (Array.isArray(t)) S.threads = t;
        if (p) S.presence = p;
        renderTop();
        if (S.tab === 'commandes' || S.tab === 'livraisons' || S.tab === 'messages') renderApp();
      } catch (e) {}
    }, 45000);
  }
  boot();
})();
</script>
</body>
</html>
