<!DOCTYPE html>
<html lang="fr">
<head>
<script src="js/mdb-auth.js?v=2"></script>
<script src="js/anti-lag.js?v=1" defer></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Espace fournisseur — administration</title>
<style>
  :root{--navy:#0b3a6f;--teal:#0e7490;--gold:#ecc95f;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f4f7fb;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,Segoe UI,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  button,input,select,textarea{font-family:inherit}
  .faTop{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:linear-gradient(120deg,#071a33,#0b3a6f 58%,#0e7490);color:#fff;box-shadow:0 6px 22px rgba(2,20,45,.28)}
  .faTop img{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:12px;padding:4px;display:block;flex-shrink:0}
  .faBrand{flex:1;min-width:0}
  .faBrand b{display:block;font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .faBrand span{display:block;font-size:10.5px;color:#cbd5e1;margin-top:2px}
  .faBtn{border:none;border-radius:10px;padding:9px 13px;font-size:12px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .faBtn.primary{background:linear-gradient(135deg,#ecc95f,#f6df9a);color:#0b3a6f}
  .faBtn.dark{background:#0b3a6f;color:#fff}
  .faBtn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28)}
  .faBtn.sm{padding:7px 10px;font-size:11px}
  .faBtn.dang{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
  .faWrap{max-width:1180px;margin:0 auto;padding:16px 14px calc(24px + env(safe-area-inset-bottom,0px))}
  .faCard{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 26px rgba(15,23,42,.06);padding:16px;margin-bottom:14px}
  .faCard h2{margin:0 0 4px;font-size:16px;font-weight:900}
  .faCard h3{margin:0 0 6px;font-size:13.5px;font-weight:900}
  .faNote{font-size:11.5px;color:var(--muted);line-height:1.5}
  .faTabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 4px 16px rgba(15,23,42,.05)}
  .faTab{border:none;background:transparent;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:800;color:#475569;cursor:pointer}
  .faTab.on{background:linear-gradient(135deg,#0b3a6f,#0e7490);color:#fff;box-shadow:0 6px 16px rgba(11,58,111,.25)}
  .faForm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .faField label{display:block;font-size:10.5px;font-weight:900;color:#475569;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .faField input,.faField select{width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;background:#fff}
  .faField.wide{grid-column:1/-1}
  .faTable{width:100%;border-collapse:collapse;font-size:12px}
  .faTable th{background:#f8fafc;color:#475569;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  .faTable td{padding:7px 8px;border-bottom:1px solid #f1f5f9;vertical-align:top}
  .faTable td.num,.faTable th.num{text-align:right;white-space:nowrap}
  .faList{display:flex;flex-direction:column;gap:9px}
  .faItem{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}
  .faItem .t{font-size:13px;font-weight:900}
  .faItem .m{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
  .faBadge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:900;margin-left:6px}
  .b-new{background:#e0f2fe;color:#075985}.b-wait{background:#fef3c7;color:#92400e}.b-ok{background:#dcfce7;color:#166534}.b-bad{background:#fee2e2;color:#b91c1c}.b-gray{background:#f1f5f9;color:#475569}
  .faThread{display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow:auto;padding:8px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;margin:8px 0}
  .faMsg{max-width:82%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.45}
  .faMsg.admin{align-self:flex-end;background:linear-gradient(135deg,#0b3a6f,#0e7490);color:#fff;border-bottom-right-radius:4px}
  .faMsg.four{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .faMsg .who{font-size:9.5px;font-weight:900;opacity:.8;margin-bottom:2px;text-transform:uppercase}
  .faMsg .at{font-size:9px;opacity:.65;margin-top:3px}
  .faEmpty{padding:22px 10px;text-align:center;color:var(--muted);font-size:12.5px}
  .faStat{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:900;border:1px solid transparent}
  .faStat.on{background:#dcfce7;color:#166534;border-color:#bbf7d0}
  .faStat.off{background:#fef3c7;color:#92400e;border-color:#fde68a}
  .faErr{color:var(--bad);font-size:12px;font-weight:800;min-height:16px}
  @media(max-width:720px){
    .faTop{padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px}
    .faTop img{width:40px;height:40px}
    .faBrand b{font-size:13.5px}
    .faWrap{padding:12px}
    .faForm{grid-template-columns:1fr}
    .faTable th:nth-child(3),.faTable td:nth-child(3){display:none}
  }
</style>
</head>
<body>
<header class="faTop">
  <img id="faLogo" src="logo-192.png?v=21" alt="">
  <div class="faBrand"><b id="faNom">Espace fournisseur</b><span>Administration · comptes, commandes et messages</span></div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
    <span id="faPresence" class="faStat off">Hors ligne</span>
    <button class="faBtn ghost sm" id="faTogglePresence">Me rendre disponible</button>
    <button class="faBtn primary sm" id="faOpenPortal">Ouvrir l’espace fournisseur</button>
    <button class="faBtn ghost sm" onclick="window.faGoMain()">← Application</button>
  </div>
</header>
<div class="faWrap"><div id="faBody"><div class="faCard"><div class="faEmpty">Chargement…</div></div></div></div>
<script>
(function () {
  'use strict';
  var API = '/api/sync';
  var UID = '';
  try { UID = (new URLSearchParams(location.search).get('uid') || localStorage.getItem('mdb_enterpriseUid') || localStorage.getItem('mdb_lastLoginUid') || '').replace(/^["']+|["']+$/g, '').trim(); } catch (e) {}
  var ADMIN = 'Service achats';
  try { var u = JSON.parse(localStorage.getItem('mdb_userDisplay') || '{}'); if (u && u.nom) ADMIN = u.nom; } catch (e) {}
  var S = { ent: {}, accounts: {}, fournisseurs: [], bcs: [], threads: [], presence: null, tab: 'comptes', thread: null, form: false };

  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { try { return new Intl.NumberFormat('fr-FR').format(Math.round(parseFloat(n) || 0)) + ' F'; } catch (e) { return String(Math.round(parseFloat(n) || 0)) + ' F'; } }
  function fmtDT(t) { if (!t) return '-'; try { return new Date(t).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return '-'; } }
  function fmtD(t) { if (!t) return '-'; try { var d = new Date(t); if (isNaN(d.getTime())) return String(t); return d.toLocaleDateString('fr-FR'); } catch (e) { return String(t); } }
  function uid() { return 'FA' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase(); }
  async function sha256(txt) {
    try {
      var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('00' + b.toString(16)).slice(-2); }).join('');
    } catch (e) { return ''; }
  }
  function randSalt() { return Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10); }
  function norm(s) { return String(s == null ? '' : s).trim().toLowerCase(); }

  async function syncGet(key) {
    if (!UID) return null;
    try {
      var r = await fetch(API + '?uid=' + encodeURIComponent(UID) + '&cle=' + encodeURIComponent(key) + '&t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return null;
      var j = await r.json();
      return (j && j.data && j.data[key] !== undefined) ? j.data[key] : null;
    } catch (e) { return null; }
  }
  async function syncSet(key, val) {
    if (!UID) throw new Error('uid');
    var body = { uid: UID, updates: {} }; body.updates[key] = val;
    var r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('sync');
    return true;
  }

  function statutBadge(s) {
    s = String(s || '').toLowerCase();
    if (s === 'envoye') return '<span class="faBadge b-new">Envoyée</span>';
    if (s === 'confirme') return '<span class="faBadge b-ok">Confirmée</span>';
    if (s === 'termine') return '<span class="faBadge b-gray">Terminée</span>';
    if (s === 'annule') return '<span class="faBadge b-bad">Annulée</span>';
    if (s === 'brouillon') return '<span class="faBadge b-gray">Brouillon</span>';
    return '<span class="faBadge b-gray">' + esc(s || '-') + '</span>';
  }
  function fourName(id) {
    var f = (S.fournisseurs || []).filter(function (x) { return x && String(x.id) === String(id); })[0];
    return f ? (f.nom || '') : '';
  }
  function accountsList() { return Object.keys(S.accounts || {}).sort(function (a, b) { return String(S.accounts[a].nom || a).localeCompare(String(S.accounts[b].nom || b), 'fr'); }); }

  async function loadAll() {
    S.ent = (await syncGet('mdb_entreprise')) || {};
    try {
      await syncSet('mdb_fournisseurPublic', { nom: S.ent.nom || S.ent.sigle || '', sigle: S.ent.sigle || '', logo: S.ent.logo || '', telephone: S.ent.telephone || S.ent.tel || '', email: S.ent.email || '', adresse: S.ent.adresse || '' });
    } catch (ePub) {}
    S.accounts = (await syncGet('mdb_fournisseurAccounts')) || {};
    S.fournisseurs = (await syncGet('mdb_fournisseurs')) || [];
    S.bcs = (await syncGet('mdb_bonsCommandeFournisseurs')) || [];
    S.threads = (await syncGet('mdb_fournisseurThreads')) || [];
    S.presence = (await syncGet('mdb_fournisseurPresence')) || null;
  }

  function renderTop() {
    el('faLogo').src = S.ent.logo || 'logo-192.png?v=21';
    el('faNom').textContent = (S.ent.nom || 'Montabbord') + ' — Espace fournisseur';
    var online = !!(S.presence && S.presence.dispo !== false && (Date.now() - (S.presence.at || 0) < 5 * 60 * 1000));
    var st = el('faPresence');
    st.className = 'faStat ' + (online ? 'on' : 'off');
    st.textContent = online ? 'Disponible' : 'Hors ligne';
    el('faTogglePresence').textContent = online ? 'Me mettre hors ligne' : 'Me rendre disponible';
  }

  function render() {
    renderTop();
    var base = location.origin + '/espace-fournisseur.html?uid=' + encodeURIComponent(UID);
    var h = '<div class="faCard" style="padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><b style="font-size:12px;color:#334155">🔗 Lien à envoyer aux fournisseurs :</b><code style="font-size:11px;background:#eef2f7;padding:4px 7px;border-radius:6px;word-break:break-all;flex:1;min-width:200px">' + esc(base) + '</code><button class="faBtn dark sm" onclick="faCopyLink()">Copier</button></div>';
    h += '<div class="faTabs">';
    [['comptes', 'Comptes'], ['commandes', 'Commandes'], ['messages', 'Messages']].forEach(function (t) {
      h += '<button class="faTab ' + (S.tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '">' + t[1] + (t[0] === 'messages' && S.threads.filter(function (x) { return x.statut !== 'fermee'; }).length ? ' (' + S.threads.filter(function (x) { return x.statut !== 'fermee'; }).length + ')' : '') + '</button>';
    });
    h += '</div><div id="faTabBody"></div>';
    el('faBody').innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll('.faTab'), function (b) { b.onclick = function () { S.tab = b.getAttribute('data-tab'); S.thread = null; S.form = false; render(); }; });
    var body = el('faTabBody');
    if (S.tab === 'comptes') { body.innerHTML = tabComptes(); bindComptes(); }
    else if (S.tab === 'commandes') body.innerHTML = tabCommandes();
    else { body.innerHTML = tabMessages(); bindMessages(); }
  }

  function tabComptes() {
    var keys = accountsList();
    var h = '<div class="faCard"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><div><h2>Comptes fournisseurs (' + keys.length + ')</h2><div class="faNote">Un compte = un fournisseur de votre liste. Le fournisseur ne voit que ses commandes, livraisons, factures et messages.</div></div><button class="faBtn dark" id="faNewAcc">+ Nouveau compte</button></div>';
    if (S.form) {
      var dispo = (S.fournisseurs || []).filter(function (f) { return f && !Object.keys(S.accounts || {}).some(function (k) { return String(S.accounts[k].fournisseurId) === String(f.id); }); });
      h += '<div style="margin-top:14px;border-top:1px solid #e2e8f0;padding-top:14px"><h3>Créer un compte</h3>'
        + '<div class="faForm">'
        + '<div class="faField wide"><label>Fournisseur</label><select id="faAccFour">' + (dispo.length ? dispo.map(function (f) { return '<option value="' + esc(f.id) + '">' + esc(f.nom || '') + (f.email ? ' — ' + esc(f.email) : '') + '</option>'; }).join('') : '<option value="">Aucun fournisseur sans compte</option>') + '</select></div>'
        + '<div class="faField"><label>Nom affiché</label><input id="faAccNom" placeholder="Ex : Sté Palette CI"></div>'
        + '<div class="faField"><label>Email (identifiant)</label><input id="faAccEmail" type="email" placeholder="contact@fournisseur.ci"></div>'
        + '<div class="faField"><label>Mot de passe</label><input id="faAccPass" type="text" placeholder="Au moins 4 caractères"></div>'
        + '<div class="faField"><label>Téléphone</label><input id="faAccTel" placeholder="07…"></div>'
        + '<div class="faField wide" style="display:flex;gap:8px;align-items:center"><button class="faBtn dark" id="faAccSave">Créer le compte</button><button class="faBtn" id="faAccCancel" style="background:#f1f5f9;color:#334155;border:1px solid #e2e8f0">Annuler</button><span class="faErr" id="faAccErr"></span></div>'
        + '</div></div>';
    }
    if (!keys.length) return h + '<div class="faEmpty" style="margin-top:12px">Aucun compte fournisseur. Cliquez sur « Nouveau compte ».</div></div>';
    h += '<table class="faTable" style="margin-top:12px"><thead><tr><th>Fournisseur</th><th>Email</th><th>Créé le</th><th>Statut</th><th></th></tr></thead><tbody>';
    keys.forEach(function (k) {
      var a = S.accounts[k] || {};
      h += '<tr><td><b>' + esc(a.nom || fourName(a.fournisseurId) || k) + '</b><div class="faNote">' + esc(fourName(a.fournisseurId) || '—') + '</div></td>'
        + '<td>' + esc(a.email || k) + (a.tel ? '<div class="faNote">' + esc(a.tel) + '</div>' : '') + '</td>'
        + '<td>' + fmtD(a.createdAt) + '</td>'
        + '<td>' + (a.actif === false ? '<span class="faBadge b-bad">Désactivé</span>' : '<span class="faBadge b-ok">Actif</span>') + '</td>'
        + '<td style="white-space:nowrap"><button class="faBtn sm" data-acc="' + esc(k) + '" data-act="pass" style="background:#f1f5f9;color:#334155;border:1px solid #e2e8f0">Mot de passe</button> '
        + '<button class="faBtn sm" data-acc="' + esc(k) + '" data-act="toggle" style="background:#f1f5f9;color:#334155;border:1px solid #e2e8f0">' + (a.actif === false ? 'Réactiver' : 'Désactiver') + '</button> '
        + '<button class="faBtn dang sm" data-acc="' + esc(k) + '" data-act="del">Supprimer</button></td></tr>';
    });
    return h + '</tbody></table></div>';
  }

  function bindComptes() {
    var nb = el('faNewAcc');
    if (nb) nb.onclick = function () { S.form = true; render(); };
    var cancel = el('faAccCancel');
    if (cancel) cancel.onclick = function () { S.form = false; render(); };
    var save = el('faAccSave');
    if (save) save.onclick = async function () {
      var err = el('faAccErr');
      var fourId = (el('faAccFour') || {}).value || '';
      var nom = (el('faAccNom').value || '').trim();
      var email = (el('faAccEmail').value || '').trim().toLowerCase();
      var pass = el('faAccPass').value || '';
      var tel = (el('faAccTel').value || '').trim();
      if (!fourId) { err.textContent = 'Choisissez un fournisseur (créez-le d’abord dans Tiers › Fournisseurs).'; return; }
      if (!nom || !email || !pass) { err.textContent = 'Nom, email et mot de passe sont obligatoires.'; return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Email invalide.'; return; }
      if (pass.length < 4) { err.textContent = 'Mot de passe : 4 caractères minimum.'; return; }
      if (S.accounts[email]) { err.textContent = 'Un compte existe déjà avec cet email.'; return; }
      var salt = randSalt();
      var hash = await sha256(salt + '|' + pass);
      S.accounts[email] = { id: uid(), fournisseurId: fourId, nom: nom, email: email, tel: tel, salt: salt, hash: hash, actif: true, createdAt: Date.now() };
      try { await syncSet('mdb_fournisseurAccounts', S.accounts); S.form = false; render(); alert('Compte créé. Communiquez l’email et le mot de passe au fournisseur.'); }
      catch (e) { err.textContent = 'Enregistrement impossible.'; }
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-acc]'), function (b) {
      b.onclick = async function () {
        var key = b.getAttribute('data-acc');
        var act = b.getAttribute('data-act');
        var a = S.accounts[key]; if (!a) return;
        if (act === 'toggle') { a.actif = a.actif === false; await syncSet('mdb_fournisseurAccounts', S.accounts); render(); return; }
        if (act === 'del') {
          if (!confirm('Supprimer le compte de ' + (a.nom || key) + ' ?')) return;
          delete S.accounts[key];
          await syncSet('mdb_fournisseurAccounts', S.accounts);
          render(); return;
        }
        if (act === 'pass') {
          var np = prompt('Nouveau mot de passe pour ' + (a.nom || key) + ' :', '');
          if (np === null) return;
          np = String(np).trim();
          if (np.length < 4) { alert('4 caractères minimum.'); return; }
          var salt = randSalt();
          a.salt = salt; a.hash = await sha256(salt + '|' + np);
          await syncSet('mdb_fournisseurAccounts', S.accounts);
          alert('Mot de passe modifié. Communiquez-le au fournisseur.');
        }
      };
    });
  }

  function tabCommandes() {
    var list = (S.bcs || []).slice().sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
    var h = '<div class="faCard"><h2>Commandes fournisseurs (' + list.length + ')</h2><div class="faNote" style="margin-bottom:10px">Ce que chaque fournisseur voit dans son espace. Les brouillons ne sont jamais publiés. Les commandes « Envoyée » peuvent être confirmées par le fournisseur.</div>';
    if (!list.length) return h + '<div class="faEmpty">Aucun bon de commande fournisseur.</div></div>';
    h += '<table class="faTable"><thead><tr><th>Numéro</th><th>Fournisseur</th><th>Date</th><th class="num">Total TTC</th><th>Statut</th><th>Livraison</th></tr></thead><tbody>';
    list.forEach(function (bc) {
      var nDecl = (bc.livraisonsDeclarees || []).length;
      h += '<tr><td><b>' + esc(bc.numero || '-') + '</b></td><td>' + esc(fourName(bc.fournisseurId) || '-') + '</td><td>' + fmtD(bc.date) + '</td>'
        + '<td class="num">' + money(bc.totalTTC || bc.totalHT || 0) + '</td><td>' + statutBadge(bc.statut) + '</td>'
        + '<td>' + (nDecl ? '<span class="faBadge b-ok">' + nDecl + ' déclarée(s)</span>' : '<span class="faBadge b-gray">—</span>') + '</td></tr>';
    });
    return h + '</tbody></table></div>';
  }

  function tabMessages() {
    if (S.thread) {
      var t = (S.threads || []).filter(function (x) { return x && x.id === S.thread; })[0];
      if (!t) { S.thread = null; return tabMessages(); }
      var h = '<div class="faCard"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><div><h2 style="margin-bottom:3px">' + esc(t.sujet || 'Discussion') + '</h2><div class="faNote">' + esc(t.fournisseurNom || '') + ' · ' + fmtDT(t.updatedAt) + '</div></div><button class="faBtn sm" style="background:#f1f5f9;color:#334155;border:1px solid #e2e8f0" onclick="faBackThreads()">← Retour</button></div>';
      h += '<div class="faThread">';
      (t.messages || []).forEach(function (m) {
        var mine = m.auteur === 'admin';
        h += '<div class="faMsg ' + (mine ? 'admin' : 'four') + '"><div class="who">' + esc(mine ? (m.nom || ADMIN) : (m.nom || t.fournisseurNom || 'Fournisseur')) + '</div>' + esc(m.texte) + '<div class="at">' + fmtDT(m.at) + '</div></div>';
      });
      h += '</div>';
      if (String(t.statut) !== 'fermee') {
        h += '<div class="faField"><label>Réponse</label><textarea id="faReply" placeholder="Votre réponse…" style="min-height:64px"></textarea></div><button class="faBtn dark" id="faSendReply" style="margin-top:8px">Envoyer</button> <button class="faBtn dang sm" onclick="faCloseThread()">Fermer</button><div class="faErr" id="faReplyErr"></div>';
      } else h += '<div class="faNote">Discussion fermée.</div>';
      return h + '</div>';
    }
    var list = (S.threads || []).slice().sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
    var h2 = '<div class="faCard"><h2>Messages (' + list.length + ')</h2>';
    if (!list.length) return h2 + '<div class="faEmpty">Aucune discussion fournisseur.</div></div>';
    h2 += '<div class="faList">';
    list.forEach(function (t) {
      var last = (t.messages || [])[(t.messages || []).length - 1] || {};
      h2 += '<div class="faItem" style="cursor:pointer" data-thread="' + esc(t.id) + '"><div style="flex:1"><div class="t">' + esc(t.sujet || 'Discussion') + (t.statut === 'fermee' ? ' <span class="faBadge b-gray">Fermée</span>' : '') + '</div><div class="m">' + esc(t.fournisseurNom || '') + ' · ' + esc(String(last.texte || '').slice(0, 120)) + '</div><div class="m">' + fmtDT(t.updatedAt) + '</div></div><span style="font-size:18px;color:#94a3b8">›</span></div>';
    });
    return h2 + '</div></div>';
  }

  function bindMessages() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-thread]'), function (d) {
      d.onclick = function () { S.thread = d.getAttribute('data-thread'); render(); };
    });
    var send = el('faSendReply');
    if (send) send.onclick = async function () {
      var ta = el('faReply'), err = el('faReplyErr'); var txt = (ta.value || '').trim();
      if (!txt) { err.textContent = 'Écrivez une réponse.'; return; }
      var t = (S.threads || []).filter(function (x) { return x && x.id === S.thread; })[0]; if (!t) return;
      t.messages = t.messages || [];
      t.messages.push({ auteur: 'admin', nom: ADMIN, texte: txt, at: Date.now() });
      t.updatedAt = Date.now();
      try { await syncSet('mdb_fournisseurThreads', S.threads); render(); } catch (e) { err.textContent = 'Envoi impossible.'; }
    };
  }
  window.faBackThreads = function () { S.thread = null; render(); };
  window.faCloseThread = async function () {
    var t = (S.threads || []).filter(function (x) { return x && x.id === S.thread; })[0]; if (!t) return;
    t.statut = 'fermee'; t.updatedAt = Date.now();
    try { await syncSet('mdb_fournisseurThreads', S.threads); render(); } catch (e) {}
  };
  window.faCopyLink = function () {
    var link = location.origin + '/espace-fournisseur.html?uid=' + encodeURIComponent(UID);
    try { navigator.clipboard.writeText(link).then(function () { alert('Lien copié.'); }); }
    catch (e) { prompt('Copiez le lien :', link); }
  };

  async function setPresence(dispo) {
    S.presence = { at: Date.now(), nom: ADMIN, dispo: !!dispo };
    try { await syncSet('mdb_fournisseurPresence', S.presence); } catch (e) {}
    renderTop();
  }
  el('faTogglePresence').onclick = function () {
    var online = !!(S.presence && S.presence.dispo !== false && (Date.now() - (S.presence.at || 0) < 5 * 60 * 1000));
    setPresence(!online);
  };
  el('faOpenPortal').onclick = function () { var w = window.open('espace-fournisseur.html?uid=' + encodeURIComponent(UID), 'mdb_espace_fournisseur'); try { if (w) w.focus(); } catch (eW) {}; };

  async function boot() {
    if (!UID) {
      el('faBody').innerHTML = '<div class="faCard"><h2>Session requise</h2><div class="faNote">Ouvrez cette page depuis l’application principale (elle doit être connectée).</div><div style="margin-top:12px"><a class="faBtn dark" href="index.html">Ouvrir l’application</a></div></div>';
      return;
    }
    await loadAll();
    await setPresence(true);
    render();
    setInterval(function () { try { if (S.presence && S.presence.dispo !== false) { S.presence.at = Date.now(); syncSet('mdb_fournisseurPresence', S.presence); } } catch (e) {} }, 60000);
    setInterval(async function () {
      try {
        var t = await syncGet('mdb_fournisseurThreads') || [];
        var b = await syncGet('mdb_bonsCommandeFournisseurs') || [];
        var before = S.threads.length + ':' + S.bcs.length;
        if (t.length + ':' + b.length !== before) { S.threads = t; S.bcs = b; render(); }
      } catch (e) {}
    }, 45000);
  }
  boot();
})();
</script>
<script>
window.faGoMain = function () {
  try { localStorage.setItem('mdb_aliveTs', String(Date.now())); } catch (eHb) {}
  try {
    var ch = new BroadcastChannel('mdb_shared_sync');
    ch.postMessage({ type: 'focus_tab', app: 'main', targetPage: 'dashboard' });
    setTimeout(function () { try { ch.close(); } catch (eC) {} }, 500);
  } catch (eCh) {}
  try { var op = window.opener; if (op && !op.closed) { try { op.focus(); } catch (eF) {} } } catch (eO) {}
  try { window.close(); } catch (eW) {}
  setTimeout(function () {
    try {
      if (window.closed) return;
      document.body.innerHTML = '<div style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#0f172a;font-family:system-ui,Segoe UI,Arial,sans-serif;padding:20px;text-align:center"><div style="background:#1e293b;padding:30px;border-radius:16px;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.45)"><div style="font-size:40px;margin-bottom:8px">\ud83c\udfe2</div><h2 style="margin:0 0 10px;font-size:18px;color:#fff">Application principale ouverte</h2><p style="color:#94a3b8;font-size:13px;line-height:1.5;margin:0 0 18px">Cet espace a \u00e9t\u00e9 ferm\u00e9. L\u2019application principale est d\u00e9j\u00e0 ouverte dans son onglet : aucune seconde page n\u2019a \u00e9t\u00e9 cr\u00e9\u00e9e.</p><button onclick="window.close()" style="background:#ef4444;color:#fff;border:none;padding:11px 26px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer">Fermer cet onglet</button><div style="color:#64748b;font-size:11px;margin-top:10px">Si le navigateur bloque la fermeture, utilisez Ctrl+W.</div></div></div>';
    } catch (eCard) {}
  }, 250);
};
</script>
