<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Vérification de document — Montabbord</title>
  <style>
    :root { --blue:#0b3a6f; --red:#d71920; --gold:#ecc95f; --ink:#0f172a; --muted:#64748b; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:linear-gradient(160deg,#f8fafc,#eef2f7); font-family:Arial,Helvetica,sans-serif; color:var(--ink); display:flex; align-items:center; justify-content:center; padding:18px; }
    .card { width:100%; max-width:560px; background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 18px 50px rgba(15,23,42,.16); border:1px solid #e2e8f0; }
    .head { background:var(--blue); color:#fff; padding:18px 22px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .head h1 { margin:0; font-size:18px; letter-spacing:.02em; }
    .head span { font-size:11px; color:#cbd5e1; text-align:right; }
    .brand { font-weight:900; color:var(--gold); font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    .body { padding:22px; }
    .status { border-radius:12px; padding:16px; text-align:center; font-weight:900; font-size:19px; margin-bottom:16px; }
    .ok { background:#f0fdf4; border:2px solid #16a34a; color:#166534; }
    .bad { background:#fef2f2; border:2px solid var(--red); color:#991b1b; }
    .wait { background:#eff6ff; border:2px solid #93c5fd; color:#1d4ed8; }
    .row { display:flex; justify-content:space-between; gap:14px; padding:8px 0; border-bottom:1px solid #eef2f7; font-size:13px; }
    .row:last-child { border-bottom:none; }
    .row span { color:var(--muted); }
    .row b { text-align:right; }
    .net { margin-top:14px; background:var(--blue); color:#fff; border-radius:10px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .net b { font-size:20px; text-align:right; }
    .net small { color:var(--gold); font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .foot { padding:14px 22px 20px; font-size:11px; color:var(--muted); text-align:center; line-height:1.5; }
    .foot a { color:var(--blue); font-weight:700; text-decoration:none; }
    .hash { font-family:monospace; font-size:10px; color:#94a3b8; word-break:break-all; margin-top:8px; }
    .type { display:inline-block; background:#e8eef7; color:var(--blue); border-radius:999px; padding:2px 10px; font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
    .recep { margin-top:16px; border:1px solid #dbe3ef; border-radius:12px; padding:14px 16px; background:#f8fafc; }
    .recep h3 { margin:0 0 6px; font-size:14px; color:var(--blue); }
    .recep p { margin:0 0 10px; font-size:11.5px; color:var(--muted); line-height:1.5; }
    .recep-line { display:flex; gap:8px; }
    .recep input { flex:1; min-width:0; padding:10px 12px; border:1.5px solid #cbd5e1; border-radius:8px; font-size:17px; letter-spacing:5px; text-align:center; }
    .recep input:focus { outline:none; border-color:var(--blue); }
    .recep button { background:var(--blue); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-weight:800; font-size:13px; cursor:pointer; white-space:nowrap; }
    .recep button:hover { background:#0a2f5a; }
    .recep button:disabled { opacity:.55; cursor:not-allowed; }
    .recep-msg { margin-top:9px; font-size:12px; font-weight:700; min-height:17px; }
    .recep-msg.err { color:#b91c1c; }
    .recep-msg.good { color:#15803d; }
    .recep-done { display:flex; align-items:center; gap:9px; font-size:12.5px; color:#166534; background:#f0fdf4; border:1px solid #86efac; border-radius:9px; padding:9px 11px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div>
        <div class="brand">Montabbord</div>
        <h1>Vérification de document</h1>
      </div>
      <span>Contrôle sécurisé</span>
    </div>
    <div class="body" id="body">
      <div class="status wait" id="status">Vérification en cours…</div>
    </div>
    <div class="foot">
      Ce contrôle interroge le registre des documents. Un document non enregistré est signalé comme non reconnu.<br>
      <a href="/">Retour à Montabbord</a>
    </div>
  </div>
  <script>
    (function () {
      var API = "https://montabbord-api.kkcj2019.workers.dev/api/sync";
      var API_RECEP = "https://montabbord-api.kkcj2019.workers.dev/api/recep";
      var TYPE_LABEL = {
        caisse: "Pièce de caisse",
        bl: "Bon de livraison",
        bc: "Bon de commande",
        proforma: "Facture pro-forma",
        facture: "Facture",
        production: "Fiche de production",
        prodbl: "Bon de livraison (production)",
        of: "Ordre de fabrication",
        qualite: "Contrôle qualité",
        bulletin: "Bulletin de paie"
      };

      function qs(name) {
        try { return new URLSearchParams(location.search).get(name) || ""; } catch (e) { return ""; }
      }
      function money(n) {
        n = parseFloat(n) || 0;
        try { return n.toLocaleString("fr-FR") + " FCFA"; } catch (e) { return n + " FCFA"; }
      }
      function monthLabel(m) {
        try {
          var d = new Date(String(m) + "-01T00:00:00");
          return d.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
        } catch (e) { return m || "-"; }
      }
      function dateLabel(d) {
        if (!d) return "-";
        try { return new Date(d).toLocaleDateString("fr-FR"); } catch (e) { return d; }
      }
      function dateTimeLabel(d) {
        if (!d) return "-";
        try { return new Date(d).toLocaleString("fr-FR"); } catch (e) { return d; }
      }
      function esc(s) {
        return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function fail(msg, detail) {
        var s = document.getElementById("status");
        s.className = "status bad";
        s.textContent = msg || "Document non reconnu";
        if (detail) document.getElementById("body").insertAdjacentHTML("beforeend", '<div class="hash">' + esc(detail) + "</div>");
      }
      function fetchKey(uid, key) {
        return fetch(API + "?uid=" + encodeURIComponent(uid) + "&cle=" + encodeURIComponent(key) + "&t=" + Date.now(), { cache: "no-store" })
          .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
          .then(function (j) {
            var v = j && j.data && j.data[key];
            if (typeof v === "string") { try { v = JSON.parse(v); } catch (e) { v = null; } }
            return v;
          })
          .catch(function () { return null; });
      }
      function findToken(list, token) {
        if (!Array.isArray(list)) return null;
        for (var i = 0; i < list.length; i++) {
          if (list[i] && String(list[i].token) === String(token)) return list[i];
        }
        return null;
      }

      var uid = qs("uid");
      var token = qs("token");
      if (!uid || !token) { fail("Lien de vérification incomplet"); return; }

      Promise.all([
        fetchKey(uid, "mdb_qr_verifs"),
        fetchKey(uid, "mdb_paye"),
        fetchKey(uid, "mdb_receptionsBulletins"),
        fetchKey(uid, "mdb_paye.bulletinVerifs")
      ]).then(function (res) {
        var generic = Array.isArray(res[0]) ? res[0] : [];
        var paye = res[1];
        var receptions = Array.isArray(res[2]) ? res[2] : [];
        var buls = Array.isArray(res[3]) ? res[3] : [];
        if (paye) {
          if (typeof paye === "string") { try { paye = JSON.parse(paye); } catch (e) { paye = null; } }
          if (!buls.length && paye && Array.isArray(paye.bulletinVerifs)) buls = paye.bulletinVerifs;
        }
        var rec = findToken(generic, token);
        var isBulletin = false;
        if (!rec) { rec = findToken(buls, token); isBulletin = !!rec; }
        var body = document.getElementById("body");
        var s = document.getElementById("status");
        if (!rec) { s.className = "status bad"; s.textContent = "❌ Document non reconnu"; return; }

        s.className = "status ok";
        s.textContent = "✅ Document authentique";

        var type = isBulletin ? "bulletin" : String(rec.type || "doc").toLowerCase();
        var typeLbl = TYPE_LABEL[type] || "Document";
        var html = '<div style="text-align:center;margin-bottom:12px"><span class="type">' + esc(typeLbl) + "</span></div>";

        if (isBulletin) {
          html +=
            '<div class="row"><span>Employé</span><b>' + esc(rec.nom || "-") + "</b></div>" +
            '<div class="row"><span>Matricule</span><b>' + esc(rec.matricule || "-") + "</b></div>" +
            '<div class="row"><span>Mois</span><b>' + esc(monthLabel(rec.mois)) + "</b></div>" +
            '<div class="row"><span>Brut</span><b>' + money(rec.brut) + "</b></div>" +
            '<div class="row"><span>Enregistré le</span><b>' + esc(dateTimeLabel(rec.date)) + "</b></div>" +
            '<div class="net"><small>Net à payer</small><b>' + money(rec.netAvantSolde != null ? rec.netAvantSolde : rec.net) + "</b></div>" +
            '<div style="margin-top:12px"><a href="espace-employe.html?uid=' + encodeURIComponent(uid) + '&token=' + encodeURIComponent(token) + '" style="display:block;text-align:center;background:#0b3a6f;color:#fff;padding:11px;border-radius:9px;text-decoration:none;font-weight:800;font-size:12.5px">👤 Ouvrir mon espace employé</a></div>';
        } else {
          html +=
            '<div class="row"><span>Référence</span><b>' + esc(rec.ref || "-") + "</b></div>" +
            (rec.tiers ? '<div class="row"><span>' + (type === "caisse" ? "Bénéficiaire" : "Tiers") + "</span><b>" + esc(rec.tiers) + "</b></div>" : "") +
            (rec.libelle ? '<div class="row"><span>Objet</span><b>' + esc(rec.libelle) + "</b></div>" : "") +
            (rec.date ? '<div class="row"><span>Date du document</span><b>' + esc(dateLabel(rec.date)) + "</b></div>" : "") +
            (rec.montant ? '<div class="net"><small>Montant</small><b>' + money(rec.montant) + "</b></div>" : "") +
            '<div class="row" style="margin-top:10px"><span>Enregistré le</span><b>' + esc(dateTimeLabel(rec.dateCreation)) + "</b></div>";
        }
        html += '<div class="hash">Référence : ' + esc(rec.token) + "<br>Empreinte : " + esc(rec.hash || "-") + "</div>";

        var deja = isBulletin ? findToken(receptions, token) : null;
        if (isBulletin) {
          html += '<div class="recep" id="recepBox">';
          if (deja) {
            html += '<h3>Accusé de réception</h3>' +
              '<div class="recep-done"><span style="font-size:18px">✅</span><div>Bulletin déjà reçu par l’employé<br><b>' + esc(dateTimeLabel(deja.dateReception)) + '</b></div></div>';
          } else {
            html += '<h3>Accuser réception de ce bulletin</h3>' +
              '<p>L’employé confirme avoir reçu son bulletin en saisissant son <b>code PIN</b> (4 à 8 chiffres). Ce PIN est personnel et ne doit pas être partagé.</p>' +
              '<div class="recep-line"><input id="recepPin" type="password" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="••••"><button id="recepBtn" type="button">Confirmer</button></div>' +
              '<div class="recep-msg" id="recepMsg"></div>';
          }
          html += '</div>';
        }

        body.insertAdjacentHTML("beforeend", html);

        if (isBulletin && !deja) {
          var tries = 0;
          var input = document.getElementById("recepPin");
          var btn = document.getElementById("recepBtn");
          var msg = document.getElementById("recepMsg");
          function say(t, cls) { msg.textContent = t || ""; msg.className = "recep-msg" + (cls ? " " + cls : ""); }
          function confirmer() {
            var pin = (input.value || "").trim();
            if (!/^\d{4,8}$/.test(pin)) { say("Saisissez 4 à 8 chiffres.", "err"); return; }
            btn.disabled = true;
            say("Vérification…", "");
            fetch(API_RECEP, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ uid: uid, token: token, pin: pin })
            }).then(function (r) { return r.json(); }).then(function (j) {
              if (j && j.ok) {
                var dr = (j.reception && j.reception.dateReception) ? dateTimeLabel(j.reception.dateReception) : dateTimeLabel(new Date().toISOString());
                document.getElementById("recepBox").innerHTML =
                  '<h3>Accusé de réception</h3><div class="recep-done"><span style="font-size:18px">✅</span><div>Réception confirmée<br><b>' + esc(dr) + '</b></div></div>';
                return;
              }
              tries++;
              var code = (j && j.code) || "error";
              if (code === "bad_pin") say("PIN incorrect (" + tries + "/5).", "err");
              else if (code === "no_pin") say("Aucun PIN défini pour cet employé. Contactez le service paie.", "err");
              else if (code === "not_found") say("Bulletin introuvable dans le registre.", "err");
              else if (code === "bad_format") say("Le PIN doit contenir 4 à 8 chiffres.", "err");
              else say("Confirmation impossible. Réessayez.", "err");
              if (tries >= 5) { say("Trop de tentatives. Contactez le service paie.", "err"); btn.disabled = true; input.disabled = true; }
              else btn.disabled = false;
            }).catch(function () {
              say("Connexion impossible. Vérifiez Internet.", "err");
              btn.disabled = false;
            });
          }
          btn.addEventListener("click", confirmer);
          input.addEventListener("keydown", function (e) { if (e.key === "Enter") confirmer(); });
        }
      }).catch(function (e) { fail("Vérification indisponible", e && e.message ? e.message : e); });
    })();
  </script>
</body>
</html>
