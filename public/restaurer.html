<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Restauration</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f3f4f6;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;border-radius:12px;padding:32px;width:500px;box-shadow:0 4px 6px rgba(0,0,0,.1)}
h1{font-size:20px;margin-bottom:8px;color:#111827}
p{font-size:14px;color:#6b7280;margin-bottom:16px}
input{margin-bottom:16px}
.btn{display:none;padding:12px 24px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer;font-weight:600}
.btn:hover{background:#1d4ed8}
#status{font-size:13px;color:#374151;margin-top:12px;white-space:pre-wrap;max-height:400px;overflow-y:auto;background:#f9fafb;padding:12px;border-radius:6px;border:1px solid #e5e7eb}
.success{color:#16a34a;font-weight:600}
</style>
</head>
<body>
<div class="card">
<h1>Restauration des donn&eacute;es</h1>
<p>S&eacute;lectionnez le fichier <strong>backup-mdb-2026-07-28 (2).json</strong></p>
<input type="file" id="fileInput" accept=".json">
<button class="btn" id="restoreBtn">Restaurer</button>
<div id="status"></div>
</div>
<script>
var fileInput=document.getElementById('fileInput');
var restoreBtn=document.getElementById('restoreBtn');
var statusDiv=document.getElementById('status');

fileInput.addEventListener('change',function(){
  var file=fileInput.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result);
      var keys=Object.keys(data).filter(function(k){return k.indexOf('mdb_')===0});
      statusDiv.textContent='Fichier charg\u00e9 : '+keys.length+' cl\u00e9s trouv\u00e9es';
      restoreBtn.style.display='inline-block';
      restoreBtn.onclick=function(){
        var count=0;
        for(var i=0;i<keys.length;i++){
          var k=keys[i];
          var v=data[k];
          if(v!==null&&v!==undefined){
            try{localStorage.setItem(k,JSON.stringify(v));count++}catch(e){}
          }
        }
        statusDiv.innerHTML='<span class="success">'+count+' cl\u00e9s restaur\u00e9es !</span>\n\nVous pouvez fermer cette page.\n\nEnsuite ouvrez <a href=\"https://montabbord.web.app\" target=\"_blank\">montabbord.web.app</a> et connectez-vous.';
        restoreBtn.style.display='none';
      };
    }catch(e){statusDiv.textContent='Erreur : '+e.message}
  };
  reader.readAsText(file);
});
</script>
</body>
</html>
