<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>Récupération Super Admin</title>
<style>body{font-family:sans-serif;background:#0f172a;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}.card{background:#fff;color:#1e293b;border-radius:14px;padding:28px;width:360px}input{width:100%;padding:9px;margin:5px 0 12px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}button{width:100%;padding:11px;background:#7c3aed;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer}#msg{margin-top:10px;font-size:13px}</style>
</head><body><div class="card">
<h2 style="margin-top:0">🔑 Récupération Super Admin</h2>
<p style="font-size:13px;color:#64748b">Définissez de nouveaux identifiants Super Admin.</p>
<label>Identifiant</label><input id="login" placeholder="ex: admin">
<label>Mot de passe</label><input id="pass" type="password">
<label>Nom affiché</label><input id="nom" value="Super Admin">
<button onclick="doReset()">Réinitialiser</button>
<div id="msg"></div>
</div>
<script>
const SB_URL='https://pywacfwhwsvidkhqsjqv.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5d2FjZndod3N2aWRraHFzanF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMDMyMTksImV4cCI6MjEwMjg3OTIxOX0.wmt5vKo189wxQ9loIYprj8PE-Xd3y0Xs_-n61UJjbls';
async function doReset(){
  const l=document.getElementById('login').value.trim(), p=document.getElementById('pass').value, n=document.getElementById('nom').value.trim()||'Super Admin';
  const m=document.getElementById('msg');
  if(!l||!p){m.style.color='#dc2626';m.textContent='Remplissez identifiant et mot de passe.';return;}
  m.style.color='#64748b';m.textContent='Enregistrement...';
  try{
    const r=await fetch(SB_URL+'/rest/v1/super_admin_config?on_conflict=id',{
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify({id:1,data:{login:l,password:p,nom:n}})
    });
    if(!r.ok){const tx=await r.text();m.style.color='#dc2626';m.textContent='Erreur '+r.status+' : '+tx.slice(0,140);}
    else{m.style.color='#16a34a';m.textContent='✔ Identifiants mis à jour. Vous pouvez vous connecter. SUPPRIMEZ ce fichier maintenant !';}
  }catch(e){m.style.color='#dc2626';m.textContent='Erreur : '+e.message;}
}
</script></body></html>
