<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Espace employé — Administration — Montabbord</title>
<style>
  :root{--blue:#0b3a6f;--red:#d71920;--gold:#ecc95f;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);font-size:14px}
  .top{background:var(--blue);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .top .brand{font-size:17px;font-weight:900}.top .sub{font-size:11.5px;color:#cbd5e1}
  .top .right{margin-left:auto;font-size:11.5px;color:#cbd5e1;text-align:right}
  .wrap{max-width:1180px;margin:0 auto;padding:18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(15,23,42,.04);margin-bottom:14px}
  h2{margin:0 0 10px;font-size:18px}h3{margin:0 0 8px;font-size:15px;color:var(--blue)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 8px rgba(15,23,42,.04)}
  .kpi .ic{width:36px;height:36px;border-radius:10px;background:#eef4fb;display:flex;align-items:center;justify-content:center;font-size:18px}
  .kpi .v{font-size:22px;font-weight:900;line-height:1.1}.kpi .l{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:2px}
  .quick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-weight:800;font-size:12.5px;cursor:pointer}
  .btn:hover{background:#0a2f5a}
  .btn.green{background:#15803d}.btn.red{background:#b91c1c}.btn.out{background:#fff;color:#334155;border:1.5px solid #cbd5e1}
  .btn.sm{padding:6px 10px;font-size:11.5px}
  .badge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:800}
  .b-ok{background:#dcfce7;color:#166534}.b-wait{background:#fef3c7;color:#92400e}.b-bad{background:#fee2e2;color:#b91c1c}.b-info{background:#e0f2fe;color:#075985}.b-gray{background:#f1f5f9;color:#475569}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 9px;border-bottom:1px solid #eef2f7;text-align:left;font-size:12.5px;vertical-align:middle}
  th{background:#e8eef7;color:#334155;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
  tr:hover td{background:#f8fbff}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .filters input,.filters select{padding:7px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:12px;background:#fff;outline:none}
  .filters button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700;color:#475569;cursor:pointer}
  .filters button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .reqGrid{display:grid;grid-template-columns:380px 1fr;gap:14px}
  .list{max-height:60vh;overflow:auto}
  .item{border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:7px;cursor:pointer;background:#fff}
  .item:hover{border-color:#93c5fd;background:#f8fbff}
  .item.on{border-color:var(--blue);background:#eef6ff}
  .item .t{font-weight:800;font-size:12.5px}.item .m{font-size:11px;color:var(--muted);margin-top:2px}
  .meta{font-size:11.5px;color:var(--muted);line-height:1.6;margin-bottom:8px}
  .thread{display:flex;flex-direction:column;gap:8px;max-height:42vh;overflow:auto;padding:6px 2px;margin:8px 0}
  .msg{max-width:84%;padding:8px 11px;border-radius:11px;font-size:12.5px;line-height:1.5;white-space:pre-wrap}
  .msg.emp{align-self:flex-start;background:#eef6ff;border:1px solid #bfdbfe}
  .msg.rh{align-self:flex-end;background:#f0fdf4;border:1px solid #bbf7d0}
  .msg .who{font-size:10px;font-weight:800;color:#64748b;margin-bottom:2px}
  .msg .at{font-size:9.5px;color:#94a3b8;margin-top:3px;text-align:right}
  textarea,input,select{width:100%;padding:9px 10px;border:1.5px solid #cbd5e1;border-radius:9px;font-size:13px;font-family:inherit}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--blue)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:140px}
  .empty{padding:30px;text-align:center;color:#94a3b8;font-size:12.5px}
  .err{color:#b91c1c;font-size:12px;font-weight:700;min-height:16px;margin-top:6px}
  .pop{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
  .pop .box{background:#fff;border-radius:14px;max-width:400px;width:100%;padding:18px;text-align:center}
  @media(max-width:900px){.reqGrid{grid-template-columns:1fr}.list{max-height:38vh}}
  @media(max-width:760px){
    .comptes-tbl th:nth-child(3),.comptes-tbl td:nth-child(3),
    .comptes-tbl th:nth-child(5),.comptes-tbl td:nth-child(5),
    .comptes-tbl th:nth-child(6),.comptes-tbl td:nth-child(6),
    .comptes-tbl th:nth-child(7),.comptes-tbl td:nth-child(7),
    .comptes-tbl th:nth-child(8),.comptes-tbl td:nth-child(8),
    .comptes-tbl th:nth-child(10),.comptes-tbl td:nth-child(10){display:none}
    .comptes-tbl th:nth-child(2),.comptes-tbl td:nth-child(2){min-width:150px}
    .comptes-tbl th,.comptes-tbl td{padding:7px 6px;font-size:11px}
  }
</style>
</head>
<body>
<div class="top">
  <div><div class="brand">🌐 Espace employé</div><div class="sub">Comptes, accès et requêtes des employés</div></div>
  <div class="right" id="who"></div>
</div>
<div class="wrap" id="app"><div class="card"><div class="empty">Chargement…</div></div></div>
<script>
(function(){
  var API="https://montabbord-api.kkcj2019.workers.dev/api/portail";
  var SYNC="https://montabbord-api.kkcj2019.workers.dev/api/sync";
  function qs(n){try{return new URLSearchParams(location.search).get(n)||""}catch(e){return ""}}
  var uid=qs("uid")||localStorage.getItem("mdb_enterpriseUid")||"";
  try{ if(!uid){var raw=localStorage.getItem("mdb_currentUser")||"";var p=JSON.parse(raw);uid=(typeof p==="string")?p:((p&&p.id)||"");} }catch(e){}
  var me={nom:"Administration",role:"admin"};
  try{ var u=JSON.parse(localStorage.getItem("mdb_userDisplay")||localStorage.getItem("mdb_currentUser")||"null"); if(u){me.nom=u.nom||u.login||me.nom;me.role=(u.isAdmin||u.isSuperAdmin)?"admin":"rh";} }catch(e){}
  var state={employes:[],paye:{},requetes:[],sessions:[],open:null,filter:"toutes",reqSearch:"",empSearch:""};
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function money(n){n=parseFloat(n)||0;try{return n.toLocaleString("fr-FR")+" F"}catch(e){return n+" F"}}
  function fdt(d){if(!d)return "-";try{return new Date(d).toLocaleString("fr-FR")}catch(e){return d}}
  function fdate(d){if(!d)return "-";try{return new Date(String(d).slice(0,10)+"T00:00:00").toLocaleDateString("fr-FR")}catch(e){return d}}
  function mois(m){try{var d=new Date(String(m)+"-01T00:00:00");return d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}catch(e){return m}}
  function api(action,payload){return fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({uid:uid,action:action},payload||{}))}).then(function(r){return r.json().catch(function(){return {ok:false}})});}
  function getKey(cle){return fetch(SYNC+"?uid="+encodeURIComponent(uid)+"&cle="+encodeURIComponent(cle)+"&t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(j){var v=j&&j.data&&j.data[cle];if(typeof v==="string"){try{v=JSON.parse(v)}catch(e){v=null}}return v;}).catch(function(){return null;});}
  function getPrefix(prefix){return fetch(SYNC+"?uid="+encodeURIComponent(uid)+"&prefix="+encodeURIComponent(prefix)+"&t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(j){var d=(j&&j.data)||{},out={};for(var k in d){if(!d.hasOwnProperty(k))continue;var v=d[k];if(typeof v==="string"){try{v=JSON.parse(v)}catch(e){}}out[k]=v;}return out;}).catch(function(){return {};});}
  function badge(s){if(s==="acceptee")return '<span class="badge b-ok">Acceptée</span>';if(s==="refusee")return '<span class="badge b-bad">Refusée</span>';if(s==="en_cours")return '<span class="badge b-info">En cours</span>';if(s==="fermee")return '<span class="badge b-gray">Fermée</span>';return '<span class="badge b-wait">Ouverte</span>';}
  function typeLbl(t){return {reclamation:"Réclamation",permission:"Permission / absence",conge:"Congé",pret:"Prêt",acompte:"Acompte",pointage:"Contestation de pointage",autre:"Autre"}[t]||"Demande";}
  function norm(s){return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");}
  function compteDe(e){
    var pins=state.paye.employePins||{};
    if(pins[e.id]) return pins[e.id];
    for(var k in pins){if(pins.hasOwnProperty(k)&&pins[k]&&String(pins[k].matricule||"")===String(e.matricule||""))return pins[k];}
    return null;
  }
  function lastSession(empId){
    var arr=(state.sessions||[]).filter(function(s){return s&&String(s.empId)===String(empId);});
    arr.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
    return arr[0]||null;
  }
  function reqCount(empId){return (state.requetes||[]).filter(function(r){return r&&String(r.empId)===String(empId);}).length;}
  function dernierBulletin(empId){
    var arr=(state.paye&&state.paye.bulletinVerifs)||[];
    var list=arr.filter(function(b){return b&&String(b.empId)===String(empId);});
    list.sort(function(a,b){return String(b.mois||"").localeCompare(String(a.mois||""));});
    return list[0]||null;
  }
  window.__toggleBulletin=function(empId,moisBul,visible){
    api("adminbulletin",{empId:empId,mois:moisBul,visible:!visible}).then(function(j){
      if(j&&j.ok){ loadAll(); }
      else alert("Impossible de modifier la visibilité du bulletin (aucun bulletin pour cet employé).");
    }).catch(function(){ alert("Connexion impossible. Réessayez."); });
  };

  function loadAll(){
    if(!uid){document.getElementById("app").innerHTML='<div class="card"><div class="empty">Identifiant entreprise introuvable.</div></div>';return;}
    Promise.all([getKey("mdb_employes"),getKey("mdb_paye"),getPrefix("mdb_paye."),getKey("mdb_requetesEmploye"),getKey("mdb_portailSessions"),getKey("mdb_portailComptes"),getPrefix("mdb_portailPhoto:"),getKey("mdb_portailPhotos")]).then(function(res){
      state.employes=Array.isArray(res[0])?res[0]:[];
      var paye=(res[1]&&typeof res[1]==="object")?res[1]:{};
      var sec=res[2]||{};
      for(var k in sec){ if(!sec.hasOwnProperty(k)) continue; if(k.indexOf("mdb_paye.")===0){ paye[k.slice(9)]=sec[k]; } }
      var comptesPortail=(res[5]&&typeof res[5]==="object")?res[5]:{};
      paye.employePins=Object.assign({}, paye.employePins||{}, comptesPortail);
      state.paye=paye;
      var photos={};
      var prePhotos=res[6]||{};
      for(var pk in prePhotos){ if(!prePhotos.hasOwnProperty(pk)||pk.indexOf("mdb_portailPhoto:")!==0) continue; var pid=pk.slice("mdb_portailPhoto:".length); var pv=prePhotos[pk]; if(typeof pv==="string"){try{pv=JSON.parse(pv)}catch(e){}} if(pv) photos[pid]=pv; }
      var oldPhotos=(res[7]&&typeof res[7]==="object")?res[7]:{};
      for(var ok in oldPhotos){ if(!oldPhotos.hasOwnProperty(ok)) continue; if(!photos[ok]) photos[ok]=oldPhotos[ok]; }
      state.photos=photos;
      state.requetes=Array.isArray(res[3])?res[3]:[];
      state.sessions=Array.isArray(res[4])?res[4]:[];
      document.getElementById("who").textContent=me.nom+" · "+state.employes.length+" employé(s) · "+state.requetes.length+" requête(s)";
      renderAll();
    });
  }
  function renderAll(){
    var h='';
    h+='<div class="kpis" id="kpis">'+kpisHtml()+'</div>';
    h+='<div class="quick">'
      +'<button class="btn" onclick="window.__copyLink()">🔗 Copier le lien du portail</button>'
      +'<button class="btn out" onclick="window.__showQR()">🖨️ QR à imprimer</button>'
      +'<button class="btn out" onclick="window.open(\'espace-employe.html?uid='+encodeURIComponent(uid)+'\',\'_blank\')">👤 Ouvrir le portail</button>'
      +'<span class="meta" style="margin:0 0 0 auto">'+state.requetes.filter(function(r){return r.statut==="ouverte"||r.statut==="en_cours";}).length+' requête(s) à traiter</span>'
      +'</div>';
    h+='<div class="card" id="comptes"><h3>👥 Comptes & accès des employés</h3>'+accountsHtml()+'</div>';
    h+='<div class="card" id="photos"><h3>📷 Photos des employés</h3>'+photosHtml()+'</div>';
    h+='<div class="card" id="reqSection"><h3>📨 Requêtes des employés</h3>'+requestsHtml()+'</div>';
    document.getElementById("app").innerHTML=h;
    if(state.focus){var f=document.getElementById(state.focus.id);if(f){try{f.focus();f.setSelectionRange(state.focus.pos,state.focus.pos)}catch(e){}}state.focus=null;}
  }
  function kpisHtml(){
    var pins=state.paye.employePins||{};
    var accounts=0,self=0;
    for(var k in pins){if(pins.hasOwnProperty(k)&&pins[k]&&(pins[k].hash||pins[k].passwordHash)){accounts++;if(pins[k].self)self++;}}
    var open=state.requetes.filter(function(r){return r.statut==="ouverte"||r.statut==="en_cours";}).length;
    var payReq=state.requetes.filter(function(r){return (r.type==="pret"||r.type==="acompte")&&(r.statut==="ouverte"||r.statut==="en_cours");}).length;
    return '<div class="kpi"><div class="ic">👥</div><div><div class="v">'+state.employes.length+'</div><div class="l">Employés</div></div></div>'
      +'<div class="kpi"><div class="ic" style="background:#ecfdf5">🔐</div><div><div class="v" style="color:#15803d">'+accounts+'</div><div class="l">Comptes créés</div></div></div>'
      +'<div class="kpi"><div class="ic" style="background:#eff6ff">🙋</div><div><div class="v" style="color:#1d4ed8">'+self+'</div><div class="l">Auto-inscrits</div></div></div>'
      +'<div class="kpi"><div class="ic" style="background:#fffbeb">📨</div><div><div class="v" style="color:#b45309">'+open+'</div><div class="l">Requêtes à traiter</div></div></div>'
      +'<div class="kpi"><div class="ic" style="background:#f5f3ff">💳</div><div><div class="v" style="color:#6d28d9">'+payReq+'</div><div class="l">Prêts / acomptes</div></div></div>';
  }
  function photosHtml(){
    var list=state.employes.slice().sort(function(a,b){return String(a.nom||"").localeCompare(String(b.nom||""));});
    var nb=0; for(var k in (state.photos||{})){ if(state.photos.hasOwnProperty(k)) nb++; }
    var h='<div class="meta" style="margin:0 0 10px">'+nb+' photo(s) enregistrée(s). Cliquez sur 📷 pour ajouter ou changer la photo d’un employé.</div>';
    h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">';
    list.forEach(function(e){
      var ph=(state.photos&&state.photos[e.id])||e.photo||'';
      var ini=(((e.nom||'?').charAt(0))+((e.prenoms||'').charAt(0))).toUpperCase();
      var nom=((e.nom||'')+' '+(e.prenoms||'')).trim();
      h+='<div style="border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#fff">'
        +'<div style="width:74px;height:74px;margin:0 auto 8px;border-radius:50%;overflow:hidden;background:#eef4fb;display:flex;align-items:center;justify-content:center;font-weight:900;color:#0b3a6f;font-size:18px">'
        +(ph?'<img src="'+esc(ph)+'" alt="" style="width:100%;height:100%;object-fit:cover">':esc(ini))
        +'</div>'
        +'<div style="font-size:11.5px;font-weight:800;line-height:1.25">'+esc(nom||'—')+'</div>'
        +'<div class="meta" style="margin:2px 0 7px">'+esc(e.matricule||'')+'</div>'
        +'<button class="btn out sm" onclick="window.__photoEmp(\''+esc(e.id)+'\')">📷 '+(ph?'Changer':'Ajouter')+'</button>'
        +'</div>';
    });
    h+='</div>';
    return h;
  }
  window.__photoEmp=function(empId){
    var inp=document.createElement("input");inp.type="file";inp.accept="image/*";
    inp.onchange=function(){
      var f=inp.files&&inp.files[0]; if(!f) return;
      var rd=new FileReader();
      rd.onload=function(ev){
        var img=new Image();
        img.onload=function(){
          try{
            var size=260,r=Math.min(size/img.width,size/img.height,1);
            var c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));
            c.getContext("2d").drawImage(img,0,0,c.width,c.height);
            var data=c.toDataURL("image/jpeg",0.82);
            api("adminphoto",{empId:empId,photo:data}).then(function(j){
              if(j&&j.ok){ state.photos=state.photos||{}; state.photos[empId]=data; renderAll(); }
              else alert("Photo non enregistrée. Réessayez.");
            }).catch(function(){ alert("Connexion impossible. Réessayez."); });
          }catch(e){ alert("Image illisible."); }
        };
        img.onerror=function(){ alert("Image illisible."); };
        img.src=ev.target.result;
      };
      rd.readAsDataURL(f);
    };
    inp.click();
  };
  function accountsHtml(){
    var q=norm(state.empSearch);
    var list=state.employes.slice().sort(function(a,b){return String(a.nom||"").localeCompare(String(b.nom||""));});
    if(q)list=list.filter(function(e){return norm((e.nom||"")+" "+(e.prenoms||"")+" "+(e.matricule||"")+" "+(e.fonction||"")).indexOf(q)!==-1;});
    var h='<div class="filters"><input id="empSearch" placeholder="🔎 Rechercher un employé, matricule, login…" value="'+esc(state.empSearch)+'" oninput="window.__empSearch(this.value)" style="flex:1;min-width:220px;max-width:340px"><span class="meta" style="margin:0 0 0 auto">'+list.length+' employé(s)</span></div>';
    h+='<div style="overflow:auto;max-height:50vh;border:1px solid var(--line);border-radius:10px"><table class="comptes-tbl"><thead><tr><th>Compte</th><th>Employé</th><th>Matricule</th><th>Login</th><th>Mot de passe</th><th>PIN</th><th>Origine</th><th>Dernière connexion</th><th>Requêtes</th><th>Bulletin</th><th></th></tr></thead><tbody>';
    if(!list.length)h+='<tr><td colspan="11"><div class="empty">Aucun employé.</div></td></tr>';
    list.forEach(function(e){
      var rec=compteDe(e),ls=lastSession(e.id);
      var login=rec&&rec.login?rec.login:"-";
      var aCompte=!!(rec&&(rec.login||rec.passwordHash||rec.hash||rec.pinHash));
      var pass=rec&&rec.passwordHash?'<span class="badge b-ok">défini</span>':'<span class="badge b-gray">-</span>';
      var pin=(rec&&(rec.hash||rec.pinHash))?'<span class="badge b-ok">défini</span>':'<span class="badge b-gray">-</span>';
      var src=rec?(rec.self?'<span class="badge b-info">Employé</span>':'<span class="badge b-gray">Admin</span>'):'<span class="badge b-gray">-</span>';
      var bul=dernierBulletin(e.id);
      var bulCell=bul
        ? '<div style="font-size:10.5px;font-weight:800;color:#0b3a6f;margin-bottom:3px">'+esc(mois(bul.mois))+'</div>'
          + '<button class="btn '+(bul.visible?'green':'out')+' sm" onclick="window.__toggleBulletin(\''+esc(e.id)+'\',\''+esc(bul.mois||'')+'\','+(bul.visible?'true':'false')+')">'+(bul.visible?'Publié':'Publier')+'</button>'
        : '<span class="badge b-gray">—</span>';
      h+='<tr><td>'+(aCompte?'<span class="badge b-ok">Créé</span>':'<span class="badge b-gray">Aucun</span>')+'</td>'
        +'<td><b>'+esc(((e.nom||"")+" "+(e.prenoms||"")).trim())+'</b><div class="meta" style="margin:0">'+esc(e.fonction||"")+'</div></td>'
        +'<td>'+esc(e.matricule||"-")+'</td><td>'+esc(login)+'</td><td>'+pass+'</td><td>'+pin+'</td><td>'+src+'</td>'
        +'<td>'+esc(ls?fdt(ls.createdAt):"-")+'</td><td style="text-align:center">'+reqCount(e.id)+'</td>'
        +'<td>'+bulCell+'</td>'
        +'<td><button class="btn out sm" onclick="window.__voirRequetes(\''+esc(e.nom||"")+'\')">Voir requêtes</button></td></tr>';
    });
    h+='</tbody></table></div>';
    return h;
  }
  function filteredReq(){
    var q=norm(state.reqSearch);
    return state.requetes.filter(function(r){
      if(state.filter!=="toutes"&&r.statut!==state.filter)return false;
      if(q){var s=norm((r.nom||"")+" "+(r.matricule||"")+" "+(r.sujet||"")+" "+(r.message||"")+" "+typeLbl(r.type));if(s.indexOf(q)===-1)return false;}
      return true;
    }).sort(function(a,b){return String(b.updatedAt||b.createdAt||"").localeCompare(String(a.updatedAt||a.createdAt||""));});
  }
  function requestsHtml(){
    var h='<div class="filters">';
    var fs=[["toutes","Toutes"],["ouverte","Ouvertes"],["en_cours","En cours"],["acceptee","Acceptées"],["refusee","Refusées"],["fermee","Fermées"]];
    fs.forEach(function(f){h+='<button class="'+(state.filter===f[0]?"on":"")+'" onclick="window.__filter(\''+f[0]+'\')">'+f[1]+'</button>';});
    h+='<input id="reqSearch" placeholder="🔎 Rechercher…" value="'+esc(state.reqSearch)+'" oninput="window.__reqSearch(this.value)" style="max-width:240px;margin-left:auto"></div>';
    var arr=filteredReq();
    h+='<div class="reqGrid"><div class="list">';
    if(!arr.length)h+='<div class="empty">Aucune requête dans ce filtre.</div>';
    arr.forEach(function(r){
      var last=(r.messages||[])[(r.messages||[]).length-1]||{};
      h+='<div class="item '+(state.open===r.id?"on":"")+'" onclick="window.__open(\''+esc(r.id)+'\')"><div class="t">'+esc(typeLbl(r.type))+(r.sujet?" — "+esc(r.sujet):"")+'</div>'
        +'<div class="m">'+badge(r.statut)+' · '+esc(r.nom||"")+' · '+esc(fdt(r.updatedAt||r.createdAt))+'</div>'
        +'<div class="m" style="color:#334155">'+esc(String(last.texte||r.message||"").slice(0,90))+'</div></div>';
    });
    h+='</div><div class="card" style="margin:0">'+detailHtml()+'</div></div>';
    return h;
  }
  function detailHtml(){
    var r=state.requetes.filter(function(x){return x.id===state.open;})[0];
    if(!r)return '<div class="empty">Sélectionnez une requête pour voir la discussion.</div>';
    var h='<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h3 style="margin:0">'+esc(typeLbl(r.type))+(r.sujet?" — "+esc(r.sujet):"")+'</h3>'
      +'<div class="meta">'+badge(r.statut)+' · '+esc(r.nom||"")+' ('+esc(r.matricule||"")+') · '+esc(fdt(r.createdAt))+'</div></div>';
    var _isPay=(r.type==="pret"||r.type==="acompte");
    h+='<div class="row" style="max-width:420px">'
      +(_isPay?'':'<button class="btn green sm" onclick="window.__decision(\''+esc(r.id)+'\',\'acceptee\')">✅ Accepter</button>')
      +'<button class="btn red sm" onclick="window.__decision(\''+esc(r.id)+'\',\'refusee\')">❌ Refuser</button>'
      +'<button class="btn out sm" onclick="window.__decision(\''+esc(r.id)+'\',\'fermee\')">Fermer</button>'
      +'<button class="btn out sm" onclick="window.__deleteReq(\''+esc(r.id)+'\')" style="color:#b91c1c;border-color:#fecaca">🗑 Supprimer</button></div></div>';
    if(r.type==="permission"||r.type==="conge"){
      h+='<div class="meta" style="margin-top:8px">Du <b>'+esc(fdate(r.dateDebut))+'</b> au <b>'+esc(fdate(r.dateFin))+'</b>'
        +(r.dureeJours?' · '+r.dureeJours+' jour(s)':'')+(r.retourEstime?' · retour estimé '+esc(fdate(r.retourEstime)):'')
        +(r.motif?'<br>Motif : '+esc(r.motif):'')+'</div>';
    }
    if(r.type==="pointage"){
      h+='<div class="meta" style="margin-top:8px">Date contestée : <b>'+esc(fdate(r.datePointage))+'</b>'
        +(r.correction==="heures"?' · heures : '+ (r.heuresJour||0)+' h jour / '+(r.heuresNuit||0)+' h nuit':r.correction==="present"?' · demande : présent':' · autre correction')+'</div>';
    }
    if(_isPay){
      h+='<div class="meta" style="margin-top:8px">Montant demandé : <b>'+money(r.montant)+'</b>'+(r.moisDeduction?' · déduction : '+esc(mois(r.moisDeduction)):'')+'</div>';
      if(r.statut!=="acceptee"){
        h+='<div class="card" style="margin-top:8px;background:#f8fafc"><div class="meta" style="margin:0 0 6px"><b>Validation et paiement</b> — choisissez la source et le mois de prélèvement.</div>'
          +'<div class="row"><div><label style="font-size:11px;font-weight:800">Source</label><select id="pay-type" onchange="window.__loadSources()"><option value="caisse">Caisse</option><option value="banque">Banque</option></select></div>'
          +'<div><label style="font-size:11px;font-weight:800">Caisse / banque</label><select id="pay-source"></select></div>'
          +'<div><label style="font-size:11px;font-weight:800">Montant accordé</label><input type="number" id="pay-montant" min="0" step="1000" value="'+(Math.round(parseFloat(r.montant)||0))+'"></div>'
          +'<div><label style="font-size:11px;font-weight:800">Mois de déduction</label><input type="month" id="pay-mois" value="'+(r.moisDeduction||"")+'"></div>'
          +'<div style="max-width:180px"><button class="btn green sm" style="width:100%" onclick="window.__acceptPay(\''+esc(r.id)+'\')">✅ Accepter et payer</button></div></div></div>';
      } else if(r.traitement&&r.traitement.paiement){
        h+='<div class="meta" style="margin-top:8px;color:#166534"><b>✅ Paiement enregistré</b> — '+esc(r.traitement.sourceType==="banque"?"Banque":"Caisse")+' '+esc(r.traitement.sourceName||"")+' · '+money(r.traitement.montant)+' · déduction '+esc(mois(r.traitement.moisDeduction||""))+'</div>';
      }
    }
    h+='<div class="thread">';
    (r.messages||[]).forEach(function(m){var emp=m.auteur==="employe";h+='<div class="msg '+(emp?"emp":"rh")+'"><div class="who">'+esc(emp?(r.nom||"Employé"):(m.nom||"Administration"))+'</div>'+esc(m.texte)+'<div class="at">'+esc(fdt(m.at))+'</div></div>';});
    h+='</div>';
    h+='<div class="row"><textarea id="rep" rows="3" placeholder="Répondre à l’employé…"></textarea><button class="btn sm" style="max-width:120px" onclick="window.__reply(\''+esc(r.id)+'\')">Envoyer</button></div><div class="err" id="err"></div>';
    if(_isPay&&r.statut!=="acceptee")setTimeout(function(){try{window.__loadSources();}catch(e){}},30);
    return h;
  }
  window.__filter=function(f){state.filter=f;state.focus={id:"reqSearch",pos:state.reqSearch.length};renderAll();};
  window.__reqSearch=function(v){state.reqSearch=v;state.focus={id:"reqSearch",pos:v.length};renderAll();};
  window.__empSearch=function(v){state.empSearch=v;state.focus={id:"empSearch",pos:v.length};renderAll();};
  window.__open=function(id){state.open=id;renderAll();};
  window.__voirRequetes=function(nom){state.reqSearch=nom;state.filter="toutes";state.open=null;renderAll();setTimeout(function(){var el=document.getElementById("reqSection");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});},30);};
  window.__reply=function(id){var t=(document.getElementById("rep")||{}).value||"";if(!t.trim())return;api("adminreply",{requestId:id,texte:t.trim(),nom:me.nom,role:me.role}).then(function(j){if(j&&j.ok){loadAll();state.open=id;}else{document.getElementById("err").textContent="Envoi impossible.";}});};
  window.__decision=function(id,statut){var com=window.prompt(statut==="acceptee"?"Commentaire d’acceptation (facultatif) :":statut==="refusee"?"Motif du refus :":"Commentaire :","");if(com===null)return;api("admindecision",{requestId:id,statut:statut,commentaire:com,nom:me.nom,role:me.role}).then(function(j){if(j&&j.ok){loadAll();state.open=id;}else alert("Validation impossible : "+(j&&j.code||"erreur"));});};
  window.__deleteReq=function(id){if(!window.confirm("Supprimer définitivement cette requête ?"))return;api("admindelete",{requestId:id}).then(function(j){if(j&&j.ok){state.open=null;loadAll();}else alert("Suppression impossible : "+(j&&j.code||"erreur"));}).catch(function(){alert("Connexion impossible. Réessayez.");});};
  window.__loadSources=function(){var type=(document.getElementById("pay-type")||{}).value||"caisse";var cle=type==="banque"?"mdb_banques":"mdb_caisses";var sel=document.getElementById("pay-source");if(sel)sel.innerHTML='<option value="">Chargement…</option>';fetch(SYNC+"?uid="+encodeURIComponent(uid)+"&cle="+cle+"&t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(j){var v=j&&j.data&&j.data[cle];if(typeof v==="string"){try{v=JSON.parse(v)}catch(e){v=null}}var arr=Array.isArray(v)?v:[];if(!sel)return;sel.innerHTML=arr.length?arr.map(function(s){return '<option value="'+esc(s.id)+'">'+esc(s.nom||s.libelle||s.code||"Sans nom")+'</option>';}).join(""):'<option value="">Aucune source</option>';}).catch(function(){if(sel)sel.innerHTML='<option value="">Erreur</option>';});};
  window.__acceptPay=function(id){var type=(document.getElementById("pay-type")||{}).value||"caisse";var sourceId=(document.getElementById("pay-source")||{}).value||"";var m=(document.getElementById("pay-mois")||{}).value||"";var mt=parseFloat((document.getElementById("pay-montant")||{}).value||0);if(!sourceId){alert("Choisissez la caisse ou la banque.");return;}if(!/^\d{4}-\d{2}$/.test(m)){alert("Choisissez le mois de déduction.");return;}if(!(mt>0)){alert("Saisissez le montant accordé.");return;}var com=window.prompt("Commentaire d’acceptation (facultatif) :","");if(com===null)return;api("admindecision",{requestId:id,statut:"acceptee",commentaire:com,sourceType:type,sourceId:sourceId,moisDeduction:m,montant:mt,nom:me.nom,role:me.role}).then(function(j){if(j&&j.ok){loadAll();state.open=id;}else alert("Validation impossible : "+(j&&j.code||"erreur"));});};
  window.__copyLink=function(){var url=location.origin+"/espace-employe.html?uid="+encodeURIComponent(uid);if(navigator.clipboard){navigator.clipboard.writeText(url);alert("Lien copié :\n"+url);}else prompt("Lien du portail :",url);};
  window.__showQR=function(){var url=location.origin+"/espace-employe.html?uid="+encodeURIComponent(uid);var qr="https://api.qrserver.com/v1/create-qr-code/?size=600x600&data="+encodeURIComponent(url);var ov=document.createElement("div");ov.className="pop";ov.onclick=function(e){if(e.target===ov)ov.remove();};ov.innerHTML='<div class="box"><h3 style="margin:0 0 8px">QR du portail employé</h3><img src="'+qr+'" style="width:300px;height:300px;max-width:100%;border:1px solid #e2e8f0;border-radius:10px;display:block;margin:0 auto"><div style="font-size:10.5px;color:#475569;word-break:break-all;margin-top:8px">'+esc(url)+'</div><div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="window.__printQR()">🖨️ Imprimer l’affiche</button><a class="btn out" href="'+esc(url)+'" target="_blank" rel="noopener">Ouvrir</a> <button class="btn out" onclick="this.closest(\'.pop\').remove()">Fermer</button></div></div>';document.body.appendChild(ov);};
window.__printQR=function(){
  var url=location.origin+"/espace-employe.html?uid="+encodeURIComponent(uid);
  var qr="https://api.qrserver.com/v1/create-qr-code/?size=600x600&data="+encodeURIComponent(url);
  var soc={}; try{ soc=JSON.parse(localStorage.getItem("mdb_entreprise")||"{}")||{}; }catch(e){}
  var ouvrir=function(ent){
    ent=ent||{};
    var nom=ent.nom||soc.nom||"ACSER";
    var logo=ent.logo||soc.logo||"logo-512.png";

    var html='<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>QR Espace employé</title><style>'
      +'@page{size:A4;margin:14mm}'
      +'body{font-family:Arial,Helvetica,sans-serif;margin:0;color:#0f172a}'
      +'.sheet{max-width:760px;margin:0 auto;text-align:center;border:2px solid #0b3a6f;border-radius:18px;padding:26px 28px}'

      +'.sub{font-size:13px;color:#475569;margin-bottom:16px}'
      +'.qr{width:320px;height:320px;margin:0 auto;display:block;border:1px solid #e2e8f0;border-radius:10px;padding:8px;background:#fff}'
      +'.steps{text-align:left;max-width:540px;margin:18px auto 0;font-size:13px;line-height:1.8}'
      +'.steps b{color:#0b3a6f}'
      +'.foot{margin-top:16px;font-size:10px;color:#64748b;word-break:break-all}'
      +'.print{margin:18px auto 0;display:block;padding:10px 18px;font-size:14px;font-weight:800;background:#0b3a6f;color:#fff;border:none;border-radius:9px;cursor:pointer}'
      +'@media print{.print{display:none}}'
      +'</style></head><body><div class="sheet">'
      +'<img class="logo" src="'+esc(logo)+'" alt="logo">'
      +'<div class="brand">'+esc(nom)+'</div>'
      +'<div class="title">ESPACE EMPLOYÉ</div>'
      +'<div class="sub">Scannez ce QR code pour accéder à votre espace personnel</div>'
      +'<img class="qr" src="'+qr+'" alt="QR espace employé">'
      +'<div class="steps">'
      +'<div><b>1.</b> Scannez le QR avec votre téléphone.</div>'
      +'<div><b>2.</b> Connectez-vous avec votre <b>nom / matricule / téléphone</b> et votre <b>code PIN</b>.</div>'
      +'<div><b>3.</b> Pas encore de compte ? Cliquez sur <b>« Créer mon compte employé »</b> et vérifiez avec votre téléphone ou votre date de naissance.</div>'
      +'<div><b>4.</b> Consultez votre pointage, votre paie, vos acomptes et envoyez vos requêtes.</div>'
      +'</div>'
      +'<div class="foot">'+esc(url)+'</div>'
      +'</div><button class="print" onclick="window.print()">🖨️ Imprimer</button></body></html>';
    w.document.write(html); w.document.close();
    setTimeout(function(){ try{ w.focus(); }catch(e){} }, 400);
  };
  getKey("mdb_entreprise").then(function(ent){ ouvrir(ent); }).catch(function(){ ouvrir(null); });
};

  loadAll();
})();
