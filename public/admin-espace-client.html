<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Espace client — administration</title>
<style>
  :root{--navy:#0b3a6f;--teal:#0e7490;--gold:#ecc95f;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f4f7fb;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,Segoe UI,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  button,input,select,textarea{font-family:inherit}
  .adTop{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 18px;background:linear-gradient(120deg,#071a33,#0b3a6f 58%,#0e7490);color:#fff;box-shadow:0 6px 22px rgba(2,20,45,.28)}
  .adTop img{width:50px;height:50px;object-fit:contain;background:#fff;border-radius:12px;padding:4px;display:block}
  .adBrand{flex:1;min-width:0}
  .adBrand b{display:block;font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .adBrand span{display:block;font-size:11px;color:#cbd5e1;margin-top:2px}
  .adTopRight{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .adBtn{border:none;border-radius:10px;padding:9px 13px;font-size:12px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .adBtn.primary{background:linear-gradient(135deg,#ecc95f,#f6df9a);color:#0b3a6f}
  .adBtn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28)}
  .adBtn.sm{padding:7px 10px;font-size:11px}
  .adBtn.dark{background:#0b3a6f;color:#fff}
  .adBtn.dang{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
  .adWrap{max-width:1240px;margin:0 auto;padding:18px}
  .adTabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 4px 16px rgba(15,23,42,.05)}
  .adTab{border:none;background:transparent;padding:9px 14px;border-radius:10px;font-size:12.5px;font-weight:800;color:#475569;cursor:pointer}
  .adTab.on{background:linear-gradient(135deg,#0b3a6f,#0e7490);color:#fff;box-shadow:0 6px 16px rgba(11,58,111,.25)}
  .adCard{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(15,23,42,.06);padding:18px;margin-bottom:14px}
  .adCard h2{margin:0 0 4px;font-size:16px;font-weight:900}
  .adCard h3{margin:0 0 6px;font-size:14px;font-weight:900}
  .adNote{font-size:11.5px;color:var(--muted);line-height:1.5}
  .adGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .adThumb{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 4px 14px rgba(15,23,42,.05)}
  .adThumb .im{height:140px;background:#e8eef7;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .adThumb .im img{width:100%;height:100%;object-fit:cover;display:block}
  .adThumb .bd{padding:10px;font-size:11.5px}
  .adThumb .bd b{display:block;font-size:12.5px;font-weight:900}
  .adThumb .bd .pr{color:var(--navy);font-weight:900;margin-top:2px}
  .adForm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .adField label{display:block;font-size:10.5px;font-weight:900;color:#475569;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .adField input,.adField select,.adField textarea{width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;outline:none;background:#fff}
  .adField textarea{min-height:70px;resize:vertical}
  .adField.wide{grid-column:1/-1}
  .adList{display:flex;flex-direction:column;gap:9px}
  .adItem{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}
  .adItem .t{font-size:13px;font-weight:900}
  .adItem .m{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .adBadge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:900;margin-left:6px}
  .b-new{background:#e0f2fe;color:#075985}.b-wait{background:#fef3c7;color:#92400e}.b-ok{background:#dcfce7;color:#166534}.b-bad{background:#fee2e2;color:#b91c1c}.b-gray{background:#f1f5f9;color:#475569}
  .adThread{display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow:auto;padding:8px 4px;margin:8px 0;background:#f8fafc;border:1px solid var(--line);border-radius:12px}
  .adMsg{max-width:82%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.45}
  .adMsg.admin{align-self:flex-end;background:linear-gradient(135deg,#0b3a6f,#0e7490);color:#fff;border-bottom-right-radius:4px}
  .adMsg.client{align-self:flex-start;background:#fff;border:1px solid var(--line);color:#1e293b;border-bottom-left-radius:4px}
  .adMsg .who{font-size:9.5px;font-weight:900;opacity:.8;margin-bottom:2px;text-transform:uppercase}
  .adMsg .at{font-size:9px;opacity:.65;margin-top:3px}
  .adEmpty{padding:24px 12px;text-align:center;color:var(--muted);font-size:12.5px}
  .adStatus{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:900;border:1px solid transparent}
  .adStatus.on{background:#dcfce7;color:#166534;border-color:#bbf7d0}
  .adStatus.off{background:#fef3c7;color:#92400e;border-color:#fde68a}
  .adLink{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:9px 11px;font-size:11.5px;color:#334155;margin-top:8px;word-break:break-all}
  .adLink code{font-size:11px;background:#eef2f7;padding:3px 6px;border-radius:6px}
  .adErr{color:var(--bad);font-size:12px;font-weight:800;min-height:16px}
  .adOk{color:var(--ok);font-size:12px;font-weight:800}
  @media(max-width:720px){.adTop{padding:10px 12px}.adWrap{padding:12px}.adForm{grid-template-columns:1fr}.adTop img{width:42px;height:42px}.adBrand b{font-size:14px}.adTopRight .adBtn{padding:7px 9px;font-size:11px}}
</style>
</head>
<body>
<header class="adTop" id="adTop">
  <img id="adLogo" src="logo-192.png" alt="">
  <div class="adBrand"><b id="adNom">Espace client</b><span>Administration · galerie, cotations, commandes et messages</span></div>
  <div class="adTopRight">
    <span id="adPresence" class="adStatus off">Hors ligne</span>
    <button class="adBtn ghost sm" id="adTogglePresence">Me rendre disponible</button>
    <button class="adBtn primary sm" id="adOpenClient">Ouvrir l’espace client</button>
    <button class="adBtn ghost sm" onclick="location.href='index.html'">← Application</button>
  </div>
</header>
<div class="adWrap">
  <div id="adBody"><div class="adCard"><div class="adEmpty">Chargement…</div></div></div>
</div>
<script>
(function () {
  'use strict';
  var API = '/api/sync';
  var UID = '';
  try { UID = (localStorage.getItem('mdb_enterpriseUid') || localStorage.getItem('mdb_lastLoginUid') || '').replace(/^["']+|["']+$/g, '').trim(); } catch (e) {}
  var ADMIN = 'Service commercial';
  try {
    var u = JSON.parse(localStorage.getItem('mdb_userDisplay') || '{}');
    if (u && u.nom) ADMIN = u.nom;
  } catch (e) {}
  var S = { ent: {}, gallery: [], accounts: {}, quotes: [], orders: [], threads: [], presence: null, tab: 'galerie', thread: null, busy: false, content: {}, partners: [], reviews: [],
    catalog: [], catalogLoaded: false, tombs: {}, meta: null, legacy: [], gallerySearch: '' };
  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) { try { return new Intl.NumberFormat('fr-FR').format(Math.round(parseFloat(n) || 0)); } catch (e) { return String(Math.round(parseFloat(n) || 0)); } }
  function money(n) { return fmt(n) + ' F'; }
  function uid() { return 'CX' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase(); }
  function fmtDT(t) { if (!t) return '-'; try { return new Date(t).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return '-'; } }
  function statusBadge(s) {
    s = String(s || '').toLowerCase();
    if (s === 'nouvelle') return '<span class="adBadge b-new">Nouvelle</span>';
    if (s === 'en_cours' || s === 'en cours') return '<span class="adBadge b-wait">En cours</span>';
    if (s === 'validee' || s === 'confirmee' || s === 'confirmée') return '<span class="adBadge b-ok">Confirmée</span>';
    if (s === 'livree' || s === 'livrée') return '<span class="adBadge b-ok">Livrée</span>';
    if (s === 'annulee' || s === 'annulée') return '<span class="adBadge b-bad">Annulée</span>';
    if (s === 'fermee' || s === 'fermée') return '<span class="adBadge b-gray">Fermée</span>';
    return '<span class="adBadge b-gray">' + esc(s || '-') + '</span>';
  }

  async function syncGet(key) {
    if (!UID) return null;
    try {
      var r = await fetch(API + '?uid=' + encodeURIComponent(UID) + '&cle=' + encodeURIComponent(key) + '&t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return null;
      var j = await r.json();
      return (j && j.data && j.data[key] !== undefined) ? j.data[key] : null;
    } catch (e) { return null; }
  }
  async function syncSet(key, val) {
    if (!UID) throw new Error('uid');
    var body = { uid: UID, updates: {} }; body.updates[key] = val;
    var r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('sync');
    return true;
  }
  async function loadAll() {
    S.ent = (await syncGet('mdb_entreprise')) || {};
    try {
      var pub = {
        nom: S.ent.nom || S.ent.sigle || '',
        sigle: S.ent.sigle || '',
        logo: S.ent.logo || '',
        telephone: S.ent.telephone || S.ent.tel || '',
        email: S.ent.email || '',
        adresse: S.ent.adresse || ''
      };
      await syncSet('mdb_clientPublic', pub);
    } catch (ePub) {}
    S.gallery = (await syncGet('mdb_clientGallery')) || [];
    S.content = (await syncGet('mdb_clientContent')) || {};
    S.partners = (await syncGet('mdb_clientPartners')) || [];
    S.reviews = (await syncGet('mdb_clientReviews')) || [];
    /* Galerie = produits finis du catalogue Index (Nomenclature), plus les
       retouches locales (photo / description / masqué). Aucune saisie de
       produit ici : l'Index en est la seule source. */
    S.catalog = (await syncGet('mdb_nomenclature')) || [];
    S.catalogLoaded = Array.isArray(S.catalog);
    S.catalog = S.catalogLoaded ? S.catalog : [];
    S.tombs = (await syncGet('mdb_tombstones')) || {};
    S.meta = await syncGet('mdb_clientGalleryMeta');
    S.legacy = (await syncGet('mdb_clientGalleryLegacy')) || [];
    if (!S.meta || typeof S.meta !== 'object' || Array.isArray(S.meta)) await migrateGalerie(S.gallery);
    await publishGalerie(true);
    S.accounts = (await syncGet('mdb_clientAccounts')) || {};
    S.quotes = (await syncGet('mdb_clientQuotes')) || [];
    S.orders = (await syncGet('mdb_clientOrders')) || [];
    S.threads = (await syncGet('mdb_clientThreads')) || [];
    S.presence = (await syncGet('mdb_clientPresence')) || null;
  }
  function renderTop() {
    el('adLogo').src = S.ent.logo || 'logo-192.png';
    el('adNom').textContent = (S.ent.nom || 'Montabbord') + ' — Espace client';
    var online = !!(S.presence && S.presence.dispo !== false && (Date.now() - (S.presence.at || 0) < 5 * 60 * 1000));
    var st = el('adPresence');
    st.className = 'adStatus ' + (online ? 'on' : 'off');
    st.textContent = online ? 'Disponible' : 'Hors ligne';
    el('adTogglePresence').textContent = online ? 'Me mettre hors ligne' : 'Me rendre disponible';
  }
  function render() {
    renderTop();
    var clientLink = location.origin + '/espace-client.html?uid=' + encodeURIComponent(UID);
    var h = '<div class="adCard" style="padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><b style="font-size:12px;color:#334155">🔗 Lien client à partager :</b><code style="font-size:11px;background:#eef2f7;padding:4px 7px;border-radius:6px;word-break:break-all;flex:1;min-width:200px">' + esc(clientLink) + '</code><button class="adBtn dark sm" onclick="adCopyLink()">Copier</button></div>';
    h += '<div class="adTabs">';
    [['galerie', 'Galerie'], ['vitrine', 'Vitrine'], ['avis', 'Avis'], ['cotations', 'Cotations'], ['commandes', 'Commandes'], ['messages', 'Messages'], ['clients', 'Clients']].forEach(function (t) {
      h += '<button class="adTab ' + (S.tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '">' + t[1] + (t[0] === 'cotations' && S.quotes.filter(function (q) { return q.statut === 'nouvelle'; }).length ? ' (' + S.quotes.filter(function (q) { return q.statut === 'nouvelle'; }).length + ')' : '') + '</button>';
    });
    h += '</div><div id="adTabBody"></div>';
    el('adBody').innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll('.adTab'), function (b) { b.onclick = function () { S.tab = b.getAttribute('data-tab'); S.thread = null; render(); }; });
    var body = el('adTabBody');
    if (S.tab === 'galerie') { body.innerHTML = tabGalerie(); bindGalerie(); }
    else if (S.tab === 'vitrine') { body.innerHTML = tabVitrine(); bindVitrine(); }
    else if (S.tab === 'avis') body.innerHTML = tabAvis();
    else if (S.tab === 'cotations') body.innerHTML = tabCotations();
    else if (S.tab === 'commandes') body.innerHTML = tabCommandes();
    else if (S.tab === 'messages') { body.innerHTML = tabMessages(); bindMessages(); }
    else body.innerHTML = tabClients();
  }

  /* ================= Catalogue Index → galerie client ================= */
  function normCode(c) { return String(c == null ? '' : c).trim().toUpperCase(); }
  function normTxt(s) { return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
  function numTxt(n) { return String(n).replace('.', ','); }
  function dimsArticle(a) {
    var l = parseFloat(a && (a.longueur != null ? a.longueur : a.length)) || 0;
    var w = parseFloat(a && (a.largeur != null ? a.largeur : a.width)) || 0;
    var t = parseFloat(a && (a.epaisseur != null ? a.epaisseur : a.thickness)) || 0;
    var p = [];
    if (l > 0) p.push(numTxt(l));
    if (w > 0) p.push(numTxt(w));
    if (t > 0) p.push(numTxt(t));
    return p.join(' × ') + (p.length ? ' cm' : '');
  }
  function prixArticle(a) {
    var per = (a && a.prixPeriodes) || [];
    var today = new Date().toISOString().slice(0, 10);
    for (var i = 0; i < per.length; i++) {
      var p = per[i] || {};
      if (p.dateDebut && p.dateFin && today >= p.dateDebut && today <= p.dateFin) return parseFloat(p.prixUnitaire) || 0;
    }
    if (per.length) return parseFloat(per[per.length - 1].prixUnitaire) || 0;
    return parseFloat(a && (a.prix_vente || a.prixUnitaire || a.prix)) || 0;
  }
  function estProduitFini(a) {
    var t = String((a && a.typeArticle) || '').toLowerCase();
    var c = String((a && a.categorie) || '').toLowerCase();
    return t === 'produit_fini' || t === 'produit fini' || c === 'finished' || c === 'produit_fini';
  }
  function catalogueFinis() {
    var arr = Array.isArray(S.catalog) ? S.catalog : [];
    var ts = (S.tombs && S.tombs['mdb_nomenclature']) || {};
    var tc = (S.tombs && S.tombs['mdb_nomenclature_code']) || {};
    return arr.filter(function (a) {
      if (!a || !a.code) return false;
      if (!estProduitFini(a)) return false;
      if (a.commercialise === false) return false;
      if (a.id && ts[a.id]) return false;
      if ((+tc[normCode(a.code)] || 0) > 0) return false;
      return true;
    }).sort(function (a, b) {
      return String(a.designation || a.code).localeCompare(String(b.designation || b.code), 'fr', { numeric: true });
    });
  }
  function metaDe(code) {
    var m = S.meta && S.meta[normCode(code)];
    return (m && typeof m === 'object') ? m : {};
  }
  function descAuto(a) {
    var d = dimsArticle(a);
    return d ? 'Dimensions : ' + d : '';
  }
  function galerieItems() {
    return catalogueFinis().map(function (a) {
      var code = normCode(a.code);
      var m = metaDe(code);
      var imgs = [];
      if (Array.isArray(a.photos) && a.photos.length) imgs = a.photos.filter(Boolean).slice(0, 6);
      else if (a.photo) imgs = [a.photo];
      else if (Array.isArray(m.photos) && m.photos.length) imgs = m.photos.filter(Boolean).slice(0, 6);
      else if (m.photo) imgs = [m.photo];
      return {
        id: 'pf_' + code.replace(/[^A-Z0-9_-]/g, '_'),
        code: a.code,
        titre: a.designation || a.code,
        prix: prixArticle(a),
        description: (a.descriptionClient ? a.descriptionClient : (m.description != null ? m.description : descAuto(a))),
        image: imgs[0] || '',
        images: imgs,
        actif: m.actif !== false,
        source: 'index'
      };
    });
  }
  var _galSig = null;
  async function publishGalerie(force) {
    /* Sans catalogue lisible (hors ligne, erreur réseau), on ne publie RIEN :
       sinon la galerie client serait vidée par une simple coupure. */
    if (!S.catalogLoaded) return false;
    var items = galerieItems();
    var sig = JSON.stringify(items);
    S.gallery = items;
    if (!force && sig === _galSig) return false;
    _galSig = sig;
    try { await syncSet('mdb_clientGallery', items); } catch (e) { return false; }
    return true;
  }
  async function refreshCatalogue() {
    var cat = await syncGet('mdb_nomenclature');
    if (Array.isArray(cat)) { S.catalog = cat; S.catalogLoaded = true; }
    var tombstones = await syncGet('mdb_tombstones');
    if (tombstones && typeof tombstones === 'object') S.tombs = tombstones;
    return publishGalerie(false);
  }
  /* Première ouverture : on récupère les photos/descriptions déjà saisies
     dans l'ancienne galerie (association par code, puis par désignation).
     Les produits qui ne viennent pas de l'Index ne sont plus publiés, mais
     ils sont conservés dans « legacy » pour ne rien perdre. */
  async function migrateGalerie(old) {
    var meta = {}, legacy = [];
    var pf = catalogueFinis();
    var byCode = {}, byName = {};
    pf.forEach(function (a) {
      byCode[normCode(a.code)] = a;
      var n = normTxt(a.designation);
      if (n) byName[n] = a;
    });
    (Array.isArray(old) ? old : []).forEach(function (g) {
      if (!g) return;
      var a = byCode[normCode(g.code)] || byName[normTxt(g.titre)] || null;
      if (a) {
        var m = { photo: g.image || '', description: g.description || '', actif: g.actif !== false };
        if (m.photo || m.description || m.actif === false) meta[normCode(a.code)] = m;
      } else {
        legacy.push({
          id: g.id || uid(), titre: g.titre || g.code || 'Produit', code: g.code || '',
          prix: parseFloat(g.prix) || 0, description: g.description || '',
          image: g.image || '', createdAt: g.createdAt || Date.now()
        });
      }
    });
    S.meta = meta;
    if (legacy.length) {
      var seen = {};
      S.legacy = (S.legacy || []).concat(legacy).filter(function (x) {
        var k = x.id || (x.titre + '|' + x.code);
        if (seen[k]) return false;
        seen[k] = true;
        return true;
      });
      try { await syncSet('mdb_clientGalleryLegacy', S.legacy); } catch (e) {}
    }
    try { await syncSet('mdb_clientGalleryMeta', S.meta); } catch (e) {}
  }
  async function setMeta(code, patch) {
    var c = normCode(code);
    if (!S.meta || typeof S.meta !== 'object') S.meta = {};
    var m = {};
    var cur = metaDe(c);
    for (var k in cur) { if (Object.prototype.hasOwnProperty.call(cur, k)) m[k] = cur[k]; }
    for (var k2 in patch) { if (Object.prototype.hasOwnProperty.call(patch, k2)) m[k2] = patch[k2]; }
    /* On garde la clé tant qu'une retouche existe (photo, description saisie
       même vide, ou produit masqué). Sinon le produit reste « tel quel ». */
    if (!m.photo && m.description === undefined && m.actif !== false) delete S.meta[c];
    else S.meta[c] = m;
    try { await syncSet('mdb_clientGalleryMeta', S.meta); } catch (e) {}
    await publishGalerie(false);
    render();
  }

  function galerieCarte(it) {
    var c = normCode(it.code);
    var m = metaDe(c);
    var ancienneRetouche = !!(m.photo || m.description !== undefined);
    return '<div class="adThumb gCard" data-search="' + esc(normTxt(it.code + ' ' + it.titre + ' ' + (it.description || ''))) + '"' + (it.actif ? '' : ' style="opacity:.55"') + '>'
      + '<div class="im" style="position:relative">'
      + (it.image ? '<img src="' + esc(it.image) + '" alt="" loading="lazy">' : '<span style="font-size:34px">📦</span>')
      + ((it.images || []).length > 1 ? '<span class="adBadge b-new" style="position:absolute;bottom:6px;right:6px">' + it.images.length + ' photos</span>' : '')
      + (it.actif ? '' : '<span class="adBadge b-gray" style="position:absolute;top:6px;left:6px">Masqué</span>')

  function bindGalerie() {

    var search = el('gSearch');
    if (search) search.oninput = function () { S.gallerySearch = search.value || ''; filtrageGalerie(); };
    var refresh = el('gRefresh');
    if (refresh) refresh.onclick = async function () {
      refresh.disabled = true;
      refresh.textContent = '…';
      await refreshCatalogue();
      refresh.disabled = false;
      refresh.textContent = 'Actualiser';
      render();
    };
    zone.addEventListener('click', function (ev) {
      var b = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
      if (!b) return;
      var act = b.getAttribute('data-act');
      var code = b.getAttribute('data-code') || '';
      if (act === 'toggle') {
        var actif = metaDe(code).actif !== false;
        setMeta(code, { actif: !actif });
        return;
      }
      if (act === 'reset') {
        if (!confirm('Effacer l’ancienne photo/description saisie dans cet espace ? La fiche de l’Index reprendra la main.')) return;
        var c = normCode(code);
        if (S.meta) delete S.meta[c];
        syncSet('mdb_clientGalleryMeta', S.meta || {}).then(publishGalerie).then(render).catch(function () {});
        return;
      }
      if (act === 'del-legacy') {
        var id = b.getAttribute('data-id');
        if (!confirm('Supprimer cet ancien produit ?')) return;
        S.legacy = (S.legacy || []).filter(function (x) { return String(x.id) !== String(id); });
        syncSet('mdb_clientGalleryLegacy', S.legacy).then(render).catch(function () {});
        return;
      }
    });
    filtrageGalerie();
  }

  window.adReplyQuote = function (id) {
    var q = S.quotes.filter(function (x) { return x.id === id; })[0]; if (!q) return;
    var ta = el('qa_' + id); var txt = (ta.value || '').trim(); if (!txt) { alert('Écrivez une réponse.'); return; }
    var t = ensureThread(q.clientId, q.clientNom, 'Cotation ' + q.numero, 'cotation', q.id);
    t.messages.push({ auteur: 'admin', nom: ADMIN, texte: txt, at: Date.now() });
    t.updatedAt = Date.now();
    q.statut = q.statut === 'nouvelle' ? 'en_cours' : q.statut; q.updatedAt = Date.now();
    Promise.all([syncSet('mdb_clientThreads', S.threads), syncSet('mdb_clientQuotes', S.quotes)]).then(function () { render(); }).catch(function () { alert('Envoi impossible.'); });
  };
  window.adReplyOrder = function (id) {
    var o = S.orders.filter(function (x) { return x.id === id; })[0]; if (!o) return;
    var ta = el('oa_' + id); var txt = (ta.value || '').trim(); if (!txt) { alert('Écrivez un message.'); return; }
    var t = ensureThread(o.clientId, o.clientNom, 'Commande ' + o.numero, 'commande', o.id);
    t.messages.push({ auteur: 'admin', nom: ADMIN, texte: txt, at: Date.now() });
    t.updatedAt = Date.now();
    o.statut = o.statut === 'nouvelle' ? 'en_cours' : o.statut; o.updatedAt = Date.now();
    Promise.all([syncSet('mdb_clientThreads', S.threads), syncSet('mdb_clientOrders', S.orders)]).then(function () { render(); }).catch(function () { alert('Envoi impossible.'); });
  };
  window.adOpenThread = function (id) { S.thread = id; S.tab = 'messages'; render(); };
  window.adBackThreads = function () { S.thread = null; render(); };
  window.adCloseThread = function () {
    var t = (S.threads || []).filter(function (x) { return x && x.id === S.thread; })[0]; if (!t) return;
    t.statut = 'fermee'; t.updatedAt = Date.now();
    syncSet('mdb_clientThreads', S.threads).then(render).catch(function () {});
  };

  async function setPresence(dispo) {
    S.presence = { at: Date.now(), nom: ADMIN, dispo: !!dispo };
    try { await syncSet('mdb_clientPresence', S.presence); } catch (e) {}
    renderTop();
  }
  el('adTogglePresence').onclick = function () {
    var online = !!(S.presence && S.presence.dispo !== false && (Date.now() - (S.presence.at || 0) < 5 * 60 * 1000));
    setPresence(!online);
  };
  el('adOpenClient').onclick = function () { window.open('espace-client.html?uid=' + encodeURIComponent(UID), '_blank'); };
  window.adCopyLink = function () {
    var link = location.origin + '/espace-client.html?uid=' + encodeURIComponent(UID);
    try { navigator.clipboard.writeText(link).then(function () { alert('Lien copié.'); }); }
    catch (e) { prompt('Copiez le lien :', link); }
  };

  async function boot() {
    if (!UID) {
      el('adBody').innerHTML = '<div class="adCard"><h2>Session requise</h2><div class="adNote">Ouvrez cette page depuis l’application principale (elle doit être connectée).</div><div style="margin-top:12px"><a class="adBtn dark" href="index.html">Ouvrir l’application</a></div></div>';
      return;
    }
    await loadAll();
    await setPresence(true);
    render();
    setInterval(function () {
      try { if (S.presence && S.presence.dispo !== false) { S.presence.at = Date.now(); syncSet('mdb_clientPresence', S.presence); } } catch (e) {}
    }, 60000);
    setInterval(async function () {
      try {
        var changed = await refreshCatalogue();
        var q = await syncGet('mdb_clientQuotes') || [];
        var o = await syncGet('mdb_clientOrders') || [];
        var t = await syncGet('mdb_clientThreads') || [];
        var before = S.quotes.length + ':' + S.orders.length + ':' + S.threads.length;
        if (q.length + ':' + o.length + ':' + t.length !== before) { S.quotes = q; S.orders = o; S.threads = t; changed = true; }
        if (changed && S.tab === 'galerie' && !S.thread) render();
      } catch (e) {}
    }, 45000);
  }
  boot();
})();
</script>
</body>
</html>
