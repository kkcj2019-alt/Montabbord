<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Espace client</title>
<style>
  :root{--navy:#0b3a6f;--navy2:#123f78;--teal:#0e7490;--gold:#ecc95f;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f4f7fb;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,Segoe UI,Arial,Helvetica,sans-serif;background:radial-gradient(1100px 600px at 8% 5%,#e8f1fb 0%,transparent 55%),radial-gradient(900px 520px at 95% 95%,#e7f5f6 0%,transparent 55%),var(--bg);color:var(--ink);min-height:100vh}
  button,input,select,textarea{font-family:inherit}
  .cxTop{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 18px;background:linear-gradient(120deg,#071a33,#0b3a6f 58%,#0e7490);color:#fff;box-shadow:0 6px 22px rgba(2,20,45,.28)}
  .cxTop img{width:52px;height:52px;max-width:64px;object-fit:contain;background:#fff;border-radius:12px;padding:4px;display:block}
  .cxBrand{min-width:0;flex:1}
  .cxBrand b{display:block;font-size:16px;font-weight:900;letter-spacing:.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cxBrand span{display:block;font-size:11px;color:#cbd5e1;margin-top:2px}
  .cxTopRight{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .cxIcon{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:17px;font-weight:800}
  .cxIcon:hover{background:rgba(255,255,255,.2)}
  .cxIcon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .cxWho{font-size:11.5px;font-weight:800;color:#fff;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cxWrap{max-width:1180px;margin:0 auto;padding:18px}
  .cxCard{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(15,23,42,.07);padding:20px}
  .cxHero{background:linear-gradient(135deg,#0b3a6f,#1b5fa8 60%,#0e7490);color:#fff;border-radius:18px;padding:22px 24px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 16px 40px rgba(2,20,45,.22)}
  .cxHero:after{content:'';position:absolute;width:320px;height:320px;border-radius:50%;right:-110px;top:-140px;background:radial-gradient(circle,rgba(236,201,95,.28),transparent 65%)}
  .cxHero h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.01em}
  .cxHero p{margin:6px 0 0;font-size:12.5px;color:#dbeafe;max-width:680px;line-height:1.5}
  .cxHero .cxPills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;position:relative;z-index:1}
  .cxHero .cxPill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:5px 11px;font-size:11px;font-weight:800;color:#fff;display:inline-flex;align-items:center;gap:6px}
  .cxTabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 4px 16px rgba(15,23,42,.05)}
  .cxTab{border:none;background:transparent;padding:9px 14px;border-radius:10px;font-size:12.5px;font-weight:800;color:#475569;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s}
  .cxTab:hover{background:#f1f5f9}
  .cxTab.on{background:linear-gradient(135deg,#0b3a6f,#0e7490);color:#fff;box-shadow:0 6px 16px rgba(11,58,111,.25)}
  .cxGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .prodCard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 6px 20px rgba(15,23,42,.06);display:flex;flex-direction:column;transition:transform .16s,box-shadow .16s}
  .prodCard:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(15,23,42,.12)}
  .prodImg{height:170px;background:linear-gradient(135deg,#e8eef7,#dbeafe);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  .prodImg img{width:100%;height:100%;object-fit:cover;display:block}
  .prodImg .ph{font-size:42px;opacity:.5}
  .cxThumbs{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:5px;overflow-x:auto;padding:2px;scrollbar-width:none}
  .cxThumbs::-webkit-scrollbar{display:none}
  .cxThumb{width:38px;height:38px;flex:0 0 auto;padding:0;border:2px solid rgba(255,255,255,.9);border-radius:7px;overflow:hidden;background:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(2,6,23,.28)}
  .cxThumb.on{border-color:#ecc95f;box-shadow:0 0 0 2px rgba(236,201,95,.55)}
  .cxThumb img{width:100%;height:100%;object-fit:cover;display:block}
  .cxPhotoCount{position:absolute;top:6px;right:6px;background:rgba(15,23,42,.72);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px}
  .prodBody{padding:13px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .prodBody h3{margin:0;font-size:14px;font-weight:900;line-height:1.25}
  .prodBody .pr{font-size:16px;font-weight:900;color:var(--navy)}
  .prodBody .des{font-size:11.5px;color:var(--muted);line-height:1.4;flex:1}
  .cxBtn{border:none;border-radius:10px;padding:9px 13px;font-size:12px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,box-shadow .15s}
  .cxBtn:active{transform:scale(.98)}
  .cxBtn.primary{background:linear-gradient(135deg,#0b3a6f,#0e7490);color:#fff;box-shadow:0 6px 16px rgba(11,58,111,.22)}
  .cxBtn.gold{background:linear-gradient(135deg,#ecc95f,#f6df9a);color:#0b3a6f}
  .cxBtn.ghost{background:#f1f5f9;color:#334155;border:1px solid var(--line)}
  .cxBtn.sm{padding:7px 10px;font-size:11px}
  .cxForm{display:flex;flex-direction:column;gap:11px}
  .cxField label{display:block;font-size:11px;font-weight:900;color:#475569;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .cxField input,.cxField select,.cxField textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;font-size:14px;outline:none;background:#fff;color:var(--ink);transition:border .15s,box-shadow .15s}
  .cxField input:focus,.cxField select:focus,.cxField textarea:focus{border-color:#0e7490;box-shadow:0 0 0 3px rgba(14,116,144,.12)}
  .cxField textarea{min-height:80px;resize:vertical}
  .cxRow{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .cxNote{font-size:11.5px;color:var(--muted);line-height:1.5}
  .cxBanner{display:flex;gap:10px;align-items:flex-start;background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:11px 13px;font-size:12px;font-weight:700;line-height:1.45;margin-bottom:14px}
  .cxBanner.info{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
  .cxAuth{max-width:460px;margin:34px auto 0}
  .cxAuthTabs{display:flex;gap:6px;background:#eef2f7;border-radius:12px;padding:4px;margin-bottom:16px}
  .cxAuthTabs button{flex:1;border:none;background:transparent;padding:9px;border-radius:9px;font-size:12.5px;font-weight:900;color:#64748b;cursor:pointer}
  .cxAuthTabs button.on{background:#fff;color:var(--navy);box-shadow:0 3px 10px rgba(15,23,42,.10)}
  .cxErr{color:var(--bad);font-size:12px;font-weight:800;min-height:16px}
  .cxOk{color:var(--ok);font-size:12px;font-weight:800}
  .cxList{display:flex;flex-direction:column;gap:10px}
  .cxItem{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .cxItem .t{font-size:13px;font-weight:900}
  .cxItem .m{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .cxBadge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:900;margin-left:6px}
  .b-new{background:#e0f2fe;color:#075985}.b-wait{background:#fef3c7;color:#92400e}.b-ok{background:#dcfce7;color:#166534}.b-bad{background:#fee2e2;color:#b91c1c}.b-gray{background:#f1f5f9;color:#475569}
  .cxThread{display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow:auto;padding:8px 4px;margin:8px 0;background:#f8fafc;border:1px solid var(--line);border-radius:12px}
  .cxMsg{max-width:82%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.45}
  .cxMsg.client{align-self:flex-end;background:linear-gradient(135deg,#0b3a6f,#0e7490);color:#fff;border-bottom-right-radius:4px}
  .cxMsg.admin{align-self:flex-start;background:#fff;border:1px solid var(--line);color:#1e293b;border-bottom-left-radius:4px}
  .cxMsg .who{font-size:9.5px;font-weight:900;opacity:.8;margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em}
  .cxMsg .at{font-size:9px;opacity:.65;margin-top:3px}
  .cxEmpty{padding:26px 14px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.5}
  .cxFoot{text-align:center;font-size:11px;color:#94a3b8;padding:20px 12px 26px}
  @media(max-width:640px){
    .cxTop{padding:10px 12px}
    .cxTop img{width:44px;height:44px}
    .cxBrand b{font-size:14px}
    .cxWrap{padding:12px}
    .cxRow{grid-template-columns:1fr}
    .cxHero{padding:18px}
    .cxHero h1{font-size:19px}
    .cxGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .prodImg{height:120px}
    .prodBody{padding:10px}
    .prodBody h3{font-size:12px}
    .prodBody .pr{font-size:13.5px}
    .prodBody .des{display:none}
    .cxBtn{padding:8px 10px;font-size:11px}
    .cxWho{display:none}
  }
  @media(max-width:380px){.cxGrid{grid-template-columns:1fr}}
</style>

<style id="cxVitrineCss">
.cxPublicHero{position:relative;overflow:hidden;background:linear-gradient(135deg,#071a33,#0b3a6f 52%,#0e7490);color:#fff;border-radius:18px;padding:34px 30px;margin:0 0 18px;box-shadow:0 20px 50px rgba(2,20,45,.28)}
.cxPublicHero:after{content:'';position:absolute;width:380px;height:380px;border-radius:50%;right:-120px;top:-160px;background:radial-gradient(circle,rgba(236,201,95,.30),transparent 65%)}
.cxPublicHero .kick{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#ecc95f;font-weight:900}
.cxPublicHero h1{margin:8px 0 6px;font-size:clamp(24px,4vw,38px);line-height:1.12;font-weight:900;max-width:760px}
.cxPublicHero p{margin:0;font-size:13px;color:#dbeafe;line-height:1.55;max-width:680px}
.cxPublicHero .cxHeroBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1}
.cxSection{margin:18px 0}
.cxSecHead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cxSecHead h2{margin:0;font-size:18px;font-weight:900;color:#0f172a}
.cxSecHead .sub{font-size:11.5px;color:#64748b}
.cxStatsRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.cxStat{background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:12px 14px;box-shadow:0 4px 16px rgba(15,23,42,.05);border-left:4px solid #0e7490}
.cxStat b{display:block;font-size:22px;font-weight:900;color:#0b3a6f;line-height:1.1}
.cxStat span{font-size:10.5px;color:#64748b;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.cxFeatureGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cxEngGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.cxEng{background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:14px;box-shadow:0 4px 16px rgba(15,23,42,.04)}
.cxEng .ic{width:34px;height:34px;border-radius:9px;background:#e8f5f7;color:#0e7490;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:8px}
.cxEng b{display:block;font-size:13px;font-weight:900;color:#0f172a}
.cxEng p{margin:4px 0 0;font-size:11.5px;color:#64748b;line-height:1.5}
.cxReviewGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.cxReview{background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:13px 14px;box-shadow:0 4px 16px rgba(15,23,42,.04)}
.cxReview .who{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:11.5px;font-weight:900;color:#0b3a6f}
.cxStars{color:#ecc95f;font-size:13px;letter-spacing:1px;white-space:nowrap}
.cxReview p{margin:6px 0 0;font-size:11.8px;color:#475569;line-height:1.5}
.cxAvg{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:999px;padding:5px 11px;font-size:11px;font-weight:900}
.cxReviewForm{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:12px;margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.cxReviewForm select,.cxReviewForm textarea{border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff}
.cxReviewForm textarea{flex:1;min-width:180px;min-height:44px;resize:vertical}
.cxPartners{overflow:hidden;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px 0;box-shadow:0 4px 16px rgba(15,23,42,.04)}
.cxMarquee{display:flex;align-items:center;gap:46px;width:max-content;animation:cxMarquee 28s linear infinite;padding:0 23px}
.cxPartners:hover .cxMarquee{animation-play-state:paused}
.cxMarquee img{max-height:44px;max-width:120px;object-fit:contain;filter:grayscale(.15);opacity:.86}
.cxMarquee span{font-size:13px;font-weight:900;color:#475569;letter-spacing:.04em;white-space:nowrap}
@keyframes cxMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.cxContact{background:linear-gradient(135deg,#0b3a6f,#0e7490);color:#fff;border-radius:16px;padding:20px 22px;display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 14px 36px rgba(2,20,45,.22)}
.cxContact b{font-size:16px;font-weight:900}
.cxContact div{font-size:11.5px;color:#dbeafe;line-height:1.5}
.cxContact .cxBtn{background:#ecc95f;color:#0b3a6f}
@media(max-width:640px){
  .cxPublicHero{padding:24px 18px;border-radius:14px}
  .cxPublicHero h1{font-size:24px}
  .cxStatsRow{grid-template-columns:1fr 1fr}
  .cxFeatureGrid{grid-template-columns:1fr 1fr}
  .cxReviewGrid{grid-template-columns:1fr}
  .cxMarquee{gap:28px}
}
</style>
</head>
<body>
<header class="cxTop">
  <img id="cxLogo" src="logo-192.png" alt="">
  <div class="cxBrand"><b id="cxNom">Espace client</b><span>Commandes, cotations et messages</span></div>
  <div class="cxTopRight">
    <span class="cxWho" id="cxWho"></span>
    <button class="cxIcon" id="cxRefresh" title="Actualiser" aria-label="Actualiser"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
    <button class="cxIcon" id="cxLogout" title="Se déconnecter" aria-label="Se déconnecter" style="display:none"><svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 5.8a9 9 0 1 0 11.4 0"/></svg></button>
  </div>
</header>
<main class="cxWrap" id="cxMain">
  <div id="cxAuthWrap"></div>
  <div id="cxAppWrap" style="display:none"></div>
</main>
<div class="cxFoot">Espace client sécurisé · <span id="cxFootNom"></span></div>

<script>
(function () {
  'use strict';
  var API = '/api/sync';
  var UID = '';
  var ENT_ID = '';
  try { var p = new URLSearchParams(location.search); UID = (p.get('uid') || '').trim(); ENT_ID = (p.get('ent') || '').trim(); } catch (e) {}
  var S = { uid: UID, ent: {}, gallery: [], quotes: [], orders: [], threads: [], client: null, tab: 'accueil', thread: null, authMode: 'login', loading: false, content: null, partners: [], reviews: [] };
  var AUTO_MSG = "Bonjour, nous ne sommes pas disponibles pour le moment. Votre message a bien été reçu : nous vous répondrons le plus tôt possible.";
  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) { try { return new Intl.NumberFormat('fr-FR').format(Math.round(parseFloat(n) || 0)); } catch (e) { return String(Math.round(parseFloat(n) || 0)); } }
  function money(n) { return fmt(n) + ' F'; }
  function uid() { return 'CX' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase(); }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function fmtDate(s) { if (!s) return '-'; try { return new Date(String(s).slice(0, 10) + 'T00:00:00').toLocaleDateString('fr-FR'); } catch (e) { return s; } }
  function fmtDT(t) { if (!t) return '-'; try { return new Date(t).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return '-'; } }

  async function syncGet(key) {
    if (!S.uid) return null;
    try {
      var r = await fetch(API + '?uid=' + encodeURIComponent(S.uid) + '&cle=' + encodeURIComponent(key) + '&t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return null;
      var j = await r.json();
      return (j && j.data && j.data[key] !== undefined) ? j.data[key] : null;
    } catch (e) { return null; }
  }
  async function syncSet(key, val) {
    if (!S.uid) throw new Error('uid');
    var body = { uid: S.uid, updates: {} }; body.updates[key] = val;
    var r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('sync');
    return true;
  }
  async function sha256(s) {
    try {
      var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(s)));
      return Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    } catch (e) { return 'x' + String(s).length; }
  }
  function randSalt() {
    try { var a = new Uint8Array(12); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }
    catch (e) { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  }

  function cxContent() {
    var c = S.content || {};
    return {
      slogan: c.slogan || 'Des palettes en bois robustes, fabriquées pour durer.',
      about: c.about || 'Nous concevons et fabriquons des palettes, couvercles et emballages bois sur mesure pour les professionnels. Qualité constante, délais courts et accompagnement personnalisé.',
      telephone: c.telephone || S.ent.telephone || '',
      email: c.email || S.ent.email || '',
      adresse: c.adresse || S.ent.adresse || '',
      horaires: c.horaires || 'Lun–Ven · 8h–17h',
      stats: c.stats || { clients: '+120', produits: '+40', annees: '15' },
      engagements: (Array.isArray(c.engagements) && c.engagements.length) ? c.engagements : [
        { t: 'Bois sélectionné', d: 'Essences durables et séchage maîtrisé pour une tenue maximale.' },
        { t: 'Sur mesure', d: 'Dimensions, traitements et conditionnements adaptés à vos besoins.' },
        { t: 'Délais courts', d: 'Production locale, suivi de commande et livraison fiable.' }
      ],
      featured: Array.isArray(c.featured) ? c.featured : []
    };
  }
  function cxFeatured(n) {
    var c = cxContent();
    var list = S.gallery || [];
    if (c.featured && c.featured.length) {
      var sel = list.filter(function (g) { return c.featured.indexOf(String(g.code || '')) !== -1 || c.featured.indexOf(String(g.id || '')) !== -1; });
      if (sel.length) list = sel.concat(list.filter(function (g) { return sel.indexOf(g) === -1; }));
    }
    return list.slice(0, n || 4);
  }
  function cxStars(note) {
    var n = Math.max(0, Math.min(5, Math.round(parseFloat(note) || 0)));
    return '<span class="cxStars">' + new Array(n + 1).join('★') + new Array(5 - n + 1).join('☆') + '</span>';
  }
  function cxAvgReviews() {
    var r = S.reviews || [];
    if (!r.length) return { avg: 0, n: 0 };
    var s = 0;
    r.forEach(function (x) { s += parseFloat(x.note) || 0; });
    return { avg: Math.round((s / r.length) * 10) / 10, n: r.length };
  }
  function cxProductCards(list, compact) {
    var h = '<div class="cxFeatureGrid">';
    list.forEach(function (g) {

  async function resolveEnterprise() {
    var v = (el('cxEntId') && el('cxEntId').value || '').trim();
    if (!v) return;
    el('cxEntErr').textContent = 'Chargement…';
    try {
      var r = await fetch('/api/enterprise?identifiant=' + encodeURIComponent(v));
      var j = await r.json();
      if (!j || !j.found || !j.enterprise || !j.enterprise.id) { el('cxEntErr').textContent = 'Entreprise introuvable.'; return; }
      S.uid = j.enterprise.id; UID = S.uid;
      try { history.replaceState(null, '', '?uid=' + encodeURIComponent(S.uid)); } catch (e) {}
      await bootData();
      renderAuth();
    } catch (e) { el('cxEntErr').textContent = 'Connexion impossible. Réessayez.'; }
  }

  async function doRegister() {
    var nom = (el('cxRnom').value || '').trim(), email = (el('cxRemail').value || '').trim().toLowerCase(), tel = (el('cxRtel').value || '').trim();
    var p1 = el('cxRpass').value || '', p2 = el('cxRpass2').value || '';
    var err = el('cxRErr');
    if (!nom || !email || !p1) { err.textContent = 'Nom, email et mot de passe sont obligatoires.'; return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Email invalide.'; return; }
    if (p1.length < 4) { err.textContent = 'Mot de passe : 4 caractères minimum.'; return; }
    if (p1 !== p2) { err.textContent = 'Les deux mots de passe ne correspondent pas.'; return; }
    err.textContent = '';
    var accounts = await syncGet('mdb_clientAccounts') || {};
    if (accounts[email]) { err.textContent = 'Un compte existe déjà avec cet email.'; return; }
    var salt = randSalt();
    var hash = await sha256(salt + '|' + p1);
    accounts[email] = { id: uid(), nom: nom, email: email, tel: tel, salt: salt, hash: hash, actif: true, createdAt: Date.now() };
    await syncSet('mdb_clientAccounts', accounts);
    S.client = accounts[email];
    try { localStorage.setItem('mdb_client_session_' + S.uid, email); } catch (e) {}
    await loadClientData();
    renderApp();
  }

  async function doLogin() {
    var email = (el('cxLemail').value || '').trim().toLowerCase(), pass = el('cxLpass').value || '';
    var err = el('cxLErr');
    if (!email || !pass) { err.textContent = 'Email et mot de passe requis.'; return; }
    err.textContent = '';
    var accounts = await syncGet('mdb_clientAccounts') || {};
    var c = accounts[email];
    if (!c || c.actif === false) { err.textContent = 'Compte introuvable ou désactivé.'; return; }
    var hash = await sha256((c.salt || '') + '|' + pass);
    if (hash !== c.hash) { err.textContent = 'Mot de passe incorrect.'; return; }
    S.client = c;
    try { localStorage.setItem('mdb_client_session_' + S.uid, email); } catch (e) {}
    await loadClientData();
    renderApp();
  }

        + '</div>'
        + '<div class="prodBody"><h3>' + esc(g.titre || 'Produit') + '</h3>'
        + (g.code ? '<div class="cxNote" style="margin:-2px 0 6px;font-weight:900;color:#0b3a6f;letter-spacing:.03em">Code : ' + esc(g.code) + '</div>' : '')
        + '<div class="pr">' + (g.prix ? money(g.prix) : 'Prix sur demande') + '</div>'
        + '<div class="des">' + esc(g.description || '') + '</div>'
        + '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="cxBtn gold sm" onclick="cxQuoteFor(\'' + esc(g.id) + '\')">Demander une cotation</button>'
        + '<button class="cxBtn ghost sm" onclick="cxOrderFor(\'' + esc(g.id) + '\')">Commander</button></div></div></div>';
    });
    h += '</div>';
    return h;
  }

  /* Bascule la photo principale d'une fiche produit (galerie multi-photos). */
  window.cxChoisirPhoto = function (btn, idx) {
    try {
      var card = btn.closest('.prodCard');
      if (!card) return;
      var main = card.querySelector('.prodMainImg');
      var thumbs = card.querySelectorAll('.cxThumb');
      var src = thumbs[idx] ? thumbs[idx].querySelector('img') : null;
      if (main && src) main.src = src.src;
      Array.prototype.forEach.call(thumbs, function (t, i) { t.classList.toggle('on', i === idx); });
    } catch (e) {}
  };

  function tabCotation() {
    return '<div class="cxCard"><h2 style="margin:0 0 4px;font-size:17px">Demander une cotation</h2>'
      + '<div class="cxNote" style="margin-bottom:14px">Décrivez votre besoin : le service commercial vous répond avec un prix et un délai.</div>'
      + '<div class="cxForm">'
      + '<div class="cxField"><label>Produit concerné</label>'
      + '<input id="qArticle" list="qArticles" autocomplete="off" placeholder="Tapez le code ou le nom du produit…" oninput="cxPickArticle(\'quote\',this)">'
      + articleDatalist('qArticles')
      + '<div class="cxNote" id="qArticleInfo" style="min-height:16px"></div></div>'
      + '<div class="cxRow"><div class="cxField"><label>Quantité souhaitée</label><input id="qQte" type="number" min="1" value="1"></div>'
      + '<div class="cxField"><label>Date souhaitée</label><input id="qDate" type="date" value="' + todayStr() + '"></div></div>'
      + '<div class="cxField"><label>Votre besoin / précisions *</label><textarea id="qMsg" placeholder="Dimensions, essence du bois, conditionnement, lieu de livraison…"></textarea></div>'
      + '<button class="cxBtn primary" id="qSend">Envoyer ma demande</button><div class="cxErr" id="qErr"></div><div class="cxOk" id="qOk"></div></div></div>';
  }

  function tabCommandes() {
    var list = myOrders();
    var h = '<div class="cxCard" style="margin-bottom:14px"><h2 style="margin:0 0 4px;font-size:17px">Passer une commande</h2>'
      + '<div class="cxNote" style="margin-bottom:14px">La commande ne dépend pas du stock : elle sera confirmée par le service commercial.</div>'
      + '<div class="cxForm"><div class="cxField"><label>Produit</label>'
      + '<input id="oArticle" list="oArticles" autocomplete="off" placeholder="Tapez le code ou le nom du produit…" oninput="cxPickArticle(\'order\',this)">'
      + articleDatalist('oArticles')
      + '<div class="cxNote" id="oArticleInfo" style="min-height:16px"></div></div>'
      + '<div class="cxRow"><div class="cxField"><label>Quantité</label><input id="oQte" type="number" min="1" value="1"></div>'
      + '<div class="cxField"><label>Téléphone</label><input id="oTel" value="' + esc(S.client.tel || '') + '"></div></div>'
      + '<div class="cxField"><label>Adresse de livraison</label><input id="oAdresse" placeholder="Lieu de livraison"></div>'
      + '<div class="cxField"><label>Précisions</label><textarea id="oMsg" placeholder="Délai, conditionnement, contact sur place…"></textarea></div>'
      + '<button class="cxBtn primary" id="oSend">Envoyer la commande</button><div class="cxErr" id="oErr"></div><div class="cxOk" id="oOk"></div></div></div>';
    h += '<div class="cxCard"><h2 style="margin:0 0 10px;font-size:17px">Mes commandes</h2>';
    if (!list.length) h += '<div class="cxEmpty">Aucune commande pour le moment.</div>';
    else {
      h += '<div class="cxList">';
      list.forEach(function (o) {
        h += '<div class="cxItem"><div><div class="t">' + esc(o.numero || 'Commande') + statusBadge(o.statut) + '</div>'
          + '<div class="m">' + fmtDT(o.createdAt) + ' · ' + (o.items || []).map(function (it) { return esc(it.titre || it.code || 'Article') + ' × ' + (it.qte || 0); }).join(' · ') + '</div>'
          + (o.total ? '<div class="m"><b>Total estimé : ' + money(o.total) + '</b></div>' : '') + '</div>'
          + '<button class="cxBtn ghost sm" onclick="cxOpenThreadForOrder(\'' + esc(o.id) + '\')">Suivre / écrire</button></div>';
      });
      h += '</div>';
    }
    return h + '</div>';
  }

  function tabMessages() {
    if (S.thread) {
      var t = (S.threads || []).filter(function (x) { return x && x.id === S.thread; })[0];
      if (!t) { S.thread = null; return tabMessages(); }
      var h = '<div class="cxCard"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><div><div style="font-size:15px;font-weight:900">' + esc(t.sujet || 'Discussion') + '</div><div class="cxNote">' + statusBadge(t.statut) + ' · ' + fmtDT(t.updatedAt) + '</div></div><button class="cxBtn ghost sm" onclick="cxBackThreads()">← Retour</button></div>';
      h += '<div class="cxThread" id="cxThreadBox">';
      (t.messages || []).forEach(function (m) {
        var mine = m.auteur === 'client';
        h += '<div class="cxMsg ' + (mine ? 'client' : 'admin') + '"><div class="who">' + esc(mine ? 'Vous' : (m.nom || 'Service commercial')) + '</div>' + esc(m.texte) + '<div class="at">' + fmtDT(m.at) + '</div></div>';
      });
      h += '</div>';
      if (String(t.statut) !== 'fermee') {
        h += '<div class="cxField"><label>Votre message</label><textarea id="cxReply" placeholder="Écrivez votre message…"></textarea></div>'
          + '<button class="cxBtn primary" id="cxSendReply" style="margin-top:8px">Envoyer</button><div class="cxErr" id="cxReplyErr"></div>';
      } else {
        h += '<div class="cxNote">Cette discussion est fermée. Vous pouvez créer une nouvelle demande si besoin.</div>';
      }
      return h + '</div>';
    }
    var list = myThreads();
    var h = '<div class="cxCard"><h2 style="margin:0 0 4px;font-size:17px">Messagerie</h2><div class="cxNote" style="margin-bottom:12px">Échangez directement avec le service commercial. Une réponse automatique est envoyée si nous sommes indisponibles.</div>';
    if (!list.length) h += '<div class="cxEmpty">Aucune discussion. Posez votre question depuis une cotation, une commande ou via le bouton ci-dessous.</div>';
    else {
      h += '<div class="cxList">';
      list.forEach(function (t) {
        var last = (t.messages || [])[(t.messages || []).length - 1] || {};
        h += '<div class="cxItem" style="cursor:pointer" onclick="cxOpenThread(\'' + esc(t.id) + '\')"><div><div class="t">' + esc(t.sujet || 'Discussion') + statusBadge(t.statut) + '</div>'
          + '<div class="m">' + esc(String(last.texte || '').slice(0, 120)) + '</div><div class="m">' + fmtDT(t.updatedAt) + '</div></div><span style="font-size:18px;color:#94a3b8">›</span></div>';
      });
      h += '</div>';
    }
    h += '<button class="cxBtn ghost" id="cxNewThread" style="margin-top:12px">+ Nouvelle discussion</button></div>';
    return h;
  }

  function bindCotation() {
    var send = el('qSend'); if (!send) return;
    send.onclick = async function () {
      var inp = el('qArticle'), qte = parseFloat(el('qQte').value) || 1, msg = (el('qMsg').value || '').trim();
      var err = el('qErr'), ok = el('qOk');
      if (!msg) { err.textContent = 'Décrivez votre besoin.'; return; }
      err.textContent = ''; ok.textContent = 'Envoi…'; send.disabled = true;
      var item = chercherArticle(inp.value);
      var quote = { id: uid(), numero: 'DEV-' + todayStr().replace(/-/g, '') + '-' + Math.random().toString(36).slice(2, 5).toUpperCase(), clientId: S.client.id, clientNom: S.client.nom, email: S.client.email, tel: S.client.tel || '', items: item ? [{ id: item.id, titre: item.titre, code: item.code || '', qte: qte, prix: parseFloat(item.prix) || 0 }] : [{ titre: 'Besoin sur mesure' + ((inp.value || '').trim() ? ' : ' + inp.value.trim() : ''), qte: qte, prix: 0 }], besoin: msg, dateBesoin: el('qDate').value || '', statut: 'nouvelle', createdAt: Date.now(), updatedAt: Date.now() };
      var online = await presenceOnline();
      var thread = newThread(quote.clientId, quote.clientNom, 'Cotation ' + quote.numero, 'cotation', quote.id, msg, online);
      S.quotes.unshift(quote); S.threads.unshift(thread);
      try { await syncSet('mdb_clientQuotes', S.quotes); await syncSet('mdb_clientThreads', S.threads); ok.textContent = 'Demande envoyée. Le service commercial vous répond.'; send.disabled = false; S.tab = 'messages'; setTimeout(renderApp, 700); }
      catch (e) { ok.textContent = ''; err.textContent = 'Envoi impossible. Réessayez.'; send.disabled = false; }
    };
  }

  function bindCommande() {
    var send = el('oSend'); if (!send) return;
    send.onclick = async function () {
      var inp = el('oArticle'), qte = parseFloat(el('oQte').value) || 1;
      var err = el('oErr'), ok = el('oOk');
      var item = chercherArticle(inp.value);
      if (!item) { err.textContent = 'Choisissez un produit du catalogue : tapez son code ou son nom.'; return; }
      err.textContent = ''; ok.textContent = 'Envoi…'; send.disabled = true;
      var total = (parseFloat(item.prix) || 0) * qte;
      var order = { id: uid(), numero: 'CMD-' + todayStr().replace(/-/g, '') + '-' + Math.random().toString(36).slice(2, 5).toUpperCase(), clientId: S.client.id, clientNom: S.client.nom, email: S.client.email, tel: el('oTel').value || '', adresse: el('oAdresse').value || '', items: [{ id: item.id, titre: item.titre, code: item.code || '', qte: qte, prix: parseFloat(item.prix) || 0 }], total: total, notes: el('oMsg').value || '', statut: 'nouvelle', createdAt: Date.now(), updatedAt: Date.now() };
      var online = await presenceOnline();
      var thread = newThread(order.clientId, order.clientNom, 'Commande ' + order.numero, 'commande', order.id, 'Bonjour, je souhaite commander ' + qte + ' × ' + item.titre + '.', online);
      S.orders.unshift(order); S.threads.unshift(thread);
      try { await syncSet('mdb_clientOrders', S.orders); await syncSet('mdb_clientThreads', S.threads); ok.textContent = 'Commande envoyée. Le service commercial la confirme.'; send.disabled = false; S.tab = 'messages'; setTimeout(renderApp, 700); }
      catch (e) { ok.textContent = ''; err.textContent = 'Envoi impossible. Réessayez.'; send.disabled = false; }
    };
  }

  function bindMessages() {
    var nb = el('cxNewThread');
    if (nb) nb.onclick = async function () {
      var txt = prompt('Votre message au service commercial :');
      if (!txt || !txt.trim()) return;
      var online = await presenceOnline();
      var th = newThread(S.client.id, S.client.nom, 'Message client', 'message', '', txt.trim(), online);
      S.threads.unshift(th);
      try { await syncSet('mdb_clientThreads', S.threads); S.thread = th.id; renderApp(); } catch (e) { alert('Envoi impossible.'); }
    };
    var send = el('cxSendReply');
    if (send) send.onclick = async function () {
      var ta = el('cxReply'), err = el('cxReplyErr'); var txt = (ta.value || '').trim();
      if (!txt) { err.textContent = 'Écrivez un message.'; return; }
      var t = (S.threads || []).filter(function (x) { return x && x.id === S.thread; })[0]; if (!t) return;
      t.messages = t.messages || [];
      t.messages.push({ auteur: 'client', nom: S.client.nom, texte: txt, at: Date.now() });
      t.updatedAt = Date.now();
      try { await syncSet('mdb_clientThreads', S.threads); ta.value = ''; renderApp(); } catch (e) { err.textContent = 'Envoi impossible.'; }
    };
    var box = el('cxThreadBox'); if (box) box.scrollTop = box.scrollHeight;
  }

  function newThread(clientId, nom, sujet, type, refId, firstMsg, online) {
    var th = { id: uid(), clientId: clientId, clientNom: nom, sujet: sujet, type: type, refId: refId || '', messages: [{ auteur: 'client', nom: nom, texte: firstMsg, at: Date.now() }], statut: 'ouvert', createdAt: Date.now(), updatedAt: Date.now() };
    if (!online) th.messages.push({ auteur: 'admin', nom: 'Service commercial', texte: AUTO_MSG, at: Date.now() + 1, auto: true });
    return th;
  }
  async function presenceOnline() {
    try { var p = await syncGet('mdb_clientPresence'); return !!(p && p.dispo !== false && (Date.now() - (p.at || 0) < 5 * 60 * 1000)); } catch (e) { return false; }
  }

  window.cxQuoteFor = function (id) {
    var g = S.gallery.filter(function (x) { return String(x.id) === String(id); })[0];
    S.tab = 'cotation'; renderApp();
    setTimeout(function () { var i = el('qArticle'); if (i && g) { i.value = articleLabel(g); cxPickArticle('quote', i); } }, 30);
  };
  window.cxOrderFor = function (id) {
    var g = S.gallery.filter(function (x) { return String(x.id) === String(id); })[0];
    S.tab = 'commandes'; renderApp();
    setTimeout(function () { var i = el('oArticle'); if (i && g) { i.value = articleLabel(g); cxPickArticle('order', i); } }, 30);
  };
  window.cxOpenThread = function (id) { S.thread = id; S.tab = 'messages'; renderApp(); };
  window.cxBackThreads = function () { S.thread = null; renderApp(); };
  window.cxOpenThreadForOrder = function (orderId) {
    var t = (S.threads || []).filter(function (x) { return x && x.refId === orderId; })[0];
    if (t) { S.thread = t.id; S.tab = 'messages'; renderApp(); }
    else { S.tab = 'messages'; renderApp(); }
  };

  function logout() {
    S.client = null; S.thread = null;
    try { localStorage.removeItem('mdb_client_session_' + S.uid); } catch (e) {}
    el('cxAppWrap').style.display = 'none';
    renderAuth();
    renderShell();
  }

  async function boot() {
    if (!S.uid && !ENT_ID) {
      renderAuth();
      renderShell();
      return;
    }
    if (!S.uid && ENT_ID) {
      try { var r = await fetch('/api/enterprise?identifiant=' + encodeURIComponent(ENT_ID)); var j = await r.json(); if (j && j.found && j.enterprise) { S.uid = j.enterprise.id; UID = S.uid; } } catch (e) {}
    }
    await bootData();
    if (S.uid) await restoreSession();
    if (!S.client) renderAuth();
    renderShell();
  }

  el('cxRefresh').onclick = async function () {
    await bootData();
    if (S.client) await loadClientData();
    if (S.client) renderApp(); else renderAuth();
  };
  el('cxLogout').onclick = logout;
  setInterval(async function () {
    if (!S.client) return;
    if (S.tab === 'messages') {
      try {
        var th = await syncGet('mdb_clientThreads') || [];
        var before = (S.threads || []).map(function (t) { return t.id + ':' + (t.updatedAt || 0) + ':' + ((t.messages || []).length); }).join('|');
        var after = th.map(function (t) { return t.id + ':' + (t.updatedAt || 0) + ':' + ((t.messages || []).length); }).join('|');
        if (before !== after) { S.threads = th; renderApp(); }
      } catch (e) {}
    }
  }, 30000);

  boot();
})();
</script>
</body>
</html>
