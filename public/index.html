function saveFacture(id) {
  var clientId = document.getElementById('facClient').value;
  if (!clientId) { toast('Veuillez s\u00e9lectionner un client', 'error'); return; }
  var totalHT = 0, totalTVA = 0;
  var defaultTva = parseFloat(document.getElementById('facTVA').value) || 0;
  for (var k = 0; k < formLignes.length; k++) {
    var mt = (formLignes[k].quantite || 0) * (formLignes[k].prixUnitaire || 0);
    var tvaRate = formLignes[k].tvaRate !== undefined ? formLignes[k].tvaRate : defaultTva;
    totalHT += mt;
    totalTVA += mt * tvaRate / 100;
  }
  var totalTTC = totalHT + totalTVA;
  var blIds = [];
  for (var k2 = 0; k2 < formLignes.length; k2++) {
    if (formLignes[k2].blId && blIds.indexOf(formLignes[k2].blId) === -1) blIds.push(formLignes[k2].blId);
  }
  var bcIds = [];
  for (var k3 = 0; k3 < formLignes.length; k3++) {
    if (formLignes[k3].bcId && bcIds.indexOf(formLignes[k3].bcId) === -1) bcIds.push(formLignes[k3].bcId);
  }
  var statut = document.getElementById('facStatut').value;
  var data = {
    numero: document.getElementById('facNumero').value.trim(), clientId: clientId,
    dateEmission: document.getElementById('facDate').value, echeance: document.getElementById('facEcheance').value,
    statut: statut, lignes: formLignes.slice(),
    total: totalHT, tva: totalTVA > 0 ? 'oui' : 'non', tvaAmount: totalTVA, totalTTC: totalTTC, tauxTvaDefaut: defaultTva,
    blIds: blIds, bcIds: bcIds
  };
  var factures = getFactures();
  var oldBlIds = [];
  if (id) {
    for (var i = 0; i < factures.length; i++) {
      if (factures[i].id === id) {
        oldBlIds = factures[i].blIds || (factures[i].blId ? [factures[i].blId] : []);
        data.id = id;
        data.montantPaye = factures[i].montantPaye || 0;
        factures[i] = data;
        break;
      }
    }
  } else {
    data.id = DB.genId(); data.montantPaye = 0; factures.push(data);
  }
  DB.set('mdb_factures', factures);
  if (statut === 'brouillon') {
    if (id) updateBLFactureLinks(oldBlIds, [], null);
  } else {
    updateBLFactureLinks(oldBlIds, blIds, data.id);
  }
  closeModal();
  clearDraft('factures');
  toast('Facture enregistr\u00e9e');
  renderFactures();
  buildSidebar();
}

function updateBLFactureLinks(oldBlIds, newBlIds, facId) {
  var bls = getBLs();
  for (var i = 0; i < bls.length; i++) {
    if (oldBlIds.indexOf(bls[i].id) !== -1) bls[i].factureId = null;
    if (newBlIds.indexOf(bls[i].id) !== -1) bls[i].factureId = facId;
  }
  DB.set('mdb_bl', bls);
}

function deleteFacture(id) {
  openConfirm('\u00cates-vous s\u00fbr de vouloir supprimer cette facture ?', function() {
    var factures = getFactures(); var blIds = []; var result = [];
    for (var i = 0; i < factures.length; i++) {
      if (factures[i].id === id) blIds = factures[i].blIds || (factures[i].blId ? [factures[i].blId] : []);

    }
    DB.set('mdb_factures', result);

}

function renderPrefinClients(el) {

function renderAcomptesPrets() {
  var acomptes = DB.get('mdb_acomptesPrets') || [];
  var employes = getEmployes();
  var empMap = {};
  for (var i = 0; i < employes.length; i++) empMap[employes[i].id] = employes[i];
  var totalAcomptes = 0, totalPrets = 0, totalRembourse = 0;
  for (var i = 0; i < acomptes.length; i++) {
    var a = acomptes[i];
    if (a.type === 'acompte') totalAcomptes += a.montant || 0;
    else totalPrets += a.montant || 0;
    totalRembourse += a.montantRembourse || 0;
  }
  var totalRestant = totalPrets - totalRembourse;
  var html = '<div class="stats-grid">';
  html += '<div class="stat-card"><div class="stat-info"><div class="stat-value">' + fmtMoney(totalAcomptes) + '</div><div class="stat-label">Total acomptes vers\u00e9s</div></div></div>';
  html += '<div class="stat-card"><div class="stat-info"><div class="stat-value" style="color:var(--primary)">' + fmtMoney(totalPrets) + '</div><div class="stat-label">Total pr\u00eats accord\u00e9s</div></div></div>';
  html += '<div class="stat-card"><div class="stat-info"><div class="stat-value" style="color:var(--warning)">' + fmtMoney(totalRembourse) + '</div><div class="stat-label">Total rembours\u00e9</div></div></div>';
  html += '<div class="stat-card"><div class="stat-info"><div class="stat-value" style="color:var(--danger)">' + fmtMoney(Math.max(0, totalRestant)) + '</div><div class="stat-label">Reste \u00e0 rembourser</div></div></div>';
  html += '</div>';
  /* R\u00e9capitulatif par employ\u00e9 */
  var empStats = {};
  for (var esi = 0; esi < acomptes.length; esi++) {
    var ae = acomptes[esi];

function saveAcomptePret(id) {
  var type = document.getElementById('apType').value;

  var montant = parseFloat(document.getElementById('apMontant').value) || 0;
  var duree = parseInt(document.getElementById('apDuree').value) || 0;

  var montantMensuel = (type === 'pret' && duree > 0) ? Math.round(montant / duree) : 0;
  var employeNom = '';
  var empList = getEmployes();
  for (var i = 0; i < empList.length; i++) { if (empList[i].id === employeId) { employeNom = empList[i].nom; break; } }
  var list = DB.get('mdb_acomptesPrets') || [];

    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) { data.date = list[i].date; data.montantRembourse = list[i].montantRembourse || 0; data.caisseOpId = list[i].caisseOpId || ''; data.numeroPiece = list[i].numeroPiece || ''; list[i] = data; break; }
    }
    /* Sync apType on linked caisse operation */
    if (data.caisseOpId) {
      var opsSync = getOperationsCaisse();
      for (var osi = 0; osi < opsSync.length; osi++) { if (opsSync[osi].id === data.caisseOpId) { opsSync[osi].apType = type; break; } }
      DB.set('mdb_operationsCaisse', opsSync);
    }
  } else {
    var caisses = getCaisses();
    var defaultCaisseId = (currentUser && currentUser.caisseId) ? currentUser.caisseId : (caisses.length > 0 ? caisses[0].id : '');
    var caisseOpId = '';
    var numeroPiece = '';
    if (defaultCaisseId) {
      var opId = DB.genId();
      numeroPiece = generatePieceNumber(defaultCaisseId, getToday());
      caisseOpId = opId;
      var ops = getOperationsCaisse();
      ops.push({id: opId, numeroPiece: numeroPiece, date: getToday(), heure: '', codeId: '', libelle: type === 'acompte' ? 'Acompte employ\u00e9 : ' + employeNom : 'Pr\u00eat employ\u00e9 : ' + employeNom, montant: montant, sens: 'sortie', moyenPaiement: 'Esp\u00e8ce', numeroTransaction: '', beneficiaireType: 'employe', beneficiaireId: employeId, beneficiaireNom: employeNom, tiers: motif || notes, observations: motif || notes, remettant: employeNom, imprime: false, montantCharge: 0, caisseId: defaultCaisseId, reversed: false, acomptePretId: data.id, apType: type});
      DB.set('mdb_operationsCaisse', ops);
    }
    data.caisseOpId = caisseOpId;
    data.numeroPiece = numeroPiece;
    list.push(data);
  }
  DB.set('mdb_acomptesPrets', list);

}
function enregistrerRemboursementAcompte(id) {
  var list = DB.get('mdb_acomptesPrets') || [];
  for (var i = 0; i < list.length; i++) { if (list[i].id === id) { var mensualite = list[i].montantMensuel || list[i].montant || 0; list[i].montantRembourse = (list[i].montantRembourse || 0) + mensualite; if (list[i].montantRembourse >= list[i].montant) { list[i].montantRembourse = list[i].montant; list[i].statut = 'rembourse'; } break; } }

function deleteAcomptePret(id) {
  if (!window.confirm('Supprimer cet acompte / pr\u00eat ?')) return;
  var list = DB.get('mdb_acomptesPrets') || [];
  var r = [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === id && list[i].caisseOpId) {
      var ops2 = getOperationsCaisse();
      var ops3 = [];
      for (var j = 0; j < ops2.length; j++) { if (ops2[j].id !== list[i].caisseOpId) ops3.push(ops2[j]); }

}

  var info = document.getElementById('pfBCInfo');
  if (!bcSel || !info) return;
  if (!bcSel.value) { info.innerHTML = ''; return; }
  var bc = getBCById(bcSel.value);
  if (!bc) { info.innerHTML = ''; return; }
  var totalHT = 0;
  if (bc.lignes) {
    for (var i = 0; i < bc.lignes.length; i++) {
      totalHT += (bc.lignes[i].quantite || 0) * (bc.lignes[i].prixUnitaire || 0);
    }
  }
  var tva = totalHT * 0.18;
  var ttc = totalHT + tva;
  var html = '<div class="card" style="padding:12px;margin-top:8px;background:var(--primary-light);border:1px solid var(--primary);border-radius:8px">';
  html += '<strong>BC : ' + escH(bc.numero || '(sans num\u00e9ro)') + '</strong><br>';
  html += 'Total HT : <strong>' + fmtMoney(totalHT) + '</strong><br>';
  html += 'TVA (18%) : ' + fmtMoney(tva) + '<br>';
  html += '<strong style="color:var(--primary);font-size:16px">Total TTC : ' + fmtMoney(ttc) + '</strong>';
  html += '</div>';
  info.innerHTML = html;
  var htEl = document.getElementById('pfTotalHT');
  if (htEl) htEl.value = totalHT;
  calcPFMontant();
}

function calcPFMontant() {
  var tauxEl = document.getElementById('pfTaux');
  var htEl = document.getElementById('pfTotalHT');
  var montantEl = document.getElementById('pfMontantAccorde');
  if (!tauxEl || !htEl || !montantEl) return;
  var taux = parseFloat(tauxEl.value) || 0;
  var totalHT = parseFloat(htEl.value) || 0;
  var montant = Math.round(totalHT * taux / 100);
  montantEl.value = montant;
}

function calcPFTauxFromMontant() {
  var tauxEl = document.getElementById('pfTaux');
  var htEl = document.getElementById('pfTotalHT');
  var montantEl = document.getElementById('pfMontantAccorde');
  if (!tauxEl || !htEl || !montantEl) return;
  var totalHT = parseFloat(htEl.value) || 0;
  var montant = parseFloat(montantEl.value) || 0;
  if (totalHT > 0) {
    var tauxCalc = Math.round(montant / totalHT * 10000) / 100;
    tauxEl.value = tauxCalc;
  }
}

function calcPFEcheance() {
  var accord = document.getElementById('pfDateAccord');
  var duree = document.getElementById('pfDuree');
  var echeance = document.getElementById('pfEcheance');
  if (!accord || !duree || !echeance) return;
  if (accord.value && duree.value) {
    var d = new Date(accord.value);
    d.setMonth(d.getMonth() + parseInt(duree.value) || 0);
    var y = d.getFullYear();
    var m = (d.getMonth() + 1 < 10 ? '0' : '') + (d.getMonth() + 1);
    var j = (d.getDate() < 10 ? '0' : '') + d.getDate();
    echeance.value = y + '-' + m + '-' + j;
  }
}

function saveReglement(id) {
  var clientId = document.getElementById('regClient').value;
  var montant = parseFloat(document.getElementById('regMontant').value) || 0;
  if (!clientId || !montant) { toast('Client et montant sont obligatoires', 'error'); return; }
  var factureId = document.getElementById('regFacture').value;
  var dest = document.getElementById('regDest') ? document.getElementById('regDest').value : 'caisse';
  var clientBankId = dest === 'banque' ? (document.getElementById('regBanqueId') ? document.getElementById('regBanqueId').value : '') : '';
  var data = {clientId:clientId, factureId:factureId||null, date:document.getElementById('regDate').value, montant:montant, modePaiement:document.getElementById('regMode').value, reference:document.getElementById('regRef').value.trim(), notes:document.getElementById('regNotes').value.trim(), dest:dest, clientBankId:clientBankId};
  var regs = getReglements();
  var oldReg = null;
  if (id) {
    for (var i = 0; i < regs.length; i++) { if (regs[i].id === id) { oldReg = regs[i]; data.id = id; regs[i] = data; break; } }
  } else { data.id = DB.genId(); regs.push(data); }
  DB.set('mdb_reglements', regs);
  updateFactureFromReglement(oldReg, data);
  closeModal();
  toast('R\u00e8glement enregistr\u00e9');
  renderTresorerie();
  buildSidebar();
}

function updateFactureFromReglement(oldReg, newReg) {
  var factures = getFactures();
  if (oldReg && oldReg.factureId) {
    for (var i = 0; i < factures.length; i++) {
      if (factures[i].id === oldReg.factureId) {
        factures[i].montantPaye = Math.max(0, (factures[i].montantPaye || 0) - (oldReg.montant || 0));
        updateFactureStatut(factures[i]);
        break;
      }
    }
  }
  if (newReg && newReg.factureId) {
    for (var j = 0; j < factures.length; j++) {
      if (factures[j].id === newReg.factureId) {
        factures[j].montantPaye = (factures[j].montantPaye || 0) + (newReg.montant || 0);
        updateFactureStatut(factures[j]);
        break;
      }
    }
  }
  DB.set('mdb_factures', factures);
}

function updateFactureStatut(f) {
  var restant = (f.total || 0) - (f.montantPaye || 0);
  if (restant <= 0) f.statut = 'payee';
  else if (f.montantPaye > 0) f.statut = 'partielle';
}

function deleteReglement(id) {
  if (!window.confirm('\u00cates-vous s\u00fbr de vouloir supprimer ce r\u00e8glement ?')) return;
  var regs = getReglements(); var oldReg = null; var result = [];
  for (var i = 0; i < regs.length; i++) { if (regs[i].id === id) oldReg = regs[i]; else result.push(regs[i]); }
  DB.set('mdb_reglements', result);
  if (oldReg) updateFactureFromReglement(oldReg, null);
  toast('R\u00e8glement supprim\u00e9');
  renderTresorerie();
  buildSidebar();
}

function saveReglementDirect(clientId, factureId) {
  var montant = parseFloat(document.getElementById('regMontantDirect').value) || 0;
  var date = document.getElementById('regDateDirect').value;
  var mode = document.getElementById('regModeDirect').value;
  var ref = document.getElementById('regRefDirect').value.trim();
  var dest = document.getElementById('regDestDirect').value;
  if (montant <= 0) { toast('Le montant doit \u00eatre positif', 'error'); return; }
  if (!date) { toast('La date est obligatoire', 'error'); return; }
  var reg = {id:DB.genId(), clientId:clientId, factureId:factureId, montant:montant, date:date, modePaiement:mode, reference:ref, dateEnregistrement:getToday()};
  var regs = getReglements();
  regs.push(reg);
  DB.set('mdb_reglements', regs);
  updateFactureFromReglement(null, reg);
  if (dest === 'banque') {
    var banqueOps = DB.get('mdb_banqueOperations') || [];
    banqueOps.push({id:DB.genId(), date:date, sens:'entree', montant:montant, libelle:'R\u00e9glement client ' + (getClientById(clientId) ? getClientById(clientId).nom : ''), beneficiaireType:'client', beneficiaireId:clientId, beneficiaireNom:getClientById(clientId) ? getClientById(clientId).nom : ''});
    DB.set('mdb_banqueOperations', banqueOps);
  } else {
    var ops = getOperationsCaisse();
    var caisses = getCaisses();
    var caisseId = dest;
    if (caisses.length > 0 && !caisseId) caisseId = caisses[0].id;
    for (var ci = 0; ci < caisses.length; ci++) {
      if (caisses[ci].type === 'generale') { caisseId = caisses[ci].id; break; }
    }
    ops.push({id:DB.genId(), caisseId:caisseId, date:date, heure:new Date().toTimeString().substr(0,5), sens:'entree', montant:montant, libelle:'R\u00e9glement client ' + (getClientById(clientId) ? getClientById(clientId).nom : ''), beneficiaireType:'client', beneficiaireId:clientId, beneficiaireNom:getClientById(clientId) ? getClientById(clientId).nom : '', moyenPaiement:mode, observations:ref});
    DB.set('mdb_operationsCaisse', ops);
  }
  closeModal();
  toast('R\u00e8glement enregistr\u00e9');

function renderActif() {
  var actif = getActif();
  var readonly = isReadonly('actif');
  var caisses = getCaisses();
  var factures = getFactures();
  var bls = getBLs();
  var dettesFArr = getDettesFournisseurs();
  var fournisseurs = getFournisseurs();
  var clients = getClients();
  var cdArr = getCreancesDouteuses();
  var stocks = DB.get('mdb_stocks') || [];
  var prefins = getPrefinancements();
  var reglements = getReglements();
  var html = '';

  // Compute all data
  var ops = getOperationsCaisse();
  var prefins = getPrefinancements();
  // 1. TRESORERIE - compute solde dynamically from operations
  var soldeCaisses = 0;
  for (var ci = 0; ci < caisses.length; ci++) {
    var soldeC = caisses[ci].soldeInitial || 0;
    for (var oi = 0; oi < ops.length; oi++) {
      if (ops[oi].caisseId === caisses[ci].id) {
        if (ops[oi].sens === 'entree') soldeC += ops[oi].montant || 0;
        else soldeC -= ops[oi].montant || 0;
      }
    }
    soldeCaisses += soldeC;
  }
  var financementReste = 0, reservesDispo = 0, reservesIndispo = 0;
  var pfActifs = [];
  for (var pi = 0; pi < prefins.length; pi++) {
    if (prefins[pi].statut === 'approuve') {
      pfActifs.push(prefins[pi]);
      var mA = prefins[pi].montantAccorde || 0;
      var mR = prefins[pi].montantRembourse || 0;
      financementReste += Math.max(0, mA - mR);
      var rI = Math.round(mA * 0.10);
      if (mA > 0 && mR >= mA) {
        reservesDispo += rI;
      } else if (mA > 0 && mR > 0) {
        reservesDispo += Math.round(rI * mR / mA);
      }
    }
  }
  reservesIndispo = 0;
  for (var pi2 = 0; pi2 < prefins.length; pi2++) {
    if (prefins[pi2].statut === 'approuve') {
      var mA2 = prefins[pi2].montantAccorde || 0;
      var mR2 = prefins[pi2].montantRembourse || 0;
      var rI2 = Math.round(mA2 * 0.10);
      if (mA2 > 0 && mR2 < mA2) {
        reservesIndispo += Math.max(0, rI2 - (mR2 > 0 ? Math.round(rI2 * mR2 / mA2) : 0));
      }
    }
  }
  var tresorerieTotal = soldeCaisses - financementReste + reservesDispo;

  // 2. FACTURES A RECOUVRER (client balances, only non-zero)
  var clientBalances = {};
  for (var fi = 0; fi < factures.length; fi++) {
    var f = factures[fi];
    var reste = (f.total || 0) - (f.montantPaye || 0);
    var cid = f.clientId || '_none';
    if (!clientBalances[cid]) clientBalances[cid] = 0;
    clientBalances[cid] += reste;
  }
  for (var ci3 = 0; ci3 < clients.length; ci3++) {
    var cl = clients[ci3];
    var siInit = cl.soldeInitial || 0;
    if (siInit !== 0) {
      var cid2 = cl.id;
      if (!clientBalances[cid2]) clientBalances[cid2] = 0;
      if (cl.typeSolde === 'crediteur') clientBalances[cid2] -= siInit;
      else clientBalances[cid2] += siInit;
    }
  }
  var facturesRecouvrerDetails = [];
  var facturesRecouvrerTotal = 0;
  for (var cid3 in clientBalances) {
    if (!clientBalances.hasOwnProperty(cid3)) continue;
    if (clientBalances[cid3] === 0) continue;
    var clObj = getClientById(cid3);
    var montant = clientBalances[cid3];
    facturesRecouvrerDetails.push({id:'frc_' + cid3, designation: clObj ? clObj.nom : 'Inconnu', montant: montant, signe: montant >= 0 ? '+' : '-'});
    facturesRecouvrerTotal += montant;
  }
  facturesRecouvrerDetails.sort(function(a,b) { return Math.abs(b.montant) - Math.abs(a.montant); });

  // 3. BL A FACTURER
  var blDetails = [];
  var blTotal = 0;
  for (var blfi = 0; blfi < bls.length; blfi++) {
    var bl = bls[blfi];
    if (!bl.factureId && bl.lignes) {
      var blCl = getClientById(bl.clientId);
      for (var blfl = 0; blfl < bl.lignes.length; blfl++) {
        var ln = bl.lignes[blfl];
        var mt = (ln.quantite || 0) * (ln.prixUnitaire || 0);
        blDetails.push({id:'bl_' + bl.id + '_' + blfl, designation: (blCl ? blCl.nom + ' - ' : '') + (ln.designation || getArticleLabel(ln.articleId)), montant: mt, signe: '+', qte: ln.quantite, prix: ln.prixUnitaire, date: bl.dateLivraison, numero: bl.numero || ''});
        blTotal += mt;
      }
    }
  }

  // 4. STOCK
  var stockDetails = [];
  var stockTotal = 0;
  for (var stk = 0; stk < stocks.length; stk++) {
    var s = stocks[stk];
    var mt2 = (s.quantite || 0) * (s.prixUnitaire || 0);
    stockDetails.push({id:'stk_' + s.id, designation: s.articleNom || s.articleCode || 'Article', montant: mt2, signe: '+', qte: s.quantite, prix: s.prixUnitaire});
    stockTotal += mt2;
  }

  // 5. DETTE FOURNISSEUR
  var dettesFDetails = [];
  var dettesFTotal = 0;
  var fBalances = {};
  for (var dfi = 0; dfi < dettesFArr.length; dfi++) {
    var df = dettesFArr[dfi];
    var fid = df.fournisseurId || '_none';
    var fNom = df.fournisseurNom || df.fournisseur || 'Inconnu';
    if (!fBalances[fid]) fBalances[fid] = {nom: fNom, montant: 0};
    fBalances[fid].montant += (df.montant || 0) - (df.montantPaye || 0);
  }
  for (var fri = 0; fri < fournisseurs.length; fri++) {
    var fr = fournisseurs[fri];
    var siF = fr.soldeInitial || 0;
    if (siF !== 0) {
      if (!fBalances[fr.id]) fBalances[fr.id] = {nom: fr.nom, montant: 0};
      if (fr.typeSolde === 'debiteur') fBalances[fr.id].montant -= siF;
      else fBalances[fr.id].montant += siF;
    }
  }
  for (var fid2 in fBalances) {
    if (!fBalances.hasOwnProperty(fid2)) continue;
    var fBal = fBalances[fid2];
    if (fBal.montant === 0) continue;
    var signeF = fBal.montant > 0 ? '-' : '+';
    dettesFDetails.push({id:'df_' + fid2, designation: fBal.nom, montant: fBal.montant, signe: signeF});
    dettesFTotal += fBal.montant;
  }

  // 6. CREANCE DOUTEUSE (auto-detect invoices unpaid >1 year + manual entries)
  var cdDetails = [];
  var cdTotal = 0;
  var todayDate = getToday();
  var oneYearAgo = new Date();
  oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
  var oneYearAgoStr = oneYearAgo.getFullYear() + '-' + (oneYearAgo.getMonth() < 9 ? '0' : '') + (oneYearAgo.getMonth() + 1) + '-' + (oneYearAgo.getDate() < 10 ? '0' : '') + oneYearAgo.getDate();
  for (var cfi = 0; cfi < factures.length; cfi++) {
    var cf = factures[cfi];
    if (cf.statut === 'payee') continue;
    var resteCF = (cf.total || 0) - (cf.montantPaye || 0);
    if (resteCF <= 0) continue;
    if (cf.dateEmission && cf.dateEmission < oneYearAgoStr) {
      var clCF = getClientById(cf.clientId);
      cdDetails.push({id:'auto_cd_' + cf.id, designation: (clCF ? clCF.nom : 'Inconnu') + ' - Facture ' + (cf.numero || ''), montant: resteCF, signe: '+'});
      cdTotal += resteCF;
    }
  }
  for (var cdi = 0; cdi < cdArr.length; cdi++) {
    if ((cdArr[cdi].statut || 'en_cours') === 'en_cours') {
      var clCd = getClientById(cdArr[cdi].clientId);
      cdDetails.push({id:'man_cd_' + cdArr[cdi].id, designation: (clCd ? clCd.nom : 'Inconnu') + ' - ' + (cdArr[cdi].motif || ''), montant: cdArr[cdi].montant || 0, signe: '+'});
      cdTotal += (cdArr[cdi].montant || 0);
    }
  }

  // Build the actif page
  var hideZero = DB.get('mdb_actif_hideZero') || false;

  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  html += '<h2 style="margin:0">Actif</h2>';

      {designation:'Solde caisses', montant:soldeCaisses, signe:soldeCaisses >= 0 ? '+' : '-', clickable:true, subDetails:(function(){var sd=[];for(var ci2=0;ci2<caisses.length;ci2++){var s=caisses[ci2].soldeInitial||0;for(var oi2=0;oi2<ops.length;oi2++){if(ops[oi2].caisseId===caisses[ci2].id){if(ops[oi2].sens==='entree')s+=ops[oi2].montant||0;else s-=ops[oi2].montant||0;}}if(s!==0)sd.push({designation:caisses[ci2].nom,montant:s,signe:s>=0?'+':'-'});}return sd;})()},

      {designation:'R\u00e9serve disponible', montant:reservesDispo, signe:'+', clickable:true, subDetails:(function(){var sd3=[];for(var pi4=0;pi4<pfActifs.length;pi4++){var mA4=pfActifs[pi4].montantAccorde||0;var mR4=pfActifs[pi4].montantRembourse||0;var rD=Math.round(mA4*0.10);var rd=0;if(mA4>0&&mR4>=mA4)rd=rD;else if(mA4>0&&mR4>0)rd=Math.round(rD*mR4/mA4);if(rd>0)sd3.push({designation:(getClientById(pfActifs[pi4].clientId)?getClientById(pfActifs[pi4].clientId).nom:'Client')+' ('+rd+' FCFA)',montant:rd,signe:'+'});}return sd3;})()},

          html += '<button class="btn-icon danger" onclick="event.stopPropagation();deleteLigneForRubrique(\'' + rub.key + '\',\'' + d.id.replace('man_','') + '\')" title="Supprimer"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>';

  // Grand total

    html += '<div>';
    if (!readonly) {

      html += '<button class="btn-icon danger" onclick="event.stopPropagation();deleteRubrique(\'' + mRub.id + '\')" title="Supprimer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>';
    }
    html += '</div></div>';
    html += '<div class="section-body" style="padding:0">';
    html += '<div class="table-responsive"><table><thead><tr><th>D\u00e9signation</th><th style="text-align:right">Montant</th>';
    if (!readonly) html += '<th style="width:120px">Actions</th>';
    html += '</tr></thead><tbody>';
    var mLignes = mRub.lignes || [];
    var mLignesVis = mLignes;
    if (hideZero) { mLignesVis = []; for (var hz = 0; hz < mLignes.length; hz++) { if (mLignes[hz].montant !== 0) mLignesVis.push(mLignes[hz]); } }
    for (var mli = 0; mli < mLignesVis.length; mli++) {
      var ml3 = mLignesVis[mli];
      var ms3 = ml3.signe || '+';
      var mlMontantVal = ms3 === '-' ? -Math.abs(ml3.montant || 0) : Math.abs(ml3.montant || 0);
      html += '<tr>';
      html += '<td>' + escH(ml3.designation) + '</td>';
      html += '<td class="text-right fw-600" style="color:' + (mlMontantVal < 0 ? 'var(--danger)' : 'var(--success)') + '">' + (ms3 === '-' ? '- ' : '+ ') + fmtMoney(Math.abs(ml3.montant || 0)) + '</td>';
      if (!readonly) {
        html += '<td>';
        if (mli > 0) html += '<button class="btn-icon" onclick="moveLigneUp(\'' + mRub.id + '\',\'' + ml3.id + '\')" title="Monter"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg></button> ';
        if (mli < mLignesVis.length - 1) html += '<button class="btn-icon" onclick="moveLigneDown(\'' + mRub.id + '\',\'' + ml3.id + '\')" title="Descendre"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button> ';

        html += '<button class="btn-icon danger" onclick="deleteLigne(\'' + mRub.id + '\',\'' + ml3.id + '\')" title="Supprimer"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>';

function toggleActifDetail(id) { var el = document.getElementById(id); if (el) el.style.display = el.style.display === 'none' ? '' : 'none'; }
function unlockActifDash() {
  var pin = document.getElementById('actifDashPinInput').value;
  var stored = DB.get('mdb_actif_pin');
  if (!pin || pin !== stored) { document.getElementById('actifDashPinErr').textContent = 'Code PIN incorrect'; return; }
  document.getElementById('actifDashLocked').style.display = 'none';
  document.getElementById('actifDashUnlocked').style.display = '';
}
function setActifPin() {
  var stored = DB.get('mdb_actif_pin');
  if (stored) {
    openFormModal('Modifier le code PIN de l\'actif', '<div class="form-group"><label>Ancien PIN *</label><input type="password" id="oldPinInput" placeholder="Ancien code PIN"></div><div class="form-group"><label>Nouveau PIN *</label><input type="password" id="newPinInput" placeholder="Nouveau code PIN"></div><div class="form-group"><label>Confirmer le nouveau PIN *</label><input type="password" id="confirmPinInput" placeholder="Confirmer le code PIN"></div>', '<button class="btn btn-outline" onclick="closeModal()">Annuler</button> <button class="btn btn-primary" onclick="saveActifPin()">Enregistrer</button>');
  } else {
    openFormModal('D\u00e9finir le code PIN de l\'actif', '<div class="form-group"><label>Nouveau PIN *</label><input type="password" id="newPinInput" placeholder="Code PIN pour verrouiller l\'actif"></div><div class="form-group"><label>Confirmer le PIN *</label><input type="password" id="confirmPinInput" placeholder="Confirmer le code PIN"></div>', '<button class="btn btn-outline" onclick="closeModal()">Annuler</button> <button class="btn btn-primary" onclick="saveActifPin()">Enregistrer</button>');
  }
}
function saveActifPin() {
  var stored = DB.get('mdb_actif_pin');
  if (stored) {
    var oldPin = document.getElementById('oldPinInput').value;
    if (oldPin !== stored) { toast('Ancien code PIN incorrect', 'error'); return; }
  }
  var newPin = document.getElementById('newPinInput').value;
  var confPin = document.getElementById('confirmPinInput').value;
  if (!newPin) { toast('Le nouveau PIN est obligatoire', 'error'); return; }
  if (newPin !== confPin) { toast('Les PIN ne correspondent pas', 'error'); return; }
  DB.set('mdb_actif_pin', newPin);
  closeModal(); toast('Code PIN enregistr\u00e9');
  renderDashboard();
}
function removeActifPin() {
  var stored = DB.get('mdb_actif_pin');
  if (!stored) { toast('Aucun PIN d\u00e9fini'); return; }
  openFormModal('Supprimer le code PIN', '<div class="form-group"><label>Saisissez le PIN actuel pour confirmer *</label><input type="password" id="removePinInput" placeholder="Code PIN actuel"></div>', '<button class="btn btn-outline" onclick="closeModal()">Annuler</button> <button class="btn btn-danger" onclick="confirmRemoveActifPin()">Supprimer le PIN</button>');
}
function confirmRemoveActifPin() {
  var pin = document.getElementById('removePinInput').value;
  var stored = DB.get('mdb_actif_pin');
  if (pin !== stored) { toast('Code PIN incorrect', 'error'); return; }
  DB.set('mdb_actif_pin', '');
  closeModal(); toast('Code PIN supprim\u00e9');
  renderDashboard();
}

function toggleRubrique(header) {
  var section = header.parentElement;
  var body = section.querySelector('.section-body');
  if (body) { body.style.display = body.style.display === 'none' ? '' : 'none'; }
}

function openRubriqueModal(id) {
  var rub = null;
  if (id) { var actif = getActif(); for (var i = 0; i < actif.rubriques.length; i++) { if (actif.rubriques[i].id === id) { rub = actif.rubriques[i]; break; } } }
  var title = rub ? 'Modifier la rubrique' : 'Nouvelle rubrique';
  var suggestions = ['Immobilisations','Pr\u00e9visionnel','Charges \u00e0 payer','Produits \u00e0 recevoir','Capital','Emprunts'];
  var html = '<div class="form-group"><label>Nom de la rubrique *</label><input type="text" id="rubNom" value="' + escH(rub ? rub.nom : '') + '" list="rubSuggestions" placeholder="Ex: Tr\u00e9sorerie, Stock..."><datalist id="rubSuggestions">';
  for (var s = 0; s < suggestions.length; s++) html += '<option value="' + escH(suggestions[s]) + '">';
  html += '</datalist></div>';
  var footer = '<button class="btn btn-outline" onclick="closeModal()">Annuler</button>';
  footer += '<button class="btn btn-primary" onclick="saveRubrique(\'' + (id || '') + '\')">Enregistrer</button>';
  openFormModal(title, html, footer);
}

function saveRubrique(id) {
  var nom = document.getElementById('rubNom').value.trim();
  if (!nom) { toast('Le nom est obligatoire', 'error'); return; }
  var actif = getActif();

function renderTaches() {
  var data = getTaches();
  var userId = currentUser ? currentUser.id : '';

    if (!data[i].userId || data[i].userId === userId) filtered.push(data[i]);
  }

  html += '<select id="filterTacheStatut" onchange="filterTaches()"><option value="non_termine">En cours</option><option value="">Tous statuts</option><option value="a_faire">\u00c0 faire</option><option value="en_cours">En cours</option><option value="termine">Termin\u00e9e</option></select>';
  html += '<div style="flex:1"></div>';
  if (!isReadonly('taches')) html += '<button class="btn btn-primary" onclick="openTacheModal()">+ Nouvelle</button>';
  html += '</div>';
  html += '<div class="card"><div class="card-body no-pad"><table><thead><tr><th>Titre</th><th>D\u00e9but</th><th>Limite</th><th>Fin</th><th>Priorit\u00e9</th><th>Statut</th><th>Ex\u00e9cution</th><th style="width:100px">Actions</th></tr></thead><tbody id="tachesTableBody"></tbody></table></div></div>';
  document.getElementById('content').innerHTML = html;
  filterTaches();
}
function filterTaches() {
  var q = (document.getElementById('searchTaches') || {} ).value || '';
  q = q.toLowerCase();
  var sf = (document.getElementById('filterTacheStatut') || {}).value || '';
  var data = getTaches();
  var userId = currentUser ? currentUser.id : '';
  var result = [];
  for (var i = 0; i < data.length; i++) {
    var t = data[i];
    if (t.userId && t.userId !== userId) continue;
    if (q && (t.titre + ' ' + (t.description || '')).toLowerCase().indexOf(q) < 0) continue;
    if (sf === 'non_termine' && t.statut === 'termine') continue;
    else if (sf && sf !== 'non_termine' && t.statut !== sf) continue;
    result.push(t);
  }
  var prio = {urgente: 0, haute: 1, moyenne: 2, basse: 3};
  result.sort(function(a, b) {
    if (a.statut === 'termine' && b.statut !== 'termine') return 1;
    if (a.statut !== 'termine' && b.statut === 'termine') return -1;
    return (prio[a.priorite] || 2) - (prio[b.priorite] || 2);
  });
  var stBadge = {a_faire: '<span class="badge badge-primary">\u00c0 faire</span>', en_cours: '<span class="badge badge-purple">En cours</span>', termine: '<span class="badge badge-success">Termin\u00e9e</span>'};
  var prioLabel = {basse: 'Basse', moyenne: 'Moyenne', haute: 'Haute', urgente: 'Urgente'};
  var prioColor = {basse: 'var(--gray-400)', moyenne: 'var(--primary)', haute: 'var(--warning)', urgente: 'var(--danger)'};
  var tb = document.getElementById('tachesTableBody');
  if (!tb) return;
  if (!result.length) { tb.innerHTML = '<tr><td colspan="8"><div class="empty-state"><p>Aucune t\u00e2che</p></div></td></tr>'; return; }
  var html = '';
  for (var i = 0; i < result.length; i++) {
    var t = result[i];
    var ov = t.statut !== 'termine' && t.dateLimite && daysUntil(t.dateLimite) < 0;
    html += '<tr' + (ov ? ' style="background:var(--danger-light)"' : '') + '>';
    html += '<td><strong>' + escH(t.titre) + '</strong>' + (t.description ? '<br><small class="text-muted">' + escH(t.description.substring(0, 40)) + '</small>' : '') + '</td>';
    html += '<td>' + fmtDate(t.dateDebut) + '</td>';
    html += '<td>' + fmtDate(t.dateLimite) + (ov ? '<br><small style="color:var(--danger);font-weight:600">En retard !</small>' : '') + '</td>';
    html += '<td>' + fmtDate(t.dateFin) + '</td>';
    html += '<td><span style="color:' + (prioColor[t.priorite] || 'var(--gray-400)') + ';font-weight:600;font-size:12px">' + (prioLabel[t.priorite] || t.priorite) + '</span></td>';
    html += '<td>' + (stBadge[t.statut] || t.statut) + '</td>';
    var execLabel = t.execute ? '<span class="badge badge-success">Oui</span>' : '<span class="badge badge-warning">Non</span>';
    html += '<td><span onclick="toggleTacheExec(\'' + t.id + '\')" style="cursor:pointer">' + execLabel + '</span></td>';
    html += '<td>';
    if (!isReadonly('taches')) {
      html += '<button class="btn-icon" onclick="openTacheModal(\'' + t.id + '\')" title="Modifier"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button> ';
      html += '<button class="btn-icon danger" onclick="deleteTache(\'' + t.id + '\')" title="Supprimer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>';
    }
    html += '</td></tr>';
  }
  tb.innerHTML = html;
}

function saveUser(id) {
  var nom = document.getElementById('fUNom').value.trim();
  var login = document.getElementById('fULogin').value.trim();
  var pass = document.getElementById('fUPass').value;
  var pass2 = document.getElementById('fUPass2').value;
  var typeEl = document.querySelector('input[name="fUType"]:checked');
  var adminType = typeEl ? typeEl.value : 'user';
  var isAdmin = adminType === 'admin';
  if (!nom || !login) { toast('Remplir les champs obligatoires', 'error'); return; }
  if (!id && !pass) { toast('Mot de passe requis', 'error'); return; }
  if (pass && pass !== pass2) { toast('Les mots de passe ne correspondent pas', 'error'); return; }
  var sections = {};
  var deniedPages = [];
  var pageList = ['dashboard', 'tiers', 'facturation', 'nomenclature', 'prefinancement', 'comptabilite', 'actif', 'taches', 'tresorerie', 'creance', 'employes', 'licences', 'utilisateurs', 'entreprise'];
  if (adminType === 'petit_admin') {
    for (var i = 0; i < pageList.length; i++) {
      var cb = document.getElementById('fUDeny_' + pageList[i]);
      if (cb && cb.checked) deniedPages.push(pageList[i]);
    }
  } else if (adminType === 'user') {
    for (var i = 0; i < pageList.length; i++) {
      var sel = document.getElementById('fUSec_' + pageList[i]);
      if (sel && sel.value) sections[pageList[i]] = sel.value;
      var subs = pageSubsections[pageList[i]] || [];
      for (var sj = 0; sj < subs.length; sj++) {
        var cb = document.getElementById('fUSub_' + pageList[i] + '_' + subs[sj].key);
        if (cb) sections[pageList[i] + '.' + subs[sj].key] = cb.checked;
      }
    }
  }
  var data = { id: id || DB.genId(), nom: nom, login: login, sections: sections, isAdmin: isAdmin, adminType: adminType, deniedPages: deniedPages, dateCreation: id ? undefined : getToday() };
  var caisseSelect = document.getElementById('fUCaisse');
  data.caisseId = caisseSelect ? caisseSelect.value : '';
  var ccCb = document.getElementById('fUCaisseCentralisee');
  data.caisseCentralisee = ccCb ? ccCb.checked : false;
  var empSelect = document.getElementById('fUEmployee');
  data.employeeId = empSelect ? empSelect.value : '';
  if (!data.caisseId && data.employeeId) {
    var caissesAll = getCaisses();
    for (var ci2 = 0; ci2 < caissesAll.length; ci2++) { if (caissesAll[ci2].agentId === data.employeeId) { data.caisseId = caissesAll[ci2].id; break; } }
  }
  if (pass) data.password = pass;
  var list = getUsers();
  if (id) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) {
        data.dateCreation = list[i].dateCreation;
        if (!pass) data.password = list[i].password;
        list[i] = data;
        break;
      }
    }
  } else {
    data.password = pass;
    list.push(data);
  }
  DB.set('mdb_users', list);
  closeModal();
  toast(id ? 'Utilisateur modifi\u00e9' : 'Utilisateur cr\u00e9\u00e9');
  renderUtilisateurs();
}

function generateLicenceKey(count) {
  if (!currentUser || !currentUser.isAdmin) { toast('R\u00e9serv\u00e9 \u00e0 l\'administrateur', 'error'); return; }
  if (!firebaseDb) { toast('Firebase non disponible', 'error'); return; }
  count = count || 1;
  var plan = document.getElementById('lcPlan').value;
  var note = document.getElementById('lcNote').value.trim();
  var isReferral = document.getElementById('lcReferral').checked;
  var generated = 0;
  var promises = [];
  for (var i = 0; i < count; i++) {
    (function(idx) {
      var key = generateKeyString();
      var data = {
        plan: isReferral ? 'lifetime' : plan,
        used: false, usedBy: '', usedAt: '',
        createdAt: getToday(), createdBy: currentUser.id,
        isReferral: isReferral, note: note
      };
      promises.push(firebaseDb.collection('licenseKeys').doc(key).set(data).then(function() {
        generated++;
      }));
    })(i);
  }
  Promise.all(promises).then(function() {
    toast(generated + ' cl\u00e9(s) g\u00e9n\u00e9r\u00e9e(s) avec succ\u00e8s !', 'success');
    document.getElementById('lcNote').value = '';
    loadLicenceKeysList();
  }).catch(function(e) {
    console.error('Licence generation error:', e);
    var errMsg = e.message || '';
    if (errMsg.indexOf('permissions') !== -1) errMsg = 'Permissions insuffisantes. Reconnectez-vous et r\u00e9essayez.';
    toast('Erreur : ' + errMsg, 'error');
  });
}
function generateKeyString() {
  var chars = '0123456789ABCDEF';
  var parts = [];
  for (var i = 0; i < 4; i++) {
    var part = '';
    for (var j = 0; j < 4; j++) {
      part += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    parts.push(part);
  }
  return parts.join('-');
}
function activateLicenceKey() {
  var key = document.getElementById('lcActivateKey').value.trim().toUpperCase();
  if (!key) { toast('Veuillez entrer une cl\u00e9', 'error'); return; }
  if (!firebaseDb) { toast('Firebase non disponible', 'error'); return; }
  if (!currentUser || !currentUser.id) { toast('Connectez-vous d\'abord', 'error'); return; }
  firebaseDb.collection('licenseKeys').doc(key).get().then(function(doc) {
    if (!doc.exists) {
      if (key === 'MDB-DEV-2024' || key === 'MDB-PROPRIETAIRE-2024') {
        return {plan: 'lifetime', isReferral: true, special: true};
      }
      toast('Cl\u00e9 invalide', 'error'); return null;
    }
    var data = doc.data();
    if (data.used) { toast('Cette cl\u00e9 a d\u00e9j\u00e0 \u00e9t\u00e9 utilis\u00e9e', 'error'); return null; }
    return data;
  }).then(function(result) {
    if (!result) return;
    var plan = result.plan || 'basic';
    var isReferral = result.isReferral || false;
    var status = isReferral ? 'lifetime' : 'active';
    var subData = {status: status, plan: plan, licenceKey: key, startDate: getToday(), endDate: '', paymentMethod: 'licence'};
    if (!result.special) {
      firebaseDb.collection('licenseKeys').doc(key).update({used: true, usedBy: currentUser.id, usedAt: getToday()}).catch(function(){});
    }
    firebaseDb.collection('enterprises').doc(currentUser.id).set({subscription: subData}, {merge: true}).then(function() {
      var ent = getEntreprise();
      ent.subscription = subData;
      DB.set('mdb_entreprise', ent);
      toast('Licence activ\u00e9e avec succ\u00e8s ! Forfait : ' + plan + (isReferral ? ' (\u00e0 vie)' : ''), 'success');
      var el = document.getElementById('lcActivateKey');
      if (el) el.value = '';
      if (currentPage === 'licences') renderLicences();
      if (currentPage === 'entreprise') renderEntreprise();
    });
  }).catch(function(e) {
    toast('Erreur : ' + e.message, 'error');
  });
}

function doDeleteSadminEnt(uid, entId) {

  }).then(function(saDoc) {
    saConfig = saDoc.exists ? saDoc.data() : {login: 'admin', password: 'admin123'};

    var adminUser = null;
    for (var i = 0; i < users.length; i++) {
      if (users[i].isAdmin) { adminUser = users[i]; break; }
    }
    if (!adminUser && users.length > 0) adminUser = users[0];
    var entIdentifiant = enterpriseData.identifiant || entId || '';
    var fbEmail = enterpriseData.email || (entIdentifiant.replace(/[^a-z0-9]/gi, '_') + '@mdb.app');

    var pIdx = entIdentifiant ? firebaseDb.collection('enterpriseIndex').doc(entIdentifiant).delete().catch(function(){}) : Promise.resolve();

      return firebaseDb.collection('enterprises').doc(uid).delete();

      var saEmail = 'superadmin@mdb.app';
      var saPass = saConfig.password || 'admin123';
      return firebaseAuth.signOut().then(function() {
        return firebaseAuth.signInWithEmailAndPassword(fbEmail, fbPass).then(function(cred) {
          return cred.user.delete();
        }).catch(function() {});
      }).then(function() {
        return firebaseAuth.signInWithEmailAndPassword(saEmail, saPass).catch(function(err2) {
          return firebaseAuth.createUserWithEmailAndPassword(saEmail, saPass).catch(function() {
            return firebaseAuth.signInWithEmailAndPassword(saEmail, saPass);
          });
        });
      }).then(function() {
        DB.set('mdb_currentUser', 'SUPER-ADMIN');
        DB.set('mdb_enterpriseUid', 'SUPER-ADMIN');
        var saNom = saConfig.nom || 'Super Admin';
        currentUser = {id: 'SUPER-ADMIN', nom: saNom, isSuperAdmin: true, isAdmin: true, sections: {}};
      });
    });
  }).then(function() {
    if (overlay) overlay.style.display = 'none';
    toast('Entreprise supprim\u00e9e d\u00e9finitivement (donn\u00e9es + compte)');
    loadSadminEnts();

    toast('Erreur lors de la suppression : ' + (e.message || 'inconnue'), 'error');
  });

  var baseId = ent.nom.toLowerCase().replace(/[^a-z0-9]/g, '').substring(0, 12) || 'ent';

  for (var s = 0; s < 20; s++) {

    firebaseDb.collection('enterpriseIndex').doc(idsToTry[idx]).get().then(function(doc) {

          var p1 = firebaseDb.collection('enterpriseIndex').doc(newId).set({uid: uid, email: ent.email, nom: ent.nom});
          var p2 = firebaseDb.collection('enterprises').doc(uid).set({identifiant: newId}, {merge: true});

            promises.push(firebaseDb.collection('enterprises').doc(uid).set({mdb_users: defaultUsers}, {merge: true}));

function generateAllMissingIds() {
  if (!firebaseDb) { toast('Firebase non disponible', 'error'); return; }
  var missing = [];
  for (var i = 0; i < _saAllEnts.length; i++) {
    if (!_saAllEnts[i].identifiant) missing.push(_saAllEnts[i]);
  }
  if (missing.length === 0) { toast('Toutes les entreprises ont d\u00e9j\u00e0 un identifiant'); return; }
  openConfirm('G\u00e9n\u00e9rer des identifiants pour ' + missing.length + ' entreprise(s) ?', function() {
    var done = 0;
    var errors = 0;
    var processNext = function(idx) {
      if (idx >= missing.length) {
        toast(done + ' identifiants g\u00e9n\u00e9r\u00e9s' + (errors ? ', ' + errors + ' erreurs' : ''));
        loadSadminEnts();
        return;
      }
      var ent = missing[idx];
      var baseId = ent.nom.toLowerCase().replace(/[^a-z0-9]/g, '').substring(0, 12) || 'ent';
      var idsToTry = [];
      for (var s = 0; s < 20; s++) {
        idsToTry.push(baseId + (s === 0 ? '' : s));
      }
      var tryId = function(attempt) {
        if (attempt >= idsToTry.length) { errors++; processNext(idx + 1); return; }
        firebaseDb.collection('enterpriseIndex').doc(idsToTry[attempt]).get().then(function(doc) {
          if (doc.exists) { tryId(attempt + 1); }
          else {
            var newId = idsToTry[attempt];
            firebaseDb.collection('enterpriseIndex').doc(newId).set({uid: ent.id, email: ent.email, nom: ent.nom}).then(function() {
              firebaseDb.collection('enterprises').doc(ent.id).set({identifiant: newId}, {merge: true}).then(function() {
                done++; processNext(idx + 1);
              });
            }).catch(function() { errors++; processNext(idx + 1); });
          }
        }).catch(function() { errors++; processNext(idx + 1); });
      };
      tryId(0);
    };
    processNext(0);
  });
}

  };

function activateEnterpriseLicence() {
  var key = document.getElementById('entLicenceKey').value.trim().toUpperCase();
  if (!key) { toast('Veuillez entrer une cl\u00e9', 'error'); return; }
  if (!firebaseDb) { toast('Firebase non disponible', 'error'); return; }
  if (!currentUser || !currentUser.id) { toast('Connectez-vous d\'abord', 'error'); return; }
  firebaseDb.collection('licenseKeys').doc(key).get().then(function(doc) {
    if (!doc.exists) {
      if (key === 'MDB-DEV-2024') return {plan: 'enterprise', isReferral: true, special: true};
      toast('Cl\u00e9 invalide', 'error'); return null;
    }
    var d = doc.data();
    if (d.used) { toast('Cette cl\u00e9 a d\u00e9j\u00e0 \u00e9t\u00e9 utilis\u00e9e', 'error'); return null; }
    return d;
  }).then(function(result) {
    if (!result) return;
    var plan = result.plan || 'basic';
    var isReferral = result.isReferral || false;
    var status = isReferral ? 'lifetime' : 'active';
    var subData = {status: status, plan: plan, licenceKey: key, startDate: getToday(), endDate: '', paymentMethod: 'licence'};
    if (!result.special) {
      firebaseDb.collection('licenseKeys').doc(key).update({used: true, usedBy: currentUser.id, usedAt: getToday()}).catch(function(){});
    }
    firebaseDb.collection('enterprises').doc(currentUser.id).set({subscription: subData}, {merge: true}).then(function() {
      var ent = getEntreprise();
      ent.subscription = subData;
      DB.set('mdb_entreprise', ent);
      toast('Licence activ\u00e9e avec succ\u00e8s ! Forfait ' + plan + (isReferral ? ' (\u00e0 vie)' : ''), 'success');
      if (currentPage === 'entreprise') renderEntreprise();
    });
  }).catch(function(e) {
    toast('Erreur : ' + e.message, 'error');
  });
}

function previewLogo(input) {
  if (!input.files || !input.files[0]) return;
  var file = input.files[0];
  if (file.size > 512000) { toast('Fichier trop volumineux (max 500 Ko)', 'error'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var existing = getEntreprise();
    existing.logo = e.target.result;
    DB.set('mdb_entreprise', existing);
    var preview = document.getElementById('logoPreview');
    if (preview) preview.innerHTML = '<img src="' + e.target.result + '" style="max-width:100%;max-height:100%;object-fit:contain">';
    toast('Logo enregistr\u00e9');
  };
  reader.readAsDataURL(file);
}

function removeLogo() {
  var existing = getEntreprise();
  existing.logo = '';
  DB.set('mdb_entreprise', existing);
  renderEntreprise();
  toast('Logo supprim\u00e9');
}

/* ===== EXTRAIT DE COMPTE CLIENT ===== */
function showExtraitCompte(clientId) {
  var cl = getClientById(clientId);
  if (!cl) { toast('Client introuvable', 'error'); return; }
  var factures = getFactures();
  var reglements = getReglements();
  var operations = [];
  for (var i = 0; i < factures.length; i++) {
    var f = factures[i];
    if (f.clientId !== clientId) continue;
    var blRef = '';
    var bcRef = '';
    if (f.blIds && f.blIds.length > 0) {
      var allBls = getBLs();
      var blNums = [];
      for (var bi = 0; bi < allBls.length; bi++) { for (var bj = 0; bj < f.blIds.length; bj++) { if (allBls[bi].id === f.blIds[bj]) { blNums.push(allBls[bi].numero); break; } } }
      blRef = blNums.join(', ');
    } else if (f.blId) {
      var allBls3 = getBLs();
      var blObj = null;
      for (var bi3 = 0; bi3 < allBls3.length; bi3++) { if (allBls3[bi3].id === f.blId) { blObj = allBls3[bi3]; break; } }
      if (blObj) blRef = blObj.numero;
    }
    if (f.bcIds && f.bcIds.length > 0) {
      var bcNums = [];
      for (var ci = 0; ci < f.bcIds.length; ci++) { var bcObj = getBCById(f.bcIds[ci]); if (bcObj) bcNums.push(bcObj.numero); }
      bcRef = bcNums.join(', ');
    } else if (f.lignes) {
      var bcSet = {}; var bcArr = [];
      for (var li = 0; li < f.lignes.length; li++) { if (f.lignes[li].bcId) { var bcO = getBCById(f.lignes[li].bcId); if (bcO && !bcSet[bcO.numero]) { bcSet[bcO.numero] = 1; bcArr.push(bcO.numero); } } }
      bcRef = bcArr.join(', ');
    }
    var facTotal = f.totalTTC || f.total || 0;
    operations.push({date: f.dateEmission, libelle: 'Facture ' + f.numero, numero: f.numero, bcRef: bcRef, blRef: blRef, debit: facTotal, credit: 0});
  }
  for (var j = 0; j < reglements.length; j++) {
    var r = reglements[j];
    if (r.clientId !== clientId) continue;
    var facNum = '';
    if (r.factureId) {
      for (var k = 0; k < factures.length; k++) {
        if (factures[k].id === r.factureId) { facNum = factures[k].numero; break; }
      }
    }
    operations.push({date: r.date, libelle: 'R\u00e8glement ' + (r.modePaiement || ''), numero: facNum, debit: 0, credit: r.montant || 0, bcRef: ''});
  }
  /* Add caisse operations for this client */
  var allOps = getOperationsCaisse();
  for (var ciOp = 0; ciOp < allOps.length; ciOp++) {
    var co = allOps[ciOp];
    if (co.beneficiaireType === 'client' && (co.beneficiaireId === clientId || co.beneficiaireId === 'cli_' + clientId || co.beneficiaireId === 'company_self')) {
      var isEntree = co.sens === 'entree';
      operations.push({date: co.date, libelle: (co.libelle || 'Op\u00e9ration caisse') + (co.numeroPiece ? ' [' + co.numeroPiece + ']' : ''), numero: co.numeroPiece || '', debit: isEntree ? 0 : (co.montant || 0), credit: isEntree ? (co.montant || 0) : 0, bcRef: '', blRef: ''});
    }
  }
  operations.sort(function(a, b) { return (a.date || '').localeCompare(b.date || ''); });
  var solde = 0;
  for (var m = 0; m < operations.length; m++) { solde += operations[m].debit - operations[m].credit; operations[m].solde = solde; }
  var html = '<div style="max-width:900px">';
  html += getCompanyHeader();
  html += '<h2 style="text-align:center;margin:12px 0">Extrait de compte</h2>';
  html += '<div style="text-align:center;margin-bottom:16px"><strong>Client :</strong> ' + escH(cl.nom) + ' \u2014 <strong>Date :</strong> ' + fmtDate(getToday()) + '</div>';
  html += '<table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="background:var(--gray-50)">';
  html += '<th style="padding:8px;border:1px solid var(--gray-200);text-align:left">Date</th>';
  html += '<th style="padding:8px;border:1px solid var(--gray-200);text-align:left">Libell\u00e9</th>';
  html += '<th style="padding:8px;border:1px solid var(--gray-200);text-align:left">N\u00b0 Facture</th>';
  html += '<th style="padding:8px;border:1px solid var(--gray-200);text-align:left">Bon de commande</th>';
  html += '<th style="padding:8px;border:1px solid var(--gray-200);text-align:left">Bon de livraison</th>';
  html += '<th style="padding:8px;border:1px solid var(--gray-200);text-align:right">D\u00e9bit</th>';
  html += '<th style="padding:8px;border:1px solid var(--gray-200);text-align:right">Cr\u00e9dit</th>';
  html += '<th style="padding:8px;border:1px solid var(--gray-200);text-align:right">Solde</th>';
  html += '</tr></thead><tbody>';
  for (var n = 0; n < operations.length; n++) {
    var o = operations[n];
    html += '<tr>';
    html += '<td style="padding:6px;border:1px solid var(--gray-200)">' + fmtDate(o.date) + '</td>';
    html += '<td style="padding:6px;border:1px solid var(--gray-200)">' + escH(o.libelle) + '</td>';
    html += '<td style="padding:6px;border:1px solid var(--gray-200)">' + escH(o.numero) + '</td>';
    html += '<td style="padding:6px;border:1px solid var(--gray-200)">' + escH(o.bcRef || '-') + '</td>';
    html += '<td style="padding:6px;border:1px solid var(--gray-200)">' + escH(o.blRef || '-') + '</td>';
    html += '<td style="padding:6px;border:1px solid var(--gray-200);text-align:right">' + (o.debit ? fmtMoney(o.debit) : '-') + '</td>';
    html += '<td style="padding:6px;border:1px solid var(--gray-200);text-align:right;color:var(--success)">' + (o.credit ? fmtMoney(o.credit) : '-') + '</td>';

    html += '</tr>';
  }
  if (operations.length === 0) html += '<tr><td colspan="8" style="padding:12px;border:1px solid var(--gray-200);text-align:center;color:var(--gray-400)">Aucune op\u00e9ration</td></tr>';
  html += '</tbody></table>';
  html += '<div style="text-align:right;margin-top:12px;font-size:16px"><strong>Solde final : </strong><span style="color:' + (solde > 0 ? 'var(--danger)' : 'var(--success)') + ';font-weight:700">' + fmtMoney(solde) + '</span></div>';
  var bls = getBLs();
  var blNF = [];
  for (var bi5 = 0; bi5 < bls.length; bi5++) { if (bls[bi5].clientId === clientId && !bls[bi5].factureId) blNF.push(bls[bi5]); }
  if (blNF.length > 0) {
    var totalBLNF = 0;
    html += '<div style="margin-top:24px"><h3 style="color:var(--primary);margin-bottom:8px">BL \u00e0 facturer (' + blNF.length + ')</h3><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="background:var(--gray-50)"><th style="padding:8px;border:1px solid var(--gray-200)">N\u00b0 BL</th><th style="padding:8px;border:1px solid var(--gray-200)">Date</th><th style="padding:8px;border:1px solid var(--gray-200);text-align:right">Montant</th></tr></thead><tbody>';
    for (var bl6 = 0; bl6 < blNF.length; bl6++) {
      var blMt = 0;
      if (blNF[bl6].lignes) { for (var blj2 = 0; blj2 < blNF[bl6].lignes.length; blj2++) { blMt += (blNF[bl6].lignes[blj2].quantite || 0) * (blNF[bl6].lignes[blj2].prixUnitaire || 0); } }
      totalBLNF += blMt;
      html += '<tr><td style="padding:6px;border:1px solid var(--gray-200)">' + escH(blNF[bl6].numero || '-') + '</td><td style="padding:6px;border:1px solid var(--gray-200)">' + fmtDate(blNF[bl6].dateLivraison || blNF[bl6].date) + '</td><td style="padding:6px;border:1px solid var(--gray-200);text-align:right;font-weight:600">' + fmtMoney(blMt) + '</td></tr>';
    }
    html += '</tbody></table><div style="text-align:right;margin-top:8px;font-size:14px"><strong>Total BL \u00e0 facturer : </strong><span style="color:var(--primary);font-weight:700">' + fmtMoney(totalBLNF) + '</span></div></div>';
  }
  var facImpayees = [];
  for (var fi2 = 0; fi2 < factures.length; fi2++) {
    var fi = factures[fi2];
    if (fi.clientId === clientId) {
      var reste = (fi.total || 0) - (fi.montantPaye || 0);
      if (reste > 0) facImpayees.push({facture: fi, reste: reste});
    }
  }
  if (facImpayees.length > 0) {

    html += '<div style="margin-top:24px"><h3 style="color:var(--danger);margin-bottom:8px">Factures \u00e0 r\u00e9gler (' + facImpayees.length + ')</h3><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="background:var(--gray-50)"><th style="padding:8px;border:1px solid var(--gray-200)">N\u00b0 Facture</th><th style="padding:8px;border:1px solid var(--gray-200)">Date</th><th style="padding:8px;border:1px solid var(--gray-200);text-align:right">Total</th><th style="padding:8px;border:1px solid var(--gray-200);text-align:right">D\u00e9j\u00e0 r\u00e9gl\u00e9</th><th style="padding:8px;border:1px solid var(--gray-200);text-align:right">Reste</th><th style="padding:8px;border:1px solid var(--gray-200);text-align:center">Action</th></tr></thead><tbody>';

function printExtrait(clientId) {
  var cl = getClientById(clientId);
  if (!cl) return;
  var factures = getFactures();
  var reglements = getReglements();
  var operations = [];
  for (var i = 0; i < factures.length; i++) {
    var f = factures[i];
    if (f.clientId !== clientId) continue;
    var blRef = '';
    var bcRef = '';
    if (f.blIds && f.blIds.length > 0) {
      var allBls = getBLs();
      var blNums = [];
      for (var bi = 0; bi < allBls.length; bi++) { for (var bj = 0; bj < f.blIds.length; bj++) { if (allBls[bi].id === f.blIds[bj]) { blNums.push(allBls[bi].numero); break; } } }
      blRef = blNums.join(', ');
    } else if (f.blId) {
      var allBls4 = getBLs();
      for (var bi4 = 0; bi4 < allBls4.length; bi4++) { if (allBls4[bi4].id === f.blId) { blRef = allBls4[bi4].numero; break; } }
    }
    if (f.bcIds && f.bcIds.length > 0) {
      var bcNums2 = [];
      for (var ci2 = 0; ci2 < f.bcIds.length; ci2++) { var bcObj2 = getBCById(f.bcIds[ci2]); if (bcObj2) bcNums2.push(bcObj2.numero); }
      bcRef = bcNums2.join(', ');
    } else if (f.lignes) {
      var bcSet3 = {}; var bcArr3 = [];
      for (var li2 = 0; li2 < f.lignes.length; li2++) { if (f.lignes[li2].bcId) { var bcO3 = getBCById(f.lignes[li2].bcId); if (bcO3 && !bcSet3[bcO3.numero]) { bcSet3[bcO3.numero] = 1; bcArr3.push(bcO3.numero); } } }
      bcRef = bcArr3.join(', ');
    }
    var facTotal2 = f.totalTTC || f.total || 0;
    operations.push({date: f.dateEmission, libelle: 'Facture ' + f.numero, numero: f.numero, bcRef: bcRef, blRef: blRef, debit: facTotal2, credit: 0});
  }
  for (var j = 0; j < reglements.length; j++) {
    var r = reglements[j];
    if (r.clientId !== clientId) continue;
    var facNum = '';
    if (r.factureId) {
      for (var k = 0; k < factures.length; k++) {
        if (factures[k].id === r.factureId) { facNum = factures[k].numero; break; }
      }
    }
    operations.push({date: r.date, libelle: 'R\u00e8glement ' + (r.modePaiement || ''), numero: facNum, debit: 0, credit: r.montant || 0});
  }
  operations.sort(function(a, b) { return (a.date || '').localeCompare(b.date || ''); });
  var solde = 0;
  for (var m = 0; m < operations.length; m++) { solde += operations[m].debit - operations[m].credit; operations[m].solde = solde; }
  var html = getCompanyHeader();
  html += '<h2 style="text-align:center;margin:12px 0">Extrait de compte</h2>';
   html += '<div style="text-align:center;margin-bottom:16px"><strong>Client :</strong> ' + escH(cl.nom) + ' \u2014 <strong>Date :</strong> ' + fmtDate(getToday()) + '</div>';
  html += '<table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="background:#f3f4f6">';
  html += '<th style="padding:8px;border:1px solid #d1d5db;text-align:left">Date</th>';
  html += '<th style="padding:8px;border:1px solid #d1d5db;text-align:left">Libell\u00e9</th>';
  html += '<th style="padding:8px;border:1px solid #d1d5db;text-align:left">N\u00b0 Facture</th>';
  html += '<th style="padding:8px;border:1px solid #d1d5db;text-align:left">Bon de commande</th>';
  html += '<th style="padding:8px;border:1px solid #d1d5db;text-align:left">Bon de livraison</th>';
  html += '<th style="padding:8px;border:1px solid #d1d5db;text-align:right">D\u00e9bit</th>';
  html += '<th style="padding:8px;border:1px solid #d1d5db;text-align:right">Cr\u00e9dit</th>';
  html += '<th style="padding:8px;border:1px solid #d1d5db;text-align:right">Solde</th>';
  html += '</tr></thead><tbody>';
  for (var n = 0; n < operations.length; n++) {
    var o = operations[n];
    html += '<tr>';
    html += '<td style="padding:6px;border:1px solid #d1d5db">' + fmtDate(o.date) + '</td>';
    html += '<td style="padding:6px;border:1px solid #d1d5db">' + escH(o.libelle) + '</td>';
    html += '<td style="padding:6px;border:1px solid #d1d5db">' + escH(o.numero) + '</td>';
    html += '<td style="padding:6px;border:1px solid #d1d5db">' + escH(o.bcRef || '-') + '</td>';
    html += '<td style="padding:6px;border:1px solid #d1d5db">' + escH(o.blRef || '-') + '</td>';
    html += '<td style="padding:6px;border:1px solid #d1d5db;text-align:right">' + (o.debit ? fmtMoney(o.debit) : '-') + '</td>';
    html += '<td style="padding:6px;border:1px solid #d1d5db;text-align:right">' + (o.credit ? fmtMoney(o.credit) : '-') + '</td>';
    html += '<td style="padding:6px;border:1px solid #d1d5db;text-align:right;font-weight:bold">' + fmtMoney(o.solde) + '</td>';
    html += '</tr>';
  }
  if (operations.length === 0) html += '<tr><td colspan="8" style="padding:12px;border:1px solid #d1d5db;text-align:center">Aucune op\u00e9ration</td></tr>';
  html += '</tbody></table>';
  html += '<div style="text-align:right;margin-top:12px;font-size:14px"><strong>Solde final : </strong><strong>' + fmtMoney(solde) + '</strong></div>';
  var blsP = getBLs();
  var blNFP = [];

  if (blNFP.length > 0) {
    var totalBLNFP = 0;
    html += '<h3 style="margin-top:24px;color:#2563eb">BL \u00e0 facturer</h3><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="background:#f3f4f6"><th style="padding:8px;border:1px solid #d1d5db">N\u00b0 BL</th><th style="padding:8px;border:1px solid #d1d5db">Date</th><th style="padding:8px;border:1px solid #d1d5db;text-align:right">Montant</th></tr></thead><tbody>';
    for (var bpJ = 0; bpJ < blNFP.length; bpJ++) {
      var blMtP = 0;
      if (blNFP[bpJ].lignes) { for (var bpK = 0; bpK < blNFP[bpJ].lignes.length; bpK++) { blMtP += (blNFP[bpJ].lignes[bpK].quantite || 0) * (blNFP[bpJ].lignes[bpK].prixUnitaire || 0); } }
      totalBLNFP += blMtP;
      html += '<tr><td style="padding:6px;border:1px solid #d1d5db">' + escH(blNFP[bpJ].numero || '-') + '</td><td style="padding:6px;border:1px solid #d1d5db">' + fmtDate(blNFP[bpJ].dateLivraison || blNFP[bpJ].date) + '</td><td style="padding:6px;border:1px solid #d1d5db;text-align:right;font-weight:600">' + fmtMoney(blMtP) + '</td></tr>';
    }
    html += '</tbody></table><div style="text-align:right;margin-top:6px;font-size:13px"><strong>Total BL \u00e0 facturer : </strong><strong>' + fmtMoney(totalBLNFP) + '</strong></div>';
  }
  var previsionsP = getPrevisions();
  var pvNFP = [];
  for (var ppI = 0; ppI < previsionsP.length; ppI++) { if (previsionsP[ppI].clientId === clientId && previsionsP[ppI].statut !== 'annule') pvNFP.push(previsionsP[ppI]); }
  if (pvNFP.length > 0) {
    var totalPvP = 0;
    html += '<h3 style="margin-top:24px;color:#7c3aed">Pr\u00e9visions en cours</h3><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="background:#f3f4f6"><th style="padding:8px;border:1px solid #d1d5db">Article</th><th style="padding:8px;border:1px solid #d1d5db">Destination</th><th style="padding:8px;border:1px solid #d1d5db;text-align:right">Quantit\u00e9</th><th style="padding:8px;border:1px solid #d1d5db">Date</th><th style="padding:8px;border:1px solid #d1d5db;text-align:right">Montant</th></tr></thead><tbody>';
    for (var ppJ = 0; ppJ < pvNFP.length; ppJ++) {
      var pvMP = (pvNFP[ppJ].quantite || 0) * (pvNFP[ppJ].prixUnitaire || 0);
      totalPvP += pvMP;
      html += '<tr><td style="padding:6px;border:1px solid #d1d5db">' + escH(pvNFP[ppJ].articleNom || '-') + '</td><td style="padding:6px;border:1px solid #d1d5db">' + escH(pvNFP[ppJ].destination || '-') + '</td><td style="padding:6px;border:1px solid #d1d5db;text-align:right">' + (pvNFP[ppJ].quantite || 0) + '</td><td style="padding:6px;border:1px solid #d1d5db">' + fmtDate(pvNFP[ppJ].datePrevue) + '</td><td style="padding:6px;border:1px solid #d1d5db;text-align:right;font-weight:600">' + fmtMoney(pvMP) + '</td></tr>';
    }
    html += '</tbody></table><div style="text-align:right;margin-top:6px;font-size:13px"><strong>Total pr\u00e9visions : </strong><strong>' + fmtMoney(totalPvP) + '</strong></div>';

/* ===== CREANCE EN COURS (auto from unpaid invoices) ===== */
function renderCreance() {
  var factures = getFactures();
  var clients = getClients();
  var bls = getBLs();
  var reglements = getReglements();
  var clientMap = {};
  for (var i = 0; i < clients.length; i++) clientMap[clients[i].id] = clients[i];

  var clientCreances = {};
  for (var i = 0; i < factures.length; i++) {
    var f = factures[i];
    if (f.statut === 'payee') continue;
    var restant = (f.total || 0) - (f.montantPaye || 0);
    if (restant <= 0) continue;
    var cid = f.clientId;
    if (!clientCreances[cid]) clientCreances[cid] = {clientId: cid, client: clientMap[cid], factures: [], totalReste: 0};
    clientCreances[cid].factures.push({facture: f, restant: restant});
    clientCreances[cid].totalReste += restant;
  }

  var clientList = [];
  for (var cid in clientCreances) {
    if (clientCreances.hasOwnProperty(cid)) clientList.push(clientCreances[cid]);
  }
  clientList.sort(function(a, b) { return b.totalReste - a.totalReste; });

  var totalCreance = 0;
  for (var j = 0; j < clientList.length; j++) totalCreance += clientList[j].totalReste;

  var html = '<div class="stats-grid" data-sub="creance.stats">';
  html += '<div class="stat-card"><div class="stat-icon" style="background:var(--danger-light);color:var(--danger)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><div class="stat-info"><div class="stat-value">' + fmtMoney(totalCreance) + '</div><div class="stat-label">Total cr\u00e9ances</div></div></div>';
  html += '<div class="stat-card"><div class="stat-icon" style="background:var(--warning-light);color:var(--warning)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><div class="stat-info"><div class="stat-value">' + clientList.length + '</div><div class="stat-label">Clients \u00e0 recouvrer</div></div></div>';
  html += '</div>';

  html += '<div data-sub="creance.details">';
  for (var ci = 0; ci < clientList.length; ci++) {
    var item = clientList[ci];
    html += '<div class="section"><div class="section-header"><h3>' + escH(item.client ? item.client.nom : 'Inconnu') + '</h3><span class="badge badge-danger">' + fmtMoney(item.totalReste) + '</span></div><div class="table-responsive"><table><thead><tr><th>Facture</th><th>Date</th><th>\u00c9ch\u00e9ance</th><th style="text-align:right">Total</th><th style="text-align:right">Pay\u00e9</th><th style="text-align:right">Reste</th><th>Statut</th></tr></thead><tbody>';
    for (var fi = 0; fi < item.factures.length; fi++) {
      var f2 = item.factures[fi].facture;
      var restant = item.factures[fi].restant;
      var overdue = f2.echeance && daysUntil(f2.echeance) < 0;
      html += '<tr' + (overdue ? ' style="background:var(--danger-light)"' : '') + '>';
      html += '<td class="fw-600">' + escH(f2.numero || '-') + '</td>';
      html += '<td>' + fmtDate(f2.dateFacture) + '</td>';
      html += '<td>' + fmtDate(f2.echeance) + (overdue ? ' <span class="badge badge-danger">Retard</span>' : '') + '</td>';
      html += '<td class="text-right">' + fmtMoney(f2.total || 0) + '</td>';
      html += '<td class="text-right" style="color:var(--success)">' + fmtMoney(f2.montantPaye || 0) + '</td>';
      html += '<td class="text-right fw-600" style="color:var(--danger)">' + fmtMoney(restant) + '</td>';
      html += '<td>' + getStatusBadge(f2.statut) + '</td>';
      html += '</tr>';
      if (f2.blIds && f2.blIds.length > 0) {
        for (var bi = 0; bi < f2.blIds.length; bi++) {
          for (var bj = 0; bj < bls.length; bj++) {
            if (bls[bj].id === f2.blIds[bi] && bls[bj].lignes) {
              var bl = bls[bj];
              html += '<tr style="background:var(--gray-50)"><td colspan="7" style="padding-left:32px">';
              html += '<span style="font-size:11px;color:var(--gray-500)">BL ' + escH(bl.numero || '') + ' :</span> ';
              for (var lk = 0; lk < bl.lignes.length; lk++) {
                var ln = bl.lignes[lk];
                if (lk > 0) html += ' &middot; ';
                html += '<span style="font-size:11px">' + escH(ln.designation || ln.articleId || '') + ' \u00d7 ' + (ln.quantite || 0) + ' = ' + fmtMoney((ln.quantite || 0) * (ln.prixUnitaire || 0)) + '</span>';
              }
              html += '</td></tr>';
              break;
            }
          }
        }
      }
    }
    html += '</tbody></table></div></div>';
  }
  if (clientList.length === 0) {
    html += '<div class="section"><div class="section-body text-center text-muted" style="padding:40px">Aucune cr\u00e9ance en cours \u2014 tous les clients sont \u00e0 jour</div></div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function openDetteFournisseurModal(id) {
  var d = null;
  if (id) { var dettes = getDettesFournisseurs(); for (var i = 0; i < dettes.length; i++) { if (dettes[i].id === id) { d = dettes[i]; break; } } }
  var title = d ? 'Modifier la dette' : 'Nouvelle dette fournisseur';
  var fournisseurs = getFournisseurs();
  var html = '';
  html += '<div class="form-group"><label>Fournisseur *</label><select id="dfFournisseur"><option value="">-- S\u00e9lectionner --</option>';
  for (var i = 0; i < fournisseurs.length; i++) {
    var selected = (d && d.fournisseurId === fournisseurs[i].id) ? ' selected' : '';
    html += '<option value="' + fournisseurs[i].id + '"' + selected + '>' + escH(fournisseurs[i].nom) + '</option>';
  }
  html += '</select></div>';
  html += '<div class="form-group"><label>Description</label><input type="text" id="dfDesc" value="' + escH(d ? d.description : '') + '"></div>';
  html += '<div class="form-row">';
  html += '<div class="form-group"><label>Date *</label><input type="date" id="dfDate" value="' + (d ? d.date : getToday()) + '"></div>';
  html += '<div class="form-group"><label>Montant (FCFA) *</label><input type="number" id="dfMontant" value="' + (d ? (d.montant || 0) : 0) + '" min="0"></div>';
  html += '</div>';
  var footer = '<button class="btn btn-outline" onclick="closeModal()">Annuler</button>';
  footer += '<button class="btn btn-primary" onclick="saveDetteFournisseur(\'' + (id || '') + '\')">Enregistrer</button>';
  openFormModal(title, html, footer);
}

function saveDetteFournisseur(id) {
  var fournisseurId = document.getElementById('dfFournisseur').value;
  var montant = parseFloat(document.getElementById('dfMontant').value) || 0;
  if (!fournisseurId || montant <= 0) { toast('Fournisseur et montant sont obligatoires', 'error'); return; }
  var frn = getFournisseurById(fournisseurId);
  var dettes = getDettesFournisseurs();
  if (id) {
    for (var i = 0; i < dettes.length; i++) {
      if (dettes[i].id === id) {
        dettes[i].fournisseurId = fournisseurId;
        dettes[i].fournisseur = frn ? frn.nom : '';
        dettes[i].description = document.getElementById('dfDesc').value.trim();
        dettes[i].date = document.getElementById('dfDate').value;
        dettes[i].montant = montant;
        break;
      }
    }
  } else {
    dettes.push({id:DB.genId(), fournisseurId:fournisseurId, fournisseur: frn ? frn.nom : '', description:document.getElementById('dfDesc').value.trim(), date:document.getElementById('dfDate').value, montant:montant});
  }
  DB.set('mdb_dettesFournisseurs', dettes);
  closeModal();
  toast('Dette fournisseur enregistr\u00e9e');
  renderFournisseurs();
}

function deleteDetteFournisseur(id) {
  if (!window.confirm('Supprimer cette dette fournisseur ?')) return;
  var dettes = getDettesFournisseurs(); var result = [];
  for (var i = 0; i < dettes.length; i++) { if (dettes[i].id !== id) result.push(dettes[i]); }
  DB.set('mdb_dettesFournisseurs', result);
  toast('Dette supprim\u00e9e');
  renderFournisseurs();
}

function renderFournDettes(el) {
  var dettes = getDettesFournisseurs();
  var fournisseurs = getFournisseurs();
  var ops = getOperationsCaisse();
  var total = 0;
  for (var i = 0; i < dettes.length; i++) total += dettes[i].montant || 0;
  var supplierMap = {};
  for (var i = 0; i < fournisseurs.length; i++) supplierMap[fournisseurs[i].id] = fournisseurs[i];
  var balances = {};
  for (var i = 0; i < dettes.length; i++) {
    var d = dettes[i];
    var fid = d.fournisseurId || '';
    if (!fid) continue;
    if (!balances[fid]) balances[fid] = {fournisseurId: fid, charge: 0, paye: 0};
    balances[fid].charge += d.montant || 0;
  }
  for (var i = 0; i < ops.length; i++) {
    var o = ops[i];
    if (o.beneficiaireType !== 'fournisseur' || !o.beneficiaireId) continue;
    if (!balances[o.beneficiaireId]) balances[o.beneficiaireId] = {fournisseurId: o.beneficiaireId, charge: 0, paye: 0};
    balances[o.beneficiaireId].charge += o.montantCharge || 0;
    balances[o.beneficiaireId].paye += o.montant || 0;
  }
  var html = '<div data-sub="fournisseurs.dettes">';
  html += '<div class="stats-grid">';
  html += '<div class="stat-card"><div class="stat-icon" style="background:var(--danger-light);color:var(--danger)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg></div><div class="stat-info"><div class="stat-value">' + fmtMoney(total) + '</div><div class="stat-label">Total dettes</div></div></div>';
  html += '<div class="stat-card"><div class="stat-icon" style="background:var(--warning-light);color:var(--warning)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div><div class="stat-info"><div class="stat-value">' + Object.keys(balances).length + '</div><div class="stat-label">Fournisseurs</div></div></div>';
  html += '</div>';
  html += '<div class="toolbar"><button class="btn btn-primary" onclick="openDetteFournisseurModal()">+ Nouvelle dette</button></div>';
  var hasAny = false;
  for (var fid in balances) {
    if (!balances.hasOwnProperty(fid)) continue;
    var b = balances[fid];
    var frn = supplierMap[fid];
    var reste = b.charge - b.paye;
    if (reste <= 0) continue;
    hasAny = true;
    html += '<div class="section"><div class="section-header"><h3>' + escH(frn ? frn.nom : 'Inconnu') + '</h3><span class="badge badge-danger">' + fmtMoney(reste) + '</span></div>';
    html += '<div class="table-responsive"><table><thead><tr><th>Type</th><th>Description</th><th>Date</th><th style="text-align:right">Montant</th><th style="width:80px">Actions</th></tr></thead><tbody>';
    var lignes = [];
    for (var di = 0; di < dettes.length; di++) {
      if (dettes[di].fournisseurId === fid) lignes.push({type: 'Dette', description: dettes[di].description || '-', date: dettes[di].date, montant: dettes[di].montant || 0, id: dettes[di].id});
    }
    for (var oi = 0; oi < ops.length; oi++) {
      var o = ops[oi];
      if (o.beneficiaireType !== 'fournisseur' || o.beneficiaireId !== fid) continue;
      if (o.montantCharge && o.montantCharge > 0) lignes.push({type: 'Charge (caisse)', description: o.libelle || '-', date: o.date, montant: o.montantCharge, id: null});
      lignes.push({type: 'Paiement (caisse)', description: o.libelle || '-', date: o.date, montant: o.montant || 0, id: null});
    }
    lignes.sort(function(a, b) { return (a.date || '').localeCompare(b.date || ''); });
    for (var li = 0; li < lignes.length; li++) {
      var l = lignes[li];
      var isPay = l.type.indexOf('Paiement') !== -1;
      html += '<tr>';
      html += '<td><span class="badge ' + (isPay ? 'badge-success' : 'badge-danger') + '">' + l.type + '</span></td>';
      html += '<td>' + escH(l.description) + '</td>';
      html += '<td>' + fmtDate(l.date) + '</td>';
      html += '<td class="text-right fw-600" style="color:' + (isPay ? 'var(--success)' : 'var(--danger)') + '">' + fmtMoney(l.montant) + '</td>';
      html += '<td>' + (l.id ? '<button class="btn-icon danger" onclick="deleteDetteFournisseur(\'' + l.id + '\')" title="Supprimer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>' : '-') + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table></div></div>';
  }
  if (!hasAny) html += '<div class="section"><div class="section-body text-center text-muted" style="padding:40px">Aucune dette fournisseur</div></div>';
  html += '</div>';
  el.innerHTML = html;
}
