function saveFournisseur(id) {
  var nom = document.getElementById('frNom').value.trim();
  if (!nom) { toast('Le nom est obligatoire', 'error'); return; }
  var fournisseurs = getFournisseurs();
  if (id) {
    for (var i = 0; i < fournisseurs.length; i++) {
      if (fournisseurs[i].id === id) {
        fournisseurs[i].nom = nom;
        fournisseurs[i].email = document.getElementById('frEmail').value.trim();
        fournisseurs[i].telephone = document.getElementById('frTel').value.trim();
        fournisseurs[i].adresse = document.getElementById('frAdresse').value.trim();
        fournisseurs[i].soldeInitial = parseFloat(document.getElementById('frSoldeInitial').value) || 0;
        fournisseurs[i].typeSolde = document.getElementById('frTypeSolde').value;
        fournisseurs[i].numTransactionOM = document.getElementById('frTransOM').value.trim();
        fournisseurs[i].numTransactionMTN = document.getElementById('frTransMTN').value.trim();
        fournisseurs[i].numTransactionWave = document.getElementById('frTransWave').value.trim();
        fournisseurs[i].numTransactionMoov = document.getElementById('frTransMoov').value.trim();
        break;
      }
    }
  } else {
    fournisseurs.push({id:DB.genId(), nom:nom, email:document.getElementById('frEmail').value.trim(), telephone:document.getElementById('frTel').value.trim(), adresse:document.getElementById('frAdresse').value.trim(), soldeInitial:parseFloat(document.getElementById('frSoldeInitial').value) || 0, typeSolde:document.getElementById('frTypeSolde').value, numTransactionOM:document.getElementById('frTransOM').value.trim(), numTransactionMTN:document.getElementById('frTransMTN').value.trim(), numTransactionWave:document.getElementById('frTransWave').value.trim(), numTransactionMoov:document.getElementById('frTransMoov').value.trim()});
  }
  DB.set('mdb_fournisseurs', fournisseurs);
  closeModal();
  toast('Fournisseur enregistr\u00e9');
  renderFournisseurs();
}

function deleteFournisseur(id) {
  if (!window.confirm('Supprimer ce fournisseur et toutes ses dettes ?')) return;
  var fournisseurs = getFournisseurs(); var result = [];
  for (var i = 0; i < fournisseurs.length; i++) { if (fournisseurs[i].id !== id) result.push(fournisseurs[i]); }
  DB.set('mdb_fournisseurs', result);
  var dettes = getDettesFournisseurs(); var newDettes = [];
  for (var j = 0; j < dettes.length; j++) { if (dettes[j].fournisseurId !== id) newDettes.push(dettes[j]); }
  DB.set('mdb_dettesFournisseurs', newDettes);
  toast('Fournisseur supprim\u00e9');
  renderFournisseurs();
}

  for (var ti = 0; ti < tabs.length; ti++) {

  }
  html += '</div></div>';
  html += '<div id="tresorerieContent"></div>';
  document.getElementById('content').innerHTML = html;
  var container = document.getElementById('tresorerieContent');
  if (_tresorerieTab === 'vue') renderTresorerieVue(container);

  else if (_tresorerieTab === 'codes') renderCodesCaisseIn(container);
  else if (_tresorerieTab === 'modeles') renderModelesCaisseIn(container);
}

function filterTresorerieVue() {
  var dateFrom = document.getElementById('tvDateFrom').value;
  var dateTo = document.getElementById('tvDateTo').value;
  var sections = document.querySelectorAll('[data-sub="tresorerie.vueEnsemble"] .stat-value');
  var factures = getFactures();
  var reglements = getReglements();
  var totalFactures = 0, totalReglements = 0;
  for (var i = 0; i < factures.length; i++) {
    var f = factures[i];
    if (dateFrom && f.dateEmission < dateFrom) continue;
    if (dateTo && f.dateEmission > dateTo) continue;
    totalFactures += (f.total || 0);
  }
  for (var i = 0; i < reglements.length; i++) {
    var r = reglements[i];
    if (dateFrom && r.date < dateFrom) continue;
    if (dateTo && r.date > dateTo) continue;
    totalReglements += (r.montant || 0);
  }
  if (sections.length >= 2) {
    sections[0].textContent = fmtMoney(totalFactures);
    sections[1].textContent = fmtMoney(totalReglements);
  }
}

function factureFromSelectedBLs() {
  var cbs = document.querySelectorAll('.bl-select:checked');
  if (cbs.length === 0) { toast('Veuillez s\u00e9lectionner au moins un BL', 'error'); return; }
  var ids = [];
  var clientIds = {};
  for (var i = 0; i < cbs.length; i++) {
    ids.push(cbs[i].value);
    var cid = cbs[i].getAttribute('data-client');
    if (cid) clientIds[cid] = true;
  }
  var keys = [];
  for (var k in clientIds) { if (clientIds.hasOwnProperty(k)) keys.push(k); }
  if (keys.length > 1) { toast('Impossible : les BL s\u00e9lectionn\u00e9s sont sur des clients diff\u00e9rents', 'error'); return; }
  var bls = getBLs();
  var selectedBLs = [];
  for (var j = 0; j < ids.length; j++) {
    for (var m = 0; m < bls.length; m++) { if (bls[m].id === ids[j]) { selectedBLs.push(bls[m]); break; } }
  }
  var clientId = keys[0];
  var firstBC = selectedBLs[0] ? (selectedBLs[0].bcId || '') : '';
  var allLignes = [];
  for (var n = 0; n < selectedBLs.length; n++) {
    if (selectedBLs[n].lignes) {
      for (var p = 0; p < selectedBLs[n].lignes.length; p++) {
        var src = selectedBLs[n].lignes[p];
        allLignes.push({articleId:src.articleId||'', designation:src.designation||'', quantite:src.quantite||1, prixUnitaire:src.prixUnitaire||0, bcId:selectedBLs[n].bcId||'', blId:selectedBLs[n].id});
      }
    }
  }
  _prefillFactureData = {clientId: clientId, bcId: firstBC, lignes: allLignes};
  navigateToFacturation('factures');
  setTimeout(function() { openFactureModal(); }, 150);
}

function toggleSelectAllBLs(checked) {
  var cbs = document.querySelectorAll('.bl-select');
  for (var i = 0; i < cbs.length; i++) cbs[i].checked = checked;
}

function getSelectedBLIds() {
  var cbs = document.querySelectorAll('.bl-select:checked');
  var ids = [];
  for (var i = 0; i < cbs.length; i++) ids.push(cbs[i].value);
  return ids;
}

  for (var i = 0; i < factures.length; i++) {
    var cid = factures[i].clientId || '';
    if (!clientStats[cid]) clientStats[cid] = {nom:factures[i].clientNom||cid, facture:0, paid:0, blAFact:0, prevision:0};
    clientStats[cid].facture += (factures[i].total || 0);
  }
  for (var i = 0; i < reglements.length; i++) {
    var cid2 = reglements[i].clientId || '';
    if (!clientStats[cid2]) clientStats[cid2] = {nom:'', facture:0, paid:0, blAFact:0, prevision:0};
    clientStats[cid2].paid += (reglements[i].montant || 0);
  }
  for (var i = 0; i < bls.length; i++) {
    if (!bls[i].factureId && bls[i].lignes) {
      var cid3 = bls[i].clientId || '';
      if (!clientStats[cid3]) clientStats[cid3] = {nom:'', facture:0, paid:0, blAFact:0, prevision:0};
      for (var l = 0; l < bls[i].lignes.length; l++) { clientStats[cid3].blAFact += (bls[i].lignes[l].quantite||0)*(bls[i].lignes[l].prixUnitaire||0); }
    }
  }
  for (var i = 0; i < previsions.length; i++) {
    var cid4 = previsions[i].clientId || '';
    if (!clientStats[cid4]) clientStats[cid4] = {nom:'', facture:0, paid:0, blAFact:0, prevision:0};
    clientStats[cid4].prevision += (previsions[i].quantite||0)*(previsions[i].prixUnitaire||0);
  }
  var hasStats = false;
  for (var cid5 in clientStats) {
    if (!clientStats.hasOwnProperty(cid5)) continue;
    var st = clientStats[cid5];
    var soldeFacture = Math.max(0, st.facture - st.paid);
    var soldeComptable = soldeFacture + st.blAFact + st.prevision;
    var searchTxt = (st.nom || cid5).toLowerCase();
    hasStats = true;
    html += '<tr data-search="' + escH(searchTxt) + '">';

    html += '<td class="text-right">' + fmtMoney(st.facture) + '</td>';
    html += '<td class="text-right">' + fmtMoney(st.paid) + '</td>';
    html += '<td class="text-right">' + fmtMoney(st.blAFact) + '</td>';
    html += '<td class="text-right">' + fmtMoney(st.prevision) + '</td>';

    html += '<td><button class="btn btn-sm btn-outline" onclick="showExtraitCompte(\'' + cid5 + '\')">Voir</button></td>';
    html += '</tr>';

  html += '</tbody></table></div></div></div></div>';
  document.getElementById('content').innerHTML = html;
}

function filterTable(bodyId, searchId) {
  var q = (document.getElementById(searchId).value || '').toLowerCase();
  var rows = document.getElementById(bodyId).getElementsByTagName('tr');
  for (var i = 0; i < rows.length; i++) {
    rows[i].style.display = (rows[i].getAttribute('data-search') || '').indexOf(q) !== -1 ? '' : 'none';
  }
}

function renderCaissesIn(el) {

    for (var vi = 0; vi < caisses.length; vi++) { if (caisses[vi].id === myCaisseId) { visibleCaisses.push(caisses[vi]); break; } }
  }
  var totalGeneral = 0;

    var solde = (visibleCaisses[i].soldeInitial || 0);

  html += '<div class="stat-card"><div class="stat-icon" style="background:var(--success-light);color:var(--success)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div><div class="stat-info"><div class="stat-value">' + visibleCaisses.length + '</div><div class="stat-label">Caisses visibles</div></div></div>';
  html += '</div>';

    var typeBadge = ca.type === 'generale' ? '<span class="badge badge-primary" style="margin-left:8px">G\u00e9n\u00e9rale</span>' : '<span class="badge badge-warning" style="margin-left:8px">Auxiliaire</span>';
    html += '<div class="section"><div class="section-header"><h3>' + escH(ca.nom) + typeBadge + '</h3><div style="display:flex;gap:8px;align-items:center">';
    html += '<span class="badge ' + (ca._solde >= 0 ? 'badge-success' : 'badge-danger') + '">' + fmtMoney(ca._solde) + '</span>';
    html += '<button class="btn btn-sm btn-outline" onclick="viewCaisseDetail(\'' + ca.id + '\')">D\u00e9tails</button>';
    if (canSeeAll) {
      html += '<button class="btn-icon" onclick="openCaisseGestionModal(\'' + ca.id + '\')" title="Modifier"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button> ';
      html += '<button class="btn-icon danger" onclick="deleteCaisseGestion(\'' + ca.id + '\')" title="Supprimer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>';
    }
    html += '</div></div>';
    html += '<div style="padding:8px 0;font-size:13px;color:var(--gray-600)">Agent : <strong>' + escH(ca.agentNom || '-') + '</strong> &nbsp;|&nbsp; Op\u00e9rations non revers\u00e9es : <strong>' + nbNonReverse + '</strong>';
    if (nbNonReverse > 0) html += ' &nbsp; <button class="btn btn-sm btn-primary" onclick="reverserCaisse(\'' + ca.id + '\')">Reverser dans la caisse g\u00e9n\u00e9rale</button>';
    html += '</div></div>';

  if (visibleCaisses.length === 0) html += '<div class="section"><div class="section-body text-center text-muted" style="padding:40px">' + (canSeeAll ? 'Aucune caisse cr\u00e9\u00e9e' : 'Aucune caisse ne vous est assign\u00e9e') + '</div></div>';

      for (var cn = 0; cn < caisses.length; cn++) { if (caisses[cn].id === rv.caisseId) { caisseNom = caisses[cn].nom; break; } }
      html += '<tr>';
      html += '<td>' + fmtDate(rv.date) + '</td>';
      html += '<td>' + escH(rv.heure || '-') + '</td>';
      html += '<td class="fw-600">' + escH(caisseNom) + '</td>';
      html += '<td>' + escH(rv.libelle || '-') + '</td>';

      html += '<td class="text-right" style="color:var(--danger);font-weight:600">' + (rv.sens === 'sortie' ? fmtMoney(rv.montant) : '') + '</td>';
      html += '<td>' + escH(rv.beneficiaireNom || '-') + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table></div></div></div>';
  }
  html += '</div>';
  el.innerHTML = html;

function openCaisseGestionModal(id) {
  var c = null;
  if (id) { var cs = getCaisses(); for (var i = 0; i < cs.length; i++) { if (cs[i].id === id) { c = cs[i]; break; } } }
  var title = c ? 'Modifier la caisse' : 'Nouvelle caisse';
  var employes = getEmployes();
  var typeVal = c ? (c.type || 'auxiliaire') : 'auxiliaire';
  var html = '';
  html += '<div class="form-group"><label>Nom de la caisse *</label><input type="text" id="cgNom" value="' + escH(c ? c.nom : '') + '" placeholder="Ex: Caisse de Rosine"></div>';
  html += '<div class="form-group"><label>Type de caisse *</label><select id="cgType"><option value="auxiliaire"' + (typeVal === 'auxiliaire' ? ' selected' : '') + '>Caisse auxiliaire</option><option value="generale"' + (typeVal === 'generale' ? ' selected' : '') + '>Caisse g\u00e9n\u00e9rale</option></select></div>';
  html += '<div class="form-group"><label>Agent assign\u00e9 *</label><select id="cgAgent"><option value="">-- Choisir un agent --</option>';
  for (var i = 0; i < employes.length; i++) {
    var sel = (c && c.agentId === employes[i].id) ? ' selected' : '';
    html += '<option value="' + employes[i].id + '"' + sel + '>' + escH(employes[i].nom) + ' (' + escH(employes[i].abreviation) + ')</option>';
  }
  html += '</select></div>';
  html += '<div class="form-group"><label>Solde initial (FCFA)</label><input type="number" id="cgSoldeInitial" value="' + (c ? (c.soldeInitial || 0) : 0) + '" min="0"></div>';
  var footer = '<button class="btn btn-outline" onclick="closeModal()">Annuler</button>';
  footer += '<button class="btn btn-primary" onclick="saveCaisseGestion(\'' + (id || '') + '\')">Enregistrer</button>';
  openFormModal(title, html, footer);
}

function saveCaisseGestion(id) {
  var nom = document.getElementById('cgNom').value.trim();
  var agentId = document.getElementById('cgAgent').value;
  var type = document.getElementById('cgType').value;
  var soldeInitial = parseFloat(document.getElementById('cgSoldeInitial').value) || 0;
  if (!nom || !agentId) { toast('Nom et agent sont obligatoires', 'error'); return; }
  var agentNom = '';
  var employes = getEmployes();
  for (var i = 0; i < employes.length; i++) { if (employes[i].id === agentId) { agentNom = employes[i].nom; break; } }
  var caisses = getCaisses();
  if (id) {
    for (var i = 0; i < caisses.length; i++) { if (caisses[i].id === id) { caisses[i].nom = nom; caisses[i].agentId = agentId; caisses[i].agentNom = agentNom; caisses[i].type = type; caisses[i].soldeInitial = soldeInitial; break; } }
  } else { caisses.push({id:DB.genId(), nom:nom, agentId:agentId, agentNom:agentNom, type:type, soldeInitial:soldeInitial}); }
  DB.set('mdb_caisses', caisses);
  closeModal();
  toast('Caisse enregistr\u00e9e');
  renderCaissesIn(document.getElementById('tresorerieContent'));
}
function deleteCaisseGestion(id) {
  if (!window.confirm('Supprimer cette caisse ? Les op\u00e9rations restent dans le syst\u00e8me.')) return;
  var caisses = getCaisses(); var r = [];
  for (var i = 0; i < caisses.length; i++) { if (caisses[i].id !== id) r.push(caisses[i]); }
  DB.set('mdb_caisses', r);
  toast('Caisse supprim\u00e9e');
  renderCaissesIn(document.getElementById('tresorerieContent'));
}

    html += '<td>' + statusBadge + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table></div></div></div>';

function reverserCaisse(caisseId) {
  if (!window.confirm('Reverser toutes les op\u00e9rations non revers\u00e9es de cette caisse dans la caisse g\u00e9n\u00e9rale ?')) return;
  var ops = getOperationsCaisse();
  var now = new Date();
  var heureRevers = (now.getHours() < 10 ? '0' : '') + now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
  var count = 0;
  for (var i = 0; i < ops.length; i++) {
    if (ops[i].caisseId === caisseId && !ops[i].reversed) {
      ops[i].reversed = true;
      ops[i].reverseDate = getToday();
      ops[i].reverseHeure = heureRevers;
      count++;
    }
  }
  DB.set('mdb_operationsCaisse', ops);
  toast(count + ' op\u00e9ration(s) revers\u00e9e(s) dans la caisse g\u00e9n\u00e9rale');

/* Auto-detect type from libelle (employé/fournisseur/client) */
function autoDetectBenefType(label) {
  if (!label) return;
  var l = label.toLowerCase().trim();
  var types = document.getElementById('csType');
  if (!types) return;
  /* Employés */
  var emps = getEmployes();
  for (var i = 0; i < emps.length; i++) {
    var empName = (emps[i].nom || '').toLowerCase();
    var empAbbr = (emps[i].abreviation || '').toLowerCase();
    if (empName === l || empAbbr === l || empName.indexOf(l) !== -1 || l.indexOf(empName) !== -1) {
      types.value = 'employe'; toggleBeneficiaire(); return;
    }
  }
  /* Fournisseurs */
  var frns = getFournisseurs();
  for (var f = 0; f < frns.length; f++) {
    var frnName = (frns[f].nom || '').toLowerCase();
    if (frnName === l || frnName.indexOf(l) !== -1 || l.indexOf(frnName) !== -1) {
      types.value = 'fournisseur'; toggleBeneficiaire(); return;
    }
  }
  /* Clients */
  var clis = getClients();
  for (var c = 0; c < clis.length; c++) {
    var cliName = (clis[c].nom || '').toLowerCase();
    if (cliName === l || cliName.indexOf(l) !== -1 || l.indexOf(cliName) !== -1) {
      types.value = 'client'; toggleBeneficiaire(); return;
    }
  }
}

function editCaisseOp(id) {
  var ops = getOperationsCaisse();
  var o = null;
  for (var i = 0; i < ops.length; i++) { if (ops[i].id === id) { o = ops[i]; break; } }
  if (!o) return;
  /* Fill form with operation data */
  var dateEl = document.getElementById('csDate');

  var sensEl = document.getElementById('csSens');

  var moyenEl = document.getElementById('csMoyen');
  var transEl = document.getElementById('csTrans');
  var tiersEl = document.getElementById('csTiers');

    var dayPart = o.date.substring(8, 10);

      window._csSelMonth = monthPart;
      window._csSelYear = yearPart;
      var mSel = document.getElementById('csSelMonth');
      var ySel = document.getElementById('csSelYear');
      if (mSel) mSel.value = monthPart;
      if (ySel) ySel.value = yearPart;

    }
  }
  if (heureEl) heureEl.value = o.heure || '';
  if (sensEl) { sensEl.value = o.sens || 'sortie'; onStaticSensChange(); }
  if (codeHidden) codeHidden.value = o.codeId || '';
  /* Fill autocomplete Code & Libellé */
  var codes = getCodesCaisse();
  for (var c = 0; c < codes.length; c++) {
    if (codes[c].id === o.codeId) {
      var codeInput = document.getElementById('csCodeContainerInput');
      var libInput = document.getElementById('csLibelleContainerInput');
      if (codeInput) codeInput.value = codes[c].code;
      if (libInput) libInput.value = codes[c].libelle;

  }
  if (montantEl) montantEl.value = fmtSep(o.montant || 0);
  if (typeEl) {
    var mappedType = o.apType || o.beneficiaireType || 'libre';

    if (o.apType === 'acompte' || o.apType === 'pret') {
      var apList2 = DB.get('mdb_acomptesPrets') || [];
      var _apRec = null;

function saveEmploye(id) {
  var matricule = document.getElementById('empMatricule').value.trim();
  var nom = document.getElementById('empNom').value.trim();
  var abreviation = document.getElementById('empAbrev').value.trim();
  if (!matricule || !nom || !abreviation) { toast('Tous les champs sont obligatoires', 'error'); return; }
  var employes = getEmployes();
  if (id) {
    for (var i = 0; i < employes.length; i++) { if (employes[i].id === id) { employes[i].matricule = matricule; employes[i].nom = nom; employes[i].abreviation = abreviation; employes[i].numTransactionOM = document.getElementById('empTransOM').value.trim(); employes[i].numTransactionMTN = document.getElementById('empTransMTN').value.trim(); employes[i].numTransactionWave = document.getElementById('empTransWave').value.trim(); employes[i].numTransactionMoov = document.getElementById('empTransMoov').value.trim(); break; } }
  } else { employes.push({id:DB.genId(), matricule:matricule, nom:nom, abreviation:abreviation, numTransactionOM:document.getElementById('empTransOM').value.trim(), numTransactionMTN:document.getElementById('empTransMTN').value.trim(), numTransactionWave:document.getElementById('empTransWave').value.trim(), numTransactionMoov:document.getElementById('empTransMoov').value.trim()}); }
  DB.set('mdb_employes', employes);
  closeModal(); toast('Employ\u00e9 enregistr\u00e9'); renderTresorerie();
}
function deleteEmploye(id) {
  if (!window.confirm('Supprimer cet employ\u00e9 ?')) return;
  var employes = getEmployes(); var r = [];
  for (var i = 0; i < employes.length; i++) { if (employes[i].id !== id) r.push(employes[i]); }
  DB.set('mdb_employes', r); toast('Employ\u00e9 supprim\u00e9'); renderTresorerie();
}

function saveCodeCaisse(id) {

  if (!code || !libelle) { toast('Code et libell\u00e9 sont obligatoires', 'error'); return; }

    for (var i = 0; i < codes.length; i++) { if (codes[i].id === id) { codes[i].code = code; codes[i].libelle = libelle; codes[i].sens = sens; codes[i].montantDefaut = montantDefaut; break; } }

}

function onModeleCodeChange() {
  var codeId = document.getElementById('moCode').value;
  if (!codeId) return;
  var codes = getCodesCaisse();
  for (var i = 0; i < codes.length; i++) {
    if (codes[i].id === codeId) {
      var libEl = document.getElementById('moLibelle');
      if (libEl && !libEl.value) libEl.value = codes[i].libelle || '';
      var sensEl = document.getElementById('moSens');
      if (sensEl && codes[i].sens) sensEl.value = codes[i].sens;
      var montantEl = document.getElementById('moMontantDefaut');
      if (montantEl && codes[i].montantDefaut) montantEl.value = codes[i].montantDefaut;
      break;
    }

function populateAutocompleteSelect(containerId, items, options) {
  var container = document.getElementById(containerId);
  if (!container) return;
  var wrapper = document.createElement('div');
  wrapper.style.cssText = 'position:relative;width:100%';
  var hiddenInput = document.createElement('input');
  hiddenInput.type = 'hidden';
  hiddenInput.id = containerId + 'Hidden';
  hiddenInput.value = options.selected || '';
  var visibleInput = document.createElement('input');
  visibleInput.type = 'text';
  visibleInput.id = containerId + 'Input';
  visibleInput.placeholder = options.placeholder || 'Taper pour chercher...';
  var fsSize = options.fontSize || '13px';
  var fsPad = options.fontSize ? '3px 6px' : '8px 12px';
  visibleInput.style.cssText = 'width:100%;padding:' + fsPad + ';border:1px solid var(--gray-300);border-radius:var(--radius);font-size:' + fsSize + ';outline:none;box-sizing:border-box';
  visibleInput.setAttribute('autocomplete', 'off');
  var listDiv = document.createElement('div');
  listDiv.id = containerId + 'Dropdown';
  listDiv.style.cssText = 'display:none;position:fixed;min-width:250px;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);box-shadow:var(--shadow-md);max-height:300px;overflow-y:auto;z-index:99999';
  wrapper.appendChild(hiddenInput);
  wrapper.appendChild(visibleInput);
  wrapper.appendChild(listDiv);
  container.parentNode.replaceChild(wrapper, container);
  if (options.selected) {
    for (var i = 0; i < items.length; i++) {
      if (items[i].id === options.selected) { visibleInput.value = items[i].label; break; }
    }
  }
  function showFiltered(query) {
    var q = (query || '').toLowerCase().trim();
    listDiv.innerHTML = '';
    var matches = [];
    for (var i2 = 0; i2 < items.length; i2++) {
      var label = (items[i2].label || '').toLowerCase();
      if (!q || label.indexOf(q) !== -1) matches.push(items[i2]);
    }
    if (matches.length === 0) {
      if (options.onNotFound && q) {
        var notif = document.createElement('div');
        notif.style.cssText = 'padding:8px;font-size:' + fsSize + ';color:var(--gray-500);text-align:center';
        notif.textContent = '"' + q + '" n\'existe pas';
        listDiv.appendChild(notif);
        var createBtn = document.createElement('div');
        createBtn.style.cssText = 'padding:6px 8px;cursor:pointer;font-size:' + fsSize + ';font-weight:600;color:var(--primary);text-align:center;border-top:1px solid var(--gray-200)';
        createBtn.textContent = '+ Cr\u00e9er "' + q + '"';
        createBtn.onmouseenter = function(){ this.style.background = 'var(--primary-light)'; };
        createBtn.onmouseleave = function(){ this.style.background = '#fff'; };
        createBtn.onclick = function(e) {
          e.stopPropagation();
          listDiv.style.display = 'none';
          options.onNotFound(q);
        };
        listDiv.appendChild(createBtn);
      } else {
        listDiv.style.display = 'none';
        return;
      }
    } else {
      for (var i3 = 0; i3 < matches.length; i3++) {
        var item = document.createElement('div');
        item.style.cssText = 'padding:5px 8px;cursor:pointer;font-size:' + fsSize + ';border-bottom:1px solid var(--gray-100)';
        item.textContent = matches[i3].label;
        item.onmouseenter = function(){ this.style.background = 'var(--primary-light)'; };
        item.onmouseleave = function(){ this.style.background = '#fff'; };
        item.onclick = (function(m){ return function(e){
          e.stopPropagation();
          visibleInput.value = m.label;
          hiddenInput.value = m.id;
          listDiv.style.display = 'none';
          if (options.onSelect) options.onSelect(m);
        }; })(matches[i3]);
        listDiv.appendChild(item);
      }
    }
    var rect = visibleInput.getBoundingClientRect();
    listDiv.style.left = rect.left + 'px';
    listDiv.style.top = (rect.bottom) + 'px';
    listDiv.style.width = Math.max(rect.width, 250) + 'px';
    listDiv.style.display = 'block';
  }
  visibleInput.addEventListener('input', function(){
    showFiltered(this.value);
    var q = this.value.toLowerCase().trim();
    var found = false;
    for (var i = 0; i < items.length; i++) {
      if (items[i].label.toLowerCase() === q) { hiddenInput.value = items[i].id; found = true; break; }
    }
    if (!found) {
      if (options.freeText) hiddenInput.value = this.value.trim();
      else hiddenInput.value = '';
    }
    if (options.onInput) options.onInput(this.value);
  });
  visibleInput.addEventListener('focus', function(){
    if (this.value.trim()) showFiltered(this.value);
    else if (options.showAllOnFocus) showFiltered('');
  });
  visibleInput.addEventListener('blur', function(){
    setTimeout(function(){ listDiv.style.display = 'none'; }, 150);
  });
  function repositionDropdown() {
    if (listDiv.style.display !== 'none') {
      var rect = visibleInput.getBoundingClientRect();
      listDiv.style.left = rect.left + 'px';
      listDiv.style.top = (rect.bottom) + 'px';
      listDiv.style.width = Math.max(rect.width, 250) + 'px';
    }
  }
  document.addEventListener('scroll', repositionDropdown, true);
  window.addEventListener('resize', repositionDropdown);
  visibleInput.addEventListener('keydown', function(e){
    if (e.key === 'Tab' && listDiv.style.display === 'block') {
      var q = this.value.toLowerCase().trim();
      var matches = [];
      for (var i = 0; i < items.length; i++) {
        var label = (items[i].label || '').toLowerCase();
        if (!q || label.indexOf(q) !== -1) matches.push(items[i]);
      }
      if (matches.length > 0) {
        e.preventDefault();
        visibleInput.value = matches[0].label;
        hiddenInput.value = matches[0].id;
        listDiv.style.display = 'none';
        if (options.onSelect) options.onSelect(matches[0]);
        visibleInput.focus();
      }
    }
  });
}

function generatePieceNumber(caisseId, opDate) {
  var caisses = getCaisses();
  var employes = getEmployes();
  var caissierAbbr = 'XX';
  for (var ci = 0; ci < caisses.length; ci++) {
    if (caisses[ci].id === caisseId) {
      for (var ei = 0; ei < employes.length; ei++) {
        if (employes[ei].id === caisses[ci].agentId) { caissierAbbr = employes[ei].abreviation || 'XX'; break; }
      }
      if (caissierAbbr === 'XX' && caisses[ci].agentNom) caissierAbbr = caisses[ci].agentNom.substring(0, 4).toUpperCase();
      break;
    }
  }
  var d = opDate || getToday();
  var y = d.substring(2, 4);
  var m = d.substring(5, 7);
  var allOps = getOperationsCaisse();
  var seq = 0;
  for (var i = 0; i < allOps.length; i++) {
    if (allOps[i].caisseId === caisseId && allOps[i].date && allOps[i].date.substring(0, 7) === d.substring(0, 7)) seq++;
  }
  seq++;
  return caissierAbbr + y + m + (seq < 10 ? '00' : seq < 100 ? '0' : '') + seq;
}

function handleCaisseImportFile(file) {
  if (!file) return;
  var ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'csv' || ext === 'xlsx' || ext === 'xls') {
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var data = new Uint8Array(e.target.result);
        var workbook = XLSX.read(data, {type: 'array', cellDates: true});
        var firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        var jsonData = XLSX.utils.sheet_to_json(firstSheet, {header: 1, defval: ''});
        if (jsonData.length < 2) { toast('Le fichier semble vide ou ne contient qu\'une seule ligne', 'error'); return; }
        /* Detect header row - try to find date/libelle/montant columns */
        var headerRow = null;
        var headerIdx = 0;
        for (var hi = 0; hi < Math.min(5, jsonData.length); hi++) {
          var row = jsonData[hi];
          var rowText = row.join(' ').toLowerCase();
          if (rowText.indexOf('date') !== -1 || rowText.indexOf('libell') !== -1 || rowText.indexOf('montant') !== -1 || rowText.indexOf('jour') !== -1 || rowText.indexOf('operation') !== -1 || rowText.indexOf('op\u00e9ration') !== -1 || rowText.indexOf('description') !== -1 || rowText.indexOf('designation') !== -1 || rowText.indexOf('entr') !== -1 || rowText.indexOf('sorti') !== -1 || rowText.indexOf('solde') !== -1 || rowText.indexOf('recette') !== -1 || rowText.indexOf('depense') !== -1 || rowText.indexOf('d\u00e9pense') !== -1) {
            headerRow = row; headerIdx = hi; break;
          }
        }
        if (!headerRow) { headerRow = jsonData[0]; headerIdx = 0; }
        /* Map columns: pass 1 = non-montant columns, pass 2 = montant/entree/sortie among leftovers */
        var colMap = {date:-1, libelle:-1, montantEntree:-1, montantSortie:-1, sens:-1, type:-1, beneficiaire:-1, heure:-1, moyen:-1, numero:-1, observations:-1};
        for (var ci = 0; ci < headerRow.length; ci++) {
          var h = ('' + headerRow[ci]).toLowerCase().trim();
          if (h.indexOf('date') !== -1 || h.indexOf('jour') !== -1) colMap.date = ci;
          if (h.indexOf('libell') !== -1 || h.indexOf('designation') !== -1 || h.indexOf('description') !== -1 || h.indexOf('motif') !== -1 || h.indexOf('objet') !== -1) colMap.libelle = ci;
          if (h.indexOf('sens') !== -1 || h.indexOf('type') !== -1) { if (h.indexOf('sens') !== -1) colMap.sens = ci; if (h.indexOf('type') !== -1 && h.indexOf('sens') === -1) colMap.type = ci; }
          if (h.indexOf('benef') !== -1 || h.indexOf('b\u00e9n\u00e9f') !== -1 || h.indexOf('client') !== -1 || h.indexOf('fournisseur') !== -1 || h.indexOf('employ') !== -1 || h.indexOf('nom') !== -1 || h.indexOf('tiers') !== -1) colMap.beneficiaire = ci;
          if (h.indexOf('heure') !== -1) colMap.heure = ci;
          if (h.indexOf('moyen') !== -1 || h.indexOf('paiement') !== -1 || h.indexOf('mode') !== -1) colMap.moyen = ci;
          if (h.indexOf('numero') !== -1 || h.indexOf('n\u00b0') !== -1 || h.indexOf('piece') !== -1 || h.indexOf('pi\u00e8ce') !== -1) colMap.numero = ci;
          if (h.indexOf('observ') !== -1 || h.indexOf('note') !== -1 || h.indexOf('comment') !== -1) colMap.observations = ci;
        }
        /* Pass 2: detect montant/entree/sortie columns among columns not already matched */
        for (var ci2 = 0; ci2 < headerRow.length; ci2++) {
          var alreadyMapped = false;
          for (var _k in colMap) { if (_k !== 'montantEntree' && _k !== 'montantSortie' && colMap[_k] === ci2) { alreadyMapped = true; break; } }
          if (alreadyMapped) continue;
          var h2 = ('' + headerRow[ci2]).toLowerCase().trim();
          if ((h2.indexOf('entr') !== -1 || h2.indexOf('recette') !== -1 || h2.indexOf('credit') !== -1 || h2.indexOf('cr\u00e9dit') !== -1 || h2.indexOf('encaissement') !== -1) && colMap.montantEntree === -1) colMap.montantEntree = ci2;
          else if ((h2.indexOf('sorti') !== -1 || h2.indexOf('d\u00e9pense') !== -1 || h2.indexOf('depense') !== -1 || h2.indexOf('debit') !== -1 || h2.indexOf('d\u00e9bit') !== -1) && colMap.montantSortie === -1) colMap.montantSortie = ci2;
          else if (h2.indexOf('montant') !== -1 || h2.indexOf('somme') !== -1 || h2.indexOf('valeur') !== -1 || h2.indexOf('prix') !== -1) {
            if (colMap.montantEntree === -1) colMap.montantEntree = ci2;
            else if (colMap.montantSortie === -1) colMap.montantSortie = ci2;
          }
        }
        /* Pass 3: detect solde column, then map first remaining unmapped col as libelle if missing */
        var soldeCol = -1;
        for (var ci3 = 0; ci3 < headerRow.length; ci3++) {
          var isMapped = false;
          for (var _k2 in colMap) { if (colMap[_k2] === ci3) { isMapped = true; break; } }
          if (isMapped) continue;
          var h3 = ('' + headerRow[ci3]).toLowerCase().trim();
          if (h3.indexOf('solde') !== -1 || h3.indexOf('soldes') !== -1 || h3.indexOf('balance') !== -1) { soldeCol = ci3; }
        }
        if (colMap.libelle === -1) {
          for (var ci4 = 0; ci4 < headerRow.length; ci4++) {
            if (ci4 === soldeCol) continue;
            var isMapped2 = false;
            for (var _k3 in colMap) { if (colMap[_k3] === ci4) { isMapped2 = true; break; } }
            if (!isMapped2) { colMap.libelle = ci4; break; }
          }
        }
        /* Parse rows */
        var rows = [];
        var codes = getCodesCaisse();
        var caisses = getCaisses();
        var myCaisseId = currentUser && currentUser.caisseId ? currentUser.caisseId : (caisses.length > 0 ? caisses[0].id : '');
        for (var ri = headerIdx + 1; ri < jsonData.length; ri++) {
          var rowData = jsonData[ri];
          if (!rowData || rowData.length === 0) continue;
          var dateCell = colMap.date >= 0 ? ('' + rowData[colMap.date]).trim() : '';
          var libelleCell = colMap.libelle >= 0 ? ('' + rowData[colMap.libelle]).trim() : '';
          var entreeCell = colMap.montantEntree >= 0 ? ('' + rowData[colMap.montantEntree]).trim() : '';
          var sortieCell = colMap.montantSortie >= 0 ? ('' + rowData[colMap.montantSortie]).trim() : '';
          var sensCell = colMap.sens >= 0 ? ('' + rowData[colMap.sens]).trim().toLowerCase() : '';
          var benefCell = colMap.beneficiaire >= 0 ? ('' + rowData[colMap.beneficiaire]).trim() : '';
          var obsCell = colMap.observations >= 0 ? ('' + rowData[colMap.observations]).trim() : '';
          if (!libelleCell && !entreeCell && !sortieCell) continue;
          /* Parse montants: colonne gauche = Entr\u00e9e, colonne droite = Sortie */
          var montantEntreeVal = parseFloat(entreeCell.replace(/[^\d.,\-]/g, '').replace(',', '.')) || 0;
          var montantSortieVal = parseFloat(sortieCell.replace(/[^\d.,\-]/g, '').replace(',', '.')) || 0;
          /* Detect sens: if two amount cols, gauche=Entr\u00e9e droite=Sortie; sinon utiliser la colonne Sens */
          var montantVal = 0;
          var detectedSens = 'sortie';
          var hasTwoCols = colMap.montantEntree >= 0 && colMap.montantSortie >= 0;
          if (hasTwoCols) {
            if (montantEntreeVal > 0 && montantSortieVal > 0) {
              if (montantEntreeVal >= montantSortieVal) { detectedSens = 'entree'; montantVal = montantEntreeVal; }
              else { detectedSens = 'sortie'; montantVal = montantSortieVal; }
            } else if (montantEntreeVal > 0) { detectedSens = 'entree'; montantVal = montantEntreeVal; }
            else if (montantSortieVal > 0) { detectedSens = 'sortie'; montantVal = montantSortieVal; }
            else if (sensCell === 'entree' || sensCell === 'entr\u00e9e') { detectedSens = 'entree'; }
          } else {
            /* Single amount column - use Sens column if available */
            var singleVal = montantEntreeVal > 0 ? montantEntreeVal : montantSortieVal;
            if (sensCell === 'entree' || sensCell === 'entr\u00e9e' || sensCell === 'recette' || sensCell === '+' || sensCell === 'credit' || sensCell === 'cr\u00e9dit') { detectedSens = 'entree'; montantVal = singleVal; }
            else if (sensCell === 'sortie' || sensCell === 'depense' || sensCell === 'd\u00e9pense' || sensCell === '-' || sensCell === 'debit' || sensCell === 'd\u00e9bit') { detectedSens = 'sortie'; montantVal = singleVal; }
            else if (singleVal < 0) { detectedSens = 'entree'; montantVal = Math.abs(singleVal); }
            else { montantVal = singleVal; }
          }
          /* Auto-detect best code match */
          var bestMatch = findBestCodeMatch(libelleCell || benefCell, codes);
          /* Auto-detect beneficiary type from libelle */
          var detectedType = 'libre';
          var detectedBenefType = '';
          var detectedBenefId = '';
          var detectedBenefNom = benefCell || '';
          var searchText = (libelleCell || benefCell || '').toLowerCase();
          if (searchText) {
            var emps2 = getEmployes();
            for (var _ei = 0; _ei < emps2.length; _ei++) {
              var en = (emps2[_ei].nom || '').toLowerCase();
              var ea = (emps2[_ei].abreviation || '').toLowerCase();
              if (searchText.indexOf(en) !== -1 || searchText.indexOf(ea) !== -1 || en.indexOf(searchText) !== -1) {
                detectedType = 'employe'; detectedBenefType = 'employe'; detectedBenefId = emps2[_ei].id; detectedBenefNom = emps2[_ei].nom; break;
              }
            }
            if (detectedType === 'libre') {
              var frns2 = getFournisseurs();
              for (var _fi = 0; _fi < frns2.length; _fi++) {
                var fn = (frns2[_fi].nom || '').toLowerCase();
                if (searchText.indexOf(fn) !== -1 || fn.indexOf(searchText) !== -1) {
                  detectedType = 'fournisseur'; detectedBenefType = 'fournisseur'; detectedBenefId = frns2[_fi].id; detectedBenefNom = frns2[_fi].nom; break;
                }
              }
            }
            if (detectedType === 'libre') {
              var clis2 = getClients();
              for (var _ci = 0; _ci < clis2.length; _ci++) {
                var cn = (clis2[_ci].nom || '').toLowerCase();
                if (searchText.indexOf(cn) !== -1 || cn.indexOf(searchText) !== -1) {
                  detectedType = 'client'; detectedBenefType = 'client'; detectedBenefId = clis2[_ci].id; detectedBenefNom = clis2[_ci].nom; break;
                }
              }
            }
          }
          rows.push({
            date: parsedDate, day: parsedDay, libelle: libelleCell, montant: montantVal,
            montantEntree: montantEntreeVal, montantSortie: montantSortieVal,
            sens: detectedSens, beneficiaire: benefCell, observations: obsCell,
            codeId: bestMatch ? bestMatch.id : '', codeLabel: bestMatch ? (bestMatch.code + ' - ' + bestMatch.libelle) : '(Nouveau)',
            codeObj: bestMatch, type: detectedType,
            beneficiaireType: detectedBenefType, beneficiaireId: detectedBenefId, beneficiaireNom: detectedBenefNom,
            caisseId: myCaisseId, selected: true
          });
        }
        if (rows.length === 0) { toast('Aucune ligne valide trouv\u00e9e', 'error'); return; }
        renderCaisseImportPreview(rows);
      } catch(ex) { toast('Erreur de lecture du fichier : ' + ex.message, 'error'); }
    };
    reader.readAsArrayBuffer(file);
  } else {
    toast('Format non support\u00e9. Utilisez .xlsx, .xls ou .csv', 'error');
  }
}

function findBestCodeMatch(text, codes) {
  if (!text || !codes || codes.length === 0) return null;
  var t = text.toLowerCase().trim();
  /* Exact match first */
  for (var i = 0; i < codes.length; i++) {
    var codeText = (codes[i].libelle + ' ' + codes[i].code).toLowerCase();
    if (codeText === t || codes[i].libelle.toLowerCase() === t || codes[i].code.toLowerCase() === t) return codes[i];
  }
  /* Contains match */
  for (var i2 = 0; i2 < codes.length; i2++) {
    var ct = (codes[i2].libelle + ' ' + codes[i2].code).toLowerCase();
    if (ct.indexOf(t) !== -1 || t.indexOf(codes[i2].libelle.toLowerCase()) !== -1) return codes[i2];
  }
  /* Word-level match - check if any word in text matches a code keyword */
  var words = t.split(/[\s,;:\-]+/);
  var bestScore = 0, best = null;
  for (var i3 = 0; i3 < codes.length; i3++) {
    var score = 0;
    var ct2 = (codes[i3].libelle + ' ' + codes[i3].code).toLowerCase();
    for (var w = 0; w < words.length; w++) {
      if (words[w].length < 3) continue;
      if (ct2.indexOf(words[w]) !== -1) score += words[w].length;
    }
    if (score > bestScore) { bestScore = score; best = codes[i3]; }
  }
  if (bestScore > 2) return best;
  return null;
}

function updateImportRow(idx, field, val) {
  if (!window._importRows || !window._importRows[idx]) return;
  var r = window._importRows[idx];
  if (field === 'type') {
    r.type = val;
    r.beneficiaireId = '';
    r.beneficiaireNom = r.beneficiaire || '';
    r.beneficiaireType = '';
    var benInp = document.getElementById('impBenef_' + idx);
    if (benInp) updateImportBenef(idx, benInp.value);
  }
  window._importRows[idx][field === 'month' ? 'date' : field] = val;
}
function updateImportMontant(idx) {
  if (!window._importRows || !window._importRows[idx]) return;
  var r = window._importRows[idx];
  var entreeEl = document.getElementById('impEntree_' + idx);
  var sortieEl = document.getElementById('impSortie_' + idx);
  var entreeVal = parseFloat(entreeEl ? entreeEl.value : 0) || 0;
  var sortieVal = parseFloat(sortieEl ? sortieEl.value : 0) || 0;
  r.montantEntree = entreeVal;
  r.montantSortie = sortieVal;
  if (entreeVal > 0 && sortieVal > 0) {
    r.montant = entreeVal >= sortieVal ? entreeVal : sortieVal;
    r.sens = entreeVal >= sortieVal ? 'entree' : 'sortie';
  } else if (entreeVal > 0) { r.montant = entreeVal; r.sens = 'entree'; }
  else if (sortieVal > 0) { r.montant = sortieVal; r.sens = 'sortie'; }
  else { r.montant = 0; r.sens = 'sortie'; }
}
function updateImportBenef(idx, val) {
  if (!window._importRows || !window._importRows[idx]) return;
  var r = window._importRows[idx];
  r.beneficiaire = val;
  r.beneficiaireNom = val;
  /* Try to match to existing entity */
  var t = r.type || 'libre';
  if (t === 'employe') {
    var emps = getEmployes();
    for (var ei = 0; ei < emps.length; ei++) {
      if ((emps[ei].nom || '').toLowerCase().indexOf(val.toLowerCase()) !== -1 || (emps[ei].abreviation || '').toLowerCase() === val.toLowerCase()) {
        r.beneficiaireId = emps[ei].id; r.beneficiaireNom = emps[ei].nom; break;
      }
    }
  } else if (t === 'fournisseur') {
    var frns = getFournisseurs();
    for (var fi = 0; fi < frns.length; fi++) {
      if ((frns[fi].nom || '').toLowerCase().indexOf(val.toLowerCase()) !== -1) {
        r.beneficiaireId = frns[fi].id; r.beneficiaireNom = frns[fi].nom; break;
      }
    }
  } else if (t === 'client') {
    var clis = getClients();
    for (var ci = 0; ci < clis.length; ci++) {
      if ((clis[ci].nom || '').toLowerCase().indexOf(val.toLowerCase()) !== -1) {
        r.beneficiaireId = clis[ci].id; r.beneficiaireNom = clis[ci].nom; break;
      }
    }
  }
}

function onImportCodeChange(idx) {
  var sel = document.getElementById('impCode_' + idx);
  if (!sel) return;
  var codeId = sel.value;
  var codes = getCodesCaisse();
  var found = null;
  for (var ci = 0; ci < codes.length; ci++) { if (codes[ci].id === codeId) { found = codes[ci]; break; } }
  if (found) {
    window._importRows[idx].codeId = found.id;
    window._importRows[idx].codeObj = found;
    if (found.typeOp) window._importRows[idx].type = found.typeOp;
  }
}

function createImportCodeFromRow(idx) {
  var r = window._importRows[idx];
  if (!r) return;
  var libelle = prompt('Libell\u00e9 du nouveau code :', r.libelle || '');

function processCaisseImport(asDraft) {
  var rows = window._importRows;
  if (!rows || rows.length === 0) { toast('Aucune ligne \u00e0 importer', 'error'); return; }
  var ops = getOperationsCaisse();
  var caisses = getCaisses();
  var errors = [];
  var count = 0;
  var now = new Date();
  var defMonth = (now.getMonth() < 9 ? '0' : '') + (now.getMonth() + 1);
  var defYear = '' + now.getFullYear();
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (!r.libelle) { errors.push('Ligne ' + (i+1) + ' : libell\u00e9 manquant'); continue; }
    if (!r.montant || r.montant <= 0) { errors.push('Ligne ' + (i+1) + ' : montant invalide'); continue; }
    /* Build date */
    var day = r.day || ('' + now.getDate());
    var month = r.date ? r.date.substring(5,7) : defMonth;
    var year = r.date ? r.date.substring(0,4) : defYear;
    if (day.length === 1) day = '0' + day;
    var fullDate = year + '-' + month + '-' + day;
    /* Determine caisse */
    var caisseId = r.caisseId || (currentUser && currentUser.caisseId ? currentUser.caisseId : (caisses.length > 0 ? caisses[0].id : ''));
    if (!caisseId) { errors.push('Ligne ' + (i+1) + ' : aucune caisse disponible'); continue; }
    /* Determine codeId */
    var codeId = r.codeId || '';
    /* Use pre-detected or user-modified beneficiary */
    var beneficiaireType = r.type || 'libre';
    var beneficiaireId = r.beneficiaireId || '';
    var beneficiaireNom = r.beneficiaireNom || r.beneficiaire || '';
    /* If beneficiary was typed as free text, try to match */
    if (!beneficiaireId && r.beneficiaire) {
      if (beneficiaireType === 'employe') {
        var emps = getEmployes();
        for (var ei = 0; ei < emps.length; ei++) {
          if ((emps[ei].nom || '').toLowerCase().indexOf((r.beneficiaire || '').toLowerCase()) !== -1 || (emps[ei].abreviation || '').toLowerCase() === (r.beneficiaire || '').toLowerCase()) {
            beneficiaireId = emps[ei].id; beneficiaireNom = emps[ei].nom; break;
          }
        }
      } else if (beneficiaireType === 'fournisseur') {
        var frns = getFournisseurs();
        for (var fi = 0; fi < frns.length; fi++) {
          if ((frns[fi].nom || '').toLowerCase().indexOf((r.beneficiaire || '').toLowerCase()) !== -1) {
            beneficiaireId = frns[fi].id; beneficiaireNom = frns[fi].nom; break;
          }
        }
      } else if (beneficiaireType === 'client') {
        var clis = getClients();
        for (var cli = 0; cli < clis.length; cli++) {
          if ((clis[cli].nom || '').toLowerCase().indexOf((r.beneficiaire || '').toLowerCase()) !== -1) {
            beneficiaireId = clis[cli].id; beneficiaireNom = clis[cli].nom; break;
          }
        }
      }
    }
    /* Generate piece number */
    var numeroPiece = generatePieceNumber(caisseId, fullDate);
    var opId = DB.genId();
    ops.push({
      id: opId, numeroPiece: numeroPiece, date: fullDate, heure: '',
      codeId: codeId, libelle: r.libelle, montant: r.montant, sens: r.sens || 'sortie',
      moyenPaiement: '', numeroTransaction: '',
      beneficiaireType: beneficiaireType, beneficiaireId: beneficiaireId, beneficiaireNom: beneficiaireNom,
      observations: r.observations || '', remettant: '', executant: '',
      imprime: false, montantCharge: 0, caisseId: caisseId, reversed: false, frais: 0, linkedOpId: '',
      brouillon: !!asDraft
    });
    count++;
  }
  DB.set('mdb_operationsCaisse', ops);
  closeModal();
  var label = asDraft ? 'brouillon(s) enregistr\u00e9(s)' : 'op\u00e9ration(s) import\u00e9e(s)';
  toast(count + ' ' + label + (errors.length > 0 ? ' (' + errors.length + ' erreur(s) ignor\u00e9e(s))' : ''));
  if (errors.length > 0) {
    var errHtml = errors.join('<br>');
    openFormModal('Erreurs d\'import', '<div style="color:var(--danger);font-size:13px">' + errHtml + '</div>', '<button class="btn btn-primary" onclick="closeModal()">OK</button>');
  }
  renderTresorerie();
}

/* ===== FILTER IMPRIME ===== */
function filterCaisseImprime() {
  var filter = document.getElementById('csFilterImprime') ? document.getElementById('csFilterImprime').value : '';
  var brouillonFilter = document.getElementById('csFilterBrouillon') ? document.getElementById('csFilterBrouillon').value : '';
  var body = document.getElementById('csOpsBody');
  if (!body) return;
  var rows = body.getElementsByTagName('tr');
  for (var i = 0; i < rows.length; i++) {
    var rowImp = rows[i].getAttribute('data-imprime');
    var rowBrouillon = rows[i].getAttribute('data-brouillon');
    var show = true;
    if (filter && rowImp && rowImp !== filter) show = false;
    if (brouillonFilter && rowBrouillon && rowBrouillon !== brouillonFilter) show = false;
    if (!filter && !brouillonFilter) show = true;
    if (filter && !rowImp) show = true;
    rows[i].style.display = show ? '' : 'none';
  }
}
function filterCaisseBrouillon() {
  filterCaisseImprime();
}

    for (var oi = 0; oi < mOps.length; oi++) {

      var codeLabel = '';
      for (var ci = 0; ci < codes.length; ci++) { if (codes[ci].id === o.codeId) { codeLabel = codes[ci].code; break; } }
      var sensClass = o.sens === 'entree' ? 'entree' : 'sortie';
      var sensLabel = o.sens === 'entree' ? 'Entr\u00e9e' : 'Sortie';
      var montantNum = parseFloat(o.montant) || 0;
      if (o.sens === 'entree') mEntrees += montantNum; else mSorties += montantNum;
      var transfertInfo = '';
      if (o.typeOp === 'transfert') {
        if (o.sens === 'sortie' && o.caisseDestNom) transfertInfo = '\u2192 ' + o.caisseDestNom;
        else if (o.sens === 'entree' && o.caisseSourceNom) transfertInfo = '\u2190 ' + o.caisseSourceNom;

      html += '<td>' + escH(o.date || '') + '</td>';
      html += '<td>' + escH(o.heure || '-') + '</td>';
      html += '<td class="' + sensClass + '">' + sensLabel + (transfertInfo ? ' ' + escH(transfertInfo) : '') + '</td>';

      html += '<td>' + escH(o.codeLabel || o.libelle || '-') + '</td>';
      html += '<td style="text-align:right">' + fmtMoney(o.montant) + '</td>';
      html += '<td>' + escH(o.beneficiaireNom || '-') + '</td>';
      html += '<td>' + escH(o.executant || '-') + '</td>';
      html += '<td>' + escH(o.moyenPaiement || '-') + '</td>';
      html += '<td>' + escH(o.remettant || '-') + '</td>';
      html += '</tr>';
    }
    html += '<tr class="total-row"><td colspan="5">Totaux ' + escH(mLabel) + '</td><td style="text-align:right" class="entree">+ ' + fmtMoney(mEntrees) + '</td><td colspan="2" style="text-align:right" class="sortie">- ' + fmtMoney(mSorties) + '</td><td colspan="2" style="text-align:right;font-weight:700">Solde : ' + fmtMoney(mEntrees - mSorties) + '</td></tr>';
    html += '</table>';
  }

  html += '</body></html>';
  var w = window.open('', '_blank', 'width=900,height=700');
  w.document.write(html); w.document.close(); w.print();
  closeModal();
  toast('PDF g\u00e9n\u00e9r\u00e9');
}

function onPVCodeInput() {
  var code = document.getElementById('pvCodeArticle').value.trim();
  var articles = getArticles();
  for (var i = 0; i < articles.length; i++) {
    if (articles[i].code === code) {
      document.getElementById('pvArticleNom').value = articles[i].designation || '';
      document.getElementById('pvPrixUnitaire').value = getPrixForDate(articles[i], getToday());
      var sel = document.getElementById('pvArticle');
      for (var j = 0; j < sel.options.length; j++) { if (sel.options[j].value === articles[i].id) { sel.selectedIndex = j; break; } }
      return;
    }
  }

function onPVArticleChange() {
  var sel = document.getElementById('pvArticle');
  var articles = getArticles();
  if (!sel || sel.value === '__custom' || !sel.value) {
    if (sel.value === '__custom') {
      document.getElementById('pvCodeArticle').value = '';
      document.getElementById('pvArticleNom').value = '';
      document.getElementById('pvPrixUnitaire').value = 0;
    }
    return;
  }
  for (var i = 0; i < articles.length; i++) {
    if (articles[i].id === sel.value) {
      document.getElementById('pvCodeArticle').value = articles[i].code || '';
      document.getElementById('pvArticleNom').value = articles[i].designation || '';
      document.getElementById('pvPrixUnitaire').value = getPrixForDate(articles[i], getToday());

  };

function saveGrille(id) {
  var code = document.getElementById('grCode').value.trim();
  var designation = document.getElementById('grDesignation').value.trim();
  var montant = parseFloat(document.getElementById('grMontant').value) || 0;
  if (!code || !designation) { toast('Tous les champs sont obligatoires', 'error'); return; }
  var grille = getGrilleTarifaire();
  if (id) { for (var i = 0; i < grille.length; i++) { if (grille[i].id === id) { grille[i].codeArticle = code; grille[i].designation = designation; grille[i].montant = montant; break; } } }
  else { grille.push({id:DB.genId(), codeArticle:code, designation:designation, montant:montant}); }
  DB.set('mdb_grilleTarifaire', grille);
  closeModal(); toast('Article enregistr\u00e9'); renderGrilleTarifaire();
}
function deleteGrille(id) {
  if (!window.confirm('Supprimer cet article ?')) return;
  var grille = getGrilleTarifaire(); var r = [];
  for (var i = 0; i < grille.length; i++) { if (grille[i].id !== id) r.push(grille[i]); }
  DB.set('mdb_grilleTarifaire', r); toast('Article supprim\u00e9'); renderGrilleTarifaire();
}
function autoPopulateGrille() {
  var articles = getArticles();
  var grille = getGrilleTarifaire();
  var existingCodes = {};
  for (var i = 0; i < grille.length; i++) { existingCodes[grille[i].codeArticle] = true; }
  var added = 0;
  for (var j = 0; j < articles.length; j++) {
    var a = articles[j];
    if (existingCodes[a.code]) continue;
    var prix = 0;
    if (a.prixPeriodes && a.prixPeriodes.length > 0) { prix = a.prixPeriodes[0].prixUnitaire || 0; }
    grille.push({id:DB.genId(), codeArticle:a.code, designation:a.designation, montant:prix});
    added++;
  }
  if (added === 0) { toast('Aucun nouvel article \u00e0 ajouter'); return; }
  DB.set('mdb_grilleTarifaire', grille);
  toast(added + ' article(s) ajout\u00e9(s) depuis la nomenclature'); renderGrilleTarifaire();
}

    }

}

function saveStock(id) {
  var articleId = document.getElementById('stkArticle').value;
  var quantite = parseFloat(document.getElementById('stkQte').value) || 0;
  var prixUnitaire = parseFloat(document.getElementById('stkPrix').value) || 0;
  if (!articleId) { toast('L\'article est obligatoire', 'error'); return; }
  var art = getArticleById(articleId);
  var stocks = DB.get('mdb_stocks') || [];
  var data = {
    articleId: articleId,
    articleNom: art ? art.designation : '',
    articleCode: art ? art.code : '',
    quantite: quantite,
    prixUnitaire: prixUnitaire
  };
  if (id) {
    for (var i = 0; i < stocks.length; i++) {
      if (stocks[i].id === id) { data.id = id; stocks[i] = data; break; }
    }
  } else {
    data.id = DB.genId();
    stocks.push(data);
  }
  DB.set('mdb_stocks', stocks);
  closeModal();
  toast('Stock enregistr\u00e9');
  renderStock();
}

function deleteStock(id) {
  openConfirm('Supprimer ce stock ?', function() {
    var stocks = DB.get('mdb_stocks') || [];
    var r = [];
    for (var i = 0; i < stocks.length; i++) { if (stocks[i].id !== id) r.push(stocks[i]); }
    DB.set('mdb_stocks', r);
    toast('Stock supprim\u00e9');
    renderStock();
  });
}

          quantite: ln.quantite || 0, facture: bl.factureId ? 'Oui' : 'Non'
        });
      }
    }
  }
  for (var k = 0; k < rows.length; k++) {
    var r = rows[k];
    var factBadge = r.facture === 'Oui' ? '<span class="badge badge-success">Oui</span>' : '<span class="badge badge-warning">Non</span>';
    html += '<tr data-article="' + escH(r.artKey) + '" data-client="' + r.clientId + '" data-date="' + r.dateBL + '">';
    html += '<td class="fw-600">' + escH(r.article) + '</td><td>' + escH(r.clientNom) + '</td><td>' + escH(r.destination) + '</td>';
    html += '<td>' + escH(r.blNumero) + '</td><td>' + fmtDate(r.dateBL) + '</td>';
    html += '<td class="text-right fw-600">' + r.quantite + '</td><td>' + factBadge + '</td></tr>';
  }
  if (rows.length === 0) html += '<tr><td colspan="7" class="text-center text-muted">Aucune livraison enregistr\u00e9e</td></tr>';
  html += '<tr id="slTotalRow" style="display:none;font-weight:700;background:var(--gray-50)"><td colspan="5" style="text-align:right">Total</td><td class="text-right fw-700" id="slTotalQty">0</td><td></td></tr>';
  html += '</tbody></table></div></div>';
  document.getElementById('content').innerHTML = html;
  var artSel = document.getElementById('slFilterArticle');
  if (artSel) { var seen = {}; for (var ak in allArticles) { if (allArticles.hasOwnProperty(ak) && !seen[allArticles[ak]]) { seen[allArticles[ak]] = true; artSel.innerHTML += '<option value="' + escH(ak) + '">' + escH(allArticles[ak]) + '</option>'; } } }
  var clSel = document.getElementById('slFilterClient');
  if (clSel) { for (var ck in allClients) { if (allClients.hasOwnProperty(ck)) clSel.innerHTML += '<option value="' + ck + '">' + escH(allClients[ck]) + '</option>'; } }
}
function filterSuiviLivraisons() {
  var artF = (document.getElementById('slFilterArticle') || {}).value || '';
  var clF = (document.getElementById('slFilterClient') || {}).value || '';
  var dFrom = (document.getElementById('slDateFrom') || {}).value || '';
  var dTo = (document.getElementById('slDateTo') || {}).value || '';
  var rows = document.getElementById('slBody');
  if (!rows) return;
  var trs = rows.getElementsByTagName('tr');
  var totalQty = 0, visibleCount = 0;
  for (var i = 0; i < trs.length; i++) {
    if (trs[i].id === 'slTotalRow') continue;
    var ra = trs[i].getAttribute('data-article') || '';
    var rc = trs[i].getAttribute('data-client') || '';
    var rd = trs[i].getAttribute('data-date') || '';
    var show = true;
    if (artF && ra !== artF) show = false;
    if (clF && rc !== clF) show = false;
    if (dFrom && rd < dFrom) show = false;
    if (dTo && rd > dTo) show = false;
    trs[i].style.display = show ? '' : 'none';
    if (show) { visibleCount++; var qteCell = trs[i].querySelector('td:nth-child(6)'); totalQty += parseInt(qteCell ? qteCell.textContent : 0) || 0; }
  }
  var totalRow = document.getElementById('slTotalRow');
  var totalCell = document.getElementById('slTotalQty');
  if (totalRow) {
    var hasFilter = artF || clF || dFrom || dTo;
    totalRow.style.display = hasFilter && visibleCount > 0 ? '' : 'none';
    if (totalCell) totalCell.textContent = totalQty;
  }
}

function saveElementAchat(id) {
  var nom = document.getElementById('eaNom').value.trim();
  if (!nom) { toast('Le nom est obligatoire', 'error'); return; }
  var typeId = document.getElementById('eaType').value;
  var elements = getElementsAchats();
  var data = {nom: nom, typeId: typeId, valeurs: _eaValeurs};
  if (id) {
    for (var j = 0; j < elements.length; j++) { if (elements[j].id === id) { data.id = id; elements[j] = data; break; } }

    data.id = DB.genId();
    elements.push(data);
  }

  closeModal(); toast('\u00c9l\u00e9ment enregistr\u00e9'); renderElementsAchats();
}

function deleteElementAchat(id) {

  var els = getElementsAchats(); var r = [];
  for (var i = 0; i < els.length; i++) { if (els[i].id !== id) r.push(els[i]); }

}

function getNumeroBCFournisseur() {
  var year = new Date().getFullYear();
  var bcs = getBonsCommandeFournisseurs();
  var maxNum = 0;
  for (var i = 0; i < bcs.length; i++) {
    var num = bcs[i].numero || '';
    if (num.indexOf(String(year)) === -1) continue;
    var idx = num.lastIndexOf('-');
    if (idx !== -1) {
      var n = parseInt(num.substring(idx + 1), 10);
      if (!isNaN(n) && n > maxNum) maxNum = n;
    }
  }
  return 'BCF-' + year + '-' + String(maxNum + 1).padStart(4, '0');
}

  html += '</tbody></table>';
  c.innerHTML = html;
}

function calcBcfTotals() {
  var totalHT = 0;
  for (var i = 0; i < _bcfLignes.length; i++) {
    var l = _bcfLignes[i];
    if (!l.isTitle) {
      l.montant = (l.qte || 0) * (l.prixUnitaire || 0);
      totalHT += l.montant;
    }
    if (l.sousLignes) {
      for (var s = 0; s < l.sousLignes.length; s++) {
        l.sousLignes[s].montant = (l.sousLignes[s].qte || 0) * (l.sousLignes[s].prixUnitaire || 0);
        totalHT += l.sousLignes[s].montant;
      }
    }
  }
  var tvaActive = document.getElementById('bcfTvaActive') ? document.getElementById('bcfTvaActive').checked : true;
  var tauxTva = parseFloat(document.getElementById('bcfTauxTva') ? document.getElementById('bcfTauxTva').value : 18) || 0;
  var tva = tvaActive ? totalHT * tauxTva / 100 : 0;
  var totalTTC = totalHT + tva;
  var gt = document.getElementById('bcfGrandTotal');
  if (gt) gt.innerHTML = 'Total HT: ' + fmtMoney(totalHT) + (tvaActive ? ' | TVA (' + tauxTva + '%): ' + fmtMoney(tva) : '') + ' | Total TTC: ' + fmtMoney(totalTTC);
}

function saveBcFournisseur() {
  var fournisseurId = document.getElementById('bcfFournisseur').value;
  if (!fournisseurId) { toast('Veuillez s\u00e9lectionner un fournisseur', 'error'); return; }
  var totalHT = 0;
  for (var i = 0; i < _bcfLignes.length; i++) {
    var l = _bcfLignes[i];
    if (!l.isTitle) {
      l.montant = (l.qte || 0) * (l.prixUnitaire || 0);
      totalHT += l.montant;
    }
    if (l.sousLignes) {
      for (var s = 0; s < l.sousLignes.length; s++) {
        l.sousLignes[s].montant = (l.sousLignes[s].qte || 0) * (l.sousLignes[s].prixUnitaire || 0);
        totalHT += l.sousLignes[s].montant;
      }
    }
  }
  var tvaActive = document.getElementById('bcfTvaActive').checked;
  var tauxTva = parseFloat(document.getElementById('bcfTauxTva').value) || 0;
  var tva = tvaActive ? totalHT * tauxTva / 100 : 0;
  var data = {
    numero: document.getElementById('bcfNumero').value,
    fournisseurId: fournisseurId,
    date: document.getElementById('bcfDate').value,
    statut: document.getElementById('bcfStatut').value,
    tvaActive: tvaActive,
    tauxTva: tauxTva,
    totalHT: totalHT,
    totalTVA: tva,
    totalTTC: totalHT + tva,
    lignes: _bcfLignes,
    observations: document.getElementById('bcfObs').value.trim(),
    dateCreation: new Date().toISOString()
  };
  var bcs = getBonsCommandeFournisseurs();
  if (_bcfEditId) {
    for (var j = 0; j < bcs.length; j++) { if (bcs[j].id === _bcfEditId) { data.id = _bcfEditId; data.dateCreation = bcs[j].dateCreation; bcs[j] = data; break; } }
  } else {
    data.id = DB.genId();
    bcs.push(data);
  }
  DB.set('mdb_bonsCommandeFournisseurs', bcs);
  closeModal(); toast('Bon de commande enregistr\u00e9'); renderBonsCommandeFournisseurs();
}

function deleteBcFournisseur(id) {
  if (!window.confirm('Supprimer ce bon de commande ?')) return;
  var bcs = getBonsCommandeFournisseurs(); var r = [];
  for (var i = 0; i < bcs.length; i++) { if (bcs[i].id !== id) r.push(bcs[i]); }
  DB.set('mdb_bonsCommandeFournisseurs', r); toast('Bon de commande supprim\u00e9'); renderBonsCommandeFournisseurs();
}

function startAuth() {
  if (_authStarted) return;
  if (firebaseAuth) { _authStarted = true; initAuth(); }
  else if (_authTimedOut) { _authStarted = true; initAuth(); }
  else { setTimeout(startAuth, 100); }
}
setTimeout(function() { _authTimedOut = true; }, 3000);
startAuth();
window.addEventListener('beforeunload', function() {
  createFullBackup();
  if (currentUser && currentUser.id && firebaseDb) {
    var data = {};
    for (var i = 0; i < DATA_KEYS.length; i++) {
      var val = DB.get(DATA_KEYS[i]);
      if (val === null || val === undefined) continue;
      data[DATA_KEYS[i]] = val;
    }
    if (Object.keys(data).length > 0) {
      try {
        var ref = firebaseDb.collection('enterprises').doc(currentUser.id);
        ref.set(data, {merge: true});
      } catch(e) {}
    }
  }
});
document.addEventListener('visibilitychange', function() {
  if (document.hidden && currentUser && currentUser.id) {
    createFullBackup();
  } else if (!document.hidden && currentUser && currentUser.id) {
    pushToCloud();
  }
});
startAutoBackup();
