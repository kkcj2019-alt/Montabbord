<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Tableau de Bord</title>
<style>
:root{--primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#dbeafe;--success:#16a34a;--success-light:#dcfce7;--warning:#d97706;--warning-light:#fef3c7;--danger:#dc2626;--danger-light:#fee2e2;--purple:#7c3aed;--purple-light:#ede9fe;--pink:#ec4899;--pink-light:#fce7f3;--indigo:#6366f1;--indigo-light:#e0e7ff;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;--gray-900:#111827;--sidebar-w:260px;--sidebar-collapsed-w:60px;--header-h:64px;--radius:8px;--radius-lg:12px;--shadow:0 1px 3px rgba(0,0,0,.1);--shadow-md:0 4px 6px rgba(0,0,0,.1);--shadow-lg:0 10px 15px rgba(0,0,0,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gray-100);color:var(--gray-800);font-size:14px}
#loginOverlay{position:fixed;inset:0;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;z-index:9999}
.login-card{background:#fff;border-radius:var(--radius-lg);padding:40px;width:420px;box-shadow:var(--shadow-lg)}
.login-card h1{text-align:center;margin-bottom:6px;color:var(--gray-900);font-size:22px}
.login-card .subtitle{text-align:center;color:var(--gray-500);margin-bottom:28px;font-size:14px}
.login-card .login-logo{text-align:center;margin-bottom:16px}
.login-card .login-logo svg{width:48px;height:48px;color:var(--primary)}
#sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:var(--gray-900);color:#fff;display:flex;flex-direction:column;z-index:100;overflow:hidden;transition:width .25s ease}
.sidebar-brand{padding:20px 24px;font-size:17px;font-weight:700;border-bottom:1px solid var(--gray-700);display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden}
.sidebar-brand svg{flex-shrink:0}
.sidebar-toggle{background:none;border:none;color:var(--gray-400);cursor:pointer;padding:4px;border-radius:4px;margin-left:auto;flex-shrink:0;transition:color .15s}
.sidebar-toggle:hover{color:#fff}
#sidebarNav{flex:1;overflow-y:auto;padding:8px 0}
.nav-group{margin-bottom:4px}
.nav-group-title{padding:10px 24px 4px;font-size:11px;text-transform:uppercase;color:var(--gray-400);letter-spacing:.06em;font-weight:600;white-space:nowrap;overflow:hidden}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 24px;color:var(--gray-300);cursor:pointer;transition:all .15s;text-decoration:none;font-size:14px;border-left:3px solid transparent;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(37,99,235,.2);color:#fff;border-left-color:var(--primary)}
.nav-item svg{width:20px;height:20px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;font-weight:600;min-width:20px;text-align:center}
.sidebar-footer{padding:14px 20px;border-top:1px solid var(--gray-700);display:flex;align-items:center;justify-content:space-between;overflow:hidden;white-space:nowrap}
.sidebar-footer .user-info{font-size:12px;color:var(--gray-400);overflow:hidden;text-overflow:ellipsis}
#sidebar.collapsed{width:var(--sidebar-collapsed-w)}
#sidebar.collapsed .sidebar-brand span,#sidebar.collapsed .sidebar-brand .sidebar-toggle{display:none}
#sidebar.collapsed .sidebar-brand{justify-content:center;padding:20px 8px}
#sidebar.collapsed .nav-group-title{display:none}
#sidebar.collapsed .nav-item{justify-content:center;padding:12px 0;gap:0;border-left:none;border-radius:var(--radius);margin:2px 8px}
#sidebar.collapsed .nav-item span,#sidebar.collapsed .nav-item .nav-badge{display:none}
#sidebar.collapsed .nav-item:hover{background:rgba(37,99,235,.3)}
#sidebar.collapsed .sidebar-footer{justify-content:center;padding:14px 8px}
#sidebar.collapsed .sidebar-footer .user-info{display:none}
#sidebar.collapsed .sidebar-footer .btn{padding:6px;font-size:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
#sidebar.collapsed .sidebar-footer .btn::before{content:'\2192';font-size:16px}
#sidebar.collapsed~#mainWrap{margin-left:var(--sidebar-collapsed-w)}
#mainWrap{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column;transition:margin-left .25s ease}
#header{height:var(--header-h);background:#fff;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;padding:0 32px;position:sticky;top:0;z-index:50}
#pageTitle{font-size:20px;font-weight:600;color:var(--gray-900)}
#headerActions{margin-left:auto;display:flex;gap:8px}
#content{padding:28px 36px;flex:1}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:28px}
.stat-card{background:#fff;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);display:flex;align-items:flex-start;gap:16px;transition:transform .15s,box-shadow .15s}
.stat-card.clickable{cursor:pointer}
.stat-card.clickable:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.1)}
.stat-card.clickable:active{transform:translateY(0)}
.stat-icon{width:44px;height:44px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-icon svg{width:22px;height:22px}
.stat-info .stat-value{font-size:22px;font-weight:700;color:var(--gray-900)}
.stat-info .stat-label{font-size:13px;color:var(--gray-500);margin-top:2px}
.quick-grid{display:flex;gap:16px;margin-bottom:28px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding-bottom:4px}
.quick-grid::-webkit-scrollbar{height:6px}
.quick-grid::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:3px}
.quick-card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;border:2px solid transparent}
.quick-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.1);border-color:var(--primary)}
.quick-card .qc-icon{font-size:28px;margin-bottom:8px}
.quick-card .qc-label{font-size:12px;color:var(--gray-600);font-weight:500}
.quick-card .qc-count{font-size:20px;font-weight:700;color:var(--gray-900)}
.section{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:28px;overflow:hidden}
.section-header{padding:18px 22px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between}
.section-header h3{font-size:16px;font-weight:600;color:var(--gray-800)}
.section-body{padding:22px}
.table-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:24px}
.table-header{padding:16px 20px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.table-header h3{font-size:15px;font-weight:600}
.table-responsive{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 16px;font-size:11px;text-transform:uppercase;color:var(--gray-500);background:var(--gray-50);border-bottom:1px solid var(--gray-200);font-weight:600;white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--gray-100);font-size:13px;vertical-align:middle}
tbody tr:hover{background:var(--gray-50)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:var(--radius);font-size:13px;cursor:pointer;transition:all .15s;font-weight:500;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#15803d}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-warning{background:var(--warning);color:#fff}
.btn-warning:hover{background:#b45309}
.btn-outline{background:transparent;border:1px solid var(--gray-300);color:var(--gray-700)}
.btn-outline:hover{background:var(--gray-50)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:5px;background:transparent;border:none;cursor:pointer;border-radius:var(--radius);color:var(--gray-400);display:inline-flex;align-items:center;justify-content:center}
.btn-icon:hover{background:var(--gray-100);color:var(--gray-700)}
.btn-icon.danger:hover{background:var(--danger-light);color:var(--danger)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--gray-700);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid var(--gray-300);border-radius:var(--radius);font-size:13px;outline:none;font-family:inherit;transition:border .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.form-group textarea{min-height:60px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:650px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal-sm{max-width:420px}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:17px;font-weight:600}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--gray-400);padding:4px;line-height:1}
.modal-close:hover{color:var(--gray-700)}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 20px;border-top:1px solid var(--gray-200);display:flex;justify-content:flex-end;gap:8px}
.badge{display:inline-block;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-success{background:var(--success-light);color:var(--success)}
.badge-warning{background:var(--warning-light);color:var(--warning)}
.badge-danger{background:var(--danger-light);color:var(--danger)}
.badge-purple{background:var(--purple-light);color:var(--purple)}
.badge-primary{background:var(--primary-light);color:var(--primary)}
.badge-gray{background:var(--gray-200);color:var(--gray-600)}
.alerts-bar{border-radius:var(--radius);padding:14px 18px;margin-bottom:28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px}
.alerts-bar.danger{background:var(--danger-light);border:1px solid #fca5a5;color:var(--danger);cursor:pointer;transition:background .15s}
.alerts-bar.danger:hover{background:#fdd}
.alerts-bar svg{flex-shrink:0;width:18px;height:18px}
.dash-welcome{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:var(--radius-lg);padding:24px 28px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.dash-welcome h2{font-size:18px;font-weight:700;margin:0}
.dash-welcome p{font-size:13px;opacity:.85;margin:2px 0 0 0}
.dash-welcome .dash-date{font-size:13px;opacity:.8;text-align:right}
.dash-section{background:#fff;border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);margin-bottom:20px}
.dash-section h3{font-size:15px;font-weight:600;margin:0 0 14px 0;color:var(--gray-800);display:flex;align-items:center;gap:8px}
.dash-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:768px){.dash-grid-2{grid-template-columns:1fr}}
.dash-bar-chart{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:10px}
.dash-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.dash-bar{width:100%;border-radius:4px 4px 0 0;background:var(--primary);transition:height .4s ease;min-height:2px;cursor:pointer}
.dash-bar:hover{background:var(--primary-dark)}
.dash-bar-label{font-size:11px;color:var(--gray-500);white-space:nowrap}
.dash-bar-val{font-size:10px;color:var(--gray-600);font-weight:600}
.dash-donut{width:140px;height:140px;border-radius:50%;position:relative;margin:0 auto}
.dash-donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dash-donut-center .dv{font-size:16px;font-weight:700;color:var(--gray-900)}
.dash-donut-center .dl{font-size:10px;color:var(--gray-500)}
.dash-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;justify-content:center}
.dash-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray-600)}
.dash-legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.dash-timeline{list-style:none;padding:0;margin:0}
.dash-timeline li{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--gray-100);font-size:13px}
.dash-timeline li:last-child{border-bottom:none}
.dash-tl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.dash-tl-time{font-size:11px;color:var(--gray-400);white-space:nowrap}
.dash-tl-text{color:var(--gray-700)}
.dash-tl-text strong{color:var(--gray-900)}
.dash-week-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gray-100);font-size:13px}
.dash-week-row:last-child{border-bottom:none}
.dash-week-label{color:var(--gray-600)}
.dash-week-val{font-weight:600;color:var(--gray-800)}
#toastContainer{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 20px;border-radius:var(--radius);color:#fff;font-size:13px;box-shadow:var(--shadow-md);animation:toastIn .3s;min-width:260px;pointer-events:auto}
.toast-success{background:var(--success)}
.toast-error{background:var(--danger)}
.toast-warning{background:var(--warning)}
@keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.toolbar input,.toolbar select{padding:7px 12px;border:1px solid var(--gray-300);border-radius:var(--radius);font-size:13px;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--primary)}
.toolbar label{font-size:13px;color:var(--gray-600);font-weight:500}
.empty-state{text-align:center;padding:40px 20px;color:var(--gray-400)}
.empty-state svg{width:48px;height:48px;margin-bottom:12px;opacity:.5}
.text-right{text-align:right}
.text-center{text-align:center}
.text-muted{color:var(--gray-400)}
.fw-600{font-weight:600}
.mt-8{margin-top:8px}
.mt-16{margin-top:16px}
.mb-8{margin-bottom:8px}
.mb-16{margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.lignes-table{width:100%;border-collapse:collapse;margin-top:8px}
.lignes-table th{font-size:11px;padding:8px 10px}
.lignes-table td{padding:6px 8px;border-bottom:1px solid var(--gray-100)}
.lignes-table input,.lignes-table select{padding:6px 8px;border:1px solid var(--gray-300);border-radius:var(--radius);font-size:13px;width:100%}
.lignes-table input[type="number"]{width:100px}
.grand-total{font-size:18px;font-weight:700;color:var(--gray-900);text-align:right;padding:16px 20px;border-top:2px solid var(--gray-200);background:var(--gray-50)}
.inline-edit{cursor:pointer;border-bottom:1px dashed var(--gray-300);padding:2px 4px;border-radius:3px;min-width:60px;display:inline-block;transition:background .15s}
.inline-edit:hover{background:var(--primary-light);border-bottom-color:var(--primary)}
.inline-edit-input{padding:4px 8px;border:2px solid var(--primary);border-radius:var(--radius);font-size:13px;font-weight:600;text-align:right;width:120px;outline:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;max-height:0;overflow:hidden}to{opacity:1;max-height:2000px}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.anim-fade{animation:fadeIn .3s ease both}
.anim-slide{animation:slideUp .35s ease both}
.anim-scale{animation:scaleIn .25s ease both}
.section,.table-wrap,.stat-card,.dash-section{}
.modal{animation:scaleIn .25s ease both}
.toast{animation:toastIn .35s cubic-bezier(.34,1.56,.64,1) both}
tbody tr{transition:background .15s,transform .15s}
tbody tr:hover{background:var(--gray-50)}
.btn{transition:all .2s cubic-bezier(.4,0,.2,1)}
.btn:active{transform:scale(0.97)}
.modal-overlay{transition:opacity .2s ease}
.stat-card{transition:all .2s cubic-bezier(.4,0,.2,1)}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.08)}
.quick-card{transition:all .25s cubic-bezier(.4,0,.2,1)}
.quick-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.1)}
.nav-item{transition:all .2s ease}
.nav-item:active{transform:scale(0.98)}
.badge{transition:all .2s ease}
.page-transition{}
.lignes-table tbody tr{animation:slideUp .25s ease both}
.lignes-table tbody tr:nth-child(1){animation-delay:.02s}
.lignes-table tbody tr:nth-child(2){animation-delay:.04s}
.lignes-table tbody tr:nth-child(3){animation-delay:.06s}
.lignes-table tbody tr:nth-child(4){animation-delay:.08s}
.lignes-table tbody tr:nth-child(5){animation-delay:.1s}
@media print{#sidebar,#header,#toastContainer{display:none!important}#mainWrap{margin-left:0!important}#content{padding:0!important}}
@media(max-width:768px){
  #sidebar{transform:translateX(-100%);transition:transform .25s;width:280px}
  #sidebar.open{transform:translateX(0)}
  #sidebar.collapsed{width:280px}
  #sidebar.collapsed .nav-item{justify-content:flex-start;padding:10px 24px;gap:12px;border-left:3px solid transparent;border-radius:0;margin:0}
  #sidebar.collapsed .nav-item span,#sidebar.collapsed .nav-item .nav-badge{display:inline}
  #sidebar.collapsed .nav-group-title{display:block}
  #sidebar.collapsed .sidebar-brand span,.sidebar-brand .sidebar-toggle{display:inline-flex!important}
  #sidebar.collapsed .sidebar-brand{justify-content:flex-start;padding:20px 24px}
  #sidebar.collapsed .sidebar-footer{justify-content:space-between;padding:14px 20px}
  #sidebar.collapsed .sidebar-footer .user-info{display:inline}
  #sidebar.collapsed .sidebar-footer .btn{padding:5px 10px;font-size:13px;width:auto;height:auto}
  #sidebar.collapsed .sidebar-footer .btn::before{content:none}
  #sidebar.collapsed~#mainWrap{margin-left:0!important}
  #mainWrap{margin-left:0!important;padding:12px!important}
  #hamburgerBtn{display:block!important}
  #sidebarOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
  #sidebarOverlay.open{display:block}
  #header{flex-wrap:wrap;gap:8px;padding:12px!important}
  #headerActions{flex-wrap:wrap;gap:6px!important}
  #headerActions .btn{font-size:11px!important;padding:4px 8px!important}
  #headerActions select{font-size:11px!important;padding:3px 6px!important}
  .form-row,.form-row-3{grid-template-columns:1fr!important}
  .grid-2{grid-template-columns:1fr!important}
  .stats-grid{grid-template-columns:1fr 1fr!important}
  .modal{max-width:95vw!important}
  .section{margin-bottom:16px!important}
  .table-responsive{font-size:12px}
  .table-responsive td,.table-responsive th{padding:6px 8px!important}
  .quick-grid{flex-wrap:wrap!important}
  .quick-card{min-width:120px!important}
  .tabs-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap;scrollbar-width:none}
  .tabs-scroll::-webkit-scrollbar{display:none}
  .tabs-scroll button{white-space:nowrap;flex-shrink:0}
}
</style>
</head>
<body>
<div id="loginOverlay">
<div class="login-card" style="width:480px">
<div class="login-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
<h1>Mon Tableau de Bord</h1>
<p class="subtitle">Gestion int&eacute;gr&eacute;e</p>
<div id="loginTabs" style="display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--gray-200)">
<button id="tabLogin" class="btn" style="flex:1;border-bottom:2px solid var(--primary);margin-bottom:-2px;border-radius:0;font-weight:600">Connexion</button>
<button id="tabRegister" class="btn btn-outline" style="flex:1;border:none;border-radius:0;font-weight:600">Inscription</button>

    if (typeof firebase === 'undefined' || !firebase.initializeApp) {
      setTimeout(initFirebase, 200);
      return;
    }
    firebaseApp = firebase.initializeApp(FIREBASE_CONFIG);
    firebaseAuth = firebase.auth();
    firebaseAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    firebaseDb = firebase.firestore();
    firebaseDb.enablePersistence({synchronizeTabs:true}).catch(function(e) {
      if (e.code === 'failed-precondition') console.warn('Persistence failed: multi-tab');

var _receivingSnapshot = false;
var _dirtyKeys = {};
var _pushTimer = null;
var _isPushing = false;

function isSyncable(key) {
  return key !== 'mdb_currentUser' && key.indexOf('mdb_draft_') === -1 && key.indexOf('mdb_sa') !== 0 && key.indexOf('mdb_pending') === -1 && key !== 'mdb_sync_queue';
}

function markDirty(key) {
  if (!isSyncable(key)) return;
  _dirtyKeys[key] = true;
  schedulePush();
}

function schedulePush() {
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(pushToCloud, 300);
}

function pushToCloud() {
  if (!currentUser || !currentUser.id || _receivingSnapshot) return;
  if (currentUser.isSuperAdmin && !currentUser.isImpersonating) return;
  if (_isPushing) return;
  var keys = Object.keys(_dirtyKeys);
  if (keys.length === 0) return;
  if (!firebaseDb) return;
  _isPushing = true;
  var data = {};
  for (var i = 0; i < keys.length; i++) {
    var val = DB.get(keys[i]);
    if (val !== null && val !== undefined) data[keys[i]] = val;
  }
  if (Object.keys(data).length === 0) { _dirtyKeys = {}; _isPushing = false; return; }
  var ind = document.getElementById('syncIndicator');
  if (ind) ind.textContent = '\u21bb Sync...';
  firebaseDb.collection('enterprises').doc(currentUser.id).set(data, {merge:true}).then(function() {
    _dirtyKeys = {};
    _isPushing = false;
    if (ind) ind.textContent = '\u2713 Sync';
    setTimeout(function() { if (ind) ind.textContent = ''; }, 2000);
    try { localStorage.removeItem('mdb_sync_queue'); } catch(e) {}
  }).catch(function(e) {
    _isPushing = false;
    if (ind) ind.textContent = '\u2717 Sync';
    setTimeout(function() { if (ind) ind.textContent = ''; }, 3000);
    console.warn('Sync error:', e);
    try { localStorage.setItem('mdb_sync_queue', JSON.stringify(Object.keys(_dirtyKeys))); } catch(ex) {}
    setTimeout(pushToCloud, 5000);
  });
}

var BACKUP_MAX_VERSIONS = 10;
function getBackupMeta() {
  try { return JSON.parse(localStorage.getItem('mdb_backup_meta')) || []; } catch(e) { return []; }
}
function setBackupMeta(meta) {
  try { localStorage.setItem('mdb_backup_meta', JSON.stringify(meta)); } catch(e) {}
}
function saveLocalBackup(key, data) {
  try {
    var meta = getBackupMeta();
    if (meta.length > 0) {
      var idx = meta[0].index;
      var backup = JSON.parse(localStorage.getItem('mdb_backup_' + idx)) || {};
      backup[key] = data;
      try { localStorage.setItem('mdb_backup_' + idx, JSON.stringify(backup)); } catch(e) {}
    }
  } catch(e) {}
}
function calcBackupSize(backup) {
  try { return new Blob([JSON.stringify(backup)]).size; } catch(e) { return 0; }
}
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' o';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' Ko';
  return (bytes / 1048576).toFixed(1) + ' Mo';
}
function createFullBackup() {
  try {
    var backup = {};
    for (var i = 0; i < DATA_KEYS.length; i++) {
      var val = DB.get(DATA_KEYS[i]);
      if (val !== null && val !== undefined) backup[DATA_KEYS[i]] = val;
    }
    if (Object.keys(backup).length === 0) return;
    var meta = getBackupMeta();
    var used = {};
    for (var m = 0; m < meta.length; m++) used[meta[m].index] = true;
    var freeSlot = -1;
    for (var s = 0; s < BACKUP_MAX_VERSIONS; s++) { if (!used[s]) { freeSlot = s; break; } }
    if (freeSlot === -1) {
      var oldest = meta.pop();
      freeSlot = oldest.index;
    }
    var size = calcBackupSize(backup);
    try { localStorage.setItem('mdb_backup_' + freeSlot, JSON.stringify(backup)); } catch(e) { return; }
    var newEntry = {index: freeSlot, ts: Date.now(), size: size, keys: Object.keys(backup).length};
    meta.unshift(newEntry);
    while (meta.length > BACKUP_MAX_VERSIONS) {
      var rem = meta.pop();
      try { localStorage.removeItem('mdb_backup_' + rem.index); } catch(e) {}
    }
    setBackupMeta(meta);
  } catch(e) {}
}
function restoreFromLocalBackup(slotIndex) {
  try {
    var meta = getBackupMeta();
    var entry = null;
    if (slotIndex !== undefined && slotIndex !== null) {
      for (var i = 0; i < meta.length; i++) { if (meta[i].index === slotIndex) { entry = meta[i]; break; } }
    } else if (meta.length > 0) {
      entry = meta[0];
    }
    if (!entry) { alert('Aucune sauvegarde trouv\u00e9e.'); return; }
    var backup = JSON.parse(localStorage.getItem('mdb_backup_' + entry.index));
    if (!backup) { alert('Donn\u00e9es de sauvegarde introuvables.'); return; }
    var count = 0;
    for (var key in backup) {
      if (backup.hasOwnProperty(key) && DATA_KEYS.indexOf(key) !== -1) {
        DB.set(key, backup[key]);
        count++;
      }
    }
    pushToCloud();
    alert(count + ' cl\u00e9s restaur\u00e9es depuis la sauvegarde du ' + new Date(entry.ts).toLocaleString('fr-FR') + ' (' + formatSize(entry.size) + ')');
  } catch(e) { alert('Erreur restauration: ' + e.message); }
}
function downloadBackup(slotIndex) {
  try {
    var meta = getBackupMeta();
    var entry = null;
    for (var i = 0; i < meta.length; i++) { if (meta[i].index === slotIndex) { entry = meta[i]; break; } }
    if (!entry) { toast('Sauvegarde introuvable', 'error'); return; }
    var backup = JSON.parse(localStorage.getItem('mdb_backup_' + entry.index));
    if (!backup) { toast('Donn\u00e9es introuvables', 'error'); return; }
    var blob = new Blob([JSON.stringify(backup, null, 2)], {type: 'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'backup-mdb-' + new Date(entry.ts).toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('T\u00e9l\u00e9chargement commenc\u00e9');
  } catch(e) { toast('Erreur: ' + e.message, 'error'); }
}
function deleteBackup(slotIndex) {
  if (!confirm('Supprimer cette sauvegarde ?')) return;
  try {
    var meta = getBackupMeta();
    for (var i = 0; i < meta.length; i++) {
      if (meta[i].index === slotIndex) { meta.splice(i, 1); break; }
    }
    setBackupMeta(meta);
    try { localStorage.removeItem('mdb_backup_' + slotIndex); } catch(e) {}
    if (typeof renderEntreprise === 'function') renderEntreprise();
    toast('Sauvegarde supprim\u00e9e');
  } catch(e) { toast('Erreur: ' + e.message, 'error'); }
}
function pushBackupToCloud(slotIndex) {
  if (!currentUser || !currentUser.id || !firebaseDb) { toast('Non connect\u00e9', 'error'); return; }
  try {
    var meta = getBackupMeta();
    var entry = null;
    for (var i = 0; i < meta.length; i++) { if (meta[i].index === slotIndex) { entry = meta[i]; break; } }
    if (!entry) { toast('Sauvegarde introuvable', 'error'); return; }
    var backup = JSON.parse(localStorage.getItem('mdb_backup_' + entry.index));
    if (!backup) { toast('Donn\u00e9es introuvables', 'error'); return; }
    var ts = entry.ts;
    firebaseDb.collection('enterprises').doc(currentUser.id).collection('backups').doc(String(ts)).set({
      data: backup,
      createdAt: new Date(ts).toISOString(),
      size: entry.size,
      keys: entry.keys
    }).then(function() {
      toast('Sauvegarde envoy\u00e9e vers le cloud');
    }).catch(function(e) {
      toast('Erreur cloud: ' + e.message, 'error');
    });
  } catch(e) { toast('Erreur: ' + e.message, 'error'); }
}
function renderBackupManager() {
  var meta = getBackupMeta();
  var html = '<div class="section" style="max-width:800px;margin-top:16px"><div class="section-header"><h3>Sauvegardes automatiques versionn\u00e9es</h3></div><div class="section-body">';
  html += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">';
  html += '<button class="btn btn-primary btn-sm" onclick="createFullBackup();renderEntreprise();toast(\'Sauvegarde cr\u00e9\u00e9e\')">Sauvegarder maintenant</button>';
  html += '<button class="btn btn-outline btn-sm" onclick="renderEntreprise()">Rafra\u00eechir</button>';
  html += '<a href="restaurer.html" class="btn btn-outline btn-sm" target="_blank">Restaurer depuis fichier</a>';
  html += '</div>';
  if (meta.length === 0) {
    html += '<p style="color:var(--gray-400);font-style:italic;padding:20px;text-align:center">Aucune sauvegarde automatique pour le moment. Les sauvegardes sont cr\u00e9\u00e9es automatiquement toutes les 5 minutes, lors de la fermeture de la page, et avant chaque chargement depuis le cloud.</p>';
  } else {
    html += '<div style="overflow-x:auto"><table class="table" style="width:100%"><thead><tr><th>#</th><th>Date</th><th>Taille</th><th>Cl\u00e9s</th><th>Actions</th></tr></thead><tbody>';
    for (var i = 0; i < meta.length; i++) {
      var e = meta[i];
      var d = new Date(e.ts);
      html += '<tr><td>' + (i + 1) + '</td><td>' + d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR') + '</td><td>' + formatSize(e.size) + '</td><td>' + e.keys + '</td><td style="display:flex;gap:4px">';
      html += '<button class="btn btn-sm btn-outline" onclick="restoreFromLocalBackup(' + e.index + ')">Restaurer</button>';
      html += '<button class="btn btn-sm btn-outline" onclick="downloadBackup(' + e.index + ')">T\u00e9l\u00e9charger</button>';
      html += '<button class="btn btn-sm btn-outline" onclick="pushBackupToCloud(' + e.index + ')">Cloud</button>';
      html += '<button class="btn btn-sm" style="background:var(--danger-light);color:var(--danger);border:1px solid var(--danger)" onclick="deleteBackup(' + e.index + ')">Suppr</button>';
      html += '</td></tr>';
    }
    html += '</tbody></table></div>';
  }
  html += '</div></div>';
  return html;
}
function startAutoBackup() {
  if (_autoBackupTimer) return;
  _autoBackupTimer = setInterval(function() {
    if (currentUser && currentUser.id) createFullBackup();
  }, 1800000);
}

};

function escH(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function getDevise() { var e = getEntreprise(); return e.devise || 'FCFA'; }
function fmtMoney(n) {
  if (isNaN(n) || n === null || n === undefined) n = 0;
  var r = Math.round(n);
  var s = String(r);
  var result = '';
  var count = 0;
  for (var i = s.length - 1; i >= 0; i--) {
    if (count > 0 && count % 3 === 0) result = ' ' + result;
    result = s[i] + result;
    count++;
  }
  return result + ' ' + getDevise();
}

function fmtDate(d) {
  if (!d) return '-';
  var parts = d.split('-');
  if (parts.length !== 3) return d;
  var months = ['janv.','f\u00e9vr.','mars','avr.','mai','juin','juil.','ao\u00fbt','sept.','oct.','nov.','d\u00e9c.'];
  return parseInt(parts[2], 10) + ' ' + months[parseInt(parts[1], 10) - 1] + ' ' + parts[0];
}
function fmtDateShort(d) {
  if (!d) return '-';
  var parts = d.split('-');
  if (parts.length !== 3) return d;
  return parseInt(parts[2], 10) + '/' + parseInt(parts[1], 10) + '/' + parts[0];
}

function getToday() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function daysUntil(ds) {
  if (!ds) return Infinity;
  var now = new Date(getToday());
  var target = new Date(ds);
  return Math.ceil((target - now) / (1000 * 60 * 60 * 24));
}

function addDays(ds, n) {
  var d = new Date(ds);
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

          stopRealtimeSync();

          return;
        }
        if (subUid === 'SUPER-ADMIN' && subUserId === 'SUPER-ADMIN') {
          var saNom = DB.get('mdb_saNom') || 'Super Admin';
          currentUser = {id: 'SUPER-ADMIN', nom: saNom, login: 'admin', isSuperAdmin: true, isAdmin: true, sections: {}};
          showApp();
          return;
        }
        var users = DB.get('mdb_users') || [];
        var found = null;
        if (subUid && subUserId) {
          for (var i = 0; i < users.length; i++) {
            if (users[i].id === subUserId) { found = users[i]; break; }
          }
        }
        if (found) {
          currentUser = {id: subUid, nom: found.nom, email: found.email || '', login: found.login, isAdmin: found.isAdmin || false, adminType: found.adminType || (found.isAdmin ? 'admin' : 'user'), deniedPages: found.deniedPages || [], isSuperAdmin: false, sections: found.sections || {}, subUserId: found.id, caisseId: found.caisseId || '', employeeId: found.employeeId || '', caisseCentralisee: found.caisseCentralisee || false};
          _receivingSnapshot = true;
          showApp();
          startRealtimeSync(subUid);
          _receivingSnapshot = false;
        } else {
          stopRealtimeSync();
          showLogin();
        }
      }
    });
  } else {
    var curId = DB.get('mdb_currentUser');
    if (curId) {
      var users = DB.get('mdb_users') || [];
      for (var i = 0; i < users.length; i++) {
        if (users[i].id === curId) { currentUser = users[i]; break; }
      }
    }
    if (currentUser) { showApp(); } else { showLogin(); }
  }
}

    html += '<p id="resetMsg" style="font-size:13px;display:none;margin-bottom:12px"></p>';

function confirmResetPassword(email) {
  var newPass = document.getElementById('resetNewPass').value;
  var newPass2 = document.getElementById('resetNewPass2').value;
  var code = document.getElementById('resetCode').value;
  var msgEl = document.getElementById('resetMsg');
  if (!newPass || newPass.length < 6) { msgEl.textContent = 'Mot de passe min. 6 caract\u00e8res'; msgEl.style.color = 'var(--danger)'; msgEl.style.display = 'block'; return; }
  if (newPass !== newPass2) { msgEl.textContent = 'Les mots de passe ne correspondent pas'; msgEl.style.color = 'var(--danger)'; msgEl.style.display = 'block'; return; }
  if (!code || code.length !== 6) { msgEl.textContent = 'Code invalide (6 chiffres)'; msgEl.style.color = 'var(--danger)'; msgEl.style.display = 'block'; return; }
  var ref = firebaseDb.collection('resetCodes').doc(email.replace(/\./g, '_'));
  ref.get().then(function(doc) {
    if (!doc.exists) { msgEl.textContent = 'Code invalide'; msgEl.style.color = 'var(--danger)'; msgEl.style.display = 'block'; return; }
    var data = doc.data();
    if (data.code !== code) { msgEl.textContent = 'Code incorrect'; msgEl.style.color = 'var(--danger)'; msgEl.style.display = 'block'; return; }
    if (Date.now() > data.expiry) { msgEl.textContent = 'Code expir\u00e9, demandez un nouveau'; msgEl.style.color = 'var(--danger)'; msgEl.style.display = 'block'; return; }
    ref.delete();
    return firebaseAuth.signInWithEmailAndPassword(email, '___dummy___');
  }).then(function(result) {
    if (result && result.user) {
      return result.user.updatePassword(newPass).then(function() {
        msgEl.textContent = 'Mot de passe r\u00e9initialis\u00e9 avec succ\u00e8s !';
        msgEl.style.color = 'var(--success)';
        msgEl.style.display = 'block';
        setTimeout(function() { location.reload(); }, 2000);
      });
    }
  }).catch(function() {
    msgEl.textContent = 'Erreur: le code a \u00e9t\u00e9 valid\u00e9 mais le changement a \u00e9chou\u00e9. Connectez-vous normalement.';
    msgEl.style.color = 'var(--warning)';
    msgEl.style.display = 'block';
  });
}

function doFirebaseRegister() {
  window._registrationInProgress = false;
  var entId = document.getElementById('regEntId').value.trim().toLowerCase();

  if (!entId) { errEl.textContent = 'Veuillez choisir un identifiant pour votre entreprise'; errEl.style.display = 'block'; return; }
  if (!nom || !pass) { errEl.textContent = 'Veuillez remplir les champs obligatoires'; errEl.style.display = 'block'; return; }
  if (pass.length < 6) { errEl.textContent = 'Le mot de passe doit contenir au moins 6 caract\u00e8res'; errEl.style.display = 'block'; return; }
  if (pass !== pass2) { errEl.textContent = 'Les mots de passe ne correspondent pas'; errEl.style.display = 'block'; return; }
  if (!firebaseAuth) { errEl.textContent = 'Firebase non disponible'; errEl.style.display = 'block'; return; }
  errEl.textContent = 'V\u00e9rification de l\'identifiant...';
  errEl.style.color = 'var(--primary)';
  errEl.style.display = 'block';
  var validatedPlan = plan;
  var validatedStatus = (plan === 'basic' ? 'essai' : 'active');
  var validatedLicence = '';
  var isReferral = false;
  var checkLicence = function() {
    if (!licenceCode) return Promise.resolve(true);
    if (licenceCode === 'MDB-DEV-2024' || licenceCode === 'MDB-PROPRIETAIRE-2024') {
      validatedPlan = 'enterprise';
      validatedStatus = 'lifetime';
      isReferral = true;
      validatedLicence = licenceCode;
      return Promise.resolve(true);
    }
    return firebaseDb.collection('licenseKeys').doc(licenceCode).get().then(function(doc) {
      if (!doc.exists) { errEl.textContent = 'Cl\u00e9 de licence invalide'; errEl.style.color = 'var(--danger)'; errEl.style.display = 'block'; return false; }
      var d = doc.data();
      if (d.used) { errEl.textContent = 'Cette cl\u00e9 a d\u00e9j\u00e0 \u00e9t\u00e9 utilis\u00e9e'; errEl.style.color = 'var(--danger)'; errEl.style.display = 'block'; return false; }
      validatedPlan = d.plan || plan;
      validatedStatus = d.isReferral ? 'lifetime' : 'active';
      isReferral = d.isReferral || false;
      validatedLicence = licenceCode;
      return true;
    });
  };
  errEl.textContent = 'V\u00e9rification de l\'identifiant...';
  Promise.all([
    checkLicence(),
    firebaseDb.collection('enterpriseIndex').doc(entId).get()
  ]).then(function(results) {
    if (!results[0]) return;
    if (results[1].exists) {
      errEl.style.color = 'var(--danger)';
      suggestFreeIds(entId);
      errEl.textContent = 'Cet identifiant est d\u00e9j\u00e0 utilis\u00e9. Suggestions ci-dessus.';
      errEl.style.display = 'block';
      return;
    }
    errEl.textContent = 'Cr\u00e9ation du compte Firebase...';
    window._registrationInProgress = true;
    var fbEmail = email || (entId.replace(/[^a-z0-9]/gi, '_') + '@mdb.app');
    firebaseAuth.createUserWithEmailAndPassword(fbEmail, pass).then(function(cred) {
      errEl.textContent = 'Enregistrement des donn\u00e9es...';
      return cred.user.updateProfile({displayName: nom}).then(function() {
        var enterpriseData = {
          identifiant: entId, nom: nom, email: email, telephone: tel, plan: validatedPlan,
          dateCreation: getToday(),
          subscription: {status: validatedStatus, plan: validatedPlan, startDate: getToday(), endDate: '', paymentMethod: validatedLicence ? 'licence' : '', licenceKey: validatedLicence},
          adresse: '', siret: '', nui: '', rc: '', rcs: '', formeJuridique: '', regimeFiscal: '', banque: '', rib: ''
        };
        return firebaseDb.collection('enterprises').doc(cred.user.uid).set(enterpriseData).then(function() {
          if (validatedLicence && validatedLicence !== 'MDB-DEV-2024' && validatedLicence !== 'MDB-PROPRIETAIRE-2024') {
            firebaseDb.collection('licenseKeys').doc(validatedLicence).update({used: true, usedBy: cred.user.uid, usedAt: getToday()}).catch(function(){});
          }
          var users = [{id: DB.genId(), nom: 'Administrateur', login: entId, email: email || (entId + '@mdb.app'), password: pass, isAdmin: true, sections: {}}];
          return firebaseDb.collection('enterprises').doc(cred.user.uid).set({mdb_users: users}, {merge: true}).then(function() {
            return firebaseDb.collection('enterpriseIndex').doc(entId).set({uid: cred.user.uid, email: email, nom: nom});
          });
        });
      });
    }).then(function() {
      errEl.textContent = 'Connexion en cours...';
      var normEntId = entId.toUpperCase().replace(/[\s_]/g, '-');
      return firebaseDb.collection('enterprises').doc(firebaseAuth.currentUser.uid).get().then(function(doc) {
        if (!doc.exists) { errEl.textContent = 'Donn\u00e9es introuvables. Reconnectez-vous.'; errEl.style.display = 'block'; return; }
        var cloudData = doc.data();
        var users = cloudData['mdb_users'] || [];
        var found = null;
        for (var i = 0; i < users.length; i++) {
          if (users[i].login === entId || users[i].login.toLowerCase() === entId.toLowerCase()) { found = users[i]; break; }
        }
        if (!found && users.length > 0) { found = users[0]; }
        if (!found) { errEl.textContent = 'Utilisateur introuvable. Reconnectez-vous.'; errEl.style.color = 'var(--danger)'; errEl.style.display = 'block'; return; }
        for (var k = 0; k < DATA_KEYS.length; k++) {
          var key = DATA_KEYS[k];
          var val = cloudData[key];
          if (key === 'mdb_actif') {
            DB.set(key, (val && val.rubriques) ? val : {rubriques:[]});
          } else {
            DB.set(key, (val !== undefined && val !== null) ? val : []);
          }
        }
        currentUser = {id: firebaseAuth.currentUser.uid, nom: found.nom || nom, email: found.email || email, login: found.login, isAdmin: found.isAdmin || false, isSuperAdmin: false, sections: found.sections || {}, subUserId: found.id};
        DB.set('mdb_currentUser', found.id);
        DB.set('mdb_enterpriseUid', firebaseAuth.currentUser.uid);
        errEl.style.display = 'none';
        _receivingSnapshot = true;
        showApp();
        startRealtimeSync(firebaseAuth.currentUser.uid);
        _receivingSnapshot = false;
        window._registrationInProgress = false;
      });
    }).catch(function(error) {
      window._registrationInProgress = false;
      errEl.style.color = 'var(--danger)';
      var msg = 'Erreur lors de l\'inscription';
      if (error.code === 'auth/email-already-in-use') msg = 'Cet email est d\u00e9j\u00e0 utilis\u00e9 par une ancienne entreprise. Connectez-vous en SUPER-ADMIN, allez dans Entreprises, trouvez-la et g\u00e9n\u00e9rez un identifiant.';

      else if (error.code === 'auth/weak-password') msg = 'Mot de passe trop faible';
      else if (error.code === 'auth/too-many-requests') msg = 'Trop de tentatives. Attendez quelques minutes.';
      else msg = error.message;
      errEl.textContent = msg;
      errEl.style.display = 'block';
    });
  }).catch(function(error) {

    errEl.style.color = 'var(--danger)';
    errEl.textContent = 'Erreur de v\u00e9rification : ' + (error.message || 'r\u00e9seau');
    errEl.style.display = 'block';
  });

function suggestFreeIds(busyId) {
  var status = document.getElementById('regIdStatus');
  var suggestions = [];
  var num = parseInt(busyId, 10);
  if (!isNaN(num)) {
    for (var i = 1; i <= 5; i++) suggestions.push(String(num + i));
  } else {
    suggestions.push(busyId + '1');
    suggestions.push(busyId + '2');
    suggestions.push(busyId + '_1');
    suggestions.push(busyId + '_2');
  }
  var html = 'Identifiant d\u00e9j\u00e0 pris. Suggestions : ';
  for (var j = 0; j < suggestions.length; j++) {
    html += '<a href="#" onclick="document.getElementById(\'regEntId\').value=\'' + suggestions[j] + '\';checkEntIdAvailability(true);return false" style="color:var(--primary);font-weight:600">' + suggestions[j] + '</a>';
    if (j < suggestions.length - 1) html += ', ';
  }
  status.style.color = 'var(--danger)';
  status.innerHTML = html;
  status.style.display = 'block';
}

      currentUser = null;

function mergeArraysById(local, cloud) {
  if (!Array.isArray(local) || local.length === 0) return cloud;
  if (!Array.isArray(cloud) || cloud.length === 0) return local;
  var map = {};
  var i;
  for (i = 0; i < cloud.length; i++) {

function updateDetteFournisseur(fournisseurId, fournisseurNom, montantPaiement, charge) {

    dettes[idx].solde = Math.max(0, (dettes[idx].montant || 0) - (dettes[idx].payee || 0));
    dettes[idx].dernierMvt = date;
    dettes[idx].dernierPiece = piece;
  } else {
    dettes.push({
      id: DB.genId(),

      payee: montantPaiement,

function getFournisseurCompte(fournisseurId) {
  var ops = getOperationsCaisse();
  var dettes = getDettesFournisseurs();
  var operations = [];
  for (var i = 0; i < ops.length; i++) {
    var o = ops[i];
    if (o.beneficiaireType !== 'fournisseur' || o.beneficiaireId !== fournisseurId) continue;
    if (o.linkedOpId && o.libelle && o.libelle.indexOf('Frais') === 0) continue; /* skip old linked fee entries */
    /* Merge charge + paiement from same op into one line */
    var chargeVal = (o.montantCharge && o.montantCharge > 0) ? o.montantCharge : 0;
    var paiementVal = (o.montant && o.montant > 0) ? o.montant : 0;
    if (chargeVal > 0 || paiementVal > 0) {
      operations.push({date: o.date, libelle: o.libelle, charge: chargeVal, montant: paiementVal, source: 'caisse', observations: o.observations || '', remettant: o.remettant || '', numeroPiece: o.numeroPiece || ''});
    }
  }
  for (var j = 0; j < dettes.length; j++) {
    var d = dettes[j];
    if (d.fournisseurId !== fournisseurId) continue;
    operations.push({date: d.date, libelle: d.description || 'Dette', charge: d.montant || 0, montant: 0, source: 'dette', observations: d.observations || ''});
  }
  operations.sort(function(a, b) { return (a.date || '').localeCompare(b.date || ''); });
  return operations;
}

function inlineMontant(tableId, rowId, field, currentValue) {

  var inp = cell.querySelector('input');
  if (inp) { inp.focus(); inp.select(); }
}

function handleInlineEdit(e, tableId, rowId, field) {
  if (e.key === 'Enter') {
    var val = parseFloat(e.target.value) || 0;
    saveInlineEdit(tableId, rowId, field, val);
  } else if (e.key === 'Escape') {
    cancelInlineEdit(e.target, tableId, rowId, field, 0);
  }
}

function cancelInlineEdit(el, tableId, rowId, field, originalVal) {

    renderFournisseurs();
  } else if (tableId === 'regReglements') {
    var regs = getReglements();

    }
    DB.set('mdb_reglements', regs);
    renderTresorerie();
  } else if (tableId === 'nomArticles') {
    var arts = getArticles();
    for (var i = 0; i < arts.length; i++) {
      if (arts[i].id === rowId) {
        if (!arts[i].prixPeriodes) arts[i].prixPeriodes = [];
        if (arts[i].prixPeriodes.length > 0) {
          arts[i].prixPeriodes[arts[i].prixPeriodes.length - 1].prixUnitaire = val;

          arts[i].prixPeriodes.push({dateDebut:'2000-01-01', dateFin:'2099-12-31', prixUnitaire:val});

function getPrixForDate(article, dateStr) {
  if (!article || !article.prixPeriodes || article.prixPeriodes.length === 0) return 0;
  var d = dateStr || getToday();
  for (var i = 0; i < article.prixPeriodes.length; i++) {
    var p = article.prixPeriodes[i];
    if (d >= p.dateDebut && d <= p.dateFin) return p.prixUnitaire;
  }
  return article.prixPeriodes[article.prixPeriodes.length - 1].prixUnitaire;
}

function toggleBCLineDetail(rowId) {

function toggleBCDetail(bcId) {
  var detail = document.getElementById('bcDetail_' + bcId);
  var arrow = document.getElementById('bcArrow_' + bcId);
  if (!detail) return;
  var isOpen = detail.style.display !== 'none';
  detail.style.display = isOpen ? 'none' : '';
  if (arrow) arrow.style.transform = isOpen ? 'rotate(-90deg)' : 'rotate(0deg)';

function filterBC() {
  var q = (document.getElementById('bcSearch').value || '').toLowerCase();
  var fs = document.getElementById('bcFilterStatut').value;
  var ft = document.getElementById('bcFilterType') ? document.getElementById('bcFilterType').value : '';
  var sections = document.getElementById('bcBody').querySelectorAll('.section');
  for (var i = 0; i < sections.length; i++) {
    var s = sections[i].getAttribute('data-search') || '';
    var st = sections[i].getAttribute('data-statut') || '';
    var tp = sections[i].getAttribute('data-type') || '';
    var show = s.indexOf(q) !== -1;
    if (fs) show = show && st === fs;
    if (ft) show = show && tp === ft;
    sections[i].style.display = show ? '' : 'none';
  }
}

function saveBC(id) {
  var clientId = document.getElementById('bcClient').value;
  if (!clientId) { toast('Veuillez s\u00e9lectionner un client', 'error'); return; }
  if (!formLignes || formLignes.length === 0) { toast('Un BC doit avoir au moins un article', 'error'); return; }
  var data = {
    numero: document.getElementById('bcNumero').value.trim(),
    clientId: clientId, dateBC: document.getElementById('bcDate').value,
    delaiLivraison: parseInt(document.getElementById('bcDelai').value) || 30,
    statut: document.getElementById('bcStatut').value,
    tvaActive: document.getElementById('bcTvaActive').value === '1',
    tauxTva: parseFloat(document.getElementById('bcTaux').value) || 18,
    observations: document.getElementById('bcObs').value.trim(),
    lignes: formLignes.slice()
  };
  var bcs = getBCs();
  if (id) {
    for (var i = 0; i < bcs.length; i++) {
      if (bcs[i].id === id) { data.id = id; data.dateCreation = bcs[i].dateCreation; bcs[i] = data; break; }
    }
  } else {
    data.id = DB.genId(); data.dateCreation = getToday(); bcs.push(data);
  }
  DB.set('mdb_bc', bcs);
  closeModal();
  clearDraft('bc');
  toast('BC enregistr\u00e9');
  renderBC();
  buildSidebar();
}

function deleteBC(id) {
  var bcs = getBCs(); var bc = null;
  for (var i = 0; i < bcs.length; i++) { if (bcs[i].id === id) { bc = bcs[i]; break; } }
  if (!bc) return;
  var bls = getBLs();
  for (var j = 0; j < bls.length; j++) { if (bls[j].bcId === id) { toast('Impossible de supprimer : ce BC a des BLs li\u00e9s. Archivez-le ou supprimez les BLs d\'abord.', 'error'); return; } }
  var facs = getFactures();
  for (var k = 0; k < facs.length; k++) {
    if (facs[k].lignes) {
      for (var l = 0; l < facs[k].lignes.length; l++) {
        if (facs[k].lignes[l].bcId === id) { toast('Impossible de supprimer : ce BC est utilis\u00e9 dans des factures.', 'error'); return; }
      }
    }
  }
  openConfirm('\u00cates-vous s\u00fbr de vouloir supprimer ce BC ?', function() {
    var result = [];
    for (var m = 0; m < bcs.length; m++) { if (bcs[m].id !== id) result.push(bcs[m]); }
    DB.set('mdb_bc', result);
    toast('BC supprim\u00e9');
    renderBC();
    buildSidebar();
  });
}

function archiveBC(id) {
  var bcs = getBCs(); var bc = null;
  for (var i = 0; i < bcs.length; i++) { if (bcs[i].id === id) { bc = bcs[i]; break; } }
  if (!bc) return;
  var reason = prompt('Indiquez la raison de l\'abandon de ce BC :');
  if (reason === null) return;
  if (!reason.trim()) { toast('Veuillez indiquer une raison', 'error'); return; }
  for (var j = 0; j < bcs.length; j++) {
    if (bcs[j].id === id) {
      bcs[j].statut = 'annule';
      bcs[j].raisonAnnulation = reason.trim();
      bcs[j].dateAnnulation = getToday();
      break;
    }
  }
  DB.set('mdb_bc', bcs);
  toast('BC abandonn\u00e9 et archiv\u00e9');
  renderBC();
}

function getBCsForClient(clientId) {
  var bcs = getBCs();
  var result = [];
  for (var i = 0; i < bcs.length; i++) {
    if (bcs[i].clientId === clientId && bcs[i].statut !== 'annule') result.push(bcs[i]);
  }
  return result;
}
function getBLsForBC(bcId) {
  var bls = getBLs();
  var result = [];
  for (var i = 0; i < bls.length; i++) {
    if (bls[i].bcId === bcId) result.push(bls[i]);
  }
  return result;
}
function getUnlinkedBLs(clientId) {
  var bls = getBLs();
  var result = [];
  for (var i = 0; i < bls.length; i++) {
    if (bls[i].clientId === clientId && !bls[i].factureId) result.push(bls[i]);
  }
  return result;
}

function getNumero(prefix) {
  var maxNum = 0;
  var items = [];
  if (prefix === 'BC') items = getBCs();
  else if (prefix === 'BL') items = getBLs();
  else if (prefix === 'FAC') items = getFactures();
  for (var i = 0; i < items.length; i++) {
    var num = items[i].numero || '';
    var idx = num.lastIndexOf('-');
    if (idx !== -1) {
      var part = num.substring(idx + 1);
      var n = parseInt(part, 10);
      if (!isNaN(n) && n > maxNum) maxNum = n;
    }
  }
  return prefix + '-' + String(maxNum + 1).padStart(3, '0');
}

function addFormLigne() {
  formLignes.push({articleId:'', designation:'', quantite:1, prixUnitaire:0});
  renderFormLignes();
}

function removeFormLigne(idx) {

function onArticleCodeInput(idx, code) {
  code = code.trim();
  if (!code) { formLignes[idx].articleId = ''; formLignes[idx].designation = ''; formLignes[idx].prixUnitaire = 0; renderFormLignes(); return; }
  var articles = getArticles();
  var art = null;
  for (var i = 0; i < articles.length; i++) { if (articles[i].code === code || articles[i].code.toLowerCase() === code.toLowerCase()) { art = articles[i]; break; } }

function showArticleCodeDropdown(inputEl, idx) {
  var existing = document.getElementById('artDropdown_' + idx);
  if (existing) existing.remove();
  var articles = getArticles();
  var wrapper = document.createElement('div');
  wrapper.id = 'artDropdown_' + idx;
  wrapper.style.cssText = 'display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);box-shadow:var(--shadow-md);max-height:200px;overflow-y:auto;z-index:1000';
  var q = (inputEl.value || '').toLowerCase().trim();
  var count = 0;
  for (var i = 0; i < articles.length; i++) {
    if (articles[i].commercialise === false) continue;
    if (q && (articles[i].code || '').toLowerCase().indexOf(q) === -1 && (articles[i].designation || '').toLowerCase().indexOf(q) === -1) continue;
    var item = document.createElement('div');
    item.style.cssText = 'padding:6px 10px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--gray-100)';
    item.textContent = articles[i].code + ' - ' + articles[i].designation;
    item.setAttribute('data-code', articles[i].code);
    item.onmouseenter = function(){ this.style.background = 'var(--primary-light)'; };
    item.onmouseleave = function(){ this.style.background = '#fff'; };
    (function(artCode){ item.onclick = function(){ inputEl.value = artCode; onArticleCodeInput(idx, artCode); wrapper.style.display = 'none'; }; })(articles[i].code);
    wrapper.appendChild(item);
    count++;

function onFacLineBLChange(idx, blId) {
  formLignes[idx].blId = blId || '';
  if (blId) {
    var bls = getBLs();
    for (var i = 0; i < bls.length; i++) {
      if (bls[i].id === blId && bls[i].lignes && bls[i].lignes.length > 0) {
        var bl = bls[i];
        var existingArticles = [];
        for (var j = 0; j < formLignes.length; j++) {
          if (formLignes[j].blId === blId && formLignes[j].articleId) existingArticles.push(formLignes[j].articleId);
        }
        for (var k = 0; k < bl.lignes.length; k++) {
          var found = false;
          for (var m = 0; m < existingArticles.length; m++) {
            if (existingArticles[m] === bl.lignes[k].articleId) { found = true; break; }
          }
          if (!found) {
            formLignes.push({
              articleId: bl.lignes[k].articleId || '',
              designation: bl.lignes[k].designation || '',
              quantite: bl.lignes[k].quantite || 1,
              prixUnitaire: bl.lignes[k].prixUnitaire || 0,
              bcId: bl.bcId || '',
              blId: blId
            });
          }
        }
        break;
      }
    }
  }
  renderFormLignes();
}

  uTaches = uTaches.slice(0, 5);

  for (var u = 0; u < uTaches.length; u++) {

  // TVA

  // === PR\u00c9VISION DETAIL BOX ===
  var previsions = getPrevisions();
  var pvEnCours = [], pvAnnule = [];
  for (var pvi = 0; pvi < previsions.length; pvi++) {

      for (var pvj = 0; pvj < Math.min(pvEnCours.length, 5); pvj++) {

    html += '</tbody></table></div></div>';
  }

  var prefins = getPrefinancements();
  var pfActifs = [];
  for (var pi = 0; pi < prefins.length; pi++) {
    if (prefins[pi].statut === 'approuve') pfActifs.push(prefins[pi]);
  }
  if (pfActifs.length > 0) {
    var totalFinance = 0, totalRembourse = 0, totalReserveIndispo = 0, totalReserveDispo = 0;
    for (var pf = 0; pf < pfActifs.length; pf++) {

    html += '<div class="dash-section" data-sub="dashboard.prefinancement" style="margin-top:20px">';
    html += '<div class="section-header" style="display:flex;justify-content:space-between;align-items:center"><h3>&#x1F4B5; Pr\u00e9-financements actifs</h3>';
    html += '<button class="btn btn-sm btn-primary" onclick="navigateTo(\'prefinancement\')" style="font-size:12px">Voir tout</button></div>';
    html += '<div class="stats-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">';
    html += '<div class="stat-card"><div class="stat-info"><div class="stat-value">' + fmtMoney(totalFinance) + '</div><div class="stat-label">Montant financ\u00e9</div></div></div>';
    html += '<div class="stat-card"><div class="stat-info"><div class="stat-value" style="color:var(--success)">' + fmtMoney(totalRembourse) + '</div><div class="stat-label">D\u00e9j\u00e0 rembours\u00e9</div></div></div>';
    html += '<div class="stat-card"><div class="stat-info"><div class="stat-value" style="color:var(--warning)">' + fmtMoney(totalReserveIndispo) + '</div><div class="stat-label">R\u00e9serve indisponible</div></div></div>';
    html += '<div class="stat-card"><div class="stat-info"><div class="stat-value" style="color:var(--success)">' + fmtMoney(totalReserveDispo) + '</div><div class="stat-label">R\u00e9serve disponible</div></div></div>';
    html += '</div>';
    html += '<div class="table-responsive"><table><thead><tr><th>Client</th><th>BC</th><th>Financ\u00e9</th><th>Rembours\u00e9</th><th>Reste</th><th>R\u00e9s. indispo</th><th>R\u00e9s. dispo</th><th>\u00c9ch\u00e9ance</th><th>Jours restants</th><th>Statut</th></tr></thead><tbody>';
    for (var pj = 0; pj < pfActifs.length; pj++) {
      var pf2 = pfActifs[pj];
      var clPf = getClientById(pf2.clientId);
      var bcPf = '-';
      if (pf2.bcId) { var bcObjPf = getBCById(pf2.bcId); bcPf = bcObjPf ? bcObjPf.numero : '-'; }
      var mA2 = pf2.montantAccorde || 0;
      var mR2 = pf2.montantRembourse || 0;
      var reste2 = Math.max(0, mA2 - mR2);
      var rI2 = Math.round(mA2 * 0.10);
      var rD2 = 0;
      if (mA2 > 0 && mR2 >= mA2) rD2 = rI2;
      else if (mA2 > 0 && mR2 > 0) rD2 = Math.round(rI2 * mR2 / mA2);
      var echDate = pf2.echeanceRemboursement || '';
      var daysLeft = echDate ? daysUntil(echDate) : 999;
      var totalDays = pf2.dureeMois ? pf2.dureeMois * 30 : 180;
      var ratio = daysLeft < 0 ? 0 : (daysLeft / totalDays);
      var statutColor = ratio > 0.5 ? 'var(--success)' : (ratio > 0.25 ? 'var(--warning)' : 'var(--danger)');
      var statutLabel = daysLeft < 0 ? 'Retard' : daysLeft + 'j';
      html += '<tr style="cursor:pointer" onclick="navigateTo(\'prefinancement\')">';
      html += '<td class="fw-600">' + escH(clPf ? clPf.nom : '-') + '</td>';
      html += '<td>' + escH(bcPf) + '</td>';
      html += '<td class="fw-600">' + fmtMoney(mA2) + '</td>';
      html += '<td style="color:var(--success)">' + fmtMoney(mR2) + '</td>';
      html += '<td class="fw-600" style="color:' + (reste2 > 0 ? 'var(--danger)' : 'var(--success)') + '">' + fmtMoney(reste2) + '</td>';
      html += '<td style="color:var(--warning);font-weight:600">' + fmtMoney(rI2) + '</td>';
      html += '<td style="color:' + (rD2 > 0 ? 'var(--success)' : 'var(--gray-400)') + ';font-weight:600">' + fmtMoney(rD2) + '</td>';
      html += '<td>' + fmtDate(echDate) + '</td>';
      html += '<td style="font-weight:600;color:' + statutColor + '">' + statutLabel + '</td>';
      html += '<td><span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:' + statutColor + '"><span style="width:8px;height:8px;border-radius:50%;background:' + statutColor + ';display:inline-block"></span>' + (daysLeft < 0 ? 'En retard' : 'OK') + '</span></td>';
      html += '</tr>';
    }
    html += '</tbody></table></div></div>';
  }

  document.getElementById('content').innerHTML = html;
}
function togglePinClient(cb) {

  var pinned = DB.get('mdb_pinnedClients') || [];
  if (cb.checked) { if (pinned.indexOf(clientId) === -1) pinned.push(clientId); }
  else { var np = []; for (var i = 0; i < pinned.length; i++) { if (pinned[i] !== clientId) np.push(pinned[i]); } pinned = np; }
  DB.set('mdb_pinnedClients', pinned);
  renderDashboard();
}

function renderTiersComptes(el) {

    html += '<div class="stat-card"><div class="stat-icon" style="background:var(--success-light);color:var(--success)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><div class="stat-info"><div class="stat-value">' + fmtMoney(totalRegle) + '</div><div class="stat-label">Total r\u00e9gl\u00e9</div></div></div>';
    html += '<div class="stat-card"><div class="stat-icon" style="background:var(--warning-light);color:var(--warning)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-info"><div class="stat-value">' + fmtMoney(Math.max(0, totalFacture - totalRegle)) + '</div><div class="stat-label">Solde d\u00fb</div></div></div>';
    html += '</div>';
    html += '<div class="section"><div class="section-header"><h3>Extrait de compte par client</h3></div><div class="section-body"><div class="table-wrap"><div class="table-responsive"><table><thead><tr><th>Client</th><th style="text-align:right">Total factur\u00e9</th><th style="text-align:right">Total r\u00e9gl\u00e9</th><th style="text-align:right">Solde</th><th style="width:80px"></th></tr></thead><tbody>';
    var clientStats = {};
    for (var i = 0; i < factures.length; i++) {
      var cid = factures[i].clientId || '';
      if (!clientStats[cid]) clientStats[cid] = {facture:0, paid:0};
      clientStats[cid].facture += (factures[i].total || 0);
    }
    for (var i = 0; i < reglements.length; i++) {
      var cid2 = reglements[i].clientId || '';
      if (!clientStats[cid2]) clientStats[cid2] = {facture:0, paid:0};
      clientStats[cid2].paid += (reglements[i].montant || 0);
    }
    var clientMap = {};
    for (var i = 0; i < clients.length; i++) clientMap[clients[i].id] = clients[i].nom;
    var hasStats = false;
    for (var cid3 in clientStats) {

      var st = clientStats[cid3];

    html += '</tbody></table></div></div></div></div>';
  } else if (filter === 'fournisseurs') {

    for (var i = 0; i < ops.length; i++) { if (ops[i].beneficiaireType === 'fournisseur') totalPayeCaisse += ops[i].montant || 0; }
    html += '<div class="stats-grid">';
    html += '<div class="stat-card"><div class="stat-icon" style="background:var(--danger-light);color:var(--danger)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg></div><div class="stat-info"><div class="stat-value">' + fmtMoney(totalDettes) + '</div><div class="stat-label">Total dettes</div></div></div>';
    html += '<div class="stat-card"><div class="stat-icon" style="background:var(--success-light);color:var(--success)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><div class="stat-info"><div class="stat-value">' + fmtMoney(totalPayeCaisse) + '</div><div class="stat-label">Pay\u00e9 via caisse</div></div></div>';

    html += '<div class="section"><div class="section-header"><h3>Dettes par fournisseur</h3></div><div class="section-body"><div class="table-wrap"><div class="table-responsive"><table><thead><tr><th>Fournisseur</th><th style="text-align:right">Total dettes</th><th style="text-align:right">Total pay\u00e9</th><th style="text-align:right">Solde</th><th style="width:80px"></th></tr></thead><tbody>';

    if (!hasF) html += '<tr><td colspan="5" class="text-center text-muted">Aucune donn\u00e9e</td></tr>';
    html += '</tbody></table></div></div></div></div>';
  } else if (filter === 'soldes') {
    var previsions2 = getPrevisions();
    var allParties = {};
    for (var si = 0; si < factures.length; si++) {
      var fc = factures[si].clientId || '';

    for (var si3 = 0; si3 < previsions2.length; si3++) {

      if (!allParties[pc]) allParties[pc] = {nom:'', factures:0, previsions:0};

    html += '<div class="stat-card"><div class="stat-info"><div class="stat-value" style="color:var(--danger)">' + fmtMoney(Math.max(0, totalFact)) + '</div><div class="stat-label">Cr\u00e9ances factures</div></div></div>';
    html += '<div class="stat-card"><div class="stat-info"><div class="stat-value" style="color:var(--purple)">' + fmtMoney(totalPV) + '</div><div class="stat-label">Pr\u00e9visions</div></div></div>';
    html += '<div class="stat-card" style="border:2px solid var(--primary)"><div class="stat-info"><div class="stat-value" style="color:var(--primary)">' + fmtMoney(Math.max(0, totalFact) + totalPV) + '</div><div class="stat-label" style="font-weight:600">Total comptable</div></div></div>';
    html += '</div>';
    html += '<div class="section"><div class="section-header"><h3>Soldes comptables par client</h3></div><div class="section-body"><div class="table-wrap"><div class="table-responsive"><table><thead><tr><th>Client</th><th style="text-align:right">Cr\u00e9ances factures</th><th style="text-align:right">Pr\u00e9visions</th><th style="text-align:right">Solde total</th></tr></thead><tbody>';
    var hasS = false;

      html += '<td class="text-right" style="color:var(--purple)">' + fmtMoney(sp.previsions) + '</td>';
      html += '<td class="text-right fw-600" style="color:var(--warning)">' + fmtMoney(soldeT) + '</td></tr>';
    }
    if (!hasS) html += '<tr><td colspan="4" class="text-center text-muted">Aucune donn\u00e9e</td></tr>';

    var bcNum = '-';
    if (b.bcId) { var bcObj = getBCById(b.bcId); bcNum = bcObj ? bcObj.numero : '-'; }
    var searchStr = (b.numero + ' ' + (cl ? cl.nom : '') + ' ' + bcNum + ' ' + fmtMoney(blTotal)).toLowerCase();
    var canSelect = !readonly && !b.factureId;
    html += '<tr data-search="' + escH(searchStr) + '" data-facture="' + (b.factureId ? 'facture' : 'non_facture') + '" data-client="' + (b.clientId || '') + '" data-type="' + (cl ? (cl.type || '') : '') + '">';
    if (!readonly) html += '<td>' + (canSelect ? '<input type="checkbox" class="bl-list-select" value="' + b.id + '" data-client="' + (b.clientId || '') + '" onchange="onBLListSelectChange()">' : '') + '</td>';

    html += '<td>' + escH(cl ? cl.nom : '-') + '</td>';
    html += '<td>' + fmtDate(b.dateLivraison) + '</td>';
    html += '<td>' + escH(bcNum) + '</td>';

    if (!readonly) {
      html += '<td><button class="btn-icon" onclick="openBLModal(\'' + b.id + '\')" title="Modifier"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button> ';
      html += '<button class="btn-icon danger" onclick="deleteBL(\'' + b.id + '\')" title="Supprimer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button> ';
      html += '<button class="btn-icon" onclick="printBL(\'' + b.id + '\')" title="Imprimer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></button></td>';

  else document.getElementById('content').innerHTML = html;

function toggleSelectAllBL(checked) {
  var cbs = document.querySelectorAll('.bl-list-select');
  for (var i = 0; i < cbs.length; i++) cbs[i].checked = checked;
  onBLListSelectChange();
}

function onBLListSelectChange() {
  var cbs = document.querySelectorAll('.bl-list-select:checked');
  var wrap = document.getElementById('blFactureBtnWrap');
  var warn = document.getElementById('blFactureWarning');
  var btn = document.getElementById('btnFactureFromBL');
  if (!wrap) return;
  if (cbs.length === 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  wrap.style.alignItems = 'center';
  wrap.style.gap = '8px';
  var clientIds = {};
  for (var i = 0; i < cbs.length; i++) {
    var cid = cbs[i].getAttribute('data-client');
    if (cid) clientIds[cid] = true;
  }
  var keys = [];
  for (var k in clientIds) { if (clientIds.hasOwnProperty(k)) keys.push(k); }
  if (keys.length > 1) {
    warn.style.display = 'inline';
    btn.disabled = true;
    btn.style.opacity = '0.5';
    btn.style.cursor = 'not-allowed';
  } else {
    warn.style.display = 'none';
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.style.cursor = 'pointer';
  }
}

function factureFromBL(blId) {
  var bls = getBLs();
  var bl = null;
  for (var i = 0; i < bls.length; i++) { if (bls[i].id === blId) { bl = bls[i]; break; } }
  if (!bl) { toast('BL introuvable', 'error'); return; }
  var lignes = [];
  if (bl.lignes) {
    for (var k = 0; k < bl.lignes.length; k++) {
      var src = bl.lignes[k];
      lignes.push({articleId:src.articleId||'', designation:src.designation||'', quantite:src.quantite||1, prixUnitaire:src.prixUnitaire||0, bcId:bl.bcId||'', blId:bl.id});
    }
  }
  _prefillFactureData = {clientId: bl.clientId, bcId: bl.bcId || '', lignes: lignes};
  navigateToFacturation('factures');
  setTimeout(function() { openFactureModal(); }, 150);
}

function factureFromBLList() {
  var cbs = document.querySelectorAll('.bl-list-select:checked');
  if (cbs.length === 0) { toast('Veuillez s\u00e9lectionner au moins un BL', 'error'); return; }
  var ids = [];
  var clientIds = {};
  for (var i = 0; i < cbs.length; i++) {
    ids.push(cbs[i].value);
    var cid = cbs[i].getAttribute('data-client');
    if (cid) clientIds[cid] = true;
  }
  var keys = [];
  for (var k in clientIds) { if (clientIds.hasOwnProperty(k)) keys.push(k); }
  if (keys.length > 1) { toast('Impossible : les BL s\u00e9lectionn\u00e9s sont sur des clients diff\u00e9rents', 'error'); return; }
  var bls = getBLs();
  var selectedBLs = [];
  for (var j = 0; j < ids.length; j++) {
    for (var m = 0; m < bls.length; m++) { if (bls[m].id === ids[j]) { selectedBLs.push(bls[m]); break; } }
  }
  var clientId = keys[0];
  var firstBC = selectedBLs.length > 0 ? selectedBLs[0].bcId || '' : '';
  var allLignes = [];
  for (var n = 0; n < selectedBLs.length; n++) {
    if (selectedBLs[n].lignes) {
      for (var p = 0; p < selectedBLs[n].lignes.length; p++) {
        var src = selectedBLs[n].lignes[p];
        allLignes.push({articleId:src.articleId||'', designation:src.designation||'', quantite:src.quantite||1, prixUnitaire:src.prixUnitaire||0, bcId:selectedBLs[n].bcId||'', blId:selectedBLs[n].id});
      }
    }
  }
  _prefillFactureData = {clientId: clientId, bcId: firstBC, blIds: ids, lignes: allLignes};
  navigateToFacturation('factures');
  setTimeout(function() { openFactureModal(); }, 150);
}

function filterBL() {
  var q = (document.getElementById('blSearch').value || '').toLowerCase();
  var ff = document.getElementById('blFilterFacture') ? document.getElementById('blFilterFacture').value : '';
  var ft = document.getElementById('blFilterType') ? document.getElementById('blFilterType').value : '';
  var rows = document.getElementById('blBody').getElementsByTagName('tr');
  for (var i = 0; i < rows.length; i++) {
    var s = rows[i].getAttribute('data-search') || '';
    var sf = rows[i].getAttribute('data-facture') || '';
    var tp = rows[i].getAttribute('data-type') || '';
    var show = s.indexOf(q) !== -1;
    if (ff) show = show && sf === ff;
    if (ft) show = show && tp === ft;
    rows[i].style.display = show ? '' : 'none';
  }
}

function openBLModal(id) {
  var b = null;
  if (id) { var bls = getBLs(); for (var i = 0; i < bls.length; i++) { if (bls[i].id === id) { b = bls[i]; break; } } }
  formLignes = [];
  if (b && b.lignes) {
    for (var j = 0; j < b.lignes.length; j++) {
      var line = b.lignes[j];
      formLignes.push({articleId:line.articleId||'', designation:line.designation||'', quantite:line.quantite||1, prixUnitaire:line.prixUnitaire||0});
    }
  }

  html += '</div>';
  html += '<div class="form-row">';

  var footer = '<button class="btn btn-outline" onclick="closeModal()">Annuler</button>';
  footer += '<button class="btn btn-primary" onclick="saveBL(\'' + (id || '') + '\')">Enregistrer</button>';
  openFormModal(title, html, footer, true);
  populateClientSelect('blClient', b ? b.clientId : '');
  onBLClientChange(b ? b.bcId : '');
  renderFormLignes();
  restoreDraftToForm('bl', !!id);
}

function onBLClientChange(preserveBcId) {
  var clientId = document.getElementById('blClient').value;
  var bcSel = document.getElementById('blBC');
  if (!bcSel) return;
  if (!clientId) { bcSel.innerHTML = '<option value="">-- Aucun BC --</option>'; return; }
  var bcs = getBCs();
  var bcHtml = '<option value="">-- Aucun BC --</option>';
  for (var bi = 0; bi < bcs.length; bi++) {
    if (bcs[bi].clientId !== clientId) continue;
    if (bcs[bi].statut === 'livre' && bcs[bi].id !== preserveBcId) continue;
    var sel = (preserveBcId && bcs[bi].id === preserveBcId) ? ' selected' : '';
    bcHtml += '<option value="' + bcs[bi].id + '"' + sel + '>' + escH(bcs[bi].numero) + '</option>';
  }
  bcSel.innerHTML = bcHtml;
}

function onBLBCChange() {
  var bcId = document.getElementById('blBC').value;
  if (!bcId) return;
  var bc = getBCById(bcId);
  if (!bc || !bc.lignes || bc.lignes.length === 0) return;
  var bls = getBLs();
  var deliveredQty = {};
  for (var di = 0; di < bls.length; di++) {
    if (bls[di].bcId !== bcId || !bls[di].lignes) continue;
    for (var dl = 0; dl < bls[di].lignes.length; dl++) {
      var artKey = bls[di].lignes[dl].articleId || bls[di].lignes[dl].designation || '';
      deliveredQty[artKey] = (deliveredQty[artKey] || 0) + (bls[di].lignes[dl].quantite || 0);
    }
  }
  formLignes = [];
  for (var j = 0; j < bc.lignes.length; j++) {
    var line = bc.lignes[j];
    var artKey2 = line.articleId || line.designation || '';
    var livree = deliveredQty[artKey2] || 0;
    var reste = Math.max(0, (line.quantite || 0) - livree);
    formLignes.push({articleId:line.articleId||'', designation:line.designation||'', quantite:reste, prixUnitaire:line.prixUnitaire||0});
  }
  renderFormLignes();
  toast('Lignes du BC ' + bc.numero + ' charg\u00e9es (quantit\u00e9s restantes)', 'success');
}

function saveBL(id) {
  var clientId = document.getElementById('blClient').value;
  if (!clientId) { toast('Veuillez s\u00e9lectionner un client', 'error'); return; }
  if (!formLignes || formLignes.length === 0) { toast('Un BL doit avoir au moins un article', 'error'); return; }
  // Stock validation
  var stocks = DB.get('mdb_stocks') || [];
  for (var sv = 0; sv < formLignes.length; sv++) {
    if (!formLignes[sv].articleId) continue;
    var stockQte = 0;
    for (var si = 0; si < stocks.length; si++) {
      if (stocks[si].articleId === formLignes[sv].articleId) { stockQte = stocks[si].quantite || 0; break; }
    }
    if (stockQte < (formLignes[sv].quantite || 0)) {
      var artObj = getArticleById(formLignes[sv].articleId);
      toast('Stock insuffisant pour "' + (artObj ? artObj.designation : formLignes[sv].articleId) + '" : disponible ' + stockQte + ', demand\u00e9 ' + formLignes[sv].quantite, 'error');
      return;
    }
  }
  var bls = getBLs();
  var data = {
    numero: document.getElementById('blNumero').value.trim(), clientId: clientId,
    dateLivraison: document.getElementById('blDate').value,
    statut: 'livree', lignes: formLignes.slice(),
    bcId: document.getElementById('blBC').value || null,
    raisonNonFacture: (document.getElementById('blRaisonNonFacture') || {}).value || ''
  };
  if (id) {
    for (var i = 0; i < bls.length; i++) {
      if (bls[i].id === id) { data.id = id; data.factureId = bls[i].factureId; bls[i] = data; break; }
    }
  } else {
    data.id = DB.genId(); data.factureId = null; bls.push(data);
  }
  DB.set('mdb_bl', bls);
  closeModal();
  clearDraft('bl');
  toast('BL enregistr\u00e9');
  renderBL();
  buildSidebar();
}

function deleteBL(id) {
  openConfirm('\u00cates-vous s\u00fbr de vouloir supprimer ce BL ?', function() {
    var bls = getBLs(); var result = [];
    for (var i = 0; i < bls.length; i++) { if (bls[i].id !== id) result.push(bls[i]); }
    DB.set('mdb_bl', result);
    toast('BL supprim\u00e9');
    renderBL();
    buildSidebar();
  });
}

    for (var j = 0; j < bl.lignes.length; j++) {

      total += mt;

  win.document.close();

function renderFactures() {
  var factures = getFactures();

  html += '<button class="btn btn-outline" onclick="exportPDF()">Exporter PDF</button>';
  html += '</div>';
  html += '<div class="table-wrap"><div class="table-responsive"><table><thead><tr><th>Num\u00e9ro</th><th>Client</th><th>\u00c9mission</th><th>\u00c9ch\u00e9ance</th><th>BC</th><th>BL</th><th>Total HT</th><th>TVA</th><th>Total TTC</th><th>Pay\u00e9</th><th>Reste</th><th>Statut</th>';
  if (!readonly) html += '<th style="width:120px">Actions</th>';
  html += '</tr></thead><tbody id="facBody">';
  for (var i = 0; i < factures.length; i++) {
    var f = factures[i];
    var cl = getClientById(f.clientId);
    var restant = (f.totalTTC || f.total || 0) - (f.montantPaye || 0);
    var stBadge = f.statut === 'payee' ? 'badge-success' : (f.statut === 'validee' ? 'badge-primary' : (f.statut === 'partielle' ? 'badge-warning' : 'badge-gray'));
    var searchStr = (f.numero + ' ' + (cl ? cl.nom : '') + ' ' + f.statut).toLowerCase();
    html += '<tr data-search="' + escH(searchStr) + '" data-statut="' + f.statut + '">';
    html += '<td class="fw-600">' + escH(f.numero) + '</td>';
    html += '<td>' + escH(cl ? cl.nom : '-') + '</td>';
    html += '<td>' + fmtDate(f.dateEmission) + '</td>';
    html += '<td>' + fmtDate(f.echeance) + (f.echeance && daysUntil(f.echeance) < 0 && f.statut !== 'payee' ? ' <span class="badge badge-danger">Retard</span>' : '') + '</td>';
