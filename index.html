<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Tableau de Bord</title>
<style>
:root{--primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#dbeafe;--success:#16a34a;--success-light:#dcfce7;--warning:#d97706;--warning-light:#fef3c7;--danger:#dc2626;--danger-light:#fee2e2;--purple:#7c3aed;--purple-light:#ede9fe;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;--gray-900:#111827;--sidebar-w:260px;--sidebar-collapsed-w:60px;--header-h:64px;--radius:8px;--radius-lg:12px;--shadow:0 1px 3px rgba(0,0,0,.1);--shadow-md:0 4px 6px rgba(0,0,0,.1);--shadow-lg:0 10px 15px rgba(0,0,0,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gray-100);color:var(--gray-800);font-size:14px}
#loginOverlay{position:fixed;inset:0;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;z-index:9999}
.login-card{background:#fff;border-radius:var(--radius-lg);padding:40px;width:420px;box-shadow:var(--shadow-lg)}
.login-card h1{text-align:center;margin-bottom:6px;color:var(--gray-900);font-size:22px}
.login-card .subtitle{text-align:center;color:var(--gray-500);margin-bottom:28px;font-size:14px}
.login-card .login-logo{text-align:center;margin-bottom:16px}
.login-card .login-logo svg{width:48px;height:48px;color:var(--primary)}
#sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:var(--gray-900);color:#fff;display:flex;flex-direction:column;z-index:100;overflow:hidden;transition:width .25s ease}
.sidebar-brand{padding:20px 24px;font-size:17px;font-weight:700;border-bottom:1px solid var(--gray-700);display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden}
.sidebar-brand svg{flex-shrink:0}
.sidebar-toggle{background:none;border:none;color:var(--gray-400);cursor:pointer;padding:4px;border-radius:4px;margin-left:auto;flex-shrink:0;transition:color .15s}
.sidebar-toggle:hover{color:#fff}
#sidebarNav{flex:1;overflow-y:auto;padding:8px 0}
.nav-group{margin-bottom:4px}
.nav-group-title{padding:10px 24px 4px;font-size:11px;text-transform:uppercase;color:var(--gray-400);letter-spacing:.06em;font-weight:600;white-space:nowrap;overflow:hidden}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 24px;color:var(--gray-300);cursor:pointer;transition:all .15s;text-decoration:none;font-size:14px;border-left:3px solid transparent;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(37,99,235,.2);color:#fff;border-left-color:var(--primary)}
.nav-item svg{width:20px;height:20px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;font-weight:600;min-width:20px;text-align:center}
.sidebar-footer{padding:14px 20px;border-top:1px solid var(--gray-700);display:flex;align-items:center;justify-content:space-between;overflow:hidden;white-space:nowrap}
.sidebar-footer .user-info{font-size:12px;color:var(--gray-400);overflow:hidden;text-overflow:ellipsis}
#sidebar.collapsed{width:var(--sidebar-collapsed-w)}
#sidebar.collapsed .sidebar-brand span,#sidebar.collapsed .sidebar-brand .sidebar-toggle{display:none}
#sidebar.collapsed .sidebar-brand{justify-content:center;padding:20px 8px}
#sidebar.collapsed .nav-group-title{display:none}
#sidebar.collapsed .nav-item{justify-content:center;padding:12px 0;gap:0;border-left:none;border-radius:var(--radius);margin:2px 8px}
#sidebar.collapsed .nav-item span,#sidebar.collapsed .nav-item .nav-badge{display:none}
#sidebar.collapsed .nav-item:hover{background:rgba(37,99,235,.3)}
#sidebar.collapsed .sidebar-footer{justify-content:center;padding:14px 8px}
#sidebar.collapsed .sidebar-footer .user-info{display:none}
#sidebar.collapsed .sidebar-footer .btn{padding:6px;font-size:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
#sidebar.collapsed .sidebar-footer .btn::before{content:'\2192';font-size:16px}
#sidebar.collapsed~#mainWrap{margin-left:var(--sidebar-collapsed-w)}
#mainWrap{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column;transition:margin-left .25s ease}
#header{height:var(--header-h);background:#fff;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;padding:0 32px;position:sticky;top:0;z-index:50}
#pageTitle{font-size:20px;font-weight:600;color:var(--gray-900)}
#headerActions{margin-left:auto;display:flex;gap:8px}
#content{padding:28px 36px;flex:1}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:28px}
.stat-card{background:#fff;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);display:flex;align-items:flex-start;gap:16px;transition:transform .15s,box-shadow .15s}
.stat-card.clickable{cursor:pointer}
.stat-card.clickable:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.1)}
.stat-card.clickable:active{transform:translateY(0)}
.stat-icon{width:44px;height:44px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-icon svg{width:22px;height:22px}
.stat-info .stat-value{font-size:22px;font-weight:700;color:var(--gray-900)}
.stat-info .stat-label{font-size:13px;color:var(--gray-500);margin-top:2px}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:28px}
.quick-card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;border:2px solid transparent}
.quick-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.1);border-color:var(--primary)}
.quick-card .qc-icon{font-size:28px;margin-bottom:8px}
.quick-card .qc-label{font-size:12px;color:var(--gray-600);font-weight:500}
.quick-card .qc-count{font-size:20px;font-weight:700;color:var(--gray-900)}
.section{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:28px;overflow:hidden}
.section-header{padding:18px 22px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between}
.section-header h3{font-size:16px;font-weight:600;color:var(--gray-800)}
.section-body{padding:22px}
.table-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:24px}
.table-header{padding:16px 20px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.table-header h3{font-size:15px;font-weight:600}
.table-responsive{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 16px;font-size:11px;text-transform:uppercase;color:var(--gray-500);background:var(--gray-50);border-bottom:1px solid var(--gray-200);font-weight:600;white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--gray-100);font-size:13px;vertical-align:middle}
tbody tr:hover{background:var(--gray-50)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:var(--radius);font-size:13px;cursor:pointer;transition:all .15s;font-weight:500;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#15803d}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-warning{background:var(--warning);color:#fff}
.btn-warning:hover{background:#b45309}
.btn-outline{background:transparent;border:1px solid var(--gray-300);color:var(--gray-700)}
.btn-outline:hover{background:var(--gray-50)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:5px;background:transparent;border:none;cursor:pointer;border-radius:var(--radius);color:var(--gray-400);display:inline-flex;align-items:center;justify-content:center}
.btn-icon:hover{background:var(--gray-100);color:var(--gray-700)}
.btn-icon.danger:hover{background:var(--danger-light);color:var(--danger)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--gray-700);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid var(--gray-300);border-radius:var(--radius);font-size:13px;outline:none;font-family:inherit;transition:border .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.form-group textarea{min-height:60px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:650px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal-sm{max-width:420px}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:17px;font-weight:600}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--gray-400);padding:4px;line-height:1}
.modal-close:hover{color:var(--gray-700)}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 20px;border-top:1px solid var(--gray-200);display:flex;justify-content:flex-end;gap:8px}
.badge{display:inline-block;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-success{background:var(--success-light);color:var(--success)}
.badge-warning{background:var(--warning-light);color:var(--warning)}
.badge-danger{background:var(--danger-light);color:var(--danger)}
.badge-purple{background:var(--purple-light);color:var(--purple)}
.badge-primary{background:var(--primary-light);color:var(--primary)}
.badge-gray{background:var(--gray-200);color:var(--gray-600)}
.alerts-bar{border-radius:var(--radius);padding:14px 18px;margin-bottom:28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px}
.alerts-bar.danger{background:var(--danger-light);border:1px solid #fca5a5;color:var(--danger);cursor:pointer;transition:background .15s}
.alerts-bar.danger:hover{background:#fdd}
.alerts-bar svg{flex-shrink:0;width:18px;height:18px}
.dash-welcome{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:var(--radius-lg);padding:24px 28px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.dash-welcome h2{font-size:18px;font-weight:700;margin:0}
.dash-welcome p{font-size:13px;opacity:.85;margin:2px 0 0 0}
.dash-welcome .dash-date{font-size:13px;opacity:.8;text-align:right}
.dash-section{background:#fff;border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);margin-bottom:20px}
.dash-section h3{font-size:15px;font-weight:600;margin:0 0 14px 0;color:var(--gray-800);display:flex;align-items:center;gap:8px}
.dash-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:768px){.dash-grid-2{grid-template-columns:1fr}}
.dash-bar-chart{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:10px}
.dash-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.dash-bar{width:100%;border-radius:4px 4px 0 0;background:var(--primary);transition:height .4s ease;min-height:2px;cursor:pointer}
.dash-bar:hover{background:var(--primary-dark)}
.dash-bar-label{font-size:11px;color:var(--gray-500);white-space:nowrap}
.dash-bar-val{font-size:10px;color:var(--gray-600);font-weight:600}
.dash-donut{width:140px;height:140px;border-radius:50%;position:relative;margin:0 auto}
.dash-donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dash-donut-center .dv{font-size:16px;font-weight:700;color:var(--gray-900)}
.dash-donut-center .dl{font-size:10px;color:var(--gray-500)}
.dash-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;justify-content:center}
.dash-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray-600)}
.dash-legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.dash-timeline{list-style:none;padding:0;margin:0}
.dash-timeline li{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--gray-100);font-size:13px}
.dash-timeline li:last-child{border-bottom:none}
.dash-tl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.dash-tl-time{font-size:11px;color:var(--gray-400);white-space:nowrap}
.dash-tl-text{color:var(--gray-700)}
.dash-tl-text strong{color:var(--gray-900)}
.dash-week-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gray-100);font-size:13px}
.dash-week-row:last-child{border-bottom:none}
.dash-week-label{color:var(--gray-600)}
.dash-week-val{font-weight:600;color:var(--gray-800)}
#toastContainer{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 20px;border-radius:var(--radius);color:#fff;font-size:13px;box-shadow:var(--shadow-md);animation:toastIn .3s;min-width:260px;pointer-events:auto}
.toast-success{background:var(--success)}
.toast-error{background:var(--danger)}
.toast-warning{background:var(--warning)}
@keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.toolbar input,.toolbar select{padding:7px 12px;border:1px solid var(--gray-300);border-radius:var(--radius);font-size:13px;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--primary)}
.toolbar label{font-size:13px;color:var(--gray-600);font-weight:500}
.empty-state{text-align:center;padding:40px 20px;color:var(--gray-400)}
.empty-state svg{width:48px;height:48px;margin-bottom:12px;opacity:.5}
.text-right{text-align:right}
.text-center{text-align:center}
.text-muted{color:var(--gray-400)}
.fw-600{font-weight:600}
.mt-8{margin-top:8px}
.mt-16{margin-top:16px}
.mb-8{margin-bottom:8px}
.mb-16{margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.lignes-table{width:100%;border-collapse:collapse;margin-top:8px}
.lignes-table th{font-size:11px;padding:8px 10px}
.lignes-table td{padding:6px 8px;border-bottom:1px solid var(--gray-100)}
.lignes-table input,.lignes-table select{padding:6px 8px;border:1px solid var(--gray-300);border-radius:var(--radius);font-size:13px;width:100%}
.lignes-table input[type="number"]{width:100px}
.grand-total{font-size:18px;font-weight:700;color:var(--gray-900);text-align:right;padding:16px 20px;border-top:2px solid var(--gray-200);background:var(--gray-50)}
.inline-edit{cursor:pointer;border-bottom:1px dashed var(--gray-300);padding:2px 4px;border-radius:3px;min-width:60px;display:inline-block;transition:background .15s}
.inline-edit:hover{background:var(--primary-light);border-bottom-color:var(--primary)}
.inline-edit-input{padding:4px 8px;border:2px solid var(--primary);border-radius:var(--radius);font-size:13px;font-weight:600;text-align:right;width:120px;outline:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media print{#sidebar,#header,#toastContainer{display:none!important}#mainWrap{margin-left:0!important}#content{padding:0!important}}
@media(max-width:768px){
  #sidebar{transform:translateX(-100%);transition:transform .25s;width:280px}
  #sidebar.open{transform:translateX(0)}
  #sidebar.collapsed{width:280px}
  #sidebar.collapsed .nav-item{justify-content:flex-start;padding:10px 24px;gap:12px;border-left:3px solid transparent;border-radius:0;margin:0}
  #sidebar.collapsed .nav-item span,#sidebar.collapsed .nav-item .nav-badge{display:inline}
  #sidebar.collapsed .nav-group-title{display:block}
  #sidebar.collapsed .sidebar-brand span,.sidebar-brand .sidebar-toggle{display:inline-flex!important}
  #sidebar.collapsed .sidebar-brand{justify-content:flex-start;padding:20px 24px}
  #sidebar.collapsed .sidebar-footer{justify-content:space-between;padding:14px 20px}
  #sidebar.collapsed .sidebar-footer .user-info{display:inline}
  #sidebar.collapsed .sidebar-footer .btn{padding:5px 10px;font-size:13px;width:auto;height:auto}
  #sidebar.collapsed .sidebar-footer .btn::before{content:none}
  #sidebar.collapsed~#mainWrap{margin-left:0!important}
  #mainWrap{margin-left:0!important}
  #hamburgerBtn{display:block!important}
  #sidebarOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
  #sidebarOverlay.open{display:block}
  .form-row,.form-row-3{grid-template-columns:1fr!important}
  .grid-2{grid-template-columns:1fr!important}
  .stats-grid{grid-template-columns:1fr 1fr!important}
  .modal{max-width:95vw!important}
}
</style>
</head>
<body>
<div id="loginOverlay">
<div class="login-card" style="width:480px">
<div class="login-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
<h1>Mon Tableau de Bord</h1>
<p class="subtitle">Gestion int&eacute;gr&eacute;e</p>
<div id="loginTabs" style="display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--gray-200)">
<button id="tabLogin" class="btn" style="flex:1;border-bottom:2px solid var(--primary);margin-bottom:-2px;border-radius:0;font-weight:600" onclick="showLoginTab('login')">Connexion</button>
<button id="tabRegister" class="btn btn-outline" style="flex:1;border:none;border-radius:0;font-weight:600" onclick="showLoginTab('register')">Inscription</button>
</div>
<div id="loginForm">
<div class="form-group"><label>Identifiant entreprise</label><input type="text" id="loginEntId" placeholder="Ex: SARLDupont"></div>
<div class="form-group"><label>Identifiant utilisateur</label><input type="text" id="loginEmail" placeholder="Identifiant entreprise ou email"><p style="font-size:11px;color:var(--gray-500);margin-top:3px">Admin : m&ecirc;me identifiant que l'entreprise, ou email</p></div>
<div class="form-group"><label>Mot de passe</label><input type="password" id="loginPass" placeholder="Votre mot de passe"></div>
<p id="loginError" style="color:var(--danger);font-size:13px;display:none;margin-bottom:12px"></p>
<button class="btn btn-primary" style="width:100%;justify-content:center;padding:10px" onclick="doFirebaseLogin()">Se connecter</button>
<p style="text-align:center;margin-top:12px"><a href="#" onclick="doResetPassword();return false" style="color:var(--primary);font-size:13px;text-decoration:none">Mot de passe oubli&eacute; ?</a></p>
<p style="text-align:center;margin-top:6px"><a href="#" onclick="showLoginTab('register');return false" style="color:var(--gray-500);font-size:12px;text-decoration:none">Pas encore de compte ? Cr&eacute;er mon entreprise</a></p>
<div style="text-align:center;margin-top:10px;border-top:1px solid var(--gray-200);padding-top:10px">
<a href="#" onclick="showSaQuickLogin();return false" style="color:var(--purple);font-size:12px;text-decoration:none">&#9889; Acc&egrave;s Super Admin rapide</a>
</div>
</div>
<div id="registerForm" style="display:none">
<div class="form-group"><label>Identifiant de l'entreprise *</label>
<div style="display:flex;gap:8px"><input type="text" id="regEntId" placeholder="Ex: SARLDupont" style="flex:1" oninput="checkEntIdAvailability()">
<button class="btn btn-sm btn-outline" onclick="checkEntIdAvailability(true)" id="regCheckIdBtn" style="white-space:nowrap">V&eacute;rifier</button></div>
<p id="regIdStatus" style="font-size:12px;margin-top:4px;display:none"></p>
<p style="font-size:11px;color:var(--gray-500);margin-top:4px">Cet identifiant sera aussi votre identifiant de connexion</p></div>
<div class="form-group"><label>Nom de l'entreprise *</label><input type="text" id="regNom" placeholder="Ex: SARL Dupont"></div>
<div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="email@entreprise.com"></div>
<div class="form-group"><label>T&eacute;l&eacute;phone</label><input type="text" id="regTel" placeholder="+225 00 00 00 00"></div>
<div class="form-group"><label>Mot de passe *</label><input type="password" id="regPass" placeholder="Min. 6 caract&egrave;res"></div>
<div class="form-group"><label>Confirmer le mot de passe *</label><input type="password" id="regPass2" placeholder="R&eacute;p&eacute;tez le mot de passe"></div>

function escH(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fmtMoney(n) {
  if (isNaN(n) || n === null || n === undefined) n = 0;
  var r = Math.round(n);
  var s = String(r);
  var result = '';
  var count = 0;
  for (var i = s.length - 1; i >= 0; i--) {
    if (count > 0 && count % 3 === 0) result = ' ' + result;
    result = s[i] + result;
    count++;
  }
  return result + ' FCFA';
}

function fmtMoneyShort(n) {
  if (isNaN(n) || n === null || n === undefined) n = 0;
  var r = Math.round(n);
  var s = String(r);
  var result = '';
  var count = 0;
  for (var i = s.length - 1; i >= 0; i--) {
    if (count > 0 && count % 3 === 0) result = ' ' + result;
    result = s[i] + result;
    count++;
  }
  return result;
}

function fmtDate(d) {
  if (!d) return '-';
  var parts = d.split('-');
  if (parts.length !== 3) return d;
  var months = ['janv.','f\u00e9vr.','mars','avr.','mai','juin','juil.','ao\u00fbt','sept.','oct.','nov.','d\u00e9c.'];
  return parseInt(parts[2], 10) + ' ' + months[parseInt(parts[1], 10) - 1] + ' ' + parts[0];
}

function getToday() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function daysUntil(ds) {
  if (!ds) return Infinity;
  var now = new Date(getToday());
  var target = new Date(ds);
  return Math.ceil((target - now) / (1000 * 60 * 60 * 24));
}

function addDays(ds, n) {
  var d = new Date(ds);
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function confirmResetPassword(email) {
  var newPass = document.getElementById('resetNewPass').value;
  var newPass2 = document.getElementById('resetNewPass2').value;
  var code = document.getElementById('resetCode').value;
  var msgEl = document.getElementById('resetMsg');
  if (!newPass || newPass.length < 6) { msgEl.textContent = 'Mot de passe min. 6 caract\u00e8res'; msgEl.style.color = 'var(--danger)'; msgEl.style.display = 'block'; return; }
  if (newPass !== newPass2) { msgEl.textContent = 'Les mots de passe ne correspondent pas'; msgEl.style.color = 'var(--danger)'; msgEl.style.display = 'block'; return; }
  if (!code || code.length !== 6) { msgEl.textContent = 'Code invalide (6 chiffres)'; msgEl.style.color = 'var(--danger)'; msgEl.style.display = 'block'; return; }
  var ref = firebaseDb.collection('resetCodes').doc(email.replace(/\./g, '_'));
  ref.get().then(function(doc) {
    if (!doc.exists) { msgEl.textContent = 'Code invalide'; msgEl.style.color = 'var(--danger)'; msgEl.style.display = 'block'; return; }
    var data = doc.data();
    if (data.code !== code) { msgEl.textContent = 'Code incorrect'; msgEl.style.color = 'var(--danger)'; msgEl.style.display = 'block'; return; }
    if (Date.now() > data.expiry) { msgEl.textContent = 'Code expir\u00e9, demandez un nouveau'; msgEl.style.color = 'var(--danger)'; msgEl.style.display = 'block'; return; }
    ref.delete();
    return firebaseAuth.signInWithEmailAndPassword(email, '___dummy___');
  }).then(function(result) {
    if (result && result.user) {
      return result.user.updatePassword(newPass).then(function() {
        msgEl.textContent = 'Mot de passe r\u00e9initialis\u00e9 avec succ\u00e8s !';
        msgEl.style.color = 'var(--success)';
        msgEl.style.display = 'block';
        setTimeout(function() { location.reload(); }, 2000);
      });
    }
  }).catch(function() {
    msgEl.textContent = 'Erreur: le code a \u00e9t\u00e9 valid\u00e9 mais le changement a \u00e9chou\u00e9. Connectez-vous normalement.';
    msgEl.style.color = 'var(--warning)';
    msgEl.style.display = 'block';
  });
}

        for (var k = 0; k < DATA_KEYS.length; k++) {
          var key = DATA_KEYS[k];
          var val = cloudData[key];
          if (key === 'mdb_actif') {
            DB.set(key, (val && val.rubriques) ? val : {rubriques:[]});
          } else {

      var msg = 'Erreur lors de l\'inscription';
      if (error.code === 'auth/email-already-in-use') msg = 'Cet email est d\u00e9j\u00e0 utilis\u00e9 par une ancienne entreprise. Connectez-vous en SUPER-ADMIN, allez dans Entreprises, trouvez-la et g\u00e9n\u00e9rez un identifiant.';

function suggestFreeIds(busyId) {
  var status = document.getElementById('regIdStatus');

  var num = parseInt(busyId, 10);
  if (!isNaN(num)) {
    for (var i = 1; i <= 5; i++) suggestions.push(String(num + i));
  } else {
    suggestions.push(busyId + '1');
    suggestions.push(busyId + '2');
    suggestions.push(busyId + '_1');
    suggestions.push(busyId + '_2');
  }
  var html = 'Identifiant d\u00e9j\u00e0 pris. Suggestions : ';
  for (var j = 0; j < suggestions.length; j++) {
    html += '<a href="#" onclick="document.getElementById(\'regEntId\').value=\'' + suggestions[j] + '\';checkEntIdAvailability(true);return false" style="color:var(--primary);font-weight:600">' + suggestions[j] + '</a>';
    if (j < suggestions.length - 1) html += ', ';
  }
  status.style.color = 'var(--danger)';
  status.innerHTML = html;
  status.style.display = 'block';
}

var DATA_KEYS = ['mdb_clients','mdb_nomenclature','mdb_bc','mdb_bl','mdb_factures','mdb_reglements','mdb_prefinancement','mdb_taches','mdb_comptabilite','mdb_actif','mdb_entreprise','mdb_pinnedClients','mdb_fournisseurs','mdb_dettesFournisseurs','mdb_employes','mdb_codesCaisse','mdb_operationsCaisse','mdb_modelesCaisse','mdb_caisses','mdb_users'];
var _loadingCloud = false;

function mergeArraysById(local, cloud) {
  if (!Array.isArray(local) || local.length === 0) return cloud;
  if (!Array.isArray(cloud) || cloud.length === 0) return local;
  var map = {};
  var i;
  for (i = 0; i < cloud.length; i++) {
    if (cloud[i] && cloud[i].id) map[cloud[i].id] = cloud[i];
  }
  for (i = 0; i < local.length; i++) {
    if (local[i] && local[i].id) map[local[i].id] = local[i];
  }
  var result = [];
  for (var id in map) {
    if (map.hasOwnProperty(id)) result.push(map[id]);
  }
  return result;
}

function loadCloudData(uid, callback) {
  if (!firebaseDb || !uid) { if (callback) callback(); return; }
  _loadingCloud = true;
  _receivingSnapshot = true;
  var entRef = firebaseDb.collection('enterprises').doc(uid);
  var done = false;
  function finish() {
    if (done) return;
    done = true;
    _loadingCloud = false;
    _receivingSnapshot = false;
    if (callback) callback();
  }
  setTimeout(finish, 15000);
  entRef.get().then(function(doc) {
    if (doc.exists) {
      var data = doc.data();
      var cloudEnt = (data['mdb_entreprise'] && typeof data['mdb_entreprise'] === 'object') ? data['mdb_entreprise'] : data;
      var mergedEnt = {};
      var fields = ['nom','email','telephone','adresse','siret','nui','rc','rcs','formeJuridique','regimeFiscal','banque','rib','logo'];
      for (var f = 0; f < fields.length; f++) {
        mergedEnt[fields[f]] = (cloudEnt[fields[f]] && cloudEnt[fields[f]] !== '') ? cloudEnt[fields[f]] : '';
      }
      DB.set('mdb_entreprise', mergedEnt);
      for (var i = 0; i < DATA_KEYS.length; i++) {
        var key = DATA_KEYS[i];
        if (key === 'mdb_entreprise') continue;
        var val = data[key];
        if (key === 'mdb_actif') {
          DB.set(key, (val && val.rubriques) ? val : {rubriques:[]});
        } else {
          DB.set(key, (val !== undefined && val !== null) ? val : []);
        }
      }
    }
    _dirtyKeys = {};
    finish();
  }).catch(function(e) {
    console.warn('Cloud load error:', e);
    finish();
  });
}

var _snapshotUnsubscribe = null;

function startRealtimeSync(uid) {
  if (_snapshotUnsubscribe) { try { _snapshotUnsubscribe(); } catch(e) {} _snapshotUnsubscribe = null; }
  if (!firebaseDb || !uid) return;
  var dataRef = firebaseDb.collection('enterprises').doc(uid);
  _snapshotUnsubscribe = dataRef.onSnapshot(function(doc) {
    if (!doc.exists) return;
    var data = doc.data();
    _receivingSnapshot = true;
    var changed = false;
    for (var i = 0; i < DATA_KEYS.length; i++) {
      var key = DATA_KEYS[i];
      if (data[key] === undefined || data[key] === null) continue;
      if (_dirtyKeys[key]) continue;
      var local = DB.get(key);
      var cloudStr = JSON.stringify(data[key]);
      var localStr = JSON.stringify(local);
      if (localStr !== cloudStr) {
        DB.set(key, data[key]);
        changed = true;
      }
    }
    _receivingSnapshot = false;
    if (changed) {
      var ind = document.getElementById('syncIndicator');
      if (ind) { ind.textContent = '\u2713 Sync'; setTimeout(function() { ind.textContent = ''; }, 2000); }
      if (currentPage) navigateTo(currentPage);
    }
  }, function(e) {
    console.warn('Snapshot error:', e);
    var ind = document.getElementById('syncIndicator');
    if (ind) { ind.textContent = '\u2717 Sync'; setTimeout(function() { ind.textContent = ''; }, 3000); }
  });
}

function stopRealtimeSync() {
  if (_snapshotUnsubscribe) { try { _snapshotUnsubscribe(); } catch(e) {} _snapshotUnsubscribe = null; }
}

function canAccess(page, write) {
  if (!currentUser) return false;
  if (currentUser.isSuperAdmin) return true;
  if (currentUser.isAdmin) {
    if (currentUser.adminType === 'petit_admin') {
      var dp = currentUser.deniedPages || [];
      if (dp.indexOf(page) !== -1) return false;
    }
    return true;
  }
  var sec = currentUser.sections || {};
  if (sec[page]) {
    if (write) return sec[page] === 'write';
    return sec[page] === 'write' || sec[page] === 'read';
  }
  if (_forfaitPermissions) {
    var ent = getEntreprise();
    var plan = (ent.subscription || {}).plan || 'basic';
    var fp = _forfaitPermissions[plan] || {};
    if (write) return fp[page] === 'write';
    return fp[page] === 'write' || fp[page] === 'read';
  }
  return false;
}

    return false;

  return (currentUser.sections || {})[page] === 'read';

  if (val === undefined) return true;

}

function saveDraft(page) {
  if (!page || page === 'dashboard' || page === 'journal' || page === 'utilisateurs' || page === 'entreprise') return;
  if (!formLignes || formLignes.length === 0) return;
  var draft = { lignes: formLignes.slice(), date: getToday() };
  var form = document.getElementById('bcNumero') || document.getElementById('blNumero') || document.getElementById('facNumero') || document.getElementById('pfClient');
  if (form) {

    var ids = ['bcNumero','bcClient','bcDate','bcStatut','bcDelai','bcObs','blNumero','blClient','blDate','blBC','facNumero','facClient','facDate','facStatut','pfClient','pfBC'];
    for (var i = 0; i < ids.length; i++) {
      var el = document.getElementById(ids[i]);
      if (el) fields[ids[i]] = el.value;
    }
    draft.fields = fields;
  }
  DB.set('mdb_draft_' + page, draft);
}

    var ids = ['bcNumero','bcClient','bcDate','bcStatut','bcDelai','bcObs','blNumero','blClient','blDate','blBC','facNumero','facClient','facDate','facStatut','pfClient','pfBC'];
    for (var j = 0; j < ids.length; j++) {

  return null;

function getFournisseurCompte(fournisseurId) {
  var ops = getOperationsCaisse();
  var dettes = getDettesFournisseurs();
  var operations = [];
  for (var i = 0; i < ops.length; i++) {
    var o = ops[i];
    if (o.beneficiaireType !== 'fournisseur' || o.beneficiaireId !== fournisseurId) continue;
    if (o.montantCharge && o.montantCharge > 0) {
      operations.push({date: o.date, libelle: o.libelle + ' (Charge)', montant: o.montantCharge, type: 'charge', source: 'caisse'});
    }
    operations.push({date: o.date, libelle: o.libelle + ' (Paiement)', montant: o.montant || 0, type: 'paiement', source: 'caisse'});
  }
  for (var j = 0; j < dettes.length; j++) {
    var d = dettes[j];
    if (d.fournisseurId !== fournisseurId) continue;
    operations.push({date: d.date, libelle: d.description || 'Dette', montant: d.montant || 0, type: 'charge', source: 'dette'});
  }
  operations.sort(function(a, b) { return (a.date || '').localeCompare(b.date || ''); });
  return operations;
}

function inlineMontant(tableId, rowId, field, currentValue) {
  var cell = document.getElementById(tableId + '_' + rowId + '_' + field);
  if (!cell) return;
  cell.innerHTML = '<input class="inline-edit-input" type="number" value="' + (currentValue || 0) + '" onkeydown="handleInlineEdit(event,\'' + tableId + '\',\'' + rowId + '\',\'' + field + '\')" onblur="cancelInlineEdit(this,\'' + tableId + '\',\'' + rowId + '\',\'' + field + '\',' + (currentValue || 0) + ')">';
  var inp = cell.querySelector('input');
  if (inp) { inp.focus(); inp.select(); }
}

function handleInlineEdit(e, tableId, rowId, field) {
  if (e.key === 'Enter') {
    var val = parseFloat(e.target.value) || 0;
    saveInlineEdit(tableId, rowId, field, val);
  } else if (e.key === 'Escape') {
    cancelInlineEdit(e.target, tableId, rowId, field, 0);
  }
}

function cancelInlineEdit(el, tableId, rowId, field, originalVal) {
  var cell = document.getElementById(tableId + '_' + rowId + '_' + field);
  if (cell) cell.innerHTML = '<span class="inline-edit" onclick="inlineMontant(\'' + tableId + '\',\'' + rowId + '\',\'' + field + '\',' + originalVal + ')">' + fmtMoney(originalVal) + '</span>';
}

function saveInlineEdit(tableId, rowId, field, val) {
  if (tableId === 'dfDettes') {
    var dettes = getDettesFournisseurs();
    for (var i = 0; i < dettes.length; i++) {
      if (dettes[i].id === rowId) { dettes[i][field] = val; break; }
    }
    DB.set('mdb_dettesFournisseurs', dettes);
    renderFournisseurs();
  } else if (tableId === 'regReglements') {
    var regs = getReglements();
    for (var i = 0; i < regs.length; i++) {
      if (regs[i].id === rowId) { regs[i][field] = val; break; }
    }
    DB.set('mdb_reglements', regs);
    renderTresorerie();
  } else if (tableId === 'nomArticles') {
    var arts = getArticles();
    for (var i = 0; i < arts.length; i++) {
      if (arts[i].id === rowId) {
        if (!arts[i].prixPeriodes) arts[i].prixPeriodes = [];
        if (arts[i].prixPeriodes.length > 0) {
          arts[i].prixPeriodes[arts[i].prixPeriodes.length - 1].prixUnitaire = val;
        } else {
          arts[i].prixPeriodes.push({dateDebut:'2000-01-01', dateFin:'2099-12-31', prixUnitaire:val});
        }
        break;
      }
    }
    DB.set('mdb_nomenclature', arts);
    renderNomenclature();
  }
  toast('Montant mis \u00e0 jour');
}

function getStatusBadge(statut) {
  if (!statut) return '<span class="badge badge-gray">-</span>';
  var cls = 'badge-gray';
  if (statut === 'en_cours' || statut === 'en_attente' || statut === 'brouillon' || statut === 'non_facture') cls = 'badge-primary';
  else if (statut === 'termine' || statut === 'livree' || statut === 'validee' || statut === 'payee' || statut === 'approuve' || statut === 'facture') cls = 'badge-success';
  else if (statut === 'en_retard' || statut === 'retard' || statut === 'annule' || statut === 'refuse') cls = 'badge-danger';
  else if (statut === 'partielle' || statut === 'partiel_livre' || statut === 'partielle') cls = 'badge-warning';
  return '<span class="badge ' + cls + '">' + escH(statut) + '</span>';

function getPrixForDate(article, dateStr) {
  if (!article || !article.prixPeriodes || article.prixPeriodes.length === 0) return 0;
  var d = dateStr || getToday();
  for (var i = 0; i < article.prixPeriodes.length; i++) {
    var p = article.prixPeriodes[i];
    if (d >= p.dateDebut && d <= p.dateFin) return p.prixUnitaire;
  }
  return article.prixPeriodes[article.prixPeriodes.length - 1].prixUnitaire;
}

function filterBC() {
  var q = (document.getElementById('bcSearch').value || '').toLowerCase();
  var fs = document.getElementById('bcFilterStatut').value;
  var sections = document.getElementById('bcBody').querySelectorAll('.section');
  for (var i = 0; i < sections.length; i++) {
    var s = sections[i].getAttribute('data-search') || '';
    var st = sections[i].getAttribute('data-statut') || '';
    var show = s.indexOf(q) !== -1;
    if (fs) show = show && st === fs;
    sections[i].style.display = show ? '' : 'none';
  }
}

function saveBC(id) {
  var clientId = document.getElementById('bcClient').value;
  if (!clientId) { toast('Veuillez s\u00e9lectionner un client', 'error'); return; }
  var data = {
    numero: document.getElementById('bcNumero').value.trim(),
    clientId: clientId, dateBC: document.getElementById('bcDate').value,
    delaiLivraison: parseInt(document.getElementById('bcDelai').value) || 30,
    statut: document.getElementById('bcStatut').value,
    tvaActive: document.getElementById('bcTvaActive').value === '1',
    tauxTva: parseFloat(document.getElementById('bcTaux').value) || 19,
    observations: document.getElementById('bcObs').value.trim(),
    lignes: formLignes.slice()
  };
  var bcs = getBCs();
  if (id) {
    for (var i = 0; i < bcs.length; i++) {
      if (bcs[i].id === id) { data.id = id; data.dateCreation = bcs[i].dateCreation; bcs[i] = data; break; }
    }
  } else {
    data.id = DB.genId(); data.dateCreation = getToday(); bcs.push(data);
  }
  DB.set('mdb_bc', bcs);
  closeModal();
  clearDraft('bc');
  toast('BC enregistr\u00e9');
  renderBC();
  buildSidebar();
}

function deleteBC(id) {
  var bcs = getBCs(); var bc = null;
  for (var i = 0; i < bcs.length; i++) { if (bcs[i].id === id) { bc = bcs[i]; break; } }
  if (!bc) return;
  var bls = getBLs();
  for (var j = 0; j < bls.length; j++) { if (bls[j].bcId === id) { toast('Impossible de supprimer : ce BC a des BLs li\u00e9s. Archivez-le ou supprimez les BLs d\'abord.', 'error'); return; } }
  var facs = getFactures();
  for (var k = 0; k < facs.length; k++) {
    if (facs[k].lignes) {
      for (var l = 0; l < facs[k].lignes.length; l++) {
        if (facs[k].lignes[l].bcId === id) { toast('Impossible de supprimer : ce BC est utilis\u00e9 dans des factures.', 'error'); return; }
      }
    }
  }
  openConfirm('\u00cates-vous s\u00fbr de vouloir supprimer ce BC ?', function() {
    var result = [];
    for (var m = 0; m < bcs.length; m++) { if (bcs[m].id !== id) result.push(bcs[m]); }
    DB.set('mdb_bc', result);
    toast('BC supprim\u00e9');
    renderBC();
    buildSidebar();
  });
}

function archiveBC(id) {
  var bcs = getBCs(); var bc = null;
  for (var i = 0; i < bcs.length; i++) { if (bcs[i].id === id) { bc = bcs[i]; break; } }
  if (!bc) return;
  var reason = prompt('Indiquez la raison de l\'abandon de ce BC :');
  if (reason === null) return;
  if (!reason.trim()) { toast('Veuillez indiquer une raison', 'error'); return; }
  for (var j = 0; j < bcs.length; j++) {
    if (bcs[j].id === id) {
      bcs[j].statut = 'annule';
      bcs[j].raisonAnnulation = reason.trim();
      bcs[j].dateAnnulation = getToday();
      break;
    }
  }
  DB.set('mdb_bc', bcs);
  toast('BC abandonn\u00e9 et archiv\u00e9');
  renderBC();
}

function getNumero(prefix) {
  var maxNum = 0;
  var items = [];
  if (prefix === 'BC') items = getBCs();
  else if (prefix === 'BL') items = getBLs();
  else if (prefix === 'FAC') items = getFactures();
  for (var i = 0; i < items.length; i++) {
    var num = items[i].numero || '';
    var idx = num.lastIndexOf('-');
    if (idx !== -1) {
      var part = num.substring(idx + 1);
      var n = parseInt(part, 10);
      if (!isNaN(n) && n > maxNum) maxNum = n;
    }
  }
  return prefix + '-' + String(maxNum + 1).padStart(3, '0');
}

    html += '<td><input type="number" value="' + (l.quantite || 1) + '" min="1" style="width:70px" onchange="updateLigneQty(' + i + ',this.value)"></td>';
    html += '<td><input type="number" value="' + (l.prixUnitaire || 0) + '" min="0" style="width:110px" onchange="updateLignePrice(' + i + ',this.value)"></td>';
    html += '<td class="fw-600">' + fmtMoney(montant) + '</td>';
    if (isFacture) {
      var bcs = getBCsForClient(facClientId);
      html += '<td><select onchange="onFacLineBCChange(' + i + ',this.value)" style="min-width:120px"><option value="">-- BC --</option>';
      for (var bi = 0; bi < bcs.length; bi++) {
        var bcNum = bcs[bi].numero || '(sans n\u00famero)';
        var bcSel = (l.bcId === bcs[bi].id) ? ' selected' : '';
        html += '<option value="' + bcs[bi].id + '"' + bcSel + '>' + escH(bcNum) + '</option>';
      }
      html += '</select></td>';
      var bls = l.bcId ? getBLsForBC(l.bcId) : [];
      html += '<td><select onchange="onFacLineBLChange(' + i + ',this.value)" style="min-width:120px"><option value="">-- BL --</option>';
      for (var bj = 0; bj < bls.length; bj++) {
        var blSel2 = (l.blId === bls[bj].id) ? ' selected' : '';
        html += '<option value="' + bls[bj].id + '"' + blSel2 + '>' + escH(bls[bj].numero) + ' (' + fmtDate(bls[bj].dateLivraison) + ')</option>';
      }
      html += '</select></td>';
    }
    html += '<td><button class="btn-icon danger" onclick="removeFormLigne(' + i + ')" title="Supprimer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></td>';
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  html += '<button class="btn btn-outline btn-sm mt-8" onclick="addFormLigne()">+ Ajouter une ligne</button>';
  var total = 0;
  for (var k = 0; k < formLignes.length; k++) { total += (formLignes[k].quantite || 0) * (formLignes[k].prixUnitaire || 0); }
  var tvaSelect = document.getElementById('facTVA');
  var hasTVA = tvaSelect ? tvaSelect.value === 'oui' : false;
  var tvaAmount = hasTVA ? total * 0.16 : 0;
  var totalTTC = total + tvaAmount;
  html += '<div style="text-align:right;margin-top:12px;font-size:14px">';
  html += '<div>Sous-total HT : <strong style="color:var(--primary)">' + fmtMoney(total) + '</strong></div>';
  if (hasTVA) html += '<div>TVA (16%) : <strong style="color:var(--warning)">' + fmtMoney(tvaAmount) + '</strong></div>';
  html += '<div style="font-size:18px;margin-top:4px"><strong>Total TTC : </strong><span style="color:var(--primary);font-size:20px">' + fmtMoney(totalTTC) + '</span></div>';
  html += '</div>';
  container.innerHTML = html;
}

function onArticleCodeInput(idx, code) {
  code = code.trim();
  if (!code) { formLignes[idx].articleId = ''; formLignes[idx].designation = ''; formLignes[idx].prixUnitaire = 0; renderFormLignes(); return; }
  var articles = getArticles();
  var art = null;
  for (var i = 0; i < articles.length; i++) { if (articles[i].code === code || articles[i].code.toLowerCase() === code.toLowerCase()) { art = articles[i]; break; } }
  if (!art) return;
  formLignes[idx].articleId = art.id;
  formLignes[idx].designation = art.designation;
  var dateField = document.getElementById('facDate') || document.getElementById('blDate') || document.getElementById('bcDate');
  var dateStr = dateField ? dateField.value : getToday();
  formLignes[idx].prixUnitaire = getPrixForDate(art, dateStr);
  renderFormLignes();
}
function onArticleSelect(idx, articleId) {
  onArticleCodeInput(idx, articleId);
}

function updateLigneQty(idx, val) { formLignes[idx].quantite = parseInt(val) || 1; renderFormLignes(); }
function updateLignePrice(idx, val) { formLignes[idx].prixUnitaire = parseFloat(val) || 0; renderFormLignes(); }

function addFormPeriod() {
  var y = new Date().getFullYear();
  formPeriods.push({dateDebut:y+'-01-01', dateFin:y+'-12-31', prixUnitaire:0});
  renderFormPeriods();
}

function removeFormPeriod(idx) {
  formPeriods.splice(idx, 1);
  renderFormPeriods();
}

function renderFormPeriods() {
  var container = document.getElementById('periodsContainer');
  if (!container) return;
  var html = '<table class="lignes-table"><thead><tr><th>Date d\u00e9but</th><th>Date fin</th><th>Prix unitaire</th><th style="width:40px"></th></tr></thead><tbody>';
  for (var i = 0; i < formPeriods.length; i++) {
    var p = formPeriods[i];
    html += '<tr>';
    html += '<td><input type="date" value="' + p.dateDebut + '" onchange="formPeriods[' + i + '].dateDebut=this.value"></td>';
    html += '<td><input type="date" value="' + p.dateFin + '" onchange="formPeriods[' + i + '].dateFin=this.value"></td>';
    html += '<td><input type="number" value="' + (p.prixUnitaire || 0) + '" min="0" onchange="formPeriods[' + i + '].prixUnitaire=parseFloat(this.value)||0"></td>';
    html += '<td><button class="btn-icon danger" onclick="removeFormPeriod(' + i + ')" title="Supprimer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></td>';
    html += '</tr>';
  }
  html += '</tbody></table>';
  html += '<button class="btn btn-outline btn-sm mt-8" onclick="addFormPeriod()">+ Ajouter une p\u00e9riode</button>';
  container.innerHTML = html;
}

function calcFacEcheance() {
  var cs = document.getElementById('facClient');
  var di = document.getElementById('facDate');
  var ei = document.getElementById('facEcheance');
  if (!cs || !di || !ei) return;
  var client = getClientById(cs.value);
  if (client && di.value) { ei.value = addDays(di.value, client.delaiPaiement || 30); }
}

function onFacClientChange() {
  calcFacEcheance();
  formLignes = [];
  var clientId = document.getElementById('facClient').value;
  var bcSel = document.getElementById('facBC');
  var blSel = document.getElementById('facBL');
  if (!clientId) {
    if (bcSel) bcSel.innerHTML = '<option value="">-- Choisir un client d\'abord --</option>';
    if (blSel) blSel.innerHTML = '<option value="">-- Choisir un BC d\'abord --</option>';
    renderFormLignes();
    return;
  }
  var bcs = getBCs();
  var html = '<option value="">-- Choisir un BC --</option>';
  for (var i = 0; i < bcs.length; i++) {
    if (bcs[i].clientId === clientId) {
      html += '<option value="' + bcs[i].id + '">' + escH(bcs[i].numero) + ' (' + fmtDate(bcs[i].dateBC) + ')</option>';
    }
  }
  if (bcSel) bcSel.innerHTML = html;
  if (blSel) blSel.innerHTML = '<option value="">-- Choisir un BC d\'abord --</option>';
  renderFormLignes();
}
function onFacBCChange() {
  formLignes = [];
  var bcId = document.getElementById('facBC').value;
  var blSel = document.getElementById('facBL');
  if (!bcId) {
    if (blSel) blSel.innerHTML = '<option value="">-- Choisir un BC d\'abord --</option>';
    renderFormLignes();
    return;
  }
  var bls = getBLs();
  var factures = getFactures();
  var invoicedBLIds = {};
  for (var fi = 0; fi < factures.length; fi++) {
    if (factures[fi].blIds) {
      for (var fj = 0; fj < factures[fi].blIds.length; fj++) {
        invoicedBLIds[factures[fi].blIds[fj]] = true;
      }
    }
  }
  var html = '<option value="">-- Choisir un BL --</option>';
  for (var i = 0; i < bls.length; i++) {
    if (bls[i].bcId === bcId && !invoicedBLIds[bls[i].id]) {
      html += '<option value="' + bls[i].id + '">' + escH(bls[i].numero) + ' (' + fmtDate(bls[i].dateBL) + ')</option>';
    }
  }
  if (blSel) blSel.innerHTML = html;
  renderFormLignes();
}
function onFacBLChange() {
  var blId = document.getElementById('facBL').value;
  if (!blId) { formLignes = []; renderFormLignes(); return; }
  var bls = getBLs();
  var bcId = document.getElementById('facBC').value;
  for (var i = 0; i < bls.length; i++) {
    if (bls[i].id === blId && bls[i].lignes) {
      for (var k = 0; k < bls[i].lignes.length; k++) {
        formLignes.push({
          articleId: bls[i].lignes[k].articleId || '',
          designation: bls[i].lignes[k].designation || '',
          quantite: bls[i].lignes[k].quantite || 1,
          prixUnitaire: bls[i].lignes[k].prixUnitaire || 0,
          bcId: bcId || bls[i].bcId || '',
          blId: blId
        });
      }
      break;
    }
  }
  renderFormLignes();
}
function onFacLineBCChange(idx, bcId) {
  formLignes[idx].bcId = bcId || '';
  formLignes[idx].blId = '';
  renderFormLignes();
}
function onFacLineBLChange(idx, blId) {
  formLignes[idx].blId = blId || '';
  if (blId) {
    var bls = getBLs();
    for (var i = 0; i < bls.length; i++) {
      if (bls[i].id === blId && bls[i].lignes && bls[i].lignes.length > 0) {
        var bl = bls[i];
        var existingArticles = [];
        for (var j = 0; j < formLignes.length; j++) {
          if (formLignes[j].blId === blId && formLignes[j].articleId) existingArticles.push(formLignes[j].articleId);
        }
        for (var k = 0; k < bl.lignes.length; k++) {
          var found = false;
          for (var m = 0; m < existingArticles.length; m++) {
            if (existingArticles[m] === bl.lignes[k].articleId) { found = true; break; }
          }
          if (!found) {
            formLignes.push({
              articleId: bl.lignes[k].articleId || '',
              designation: bl.lignes[k].designation || '',
              quantite: bl.lignes[k].quantite || 1,
              prixUnitaire: bl.lignes[k].prixUnitaire || 0,
              bcId: bl.bcId || '',
              blId: blId
            });
          }
        }
        break;
      }
    }
  }
  renderFormLignes();
}

function getStockData() {
  var actif = getActif();
  for (var i = 0; i < actif.rubriques.length; i++) {
    var nom = actif.rubriques[i].nom.toLowerCase();
    if (nom.indexOf('stock') !== -1 || nom.indexOf('mati') !== -1) return actif.rubriques[i].lignes || [];
  }
  return [];
}
function renderDashboard() {
  var clients = getClients();
  var factures = getFactures();
  var bls = getBLs();
  var bcs = getBCs();
  var taches = getTaches();
  var dashUserId = currentUser ? currentUser.id : '';

  var reglements = getReglements();
  var ops = getOperationsCaisse();
  var mN = ['Jan','F\u00e9v','Mar','Avr','Mai','Jun','Jul','Ao\u00fb','Sep','Oct','Nov','D\u00e9c'];
  var dN = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  var now = new Date();
  var today = getToday();
  var wAgo = new Date(now); wAgo.setDate(wAgo.getDate() - 7);
  var wAgoS = wAgo.getFullYear() + '-' + (wAgo.getMonth() < 9 ? '0' : '') + (wAgo.getMonth() + 1) + '-' + (wAgo.getDate() < 10 ? '0' : '') + wAgo.getDate();

  var caT = 0, aEnc = 0, fRet = 0, tRet = 0, blNF = 0, totReg = 0;
  var caTW = 0, regTW = 0, bcTW = 0, blTW = 0, caToday = 0, regToday = 0;
  for (var i = 0; i < factures.length; i++) {
    var f = factures[i]; caT += f.total || 0;
    if (f.statut !== 'payee') aEnc += (f.total || 0) - (f.montantPaye || 0);
    if (f.statut !== 'payee' && f.echeance && daysUntil(f.echeance) < 0) fRet++;
    if (f.dateEmission >= today) caToday += f.total || 0;
    if (f.dateEmission >= wAgoS) caTW += f.total || 0;
  }
  for (var r = 0; r < reglements.length; r++) {
    totReg += reglements[r].montant || 0;
    if (reglements[r].date >= today) regToday += reglements[r].montant || 0;
    if (reglements[r].date >= wAgoS) regTW += reglements[r].montant || 0;
  }
  for (var j = 0; j < myTaches.length; j++) {
    if (myTaches[j].statut !== 'termine' && myTaches[j].dateLimite && daysUntil(myTaches[j].dateLimite) < 0) tRet++;
  }
  var pfRet = 0;
  var pfData = getPrefinancements();
  for (var pfj = 0; pfj < pfData.length; pfj++) {
    if (pfData[pfj].statut === 'approuve' && pfData[pfj].echeanceRemboursement) {
      var dl = daysUntil(pfData[pfj].echeanceRemboursement);
      if (dl < 0) pfRet++;
    }
  }
  for (var b = 0; b < bls.length; b++) { if (!bls[b].factureId) blNF++; }
  for (var bi = 0; bi < bcs.length; bi++) { if (bcs[bi].date && bcs[bi].date >= wAgoS) bcTW++; }
  for (var bli = 0; bli < bls.length; bli++) { if (bls[bli].dateLivraison && bls[bli].dateLivraison >= wAgoS) blTW++; }

  var html = '';

  // Welcome banner
  html += '<div class="dash-welcome" data-sub="dashboard.quickCards">';
  html += '<div><h2>Bonjour, ' + escH(currentUser ? (currentUser.nom || 'Utilisateur') : '') + '</h2>';
  html += '<p>' + clients.length + ' clients \u2022 ' + factures.length + ' factures \u2022 ' + bls.length + ' BL \u2022 ' + bcs.length + ' BC</p></div>';
  html += '<div class="dash-date">' + dN[now.getDay()] + ' ' + now.getDate() + ' ' + mN[now.getMonth()] + ' ' + now.getFullYear() + '<br>' + today.substring(0,10) + '</div>';
  html += '</div>';

  // Quick cards
  html += '<div class="quick-grid">';
  html += '<div class="quick-card" onclick="navigateToFacturation(\'bc\')"><div class="qc-icon">&#x1F4CB;</div><div class="qc-count">' + bcs.length + '</div><div class="qc-label">BC</div></div>';
  html += '<div class="quick-card" onclick="navigateToFacturation(\'bl\')"><div class="qc-icon">&#x1F4E6;</div><div class="qc-count" style="color:' + (blNF > 0 ? 'var(--warning)' : '') + '">' + blNF + '</div><div class="qc-label">BL non factur\u00e9s</div></div>';
  html += '<div class="quick-card" onclick="navigateToFacturation(\'factures\')"><div class="qc-icon">&#x1F4C4;</div><div class="qc-count">' + factures.length + '</div><div class="qc-label">Factures</div></div>';
  html += '<div class="quick-card" onclick="navigateTo(\'taches\')"><div class="qc-icon">&#x1F4DD;</div><div class="qc-count" style="color:' + (tRet > 0 ? 'var(--danger)' : '') + '">' + taches.filter(function(t){return t.statut!=='termine'}).length + '</div><div class="qc-label">T\u00e2ches ouvertes</div></div>';
  html += '</div>';

  // Alerts
  if (fRet > 0 || tRet > 0 || pfRet > 0) {
    html += '<div class="alerts-bar danger" data-sub="dashboard.alerts">';
    html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
    if (fRet > 0) html += '<span onclick="navigateToFacturation(\'factures\')" style="cursor:pointer"><strong>' + fRet + '</strong> facture(s) en retard</span>';
    if (tRet > 0) html += '<span onclick="navigateTo(\'taches\')" style="cursor:pointer"><strong>' + tRet + '</strong> t\u00e2che(s) en retard</span>';
    if (pfRet > 0) html += '<span onclick="navigateTo(\'prefinancement\')" style="cursor:pointer"><strong>' + pfRet + '</strong> pr\u00e9-financement(s) en retard</span>';
    html += '</div>';
  }

  // Stats row
  html += '<div class="stats-grid">';
  html += '<div class="stat-card clickable" onclick="navigateToFacturation(\'factures\')" data-sub="dashboard.caTotal"><div class="stat-icon" style="background:var(--success-light);color:var(--success)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><div class="stat-info"><div class="stat-value">' + fmtMoney(caT) + '</div><div class="stat-label">CA Total</div></div></div>';
  html += '<div class="stat-card clickable" onclick="navigateTo(\'tresorerie\')" data-sub="dashboard.encaissements"><div class="stat-icon" style="background:var(--primary-light);color:var(--primary)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><polyline points="20 6 9 17 4 12"/></svg></div><div class="stat-info"><div class="stat-value">' + fmtMoney(totReg) + '</div><div class="stat-label">Encaissements</div></div></div>';
  html += '<div class="stat-card clickable" onclick="navigateToFacturation(\'factures\')" data-sub="dashboard.aEncaisser"><div class="stat-icon" style="background:var(--warning-light);color:var(--warning)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div><div class="stat-info"><div class="stat-value">' + fmtMoney(aEnc) + '</div><div class="stat-label">\u00c0 encaisser</div></div></div>';
  html += '<div class="stat-card clickable" onclick="navigateToFacturation(\'factures\')" data-sub="dashboard.facturesRetard"><div class="stat-icon" style="background:' + (fRet > 0 ? 'var(--danger-light)' : 'var(--success-light)') + ';color:' + (fRet > 0 ? 'var(--danger)' : 'var(--success)') + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-info"><div class="stat-value">' + fRet + '</div><div class="stat-label">Factures en retard</div></div></div>';
  html += '</div>';

  var CC = ['#2563eb','#16a34a','#d97706','#dc2626','#7c3aed','#0891b2','#be185d','#65a30d'];
  html += '<div class="dash-grid-2">';

  // Bar chart: CA per month
  html += '<div class="dash-section" data-sub="dashboard.caTotal"><h3>&#x1F4CA; CA par mois (6 mois)</h3>';
  var mCA = {};
  for (var mi = 5; mi >= 0; mi--) {
    var dd = new Date(now.getFullYear(), now.getMonth() - mi, 1);
    var k = dd.getFullYear() + '-' + (dd.getMonth() < 9 ? '0' : '') + (dd.getMonth() + 1);
    mCA[k] = 0;
  }
  for (var fi = 0; fi < factures.length; fi++) {
    if (factures[fi].dateEmission) {
      var mk = factures[fi].dateEmission.substring(0, 7);
      if (mCA.hasOwnProperty(mk)) mCA[mk] += factures[fi].total || 0;
    }
  }
  var maxV = 1; var mKs = [];
  for (var mk2 in mCA) { if (mCA.hasOwnProperty(mk2)) { mKs.push(mk2); if (mCA[mk2] > maxV) maxV = mCA[mk2]; } }
  html += '<div class="dash-bar-chart">';
  for (var mj = 0; mj < mKs.length; mj++) {
    var mKey = mKs[mj]; var mVal = mCA[mKey];
    var mPct = maxV > 0 ? Math.max(3, (mVal / maxV) * 100) : 3;
    var mL = mN[parseInt(mKey.substring(5, 7)) - 1];
    html += '<div class="dash-bar-col"><div class="dash-bar-val">' + fmtMoney(mVal) + '</div><div class="dash-bar" style="height:' + mPct + '%"></div><div class="dash-bar-label">' + mL + '</div></div>';
  }
  html += '</div></div>';

  // Donut chart: CA by client
  html += '<div class="dash-section" data-sub="dashboard.caParClient"><h3>&#x1F967; CA par client</h3>';
  var cBC = {};
  for (var ci = 0; ci < factures.length; ci++) {
    var cid = factures[ci].clientId || '_none';
    if (!cBC[cid]) cBC[cid] = 0;
    cBC[cid] += factures[ci].total || 0;
  }

  for (var cK in cBC) { if (cBC.hasOwnProperty(cK)) sC.push({id: cK, val: cBC[cK]}); }

  var top = sC.slice(0, 6);

  if (caT > 0) {

      cP += pct;
    }
    html += '<div class="dash-donut" style="background:conic-gradient(' + cg + ')"><div class="dash-donut-center"><div class="dv">' + fmtMoney(caT) + '</div><div class="dl">Total</div></div></div>';
  } else {
    html += '<div style="text-align:center;color:var(--gray-400);padding:40px 0">Aucune donn\u00e9e</div>';
  }
  html += '<div class="dash-legend">';
  for (var dl = 0; dl < top.length; dl++) {

  html += '</div></div>';
  html += '</div>';

  for (var ri = 0; ri < reglements.length; ri++) {

  html += '</div>';

  // Clients d\u00e9biteurs + T\u00e2ches urgentes

  var cDeb = {};

  html += '<div class="dash-section" data-sub="dashboard.clientsDebiteurs"><h3>&#x1F4B0; Clients d\u00e9biteurs</h3>';

  var hasDebt = false;

  if (!hasDebt) html += '<tr><td colspan="2" class="text-center text-muted">Aucun client d\u00e9biteur</td></tr>';

  var uTaches = [];

  });
  uTaches = uTaches.slice(0, 5);
  html += '<div class="dash-section" data-sub="dashboard.tachesUrgentes"><h3>&#x1F4DD; T\u00e2ches urgentes</h3>';

  html += '</tbody></table></div></div>';

  html += '</div>';

  // TVA
  html += '<div class="stats-grid" style="margin-bottom:20px">';
  html += '<div class="stat-card clickable" onclick="navigateTo(\'tresorerie\')" data-sub="dashboard.soldeEncaissement"><div class="stat-icon" style="background:var(--primary-light);color:var(--primary)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><div class="stat-info"><div class="stat-value">' + fmtMoney(totReg - aEnc) + '</div><div class="stat-label">Solde encaissement</div></div></div>';
  html += '<div class="stat-card clickable" onclick="navigateTo(\'prefinancement\')" data-sub="dashboard.tvaEstimee"><div class="stat-icon" style="background:var(--warning-light);color:var(--warning)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><div class="stat-info"><div class="stat-value">' + fmtMoney(caT * 0.18) + '</div><div class="stat-label">TVA estim\u00e9e (18%)</div></div></div>';
  html += '</div>';

  var stock = getStockData();

    var stockTotal = 0;
    for (var si = 0; si < stock.length; si++) {
      stockTotal += stock[si].montant || 0;

  var prefins = getPrefinancements();

  for (var pi = 0; pi < prefins.length; pi++) {

  if (pfActifs.length > 0) {
    var totalFinance = 0, totalRembourse = 0, totalReserveIndispo = 0, totalReserveDispo = 0;
    for (var pf = 0; pf < pfActifs.length; pf++) {
      var pfObj = pfActifs[pf];
      var mA = pfObj.montantAccorde || 0;
      var mR = pfObj.montantRembourse || 0;
      totalFinance += mA;
      totalRembourse += mR;
      var rI = Math.round(mA * 0.10);
      totalReserveIndispo += rI;
      if (mA > 0 && mR >= mA) totalReserveDispo += rI;
      else if (mA > 0 && mR > 0) totalReserveDispo += Math.round(rI * mR / mA);
    }
    totalReserveIndispo -= totalReserveDispo;
    html += '<div class="dash-section" data-sub="dashboard.prefinancement" style="margin-top:20px">';

    html += '<div class="stat-card"><div class="stat-info"><div class="stat-value">' + fmtMoney(totalFinance) + '</div><div class="stat-label">Montant financ\u00e9</div></div></div>';
    html += '<div class="stat-card"><div class="stat-info"><div class="stat-value" style="color:var(--success)">' + fmtMoney(totalRembourse) + '</div><div class="stat-label">D\u00e9j\u00e0 rembours\u00e9</div></div></div>';
    html += '<div class="stat-card"><div class="stat-info"><div class="stat-value" style="color:var(--warning)">' + fmtMoney(totalReserveIndispo) + '</div><div class="stat-label">R\u00e9serve indisponible</div></div></div>';
    html += '<div class="stat-card"><div class="stat-info"><div class="stat-value" style="color:var(--success)">' + fmtMoney(totalReserveDispo) + '</div><div class="stat-label">R\u00e9serve disponible</div></div></div>';
    html += '</div>';
    html += '<div class="table-responsive"><table><thead><tr><th>Client</th><th>BC</th><th>Financ\u00e9</th><th>Rembours\u00e9</th><th>Reste</th><th>R\u00e9s. indispo</th><th>R\u00e9s. dispo</th><th>\u00c9ch\u00e9ance</th><th>Statut</th></tr></thead><tbody>';
    for (var pj = 0; pj < pfActifs.length; pj++) {
      var pf2 = pfActifs[pj];
      var clPf = getClientById(pf2.clientId);
      var bcPf = '-';
      if (pf2.bcId) { var bcObjPf = getBCById(pf2.bcId); bcPf = bcObjPf ? bcObjPf.numero : '-'; }
      var mA2 = pf2.montantAccorde || 0;
      var mR2 = pf2.montantRembourse || 0;
      var reste2 = Math.max(0, mA2 - mR2);
      var rI2 = Math.round(mA2 * 0.10);
      var rD2 = 0;
      if (mA2 > 0 && mR2 >= mA2) rD2 = rI2;
      else if (mA2 > 0 && mR2 > 0) rD2 = Math.round(rI2 * mR2 / mA2);
      var echDate = pf2.echeanceRemboursement || '';
      var daysLeft = echDate ? daysUntil(echDate) : 999;
      var isOverdue = daysLeft < 0;
      var statutLabel, statutColor;
      if (isOverdue) { statutLabel = 'Retard'; statutColor = 'var(--danger)'; }
      else if (daysLeft <= 30) { statutLabel = 'Moins 1 mois'; statutColor = 'var(--danger)'; }

      else { statutLabel = 'OK'; statutColor = 'var(--success)'; }
      html += '<tr style="cursor:pointer" onclick="navigateTo(\'prefinancement\')">';
      html += '<td class="fw-600">' + escH(clPf ? clPf.nom : '-') + '</td>';
      html += '<td>' + escH(bcPf) + '</td>';
      html += '<td class="fw-600">' + fmtMoney(mA2) + '</td>';
      html += '<td style="color:var(--success)">' + fmtMoney(mR2) + '</td>';
      html += '<td class="fw-600" style="color:' + (reste2 > 0 ? 'var(--danger)' : 'var(--success)') + '">' + fmtMoney(reste2) + '</td>';
      html += '<td style="color:var(--warning);font-weight:600">' + fmtMoney(rI2) + '</td>';
      html += '<td style="color:' + (rD2 > 0 ? 'var(--success)' : 'var(--gray-400)') + ';font-weight:600">' + fmtMoney(rD2) + '</td>';
      html += '<td>' + fmtDate(echDate) + '</td>';
      html += '<td><span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:' + statutColor + '"><span style="width:8px;height:8px;border-radius:50%;background:' + statutColor + ';display:inline-block"></span>' + statutLabel + (isOverdue ? ' (retard)' : '') + '</span></td>';
      html += '</tr>';
    }
    html += '</tbody></table></div></div>';
  }

  document.getElementById('content').innerHTML = html;
}
function togglePinClient(cb) {
  var clientId = cb.value;
  var pinned = DB.get('mdb_pinnedClients') || [];
  if (cb.checked) { if (pinned.indexOf(clientId) === -1) pinned.push(clientId); }
  else { var np = []; for (var i = 0; i < pinned.length; i++) { if (pinned[i] !== clientId) np.push(pinned[i]); } pinned = np; }
  DB.set('mdb_pinnedClients', pinned);
  renderDashboard();
}
function renderInContext() {
  if (currentPage === 'facturation') { renderFacturation(); return; }
  if (currentPage === 'tiers') { renderTiers(); return; }
  if (currentPage === 'bc') { _facturationTab='bc'; currentPage='facturation'; buildSidebar(); renderFacturation(); return; }
  if (currentPage === 'bl') { _facturationTab='bl'; currentPage='facturation'; buildSidebar(); renderFacturation(); return; }
  if (currentPage === 'factures') { _facturationTab='factures'; currentPage='facturation'; buildSidebar(); renderFacturation(); return; }
  if (currentPage === 'journal') { _facturationTab='factures'; _fjTab='journal'; currentPage='facturation'; buildSidebar(); renderFacturation(); return; }
  if (currentPage === 'nomenclature') { _facturationTab='nomenclature'; currentPage='facturation'; buildSidebar(); renderFacturation(); return; }
  var renderers = {dashboard:renderDashboard, prefinancement:renderPrefinancement, comptabilite:renderComptabilite,
    actif:renderActif, taches:renderTaches, licences:renderLicences, utilisateurs:renderUtilisateurs,
    entreprise:renderEntreprise, creance:renderCreance, fournisseurs:renderFournisseurs,
    tresorerie:renderTresorerie, employes:renderEmployesPage};
  if (renderers[currentPage]) renderers[currentPage]();
}

function toggleSelectAllBL(checked) {
  var cbs = document.querySelectorAll('.bl-list-select');
  for (var i = 0; i < cbs.length; i++) cbs[i].checked = checked;
  onBLListSelectChange();
}

function onBLListSelectChange() {
  var cbs = document.querySelectorAll('.bl-list-select:checked');
  var wrap = document.getElementById('blFactureBtnWrap');
  var warn = document.getElementById('blFactureWarning');
  var btn = document.getElementById('btnFactureFromBL');
  if (!wrap) return;
  if (cbs.length === 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  wrap.style.alignItems = 'center';
  wrap.style.gap = '8px';
  var clientIds = {};
  for (var i = 0; i < cbs.length; i++) {
    var cid = cbs[i].getAttribute('data-client');
    if (cid) clientIds[cid] = true;
  }
  var keys = [];
  for (var k in clientIds) { if (clientIds.hasOwnProperty(k)) keys.push(k); }
  if (keys.length > 1) {
    warn.style.display = 'inline';
    btn.disabled = true;
    btn.style.opacity = '0.5';
    btn.style.cursor = 'not-allowed';
  } else {
    warn.style.display = 'none';
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.style.cursor = 'pointer';
  }
}

function factureFromBL(blId) {
  var bls = getBLs();
  var bl = null;
  for (var i = 0; i < bls.length; i++) { if (bls[i].id === blId) { bl = bls[i]; break; } }
  if (!bl) { toast('BL introuvable', 'error'); return; }
  var lignes = [];
  if (bl.lignes) {
    for (var k = 0; k < bl.lignes.length; k++) {
      var src = bl.lignes[k];
      lignes.push({articleId:src.articleId||'', designation:src.designation||'', quantite:src.quantite||1, prixUnitaire:src.prixUnitaire||0, bcId:bl.bcId||'', blId:bl.id});
    }
  }
  _prefillFactureData = {clientId: bl.clientId, bcId: bl.bcId || '', lignes: lignes};
  navigateToFacturation('factures');
  setTimeout(function() { openFactureModal(); }, 150);
}

function factureFromBLList() {
  var cbs = document.querySelectorAll('.bl-list-select:checked');
  if (cbs.length === 0) { toast('Veuillez s\u00e9lectionner au moins un BL', 'error'); return; }
  var ids = [];
  var clientIds = {};
  for (var i = 0; i < cbs.length; i++) {
    ids.push(cbs[i].value);
    var cid = cbs[i].getAttribute('data-client');
    if (cid) clientIds[cid] = true;
  }
  var keys = [];
  for (var k in clientIds) { if (clientIds.hasOwnProperty(k)) keys.push(k); }
  if (keys.length > 1) { toast('Impossible : les BL s\u00e9lectionn\u00e9s sont sur des clients diff\u00e9rents', 'error'); return; }
  var bls = getBLs();
  var selectedBLs = [];
  for (var j = 0; j < ids.length; j++) {
    for (var m = 0; m < bls.length; m++) { if (bls[m].id === ids[j]) { selectedBLs.push(bls[m]); break; } }
  }
  var clientId = keys[0];
  var firstBC = selectedBLs.length > 0 ? selectedBLs[0].bcId || '' : '';
  var allLignes = [];
  for (var n = 0; n < selectedBLs.length; n++) {
    if (selectedBLs[n].lignes) {
      for (var p = 0; p < selectedBLs[n].lignes.length; p++) {
        var src = selectedBLs[n].lignes[p];
        allLignes.push({articleId:src.articleId||'', designation:src.designation||'', quantite:src.quantite||1, prixUnitaire:src.prixUnitaire||0, bcId:selectedBLs[n].bcId||'', blId:selectedBLs[n].id});
      }
    }
  }
  _prefillFactureData = {clientId: clientId, bcId: firstBC, blIds: ids, lignes: allLignes};
  navigateToFacturation('factures');
  setTimeout(function() { openFactureModal(); }, 150);
}

function filterBL() {
  var q = (document.getElementById('blSearch').value || '').toLowerCase();
  var fs = document.getElementById('blFilterStatut').value;
  var ff = document.getElementById('blFilterFacture').value;
  var rows = document.getElementById('blBody').getElementsByTagName('tr');
  for (var i = 0; i < rows.length; i++) {
    var s = rows[i].getAttribute('data-search') || '';
    var st = rows[i].getAttribute('data-statut') || '';
    var sf = rows[i].getAttribute('data-facture') || '';
    var show = s.indexOf(q) !== -1;
    if (fs) show = show && st === fs;
    if (ff) show = show && sf === ff;
    rows[i].style.display = show ? '' : 'none';
  }
}

function onBLClientChange(preserveBcId) {
  var clientId = document.getElementById('blClient').value;
  var bcSel = document.getElementById('blBC');
  if (!bcSel) return;
  if (!clientId) { bcSel.innerHTML = '<option value="">-- Aucun BC --</option>'; return; }
  var bcs = getBCs();
  var bcHtml = '<option value="">-- Aucun BC --</option>';
  for (var bi = 0; bi < bcs.length; bi++) {
    if (bcs[bi].clientId !== clientId) continue;
    if (bcs[bi].statut === 'livre' && bcs[bi].id !== preserveBcId) continue;
    var sel = (preserveBcId && bcs[bi].id === preserveBcId) ? ' selected' : '';
    bcHtml += '<option value="' + bcs[bi].id + '"' + sel + '>' + escH(bcs[bi].numero) + '</option>';
  }
  bcSel.innerHTML = bcHtml;
}

function onBLBCChange() {
  var bcId = document.getElementById('blBC').value;
  if (!bcId) return;
  var bc = getBCById(bcId);
  if (bc && bc.lignes && bc.lignes.length > 0) {
    formLignes = [];
    for (var j = 0; j < bc.lignes.length; j++) {
      var line = bc.lignes[j];
      formLignes.push({articleId:line.articleId||'', designation:line.designation||'', quantite:line.quantite||1, prixUnitaire:line.prixUnitaire||0});
    }
    renderFormLignes();
    toast('Lignes du BC ' + bc.numero + ' charg\u00e9es', 'success');
  }
}

function saveBL(id) {
  var clientId = document.getElementById('blClient').value;
  if (!clientId) { toast('Veuillez s\u00e9lectionner un client', 'error'); return; }
  var bls = getBLs();
  var data = {
    numero: document.getElementById('blNumero').value.trim(), clientId: clientId,
    dateLivraison: document.getElementById('blDate').value,
    statut: document.getElementById('blStatut').value, lignes: formLignes.slice(),
    bcId: document.getElementById('blBC').value || null,
    raisonNonFacture: (document.getElementById('blRaisonNonFacture') || {}).value || ''
  };
  if (id) {
    for (var i = 0; i < bls.length; i++) {
      if (bls[i].id === id) { data.id = id; data.factureId = bls[i].factureId; bls[i] = data; break; }
    }
  } else {
    data.id = DB.genId(); data.factureId = null; bls.push(data);
  }
  DB.set('mdb_bl', bls);
  closeModal();
  clearDraft('bl');
  toast('BL enregistr\u00e9');
  renderBL();
  buildSidebar();
}

function deleteBL(id) {
  openConfirm('\u00cates-vous s\u00fbr de vouloir supprimer ce BL ?', function() {
    var bls = getBLs(); var result = [];
    for (var i = 0; i < bls.length; i++) { if (bls[i].id !== id) result.push(bls[i]); }
    DB.set('mdb_bl', result);
    toast('BL supprim\u00e9');
    renderBL();
    buildSidebar();
  });
}

function saveFacture(id) {
  var clientId = document.getElementById('facClient').value;
  if (!clientId) { toast('Veuillez s\u00e9lectionner un client', 'error'); return; }
  var total = 0;
  for (var k = 0; k < formLignes.length; k++) { total += (formLignes[k].quantite || 0) * (formLignes[k].prixUnitaire || 0); }
  var blIds = [];
  for (var k2 = 0; k2 < formLignes.length; k2++) {
    if (formLignes[k2].blId && blIds.indexOf(formLignes[k2].blId) === -1) blIds.push(formLignes[k2].blId);
  }
  var bcIds = [];
  for (var k3 = 0; k3 < formLignes.length; k3++) {
    if (formLignes[k3].bcId && bcIds.indexOf(formLignes[k3].bcId) === -1) bcIds.push(formLignes[k3].bcId);
  }
  var statut = document.getElementById('facStatut').value;
  var tvaVal = document.getElementById('facTVA') ? document.getElementById('facTVA').value : 'non';
  var tvaAmount = tvaVal === 'oui' ? total * 0.16 : 0;
  var totalTTC = total + tvaAmount;
  var data = {
    numero: document.getElementById('facNumero').value.trim(), clientId: clientId,
    dateEmission: document.getElementById('facDate').value, echeance: document.getElementById('facEcheance').value,
    statut: statut, lignes: formLignes.slice(),
    total: total, tva: tvaVal, tvaAmount: tvaAmount, totalTTC: totalTTC,
    blIds: blIds, bcIds: bcIds
  };
  var factures = getFactures();
  var oldBlIds = [];
  if (id) {
    for (var i = 0; i < factures.length; i++) {
      if (factures[i].id === id) {
        oldBlIds = factures[i].blIds || (factures[i].blId ? [factures[i].blId] : []);
        data.id = id;
        data.montantPaye = factures[i].montantPaye || 0;
        factures[i] = data;
        break;
      }
    }
  } else {
    data.id = DB.genId(); data.montantPaye = 0; factures.push(data);
  }
  DB.set('mdb_factures', factures);
  if (statut === 'brouillon') {
    if (id) updateBLFactureLinks(oldBlIds, [], null);
  } else {
    updateBLFactureLinks(oldBlIds, blIds, data.id);
  }
  closeModal();
  clearDraft('factures');
  toast('Facture enregistr\u00e9e');
  renderFactures();
  buildSidebar();
}

function updateBLFactureLinks(oldBlIds, newBlIds, facId) {
  var bls = getBLs();
  for (var i = 0; i < bls.length; i++) {
    if (oldBlIds.indexOf(bls[i].id) !== -1) bls[i].factureId = null;
    if (newBlIds.indexOf(bls[i].id) !== -1) bls[i].factureId = facId;
  }
  DB.set('mdb_bl', bls);
}

function deleteFacture(id) {
  openConfirm('\u00cates-vous s\u00fbr de vouloir supprimer cette facture ?', function() {
    var factures = getFactures(); var blIds = []; var result = [];
    for (var i = 0; i < factures.length; i++) {
      if (factures[i].id === id) blIds = factures[i].blIds || (factures[i].blId ? [factures[i].blId] : []);
      else result.push(factures[i]);
    }
    DB.set('mdb_factures', result);
    if (blIds.length > 0) updateBLFactureLinks(blIds, [], null);
    toast('Facture supprim\u00e9e');
    renderFactures();
    buildSidebar();
  });
}

function onPFEcheanceChange() {

  var info = document.getElementById('pfBCInfo');
  if (!bcSel || !info) return;
  if (!bcSel.value) { info.innerHTML = ''; return; }
  var bc = getBCById(bcSel.value);
  if (!bc) { info.innerHTML = ''; return; }
  var totalHT = 0;
  if (bc.lignes) {
    for (var i = 0; i < bc.lignes.length; i++) {
      totalHT += (bc.lignes[i].quantite || 0) * (bc.lignes[i].prixUnitaire || 0);
    }
  }
  var tva = totalHT * 0.18;
  var ttc = totalHT + tva;
  var html = '<div class="card" style="padding:12px;margin-top:8px;background:var(--primary-light);border:1px solid var(--primary);border-radius:8px">';
  html += '<strong>BC : ' + escH(bc.numero || '(sans num\u00e9ro)') + '</strong><br>';
  html += 'Total HT : <strong>' + fmtMoney(totalHT) + '</strong><br>';
  html += 'TVA (18%) : ' + fmtMoney(tva) + '<br>';
  html += '<strong style="color:var(--primary);font-size:16px">Total TTC : ' + fmtMoney(ttc) + '</strong>';
  html += '</div>';
  info.innerHTML = html;
  var htEl = document.getElementById('pfTotalHT');
  if (htEl) htEl.value = totalHT;
  calcPFMontant();
}

function calcPFMontant() {
  var tauxEl = document.getElementById('pfTaux');
  var htEl = document.getElementById('pfTotalHT');
  var montantEl = document.getElementById('pfMontantAccorde');
  if (!tauxEl || !htEl || !montantEl) return;
  var taux = parseFloat(tauxEl.value) || 0;
  var totalHT = parseFloat(htEl.value) || 0;
  var montant = Math.round(totalHT * taux / 100);
  montantEl.value = montant;
}
