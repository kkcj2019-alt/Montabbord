function saveReglement(id) {
  var clientId = document.getElementById('regClient').value;
  var montant = parseFloat(document.getElementById('regMontant').value) || 0;
  if (!clientId || !montant) { toast('Client et montant sont obligatoires', 'error'); return; }
  var factureId = document.getElementById('regFacture').value;
  var data = {clientId:clientId, factureId:factureId||null, date:document.getElementById('regDate').value, montant:montant, modePaiement:document.getElementById('regMode').value, reference:document.getElementById('regRef').value.trim(), notes:document.getElementById('regNotes').value.trim()};
  var regs = getReglements();
  var oldReg = null;
  if (id) {
    for (var i = 0; i < regs.length; i++) { if (regs[i].id === id) { oldReg = regs[i]; data.id = id; regs[i] = data; break; } }
  } else { data.id = DB.genId(); regs.push(data); }
  DB.set('mdb_reglements', regs);
  updateFactureFromReglement(oldReg, data);
  closeModal();
  toast('R\u00e8glement enregistr\u00e9');
  renderTresorerie();
  buildSidebar();
}

function updateFactureFromReglement(oldReg, newReg) {
  var factures = getFactures();
  if (oldReg && oldReg.factureId) {
    for (var i = 0; i < factures.length; i++) {
      if (factures[i].id === oldReg.factureId) {
        factures[i].montantPaye = Math.max(0, (factures[i].montantPaye || 0) - (oldReg.montant || 0));
        updateFactureStatut(factures[i]);
        break;
      }
    }
  }
  if (newReg && newReg.factureId) {
    for (var j = 0; j < factures.length; j++) {
      if (factures[j].id === newReg.factureId) {
        factures[j].montantPaye = (factures[j].montantPaye || 0) + (newReg.montant || 0);
        updateFactureStatut(factures[j]);
        break;
      }
    }
  }
  DB.set('mdb_factures', factures);
}

function updateFactureStatut(f) {
  var restant = (f.total || 0) - (f.montantPaye || 0);
  if (restant <= 0) f.statut = 'payee';
  else if (f.montantPaye > 0) f.statut = 'partielle';
}

function deleteReglement(id) {
  if (!window.confirm('\u00cates-vous s\u00fbr de vouloir supprimer ce r\u00e8glement ?')) return;
  var regs = getReglements(); var oldReg = null; var result = [];
  for (var i = 0; i < regs.length; i++) { if (regs[i].id === id) oldReg = regs[i]; else result.push(regs[i]); }
  DB.set('mdb_reglements', result);
  if (oldReg) updateFactureFromReglement(oldReg, null);
  toast('R\u00e8glement supprim\u00e9');
  renderTresorerie();
  buildSidebar();
}

function openRubriqueModal(id) {
  var rub = null;
  if (id) { var actif = getActif(); for (var i = 0; i < actif.rubriques.length; i++) { if (actif.rubriques[i].id === id) { rub = actif.rubriques[i]; break; } } }

}

function saveRubrique(id) {
  var nom = document.getElementById('rubNom').value.trim();
  if (!nom) { toast('Le nom est obligatoire', 'error'); return; }
  var actif = getActif();
  if (id) {
    for (var i = 0; i < actif.rubriques.length; i++) { if (actif.rubriques[i].id === id) { actif.rubriques[i].nom = nom; break; } }
  } else {
    actif.rubriques.push({id:DB.genId(), nom:nom, lignes:[]});
  }
  DB.set('mdb_actif', actif);
  closeModal();
  toast('Rubrique enregistr\u00e9e');

}

function deleteRubrique(id) {
  openConfirm('\u00cates-vous s\u00fbr de vouloir supprimer cette rubrique ?', function() {
    var actif = getActif(); var result = [];
    for (var i = 0; i < actif.rubriques.length; i++) { if (actif.rubriques[i].id !== id) result.push(actif.rubriques[i]); }

    DB.set('mdb_actif', actif);

function openLigneModal(rubId, lineId) {
  var line = null;
  var actif = getActif();
  for (var i = 0; i < actif.rubriques.length; i++) {
    if (actif.rubriques[i].id === rubId && actif.rubriques[i].lignes) {
      for (var j = 0; j < actif.rubriques[i].lignes.length; j++) {
        if (actif.rubriques[i].lignes[j].id === lineId) { line = actif.rubriques[i].lignes[j]; break; }
      }
      break;
    }
  }
  var title = line ? 'Modifier la ligne' : 'Nouvelle ligne';
  var html = '<div class="form-group"><label>D\u00e9signation *</label><input type="text" id="ligneDesig" value="' + escH(line ? line.designation : '') + '"></div>';
  html += '<div class="form-group"><label>Montant *</label><input type="number" id="ligneMontant" value="' + (line ? line.montant || '' : '') + '" min="0"></div>';
  var footer = '<button class="btn btn-outline" onclick="closeModal()">Annuler</button>';
  footer += '<button class="btn btn-primary" onclick="saveLigne(\'' + rubId + '\',\'' + (lineId || '') + '\')">Enregistrer</button>';
  openFormModal(title, html, footer);
}

function saveLigne(rubId, lineId) {
  var desig = document.getElementById('ligneDesig').value.trim();
  var montant = parseFloat(document.getElementById('ligneMontant').value) || 0;
  if (!desig) { toast('La d\u00e9signation est obligatoire', 'error'); return; }
  var actif = getActif();
  for (var i = 0; i < actif.rubriques.length; i++) {
    if (actif.rubriques[i].id === rubId) {
      if (!actif.rubriques[i].lignes) actif.rubriques[i].lignes = [];
      if (lineId) {
        for (var j = 0; j < actif.rubriques[i].lignes.length; j++) {
          if (actif.rubriques[i].lignes[j].id === lineId) {
            actif.rubriques[i].lignes[j].designation = desig;
            actif.rubriques[i].lignes[j].montant = montant;
            break;
          }
        }
      } else {
        actif.rubriques[i].lignes.push({id:DB.genId(), designation:desig, montant:montant});
      }
      break;
    }
  }
  DB.set('mdb_actif', actif);
  closeModal();
  toast('Ligne enregistr\u00e9e');
  renderActif();
}

function deleteLigne(rubId, lineId) {
  openConfirm('\u00cates-vous s\u00fbr de vouloir supprimer cette ligne ?', function() {
    var actif = getActif();
    for (var i = 0; i < actif.rubriques.length; i++) {
      if (actif.rubriques[i].id === rubId && actif.rubriques[i].lignes) {
        var result = [];
        for (var j = 0; j < actif.rubriques[i].lignes.length; j++) {
          if (actif.rubriques[i].lignes[j].id !== lineId) result.push(actif.rubriques[i].lignes[j]);
        }
        actif.rubriques[i].lignes = result;
        break;
      }
    }
    DB.set('mdb_actif', actif);
    toast('Ligne supprim\u00e9e');
    renderActif();
  });
}

function renderTaches() {
  var data = getTaches();
  var userId = currentUser ? currentUser.id : '';
  var filtered = [];
  for (var i = 0; i < data.length; i++) {
    if (!data[i].userId || data[i].userId === userId) filtered.push(data[i]);
  }
  var html = '<div class="toolbar">';
  html += '<input type="text" placeholder="Rechercher..." id="searchTaches" oninput="filterTaches()">';
  html += '<select id="filterTacheStatut" onchange="filterTaches()"><option value="">Tous statuts</option><option value="a_faire">\u00c0 faire</option><option value="en_cours">En cours</option><option value="termine">Termin\u00e9e</option></select>';
  html += '<div style="flex:1"></div>';
  if (!isReadonly('taches')) html += '<button class="btn btn-primary" onclick="openTacheModal()">+ Nouvelle</button>';
  html += '</div>';
  html += '<div class="card"><div class="card-body no-pad"><table><thead><tr><th>Titre</th><th>D\u00e9but</th><th>Limite</th><th>Fin</th><th>Priorit\u00e9</th><th>Statut</th><th style="width:100px">Actions</th></tr></thead><tbody id="tachesTableBody"></tbody></table></div></div>';
  document.getElementById('content').innerHTML = html;
  filterTaches();
}
function filterTaches() {
  var q = (document.getElementById('searchTaches') || {} ).value || '';
  q = q.toLowerCase();
  var sf = (document.getElementById('filterTacheStatut') || {}).value || '';
  var data = getTaches();
  var userId = currentUser ? currentUser.id : '';
  var result = [];
  for (var i = 0; i < data.length; i++) {
    var t = data[i];
    if (t.userId && t.userId !== userId) continue;
    if (q && (t.titre + ' ' + (t.description || '')).toLowerCase().indexOf(q) < 0) continue;
    if (sf && t.statut !== sf) continue;
    result.push(t);
  }
  var prio = {urgente: 0, haute: 1, moyenne: 2, basse: 3};
  result.sort(function(a, b) {
    if (a.statut === 'termine' && b.statut !== 'termine') return 1;
    if (a.statut !== 'termine' && b.statut === 'termine') return -1;
    return (prio[a.priorite] || 2) - (prio[b.priorite] || 2);
  });
  var stBadge = {a_faire: '<span class="badge badge-primary">\u00c0 faire</span>', en_cours: '<span class="badge badge-purple">En cours</span>', termine: '<span class="badge badge-success">Termin\u00e9e</span>'};
  var prioLabel = {basse: 'Basse', moyenne: 'Moyenne', haute: 'Haute', urgente: 'Urgente'};
  var prioColor = {basse: 'var(--gray-400)', moyenne: 'var(--primary)', haute: 'var(--warning)', urgente: 'var(--danger)'};
  var tb = document.getElementById('tachesTableBody');
  if (!tb) return;
  if (!result.length) { tb.innerHTML = '<tr><td colspan="7"><div class="empty-state"><p>Aucune t\u00e2che</p></div></td></tr>'; return; }
  var html = '';
  for (var i = 0; i < result.length; i++) {
    var t = result[i];
    var ov = t.statut !== 'termine' && t.dateLimite && daysUntil(t.dateLimite) < 0;
    html += '<tr' + (ov ? ' style="background:var(--danger-light)"' : '') + '>';
    html += '<td><strong>' + escH(t.titre) + '</strong>' + (t.description ? '<br><small class="text-muted">' + escH(t.description.substring(0, 40)) + '</small>' : '') + '</td>';
    html += '<td>' + fmtDate(t.dateDebut) + '</td>';
    html += '<td>' + fmtDate(t.dateLimite) + (ov ? '<br><small style="color:var(--danger);font-weight:600">En retard !</small>' : '') + '</td>';
    html += '<td>' + fmtDate(t.dateFin) + '</td>';
    html += '<td><span style="color:' + (prioColor[t.priorite] || 'var(--gray-400)') + ';font-weight:600;font-size:12px">' + (prioLabel[t.priorite] || t.priorite) + '</span></td>';
    html += '<td>' + (stBadge[t.statut] || t.statut) + '</td>';
    html += '<td>';
    if (!isReadonly('taches')) {
      html += '<button class="btn-icon" onclick="openTacheModal(\'' + t.id + '\')" title="Modifier"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button> ';
      html += '<button class="btn-icon danger" onclick="deleteTache(\'' + t.id + '\')" title="Supprimer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>';
    }
    html += '</td></tr>';
  }
  tb.innerHTML = html;
}
function openTacheModal(id) {
  var t = null;
  if (id) { var list = getTaches(); for (var i = 0; i < list.length; i++) { if (list[i].id === id) { t = list[i]; break; } } }
  var body = '';
  body += '<div class="form-group"><label>Titre *</label><input type="text" id="fTitre" value="' + escH(t ? t.titre : '') + '"></div>';

  body += '<div class="form-group"><label>Date limite *</label><input type="date" id="fDateLimite" value="' + (t ? t.dateLimite : '') + '"></div></div>';
  body += '<div class="form-row"><div class="form-group"><label>Date fin</label><input type="date" id="fDateFin" value="' + (t ? t.dateFin || '' : '') + '"></div>';
  body += '<div class="form-group"><label>Statut</label><select id="fStatut"><option value="a_faire"' + (t && t.statut === 'a_faire' ? ' selected' : '') + '>\u00c0 faire</option><option value="en_cours"' + (t && t.statut === 'en_cours' ? ' selected' : '') + '>En cours</option><option value="termine"' + (t && t.statut === 'termine' ? ' selected' : '') + '>Termin\u00e9e</option></select></div></div>';
  body += '<div class="form-group"><label>Priorit\u00e9</label><select id="fPriorite"><option value="basse"' + (t && t.priorite === 'basse' ? ' selected' : '') + '>Basse</option><option value="moyenne"' + (!t || t.priorite === 'moyenne' ? ' selected' : '') + '>Moyenne</option><option value="haute"' + (t && t.priorite === 'haute' ? ' selected' : '') + '>Haute</option><option value="urgente"' + (t && t.priorite === 'urgente' ? ' selected' : '') + '>Urgente</option></select></div>';

  openFormModal(t ? 'Modifier la t\u00e2che' : 'Nouvelle t\u00e2che', body, footer);
}
function saveTache(id) {
  var titre = document.getElementById('fTitre').value.trim();
  var dateDebut = document.getElementById('fDateDebut').value;
  var dateLimite = document.getElementById('fDateLimite').value;
  if (!titre || !dateDebut || !dateLimite) { toast('Remplir les champs obligatoires', 'error'); return; }
  var data = {
    id: id || DB.genId(), titre: titre, description: document.getElementById('fDesc').value.trim(),
    dateDebut: dateDebut, dateLimite: dateLimite, dateFin: document.getElementById('fDateFin').value,
    statut: document.getElementById('fStatut').value, priorite: document.getElementById('fPriorite').value,
    dateCreation: id ? undefined : getToday(),
    userId: currentUser ? currentUser.id : ''
  };
  if (data.statut === 'termine' && !data.dateFin) data.dateFin = getToday();
  var list = getTaches();
  if (id) { for (var i = 0; i < list.length; i++) { if (list[i].id === id) { data.dateCreation = list[i].dateCreation; data.userId = list[i].userId || data.userId; list[i] = data; break; } } }
  else list.push(data);
  DB.set('mdb_taches', list);
  closeModal();
  toast(id ? 'T\u00e2che modifi\u00e9e' : 'T\u00e2che cr\u00e9\u00e9e');
  renderTaches();
}
function deleteTache(id) {
  openConfirm('Supprimer cette t\u00e2che ?', function() {
    var list = getTaches();
    var result = [];
    for (var i = 0; i < list.length; i++) { if (list[i].id !== id) result.push(list[i]); }
    DB.set('mdb_taches', result);
    toast('T\u00e2che supprim\u00e9e');
    renderTaches();
  });
}

function setUserType(type) {
  var wrap = document.getElementById('fUSectionsWrap');

    if (r) {
      var isActive = r.value === type;
      var col = r.value === 'admin' ? 'var(--success)' : (r.value === 'petit_admin' ? 'var(--warning)' : 'var(--primary)');
      var bg = r.value === 'admin' ? 'var(--success-light)' : (r.value === 'petit_admin' ? 'var(--warning-light)' : 'var(--primary-light)');
      l.style.borderColor = isActive ? col : 'var(--gray-300)';
      l.style.background = isActive ? bg : 'var(--gray-50)';
    }
  });

function saveUser(id) {
  var nom = document.getElementById('fUNom').value.trim();
  var login = document.getElementById('fULogin').value.trim();
  var pass = document.getElementById('fUPass').value;
  var pass2 = document.getElementById('fUPass2').value;
  var typeEl = document.querySelector('input[name="fUType"]:checked');
  var adminType = typeEl ? typeEl.value : 'user';
  var isAdmin = adminType === 'admin';
  if (!nom || !login) { toast('Remplir les champs obligatoires', 'error'); return; }
  if (!id && !pass) { toast('Mot de passe requis', 'error'); return; }
  if (pass && pass !== pass2) { toast('Les mots de passe ne correspondent pas', 'error'); return; }
  var sections = {};
  var deniedPages = [];
  var pageList = ['dashboard', 'tiers', 'facturation', 'nomenclature', 'prefinancement', 'comptabilite', 'actif', 'taches', 'tresorerie', 'creance', 'employes', 'licences', 'utilisateurs', 'entreprise'];
  if (adminType === 'petit_admin') {
    for (var i = 0; i < pageList.length; i++) {
      var cb = document.getElementById('fUDeny_' + pageList[i]);
      if (cb && cb.checked) deniedPages.push(pageList[i]);
    }
  } else if (adminType === 'user') {
    for (var i = 0; i < pageList.length; i++) {
      var sel = document.getElementById('fUSec_' + pageList[i]);
      if (sel && sel.value) sections[pageList[i]] = sel.value;
      var subs = pageSubsections[pageList[i]] || [];
      for (var sj = 0; sj < subs.length; sj++) {
        var cb = document.getElementById('fUSub_' + pageList[i] + '_' + subs[sj].key);
        if (cb) sections[pageList[i] + '.' + subs[sj].key] = cb.checked;
      }
    }
  }
  var data = { id: id || DB.genId(), nom: nom, login: login, sections: sections, isAdmin: isAdmin, adminType: adminType, deniedPages: deniedPages, dateCreation: id ? undefined : getToday() };
  var caisseSelect = document.getElementById('fUCaisse');
  data.caisseId = caisseSelect ? caisseSelect.value : '';
  if (pass) data.password = pass;
  var list = getUsers();
  if (id) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) {
        data.dateCreation = list[i].dateCreation;
        if (!pass) data.password = list[i].password;
        list[i] = data;
        break;
      }
    }
  } else {
    data.password = pass;
    list.push(data);
  }
  DB.set('mdb_users', list);
  closeModal();
  toast(id ? 'Utilisateur modifi\u00e9' : 'Utilisateur cr\u00e9\u00e9');
  renderUtilisateurs();
}

function generateLicenceKey(count) {
  if (!currentUser || !currentUser.isAdmin) { toast('R\u00e9serv\u00e9 \u00e0 l\'administrateur', 'error'); return; }
  if (!firebaseDb) { toast('Firebase non disponible', 'error'); return; }
  count = count || 1;
  var plan = document.getElementById('lcPlan').value;
  var note = document.getElementById('lcNote').value.trim();
  var isReferral = document.getElementById('lcReferral').checked;
  var generated = 0;
  var promises = [];
  for (var i = 0; i < count; i++) {
    (function(idx) {
      var key = generateKeyString();
      var data = {
        plan: isReferral ? 'lifetime' : plan,
        used: false, usedBy: '', usedAt: '',
        createdAt: getToday(), createdBy: currentUser.id,
        isReferral: isReferral, note: note
      };
      promises.push(firebaseDb.collection('licenseKeys').doc(key).set(data).then(function() {
        generated++;
      }));
    })(i);
  }
  Promise.all(promises).then(function() {
    toast(generated + ' cl\u00e9(s) g\u00e9n\u00e9r\u00e9e(s) avec succ\u00e8s !', 'success');
    document.getElementById('lcNote').value = '';
    loadLicenceKeysList();
  }).catch(function(e) {
    toast('Erreur : ' + e.message, 'error');
  });
}
function generateKeyString() {
  var chars = '0123456789ABCDEF';
  var parts = [];
  for (var i = 0; i < 4; i++) {
    var part = '';
    for (var j = 0; j < 4; j++) {
      part += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    parts.push(part);
  }
  return parts.join('-');
}
function activateLicenceKey() {
  var key = document.getElementById('lcActivateKey').value.trim().toUpperCase();
  if (!key) { toast('Veuillez entrer une cl\u00e9', 'error'); return; }
  if (!firebaseDb) { toast('Firebase non disponible', 'error'); return; }
  if (!currentUser || !currentUser.id) { toast('Connectez-vous d\'abord', 'error'); return; }
  firebaseDb.collection('licenseKeys').doc(key).get().then(function(doc) {
    if (!doc.exists) {
      if (key === 'MDB-DEV-2024') {
        return {plan: 'lifetime', isReferral: true, special: true};
      }
      toast('Cl\u00e9 invalide', 'error'); return null;
    }
    var data = doc.data();
    if (data.used) { toast('Cette cl\u00e9 a d\u00e9j\u00e0 \u00e9t\u00e9 utilis\u00e9e', 'error'); return null; }
    return data;
  }).then(function(result) {
    if (!result) return;
    var plan = result.plan || 'basic';
    var isReferral = result.isReferral || false;
    var status = isReferral ? 'lifetime' : 'active';
    var subData = {status: status, plan: plan, licenceKey: key, startDate: getToday(), endDate: '', paymentMethod: 'licence'};
    if (!result.special) {
      firebaseDb.collection('licenseKeys').doc(key).update({used: true, usedBy: currentUser.id, usedAt: getToday()}).catch(function(){});
    }
    firebaseDb.collection('enterprises').doc(currentUser.id).set({subscription: subData}, {merge: true}).then(function() {
      var ent = getEntreprise();
      ent.subscription = subData;
      DB.set('mdb_entreprise', ent);
      toast('Licence activ\u00e9e avec succ\u00e8s ! Forfait : ' + plan + (isReferral ? ' (\u00e0 vie)' : ''), 'success');
      var el = document.getElementById('lcActivateKey');
      if (el) el.value = '';
      if (currentPage === 'licences') renderLicences();
      if (currentPage === 'entreprise') renderEntreprise();
    });
  }).catch(function(e) {
    toast('Erreur : ' + e.message, 'error');
  });
}

function generateSadminEntId(uid) {
  if (!firebaseDb) { toast('Firebase non disponible', 'error'); return; }
  var ent = null;
  for (var i = 0; i < _saAllEnts.length; i++) {
    if (_saAllEnts[i].id === uid) { ent = _saAllEnts[i]; break; }
  }
  if (!ent) { toast('Entreprise introuvable', 'error'); return; }
  var baseId = ent.nom.toLowerCase().replace(/[^a-z0-9]/g, '').substring(0, 12) || 'ent';
  var idsToTry = [];
  for (var s = 0; s < 20; s++) {
    idsToTry.push(baseId + (s === 0 ? '' : s));
  }
  var checkNext = function(idx) {
    if (idx >= idsToTry.length) { toast('Impossible de trouver un identifiant libre', 'error'); return; }
    firebaseDb.collection('enterpriseIndex').doc(idsToTry[idx]).get().then(function(doc) {
      if (doc.exists) {
        checkNext(idx + 1);
      } else {
        var newId = idsToTry[idx];
        firebaseDb.collection('enterprises').doc(uid).get().then(function(entDoc) {
          var needsUsers = false;
          if (!entDoc.exists || !entDoc.data().mdb_users || entDoc.data().mdb_users.length === 0) {
            needsUsers = true;
          }
          var p1 = firebaseDb.collection('enterpriseIndex').doc(newId).set({uid: uid, email: ent.email, nom: ent.nom});
          var p2 = firebaseDb.collection('enterprises').doc(uid).set({identifiant: newId}, {merge: true});
          var promises = [p1, p2];
          if (needsUsers) {
            var defaultUsers = [{id: DB.genId(), nom: 'Administrateur', login: 'admin', password: 'admin123', isAdmin: true, sections: {}}];
            promises.push(firebaseDb.collection('enterprises').doc(uid).set({mdb_users: defaultUsers}, {merge: true}));
          }
          Promise.all(promises).then(function() {
            toast('Identifiant g\u00e9n\u00e9r\u00e9 : ' + newId + (needsUsers ? ' + utilisateurs par d\u00e9faut' : ''));
            ent.identifiant = newId;
            loadSadminEnts();
          }).catch(function(e) {
            toast('Erreur : ' + e.message, 'error');
          });
        });
      }
    });
  };
  checkNext(0);
}

function generateAllMissingIds() {
  if (!firebaseDb) { toast('Firebase non disponible', 'error'); return; }
  var missing = [];
  for (var i = 0; i < _saAllEnts.length; i++) {
    if (!_saAllEnts[i].identifiant) missing.push(_saAllEnts[i]);
  }
  if (missing.length === 0) { toast('Toutes les entreprises ont d\u00e9j\u00e0 un identifiant'); return; }
  openConfirm('G\u00e9n\u00e9rer des identifiants pour ' + missing.length + ' entreprise(s) ?', function() {
    var done = 0;
    var errors = 0;
    var processNext = function(idx) {
      if (idx >= missing.length) {
        toast(done + ' identifiants g\u00e9n\u00e9r\u00e9s' + (errors ? ', ' + errors + ' erreurs' : ''));
        loadSadminEnts();
        return;
      }
      var ent = missing[idx];
      var baseId = ent.nom.toLowerCase().replace(/[^a-z0-9]/g, '').substring(0, 12) || 'ent';
      var idsToTry = [];
      for (var s = 0; s < 20; s++) {
        idsToTry.push(baseId + (s === 0 ? '' : s));
      }
      var tryId = function(attempt) {
        if (attempt >= idsToTry.length) { errors++; processNext(idx + 1); return; }
        firebaseDb.collection('enterpriseIndex').doc(idsToTry[attempt]).get().then(function(doc) {
          if (doc.exists) { tryId(attempt + 1); }
          else {
            var newId = idsToTry[attempt];
            firebaseDb.collection('enterpriseIndex').doc(newId).set({uid: ent.id, email: ent.email, nom: ent.nom}).then(function() {
              firebaseDb.collection('enterprises').doc(ent.id).set({identifiant: newId}, {merge: true}).then(function() {
                done++; processNext(idx + 1);
              });
            }).catch(function() { errors++; processNext(idx + 1); });
          }
        }).catch(function() { errors++; processNext(idx + 1); });
      };
      tryId(0);
    };
    processNext(0);
  });
}

function doSadminCreateEnt() {
  if (!firebaseDb) { toast('Firebase non disponible', 'error'); return; }
  var entId = document.getElementById('saNewEntId').value.trim().toLowerCase();
  var nom = document.getElementById('saNewEntNom').value.trim();
  var email = document.getElementById('saNewEntEmail').value.trim();
  var tel = document.getElementById('saNewEntTel').value.trim();
  var plan = document.getElementById('saNewEntPlan').value;
  var status = document.getElementById('saNewEntStatus').value;
  var pass = document.getElementById('saNewEntPass').value;
  var licenceCode = document.getElementById('saNewEntLicence').value.trim().toUpperCase();
  if (!entId || !nom) { toast('Identifiant et nom requis', 'error'); return; }
  if (pass.length < 6) { toast('Mot de passe min. 6 caract\u00e8res', 'error'); return; }
  closeModal();
  var overlay = document.getElementById('loadingOverlay');
  if (overlay) overlay.style.display = 'flex';
  firebaseDb.collection('enterpriseIndex').doc(entId).get().then(function(doc) {
    if (doc.exists) { toast('Identifiant d\u00e9j\u00e0 utilis\u00e9', 'error'); throw 'duplicate'; }
    var fbEmail = email || (entId.replace(/[^a-z0-9]/g, '_') + '@mdb.app');
    return firebaseAuth.createUserWithEmailAndPassword(fbEmail, pass).then(function(cred) {
      return cred.user.updateProfile({displayName: nom}).then(function() {
        var validatedPlan = plan;
        var validatedStatus = status;
        var validatedLicence = '';
        var checkLicence = function() {
          if (!licenceCode) return Promise.resolve();
          if (licenceCode === 'MDB-DEV-2024') {
            validatedPlan = 'enterprise';
            validatedStatus = 'lifetime';
            validatedLicence = 'MDB-DEV-2024';
            return Promise.resolve();
          }
          return firebaseDb.collection('licenseKeys').doc(licenceCode).get().then(function(dk) {
            if (dk.exists) {
              validatedPlan = dk.data().plan || plan;
              validatedStatus = 'active';
              validatedLicence = licenceCode;
            }
          });
        };
        return checkLicence().then(function() {
          var enterpriseData = {
            identifiant: entId, nom: nom, email: email, telephone: tel, plan: validatedPlan,
            dateCreation: getToday(),
            subscription: {status: validatedStatus, plan: validatedPlan, startDate: getToday(), endDate: '', paymentMethod: validatedLicence ? 'licence' : '', licenceKey: validatedLicence},
            adresse: '', siret: '', nui: '', rc: '', rcs: '', formeJuridique: '', regimeFiscal: '', banque: '', rib: ''
          };
          return firebaseDb.collection('enterprises').doc(cred.user.uid).set(enterpriseData).then(function() {
            var users = [{id: DB.genId(), nom: 'Administrateur', login: entId, email: email || (entId + '@mdb.app'), password: pass, isAdmin: true, sections: {}}];
            return firebaseDb.collection('enterprises').doc(cred.user.uid).set({mdb_users: users}, {merge: true}).then(function() {
              return firebaseDb.collection('enterpriseIndex').doc(entId).set({uid: cred.user.uid, email: email, nom: nom});
            }).then(function() {
              if (validatedLicence && validatedLicence !== 'MDB-DEV-2024') {
                firebaseDb.collection('licenseKeys').doc(validatedLicence).update({used: true, usedBy: cred.user.uid, usedAt: getToday()}).catch(function(){});
              }
            });
          });
        });
      });
    }).then(function() {
      if (overlay) overlay.style.display = 'none';
      loadSadminEnts();
      var credsBody = '<div style="background:var(--success-bg);border:1px solid var(--success);border-radius:8px;padding:16px;margin-bottom:12px"><p style="margin:0 0 8px;font-weight:600;color:var(--success)">\u2713 Entreprise cr\u00e9\u00e9e avec succ\u00e8s</p></div>';
      credsBody += '<p style="font-size:13px;color:var(--gray-600);margin-bottom:12px">Voici les identifiants de connexion pour <strong>' + escH(nom) + '</strong> :</p>';
      credsBody += '<div style="background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;padding:16px;margin-bottom:8px">';
      credsBody += '<div style="margin-bottom:8px"><span style="font-size:12px;color:var(--gray-500)">Identifiant entreprise</span><br><strong id="saCredEntId" style="font-size:15px">' + escH(entId) + '</strong></div>';
      credsBody += '<div style="margin-bottom:8px"><span style="font-size:12px;color:var(--gray-500)">Identifiant utilisateur</span><br><strong id="saCredLogin" style="font-size:15px">' + escH(entId) + '</strong></div>';
      credsBody += '<div><span style="font-size:12px;color:var(--gray-500)">Mot de passe</span><br><strong id="saCredPass" style="font-size:15px">' + escH(pass) + '</strong></div>';
      credsBody += '</div>';
      credsBody += '<p style="font-size:12px;color:var(--gray-500);margin:0">L\'identifiant utilisateur est identique \u00e0 l\'identifiant entreprise.</p>';
      var credsFooter = '<button class="btn btn-outline" onclick="closeModal()">Fermer</button>';
      openFormModal('Identifiants de connexion', credsBody, credsFooter, false);
    }).catch(function(e) {
      if (overlay) overlay.style.display = 'none';
      if (e === 'duplicate') return;
      toast('Erreur : ' + (e.message || 'inconnue'), 'error');
    });
  });
}

    banque: document.getElementById('entBanque').value.trim(),
    rib: document.getElementById('entRIB').value.trim(),
    prefinancementDureeDefaut: parseInt(document.getElementById('entPFDuree').value) || 6
  };

  toast('Entreprise enregistr\u00e9e');

function activateEnterpriseLicence() {
  var key = document.getElementById('entLicenceKey').value.trim().toUpperCase();
  if (!key) { toast('Veuillez entrer une cl\u00e9', 'error'); return; }
  if (!firebaseDb) { toast('Firebase non disponible', 'error'); return; }
  if (!currentUser || !currentUser.id) { toast('Connectez-vous d\'abord', 'error'); return; }
  firebaseDb.collection('licenseKeys').doc(key).get().then(function(doc) {
    if (!doc.exists) {
      if (key === 'MDB-DEV-2024') return {plan: 'enterprise', isReferral: true, special: true};
      toast('Cl\u00e9 invalide', 'error'); return null;
    }
    var d = doc.data();
    if (d.used) { toast('Cette cl\u00e9 a d\u00e9j\u00e0 \u00e9t\u00e9 utilis\u00e9e', 'error'); return null; }
    return d;
  }).then(function(result) {
    if (!result) return;
    var plan = result.plan || 'basic';
    var isReferral = result.isReferral || false;
    var status = isReferral ? 'lifetime' : 'active';
    var subData = {status: status, plan: plan, licenceKey: key, startDate: getToday(), endDate: '', paymentMethod: 'licence'};
    if (!result.special) {
      firebaseDb.collection('licenseKeys').doc(key).update({used: true, usedBy: currentUser.id, usedAt: getToday()}).catch(function(){});
    }
    firebaseDb.collection('enterprises').doc(currentUser.id).set({subscription: subData}, {merge: true}).then(function() {
      var ent = getEntreprise();
      ent.subscription = subData;
      DB.set('mdb_entreprise', ent);
      toast('Licence activ\u00e9e avec succ\u00e8s ! Forfait ' + plan + (isReferral ? ' (\u00e0 vie)' : ''), 'success');
      if (currentPage === 'entreprise') renderEntreprise();
    });
  }).catch(function(e) {
    toast('Erreur : ' + e.message, 'error');
  });
}

function previewLogo(input) {
  if (!input.files || !input.files[0]) return;
  var file = input.files[0];
  if (file.size > 512000) { toast('Fichier trop volumineux (max 500 Ko)', 'error'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var existing = getEntreprise();
    existing.logo = e.target.result;
    DB.set('mdb_entreprise', existing);
    var preview = document.getElementById('logoPreview');
    if (preview) preview.innerHTML = '<img src="' + e.target.result + '" style="max-width:100%;max-height:100%;object-fit:contain">';
    toast('Logo enregistr\u00e9');
  };
  reader.readAsDataURL(file);
}

function removeLogo() {
  var existing = getEntreprise();
  existing.logo = '';
  DB.set('mdb_entreprise', existing);
  renderEntreprise();
  toast('Logo supprim\u00e9');
}

function showExtraitCompte(clientId) {
  var cl = getClientById(clientId);

  for (var i = 0; i < factures.length; i++) {
    var f = factures[i];

    var blRef = '';

      var allBls = getBLs();
      var blNums = [];
      for (var bi = 0; bi < allBls.length; bi++) { for (var bj = 0; bj < f.blIds.length; bj++) { if (allBls[bi].id === f.blIds[bj]) { blNums.push(allBls[bi].numero); break; } } }
      blRef = blNums.join(', ');
    } else if (f.blId) {
      var allBls3 = getBLs();

  html += '<th style="padding:8px;border:1px solid var(--gray-200);text-align:right">Solde</th>';

/* ===== CREANCE EN COURS (auto from unpaid invoices) ===== */
function renderCreance() {
  var factures = getFactures();
  var clients = getClients();
  var bls = getBLs();
  var reglements = getReglements();
  var clientMap = {};
  for (var i = 0; i < clients.length; i++) clientMap[clients[i].id] = clients[i];

  var clientCreances = {};
  for (var i = 0; i < factures.length; i++) {
    var f = factures[i];
    if (f.statut === 'payee') continue;
    var restant = (f.total || 0) - (f.montantPaye || 0);
    if (restant <= 0) continue;
    var cid = f.clientId;
    if (!clientCreances[cid]) clientCreances[cid] = {clientId: cid, client: clientMap[cid], factures: [], totalReste: 0};
    clientCreances[cid].factures.push({facture: f, restant: restant});
    clientCreances[cid].totalReste += restant;
  }

  var clientList = [];
  for (var cid in clientCreances) {
    if (clientCreances.hasOwnProperty(cid)) clientList.push(clientCreances[cid]);
  }
  clientList.sort(function(a, b) { return b.totalReste - a.totalReste; });

  var totalCreance = 0;
  for (var j = 0; j < clientList.length; j++) totalCreance += clientList[j].totalReste;

  var html = '<div class="stats-grid" data-sub="creance.stats">';
  html += '<div class="stat-card"><div class="stat-icon" style="background:var(--danger-light);color:var(--danger)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><div class="stat-info"><div class="stat-value">' + fmtMoney(totalCreance) + '</div><div class="stat-label">Total cr\u00e9ances</div></div></div>';
  html += '<div class="stat-card"><div class="stat-icon" style="background:var(--warning-light);color:var(--warning)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><div class="stat-info"><div class="stat-value">' + clientList.length + '</div><div class="stat-label">Clients \u00e0 recouvrer</div></div></div>';
  html += '</div>';

  html += '<div data-sub="creance.details">';
  for (var ci = 0; ci < clientList.length; ci++) {
    var item = clientList[ci];
    html += '<div class="section"><div class="section-header"><h3>' + escH(item.client ? item.client.nom : 'Inconnu') + '</h3><span class="badge badge-danger">' + fmtMoney(item.totalReste) + '</span></div><div class="table-responsive"><table><thead><tr><th>Facture</th><th>Date</th><th>\u00c9ch\u00e9ance</th><th style="text-align:right">Total</th><th style="text-align:right">Pay\u00e9</th><th style="text-align:right">Reste</th><th>Statut</th></tr></thead><tbody>';

      html += '<td class="text-right fw-600" style="color:var(--danger)">' + fmtMoney(restant) + '</td>';
      html += '<td>' + getStatusBadge(f2.statut) + '</td>';
      html += '</tr>';
      if (f2.blIds && f2.blIds.length > 0) {
        for (var bi = 0; bi < f2.blIds.length; bi++) {
          for (var bj = 0; bj < bls.length; bj++) {
            if (bls[bj].id === f2.blIds[bi] && bls[bj].lignes) {
              var bl = bls[bj];

              html += '<span style="font-size:11px;color:var(--gray-500)">BL ' + escH(bl.numero || '') + ' :</span> ';
              for (var lk = 0; lk < bl.lignes.length; lk++) {
                var ln = bl.lignes[lk];
                if (lk > 0) html += ' &middot; ';
                html += '<span style="font-size:11px">' + escH(ln.designation || ln.articleId || '') + ' \u00d7 ' + (ln.quantite || 0) + ' = ' + fmtMoney((ln.quantite || 0) * (ln.prixUnitaire || 0)) + '</span>';
              }
              html += '</td></tr>';
              break;
            }
          }
        }
      }
    }
    html += '</tbody></table></div></div>';
  }
  if (clientList.length === 0) {
    html += '<div class="section"><div class="section-body text-center text-muted" style="padding:40px">Aucune cr\u00e9ance en cours \u2014 tous les clients sont \u00e0 jour</div></div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function openDetteFournisseurModal(id) {
  var d = null;

  var html = '';
  html += '<div class="form-group"><label>Fournisseur *</label><select id="dfFournisseur"><option value="">-- S\u00e9lectionner --</option>';
  for (var i = 0; i < fournisseurs.length; i++) {
    var selected = (d && d.fournisseurId === fournisseurs[i].id) ? ' selected' : '';
    html += '<option value="' + fournisseurs[i].id + '"' + selected + '>' + escH(fournisseurs[i].nom) + '</option>';
  }
  html += '</select></div>';

}

function saveDetteFournisseur(id) {
  var fournisseurId = document.getElementById('dfFournisseur').value;
  var montant = parseFloat(document.getElementById('dfMontant').value) || 0;
  if (!fournisseurId || montant <= 0) { toast('Fournisseur et montant sont obligatoires', 'error'); return; }
  var frn = getFournisseurById(fournisseurId);
  var dettes = getDettesFournisseurs();
  if (id) {
    for (var i = 0; i < dettes.length; i++) {
      if (dettes[i].id === id) {
        dettes[i].fournisseurId = fournisseurId;
        dettes[i].fournisseur = frn ? frn.nom : '';
        dettes[i].description = document.getElementById('dfDesc').value.trim();
        dettes[i].date = document.getElementById('dfDate').value;
        dettes[i].montant = montant;
        break;
      }
    }
  } else {
    dettes.push({id:DB.genId(), fournisseurId:fournisseurId, fournisseur: frn ? frn.nom : '', description:document.getElementById('dfDesc').value.trim(), date:document.getElementById('dfDate').value, montant:montant});
  }
  DB.set('mdb_dettesFournisseurs', dettes);
  closeModal();
  toast('Dette fournisseur enregistr\u00e9e');
  renderFournisseurs();
}

function deleteDetteFournisseur(id) {
  if (!window.confirm('Supprimer cette dette fournisseur ?')) return;
  var dettes = getDettesFournisseurs(); var result = [];
  for (var i = 0; i < dettes.length; i++) { if (dettes[i].id !== id) result.push(dettes[i]); }
  DB.set('mdb_dettesFournisseurs', result);
  toast('Dette supprim\u00e9e');
  renderFournisseurs();
}

function renderFournDettes(el) {
  var dettes = getDettesFournisseurs();
  var fournisseurs = getFournisseurs();
  var ops = getOperationsCaisse();
  var total = 0;
  for (var i = 0; i < dettes.length; i++) total += dettes[i].montant || 0;
  var supplierMap = {};
  for (var i = 0; i < fournisseurs.length; i++) supplierMap[fournisseurs[i].id] = fournisseurs[i];
  var balances = {};
  for (var i = 0; i < dettes.length; i++) {
    var d = dettes[i];
    var fid = d.fournisseurId || '';
    if (!fid) continue;
    if (!balances[fid]) balances[fid] = {fournisseurId: fid, charge: 0, paye: 0};
    balances[fid].charge += d.montant || 0;
  }
  for (var i = 0; i < ops.length; i++) {
    var o = ops[i];
    if (o.beneficiaireType !== 'fournisseur' || !o.beneficiaireId) continue;
    if (!balances[o.beneficiaireId]) balances[o.beneficiaireId] = {fournisseurId: o.beneficiaireId, charge: 0, paye: 0};
    balances[o.beneficiaireId].charge += o.montantCharge || 0;
    balances[o.beneficiaireId].paye += o.montant || 0;
  }
  var html = '<div data-sub="fournisseurs.dettes">';
  html += '<div class="stats-grid">';
  html += '<div class="stat-card"><div class="stat-icon" style="background:var(--danger-light);color:var(--danger)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg></div><div class="stat-info"><div class="stat-value">' + fmtMoney(total) + '</div><div class="stat-label">Total dettes</div></div></div>';
  html += '<div class="stat-card"><div class="stat-icon" style="background:var(--warning-light);color:var(--warning)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div><div class="stat-info"><div class="stat-value">' + Object.keys(balances).length + '</div><div class="stat-label">Fournisseurs</div></div></div>';
  html += '</div>';
  html += '<div class="toolbar"><button class="btn btn-primary" onclick="openDetteFournisseurModal()">+ Nouvelle dette</button></div>';
  var hasAny = false;
  for (var fid in balances) {
    if (!balances.hasOwnProperty(fid)) continue;
    var b = balances[fid];
    var frn = supplierMap[fid];
    var reste = b.charge - b.paye;
    if (reste <= 0) continue;
    hasAny = true;
    html += '<div class="section"><div class="section-header"><h3>' + escH(frn ? frn.nom : 'Inconnu') + '</h3><span class="badge badge-danger">' + fmtMoney(reste) + '</span></div>';
    html += '<div class="table-responsive"><table><thead><tr><th>Type</th><th>Description</th><th>Date</th><th style="text-align:right">Montant</th><th style="width:80px">Actions</th></tr></thead><tbody>';
    var lignes = [];
    for (var di = 0; di < dettes.length; di++) {
      if (dettes[di].fournisseurId === fid) lignes.push({type: 'Dette', description: dettes[di].description || '-', date: dettes[di].date, montant: dettes[di].montant || 0, id: dettes[di].id});
    }
    for (var oi = 0; oi < ops.length; oi++) {
      var o = ops[oi];
      if (o.beneficiaireType !== 'fournisseur' || o.beneficiaireId !== fid) continue;
      if (o.montantCharge && o.montantCharge > 0) lignes.push({type: 'Charge (caisse)', description: o.libelle || '-', date: o.date, montant: o.montantCharge, id: null});
      lignes.push({type: 'Paiement (caisse)', description: o.libelle || '-', date: o.date, montant: o.montant || 0, id: null});
    }
    lignes.sort(function(a, b) { return (a.date || '').localeCompare(b.date || ''); });
    for (var li = 0; li < lignes.length; li++) {
      var l = lignes[li];
      var isPay = l.type.indexOf('Paiement') !== -1;
      html += '<tr>';
      html += '<td><span class="badge ' + (isPay ? 'badge-success' : 'badge-danger') + '">' + l.type + '</span></td>';
      html += '<td>' + escH(l.description) + '</td>';
      html += '<td>' + fmtDate(l.date) + '</td>';
      html += '<td class="text-right fw-600" style="color:' + (isPay ? 'var(--success)' : 'var(--danger)') + '">' + fmtMoney(l.montant) + '</td>';
      html += '<td>' + (l.id ? '<button class="btn-icon danger" onclick="deleteDetteFournisseur(\'' + l.id + '\')" title="Supprimer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>' : '-') + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table></div></div>';
  }
  if (!hasAny) html += '<div class="section"><div class="section-body text-center text-muted" style="padding:40px">Aucune dette fournisseur</div></div>';
  html += '</div>';
  el.innerHTML = html;
}

  var nom = document.getElementById('frNom').value.trim();
  if (!nom) { toast('Le nom est obligatoire', 'error'); return; }
  var fournisseurs = getFournisseurs();
  if (id) {
    for (var i = 0; i < fournisseurs.length; i++) {
      if (fournisseurs[i].id === id) {
        fournisseurs[i].nom = nom;
        fournisseurs[i].email = document.getElementById('frEmail').value.trim();
        fournisseurs[i].telephone = document.getElementById('frTel').value.trim();
        fournisseurs[i].adresse = document.getElementById('frAdresse').value.trim();
        break;
      }
    }
  } else {
    fournisseurs.push({id:DB.genId(), nom:nom, email:document.getElementById('frEmail').value.trim(), telephone:document.getElementById('frTel').value.trim(), adresse:document.getElementById('frAdresse').value.trim()});
  }
  DB.set('mdb_fournisseurs', fournisseurs);
  closeModal();
  toast('Fournisseur enregistr\u00e9');
  renderFournisseurs();
}

function deleteFournisseur(id) {
  if (!window.confirm('Supprimer ce fournisseur et toutes ses dettes ?')) return;

  for (var i = 0; i < fournisseurs.length; i++) { if (fournisseurs[i].id !== id) result.push(fournisseurs[i]); }

}

function renderBLAFacturer() {
  var bls = getBLs();
  var factures = getFactures();
  var clients = getClients();
  var clientMap = {};
  for (var i = 0; i < clients.length; i++) clientMap[clients[i].id] = clients[i];
  var invoicedBLIds = {};
  for (var i = 0; i < factures.length; i++) {
    var f = factures[i];
    if (f.blIds && Array.isArray(f.blIds)) {
      for (var j = 0; j < f.blIds.length; j++) invoicedBLIds[f.blIds[j]] = true;
    }
  }
  var unbilled = [];
  for (var i = 0; i < bls.length; i++) {
    if (!invoicedBLIds[bls[i].id]) unbilled.push(bls[i]);
  }
  var totalAmount = 0;
  for (var i = 0; i < unbilled.length; i++) {
    if (unbilled[i].lignes) {
      for (var j = 0; j < unbilled[i].lignes.length; j++) totalAmount += (unbilled[i].lignes[j].quantite || 0) * (unbilled[i].lignes[j].prixUnitaire || 0);

  html += '<div class="stat-card"><div class="stat-icon" style="background:var(--warning-light);color:var(--warning)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><rect x="1" y="3" width="15" height="13" rx="1"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/></svg></div><div class="stat-info"><div class="stat-value">' + unbilled.length + '</div><div class="stat-label">BL non factur\u00e9s</div></div></div>';

  html += '</div>';

  html += '<div data-sub="blAFacturer.listeBL">';
  if (unbilled.length > 0) {
    html += '<div style="margin-bottom:12px;padding:12px;background:var(--primary-light);border-radius:8px;display:flex;align-items:center;gap:12px">';
    html += '<label style="font-size:13px;font-weight:600;cursor:pointer"><input type="checkbox" id="selectAllBLs" onchange="toggleSelectAllBLs(this.checked)"> Tout s\u00e9lectionner</label>';
    html += '<button class="btn btn-sm btn-primary" onclick="factureFromSelectedBLs()" id="btnCreateFactureGroup">Cr\u00e9er facture group\u00e9e</button>';
    html += '</div>';
  }
  for (var bi = 0; bi < unbilled.length; bi++) {
    var bl = unbilled[bi];
    var cl = clientMap[bl.clientId];
    html += '<div class="section" style="border-left:3px solid var(--primary)"><div class="section-header"><div style="display:flex;align-items:center;gap:10px"><input type="checkbox" class="bl-select" value="' + bl.id + '" data-client="' + (bl.clientId || '') + '">';
    html += '<h3>' + escH(bl.numero || 'BL') + '</h3></div><div style="display:flex;align-items:center;gap:12px"><span style="font-size:13px;color:var(--gray-500)">' + escH(cl ? cl.nom : 'Client inconnu') + ' \u2014 ' + fmtDate(bl.dateLivraison || bl.date) + '</span>' + (bl.raisonNonFacture ? '<span style="font-size:12px;color:var(--warning);font-style:italic;margin-left:8px" title="Raison non factur\u00e9">' + escH(bl.raisonNonFacture) + '</span>' : '') + '<button class="btn btn-sm btn-primary" onclick="factureFromBL(\'' + bl.id + '\')">Cr\u00e9er facture</button></div></div><div class="table-responsive"><table><thead><tr><th>Article</th><th>D\u00e9signation</th><th style="text-align:right">Quantit\u00e9</th><th style="text-align:right">Prix unitaire</th><th style="text-align:right">Montant</th></tr></thead><tbody>';
    if (bl.lignes && bl.lignes.length > 0) {
      for (var lk = 0; lk < bl.lignes.length; lk++) {
        var ln = bl.lignes[lk];
        var montant = (ln.quantite || 0) * (ln.prixUnitaire || 0);
        html += '<tr><td>' + getArticleLabel(ln.articleId) + '</td><td class="fw-600">' + escH(ln.designation || '-') + '</td><td class="text-right">' + (ln.quantite || 0) + '</td><td class="text-right">' + fmtMoney(ln.prixUnitaire || 0) + '</td><td class="text-right fw-600">' + fmtMoney(montant) + '</td></tr>';
      }
    } else {
      html += '<tr><td colspan="5" class="text-center text-muted">Aucune ligne</td></tr>';
    }
    html += '</tbody></table></div></div>';
  }
  if (unbilled.length === 0) {
    html += '<div class="section"><div class="section-body text-center text-muted" style="padding:40px">Tous les BL sont factur\u00e9s</div></div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;

function factureFromSelectedBLs() {
  var cbs = document.querySelectorAll('.bl-select:checked');
  if (cbs.length === 0) { toast('Veuillez s\u00e9lectionner au moins un BL', 'error'); return; }
  var ids = [];
  var clientIds = {};
  for (var i = 0; i < cbs.length; i++) {
    ids.push(cbs[i].value);
    var cid = cbs[i].getAttribute('data-client');
    if (cid) clientIds[cid] = true;
  }
  var keys = [];
  for (var k in clientIds) { if (clientIds.hasOwnProperty(k)) keys.push(k); }
  if (keys.length > 1) { toast('Impossible : les BL s\u00e9lectionn\u00e9s sont sur des clients diff\u00e9rents', 'error'); return; }
  var bls = getBLs();
  var selectedBLs = [];
  for (var j = 0; j < ids.length; j++) {
    for (var m = 0; m < bls.length; m++) { if (bls[m].id === ids[j]) { selectedBLs.push(bls[m]); break; } }
  }
  var clientId = keys[0];
  var firstBC = selectedBLs[0] ? (selectedBLs[0].bcId || '') : '';
  var allLignes = [];
  for (var n = 0; n < selectedBLs.length; n++) {
    if (selectedBLs[n].lignes) {
      for (var p = 0; p < selectedBLs[n].lignes.length; p++) {
        var src = selectedBLs[n].lignes[p];
        allLignes.push({articleId:src.articleId||'', designation:src.designation||'', quantite:src.quantite||1, prixUnitaire:src.prixUnitaire||0, bcId:selectedBLs[n].bcId||'', blId:selectedBLs[n].id});
      }
    }
  }
  _prefillFactureData = {clientId: clientId, bcId: firstBC, lignes: allLignes};
  navigateToFacturation('factures');
  setTimeout(function() { openFactureModal(); }, 150);
}

function toggleSelectAllBLs(checked) {
  var cbs = document.querySelectorAll('.bl-select');
  for (var i = 0; i < cbs.length; i++) cbs[i].checked = checked;
}

function getSelectedBLIds() {
  var cbs = document.querySelectorAll('.bl-select:checked');
  var ids = [];
  for (var i = 0; i < cbs.length; i++) ids.push(cbs[i].value);
  return ids;
}

  var clientStats = {};

  }

    clientStats[cid2].paid += (reglements[i].montant || 0);

function filterTable(bodyId, searchId) {
  var q = (document.getElementById(searchId).value || '').toLowerCase();
  var rows = document.getElementById(bodyId).getElementsByTagName('tr');
  for (var i = 0; i < rows.length; i++) {
    rows[i].style.display = (rows[i].getAttribute('data-search') || '').indexOf(q) !== -1 ? '' : 'none';
  }
}

function openCaisseGestionModal(id) {
  var c = null;
  if (id) { var cs = getCaisses(); for (var i = 0; i < cs.length; i++) { if (cs[i].id === id) { c = cs[i]; break; } } }
  var title = c ? 'Modifier la caisse' : 'Nouvelle caisse';
  var employes = getEmployes();
  var html = '';
  html += '<div class="form-group"><label>Nom de la caisse *</label><input type="text" id="cgNom" value="' + escH(c ? c.nom : '') + '" placeholder="Ex: Caisse de Rosine"></div>';
  html += '<div class="form-group"><label>Agent assign\u00e9 *</label><select id="cgAgent"><option value="">-- Choisir un agent --</option>';
  for (var i = 0; i < employes.length; i++) {
    var sel = (c && c.agentId === employes[i].id) ? ' selected' : '';
    html += '<option value="' + employes[i].id + '"' + sel + '>' + escH(employes[i].nom) + ' (' + escH(employes[i].abreviation) + ')</option>';
  }
  html += '</select></div>';
  var footer = '<button class="btn btn-outline" onclick="closeModal()">Annuler</button>';
  footer += '<button class="btn btn-primary" onclick="saveCaisseGestion(\'' + (id || '') + '\')">Enregistrer</button>';
  openFormModal(title, html, footer);
}

function saveCaisseGestion(id) {
  var nom = document.getElementById('cgNom').value.trim();
  var agentId = document.getElementById('cgAgent').value;
  if (!nom || !agentId) { toast('Nom et agent sont obligatoires', 'error'); return; }
  var agentNom = '';
  var employes = getEmployes();
  for (var i = 0; i < employes.length; i++) { if (employes[i].id === agentId) { agentNom = employes[i].nom; break; } }
  var caisses = getCaisses();
  if (id) {

function reverserCaisse(caisseId) {
  if (!window.confirm('Reverser toutes les op\u00e9rations non revers\u00e9es de cette caisse dans la caisse g\u00e9n\u00e9rale ?')) return;
  var ops = getOperationsCaisse();
  var now = new Date();
  var heureRevers = (now.getHours() < 10 ? '0' : '') + now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
  var count = 0;
  for (var i = 0; i < ops.length; i++) {
    if (ops[i].caisseId === caisseId && !ops[i].reversed) {
      ops[i].reversed = true;
      ops[i].reverseDate = getToday();
      ops[i].reverseHeure = heureRevers;
      count++;
    }
  }
  DB.set('mdb_operationsCaisse', ops);
  toast(count + ' op\u00e9ration(s) revers\u00e9e(s) dans la caisse g\u00e9n\u00e9rale');
  renderCaissesIn(document.getElementById('tresorerieContent'));
}

function saveCaisse(id) {
  var date = document.getElementById('csDate').value;
  var heure = document.getElementById('csHeure') ? document.getElementById('csHeure').value : '';
  var codeId = document.getElementById('csCode').value;
  var libelle = document.getElementById('csLibelle').value.trim();
  var montant = parseFloat(document.getElementById('csMontant').value) || 0;
  var sens = document.getElementById('csSens').value;
  var moyenPaiement = document.getElementById('csMoyen').value;
  var numeroTransaction = document.getElementById('csTrans') ? document.getElementById('csTrans').value.trim() : '';
  var typeOp = document.getElementById('csType').value;
  var beneficiaireVal = document.getElementById('csBeneficiaire') ? document.getElementById('csBeneficiaire').value : '';
  var tiers = document.getElementById('csTiers').value.trim();
  var caisseId = document.getElementById('csCaisseId') ? document.getElementById('csCaisseId').value : '';
  if (!currentUser.isAdmin && currentUser.caisseId && caisseId !== currentUser.caisseId) { toast('Vous ne pouvez enregistrer que dans votre caisse', 'error'); return; }
  if (!date || !codeId || !libelle || montant <= 0) { toast('Date, code, libell\u00e9 et montant sont obligatoires', 'error'); return; }
  if (moyenPaiement && moyenPaiement !== 'Esp\u00e8ce' && !numeroTransaction) { toast('Le num\u00e9ro de transaction est obligatoire pour ' + moyenPaiement, 'error'); return; }
  var beneficiaireType = typeOp;
  var beneficiaireId = '';
  var beneficiaireNom = '';
  if (beneficiaireVal.indexOf('emp_') === 0) {
    beneficiaireId = beneficiaireVal.substring(4);
    beneficiaireType = 'employe';
    var empList = getEmployes();
    for (var ei = 0; ei < empList.length; ei++) { if (empList[ei].id === beneficiaireId) { beneficiaireNom = empList[ei].nom; break; } }
  } else if (beneficiaireVal.indexOf('frn_') === 0) {
    beneficiaireId = beneficiaireVal.substring(4);
    beneficiaireType = 'fournisseur';
    var frnList = getFournisseurs();
    for (var fi = 0; fi < frnList.length; fi++) { if (frnList[fi].id === beneficiaireId) { beneficiaireNom = frnList[fi].nom; break; } }
  }
  var montantChargeEl = document.getElementById('csMontantCharge');
  var montantCharge = montantChargeEl ? parseFloat(montantChargeEl.value) || 0 : 0;
  if (beneficiaireType === 'fournisseur' && montantCharge > 0 && montant > montantCharge) {
    toast('Le montant pay\u00e9 ne peut pas d\u00e9passer le montant global de la charge', 'error');
    return;
  }
  var ops = getOperationsCaisse();
  if (id) {
    for (var i = 0; i < ops.length; i++) { if (ops[i].id === id) {
      ops[i].date = date; ops[i].heure = heure; ops[i].codeId = codeId; ops[i].libelle = libelle; ops[i].montant = montant; ops[i].sens = sens;
      ops[i].moyenPaiement = moyenPaiement; ops[i].numeroTransaction = numeroTransaction;
      ops[i].beneficiaireType = beneficiaireType; ops[i].beneficiaireId = beneficiaireId; ops[i].beneficiaireNom = beneficiaireNom; ops[i].tiers = tiers;
      ops[i].montantCharge = beneficiaireType === 'fournisseur' ? montantCharge : 0;
      ops[i].caisseId = caisseId;
      break;
    } }
  } else { ops.push({id:DB.genId(), date:date, heure:heure, codeId:codeId, libelle:libelle, montant:montant, sens:sens, moyenPaiement:moyenPaiement, numeroTransaction:numeroTransaction, beneficiaireType:beneficiaireType, beneficiaireId:beneficiaireId, beneficiaireNom:beneficiaireNom, tiers:tiers, imprime:false, montantCharge: beneficiaireType === 'fournisseur' ? montantCharge : 0, caisseId:caisseId, reversed:false}); }
  DB.set('mdb_operationsCaisse', ops);
  closeModal(); toast('Op\u00e9ration enregistr\u00e9e'); renderTresorerie();
}

  var ops = getOperationsCaisse();

function printCaisse(id) {
  var ops = getOperationsCaisse();

  var codeLabel = '';

  var ent = getEntreprise();

  html += header;

  html += '</body></html>';
  var w = window.open('','_blank','width=800,height=600');
  w.document.write(html); w.document.close(); w.print();

  renderTresorerie();
}
